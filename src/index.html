<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>LuxuryApp — Gestión Integral</title>
    <meta
      name="description"
      content="Plataforma de gestión inmobiliaria para administración de edificios, mantenimiento, tickets y reportes financieros."
    />
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no"
    />

    <!-- 🔒 Content Security Policy -->

    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self';
    script-src 'self' https://cdn.onesignal.com https://api.onesignal.com https://*.firebaseio.com https://*.googleapis.com https://cdn.jsdelivr.net https://viewer.diagrams.net 'unsafe-inline' 'unsafe-eval';
    style-src 'self' https://fonts.googleapis.com https://onesignal.com 'unsafe-inline';
    font-src 'self' https://fonts.gstatic.com data:;
    img-src 'self' https: http://localhost:* data: blob:;
    media-src 'self' blob:;
    connect-src 'self' https://localhost:* http://localhost:* ws://localhost:* https://luxurybuildingapp.com https://*.firebaseio.com https://*.googleapis.com https://*.onesignal.com https://*.devtunnels.ms wss://localhost:* wss://luxurybuildingapp.com wss://*.devtunnels.ms blob: https://viewer.diagrams.net https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com;
    frame-src 'self' https://localhost:* http://localhost:* https://luxurybuildingapp.com https://*.firebaseapp.com https://calendar.google.com https://embed.diagrams.net https://viewer.diagrams.net https://*.brevo.com https://www.youtube.com https://youtube.com https://youtu.be;
    worker-src 'self' blob: https://cdn.jsdelivr.net;
    manifest-src 'self';
  "
    />
    <!-- Prevenir gestos de navegación en iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link
      rel="shortcut icon"
      href="assets/images/favicon.png"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <!-- Corporate Integrity System — Outfit (system font) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=EB+Garamond:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=EB+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- animate.css se carga desde npm via angular.json (v4.x) -->
    <!-- Bootstrap Icons eliminado: no se usa en la app, se usa PrimeIcons -->
    <script
      src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
      defer=""
    ></script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b3164" />
  </head>

  <body>
    <!-- 🔗 Skip-to-content: WCAG 2.4.1 — Permite saltar la navegación con Tab -->
    <a href="#app-root-outlet" class="skip-link" style="position: absolute; top: -9999px; left: -9999px;">Saltar al contenido principal</a>
    
    <app-root aria-label="Aplicación LuxuryApp">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; background-color: #f8fafc; font-family: 'Outfit', system-ui, sans-serif;">
        <img src="assets/images/logo.png" alt="LuxuryApp" style="width: 140px; margin-bottom: 2rem; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;" onerror="this.style.display='none'">
        <div style="width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #0b3164; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
          @keyframes pulse { 50% { opacity: .5; transform: scale(0.95); } }
        </style>
      </div>
    </app-root>

    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
