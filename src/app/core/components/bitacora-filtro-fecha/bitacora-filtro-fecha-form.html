<p-card>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <p class="text-600 text-sm m-0 mb-3">
      Selecciona el rango de fechas para el reporte PDF.
    </p>
    <custom-input-date-signal label="Desde" [control]="form.controls.from" [required]="true" />
    <custom-input-date-signal label="Hasta" [control]="form.controls.to" [required]="true" />
    <custom-button-save label="Generar PDF" [submitting]="submitting()" />
  </form>
</p-card>
