<div class="flex flex-column w-full overflow-hidden" style="min-height: 600px; height: 100%;">
  <div class="flex-grow-1 overflow-auto p-2 surface-ground flex flex-column">
    @if (pdfSrc()) {
    <pdf-viewer
      [src]="pdfSrc()"
      [render-text]="false"
      [original-size]="false"
      [show-all]="true"
      [fit-to-page]="true"
      [autoresize]="true"
      style="width: 100%; height: 100%; min-height: 600px; display: block;"
    ></pdf-viewer>
    } @else {
    <div class="flex flex-column align-items-center justify-content-center h-full gap-3">
      <p-progressSpinner />
      <span class="text-600 font-medium">Cargando documento...</span>
    </div>
    }
  </div>
</div>
