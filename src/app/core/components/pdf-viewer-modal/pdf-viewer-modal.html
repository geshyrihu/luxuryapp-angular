<div class="flex flex-column h-full w-full overflow-hidden" style="min-height: 85vh;">
  <div class="flex-grow-1 overflow-auto p-2 surface-ground flex flex-column">
    @if (pdfSrc()) {
    <pdf-viewer
      [src]="pdfSrc()"
      [render-text]="false"
      [original-size]="false"
      [show-all]="true"
      [fit-to-page]="true"
      [autoresize]="true"
      style="width: 100%; height: 100%; min-height: 700px; display: block;"
    ></pdf-viewer>
    } @else {
    <div class="flex flex-column align-items-center justify-content-center h-full gap-3">
      <p-progressSpinner />
      <span class="text-600 font-medium">Cargando documento...</span>
    </div>
    }
  </div>

  <div class="flex justify-content-end gap-2 p-3 border-top-1 surface-border bg-white">
    <p-button
      label="Descargar"
      [disabled]="!pdfSrc()"
      (onClick)="downloadPdf()"
    >
      <app-icon icon="mdi:download" class="mr-2" />
    </p-button>
    <p-button
      label="Cerrar"
      (onClick)="downloadPdf()"
      styleClass="p-button-text"
    >
      <app-icon icon="mdi:close" class="mr-2" />
    </p-button>
  </div>
</div>
