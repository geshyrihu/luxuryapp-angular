<div class="ion-app-shell">
  <ion-app>
    <div class="ion-page" style="position: relative; height: 100%; display: flex; flex-direction: column;">
      <ion-header class="ion-no-border committee-mobile-header">
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="onBack()">
              <ion-icon name="chevron-back" slot="icon-only"></ion-icon>
            </ion-button>
          </ion-buttons>

          <div class="committee-mobile-header__title">
            <app-customer-header-data-committee />
          </div>

          <ion-buttons slot="end">
            <app-profile-committee-desktop [compact]="true" />
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content
        [scrollY]="true"
        [fullscreen]="true"
        class="flex-flex-grow-1-1 relative committee-mobile-content"
      >
        <div
          class="page-body-wrapper"
          style="height: 100%; display: flex; flex-direction: column;"
          [class.scorlled]="hideScroolNavService.headerFixed == true"
        >
          <div style="padding: 12px 8px 16px 8px; flex: 1; height: 100%; display: flex; flex-direction: column;">
            <router-outlet />
          </div>
        </div>
        <lx-loader />
      </ion-content>

      <ion-footer class="ion-no-border committee-mobile-footer app-footer-floating">
        <app-committee-mobile-nav />
      </ion-footer>
    </div>
  </ion-app>
</div>
