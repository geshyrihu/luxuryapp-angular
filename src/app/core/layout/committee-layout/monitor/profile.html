<div class="committee-profile" [class.committee-profile--compact]="compact()">
  <div
    class="committee-profile__trigger"
    (click)="profilePopover.toggle($event)"
  >
    <img
      class="committee-profile__avatar"
      [src]="profileImageUrl() || defaultAvatar"
      (error)="onImgError($event)"
      alt="Perfil"
    />
    @if (!compact()) {
    <span class="committee-profile__info">
      <span class="committee-profile__name">
        {{ infoAccountAuthDTO?.firstName }} {{ infoAccountAuthDTO?.lastName }}
      </span>
      <span class="committee-profile__position">
        {{ infoAccountAuthDTO?.position }}
      </span>
    </span>
    }
    <app-icon icon="material-symbols-light:keyboard-arrow-down" class="committee-profile__caret" />
  </div>

  <p-popover #profilePopover appendTo="body">
    <div class="profile-popup-menu">
      @if (cb_customer.length > 1) {
      <div class="committee-profile__customer-select">
        <label class="committee-profile__customer-label">Cliente</label>
        <select
          class="committee-profile__customer-input"
          [value]="customerId()"
          (change)="selectCustomer($any($event.target).value)"
        >
          @for (customer of cb_customer; track customer.value) {
          <option [value]="customer.value">{{ customer.label }}</option>
          }
        </select>
      </div>
      } @else {
      <div class="committee-profile__customer">{{ customerName() }}</div>
      }

      <button
        class="profile-popup-item"
        (click)="goToProfile(); profilePopover.hide()"
      >
        <app-icon icon="material-symbols-light:person" />
        <span>Perfil</span>
      </button>

      @if (updateService.isUpdateAvailable()) {
      <button
        class="profile-popup-item"
        (click)="onUpdateClick(); profilePopover.hide()"
      >
        <app-icon icon="material-symbols-light:sync" />
        <span>Actualizar</span>
      </button>
      }

      <button class="profile-popup-item" (click)="onForceReload()">
        <app-icon icon="material-symbols-light:refresh" />
        <span>Recargar app</span>
      </button>

      <button
        class="profile-popup-item"
        (click)="openAdminSite(); profilePopover.hide()"
      >
        <app-icon icon="material-symbols-light:open-in-new" />
        <span>Más de mi administración</span>
      </button>

      <div class="profile-popup-separator"></div>

      <button
        class="profile-popup-item profile-popup-item--danger"
        (click)="logout(); profilePopover.hide()"
      >
        <app-icon icon="material-symbols-light:logout" />
        <span>Cerrar sesión</span>
      </button>
    </div>
  </p-popover>
</div>
