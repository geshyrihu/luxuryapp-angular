<p-toolbar styleClass="direccion-header-toolbar w-full p-0 m-0">
  <ng-template #start>
    <div class="flex align-items-center gap-2 px-3">
      <!-- Mismo motivo que en header-employee-monitor: el `icon` de un MenuItem
           lo pinta PrimeNG como clase CSS, no como identificador de Iconify. -->
      <p-breadcrumb [model]="breadcrumbItems">
        <ng-template #item let-item>
          <a
            class="p-breadcrumb-item-link"
            [routerLink]="item.routerLink"
            [attr.aria-label]="item.label || 'Inicio'"
          >
            @if (item.icon) {
              <app-icon [icon]="item.icon" class="p-breadcrumb-item-icon" />
            }
            @if (item.label) {
              <span class="p-breadcrumb-item-label">{{ item.label }}</span>
            }
          </a>
        </ng-template>
      </p-breadcrumb>
    </div>
  </ng-template>

  <ng-template #center>
    <div class="flex align-items-center gap-2 px-3" style="min-width: 350px">
      @if (cb_customer.length > 1) {
        <p-select
          [options]="cb_customer"
          [ngModel]="customerId()"
          (onChange)="selectCustomer($event.value)"
          optionValue="value"
          optionLabel="label"
          styleClass="w-full"
          [filter]="cb_customer.length > 10"
          fluid
          size="small"
        >
          <ng-template #selectedItem let-opt>
            @if (opt) {
              <div class="flex align-items-center gap-2">
                <img [src]="opt.image" style="width: 20px; height: 20px; object-fit: contain" />
                <span class="font-medium">{{ opt.label }}</span>
              </div>
            }
          </ng-template>
          <ng-template let-c #item>
            <div class="flex align-items-center gap-2">
              <img [src]="c.image" style="width: 24px; height: 24px; object-fit: contain" />
              <span>{{ c.label }}</span>
            </div>
          </ng-template>
        </p-select>
      } @else {
        <div class="flex align-items-center gap-3">
          <img [src]="customerPhotoPath()" style="width: 38px; height: 38px; object-fit: contain" />
          <span class="font-bold text-xl">{{ customerName() }}</span>
        </div>
      }
    </div>
  </ng-template>

  <ng-template #end>
    <div class="flex align-items-center gap-1 px-3">
      <iw-button
        (clicked)="onBack()"
        icon="material-symbols-light:chevron-left"
        variant="text"
        severity="secondary"
        lxTooltip="Atras"
        tooltipPosition="bottom"
        size="sm"
      />
      <iw-button
        (clicked)="onForward()"
        icon="material-symbols-light:chevron-right"
        variant="text"
        severity="secondary"
        lxTooltip="Adelante"
        tooltipPosition="bottom"
        size="sm"
      />
      <iw-button
        (clicked)="onHome()"
        icon="material-symbols-light:home"
        variant="text"
        severity="secondary"
        lxTooltip="Inicio"
        tooltipPosition="bottom"
        size="sm"
      />
      <iw-button
        (clicked)="toggleTheme()"
        [icon]="getThemeIcon()"
        variant="text"
        severity="secondary"
        lxTooltip="Cambiar Tema"
        tooltipPosition="bottom"
        size="sm"
      />
      <app-profile-monitor />
    </div>
  </ng-template>
</p-toolbar>
