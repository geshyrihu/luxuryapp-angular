<app-toolbar
  styleClass="direccion-header-toolbar w-100 p-0 m-0"
  [leftTemplate]="left"
  [centerTemplate]="center"
  [rightTemplate]="right"
></app-toolbar>

<ng-template #left>
  <div class="d-flex align-items-center gap-2 px-3">
    <app-breadcrumbs [items]="breadcrumbItems" />
  </div>
</ng-template>

<ng-template #center>
  <div class="d-flex align-items-center gap-2 px-3" style="min-width: 350px">
    @if (cb_customer.length > 1) {
      <p-select
        [options]="cb_customer"
        [ngModel]="customerId()"
        (onChange)="selectCustomer($event.value)"
        optionValue="value"
        optionLabel="label"
        styleClass="w-full"
        [filter]="cb_customer.length > 10"
        fluid
        size="small"
      >
        <ng-template #selectedItem let-opt>
          @if (opt) {
            <div class="d-flex align-items-center gap-2">
              <img [src]="opt.image" style="width: 20px; height: 20px; object-fit: contain" />
              <span class="fw-medium">{{ opt.label }}</span>
            </div>
          }
        </ng-template>
        <ng-template let-c #item>
          <div class="d-flex align-items-center gap-2">
            <img [src]="c.image" style="width: 24px; height: 24px; object-fit: contain" />
            <span>{{ c.label }}</span>
          </div>
        </ng-template>
      </p-select>
    } @else {
      <div class="d-flex align-items-center gap-3">
        <img [src]="customerPhotoPath()" style="width: 38px; height: 38px; object-fit: contain" />
        <span class="fw-bold text-xl">{{ customerName() }}</span>
      </div>
    }
  </div>
</ng-template>

<ng-template #right>
  <div class="d-flex align-items-center gap-1 px-3">
    <iw-button
      (clicked)="onBack()"
      icon="material-symbols-light:chevron-left"
      variant="text"
      severity="secondary"
      lxTooltip="Atras"
      tooltipPosition="bottom"
      size="sm"
    />
    <iw-button
      (clicked)="onForward()"
      icon="material-symbols-light:chevron-right"
      variant="text"
      severity="secondary"
      lxTooltip="Adelante"
      tooltipPosition="bottom"
      size="sm"
    />
    <iw-button
      (clicked)="onHome()"
      icon="material-symbols-light:home"
      variant="text"
      severity="secondary"
      lxTooltip="Inicio"
      tooltipPosition="bottom"
      size="sm"
    />
    <iw-button
      (clicked)="toggleTheme()"
      [icon]="getThemeIcon()"
      variant="text"
      severity="secondary"
      lxTooltip="Cambiar Tema"
      tooltipPosition="bottom"
      size="sm"
    />
    <app-profile-desktop />
  </div>
</ng-template>
