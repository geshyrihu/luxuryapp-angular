<app-toolbar
  styleClass="direccion-header-toolbar w-100 p-0 m-0"
  [leftTemplate]="left"
  [centerTemplate]="center"
  [rightTemplate]="right"
></app-toolbar>

<ng-template #left>
  <div class="d-flex align-items-center gap-2 px-3">
    <app-breadcrumbs [items]="breadcrumbItems" />
  </div>
</ng-template>

<ng-template #center>
  <div class="d-flex align-items-center gap-2 px-3" style="min-width: 350px">
    @if (cb_customer.length > 1) {
      <custom-input-select-signal
        [data]="cb_customer"
        [ngModel]="customerId()"
        (ngModelChange)="selectCustomer($event)"
        optionValue="value"
        optionLabel="label"
        [filter]="cb_customer.length > 10"
        [onlyInput]="true"
        class="w-100"
      />
    } @else {
      <div class="d-flex align-items-center gap-3">
        <img [src]="customerPhotoPath()" style="width: 38px; height: 38px; object-fit: contain" />
        <span class="fw-bold text-xl">{{ customerName() }}</span>
      </div>
    }
  </div>
</ng-template>

<ng-template #right>
  <div class="d-flex align-items-center gap-1 px-3">
    <iw-button
      (clicked)="onBack()"
      icon="material-symbols-light:chevron-left"
      variant="text"
      severity="secondary"
      lxTooltip="Atras"
      tooltipPosition="bottom"
      size="sm"
    />
    <iw-button
      (clicked)="onForward()"
      icon="material-symbols-light:chevron-right"
      variant="text"
      severity="secondary"
      lxTooltip="Adelante"
      tooltipPosition="bottom"
      size="sm"
    />
    <iw-button
      (clicked)="onHome()"
      icon="material-symbols-light:home"
      variant="text"
      severity="secondary"
      lxTooltip="Inicio"
      tooltipPosition="bottom"
      size="sm"
    />
    <iw-button
      (clicked)="toggleTheme()"
      [icon]="getThemeIcon()"
      variant="text"
      severity="secondary"
      lxTooltip="Cambiar Tema"
      tooltipPosition="bottom"
      size="sm"
    />
    <app-profile-desktop />
  </div>
</ng-template>
