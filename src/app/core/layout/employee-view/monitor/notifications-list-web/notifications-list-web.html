<div class="p-4">
  <div class="card">
    <div class="card-header">
      <div class="flex align-items-center justify-content-between px-4 pt-4">
        <span class="text-xl font-bold">Notificaciones</span>
        <iw-button
          icon="material-symbols-light:refresh"
          variant="text"
          severity="secondary"
          lxTooltip="Recargar"
          (clicked)="onLoadNotification()"
          [loading]="loading()"
        />
      </div>
    </div>

    <p-scrollpanel [style]="{ width: '100%', height: 'calc(100vh - 220px)' }">
      <div class="list-none p-0 m-0">
        @for (notification of notifications(); track notification.id) {
        <div
          class="flex align-items-start p-3 gap-3 cursor-pointer border-bottom-1 surface-border"
          [class.surface-50]="!notification.isRead"
          (click)="markAsRead(notification.id, notification.url)"
        >
          <app-icon
            icon="material-symbols-light:notifications"
            class="text-xl mt-1"
            [class.text-primary]="!notification.isRead"
            [class.text-color-secondary]="notification.isRead"
          />
          <div class="flex-flex-grow-1-1">
            <p class="m-0" [class.font-bold]="!notification.isRead">
              {{ notification.title }}
            </p>
            <p class="m-0 text-color-secondary text-sm">
              {{ notification.message }}
            </p>
            <p class="m-0 text-color-secondary text-xs mt-1">
              {{ notification.createdAt }}
            </p>
          </div>
          @if (!notification.isRead) {
          <span class="flex-shrink-0">
            <p-badge severity="danger" />
          </span>
          }
        </div>
        } @empty {
        <div
          class="flex flex-column align-items-center justify-content-center text-center gap-3"
          style="height: 300px"
        >
          <app-icon icon="material-symbols-light:move-to-inbox" class="text-4xl text-color-secondary" />
          <span class="text-color-secondary">No tienes notificaciones.</span>
        </div>
        }
      </div>
    </p-scrollpanel>
  </div>
</div>
