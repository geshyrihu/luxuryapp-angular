<lux-popover-web #profilePopover>

  <!-- Trigger: avatar + chevron -->
  <div
    appPopoverTrigger
    class="d-flex align-items-center cursor-pointer p-1 rounded-lg hover:bg-white-alpha-10 transition-colors"
    role="button"
    aria-haspopup="menu"
    aria-label="Abrir menú de usuario"
  >
    <lux-avatar-web
      [image]="profileImageUrl || 'assets/images/default-avatar.png'"
      class="me-2"
      shape="square"
      size="large"
      styleClass="rounded-lg shadow-sm"
    />
    <lux-icon icon="material-symbols-light:keyboard-arrow-down" class="text-white opacity-60" />
  </div>

  <div class="profile-popup-menu">
    <button
      class="profile-popup-item"
      (click)="navigateToProfile(); profilePopover.hide()"
    >
      <lux-icon icon="material-symbols-light:key" />
      <span>Cambiar contraseña</span>
    </button>

    <button
      class="profile-popup-item"
      (click)="navigateToPasswordManager(); profilePopover.hide()"
    >
      <lux-icon icon="material-symbols-light:lock" />
      <span>Credenciales de servicios</span>
    </button>

    @if (updateService.isUpdateAvailable()) {
    <button
      class="profile-popup-item"
      (click)="onUpdateClick(); profilePopover.hide()"
    >
      <lux-icon icon="material-symbols-light:sync" />
      <span>Actualizar Aplicación</span>
    </button>
    }

    <div class="profile-popup-separator"></div>

    <button
      class="profile-popup-item profile-popup-item--danger"
      (click)="logOut()"
    >
      <lux-icon icon="material-symbols-light:logout" />
      <span>Cerrar sesión</span>
    </button>

  </div>
</lux-popover-web>
