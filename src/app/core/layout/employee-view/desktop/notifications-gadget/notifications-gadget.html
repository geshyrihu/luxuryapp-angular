<div class="dropdown d-inline-block" ngbDropdown container="body">
  <button
    type="button"
    class="btn-sm btn-soft-secondary hide-caret"
    lxTooltip="Notificaciones"
    tooltipPosition="bottom"
    aria-label="Notificaciones"
    id="page-header-notifications-dropdown"
    ngbDropdownToggle
  >
    <span class="notifications-badge-anchor">
      <app-icon
        icon="material-symbols-light:notifications-outline"
        class="notifications-bell-icon"
      />
      @if (messageInNotRead() > 0) {
      <app-badge [value]="messageInNotRead()" color="danger" size="small" />
      }
    </span>
  </button>
  
  <div
    class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0 shadow-lg border-0"
    aria-labelledby="page-header-notifications-dropdown"
    ngbDropdownMenu
  >
    <div class="p-3">
      <div class="row align-items-center">
        <div class="col">
          <h6 class="m-0 fw-semibold text-sm">Notificaciones</h6>
        </div>
      </div>
    </div>
    
    <div class="overflow-y-auto" style="max-height: 350px;">
      @for (notification of notifications(); track notification.id) {
        <a 
          href="javascript:void(0);" 
          class="dropdown-item notification-item text-wrap border-bottom p-3"
          (click)="markAsRead(notification.id, notification.url)"
          [class.bg-body-tertiary]="!notification.isRead"
        >
          <div class="d-flex align-items-start gap-2">
            <app-icon
              icon="material-symbols-light:notifications-outline"
              class="text-lg text-primary mt-1"
            />
            <div class="flex-grow-1">
              <p class="mb-1 text-sm" [class.fw-bold]="!notification.isRead" [class.fw-medium]="notification.isRead">{{ notification.title }}</p>
              <p class="mb-0 text-xs text-muted">{{ notification.message }}</p>
            </div>
            <div class="flex-shrink-0" (click)="$event.stopPropagation(); deleteNotification(notification.id)">
              <iw-button-delete lxTooltip="Eliminar notificación" />
            </div>
          </div>
        </a>
      } @empty {
        <div class="text-center p-4">
          <app-icon
            icon="material-symbols-light:move-to-inbox"
            class="text-4xl text-body-secondary mb-2"
          />
          <p class="text-body-secondary mb-0">No tienes notificaciones nuevas.</p>
        </div>
      }
    </div>
    
    <div class="p-2 border-top d-grid">
      <a class="btn btn-sm btn-link font-size-14 text-center text-decoration-none" href="javascript:void(0)" (click)="irATodasLasNotificaciones()">
        <span>Ver todas las notificaciones</span>
      </a>
    </div>
  </div>
</div>
