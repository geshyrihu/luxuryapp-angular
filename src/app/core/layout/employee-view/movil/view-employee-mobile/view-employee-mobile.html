<ion-app>
  <!-- Side Menu -->
  <ion-menu side="start" menuId="employee-mobile-menu" contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menú</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <app-home-menu-mobile (onCloseMenu)="closeMenu()"></app-home-menu-mobile>
    </ion-content>
  </ion-menu>

  <!-- Main Content -->
  <div id="main-content" class="ion-page h-full flex flex-column">
    <!-- Header fijo -->
    <ion-header class="ion-no-border">
      <ion-toolbar class="ion-no-padding">
        <app-header-mobile />
      </ion-toolbar>
    </ion-header>

    <!-- área de contenido con scroll nativo Ionic -->
    <ion-content
      [scrollY]="true"
      [fullscreen]="true"
      class="flex-flex-grow-1-1 relative"
    >
      <div
        class="page-body-wrapper"
        [class.scorlled]="hideScroolNavService.headerFixed == true"
      >
        <div class="pb-8">
          <!-- pb-8 para dar espacio al footer -->
          <router-outlet />
        </div>
      </div>
      <lx-loader />
    </ion-content>

    <!-- Footer fijo (fuera del scroll) -->
    <footer class="footer">
      <app-footer-employee-mobile />
    </footer>

    <!-- Panic Button FAB (flotante, accesible con el pulgar) -->
    <div class="panic-fab">
      <app-panic-button variant="mobile" class="mobile" />
    </div>
  </div>
</ion-app>
