<div class="ion-app-shell">
  <ion-app>
    <!-- Side Menu -->
    <ion-menu
      side="start"
      menuId="employee-mobile-menu"
      contentId="main-content"
    >
      <ion-header>
        <ion-toolbar>
          <ion-title>Menú</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <lux-home-menu-mobile-web
          (onCloseMenu)="closeMenu()"
        ></lux-home-menu-mobile-web>
      </ion-content>
    </ion-menu>

    <!-- Main Content -->
    <div
      id="main-content"
      class="ion-page"
      style="height: 100%; display: flex; flex-direction: column"
    >
      <!-- Header fijo -->
      <ion-header class="ion-no-border">
        <lux-header-mobile-web />
      </ion-header>

      <!-- área de contenido con scroll nativo Ionic -->
      <ion-content
        [scrollY]="true"
        [fullscreen]="true"
        class="employee-mobile-content flex-flex-grow-1-1 relative"
      >
        <div
          class="page-body-wrapper"
          [class.scorlled]="hideScroolNavService.headerFixed == true"
        >
          <div class="pb-8">
            <!-- pb-8 para dar espacio al footer -->
            <router-outlet />
          </div>
        </div>
        <lux-loader />
      </ion-content>

      <!-- Footer fijo (fuera del scroll) -->
      <ion-footer class="ion-no-border app-footer-floating">
        <lux-footer-employee-mobile-web />
      </ion-footer>
    </div>
  </ion-app>
</div>
