@if (footerItems().length > 0) {
<ion-tab-bar class="employee-mobile-tab-bar shadow-sm border-0">
  @for (item of footerItems(); track item.label) {
  <ion-tab-button
    class="employee-mobile-tab-button"
    [routerLink]="item.link || []"
    (click)="item.action ? item.action() : null"
    [selected]="item.link ? isActive(item.link!) : false"
  >
    <ion-icon [name]="item.icon" class="employee-mobile-tab-icon"></ion-icon>

    <ion-label class="employee-mobile-tab-label">{{ item.label }}</ion-label>

    @if (item.showNotification && messageInNotRead() > 0) {
      <ion-badge color="danger">{{ messageInNotRead() }}</ion-badge>
    }
  </ion-tab-button>
  }
</ion-tab-bar>
}
