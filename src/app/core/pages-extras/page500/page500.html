<div
  class="min-h-screen surface-ground flex align-items-center justify-content-center p-5"
>
  <div
    class="surface-card rounded shadow p-5 w-full"
    style="max-width: 900px"
  >
    <div class="text-center mb-5">
      <div class="mb-4">
        <span class="text-900 font-black text-9xl">5</span>
        <app-icon [icon]="'material-symbols-light:dns'" class="pi text-primary text-8xl mx-3" />
        <span class="text-900 font-black text-9xl">0</span>
        <app-icon [icon]="'material-symbols-light:warning'" class="pi text-primary text-8xl mx-3" />
        <span class="text-900 font-black text-9xl">0</span>
      </div>

      <h1 class="text-6xl font-bold text-900 mb-3">
        ¡Ups! Error Interno del Servidor
      </h1>

      <p class="text-500 text-xl mb-5 line-height-3">
        Algo salió mal en nuestro servidor. Estamos trabajando para
        solucionarlo.<br />
        Por favor, intenta de nuevo más tarde.
      </p>

      <div
        class="flex align-items-center justify-content-center gap-3 flex-wrap"
      >
        <il-button
          label="Volver al Inicio"
          iconClass="material-symbols-light:home"
          rounded
          customClass="px-5"
          (clicked)="goHome()"
        />

        <il-button
          label="Reintentar"
          iconClass="material-symbols-light:refresh"
          variant="outline"
          rounded
          customClass="px-5"
          (clicked)="reloadPage()"
        />
      </div>
    </div>

    <div class="mt-5">
      <p-divider></p-divider>
      <div class="text-center mt-4">
        <p class="text-500 text-sm mb-3">¿El problema persiste?</p>
        <div
          class="flex align-items-center justify-content-center gap-4 text-500"
        >
          <a
            class="flex align-items-center gap-2 text-primary hover:text-primary-600 cursor-pointer no-underline"
            href="/"
          >
            <app-icon [icon]="'material-symbols-light:arrow-back'" class="pi" />
            <span>Regresar</span>
          </a>
          <span class="text-300">|</span>
          <a
            class="flex align-items-center gap-2 text-primary hover:text-primary-600 cursor-pointer no-underline"
            href="#"
          >
            <app-icon [icon]="'material-symbols-light:info'" class="pi" />
            <span>Estado del Sistema</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
