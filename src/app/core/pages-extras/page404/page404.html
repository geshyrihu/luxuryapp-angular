<div
  class="min-h-screen surface-ground flex align-items-center justify-content-center p-5"
>
  <div
    class="surface-card border-round shadow-4 p-5 w-full"
    style="max-width: 900px"
  >
    <div class="text-center mb-5">
      <div class="mb-4">
        <span class="text-900 font-black text-9xl">4</span>
        <i class="pi pi-exclamation-circle text-primary text-8xl mx-3"></i>
        <span class="text-900 font-black text-9xl">4</span>
      </div>

      <h1 class="text-6xl font-bold text-900 mb-3">
        ¡Oops! Página no encontrada
      </h1>

      <p class="text-500 text-xl mb-5 line-height-3">
        Lo sentimos, la página que buscas no existe o ha sido removida.<br />
        No te preocupes, te ayudamos a volver al inicio.
      </p>

      <div
        class="flex align-items-center justify-content-center gap-3 flex-wrap"
      >
        <p-button
          label="Volver al Inicio"
          icon="pi pi-home"
          routerLink="/"
          [rounded]="true"
          styleClass="px-5"
        ></p-button>

        <p-button
          label="Contactar Soporte"
          icon="pi pi-envelope"
          [variant]="'outlined'"
          [rounded]="true"
          styleClass="px-5"
        ></p-button>
      </div>
    </div>

    <div class="mt-5">
      <p-divider></p-divider>
      <div class="text-center mt-4">
        <p class="text-500 text-sm mb-3">¿Necesitas ayuda?</p>
        <div
          class="flex align-items-center justify-content-center gap-4 text-500"
        >
          <a
            class="flex align-items-center gap-2 text-primary hover:text-primary-600 cursor-pointer no-underline"
            href="/"
          >
            <i class="pi pi-arrow-left"></i>
            <span>Regresar</span>
          </a>
          <span class="text-300">|</span>
          <a
            class="flex align-items-center gap-2 text-primary hover:text-primary-600 cursor-pointer no-underline"
            href="#"
          >
            <i class="pi pi-question-circle"></i>
            <span>Centro de Ayuda</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
