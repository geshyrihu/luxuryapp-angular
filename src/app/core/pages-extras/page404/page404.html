<div
  class="min-h-screen bg-body-tertiary d-flex align-items-center justify-content-center p-5"
>
  <div
    class="bg-body rounded shadow p-5 w-full"
    style="max-width: 900px"
  >
    <div class="text-center mb-5">
      <div class="mb-4">
        <span class="text-body font-black text-9xl">4</span>
        <app-icon
          [icon]="'material-symbols-light:error'"
          class="pi text-primary text-8xl mx-3"
        />
        <span class="text-body font-black text-9xl">4</span>
      </div>

      <h1 class="text-6xl fw-bold text-body mb-3">
        ¡Oops! Página no encontrada
      </h1>

      <p class="text-body-secondary text-xl mb-5 line-height-3">
        Lo sentimos, la página que buscas no existe o ha sido removida.<br />
        No te preocupes, te ayudamos a volver al inicio.
      </p>

      <div
        class="d-flex align-items-center justify-content-center gap-3 flex-wrap"
      >
        <il-button
          label="Volver al Inicio"
          iconClass="material-symbols-light:home"
          rounded
          customClass="px-5"
          (clicked)="goHome()"
        />

        <il-button
          label="Contactar Soporte"
          iconClass="material-symbols-light:mail"
          variant="outline"
          rounded
          customClass="px-5"
        />
      </div>
    </div>

    <div class="mt-5">
  <app-divider></app-divider>
      <div class="text-center mt-4">
        <p class="text-body-secondary text-sm mb-3">¿Necesitas ayuda?</p>
        <div
          class="d-flex align-items-center justify-content-center gap-4 text-body-secondary"
        >
          <a
            class="d-flex align-items-center gap-2 text-primary hover:text-primary-600 cursor-pointer no-underline"
            href="/"
          >
            <app-icon [icon]="'material-symbols-light:arrow-back'" class="pi" />
            <span>Regresar</span>
          </a>
          <span class="text-body-secondary">|</span>
          <a
            class="d-flex align-items-center gap-2 text-primary hover:text-primary-600 cursor-pointer no-underline"
            href="#"
          >
            <app-icon [icon]="'material-symbols-light:help'" class="pi" />
            <span>Centro de Ayuda</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
