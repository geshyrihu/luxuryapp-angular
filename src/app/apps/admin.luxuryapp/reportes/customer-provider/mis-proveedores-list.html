<p-table
  [globalFilterFields]="globalFilterFields()"
  [value]="dataSignal()"
  #dt
  class="custom-table card hidden md:block"
>
  <!-- class="p-datatable-sm" -->
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th colspan="2" pSortableColumn="nameComercial">
        Proveedor
        <p-sorticon field="nameComercial" />
      </th>
      <th pSortableColumn="service">
        Servicio
        <p-sorticon field="service" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <lx-avatar
          [image]="item.pathPhoto"
          alt="noImg"
          shape="square"
          size="large"
          class="b-r-8 img-70"
        />
      </td>
      <td>
        <h4 class="m-0 h4">{{ item.nameComercial }}</h4>
        <p>{{ item.nameProvider }}</p>
      </td>
      <td>{{ item.service }}</td>
      <!-- Opciones -->
      <td class="no-print">
        <app-action-menu>
          <ng-container actions>
            <il-button-edit
              (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
              label="Editar"
            />
            <il-button-delete
              (confirmed)="onDelete(item.id)"
              label="Eliminar"
            />
          </ng-container>
        </app-action-menu>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="3" />
  </ng-template>
</p-table>
<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item lines="full" detail="false">
      <div
        slot="start"
        class="w-3rem h-3rem rounded-md bg-green-50 flex align-items-center justify-content-center flex-shrink-0 ml-3"
      >
        <app-icon icon="material-symbols-light:store-outline" class="text-xl text-green-500" />
      </div>
      <div>
        <h3>{{ item.nameComercial }}</h3>
        <p>{{ item.service }}</p>
      </div>
      <ili-action-menu slot="end">
        <ili-button-edit
          (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          label="Editar"
        />
        <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
