<div class="md:p-3">
  <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form" aria-label="Formulario de banco">
    <custom-input-text-signal
      [control]="form.controls.id"
      hidden
      label="Id"
      [readonly]="true"
    />
    <custom-input-text-signal
      [control]="form.controls.code"
      label="Código"
      placeholder="código"
    />
    <custom-input-text-signal
      [control]="form.controls.shortName"
      label="Nombre"
      placeholder="Nombre"
    />
    <custom-input-text-signal
      [control]="form.controls.largeName"
      label="Razón social"
      placeholder="razón social"
    />
    <il-button-save
      [propertyId]="id"
      [disabled]="form.invalid"
      [submitting]="submitting()"
      class="pb-2"
    />
  </form>
</div>
