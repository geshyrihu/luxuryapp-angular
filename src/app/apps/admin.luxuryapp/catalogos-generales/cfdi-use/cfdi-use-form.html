<div class="p-3">
  <div>
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <custom-input-text-signal
        [control]="form.controls.id"
        hidden
        label="Id"
        [readonly]="true"
      />

      <custom-input-text-signal
        [control]="form.controls.codigo"
        label="Código"
        placeholder="código"
      />

      <custom-input-text-signal
        [control]="form.controls.descripcion"
        label="Descripción"
        placeholder="descripción"
      />

      <il-button-save
        [propertyId]="id"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </form>
  </div>
</div>
