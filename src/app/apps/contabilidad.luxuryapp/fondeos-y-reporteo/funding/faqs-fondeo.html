<div class="px-4 py-5">
  <h2 class="text-center mb-4 text-2xl text-900 font-bold">
    Preguntas y Respuestas sobre Fondeos
  </h2>

  <div class="w-full md:w-10 lg:w-8 mx-auto mb-4">
    <custom-search-input-signal
      (searchChange)="searchTerm = $event"
      placeholder="Buscar pregunta o palabra clave..."
    />
  </div>

  @if (filteredFaqs.length === 0) {
  <lx-message severity="info" class="w-full">
    <div class="text-center w-full">No se encontraron resultados.</div>
  </lx-message>
  } @for (faq of filteredFaqs; track faq) {
  <lx-card class="mb-3">
<ng-template #header>
      <div class="flex align-items-center px-3 pt-3 gap-2">
        <app-icon [icon]="'mdi:help-circle'" class="text-primary text-xl" />
        <h5
          class="text-lg m-0 font-semibold text-900"
          [innerHTML]="faq.pregunta | highlight : searchTerm"
        ></h5>
      </div>
    </ng-template>
    <div
      class="text-700 line-height-3"
      [innerHTML]="faq.respuesta | highlight : searchTerm"
    ></div>
</lx-card>
  }
</div>
