<div class="card p-4">
  <h2 class="text-xl font-semibold mb-3">Escaneo de acceso</h2>
  <form autocomplete="off" (ngSubmit)="scan()" [formGroup]="form">
    <custom-input-select-signal
      [control]="form.controls.accessPointId"
      label="Punto de acceso *"
      placeholder="Selecciona la puerta..."
      [data]="accessPoints()"
    />

    @if (cameraSupported()) {
    <div class="flex flex-column align-items-center gap-2 mb-3">
      <video
        #video
        [hidden]="!cameraOn()"
        playsinline
        muted
        
      ></video>
      @if (!cameraOn()) {
      <il-button
        label="Escanear con cámara"
        iconClass="mdi:camera"
        (clicked)="startCamera()"
      />
      } @else {
      <il-button
        label="Detener cámara"
        severity="secondary"
        variant="text"
        iconClass="mdi:camera-off"
        (clicked)="stopCamera()"
      />
      }
    </div>
    }

    <custom-input-text-signal
      [control]="form.controls.scannedPayload"
      label="Código escaneado *"
      placeholder="Contenido del QR (o usa la cámara)"
      required
    />

    <il-button
      label="Validar acceso"
      iconClass="mdi:qrcode-scan"
      type="submit"
      [loading]="submitting()"
      [disabled]="form.invalid"
    />
  </form>
</div>

@if (result(); as r) {
<div
  class="card p-4 mt-3 text-center"
  [class.bg-green-50]="r.isValid"
  [class.bg-red-50]="!r.isValid"
>
  <h3
    class="text-lg font-semibold m-0"
    [class.text-green-700]="r.isValid"
    [class.text-red-700]="!r.isValid"
  >
    {{ r.isValid ? r.resultType : "Denegado" }}
  </h3>
  <p class="m-0 mt-2">{{ r.message }}</p>
  @if (r.visitorName) {
  <p class="text-600 m-0 mt-2">{{ r.visitorName }} · {{ r.propertyDisplay }}</p>
  }
</div>
}
