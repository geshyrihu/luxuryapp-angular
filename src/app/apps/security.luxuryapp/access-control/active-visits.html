<div class="flex justify-content-between align-items-center mb-3">
  <h2 class="text-xl font-semibold m-0">Visitas activas</h2>
  <il-button label="Actualizar" iconClass="mdi:refresh" variant="text" (clicked)="onLoadData()" />
</div>

<p-table [value]="dataSignal()" [paginator]="true" [rows]="10" class="custom-table card">
  <ng-template #header>
    <tr>
      <th>Visitante</th>
      <th>Propiedad</th>
      <th>Entrada</th>
    </tr>
  </ng-template>
  <ng-template #body let-visit>
    <tr>
      <td>{{ visit.visitorName }}</td>
      <td>{{ visit.propertyDisplay }}</td>
      <td>{{ visit.actualCheckIn | date: "dd/MM/yyyy HH:mm" }}</td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="3" class="text-center text-500 py-4">Sin visitas activas.</td>
    </tr>
  </ng-template>
</p-table>
