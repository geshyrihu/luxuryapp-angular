<div class="card">
  <div class="card-body">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <custom-input-text-signal
        [control]="form.controls.id"
        hidden
        label="Id"
        [readonly]="true"
        hidden
      />

      <custom-input-text-signal
        hidden
        [control]="form.controls.productoId"
        label="ProductoId"
      />

      <custom-input-number-signal
        [control]="form.controls.cantidad"
        label="Cantidad"
        placeholder="cantidad"
      />

      <custom-input-select-signal
        [control]="form.controls.unidadMedidaId"
        label="Unidad"
        [data]="cb_unidadMedida"
        [filter]="true"
      />

      <custom-input-currency-signal
        [control]="form.controls.precio"
        label="Precio"
        placeholder="precio"
        [minFractionDigits]="0"
        [maxFractionDigits]="4"
      />

      <custom-input-decimal-signal
        [control]="form.controls.descuento"
        label="Descuento"
        placeholder="descuento"
      />

      <custom-input-decimal-signal
        [control]="form.controls.ivaAplicado"
        label="Iva Aplicado"
        placeholder="iva aplicado"
      />

      <custom-input-decimal-signal
        [control]="form.controls.retencionIVAPorcentaje"
        label="Retención IVA (%)"
        placeholder="retención iva"
      />

      <custom-input-decimal-signal
        [control]="form.controls.retencionISRPorcentaje"
        label="Retención ISR (%)"
        placeholder="retención isr"
      />

      <il-button-save
        [propertyId]="id"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </form>
  </div>
</div>
