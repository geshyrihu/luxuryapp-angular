<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <custom-input-autocomplete-signal
    (propagar)="saveProviderId($event)"
    [control]="form.controls.provider"
    [data]="cb_providers()"
    label="Nombre"
    dataListId="providerDatalistOptions"
    placeholder="Escribe para buscar proveedor"
  />

  <custom-input-select-signal
    [control]="form.controls.tipoGasto"
    label="Tipo de Gasto"
    [data]="cb_tipoGasto()"
    [filter]="true"
  />
  <custom-input-text-signal
    [control]="form.controls.reference"
    label="Referencia"
    placeholder="Referencia"
  />
  <custom-input-text-signal
    [control]="form.controls.cuentaClave"
    label="Cuenta/Clabe"
    placeholder="Cuenta/Clabe"
  />

  <hr />
  <p class="text-center font-bold">Asignar Peróodo de Fondeo (Opcional)</p>

  <custom-input-select-signal
    [control]="form.controls.fundingYear"
    label="Año de Fondeo"
    [data]="cb_fundingYear()"
    optionLabel="label"
    optionValue="value"
    [showClear]="true"
    placeholder="Selecciona el Año"
    [horizontal]="true"
    customClass="w-full"
    [filter]="true"
  />

  <div class="grid mt-2 mb-4">
    @for (month of fundingPeriodsByMonth(); track month.monthName) {
    <div class="col-12 sm:col-6 md:col-4 xl:col-3">
      <div class="surface-card border-1 surface-border border-round p-3 h-full flex flex-column">
        <div class="font-bold text-700 mb-2 border-bottom-1 surface-border pb-2 text-center">{{ month.monthName }}</div>
        <div class="flex gap-2 justify-content-center mt-auto">
          @for (quincena of month.quincenas; track quincena.value) {
          <lx-tag 
            (click)="selectFundingPeriod(quincena)" 
            [value]="quincena.label.split(' ')[0]" 
            [severity]="form.controls.fundingPeriod.value === quincena.value ? 'success' : 'secondary'" 
            class="cursor-pointer" 
          />
          }
        </div>
      </div>
    </div>
    }
  </div>

  <hr />

  <custom-input-select-signal
    [control]="form.controls.usoCFDIId"
    label="Uso de CFDI"
    [data]="cb_usoCfdi()"
    [filter]="true"
  />

  <custom-input-select-signal
    [control]="form.controls.metodoDePagoId"
    label="Metodo de Pago"
    [data]="cb_payment_method()"
    [filter]="true"
  />

  <custom-input-select-signal
    [control]="form.controls.formaDePagoId"
    label="Forma de Pago"
    [data]="cb_formaPago()"
    [filter]="true"
  />
  <il-button-save [disabled]="form.invalid" [submitting]="submitting()" />
</form>
