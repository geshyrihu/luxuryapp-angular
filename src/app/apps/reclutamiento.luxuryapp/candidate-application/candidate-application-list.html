@if (platformS.isMobile()) {
  <app-candidate-application-list-mobile
    [data]="dataSignal()"
    [stages]="stages()"
    [activeStage]="activeStage()"
    [globalFilterFields]="globalFilterFields()"
    (stageChange)="onStageChange($event)"
    (add)="onModalForm({ id: '', title: 'Nuevo proceso de candidato' })"
    (edit)="onModalForm($event)"
    (completeHiring)="onCompleteHiring($event)"
  />
} @else {
  <app-candidate-application-list-desktop
    [data]="dataSignal()"
    [stages]="stages()"
    [activeStage]="activeStage()"
    [globalFilterFields]="globalFilterFields()"
    (stageChange)="onStageChange($event)"
    (add)="onModalForm({ id: '', title: 'Nuevo proceso de candidato' })"
    (edit)="onModalForm($event)"
    (completeHiring)="onCompleteHiring($event)"
  />
}
