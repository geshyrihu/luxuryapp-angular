<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="grid">
    <div class="col-12">
      <p class="m-0 text-sm text-600">
        Registra un beneficiario del empleado.
      </p>
    </div>

    

    <div class="col-12 md:col-6">
      <custom-input-select-signal
        [control]="f.relation"
        label="Parentesco"
        [data]="cbRelations()"
        placeholder="Seleccione una opción"
        [filter]="true"
      />
    </div>

    <div class="col-12 md:col-6">
      <custom-input-text-signal
        [control]="f.fullName"
        label="Nombre del Beneficiario"
        placeholder="Nombre completo"
      />
    </div>

    <div class="col-12 md:col-6">
      <custom-input-mask-signal
        [control]="f.phoneNumber"
        label="Teléfono del Beneficiario"
        customMask="000 000 0000"
        placeholder="10 dígitos"
      />
    </div>

    <div class="col-12 flex justify-content-end mt-4">
      <il-button-save [disabled]="form.invalid" [submitting]="submitting()" />
    </div>
  </div>
</form>
