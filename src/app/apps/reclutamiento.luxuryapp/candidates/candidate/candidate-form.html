<div class="md:p-3">
  <form
    autocomplete="off"
    (ngSubmit)="onSubmit()"
    [formGroup]="form"
    aria-label="Formulario de candidato"
  >
    <custom-input-text-signal
      [control]="form.controls.id"
      hidden
      label="Id"
      [readonly]="true"
    />
    <div class="grid">
      <div class="col-12 md:col-6">
        <custom-input-text-signal
          [control]="form.controls.firstName"
          label="Nombre(s)"
          placeholder="Nombre(s)"
        />
      </div>
      <div class="col-12 md:col-6">
        <custom-input-text-signal
          [control]="form.controls.lastName"
          label="Apellidos"
          placeholder="Apellidos"
        />
      </div>
      <div class="col-12 md:col-6">
        <custom-input-mask-signal
          [control]="form.controls.phoneNumber"
          label="Tel. Celular"
          placeholder="(00) 0000-0000"
          customMask="(00) 0000-0000"
        />
      </div>
      <div class="col-12 md:col-6">
        <custom-input-email
          [control]="form.controls.email"
          label="Correo electronico"
          placeholder="correo@ejemplo.com"
        />
      </div>
      <div class="col-12 md:col-6">
        <custom-input-number-signal
          [control]="form.controls.age"
          label="Edad"
          placeholder="Edad"
          [min]="16"
        />
      </div>
      <div class="col-12 md:col-6">
        <custom-input-number-signal
          [control]="form.controls.salaryExpectation"
          label="Expectativa salarial"
          placeholder="0.00"
          [prefix]="'$ '"
        />
      </div>
      <div class="col-12">
        <custom-input-text-signal
          [control]="form.controls.currentAddress"
          label="Direccion actual"
          placeholder="Direccion actual"
        />
      </div>
      <div class="col-12">
        <custom-input-text-signal
          [control]="form.controls.availability"
          label="Disponibilidad"
          placeholder="Ej. Inmediata, 2 semanas, Turno matutino..."
        />
      </div>
      <div class="col-12">
        <custom-input-textarea-signal
          [control]="form.controls.experienceSummary"
          label="Resumen de experiencia"
          placeholder="Experiencia laboral relevante..."
          [rows]="3"
        />
      </div>
      <div class="col-12">
        <custom-input-textarea-signal
          [control]="form.controls.generalComments"
          label="Comentarios generales"
          placeholder="Comentarios adicionales..."
          [rows]="3"
        />
      </div>
      <div class="col-12">
        <app-candidate-cv-upload
          label="CV maestro del candidato (PDF)"
          [fileName]="selectedFile?.name ?? null"
          [fileUrl]="currentCvUrl()"
          (fileSelected)="onCvSelected($event)"
          (fileEmitted)="onCvFile($event)"
        />
      </div>
      <div class="col-12">
        <div class="border-1 surface-border border-round p-3">
          <div
            class="flex flex-column md:flex-row md:align-items-center md:justify-content-between gap-2 mb-3"
          >
            <div>
              <div class="font-semibold">Experiencia laboral</div>
              <div class="text-sm text-color-secondary">
                Registra el historial laboral estructurado del candidato.
              </div>
            </div>
            <il-button
              label="Agregar experiencia"
              iconClass="material-symbols-light:add"
              severity="secondary"
              variant="outline"
              size="small"
              (clicked)="addWorkExperience()"
            />
          </div>

          @if (workExperienceControls.length === 0) {
          <div class="text-sm text-color-secondary">
            Sin experiencias registradas.
          </div>
          } @else {
          <div class="flex flex-column gap-3">
            @for (experience of workExperienceControls; track $index) {
            <div class="border-1 surface-border border-round p-3">
              <div class="flex justify-content-between align-items-center mb-3">
                <div class="font-medium">Experiencia {{ $index + 1 }}</div>
                <il-button
                  label="Eliminar"
                  iconClass="material-symbols-light:delete-outline"
                  severity="danger"
                  variant="text"
                  size="small"
                  (clicked)="removeWorkExperience($index)"
                />
              </div>

              <div class="grid" [formGroup]="experience">
                <div class="col-12 md:col-6">
                  <custom-input-text-signal
                    [control]="$any(experience.controls['companyName'])"
                    label="Empresa"
                    placeholder="Nombre de la empresa"
                  />
                </div>
                <div class="col-12 md:col-6">
                  <custom-input-text-signal
                    [control]="$any(experience.controls['jobPosition'])"
                    label="Puesto"
                    placeholder="Puesto desempenado"
                  />
                </div>
                <div class="col-12 md:col-6">
                  <custom-input-date-signal
                    [control]="$any(experience.controls['startDate'])"
                    label="Fecha de inicio"
                  />
                </div>
                <div class="col-12 md:col-6">
                  <custom-input-date-signal
                    [control]="$any(experience.controls['endDate'])"
                    label="Fecha de termino"
                  />
                </div>
                <div class="col-12 md:col-6">
                  <custom-input-number-signal
                    [control]="$any(experience.controls['monthlyNetSalary'])"
                    label="Salario neto mensual"
                    placeholder="0.00"
                    [prefix]="'$ '"
                  />
                </div>
                <div class="col-12">
                  <custom-input-textarea-signal
                    [control]="$any(experience.controls['departureReason'])"
                    label="Motivo de salida"
                    placeholder="Motivo de salida"
                    [rows]="2"
                  />
                </div>
              </div>
            </div>
            }
          </div>
          }
        </div>
      </div>
    </div>
    <il-button-save
      [propertyId]="id"
      [disabled]="form.invalid"
      [submitting]="submitting()"
      class="pb-2"
    />
  </form>
</div>
