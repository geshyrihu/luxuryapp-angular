@if (platformS.isMobile()) {
  <app-candidate-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm({ id: '', title: 'Nuevo Candidato' })"
    (edit)="onModalForm($event)"
    (archive)="onArchive($event)"
    (delete)="onDelete($event)"
    (detail)="onDetail($event)"
  />
} @else {
  <app-candidate-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm({ id: '', title: 'Nuevo Candidato' })"
    (edit)="onModalForm($event)"
    (archive)="onArchive($event)"
    (delete)="onDelete($event)"
    (detail)="onDetail($event)"
  />
}
