<div class="card p-2 mb-2">
  <custom-input-select-signal
    [control]="stageControl"
    [data]="stages()"
    [showClear]="true"
    label="Etapa del pipeline"
    placeholder="Selecciona una etapa"
  />
</div>

<app-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo proceso de candidato' })"
  [globalFilterFields]="globalFilterFields()"
  aria-label="Bandeja de procesos de candidatos"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div class="flex flex-column gap-1">
        <p class="font-semibold m-0 text-color line-height-2">
          {{ item.candidateName }}
        </p>
        <p class="text-xs m-0 text-color-secondary">
          {{ item.positionName }} - {{ item.customerName }}
        </p>
        <div class="flex align-items-center gap-2">
          <app-candidate-stage-badge [stage]="item.currentStage" />
        </div>
      </div>

      <ili-action-menu slot="end">
        @if (item.cvFileName) {
          <ili-button-view-pdf
            [url]="item.cvFileUrl"
            [fileName]="item.cvFileName"
            label="Ver CV"
            [attr.aria-label]="'Ver CV de ' + item.candidateName"
          />
        }
        <ili-button-tracking
          (clickTracking)="advance.emit({ id: item.id, fromStage: item.currentStage, customerId: item.customerId })"
          label="Avanzar etapa"
          [attr.aria-label]="'Avanzar etapa del proceso de ' + item.candidateName"
        />
        <ili-button-edit
          (clicked)="edit.emit({ id: item.id, title: 'Editar proceso de candidato' })"
          label="Editar"
          [attr.aria-label]="'Editar proceso de ' + item.candidateName"
        />
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
