<div class="md:p-3">
  <form
    autocomplete="off"
    (ngSubmit)="onSubmit()"
    [formGroup]="form"
    aria-label="Cambiar etapa del pipeline"
  >
    <div class="grid">
      <div class="col-12">
        <custom-input-select-signal
          [control]="form.controls['toStage']"
          label="Etapa destino"
          [data]="cb_targetStages()"
        />
      </div>
      @if (form.controls['toStage'].value === stageEntrevistaReclutamiento) {
        <div class="col-12">
          <custom-input-date-signal
            [control]="form.controls['recruitmentInterviewAt']"
            label="Fecha entrevista de reclutamiento"
          />
        </div>
      }
      @if (form.controls['toStage'].value === stageEntrevistaOperaciones) {
        <div class="col-12">
          <custom-input-date-signal
            [control]="form.controls['operationsInterviewAt']"
            label="Fecha entrevista de operaciones"
          />
        </div>
        <div class="col-12">
          <custom-input-select-signal
            [control]="form.controls['operationsInterviewAssignedToUserId']"
            label="Entrevistador asignado"
            placeholder="Selecciona al entrevistador"
            [data]="cb_interviewers()"
            [loading]="loadingInterviewers()"
            [filter]="true"
          />
        </div>
      }
      <div class="col-12">
        <custom-input-textarea-signal
          [control]="form.controls['comment']"
          label="Comentario"
          placeholder="Comentario sobre la transicion..."
          [rows]="2"
        />
      </div>
    </div>
    <il-button-save
      [propertyId]="id"
      [disabled]="form.invalid"
      [submitting]="submitting()"
      class="pb-2"
    />
  </form>
</div>
