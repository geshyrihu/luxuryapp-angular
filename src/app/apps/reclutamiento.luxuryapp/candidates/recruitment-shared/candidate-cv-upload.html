<div class="flex flex-column gap-2">
  <label class="text-sm text-color-secondary font-medium">{{ label() }}</label>

  @if (fileName() && !replaceMode() && !currentFileName()) {
    <div class="cv-current-file">
      <div class="flex flex-column gap-1">
        <span class="text-sm font-medium text-color">{{ currentFileLabel() }}</span>
        @if (fileUrl()) {
          <iw-button-view-pdf
            size="sm"
            class="btn--circle"
            [url]="fileUrl()"
            [fileName]="fileName()"
            [attr.aria-label]="viewAriaLabel()"
          />
        } @else {
          <span class="text-sm text-blue-700">{{ fileName() }}</span>
        }
      </div>
      <button
        type="button"
        class="cv-action-button"
        (click)="enableReplaceMode()"
      >
        {{ replaceLabel() }}
      </button>
    </div>
  }

  @if (!fileName() || replaceMode() || currentFileName()) {
  <app-file-upload
    class="w-full"
    [accept]="'.pdf'"
    [multiple]="false"
    [autoUpload]="false"
    (onSelect)="onFileSelect($event)"
  />
  }

  @if (currentFileName()) {
    <p class="text-sm m-0 text-blue-700">
      Archivo: {{ currentFileName() }}
    </p>
  }

  @if (currentFileName()) {
    <div class="flex justify-content-end">
      <button
        type="button"
        class="cv-action-button cv-action-button--subtle"
        (click)="clearReplacement()"
      >
        Cancelar reemplazo
      </button>
    </div>
  }
</div>
