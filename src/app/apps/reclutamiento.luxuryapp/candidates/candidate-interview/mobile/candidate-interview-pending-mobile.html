<app-data-view-mobile
  [data]="data()"
  [showAdd]="false"
  [globalFilterFields]="globalFilterFields()"
  aria-label="Bandeja de entrevistas pendientes"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div class="flex flex-column gap-1">
        <p class="font-semibold m-0 text-color line-height-2">{{ item.candidateName }}</p>
        <p class="text-xs m-0 text-color-secondary">
          {{ item.positionName }} - {{ item.customerName }}
        </p>
        <div class="flex align-items-center gap-2">
          <app-candidate-stage-badge [stage]="item.currentStage" />
        </div>
      </div>

      <ili-action-menu slot="end">
        @if (item.cvFileName) {
          <ili-button-view-pdf
            [url]="item.cvFileUrl"
            [fileName]="item.cvFileName"
            label="Ver CV"
            [attr.aria-label]="'Ver CV de ' + item.candidateName"
          />
        }
        <ili-button-edit
          (clicked)="feedback.emit(item.id)"
          label="Retroalimentación"
          [attr.aria-label]="'Llenar retroalimentación de ' + item.candidateName"
        />
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
