<div class="card">
  <div class="card-header employee-shell-header mb-2">
    <lx-message severity="info"
      >DATOS DE EMPLEADO: {{ nameEmployee()| uppercase }}</lx-message
    >
    <lx-section-nav
      [items]="menuItems"
      [activeValue]="activeSection"
      ariaLabel="Secciones del expediente"
      (valueChange)="changeSection($event)"
    />
  </div>

  <div class="card-body">
    <div class="employee-content-wrapper">
      @switch (activeSection) { @case ('profile') {
      <app-employee-unified-profile-form
        [employeeId]="employeeId.toString()"
        [applicationUserId]="applicationUserId"
      />
      } @case ('contacts') {
      <employee-emergency-contact-list [employeeId]="employeeId" />
      } @case ('bank-data') {
        <employee-bank-data-list [employeeId]="employeeId" />
        } @case ('beneficiary') {
      <employee-beneficiary-list [employeeId]="employeeId" />
      } @case ('clinical-data') {
      <employee-clinical-data-list [employeeId]="employeeId" />
      } @case ('documents') {
      <app-employee-document-list [employeeId]="employeeId" />
      } @case ('contracts') {
      <!-- <app-work-contract-list [employeeId]="employeeId" /> -->
      } }
    </div>
  </div>
</div>
