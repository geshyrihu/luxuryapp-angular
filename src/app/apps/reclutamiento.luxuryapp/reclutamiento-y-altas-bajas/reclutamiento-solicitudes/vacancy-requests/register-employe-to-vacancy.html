<div class="card-p1">
  <div class="grid mb-4">
    <div class="col-12 surface-900 text-center">
      <h2 class="m-2 h2 text-white">FORMATO DE ALTA DE TRABAJADOR</h2>
    </div>
    <div class="col-12 md:col-3 border-1 surface-border p-2 flex align-items-center justify-content-center">
      <img
        src="assets/images/logo-luxury.jpg"
        alt="logo"
        class="w-6rem h-auto"
      />
    </div>
    <div class="col-12 md:col-6 border-1 surface-border p-2"></div>
    <div class="col-12 md:col-3 border-1 surface-border p-2">
      <p class="font-bold">Folio:</p>
      <hr class="surface-border" />
      <p class="font-bold">Fecha:</p>
    </div>
  </div>
  <br />
  <div class="grid mb-4">
    <div class="col-12 surface-900 text-center">
      <p class="m-1 text-white">DATOS DEL (A) COLABORADOR (A)</p>
    </div>
  </div>
  <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
    <div class="grid">
      <div class="col-12 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.fistrName"
          label="APELLIDO PATERNO"
          placeholder="APELLIDO PATERNO"
          [horizontal]="false"
        />
      </div>
      <div class="col-12 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.lastName"
          label="APELLIDO MATERNO"
          placeholder="APELLIDO MATERNO"
          [horizontal]="false"
        />
      </div>
      <div class="col-12 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.name"
          label="NOMBRE"
          placeholder="NOMBRE"
          [horizontal]="false"
        />
      </div>
      <div class="col-12 sm:col-6 md:col-2">
        <custom-input-date-signal
          [control]="form.controls.birth"
          label="FECHA DE NACIMIENTO"
          placeholder="FECHA DE NACIMIENTO"
          [horizontal]="false"
        />
      </div>

      <div class="col-12 sm:col-6 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.nss"
          label="NSS"
          placeholder="NSS"
          [horizontal]="false"
        />
      </div>
      <div class="col-12 sm:col-6 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.infonavitCredit"
          label="CUENTA CON CREDITO INFONAVIT"
          placeholder="CUENTA CON CREDITO INFONAVIT"
          [horizontal]="false"
        />
      </div>
      <div class="col-12 sm:col-6 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.infonavitCreditNumber"
          label="Nº DE CREDITO"
          placeholder="Nº DE CREDITO"
          [horizontal]="false"
        />
      </div>
      <div class="col-12 sm:col-6 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.discount"
          label="FD o % DESCUENTO"
          placeholder="FD o % DESCUENTO"
          [horizontal]="false"
        />
      </div>
      <div class="col-12 sm:col-6 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.rfc"
          label="RFC"
          placeholder="RFC"
          [horizontal]="false"
        />
      </div>
      <div class="col-12 sm:col-6 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.rfcZipCode"
          label="CODIGO POSTAL DE RFC"
          placeholder="CODIGO POSTAL DE RFC"
          [horizontal]="false"
        />
      </div>
      <div class="col-12 sm:col-6 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.curp"
          label="CURP"
          placeholder="CURP"
          [horizontal]="false"
        />
      </div>
      <div class="col-12 sm:col-6 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.address"
          label="CALLE Y NUMERO"
          placeholder="CALLE Y NUMERO"
          [horizontal]="false"
        />
      </div>
      <div class="col-12 sm:col-6 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.neighborhood"
          label="COLONIA"
          placeholder="COLONIA"
          [horizontal]="false"
        />
      </div>
      <div class="col-12 sm:col-6 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.municipality"
          label="DELEGACION O MUNICIPIO"
          placeholder="DELEGACION O MUNICIPIO"
          [horizontal]="false"
        />
      </div>
      <div class="col-12 sm:col-6 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.zipCode"
          label="C.P."
          placeholder="C.P."
          [horizontal]="false"
        />
      </div>
      <div class="col-12 sm:col-6 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.maritalStatus"
          label="ESTADO CIVIL"
          placeholder="ESTADO CIVIL"
          [horizontal]="false"
        />
      </div>
      <div class="col-12 sm:col-6 md:col-2">
        <custom-input-text-signal
          [control]="form.controls.state"
          label="ENTIDAD FEDERATIVA"
          placeholder="ENTIDAD FEDERATIVA"
          [horizontal]="false"
        />
      </div>
    </div>

    <div class="flex justify-content-end mt-4">
      <il-button-save
        [propertyId]="id"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </div>
  </form>
</div>
