<div class="flex align-items-center gap-2 flex-wrap">
  <!-- Menú de navegación -->
  @for (item of menu; track item) {
  <a
    [routerLink]="item.route"
    class="btn btn-secondary btn-sm mb-0"
    [class.btn-outline]="isActive(item.activePath)"
    >{{ item.label }}</a
  >
  }

  <!-- Search -->
  <div class="flex-grow-1">
    <custom-search-input-signal (searchChange)="onSearch($event)" />
  </div>

  <!-- Filtro de fecha -->
  <custom-input-date-signal
    id="fecha-desde"
    label="Mostrar desde"
    [control]="fechaFormateadaControl"
    [horizontal]="true"
    [noMargin]="true"
  />

  <!-- Filtro de estatus -->
  <custom-input-select-button-signal
    id="status-select"
    label="Estatus"
    [control]="statusRequestControl"
    [options]="cb_status_request"
    (selectionChange)="onLoadData()"
    [horizontal]="true"
    [noMargin]="true"
  />

  <!-- Botón de exportar -->
  <il-button
    customClass="mb-0"
    iconClass="material-symbols-light:bar-chart"
    label="Exportar a excel"
    (clicked)="exportToExcel()"
    variant="outline"
    severity="success"
    size="small"
  />
</div>
