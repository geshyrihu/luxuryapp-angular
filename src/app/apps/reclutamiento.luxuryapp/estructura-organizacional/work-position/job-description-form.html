<div class="card">
  <form
    autocomplete="off"
    (ngSubmit)="onSubmit()"
    [formGroup]="form"
    class="flex flex-column"
  >
    <div class="hidden">
      <custom-input-text-signal
        [control]="form.controls.id"
        hidden
        label="Id"
        [readonly]="true"
      />
    </div>

    <div class="flex justify-content-end mb-4">
      <il-button
        label="Criticar con IA"
        iconClass="mdi:lightning-bolt"
        variant="ghost-text"
        severity="help"
        (clicked)="analyzeDescription()"
        [loading]="analyzingDescription()"
        [disabled]="!applicationRoleName()"
      />
      <il-button
        label="Generar con IA"
        iconClass="mdi:sparkles"
        variant="ghost-text"
        severity="help"
        (clicked)="openInstructionsDialog()"
        [loading]="generatingProposal()"
        [disabled]="!applicationRoleName()"
      />
    </div>

    <custom-input-textarea-signal
      [control]="form.controls.summary"
      label="Resumen"
      placeholder="Descripción breve del puesto..."
      [rows]="3"
    />
    <custom-input-textarea-signal
      [control]="form.controls.responsibilities"
      label="Responsabilidades"
      placeholder="Principales funciones y responsabilidades..."
      [rows]="4"
    />
    <custom-input-textarea-signal
      [control]="form.controls.skills"
      label="Habilidades Requeridas"
      placeholder="Competencias y habilidades necesarias..."
      [rows]="4"
    />
    <custom-input-textarea-signal
      [control]="form.controls.additionalRequirements"
      label="Requisitos Adicionales"
      placeholder="Escolaridad, certificaciones, experiencia..."
      [rows]="3"
    />
    <custom-input-textarea-signal
      [control]="form.controls.workEnvironment"
      label="Entorno de Trabajo"
      placeholder="Condiciones y ambiente laboral..."
      [rows]="3"
    />
    <custom-input-switch-signal
      [control]="form.controls.requiresWeekendShift"
      label="¿Requiere cobertura de fin de semana?"
    />

    <div class="flex justify-content-end pt-4">
      <il-button-save
        [propertyId]="id() || ''"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </div>

    <lx-modal
      header="Instrucciones para la IA (Opcional)"
      [visible]="showInstructionsDialog()"
      (visibleChange)="showInstructionsDialog.set($event)"
    >
      <p class="mb-3 text-600 text-sm">
        Agrega contexto adicional para que la IA genere una mejor propuesta.
      </p>
      <custom-input-textarea-signal
        [rows]="5"
        [(ngModel)]="customInstructions"
        [ngModelOptions]="{standalone: true}"
        placeholder="Ej: Enfocarse en atención de lujo, requiere nivel bilingüe..."
        [onlyInput]="true"
        [noMargin]="true"
        customClass="w-full"
      />

      <div class="flex justify-content-end gap-2 mt-3">
        <il-button
          label="Cancelar"
          iconClass="mdi:close"
          variant="ghost-text"
          severity="secondary"
          (clicked)="showInstructionsDialog.set(false)"
        />
        <il-button
          label="Generar"
          iconClass="mdi:check"
          severity="help"
          [loading]="generatingProposal()"
          (clicked)="generateProposal()"
        />
      </div>
    </lx-modal>
  </form>
</div>
