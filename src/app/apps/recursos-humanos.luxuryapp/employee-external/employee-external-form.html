<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="grid p-fluid">
    <!-- Foto del Colaborador -->
    <div class="col-12 flex justify-content-center mb-4">
      <custom-input-img-signal
        (fileSelected)="change($event)"
        (imageLoaded)="imgBase64 = $event"
        [urlImgCurrent]="imgBase64"
        [label]="'Foto del Colaborador'"
      />
    </div>

    <!-- Nombres -->
    <div class="col-12 md:col-6">
      <custom-input-text-signal
        [control]="form.controls.firstName"
        label="Nombres"
        placeholder="nombres"
        [horizontal]="false"
      />
    </div>

    <!-- Apellidos -->
    <div class="col-12 md:col-6">
      <custom-input-text-signal
        [control]="form.controls.lastName"
        label="Apellidos"
        placeholder="apellidos"
        [horizontal]="false"
      />
    </div>

    <!-- Email -->
    <div class="col-12 md:col-6">
      <custom-input-text-signal
        [control]="form.controls.email"
        label="Email"
        placeholder="email"
        (input)="searchExistingEmail()"
        [horizontal]="false"
      />
    </div>

    <!-- Teléfono -->
    <div class="col-12 md:col-6">
      <custom-input-mask-signal
        [control]="form.controls.phoneNumber"
        label="Teléfono"
        customMask="(99) 9999-9999"
        mask="(999) 9999-9999"
        placeholder="(55) 0000-0000"
        (input)="searchExistingPhone()"
        [horizontal]="false"
      />
    </div>

    <!-- Rol de Usuario -->
    <div class="col-12 md:col-6">
      <custom-input-select-signal
        [control]="form.controls.applicationRoleId"
        label="Rol de Usuario"
        [data]="cb_applicationRole()"
        [horizontal]="false"
        [filter]="true"
      />
    </div>

    <!-- Proveedor -->
    <div class="col-12 md:col-6">
      <custom-input-autocomplete-signal
        (propagar)="saveProviderId($event)"
        [control]="form.controls.providerName"
        [data]="cb_providers()"
        label="Proveedor"
        placeholder="Escribe para buscar proveedor"
        [horizontal]="false"
      />
    </div>

    <!-- Usuarios Existentes -->
    <div class="col-12 mt-4">
      @if (existingApplicationUser().length > 0) {
      <div class="surface-ground p-3 border-round">
        <p class="text-900 font-bold mb-2">Usuarios existentes encontrados:</p>
        <div class="flex flex-column gap-2">
          @for (user of existingApplicationUser(); track user.applicationUserId)
          {
          <div
            class="flex justify-content-between align-items-center surface-card p-3 border-round shadow-1"
          >
            <div class="flex flex-column">
              <span class="text-900 font-medium">{{ user.fullName }}</span>
              <span class="text-600 text-sm"
                >{{ user.email }} | {{ user.phoneNumber }}</span
              >
            </div>
            @if (!user.hasAccessToCurrentCustomer) {
            <il-button
              label="Dar Acceso"
              iconClass="mdi:account-plus"
              size="small"
              variant="outlined"
              (clicked)="addAccessCustomer(user.applicationUserId)"
            />
            } @else {
            <span class="text-primary text-sm font-bold">Con Acceso</span>
            }
          </div>
          }
        </div>
      </div>
      }
    </div>

    <!-- Botón Guardar -->
    <div class="col-12 flex justify-content-end mt-4">
      <il-button-save
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </div>
  </div>
</form>
