<p-table
  [globalFilterFields]="globalFilterFields()"
  [value]="dataSignal()"
  #dt
  class="custom-table card hidden md:block"
  [loading]="loading()"
>
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nuevo Registro Clinico' })"
      [showSearch]="dataSignal().length > 0"
      [dt]="dt"
    />
  </ng-template>

  @if (dataSignal().length !== 0) {
  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th>Descripcion</th>
      <th class="table-col-5 no-print"></th>
    </tr>
  </ng-template>
  }

  <ng-template #body let-item>
    <tr>
      <td>{{ item.name }}</td>
      <td>{{ item.description }}</td>
      <td class="no-print">
        <div class="flex justify-content-center">
          <iw-button
            iconClass="edit"
            ngbTooltip="Editar"
            (clicked)="onModalForm({ id: item.id, title: 'Editar Registro Clinico' })"
          />
          <iw-button-confirm
            icon="trash"
            ngbTooltip="Eliminar"
            (confirmed)="onDelete(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>

  @if (dataSignal().length === 0) {
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="3" />
  </ng-template>
  }
</p-table>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro Clinico' })"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
        
      >
        <app-icon
          icon="mdi:medical-bag"
          
        />
      </div>
      
        <h3>{{ item.name }}</h3>
        <p>{{ item.description }}</p>
      
      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar Registro Clinico' })"
            label="Editar"
          />
          <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
