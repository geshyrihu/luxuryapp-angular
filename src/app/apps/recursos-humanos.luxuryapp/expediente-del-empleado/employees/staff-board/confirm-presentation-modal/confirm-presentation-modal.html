<div class="p-4">
  <p class="text-color-secondary mb-4">
    Confirma si el candidato <strong>{{ candidateName() }}</strong> se presentó
    a laborar para la vacante <strong>{{ vacancyFolio() }}</strong>.
  </p>

  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="flex flex-column gap-4"
  >
    <div class="flex flex-column gap-2">
      <label class="font-semibold">¿Se presentó el candidato?</label>
      <div class="flex gap-4">
        <lx-radio-button
          [control]="form.controls.isPresented"
          label="Sí se presentó"
          [value]="true"
        />
        <lx-radio-button
          [control]="form.controls.isPresented"
          label="No se presentó"
          [value]="false"
        />
      </div>
    </div>

    @if (form.controls.isPresented.value === false) {
    <div class="flex flex-column gap-2 p-3 surface-100 border-round">
      <label class="font-semibold">Motivo / Acción</label>
      <div class="flex flex-column gap-3">
        <lx-radio-button
          [control]="form.controls.status"
          label="Cambió fecha de ingreso (Reprogramar)"
          value="Rescheduled"
        />
        <lx-radio-button
          [control]="form.controls.status"
          label="Declinó / Abandono"
          value="NoShow"
        />
      </div>

      @if (form.controls.status.value === 'Rescheduled') {
      <div class="mt-3">
        <custom-input-date-signal
          [control]="form.controls.newPresentationDate"
          label="Nueva fecha de ingreso"
        />
      </div>
      }
    </div>
    }

    <div class="flex justify-content-end gap-2 mt-3">
      <il-button
        label="Cancelar"
        severity="secondary"
        (clicked)="close()"
        [disabled]="saving()"
      />
      <il-button label="Guardar" type="submit" [loading]="saving()" />
    </div>
  </form>
</div>
