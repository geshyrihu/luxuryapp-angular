<div class="md:p-3">
  <form
    autocomplete="off"
    (ngSubmit)="onSubmit()"
    [formGroup]="form"
    aria-label="Formulario de retroalimentacion de entrevista"
  >
    <custom-input-text-signal
      [control]="form.controls['candidateApplicationId']"
      hidden
      label="Postulacion"
      [readonly]="true"
    />
    <div class="grid">
      <div class="col-12 md:col-6">
        <custom-input-date-signal
          [control]="form.controls['receptionConfirmedAt']"
          label="Recepcion confirmada"
        />
      </div>
      <div class="col-12 md:col-6">
        <custom-input-date-signal
          [control]="form.controls['interviewAt']"
          label="Fecha de entrevista"
        />
      </div>
      <div class="col-12 md:col-6">
        <custom-input-select-signal
          [control]="form.controls['decision']"
          label="Decision"
          [data]="cb_decision()"
        />
      </div>
      <div class="col-12 md:col-6">
        <app-candidate-decision-reason-select
          [control]="form.controls['decisionReasonId']"
          [decision]="selectedDecision()"
        />
      </div>
      <div class="col-12">
        <custom-input-textarea-signal
          [control]="form.controls['additionalComment']"
          label="Comentario"
          placeholder="Comentario adicional del entrevistador..."
          [rows]="3"
        />
      </div>
    </div>
    <il-button-save
      [propertyId]="candidateApplicationId"
      [disabled]="form.invalid"
      [submitting]="submitting()"
      class="pb-2"
    />
  </form>
</div>
