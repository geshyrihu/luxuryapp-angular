<div
  class="p-3 mb-4 border-round-lg text-sm"
  
>
  <app-icon icon="mdi:information-outline" class="mr-1" />
  Espacio exclusivo para credenciales de servicios relacionados con la operación
  de la empresa. No utilice para contraseñas personales.
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <custom-input-text-signal
    label="Plataforma"
    placeholder="Ej. AWS, Office 365, SAP..."
    [control]="form.controls.platformName"
    [required]="true"
  />

  <custom-input-text-signal
    label="Usuario / Correo"
    placeholder="Ej. admin@empresa.com"
    [control]="form.controls.username"
    [required]="true"
  />

  <custom-input-password-signal
    label="Contraseña"
    placeholder="Ingrese la contraseña"
    [control]="form.controls.password"
    [required]="true"
  />

  <custom-input-date-signal
    label="Expiración de suscripción"
    placeholder="Seleccione fecha (opcional)"
    [control]="form.controls.subscriptionExpirationDate"
  />

  <!-- Botones de Acción -->
  <div class="flex justify-content-end mt-4">
    <il-button-save [submitting]="submitting()" />
  </div>
</form>
