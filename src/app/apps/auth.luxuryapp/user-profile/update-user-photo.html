<lx-card>
  <div class="flex align-items-center p-3 gap-2">
    <app-icon [icon]="'mdi:camera'" class="text-primary text-2xl" />
    <span class="text-xl font-bold">Foto de perfil</span>
  </div>
  <div class="flex flex-column align-items-center gap-4 py-3">
      <custom-input-img-signal
        (fileSelected)="changeImg($event)"
        [urlImgCurrent]="imgTemp ?? infoEmployeeDTO.photoPath"
        label="Subir desde archivos"
        [horizontal]="false"
      />

      <div
        class="flex flex-column sm:flex-row gap-3 w-full justify-content-center px-4"
      >
        <!-- Input oculto para cámara (móvil) -->
        <input
          #cameraInput
          type="file"
          accept="image/*"
          capture="environment"
          hidden
          (change)="onCameraCapture($event)"
        />

        <il-button
          label="Tomar foto"
          iconClass="mdi:camera"
          severity="secondary"
          [outlined]="true"
          class="w-full sm:w-auto"
          (clicked)="triggerCamera()"
        />
      </div>
  </div>
</lx-card>
