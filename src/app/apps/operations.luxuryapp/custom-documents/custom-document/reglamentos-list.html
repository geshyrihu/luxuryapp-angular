<!-- Vista de escritorio -->
<p-table
  (onRowReorder)="onRowReorder($event)"
  [globalFilterFields]="globalFilterFields"
  [value]="dataSignal()"
  #dt
  class="custom-table card hidden md:block"
  [reorderableColumns]="true"
>
  <ng-template #caption>
    <primeng-custom-caption [showAdd]="false" [dt]="dt" />
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-5rem"></th>
      <th class="bg-gradient text-white text-center" pSortableColumn="folio">
        Folio
        <p-sorticon field="folio" />
      </th>
      <th class="bg-gradient text-white text-center">Fecha</th>
      <th class="text-center" pSortableColumn="name">
        Nombre
        <p-sorticon field="name" />
      </th>
      <th class="text-center">Descargar</th>
    </tr>
  </ng-template>
  <ng-template #body let-item let-index="rowIndex">
    <tr [pReorderableRow]="index">
      <td>
        <div>
          <app-icon icon="mdi:menu" class="icon" pReorderableRowHandle />
        </div>
      </td>
      <td class="text-center">{{ item.folio }}</td>
      <td class="text-center">{{ item.createAt }}</td>
      <td class="text-center text-break">{{ item.name }}</td>
      <td class="text-center flex justify-content-center">
        <iw-button-view-pdf [url]="item.path" fileName="Reglamentos" />
        <iw-button
          lxTooltip="IA"
          tooltipPosition="top"
          iconClass="mdi:comment-multiple"
          variant="outlined"
          severity="info"
          size="sm"
          (clicked)="openConsultation(item.id)"
          ngbTooltip="Consultar Reglamento con IA"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="5" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<div class="block md:hidden">
  <app-data-view-mobile
    [data]="dataSignal()"
    [showAdd]="false"
    [globalFilterFields]="globalFilterFields()"
  >
    <ng-template #listItemTemplate let-item>
      <ili-list-item>
        <div
          start
          class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 rounded-lg w-3rem h-3rem bg-primary-50"
        >
          <app-icon
            icon="mdi:scale-balance"
            class="text-xl text-primary"
          />
        </div>
        
          <div class="flex justify-content-between align-items-center mb-1">
            <h2 class="font-bold m-0 text-base text-wrap">{{ item.name }}</h2>
          </div>
          <p class="text-sm text-500 m-0">
            <app-icon [icon]="'mdi:pound'" class="mr-1 text-xs" />
            Folio: {{ item.folio }}
          </p>
          <p class="text-sm text-500 m-0">
            <app-icon [icon]="'mdi:calendar'" class="mr-1 text-xs" />
            Fecha: {{ item.createAt }}
          </p>
        
        <div end class="flex align-items-center gap-1">
          <il-button-view-pdf [url]="item.path" pdf="Reglamento" />
          <iw-button
            iconClass="mdi:comment-multiple"
            severity="info"
            variant="ghost-text"
            (clicked)="openConsultation(item.id)"
            lxTooltip="Consultar con IA"
            tooltipPosition="bottom"
          />
        </div>
      </ili-list-item>
    </ng-template>
  </app-data-view-mobile>
</div>

<lx-modal
  header="?? Asistente Legal Virtual"
  [visible]="showConsultationDialog()"
  (visibleChange)="showConsultationDialog.set($event)"
>
  <div class="flex flex-column">
    <div class="p-message p-message-info border-none m-0 shadow-none">
      <div class="p-message-wrapper p-3">
        <span class="p-message-icon mdi:information text-xl"></span>
        <span class="p-message-text ml-2"
          >Haz una pregunta específica sobre este reglamento y la IA analizaré
          el documento para responderte.</span
        >
      </div>
    </div>

    <div class="mb-4">
      <label for="query" class="font-bold block mb-2">Tu Consulta</label>
      <custom-input-textarea-signal
        id="query"
        [rows]="4"
        placeholder="Ej. óCuóles son las sanciones por ruido excesivo? óCuól es el horario de la alberca?"
        [control]="consultationQueryControl"
        customClass="w-full"
        [disabled]="consultingDoc()"
        [horizontal]="false"
        [noMargin]="true"
      />
    </div>

    @if (aiResponse()) {
    <div class="surface-ground p-3 rounded-xl">
      <div class="flex align-items-center mb-2 text-primary font-bold">
        <app-icon [icon]="'mdi:sparkles'" />
        <span>Respuesta del Asistente</span>
      </div>
      <div
        [innerHTML]="aiResponse()"
        class="line-height-3 text-900 text-justify"
      ></div>
    </div>
    }
  </div>

  <ng-template #footer>
    <il-button
      label="Cancelar"
      iconClass="mdi:close"
      variant="ghost-text"
      [disabled]="consultingDoc()"
      (clicked)="showConsultationDialog.set(false)"
    />
    <il-button
      label="Consultar"
      iconClass="mdi:magnify"
      [loading]="consultingDoc()"
      [disabled]="!consultationQueryControl.value?.trim()"
      (clicked)="consultAi()"
    />
  </ng-template>
</lx-modal>
