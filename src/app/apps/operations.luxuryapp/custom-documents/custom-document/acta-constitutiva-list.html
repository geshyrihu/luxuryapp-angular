<div class="card shadow p-3 rounded">
  <!-- Vista de escritorio -->

  <div class="hidden md:block">
    <p-table
      [globalFilterFields]="globalFilterFields"
      [value]="dataSignal()"
      #dt
      class="custom-table card hidden md:block"
    >
      <ng-template #caption>
        <primeng-custom-caption
          [showAdd]="false"
          [showSearch]="false"
          [dt]="dt"
        />
      </ng-template>
      <ng-template #header>
        <tr>
          <th
            class="bg-gradient text-white text-center"
            pSortableColumn="folio"
          >
            Folio
            <p-sorticon field="folio" />
          </th>
          <th class="bg-gradient text-white text-center">Fecha</th>
          <th class="text-center" pSortableColumn="name">
            Nombre
            <p-sorticon field="name" />
          </th>
          <th class="text-center">Descargar</th>
        </tr>
      </ng-template>
      <ng-template #body let-item>
        <tr>
          <td class="text-center">{{ item.folio }}</td>
          <td class="text-center">{{ item.createAt }}</td>
          <td class="text-center text-break">{{ item.name }}</td>
          <td class="text-center">
            <iw-button-view-pdf [url]="item.path" pdf="Documento" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <primeng-custom-table-emptymessage [colspan]="4" />
      </ng-template>
      <ng-template #paginatorleft>
        <primeng-custom-table-footer [data]="dataSignal()" />
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Vista para míviles -->
<div class="block md:hidden">
  <app-data-view-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [showAdd]="false"
  >
    <ng-template #listItemTemplate let-item>
      <ili-list-item>
        <div
          start
          class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 rounded-lg w-3rem h-3rem bg-yellow-100"
        >
          <app-icon
            icon="mdi:file-certificate"
            class="text-xl text-yellow-500"
          />
        </div>
        
          <div class="flex justify-content-between align-items-center mb-1">
            <h2 class="font-bold m-0 text-base text-wrap">{{ item.name }}</h2>
          </div>
          <p class="text-sm text-500 m-0">
            <app-icon [icon]="'mdi:pound'" class="mr-1 text-xs" />
            Folio: {{ item.folio }}
          </p>
          <p class="text-sm text-500 m-0">
            <app-icon [icon]="'mdi:calendar'" class="mr-1 text-xs" />
            Fecha: {{ item.createAt }}
          </p>
        
        <div end class="flex align-items-center">
          <il-button-view-pdf [url]="item.path" pdf="Documento" />
        </div>
      </ili-list-item>
    </ng-template>
  </app-data-view-mobile>
</div>
