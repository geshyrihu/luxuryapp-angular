<div class="card">
  <div class="card-body">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <custom-input-text-signal
        [control]="form.controls.id"
        hidden
        label="Id"
        [horizontal]="false"
        [readonly]="true"
      />

      <custom-input-select-signal
        [control]="form.controls.eAreaMinutasDetalles"
        label="Area"
        [data]="cb_area()"
        [horizontal]="false"
        [filter]="true"
      />

      <custom-input-date-signal
        [control]="form.controls.deliveryDate"
        label="Fecha de término"
        placeholder="fecha de término"
        [horizontal]="false"
      />

      <custom-input-text-signal
        [control]="form.controls.title"
        label="Título"
        placeholder="titulo"
        [horizontal]="false"
      />

      <custom-input-textarea-signal
        [control]="form.controls.requestService"
        label="Asunto"
        placeholder="asunto"
        [horizontal]="false"
      />

      <custom-input-select-signal
        [control]="form.controls.status"
        label="Estatus"
        [data]="cb_estatus()"
        [horizontal]="false"
        [filter]="true"
      />

      <div class="flex justify-content-end mt-2">
        <il-button
          [variant]="'outlined'"
          label="Seguimientos"
          iconClass="mdi:comment-multiple"
          (clicked)="openFollowUp()"
        />
        <il-button-save
          [propertyId]="id()"
          [disabled]="form.invalid"
          [submitting]="submitting()"
        />
      </div>
    </form>
  </div>
</div>
