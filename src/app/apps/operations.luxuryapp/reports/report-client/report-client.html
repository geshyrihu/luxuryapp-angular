<div class="container-md">
  <div class="m-1">
    <div class="flex flex-column">
      <div class="w-full text-center">
        <img
          alt="noimg"
          [src]="data.logoCustomer"
          style="width: 100px; height: 150px; max-width: 100%; height: auto"
        />
      </div>
      <div class="w-full">
        <div style="height: 3px; background-color: black"></div>
        <p>Reporte del {{ inicio | date }} al {{ final | date }}</p>
      </div>
    </div>
    @for (area of data.reportes; track area) {
    <div>
      <h5 class="h2 font-bold">{{ area.responsable }}</h5>
      @for (item of area.items; track item) {
      <div class="card">
        <div class="card-body">
          <p class="text-justify font-size-20">{{ item.activity }}</p>
          <div class="grid mt-3">
            <div>
              <img
                [src]="item.photoPathBefore"
                alt=""
                class="img-fluid"
                style="width: 100%; height: 300px"
              />
            </div>
            <div>
              <img
                [src]="item.photoPathAfter"
                alt=""
                class="img-fluid"
                style="width: 100%; height: 300px"
              />
            </div>
          </div>
        </div>
      </div>
      }
    </div>
    }
  </div>
</div>
