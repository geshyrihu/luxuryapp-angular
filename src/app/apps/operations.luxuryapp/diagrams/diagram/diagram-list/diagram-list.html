<div class="card p-0 md:p-4 border-none shadow-none">
  <p-table
    #dt
    [value]="diagrams()"
    [rows]="10"
    [paginator]="true"
    [globalFilterFields]="['name']"
    [rowHover]="true"
    dataKey="id"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} diagramas"
    [showCurrentPageReport]="true"
    [loading]="loading()"
    class="custom-table hidden md:block"
  >
    <ng-template #caption>
      <div class="flex align-items-center justify-content-between p-2">
        <h5 class="m-0 text-xl font-bold text-700">Gestión de Diagramas</h5>
        <div class="flex gap-2">
          <il-button
            label="Galeróa"
            iconClass="mdi:image-multiple"
            severity="secondary"
            variant="ghost-text"
            (clicked)="onOpenGallery()"
          />
          <iw-button-add (clicked)="onAddDiagram()" />
        </div>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="name">
          Nombre <p-sorticon field="name"></p-sorticon>
        </th>
        <th pSortableColumn="updateAt" class="table-col-15rem">
          óltima Actualización <p-sorticon field="updateAt"></p-sorticon>
        </th>
        <th class="table-col-actions">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-diagram>
      <tr>
        <td class="font-medium text-700">{{ diagram.name }}</td>
        <td class="text-500">
          {{ diagram.updateAt | date: 'dd/MM/yyyy HH:mm' }}
        </td>
        <td>
          <div class="flex justify-content-center gap-2">
            <iw-button
              iconClass="mdi:pencil"
              (clicked)="onEditDiagram(diagram.id)"
              ngbTooltip="Editar Propiedades"
              variant="text"
              severity="secondary"
              lxTooltip="Propiedades"
              tooltipPosition="top"
            />
            <iw-button
              iconClass="mdi:palette"
              (clicked)="onOpenEditor(diagram.id)"
              ngbTooltip="Abrir Editor Grófico"
              variant="text"
              severity="info"
              lxTooltip="Editor"
              tooltipPosition="top"
            />
            <iw-button
              iconClass="mdi:eye-outline"
              (clicked)="onViewDiagram(diagram.id)"
              ngbTooltip="Visualizar Diagrama"
              variant="text"
              severity="success"
              lxTooltip="Ver"
              tooltipPosition="top"
            />
            <iw-button-delete (clicked)="onDeleteDiagram(diagram.id)" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #summary>
      <div
        class="flex align-items-center justify-content-between text-500 italic"
      >
        En total hay {{ diagrams() ? diagrams().length : 0 }} diagramas.
      </div>
    </ng-template>
    <ng-template #emptymessage>
      <primeng-custom-table-emptymessage [colspan]="3" />
    </ng-template>
  </p-table>
</div>

<app-data-view-mobile
  [data]="diagrams()"
  [globalFilterFields]="['name']"
  (add)="onAddDiagram()"
>
  <ng-template #listItemTemplate let-diagram>
    <ili-list-item>
      <div
        start
        class="flex align-items-center justify-content-center bg-green-50 rounded-md ml-3 w-3rem h-3rem flex-shrink-0"
      >
        <app-icon icon="mdi:source-branch" class="text-2xl text-green-600" />
      </div>
      
        <h3 class="font-bold text-700">{{ diagram.name }}</h3>
        <p class="text-500">{{ diagram.updateAt | date:'dd/MM/yyyy HH:mm' }}</p>
      
      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit
            (clicked)="onEditDiagram(diagram.id)"
            label="Editar"
          />
          <il-button
            iconClass="mdi:palette"
            (clicked)="onOpenEditor(diagram.id)"
            label="Editor"
            variant="text"
            severity="info"
          />
          <il-button
            iconClass="mdi:eye-outline"
            (clicked)="onViewDiagram(diagram.id)"
            label="Ver"
            variant="text"
            severity="success"
          />
          <ili-button-delete
            (confirmed)="onDeleteDiagram(diagram.id)"
            label="Eliminar"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
