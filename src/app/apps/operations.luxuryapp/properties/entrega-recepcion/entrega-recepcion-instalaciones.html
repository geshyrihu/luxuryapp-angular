<app-report-header></app-report-header>

<p-table
  [value]="dataSignal()"
  sortField="clasificacion"
  rowGroupMode="subheader"
  groupRowsBy="clasificacion"
  class="custom-table card hidden md:block"
>
  <ng-template #caption>
    <div class="flex align-items-center justify-content-between">
      <h5 class="m-0 h5">Inventario Instalaciones</h5>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-12 text-sm">Nó</th>
      <th class="table-col-14 text-sm">Foto</th>
      <th class="table-col-15 text-sm" pSortableColumn="nombre">
        Nombre
        <p-sorticon field="nombre" />
      </th>
      <th class="table-col-15 text-sm" pSortableColumn="sistema">
        Sistema
        <p-sorticon field="sistema" />
      </th>
      <th class="table-col-15 text-sm">Ubicación</th>
      <th class="table-col-10 text-sm">Check</th>
      <th class="table-col-45 text-sm">Observaciones</th>
    </tr>
  </ng-template>
  <ng-template #groupheader let-customer>
    <tr pRowGroupHeader>
      <td colspan="7">
        <span class="font-bold ml-2">{{ customer.clasificacion }}</span>
      </td>
    </tr>
  </ng-template>
  <ng-template #groupfooter let-customer>
    <tr class="p-rowgroup-footer">
      <td class="text-sm" colspan="7">
        <div style="text-align: right">
          Total: {{ calcularEquiposTotal(customer.clasificacion) }}
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #body let-item let-rowIndex="rowIndex">
    <tr class="page-break">
      <td class="text-sm">{{ rowIndex + 1 }}</td>
      <td class="text-sm">
        <img [src]="item.foto" alt="img" width="100" class="shadow-4" />
      </td>
      <td class="text-sm">{{ item.nombre }}</td>
      <td class="text-sm">{{ item.sistema }}</td>
      <td class="text-sm">{{ item.ubicacion }}</td>
      <td class="text-sm text-center">
        <custom-input-check-signal
          [ngModel]="false"
          [disabled]="true"
          [horizontal]="false"
          noMargin
        />
      </td>
      <td class="text-sm">{{ item.observations | striptags }}</td>
    </tr>
  </ng-template>
</p-table>
