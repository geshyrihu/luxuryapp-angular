<p-table
  [globalFilterFields]="globalFilterFields()"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  #dt
  class="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption
      [title]="'Llaves'"
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
    <iw-button-download
      lxTooltip="Descargar PDF"
      tooltipPosition="top"
      (clicked)="onDownloadPdf()"
      class="mt-1"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="descripcion">
        Descripción <p-sorticon field="descripcion" />
      </th>
      <th pSortableColumn="marca">Marca <p-sorticon field="marca" /></th>
      <th pSortableColumn="numeroLlave">
        Número <p-sorticon field="numeroLlave" />
      </th>
      <th pSortableColumn="cantidad">
        Cantidad <p-sorticon field="cantidad" />
      </th>
      <th pSortableColumn="equipoClasificacion">
        Clasificación <p-sorticon field="equipoClasificacion" />
      </th>
      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td><small>{{ item.descripcion }}</small></td>
      <td><small>{{ item.marca }}</small></td>
      <td><small>{{ item.numeroLlave }}</small></td>
      <td><small>{{ item.cantidad }}</small></td>
      <td><small>{{ item.equipoClasificacion }}</small></td>
      <td class="no-print">
        <div class="flex">
          <iw-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <iw-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
>
  <div customFilters >
    <ili-button-download (clicked)="onDownloadPdf()" />
  </div>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        
      >
        <app-icon
          icon="mdi:key-outline"
          class="text-xl text-yellow-500"
        />
      </div>
      
        <h3>{{ item.descripcion }}</h3>
        <p>
          {{ item.marca }} | Né {{ item.numeroLlave }} | Cant: {{ item.cantidad
          }}
        </p>
        <p>{{ item.equipoClasificacion }}</p>
      
      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
