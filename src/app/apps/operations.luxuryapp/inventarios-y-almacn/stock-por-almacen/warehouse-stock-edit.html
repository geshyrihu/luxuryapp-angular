@if (formReady()) {
<div class="card">
  <div class="card-body">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <div class="grid col-12 align-items-center mb-4">
        <label class="col-12 md:col-3 mb-2 md:mb-0">Producto</label>
        <div class="col-12 md:col-9">
          <custom-input-text-signal
            [hidden]="true"
            [horizontal]="false"
            [control]="form.controls.productoId"
          />
          <custom-input-text-signal
            [readonly]="true"
            [horizontal]="false"
            [control]="form.controls.producto"
          />
        </div>
      </div>
      <custom-input-select-signal
        [control]="form.controls.almacenId"
        label="Almacen"
        [data]="cb_almacenes()"
        [filter]="true"
      />

      <custom-input-number-signal
        [control]="form.controls.existencia"
        label="Existencia"
      />

      <custom-input-select-signal
        [control]="form.controls.unidadDeMedidaId"
        label="Unidad"
        [data]="cb_measurementUnits()"
        [filter]="true"
      />

      <custom-input-number-signal
        [control]="form.controls.stockMax"
        label="Stock Maximo"
        placeholder="stock maximo"
      />

      <custom-input-number-signal
        [control]="form.controls.stockMin"
        label="Stock Minimo"
        placeholder="stock minimo"
      />

      <il-button-save
        [propertyId]="editId()"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </form>
  </div>
</div>
}
