<div class="card">
  <div class="card-body">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <!-- Id -->
      <custom-input-text-signal
        [control]="form.controls.id"
        hidden
        label="Id"
        placeholder="Id"
      />
      <!-- Img -->
      <div class="mb-4 flex justify-content-center">
        <div class="w-full sm:w-9/12 max-w-sm">
          <div class="card text-center p-3">
            <custom-input-img-signal
              (fileSelected)="uploadFile($event)"
              [urlImgCurrent]="urlBaseImg"
              [contentHeight]="75"
              [contentWidth]="75"
            />
          </div>
        </div>
      </div>

      <custom-input-select-signal
        [control]="form.controls.extinguisherType"
        label="Tipo de Extintor"
        [data]="cb_extintor"
        [filter]="true"
      />

      <custom-input-date-signal
        [control]="form.controls.expirationDate"
        label="Fecha de Vencimiento"
      />

      <custom-input-text-signal
        [control]="form.controls.location"
        label="Ubicación"
        placeholder="Ej: Piso 3 - Pasillo A"
      />

      <custom-input-mask-signal
        [control]="form.controls.localCode"
        label="Código Local"
        placeholder="EXT-01-001"
        customMask="EXT-00-000"
        [validation]="false"
        [dropSpecialCharacters]="false"
        description="EXT = Extintor · Zona (2 dígitos) · Número de equipo (3 dígitos)"
      />

      <il-button-save
        [propertyId]="id"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </form>
  </div>
</div>
