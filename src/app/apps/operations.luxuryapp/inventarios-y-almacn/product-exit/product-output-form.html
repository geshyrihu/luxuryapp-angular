<div class="card">
  
    <form autocomplete="off" [formGroup]="form" (ngSubmit)="onSubmit()">
      <custom-input-text-signal
        [control]="form.controls.id"
        hidden
        label="Id"
        [readonly]="true"
      />
      <custom-input-date-signal
        [control]="form.controls.fechaSalida"
        label="Fecha de salida"
        placeholder="fecha de salida"
      />
      <custom-input-time-signal
        [control]="form.controls.horaSalida"
        label="Hora de salida"
        placeholder="hora de salida"
      />
      <div class="grid mb-4 align-items-center">
        <label class="form-label col-12 md:col-3">Producto</label>
        <div class="col-12 md:col-9">
          <custom-input-text-signal
            [control]="form.controls.productoId"
            [hidden]="true"
            [horizontal]="false"
          />
          <input pInputText [readonly]="true" [value]="nombreProducto()" class="w-full" />
        </div>
      </div>
      <div class="grid mb-4 align-items-center">
        <label class="form-label col-12 md:col-3">Cantidad</label>
        <div class="col-12 md:col-9">
          <custom-input-number-signal
            [control]="form.controls.cantidad"
            [horizontal]="false"
          />
          @if (form.controls.cantidad.hasError('stockInsuficiente')) {
          <small class="p-error block mt-1"
            >No hay suficiente stock. Disponible: {{existenciaAlmacen()}}</small
          >
          }
        </div>
      </div>
      <custom-input-select-signal
        [control]="form.controls.unidadMedidaId"
        label="Unidad"
        [data]="cb_measurement_unit()"
        [filter]="true"
      />
      <custom-input-text-signal
        [control]="form.controls.quienUso"
        label="Entregado a:..."
        placeholder="entregado a"
      />
      <custom-input-textarea-signal
        [control]="form.controls.usoPrducto"
        label="Uso"
        placeholder="uso"
      />
      <il-button-save [disabled]="form.invalid || submitting()" />
    </form>
  
</div>
