@if (data()) {
<!-- Botón para descargar el reporte en PDF -->
<div class="no-print text-right p-5 pb-0">
  <il-button
    iconClass="material-symbols-light:picture-as-pdf"
    label="Descargar PDF"
    severity="secondary"
    variant="outline"
    [loading]="exportingPdf()"
    (clicked)="exportPdf()"
  />
</div>
<!-- Grid básico -->
<div class="surface-ground p-5">
  <div class="text-center">
    <!-- Encabezado con el logo del cliente y nombre -->
    <img
      [src]="
        data()!.customerLogo
          ? data()!.customerLogo
          : 'assets/images/default-avatar.png'
      "
      alt="Logo del cliente"
      class="max-h-8rem w-auto mx-auto d-block mb-3"
    />
    <h1 class="text-2xl font-bold text-primary">{{ data()!.customer }}</h1>
    <p class="text-lg text-color-secondary">{{ data()!.periodReport }}</p>
    <hr class="my-4" />
  </div>
  @for (ticket of data()!.tickets; track ticket) {
  <div class="mb-4">
    <div class="card shadow-sm mb-4 p-5">
      <div class="card-body">
        <strong> {{ ticket.title }} </strong>
        <p class="h6 text-justify mb-4">{{ ticket.description }}</p>
        <div class="grid">
          <div class="col-6">
            <img
              [src]="
                ticket.beforeWork
                  ? ticket.beforeWork
                  : 'assets/images/default-avatar.png'
              "
              alt="Imagen antes"
              class="w-full rounded shadow-sm"
            />
          </div>
          <div class="col-6">
            <img
              [src]="
                ticket.afterWork
                  ? ticket.afterWork
                  : 'assets/images/default-avatar.png'
              "
              alt="Imagen después"
              class="w-full rounded shadow-sm"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
  }
</div>
}
