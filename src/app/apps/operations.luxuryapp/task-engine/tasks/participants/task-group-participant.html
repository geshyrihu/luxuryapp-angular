<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="flex flex-column">
    <div class="w-full">
      <custom-input-autocomplete-signal
        (propagar)="onSelectUser($event)"
        [control]="form.controls.applicationUser"
        [data]="cb_application_user()"
        label="Colaborador"
        placeholder="Escribe para buscar colaborador"
        [horizontal]="false"
      />
    </div>
    <div class="w-full">
      <custom-input-select-signal
        [control]="form.controls.isAdmin"
        label="Rol"
        [data]="cb_eLuxury_group_rol"
        [horizontal]="false"
        [filter]="true"
      />
    </div>
    <div class="w-full flex justify-content-end">
      <il-button-save
        [propertyId]="id"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </div>
  </div>
</form>

@if (loading_existing_participant()) {
<div class="flex justify-content-center mt-3">
  <app-spinner />
</div>
} @else if (cb_existing_Participant().length === 0) {
<lx-message severity="info" text="No hay integrantes."></lx-message>
} @else {
<div class="flex flex-column mt-3 gap-2">
  @for (item of cb_existing_Participant(); track item.id) {
  <ili-list-item
    class="w-full border-1 rounded-md"
    [class.border-green-500]="item.isAdmin === 'Administrador'"
    [class.border-red-500]="item.isAdmin !== 'Administrador'"
  >
    <!-- Lado izquierdo: icono + texto -->
    <div slot="start" class="mr-2 flex align-items-center">
      <app-icon
        [icon]="
              item.isAdmin === 'Administrador'
                ? 'mdi:account-minus'
                : 'mdi:account'
            "
        [class]="
              item.isAdmin === 'Administrador'
                ? 'text-green-500'
                : 'text-red-500'
            "
        class="text-2xl"
      />
    </div>

    <div class="flex flex-column gap-1">
      <p class="font-semibold m-0 text-color line-height-2 text-sm">
        {{ item.isAdmin === 'Administrador' ? 'Administrador' : 'Participante'
        }}
      </p>
      <p class="text-xs m-0 text-color-secondary">{{ item.applicationUser }}</p>
    </div>

    <!-- Lado derecho: acciones -->
    <ili-action-menu slot="end">
      <ili-button-edit (clicked)="onEditParticipant(item)" label="Editar" />
      <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
    </ili-action-menu>
  </ili-list-item>
  }
</div>
}
