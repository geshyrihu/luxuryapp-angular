<div class="grid">
  <!-- Reporte semanal -->
  <div class="col-12 lg:col-3">
    <a [routerLink]="ROUTES.TICKETS.REPORTE_SEMANAL" class="no-underline">
      <!-- Enlace a otra página -->
      <div class="card text-center shadow-sm border-none cursor-pointer">
        <div class="card-body">
          <app-icon
            [icon]="'material-symbols-light:calendar-today'"
            class="icon icon- icon-xl mb-3 text-primary"
          />
          <p class="card-text h5">Reporte semanal</p>
        </div>
      </div>
    </a>
  </div>

  <!-- Plan de trabajo -->
  <div class="col-12 lg:col-3">
    <a [routerLink]="ROUTES.TICKETS.PLAN_TRABAJO" class="no-underline">
      <div
        class="surface-card text-center shadow-sm rounded p-3 cursor-pointer"
      >
        <div>
          <app-icon
            [icon]="'material-symbols-light:fact-check'"
            class="icon icon- icon-xl mb-3 text-green-600"
          />
          <p class="card-text h5">Plan de trabajo</p>
        </div>
      </div>
    </a>
  </div>

  <!-- Resumen -->
  <div class="col-12 lg:col-3">
    <a [routerLink]="ROUTES.TICKETS.RESUMEN" class="no-underline">
      <div
        class="surface-card text-center shadow-sm rounded p-3 cursor-pointer"
      >
        <div>
          <app-icon
            [icon]="'material-symbols-light:pie-chart'"
            class="icon icon- icon-xl mb-3 text-yellow-600"
          />
          <p class="card-text h5">Resumen</p>
        </div>
      </div>
    </a>
  </div>
</div>
