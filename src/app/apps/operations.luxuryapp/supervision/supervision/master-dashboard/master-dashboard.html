<!-- Encabezado -->
<div class="mb-6">
  <div class="flex align-items-center gap-3 mb-2">
    <div
      class="flex align-items-center justify-content-center bg-primary-50 rounded-xl"
      
    >
      <app-icon [icon]="'material-symbols-light:verified'" class="text-3xl text-primary-600" />
    </div>
    <div>
      <h1 class="text-3xl font-bold text-900 m-0">Supervision</h1>
      <p class="text-base text-500 m-0">
        Panel central de gestion operativa, agenda, minutas, resultados y
        reportes de supervision
      </p>
    </div>
  </div>
</div>

<!-- Grupos de modulos -->
@for (group of getVisibleGroups(); track group.label) {
<!-- Titulo del grupo -->
<div class="flex align-items-center gap-2 mb-4 mt-6">
  <app-icon [icon]="group.icon" class="text-xl text-primary-600" />
  <h2 class="text-lg font-bold text-900 m-0 uppercase">{{ group.label }}</h2>
  <div class="flex-grow-1 border-bottom-1 surface-border ml-3"></div>
</div>

<!-- Cards del grupo -->
<div class="grid">
  @for (module of group.cards; track module.route) {
  <div class="col-12 sm:col-6 md:col-3">
    <div class="card"
      class="h-full border-top-3 surface-card shadow-sm cursor-pointer hover:shadow transition-all transition-duration-200"
      
      (click)="navigateTo(module.route)"
    >
      <div class="flex flex-column gap-3">
        <!-- Icono y meta -->
        <div class="flex align-items-center justify-content-between">
          <div
            class="flex align-items-center justify-content-center rounded-lg text-2xl flex-shrink-0"
            
            [style.backgroundColor]="module.bgColor"
          >
            <app-icon [icon]="module.icon" [style.color]="module.color" />
          </div>
          <app-icon [icon]="'material-symbols-light:north-east'" class="text-400" />
        </div>

        <!-- Titulo y descripcion -->
        <div>
          <h3 class="m-0 font-bold text-900 line-height-2 text-base">
            {{ module.title }}
          </h3>
          <p class="text-sm text-600 m-0 mt-2 line-height-3">
            {{ module.description }}
          </p>
        </div>
      </div>
    </div>
  </div>
  }
</div>
}
