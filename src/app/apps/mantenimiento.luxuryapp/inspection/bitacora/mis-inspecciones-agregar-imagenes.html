<div class="p-4 md:p-6">
  <!-- Botones para cargar imágenes -->
  <div class="flex gap-3 mb-6 flex-wrap">
    <!-- Botón cámara -->
    <iw-button
      iconClass="material-symbols-light:photo-camera"
      label="Tomar foto"
      severity="secondary"
      (clicked)="cameraInput.click()"
    />
    <input
      #cameraInput
      type="file"
      class="hidden"
      (change)="onFileSelected($event)"
          accept="image/*,.heic,.heif"
      capture="environment"
    />

    <!-- Botón galería -->
    <iw-button
      iconClass="material-symbols-light:photo-library"
      label="Galería"
      severity="secondary"
      (clicked)="galleryInput.click()"
    />
    <input
      #galleryInput
      type="file"
      class="hidden"
      (change)="onFileSelected($event)"
          accept="image/*,.heic,.heif"
      multiple
    />
  </div>

  <!-- Nuevas imágenes -->
  @if (newImages.length > 0) {
  <div class="mb-6">
    <div class="flex align-items-center gap-2 mb-4">
      <app-icon icon="material-symbols-light:add-circle" class="text-success-600 text-lg" />
      <h6 class="text-title-md m-0 text-on-surface">Nuevas imágenes ({{ newImages.length }})</h6>
    </div>
    <div class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
      @for (image of newImages; track image; let i = $index) {
      <div class="relative group">
        <img
          [src]="image.url ? image.url : 'assets/images/default-avatar.png'"
          class="w-full h-24 object-cover rounded-md border-1 border-outline shadow-1"
          alt="Foto nueva"
        />
        <iw-button
          iconClass="material-symbols-light:delete-outline"
          severity="danger"
          size="sm"
          variant="ghost-text"
          customClass="absolute top-1 right-1 opacity-0 group-hover:opacity-100 transition-opacity"
          (clicked)="removeNewImage(i)"
          lxTooltip="Eliminar"
          tooltipPosition="top"
        />
      </div>
      }
    </div>
  </div>
  }

  <!-- Imágenes almacenadas -->
  @if (existingImages.length > 0) {
  <div class="mb-6">
    <div class="flex align-items-center gap-2 mb-4">
      <app-icon icon="material-symbols-light:cloud-done" class="text-info-600 text-lg" />
      <h6 class="text-title-md m-0 text-on-surface">Imágenes almacenadas ({{ existingImages.length }})</h6>
    </div>
    <div class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
      @for (image of existingImages; track image) {
      <div class="relative group">
        <img
          [src]="image.photoPath ? image.photoPath : 'assets/images/default-avatar.png'"
          class="w-full h-24 object-cover rounded-md border-1 border-outline shadow-1"
          alt="Foto almacenada"
        />
        <iw-button
          iconClass="material-symbols-light:cancel-outline"
          severity="danger"
          size="sm"
          variant="ghost-text"
          customClass="absolute top-1 right-1 opacity-0 group-hover:opacity-100 transition-opacity"
          (clicked)="deleteExistingImage(image.id)"
          lxTooltip="Eliminar"
          tooltipPosition="top"
        />
      </div>
      }
    </div>
  </div>
  }

  <!-- Botón guardar -->
  <div class="flex justify-content-center pt-4 border-top-1 border-outline">
    <il-button
      label="Guardar imágenes"
      iconClass="material-symbols-light:save"
      (clicked)="onSaveImages()"
      [disabled]="newImages.length === 0"
    />
  </div>
</div>
