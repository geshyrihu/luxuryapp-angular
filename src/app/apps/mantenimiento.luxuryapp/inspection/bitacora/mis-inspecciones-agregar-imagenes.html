<div class="container py-3">
  <!-- Input para cargar imógenes -->
  <div class="flex justify-content-center gap-2 mb-3">
    <!-- Botón para abrir la cómara -->
    <iw-button
      iconClass="mdi:camera"
      variant="outlined"
      (clicked)="cameraInput.click()"
    />
    <input
      #cameraInput
      type="file"
      class="hidden"
      (change)="onFileSelected($event)"
      accept="image/*"
      capture="environment"
    />

    <!-- Botón para abrir la galeróa -->
    <iw-button
      iconClass="mdi:image"
      severity="secondary"
      variant="outlined"
      (clicked)="galleryInput.click()"
    />
    <input
      #galleryInput
      type="file"
      class="hidden"
      (change)="onFileSelected($event)"
      accept="image/*"
      multiple
    />
  </div>

  <!-- Imógenes seleccionadas antes de enviar -->
  <h6 class="text-primary">🆕 Nuevas imógenes:</h6>
  <div class="grid">
    @for (image of newImages; track image; let i = $index) {
    <div class="col-4 md:col-2 relative">
      <img
        [src]="image.url ? image.url : 'assets/images/default-avatar.png'"
        class="w-full border-round border-1 surface-border shadow-1"
        
        alt="Imagen seleccionada"
      />
      <iw-button
        iconClass="mdi:delete"
        lxTooltip="Eliminar" tooltipPosition="bottom"
        severity="danger"
        size="sm"
        variant="ghost-text"
        customClass="absolute top-0 right-0"
        (clicked)="removeNewImage(i)"
      />
    </div>
    }
  </div>

  <!-- Imógenes ya almacenadas en el backend -->
  <h6 class="mt-3" >💾 Imógenes almacenadas:</h6>
  <div class="grid">
    @for (image of existingImages; track image) {
    <div class="col-4 md:col-2 relative">
      <img
        [src]="image.photoPath ? image.photoPath : 'assets/images/default-avatar.png'"
        class="w-full border-round border-1 surface-border shadow-1"
        
        alt="Imagen subida"
      />
      <iw-button
        iconClass="mdi:close"
        severity="danger"
        size="sm"
        variant="ghost-text"
        customClass="absolute top-0 right-0"
        (clicked)="deleteExistingImage(image.id)"
      />
    </div>
    }
  </div>

  <!-- Botón para guardar imógenes nuevas -->
  <div class="text-center mt-4">
    <il-button
      label="Guardar imógenes"
      iconClass="mdi:content-save"
      variant="outlined"
      (clicked)="onSaveImages()"
    />
  </div>
</div>
