<div class="card">
  <div class="card-body">
    <!-- Error Display -->
    @if (loadError()) {
    <div
      class="p-4 mb-4 bg-surface rounded-md border-1 border-danger-600 text-danger-600"
      role="alert"
      aria-live="polite"
      aria-atomic="true"
    >
      <strong class="text-body-md">Error:</strong>
      <p class="text-body-sm m-0 mt-2">{{ loadError() }}</p>
    </div>
    }

    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <!-- Campo Nombre -->
      <custom-input-text-signal
        [control]="form.controls.name"
        label="Nombre de la Inspección *"
        placeholder="Nombre de la Inspección"
        aria-required="true"
      />

      <custom-input-select-signal
        [control]="form.controls.departament"
        label="Departamento *"
        [data]="cb_departament()"
        [filter]="true"
      />

      <!-- Selector de Frecuencia -->
      <custom-input-select-signal
        id="frequency"
        [control]="form.controls.frequency"
        label="Frecuencia *"
        [data]="frequencyOptions"
        optionLabel="label"
        optionValue="value"
        (selectionChange)="onFrequencyChange($event.value)"
        [horizontal]="true"
        placeholder="Seleccione una frecuencia"
        [filter]="true"
      />

      <!-- Opciones de Frecuencia -->
      @if (selectedFrequency() === 'weekly') {
      <fieldset class="grid align-items-start mb-3">
        <legend class="col-12 md:col-3 font-medium mb-2 md:mb-0"
          >Días de la semana *</legend
        >
        <div class="col-12 md:col-9 flex flex-wrap gap-2 md:gap-3">
          @for (day of weekDays; track day.value) {
          <custom-input-check-signal
            [control]="getDayControl(day.key)"
            [label]="day.label"
          />
          }
        </div>
      </fieldset>
      } @if (selectedFrequency() === 'monthly') {
      <div class="grid mb-3 align-items-center">
        <label for="dayOfMonth" class="col-12 md:col-3 font-medium"
          >Día del Mes</label
        >
        <div class="col-12 md:col-9">
          <custom-input-number-signal
            [control]="form.controls.dayOfMonth"
            placeholder="Ingrese el día (1-31)"
            [min]="1"
            [max]="31"
            [horizontal]="false"
          />
        </div>
      </div>
      }

      <!-- Selector de Activo -->
      <custom-input-select-signal
        id="isActive"
        [control]="form.controls.isActive"
        label="Activa *"
        [data]="activeStatusOptions"
        optionLabel="label"
        optionValue="value"
        [horizontal]="true"
        [filter]="true"
      />

      <il-button-save
        [propertyId]="id"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </form>
  </div>
</div>
