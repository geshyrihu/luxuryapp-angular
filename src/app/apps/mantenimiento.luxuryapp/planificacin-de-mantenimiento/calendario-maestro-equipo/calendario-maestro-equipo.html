<!-- 🖥️ INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<div class="hidden md:block"></div>
<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption
      [title]="'Equipos Calendario Maestro'"
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="nombreEquipo">
        Nombre Equipo
        <p-sorticon field="nombreEquipo" />
      </th>
      <th pSortableColumn="equipoClasificacion">
        Clasificación
        <p-sorticon field="equipoClasificacion" />
      </th>
      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.nombreEquipo }}</td>
      <td>{{ item.equipoClasificacion }}</td>
      <!-- Opciones -->

      <td class="no-print">
        <div class="flex">
          <iw-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <iw-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="3" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- 📱 MOBILE -->
<app-data-view-mobile
  [data]="dataSignal()"
  [showAdd]="true"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
  (add)="onModalForm({ id: 0, title: 'Nuevo Registro' })"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <p class="font-semibold m-0 text-color">{{ item.nombreEquipo }}</p>
      <p class="text-xs m-0 text-color-secondary">{{ item.equipoClasificacion }}</p>

      <ili-action-menu end>
        <ng-container actions>
          <ili-button-edit (clicked)="onModalForm({ id: item.id, title: 'Editar' })" />
          <ili-button-delete (confirmed)="onDelete(item.id)" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
