@if (dataSignal()) {
<p-table
  [globalFilterFields]="globalFilterFields"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card hidden md:block"
>
  <ng-template #caption>
    <div class="grid align-items-center">
      <div class="col-12 sm:col-5">
        <app-rango-calendario-yyyymmdd />
      </div>
      <div class="col-12 sm:col-7">
        <primeng-custom-caption
          [title]="nameMachinery"
          [showAdd]="false"
          [dt]="dt"
        />
      </div>
    </div>
  </ng-template>
  <ng-template #body let-item>
    <div class="card surface-100 mb-2 border-1 surface-border">
      <div class="card-header border-bottom-1 surface-border p-2">
        <p class="m-0 font-bold">
          {{ item.fechaRegistro | date : "fullDate" }}, {{ item.fechaRegistro |
          date : "shortTime" }}
        </p>
      </div>
      <div class="card-body p-3">
        <p class="m-0 font-italic text-justify">{{ item.descripcion }}</p>
        <p
          class="text-right text-sm cursor-pointer text-primary mt-2 m-0"
          (click)="onCardEmployee(item.applicationUserId)"
        >
          {{ item.userName }}
        </p>
      </div>
    </div>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- 📱 MOBILE -->
<app-data-view-mobile
  [data]="dataSignal()"
  [showAdd]="false"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <div customFilters>
    <div class="px-2 pb-2">
      <app-rango-calendario-yyyymmdd />
    </div>
  </div>
  <ng-template #listItemTemplate let-item>
    <ili-list-item (click)="onCardEmployee(item.applicationUserId)">
      <p class="font-semibold m-0 text-color">{{ item.descripcion }}</p>
      <p class="text-xs m-0 text-color-secondary">{{ item.fechaRegistro | date:'short' }} · {{ item.userName }}</p>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
}
