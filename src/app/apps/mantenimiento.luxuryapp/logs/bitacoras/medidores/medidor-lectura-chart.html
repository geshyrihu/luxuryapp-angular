<!-- 📱 Segmento para Alternar Vistas -->
<div class="flex gap-2 mb-3 bg-surface-100 p-1 border-round">
  <button class="p-button p-button-text p-button-sm flex-1" (click)="onSegmentChange('day')">
    <span class="">Diario</span>
  </button>
  <button class="p-button p-button-text p-button-sm flex-1" (click)="onSegmentChange('month')">
    <span class="">Mensual</span>
  </button>
</div>

<!-- 🎛️ Filtros Condicionales -->
<div>
  <!-- Filtro Mensual -->
  @if (ViewMonth) {
  <div>
    <div class="m-0 shadow-none surface-card border-1 border-surface-200">
      <div class="border-1 surface-border shadow-1 border-round-xl">
        <div class="text-center font-bold mb-2">Seleccionar Rango Mensual</div>
        <app-calendar-range></app-calendar-range>
      </div>
    </div>
  </div>
  }

  <!-- Filtro Diario -->
  @if (ViewDay) {
  <div>
    <div class="m-0 shadow-none surface-card border-1 border-surface-200">
      <div class="border-1 surface-border shadow-1 border-round-xl">
        <div class="text-center font-bold mb-2">Seleccionar Rango Diario</div>
        <app-rango-calendario-yyyymmdd
          [mostrartextHasta]="false"
          [mostrartextDesde]="false"
        ></app-rango-calendario-yyyymmdd>
      </div>
    </div>
  </div>
  }
</div>

<!-- 📊 Gráfico -->
@if (data !== undefined) {
<div class="mt-3">
  <div class="border-1 surface-border shadow-1 border-round-xl">
    <div
      echarts
      [options]="chartOption()"
      
    ></div>
  </div>
</div>
}
