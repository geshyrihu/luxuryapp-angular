<div class="card">
  <div class="card-body">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <div class="grid">
        <!-- Columna izquierda: datos del camion y tiempos -->
        <div class="col-12 md:col-6">
          <custom-input-text-signal
            [control]="form.controls.placasCamion"
            label="Placas del camion"
            placeholder="Ej. ABC-1234"
          />

          <custom-input-text-signal
            [control]="form.controls.empresa"
            label="Empresa"
            placeholder="Nombre de la empresa proveedora"
          />

          <custom-input-date-time-native
            [control]="form.controls.horaLlegada"
            label="Hora de llegada"
            [required]="true"
          />

          <custom-input-date-time-native
            [control]="form.controls.horaTermino"
            label="Hora de termino"
          />

          <custom-input-decimal-signal
            [control]="form.controls.capacidadPipa"
            label="Capacidad de la pipa (litros)"
            [minFractionDigits]="0"
            [maxFractionDigits]="0"
          />
        </div>

        <!-- Columna derecha: lecturas y niveles -->
        <div class="col-12 md:col-6">
          <custom-input-decimal-signal
            [control]="form.controls.nivelCisternaAntes"
            label="Nivel cisterna antes"
            [minFractionDigits]="2"
            [maxFractionDigits]="2"
          />
          <custom-input-decimal-signal
            [control]="form.controls.nivelCisternaDespues"
            label="Nivel cisterna despues"
            [minFractionDigits]="2"
            [maxFractionDigits]="2"
          />
          <custom-input-decimal-signal
            [control]="form.controls.lecturaMedidorInicial"
            label="Lectura medidor inicial"
            [minFractionDigits]="4"
            [maxFractionDigits]="4"
          />
          <custom-input-decimal-signal
            [control]="form.controls.lecturaMedidorFinal"
            label="Lectura medidor final"
            [minFractionDigits]="4"
            [maxFractionDigits]="4"
          />
          <custom-input-decimal-signal
            [control]="form.controls.costoMetroCubico"
            label="Costo por metro cubico"
            [minFractionDigits]="2"
            [maxFractionDigits]="4"
          />
        </div>
      </div>

      <!-- Firmas de recepcion -->
      <div class="grid mb-2">
        <div class="col-12 md:col-6">
          <custom-input-autocomplete-signal
            (propagar)="saveColaboradorMtto($event)"
            [control]="form.controls.colaboradorMtto"
            [data]="cb_empleados()"
            label="Colaborador de mantenimiento"
            placeholder="Buscar colaborador que recibe"
          />
        </div>
        <div class="col-12 md:col-6">
          <custom-input-text-signal
            [control]="form.controls.guardiaSeguridad"
            label="Guardia de seguridad testigo"
            placeholder="Nombre del guardia testigo"
          />
        </div>
      </div>

      <!-- Seccion de fotografias -->
      <div class="mt-3 mb-2">
        <p class="font-semibold text-sm mb-2">Fotografias de evidencia</p>
        <div class="grid">
          <div class="col-12 md:col-4">
            <p class="text-xs text-500 mb-1">Pipa llena</p>
            <div class="card text-center p-2">
              <custom-input-img-signal
                [control]="form.controls.fotoPipaLlena"
                [urlImgCurrent]="urlFotoPipaLlena()"
                [contentHeight]="80"
                [contentWidth]="80"
                [allowRemove]="true"
                label=""
              />
            </div>
          </div>
          <div class="col-12 md:col-4">
            <p class="text-xs text-500 mb-1">Pipa vacia</p>
            <div class="card text-center p-2">
              <custom-input-img-signal
                [control]="form.controls.fotoPipaVacia"
                [urlImgCurrent]="urlFotoPipaVacia()"
                [contentHeight]="80"
                [contentWidth]="80"
                [allowRemove]="true"
                label=""
              />
            </div>
          </div>
          <div class="col-12 md:col-4">
            <p class="text-xs text-500 mb-1">INE del chofer</p>
            <div class="card text-center p-2">
              <custom-input-img-signal
                [control]="form.controls.fotoIneChofer"
                [urlImgCurrent]="urlFotoIneChofer()"
                [contentHeight]="80"
                [contentWidth]="80"
                [allowRemove]="true"
                label=""
              />
            </div>
          </div>
          <div class="col-12 md:col-4">
            <p class="text-xs text-500 mb-1">Placas del camion</p>
            <div class="card text-center p-2">
              <custom-input-img-signal
                [control]="form.controls.fotoPlacas"
                [urlImgCurrent]="urlFotoPlacas()"
                [contentHeight]="80"
                [contentWidth]="80"
                [allowRemove]="true"
                label=""
              />
            </div>
          </div>
          <div class="col-12 md:col-4">
            <p class="text-xs text-500 mb-1">Medidor antes</p>
            <div class="card text-center p-2">
              <custom-input-img-signal
                [control]="form.controls.fotoMedidorAntes"
                [urlImgCurrent]="urlFotoMedidorAntes()"
                [contentHeight]="80"
                [contentWidth]="80"
                [allowRemove]="true"
                label=""
              />
            </div>
          </div>
          <div class="col-12 md:col-4">
            <p class="text-xs text-500 mb-1">Medidor despues</p>
            <div class="card text-center p-2">
              <custom-input-img-signal
                [control]="form.controls.fotoMedidorDespues"
                [urlImgCurrent]="urlFotoMedidorDespues()"
                [contentHeight]="80"
                [contentWidth]="80"
                [allowRemove]="true"
                label=""
              />
            </div>
          </div>
          <div class="col-12 md:col-4">
            <p class="text-xs text-500 mb-1">Nivel antes</p>
            <div class="card text-center p-2">
              <custom-input-img-signal
                [control]="form.controls.fotoNivelAntes"
                [urlImgCurrent]="urlFotoNivelAntes()"
                [contentHeight]="80"
                [contentWidth]="80"
                [allowRemove]="true"
                label=""
              />
            </div>
          </div>
          <div class="col-12 md:col-4">
            <p class="text-xs text-500 mb-1">Nivel despues</p>
            <div class="card text-center p-2">
              <custom-input-img-signal
                [control]="form.controls.fotoNivelDespues"
                [urlImgCurrent]="urlFotoNivelDespues()"
                [contentHeight]="80"
                [contentWidth]="80"
                [allowRemove]="true"
                label=""
              />
            </div>
          </div>
          <div class="col-12 md:col-4">
            <p class="text-xs text-500 mb-1">Nota</p>
            <div class="card text-center p-2">
              <custom-input-img-signal
                [control]="form.controls.fotoNota"
                [urlImgCurrent]="urlFotoNota()"
                [contentHeight]="80"
                [contentWidth]="80"
                [allowRemove]="true"
                label=""
              />
            </div>
          </div>
        </div>
      </div>

      <il-button-save
        [propertyId]="id"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </form>
  </div>
</div>
