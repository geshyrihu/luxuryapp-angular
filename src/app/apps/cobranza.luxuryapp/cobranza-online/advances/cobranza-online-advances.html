<section class="flex flex-column gap-3">
  @if (!hasCustomer()) {
  <div class="surface-card border-1 surface-border rounded p-3">
    <div class="font-medium mb-2">Sin cliente activo</div>
    <div class="text-color-secondary">
      Selecciona un cliente para consultar los saldos a favor.
    </div>
  </div>
  } @else {
  <div class="mb-2 mt-1">
    <div class="text-lg font-semibold text-color">Reporte de Anticipos</div>
    <div class="text-sm text-color-secondary">Condminos con saldo a favor al corte del periodo.</div>
  </div>
  <div class="grid">
    <div class="col-12 md:col-4">
      <app-stat-card
        orientation="horizontal"
        label="Total a favor"
        [value]="totalAFavor()"
        format="currency"
        icon="mdi:cash-plus"
        iconColor="var(--ds-success)"
        iconBg="var(--ds-success-light)"
        [subtitle]="condominosConSaldo() + ' condóminos con saldo a favor'"
      />
    </div>
    <div class="col-12 md:col-4">
      <app-stat-card
        orientation="horizontal"
        label="Anticipo promedio"
        [value]="promedio()"
        format="currency"
        icon="mdi:chart-line-variant"
        iconColor="var(--ds-info)"
        iconBg="var(--ds-info-light)"
        subtitle="Por condómino con saldo a favor"
      />
    </div>
    <div class="col-12 md:col-4">
      <app-stat-card
        orientation="horizontal"
        label="A favor en mantenimiento"
        [value]="totalMtto()"
        format="currency"
        icon="mdi:home-city-outline"
        iconColor="var(--ds-primary)"
        iconBg="var(--ds-primary-light)"
        [subtitle]="subtituloMtto()"
      />
    </div>
  </div>

  <app-ranked-list
    heading="Saldos a favor"
    [items]="items()"
    [total]="totalAFavor()"
    accent="var(--ds-success)"
    maxHeight="34rem"
    emptyMessage="Ningún condómino tiene saldo a favor al corte."
    (itemSelected)="showDetails($event)"
  />

  <p class="m-0 text-xs text-color-secondary">
    Importes mostrados como haber del condómino. El desglose por concepto se
    consulta con un clic en cada renglón.
  </p>
  }
</section>
