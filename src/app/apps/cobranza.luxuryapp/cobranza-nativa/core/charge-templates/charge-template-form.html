<form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-3">
  <custom-input-select-signal
    [control]="form.controls.chargeTypeId"
    [data]="chargeTypes()"
    optionLabel="label"
    optionValue="value"
    label="Tipo de Cargo"
    [filter]="true"
    required
  />
  <custom-input-select-signal
    [control]="form.controls.calculationMethod"
    [data]="calculationMethods"
    optionLabel="label"
    optionValue="value"
    label="Método de Cálculo"
    [filter]="true"
    required
  />

  <custom-input-text-signal
    [control]="form.controls.name"
    label="Nombre de la Plantilla"
    hint="Ej: Cuota Ordinaria 2026, Fondo de Reserva Q1"
    required
  />
  <custom-input-currency-signal
    [control]="form.controls.amount"
    label="Cuota Mensual Total"
    required
  />

  <div class="flex flex-wrap">
    <custom-input-select-signal
      [control]="form.controls.recurrence"
      [data]="recurrenceOptions"
      optionLabel="label"
      optionValue="value"
      label="Recurrencia"
      [filter]="true"
      required
    />

    <custom-input-number-signal
      [control]="form.controls.dayOfMonth"
      [min]="1"
      [max]="31"
      label="Día del Mes"
      required
    />
  </div>

  <custom-input-date-signal
    [control]="form.controls.startDate"
    label="Inicio de Vigencia"
    required
  />
  <custom-input-date-signal
    [control]="form.controls.endDate"
    label="Fin de Vigencia (Opcional)"
  />

  <custom-input-currency-signal
    [control]="form.controls.earlyPaymentDiscount"
    label="Descuento (Opcional)"
  />
  <custom-input-select-signal
    [control]="form.controls.earlyPaymentDiscountType"
    [data]="discountTypes"
    optionLabel="label"
    optionValue="value"
    label="Tipo Descuento"
    [filter]="true"
    [showClear]="true"
  />
  <custom-input-number-signal
    [control]="form.controls.earlyPaymentGraceDays"
    [min]="0"
    label="Días de Gracia"
  />

  <custom-input-check-signal
    [control]="form.controls.applyToAllProperties"
    label="Aplicar a todas las propiedades"
  />

  <lx-card class="card card--elevated mb-4 mt-2">
    <custom-input-check-signal
      [control]="form.controls.isRetroactive"
      label="Aplica cobro retroactivo (Opción C: Ajuste Diferencial)"
    />

    @if (form.controls.isRetroactive.value) {
    <div class="mt-3">
      <custom-input-date-signal
        [control]="form.controls.retroactiveStartDate"
        label="Fecha Inicial del Retroactivo"
        hint="Se ajustará la diferencia de los meses cobrados previamente."
        required
      />
    </div>
    }
  </lx-card>

  <custom-input-check-signal [control]="form.controls.isActive" label="Activo" />

  <div class="flex justify-content-end mt-4">
    <il-button-save [disabled]="form.invalid" [submitting]="submitting()" />
  </div>
</form>
