<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column">
  @if (isSystem()) {
  <lx-card class="card card--elevated mb-3">
    <div class="font-semibold mb-1">Tipo del sistema</div>
    <div class="text-sm text-700 line-height-3">
      Este tipo base ya participa en procesos automáticos. Puedes ajustar su
      nombre y descripción, pero su código queda protegido.
    </div>
  </lx-card>
  }

  <custom-input-text-signal
    [control]="form.controls.name"
    label="Nombre"
    placeholder="Ej: Cuota de mantenimiento"
    required
  />

  <custom-input-text-signal
    [control]="form.controls.code"
    label="Código"
    placeholder="Ej: 001"
    [readonly]="isSystem()"
    required
  />

  <custom-input-textarea-signal
    [control]="form.controls.description"
    label="Descripción"
    placeholder="Describe cuando se usa este tipo de cargo."
    [rows]="4"
  />

  <div class="flex justify-content-end mt-4">
    <il-button-save
      [disabled]="form.invalid || submitting()"
      [submitting]="submitting()"
    />
  </div>
</form>
