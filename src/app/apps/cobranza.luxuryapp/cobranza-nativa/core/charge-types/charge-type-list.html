<div class="card p-0 md:p-4">
  <p-table
    [value]="dataSignal()"
    [paginator]="true"
    [rows]="tablePrimeNgRows"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [scrollable]="true"
    [scrollHeight]="scrollHeight()"
    class="custom-table hidden md:block"
    #dt
  >
    <ng-template #caption>
      <primeng-custom-caption
        title="Tipos de Cargo"
        (add)="onModalForm()"
        [dt]="dt"
      />
    </ng-template>

    <ng-template #header>
      <tr>
        <th class="w-14rem">Nombre</th>
        <th class="w-10rem">Código / Cuenta</th>
        <th>Descripción</th>
        <th class="w-8rem text-center">Origen</th>
        <th class="w-8rem text-center">Opciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-item>
      <tr>
        <td class="font-semibold text-800">{{ item.name }}</td>
        <td>
          <span class="font-mono text-sm text-primary">{{ item.code }}</span>
        </td>
        <td class="text-600">{{ item.description || "Sin descripción" }}</td>
        <td class="text-center">
          <lx-tag
            [value]="originMeta(item.isSystem).label"
            [severity]="originMeta(item.isSystem).severity"
          />
        </td>
        <td class="text-center">
          <div class="flex justify-content-center align-items-center gap-2">
            <iw-button-edit (clicked)="onModalForm(item.id)" />
            @if (!item.isSystem) {
            <iw-button-delete (customClick)="onDelete(item)" />
            } @else {
            <span class="text-xs text-500">Protegido</span>
            }
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <primeng-custom-table-emptymessage
        [colspan]="5"
        icon="material-symbols-light:category"
        title="Sin tipos de cargo"
        message="Los tipos base aparecerán aquí y desde esta pantalla podrás agregar tipos personalizados."
      />
    </ng-template>
  </p-table>
</div>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="['name', 'code', 'description']"
  (add)="onModalForm()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="w-2rem h-2rem rounded-lg bg-blue-100 flex align-items-center justify-content-center flex-shrink-0 ml-3"
      >
        <app-icon icon="material-symbols-light:category" class="text-blue-700 text-xl" />
      </div>
      <div class="flex-1 min-w-0">
        <h3>{{ item.name }}</h3>
        <p>{{ item.code }}</p>
        <p>{{ originMeta(item.isSystem).label }}</p>
      </div>
      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit (clicked)="onModalForm(item.id)" label="Editar" />
          @if (!item.isSystem) {
          <ili-button-delete (confirmed)="onDelete(item)" label="Eliminar" />
          }
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
