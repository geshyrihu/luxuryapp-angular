<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="ePosicionComite">
        <p class="card-title">Posición</p>
        <p-sorticon field="ePosicionComite" />
      </th>
      <th pSortableColumn="nameProperty">
        <p class="card-title">Nombre</p>
        <p-sorticon field="nameProperty" />
      </th>
      <th pSortableColumn="departamento">
        <p class="card-title">Departamento</p>
        <p-sorticon field="departamento" />
      </th>
      <th pSortableColumn="email">
        <p class="card-title">Correo</p>
        <p-sorticon field="email" />
      </th>
      <th>
        <p class="card-title">Celular</p>
      </th>

      <th class="table-col-5">
        <p class="card-title">Opciones</p>
      </th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <p class="card-title">{{ item.posicionComite }}</p>
      </td>
      <td>
        <p class="card-title">{{ item.nameProperty }}</p>
      </td>
      <td>
        <p class="card-title">{{ item.departamento }}</p>
      </td>
      <td>
        <p class="card-title">{{ item.email }}</p>
      </td>
      <td>
        <p class="card-title">{{ item.celular }}</p>
      </td>
      <!-- Opciones -->

      <td class="no-print">
        <div class="flex">
          <iw-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <iw-button-delete (confirmed)="onDelete(item.id)" />

          <iw-button-send-email
            confirmMessage="Enviar usuario y contraseóa de acceso."
            (confirmed)="onSendCredential(item.id)"
          />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!--📲INICIO: Componente adaptado para versión mívil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
  trackByProperty="id"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 rounded-lg"
        class="w-3rem h-3rem bg-primary-50"
      >
        <app-icon
          icon="mdi:account-group-outline"
          class="text-xl text-primary"
        />
      </div>

      <h2 class="font-normal m-0">{{ item.nameProperty }}</h2>
      <p class="text-medium text-500 m-0">
        {{ item.ePosicionComite }} | {{ item.departamento }}
      </p>
      <p class="text-medium text-500 m-0">{{ item.email }}</p>
      <p class="text-medium text-500 m-0">{{ item.celular }}</p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
          <ili-button-send-email
            confirmMessage="Enviar usuario y contraseóa de acceso."
            (confirmed)="onSendCredential(item.id)"
            label="Enviar"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
