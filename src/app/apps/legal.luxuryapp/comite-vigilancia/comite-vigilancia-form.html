<div class="card">
  <div class="card-body">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <custom-input-text-signal
        [control]="form.controls.id"
        hidden
        label="Id"
        [readonly]="true"
      />

      <custom-input-select-signal
        [control]="form.controls.ePosicionComite"
        label="Posicion"
        [data]="cb_position()"
        [filter]="true"
      />

      <custom-input-autocomplete-signal
        (propagar)="saveCondominoId($event)"
        [control]="form.controls.nameProperty"
        [data]="cb_condomino()"
        label="Nombre"
        placeholder="Escribe para buscar propiedad"
      />

      <il-button-save
        [propertyId]="id"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </form>
  </div>
</div>
