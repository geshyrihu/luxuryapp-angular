@if (platformS.isMobile()) {
  <app-solicitud-compra-list-mobile
    [data]="data()"
    [globalFilterFields]="globalFilterFields"
    [isPendingView]="isPendingView()"
    [isAuthorizedView]="isAuthorizedView()"
    [selectedSolicitudIds]="selectedSolicitudIds()"
    (add)="onSolicitudCompra(0)"
    (toggleSelection)="onToggleSelection($event.id, $event.checked)"
    (edit)="onSolicitudCompra($event)"
    (authorizationDetail)="onAuthorizationDetail($event)"
    (desauthorize)="onDesauthorize($event)"
    (delete)="onDelete($event)"
    (presentationMode)="onPresentationMode()"
  />
} @else {
  <app-solicitud-compra-list-desktop
    [data]="data()"
    [globalFilterFields]="globalFilterFields"
    [statusCompra]="statusCompra()"
    [isPendingView]="isPendingView()"
    [isAuthorizedView]="isAuthorizedView()"
    [selectedSolicitudIds]="selectedSolicitudIds()"
    (add)="onSolicitudCompra(0)"
    (selectStatus)="onSelectStatus($event); statusCompra.set($event)"
    (presentationMode)="onPresentationMode()"
    (manageLinks)="onManageLinks()"
    (toggleAllVisible)="onToggleAllVisible($event)"
    (toggleSelection)="onToggleSelection($event.id, $event.checked)"
    (rowReorder)="onRowReorder($event)"
    (cuadroComparativo)="onCuadroComparativo($event)"
    (viewPurchaseOrder)="onViewPurchaseOrder($event)"
    (unlinkPurchaseOrder)="onUnlinkPurchaseOrder($event)"
    (authorizationDetail)="onAuthorizationDetail($event)"
    (desauthorize)="onDesauthorize($event)"
    (edit)="onSolicitudCompra($event)"
    (delete)="onDelete($event)"
  />
}
