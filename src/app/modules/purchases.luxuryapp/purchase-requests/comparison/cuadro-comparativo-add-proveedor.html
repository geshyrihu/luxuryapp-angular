<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-text-signal
    [control]="form.controls.nameProvider"
    label="Proveedor"
    placeholder="nombre de proveedor"
  />
  <lux-input-date-signal
    [control]="form.controls.fechaCotizacion"
    label="Fecha de cotización"
    placeholder="fecha de cotización"
  />

  <lux-input-number-signal
    [control]="form.controls.numeroCotizacion"
    label="Número de cotización"
    placeholder="Número de cotización"
  />

  <lux-input-text-signal
    [control]="form.controls.garantia"
    label="Garantía"
    placeholder="Ej: 1 año"
  />
  <lux-input-text-signal
    [control]="form.controls.entrega"
    label="Tiempo de entrega"
    placeholder="Ej: 3 días"
  />
  <lux-input-text-signal
    [control]="form.controls.politicaPago"
    label="Política de pago"
    placeholder="Ej: Contado"
  />

  <lux-input-file-signal
    [control]="form.controls.file"
    [accept]="'.pdf'"
    label="Adjuntar Cotización (PDF)"
  />

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    label="Guardar"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
