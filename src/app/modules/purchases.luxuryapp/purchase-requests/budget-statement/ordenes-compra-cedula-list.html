@if (platformS.isMobile()) {
  <app-ordenes-compra-cedula-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFieldsOption()"
    [pagadas]="pagadas()"
    [noPagadas]="noPagadas()"
    (viewOrder)="onOrdenCompraModal($event)"
  />
} @else {
  <app-ordenes-compra-cedula-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFieldsOption()"
    [pagadas]="pagadas()"
    [noPagadas]="noPagadas()"
    (viewOrder)="onOrdenCompraModal($event)"
  />
}
