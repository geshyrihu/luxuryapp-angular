<lux-input-autocomplete-signal
  (propagar)="saveProviderId($event)"
  [control]="providerControl"
  [data]="cb_providers()"
  label="Proveedor"
  placeholder="Escribir para buscar proveedor"
/>

<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-date-signal
    [control]="form.controls.fechaSolicitud"
    label="Fecha de solicitud"
    placeholder="fecha de solicitud"
  />

  <lux-input-textarea-signal
    [control]="form.controls.equipoOInstalacion"
    label="Area"
    placeholder="area"
  />

  <lux-input-textarea-signal
    [control]="form.controls.justificacionGasto"
    label="Justificación"
    placeholder="justificación"
  />

  <lux-input-textarea-signal
    [control]="form.controls.notasEspeciales"
    label="Notas Especiales"
    placeholder="Notas especiales"
  />

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    label="Guardar"
    [disabled]="form.invalid || !providerId()"
    [loading]="submitting()"
  />
</form>
