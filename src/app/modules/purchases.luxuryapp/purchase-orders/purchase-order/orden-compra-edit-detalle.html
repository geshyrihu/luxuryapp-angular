<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-text-signal
    [control]="form.controls.id"
    hidden
    label="Id"
    [readonly]="true"
    hidden
  />

  <lux-input-text-signal
    hidden
    [control]="form.controls.productoId"
    label="ProductoId"
  />

  <lux-input-number-signal
    [control]="form.controls.cantidad"
    label="Cantidad"
    placeholder="cantidad"
  />

  <lux-input-select-signal
    [control]="form.controls.unidadMedidaId"
    label="Unidad"
    [data]="cb_unidadMedida"
    [filter]="true"
  />

  <lux-input-currency-signal
    [control]="form.controls.precio"
    label="Precio"
    placeholder="precio"
    [minFractionDigits]="0"
    [maxFractionDigits]="4"
  />

  <lux-input-decimal-signal
    [control]="form.controls.descuento"
    label="Descuento"
    placeholder="descuento"
  />

  <lux-input-decimal-signal
    [control]="form.controls.ivaAplicado"
    label="Iva Aplicado"
    placeholder="iva aplicado"
  />

  <lux-input-decimal-signal
    [control]="form.controls.retencionIVAPorcentaje"
    label="Retención IVA (%)"
    placeholder="retención iva"
  />

  <lux-input-decimal-signal
    [control]="form.controls.retencionISRPorcentaje"
    label="Retención ISR (%)"
    placeholder="retención isr"
  />

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    [label]="id ? 'Actualizar' : 'Guardar'"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
