<div class="d-flex flex-column h-full">
  <h3 class="mt-0">Comprobantes de Pago</h3>

  <lux-table [value]="comprobantes()" class="p-datatable-sm mb-3">
    <ng-template #header>
      <tr>
        <th>Archivo</th>
        <th>Fecha Subida</th>
        <th class="text-center">Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      <tr>
        <td>{{ item.fileName }}</td>
        <td>{{ item.uploadDate | apiDate: "short" }}</td>
        <td class="text-center">
          <div class="d-flex justify-content-center">
            <lux-button-web
              displayMode="icon"
              iconClass="material-symbols-light:visibility-outline"
              [rounded]="true"
              [text]="true"
              (clicked)="viewFile(item.filePath, item.fileName)"
            />
            <lux-button-web
              kind="delete"
              displayMode="icon"
              severity="danger"
              variant="soft"
              size="sm"
              tooltip="Eliminar"
              ariaLabel="Eliminar"
              (clicked)="onDelete(item.id)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <lux-table-empty-message [colspan]="3" />
    </ng-template>
  </lux-table>

  <div class="mb-4">
    <label class="d-block mb-2 fw-bold">Subir Nuevo Comprobante</label>
    <custom-input-file-signal
      (fileSelected)="onFileChange($event)"
      [horizontal]="false"
    ></custom-input-file-signal>
  </div>

  <div class="d-flex justify-content-end mt-3">
    <lux-button-web
      label="Cerrar"
      iconClass="material-symbols-light:close"
      severity="secondary"
      (clicked)="close()"
    />
    <lux-button-web
      label="Subir"
      iconClass="material-symbols-light:upload"
      severity="primary"
      (clicked)="onAdd()"
      [disabled]="!file || submitting()"
    />
  </div>
</div>
