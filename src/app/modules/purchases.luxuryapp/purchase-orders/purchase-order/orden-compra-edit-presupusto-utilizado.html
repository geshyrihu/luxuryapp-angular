<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-text-signal
    [control]="form.controls.id"
    hidden
    label="Id"
    [horizontal]="false"
    [hidden]="true"
  />
  <lux-input-text-signal
    [control]="form.controls.ordenCompraId"
    [hidden]="true"
    [horizontal]="false"
  />

  <lux-input-text-signal
    [control]="form.controls.accountNumber"
    label="Código"
    placeholder="código"
    [readonly]="true"
  />
  <lux-input-text-signal
    [control]="form.controls.accountName"
    label="Nombre"
    placeholder="Nombre"
    [readonly]="true"
  />
  <lux-input-currency-signal
    [control]="form.controls.amount"
    label="Gasto"
    placeholder="gasto"
  />

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    [label]="id ? 'Actualizar' : 'Guardar'"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
