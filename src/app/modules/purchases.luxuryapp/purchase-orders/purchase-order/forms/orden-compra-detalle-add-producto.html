@if (mensajeError) {
<lux-message severity="error">Seleccione producto y unidad</lux-message>
} @if (dataSignal()) {
<lux-table
  (onLazyLoad)="loadDataLazy($event)"
  [globalFilterFields]="globalFilterFields()"
  [lazy]="true"
  [paginator]="true"
  [rows]="rows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [totalRecords]="totalRecords"
  [value]="formControls()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table"
>
  <ng-template #caption>
    <lux-table-caption
      [dt]="dt"
      [showAdd]="false"
      (search)="applyFilter($event)"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th>Imagen</th>
      <th appSortableColumn="producto">
        DESCRIPCIÓN
        <lux-sorticon-web field="producto" />
      </th>
      <th appSortableColumn="category">
        Categoría
        <lux-sorticon-web field="category" />
      </th>
      <th>Cantidad</th>
      <th>Unidad</th>
      <th appSortableColumn="precio">
        Precio
        <lux-sorticon-web field="precio" />
      </th>
      <th>Descuento</th>
      <th>IVA (%)</th>
      <th>Ret. IVA (%)</th>
      <th>Ret. ISR (%)</th>
      <th class="table-col-5">Agregar</th>
    </tr>
  </ng-template>
  <ng-template #body let-row let-i="rowIndex">
    <ng-container [formGroup]="row">
      <tr>
        <td
          class="table-col-10 pointer"
          (click)="onModalTarjetaProducto(row.value.productoId)"
        >
          <lux-avatar-web
            [image]="row.value.urlImagen
                      ? row.value.urlImagen
                      : 'assets/images/default-avatar.png'"
            styleClass="mr-2"
            size="large"
          />
        </td>
        <td
          class="pointer"
          (click)="onModalTarjetaProducto(row.value.productoId)"
        >
          {{ row.value.producto }}
        </td>
        <td>{{ dataSignal()?.items?.[i]?.category }}</td>
        <td>
          <custom-input-number-signal
            [control]="row.controls.cantidad"
            mode="decimal"
            [minFractionDigits]="0"
            [maxFractionDigits]="2"
            [horizontal]="false"
          />
        </td>
        <td>
          <custom-input-select-signal
            [control]="row.controls.unidadMedidaId"
            [data]="cb_unidadMedida"
            optionLabel="label"
            optionValue="value"
            placeholder="Selecciona una opción"
            [horizontal]="false"
            customClass="w-9rem"
            [filter]="true"
          />
        </td>
        <td>
          <custom-input-number-signal
            [control]="row.controls.precio"
            mode="currency"
            currency="MXN"
            locale="es-MX"
            [minFractionDigits]="0"
            [maxFractionDigits]="4"
            [horizontal]="false"
          />
        </td>
        <td>
          <custom-input-number-signal
            [control]="row.controls.descuento"
            mode="decimal"
            [minFractionDigits]="0"
            [maxFractionDigits]="4"
            [horizontal]="false"
          />
        </td>
        <td>
          <custom-input-number-signal
            [control]="row.controls.ivaAplicado"
            mode="decimal"
            [minFractionDigits]="0"
            [maxFractionDigits]="4"
            [horizontal]="false"
          />
        </td>
        <td>
          <custom-input-number-signal
            [control]="row.controls.retencionIVAPorcentaje"
            mode="decimal"
            [minFractionDigits]="0"
            [maxFractionDigits]="4"
            [horizontal]="false"
          />
        </td>
        <td>
          <custom-input-number-signal
            [control]="row.controls.retencionISRPorcentaje"
            mode="decimal"
            [minFractionDigits]="0"
            [maxFractionDigits]="4"
            [horizontal]="false"
          />
        </td>
        <td>
          <div class="d-flex justify-content-center">
            <lux-button-web
              kind="item"
              displayMode="icon"
              severity="secondary"
              variant="soft"
              icon="material-symbols-light:add"
              tooltip="Agregar"
              ariaLabel="Agregar"
              (clicked)="onSubmit(row)"
            />
          </div>
        </td>
      </tr>
    </ng-container>
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="formArray.getRawValue()" />
  </ng-template>
</lux-table>
}
