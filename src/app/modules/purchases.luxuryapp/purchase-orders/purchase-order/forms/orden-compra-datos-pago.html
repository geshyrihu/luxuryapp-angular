<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-autocomplete-signal
    (propagar)="saveProviderId($event)"
    [control]="form.controls.provider"
    [data]="cb_providers()"
    label="Nombre"
    dataListId="providerDatalistOptions"
    placeholder="Escribe para buscar proveedor"
  />

  <lux-input-select-signal
    [control]="form.controls.tipoGasto"
    label="Tipo de Gasto"
    [data]="cb_tipoGasto()"
    [filter]="true"
  />
  <lux-input-text-signal
    [control]="form.controls.reference"
    label="Referencia"
    placeholder="Referencia"
  />
  <lux-input-text-signal
    [control]="form.controls.cuentaClave"
    label="Cuenta/Clabe"
    placeholder="Cuenta/Clabe"
  />

  <hr />
  <p class="text-center fw-bold">Asignar Perñodo de Fondeo (Opcional)</p>

  <lux-input-select-signal
    [control]="form.controls.fundingYear"
    label="Año de Fondeo"
    [data]="cb_fundingYear()"
    optionLabel="label"
    optionValue="value"
    [showClear]="true"
    placeholder="Selecciona el Año"
    [horizontal]="true"
    customClass="w-100"
    [filter]="true"
  />

  <div class="row mt-2 mb-4 g-4">
    @for (month of fundingPeriodsByMonth(); track month.monthName) {
    <div class="col-12 col-sm-6 col-md-4 col-xl-3">
      <div
        class="bg-body border-1 border rounded p-3 h-full d-flex flex-column"
      >
        <div
          class="fw-bold text-body mb-2 border-bottom-1 border pb-2 text-center"
        >
          {{ month.monthName }}
        </div>
        <div class="d-flex gap-2 justify-content-center mt-auto">
          @for (quincena of month.quincenas; track quincena.value) {
          <lux-tag
            (click)="selectFundingPeriod(quincena)"
            [value]="quincena.label.split(' ')[0]"
            [severity]="form.controls.fundingPeriod.value === quincena.value ? 'success' : 'secondary'"
            class="cursor-pointer"
          />
          }
        </div>
      </div>
    </div>
    }
  </div>

  <hr />

  <lux-input-select-signal
    [control]="form.controls.usoCFDIId"
    label="Uso de CFDI"
    [data]="cb_usoCfdi()"
    [filter]="true"
  />

  <lux-input-select-signal
    [control]="form.controls.metodoDePagoId"
    label="Metodo de Pago"
    [data]="cb_payment_method()"
    [filter]="true"
  />

  <lux-input-select-signal
    [control]="form.controls.formaDePagoId"
    label="Forma de Pago"
    [data]="cb_formaPago()"
    [filter]="true"
  />
  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    label="Guardar"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
