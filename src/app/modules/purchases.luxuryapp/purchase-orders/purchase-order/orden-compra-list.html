@if (platformS.isMobile()) {
  <app-orden-compra-list-mobile
    [data]="data()"
    [globalFilterFields]="globalFilterFields()"
    [tiposDeGasto]="tiposDeGasto"
    [tipoGasto]="tipoGasto()"
    [statusCompra]="statusCompra()"
    (add)="onModalAdd()"
    (selectTipoGasto)="onSelectTipoGasto($event)"
    (selectStatus)="onSelectStatus($event)"
    (addOrEdit)="onAddOrEdit($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-orden-compra-list-desktop
    [data]="data()"
    [globalFilterFields]="globalFilterFields()"
    [customTitle]="customTitle()"
    [tiposDeGasto]="tiposDeGasto"
    [tipoGasto]="tipoGasto()"
    [statusCompra]="statusCompra()"
    (add)="onModalAdd()"
    (selectTipoGasto)="onSelectTipoGasto($event)"
    (selectStatus)="onSelectStatus($event)"
    (manageLinks)="onManageLinks()"
    (ordenCompraModal)="onOrdenCompraModal($event)"
    (addOrEdit)="onAddOrEdit($event)"
    (delete)="onDelete($event)"
    (downloadSolicitudPagoPdf)="onDownloadSolicitudPagoPdf($event)"
    (downloadOrdenCompraPdf)="onDownloadOrdenCompraPdf($event)"
  />
}
