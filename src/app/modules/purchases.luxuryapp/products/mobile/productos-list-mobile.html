<app-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [enablePagination]="true"
  (nextPage)="nextPage.emit($event)"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg w-3rem h-3rem bg-primary-50"
      >
        <app-icon
          icon="material-symbols-light:package"
          class="text-xl text-primary"
        />
      </div>

      <h2 class="font-normal m-0">{{ item.nombreProducto }}</h2>
      <p class="text-medium text-body-secondary m-0">
        {{ item.category }} | {{ item.marca }}
      </p>

      <ili-action-menu slot="end">
        <ng-container actions>
          @if ( canManage() || item.userid === accountId() ) {
          <ili-button-edit
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          }
          <ili-button-delete (confirmed)="delete.emit(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
