<div class="card">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <lux-input-img-signal
      (propagar)="form.controls.imagen.setValue($event)"
      [control]="form.controls.urlImagen"
    />

    <lux-input-text-signal
      [control]="form.controls.nombreProducto"
      label="Nombre del Producto"
      placeholder="nombre producto"
    />

    <lux-input-autocomplete-signal
      (propagar)="savecategoryId($event)"
      [control]="form.controls.category"
      [data]="cb_category()"
      label="Categoria"
      placeholder="Escribe para buscar categoria"
    />

    <lux-input-select-signal
      [control]="form.controls.clasificacion"
      [data]="cb_clasificacion()"
      label="Clasificación"
      dataListId="clasificacion"
      [filter]="true"
    />

    <lux-input-text-signal
      [control]="form.controls.marca"
      label="Marca"
      placeholder="marca"
    />
    <lux-input-text-signal
      [control]="form.controls.modelo"
      label="Modelo"
      placeholder="modelo"
    />

    <lux-button-web
      kind="save"
      type="submit"
      severity="info"
      variant="soft"
      displayMode="both"
      [label]="id() ? 'Actualizar' : 'Guardar'"
      [disabled]="form.invalid"
      [loading]="submitting()"
    />
  </form>
</div>
