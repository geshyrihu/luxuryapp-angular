@if (platformS.isMobile()) {
  <app-productos-list-mobile
    [data]="mobileDataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [accountId]="account_id"
    [canManage]="aspRoleS.hasAny([
      AspRole.JefeMantenimiento,
      AspRole.SuperUsuario,
      AspRole.Administrador
    ])"
    (add)="onModalForm($event)"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
    (nextPage)="loadNextPage($event)"
  />
} @else {
  <app-productos-list-desktop
    [data]="filteredDataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [scrollHeight]="scrollHeight"
    [accountId]="account_id"
    [canManage]="aspRoleS.hasAny([
      AspRole.JefeMantenimiento,
      AspRole.SuperUsuario,
      AspRole.Administrador
    ])"
    [showActionsColumn]="aspRoleS.hasAny([
      AspRole.Asistente,
      AspRole.JefeMantenimiento,
      AspRole.SuperUsuario,
      AspRole.Administrador
    ])"
    (add)="onModalForm($event)"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
}
