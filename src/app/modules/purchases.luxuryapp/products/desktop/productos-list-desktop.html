<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption
      [title]="'Productos'"
      (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="nombreProducto">
        Imagen
        <app-sorticon field="nombreProducto" />
      </th>
      <th appSortableColumn="nombreProducto">
        Nombre
        <app-sorticon field="nombreProducto" />
      </th>
      <th appSortableColumn="category">
        Categoria
        <app-sorticon field="category" />
      </th>
      <th appSortableColumn="marca">
        Marca
        <app-sorticon field="marca" />
      </th>
      <th appSortableColumn="modelo">
        Modelo
        <app-sorticon field="modelo" />
      </th>
      @if ( showActionsColumn() ) {
      <th class="table-col-5"></th>
      }
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td class="text-center">
        <img
          [src]="item.urlImagen"
          alt="."
          width="80px"
          height="70px"
          class="img-fluid img-thumbnail"
        />
      </td>
      <td>
        <span> {{ item.nombreProducto }} </span>
      </td>
      <td>
        <span>{{ item.category }}</span>
      </td>
      <td>
        <span>{{ item.marca }}</span>
      </td>
      <td>
        <span>{{ item.modelo }}</span>
      </td>
      <td class="no-print">
        <div class="d-flex">
          @if ( canManage() || item.userid === accountId() ) {
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          }
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            ariaLabel="Eliminar"
            (clicked)="delete.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
