<app-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  [showAdd]="false"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div start>
        <app-icon
          icon="material-symbols-light:check-circle-outline"
          class="text-xl text-green-500"
        />
      </div>
      <h3>{{ item.proveedor }}</h3>
      <p>Folio: {{ item.folio }} | {{ item.tipoOrdenLabel }}</p>
      <p>Factura: {{ item.factura }}</p>
      <p>
        Total: {{ item.total | number:'1.2-2' }} | {{ item.fechaSolicitud |
        apiDate }}
      </p>
      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit (clicked)="viewOrder.emit(item.id)" label="Ver" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
