<section class="card mb-3 p-3 p-md-4">
  <div class="d-flex flex-column gap-2">
    <div class="d-flex flex-column gap-1 mb-2">
      <h2 class="m-0 text-xl">Historial de Compras</h2>
      <small class="text-body-secondary">
        Consulta compras pagadas y filtra por tipo de compra, rango de fechas y
        tipo de orden.
      </small>
    </div>

    <div class="bg-body-tertiary border-1 border rounded p-3">
      <div class="row formgrid g-4">
        <div class="col-12 col-lg-3">
          <div class="d-flex flex-column gap-2 h-full">
            <div
              class="d-flex align-items-center justify-content-between gap-2"
            >
              <label class="text-sm fw-semibold">Rango de fechas</label>
              <button
                type="button"
                class="border-1 border bg-white rounded-md px-2 py-1 text-xs fw-medium text-body cursor-pointer"
                (click)="clearDateRange()"
              >
                Limpiar
              </button>
            </div>

            <div class="row g-4">
              <div class="col-12 col-md-6">
                <custom-input-date-signal
                  [control]="filterForm.controls.fechaInicio"
                  label="DESDE"
                  placeholder="DESDE"
                  [horizontal]="false"
                  [noMargin]="true"
                />
              </div>
              <div class="col-12 col-md-6">
                <custom-input-date-signal
                  [control]="filterForm.controls.fechaFin"
                  label="HASTA"
                  placeholder="HASTA"
                  [horizontal]="false"
                  [noMargin]="true"
                />
              </div>
            </div>

            <div class="d-flex flex-wrap gap-2">
              @for (preset of dateRangePresets; track preset.label) {
              <button
                type="button"
                class="border-1 border bg-white rounded-md px-2 py-1 text-xs fw-medium text-primary cursor-pointer"
                (click)="applyDatePreset(preset.mode, preset.days ?? 0)"
              >
                {{ preset.label }}
              </button>
              }
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-5">
          <div class="d-flex flex-column gap-3 h-full">
            <div class="d-flex flex-column gap-2">
              <label class="text-sm fw-semibold">Estado de pago</label>
              <lux-segmented-control
                ariaLabel="Filtro por estado de pago"
                [items]="estadoPagoOptions"
                [value]="selectedEstadoPago()"
                (valueChange)="selectedEstadoPago.set($event)"
              />
            </div>

            <div class="d-flex flex-column gap-2">
              <label class="text-sm fw-semibold">Tipo de compra</label>
              <lux-segmented-control
                ariaLabel="Filtro por tipo de compra"
                [items]="tipoCompraOptions"
                [value]="selectedTipoCompra()"
                (valueChange)="selectedTipoCompra.set($event)"
              />
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-4">
          <div class="d-flex flex-column gap-3 h-full">
            <div class="d-flex flex-column gap-2">
              <label class="text-sm fw-semibold">Estado de autorizacion</label>
              <lux-segmented-control
                ariaLabel="Filtro por estado de autorizacion"
                [items]="estadoAutorizacionOptions"
                [value]="selectedEstadoAutorizacion()"
                (valueChange)="selectedEstadoAutorizacion.set($event)"
              />
            </div>

            <div class="d-flex flex-column gap-2">
              <label class="text-sm fw-semibold">Tipo de orden</label>
              <lux-segmented-control
                ariaLabel="Filtro por tipo de orden"
                [items]="tipoOrdenOptions"
                [value]="selectedTipoOrden()"
                (valueChange)="selectedTipoOrden.set($event)"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

@if (platformS.isMobile()) {
  <app-historial-compras-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (viewOrder)="onViewOrder($event)"
  />
} @else {
  <app-historial-compras-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [loading]="loading()"
    (viewOrder)="onViewOrder($event)"
  />
}
