@if (platformS.isMobile()) {
<app-seguimiento-minutas-mobile
  [data]="dataSignal()"
  [statusFiltro]="statusFiltro"
  (filtrar)="onFiltrarData($event)"
  (todosSeguimientos)="onModalTodosSeguimientos($event)"
  (addSeguimiento)="onModalFormSeguimiento($event, 0)"
  (edit)="onModalFormMinutaDetalle($event)"
/>
} @else {
<app-seguimiento-minutas-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [statusFiltro]="statusFiltro"
  (filtrar)="onFiltrarData($event)"
  (todosSeguimientos)="onModalTodosSeguimientos($event)"
  (addSeguimiento)="onModalFormSeguimiento($event, 0)"
  (edit)="onModalFormMinutaDetalle($event)"
/>
}
