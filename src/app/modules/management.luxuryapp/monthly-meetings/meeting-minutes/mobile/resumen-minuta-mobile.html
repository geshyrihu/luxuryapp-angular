<div class="fadein resumen-minuta-page">
  <!-- 🏛️ CABECERA EJECUTIVA -->
  <div
    class="d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center gap-4 mb-5 g-4"
  >
    <div class="d-flex align-items-center gap-3">
      <div
        class="rounded-xl bg-primary shadow d-flex align-items-center justify-content-center"
      >
        <app-icon
          [icon]="'material-symbols-light:schedule'"
          class="text-white text-3xl"
        />
      </div>
      <div>
        <h2 class="text-3xl fw-bold m-0 text-body tracking-tight">
          Resumen de Minutas de Comité
        </h2>
        <p class="text-body-secondary m-0 mt-1 text-lg">
          Control de compromisos, acuerdos y seguimiento de requerimientos.
        </p>
      </div>
    </div>
  </div>

  <app-data-view-mobile [data]="data()" [showAdd]="false">
    <ng-template #listItemTemplate let-item>
      <ili-list-item>
        <p class="fw-semibold m-0 text-body">{{ item.title }}</p>
        <p class="text-xs m-0 text-body-secondary">
          {{ getSeverityText(item.status) }}
        </p>
      </ili-list-item>
    </ng-template>
  </app-data-view-mobile>
</div>
