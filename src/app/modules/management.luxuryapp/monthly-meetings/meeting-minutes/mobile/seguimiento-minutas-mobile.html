<!-- Mobile View -->
<lux-data-view-mobile [data]="data()" [showAdd]="false">
  <div customFilters>
    <div class="d-flex flex-wrap gap-1 p-2">
      <lux-button-web
        label="Pendientes"
        [severity]="statusFiltro() == 0 ? 'primary' : 'info'"
        [variant]="statusFiltro() != 0 ? 'text' : null"
        size="sm"
        (clicked)="filtrar.emit(0)"
      />
      <lux-button-web
        label="Concluidos"
        [severity]="statusFiltro() == 1 ? 'primary' : 'info'"
        [variant]="statusFiltro() != 1 ? 'text' : null"
        size="sm"
        (clicked)="filtrar.emit(1)"
      />
      <lux-button-web
        label="No Autorizados"
        [severity]="statusFiltro() == 2 ? 'primary' : 'info'"
        [variant]="statusFiltro() != 2 ? 'text' : null"
        size="sm"
        (clicked)="filtrar.emit(2)"
      />
      <lux-button-web
        label="Todos"
        [severity]="statusFiltro() == 4 ? 'primary' : 'info'"
        [variant]="statusFiltro() != 4 ? 'text' : null"
        size="sm"
        (clicked)="filtrar.emit(4)"
      />
    </div>
  </div>

  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg w-3rem h-3rem bg-primary-50"
      >
        <lux-icon
          icon="material-symbols-light:timeline"
          class="text-xl text-primary"
        />
      </div>

      <h2 class="fw-bold">{{ item.areaResponsable }}</h2>
      <p class="text-sm text-body-secondary">
        {{ item.fechaSolicitud }} {{ item.titulo }}
      </p>
      <div
        class="text-sm text-body-secondary my-1"
        [innerHTML]="item.pendiente | sanitizeHtml"
      ></div>
      <p class="text-sm">
        <lux-tag
          [severity]="
              item.status == 0
                ? 'danger'
                : item.status == 1
                ? 'success'
                : 'secondary'
            "
          [value]="
              item.status == 0
                ? 'Pendiente'
                : item.status == 1
                ? 'Concluido'
                : 'No Autorizado'
            "
          class="text-xs"
        />
      </p>

      <lux-action-menu-mobile slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="item"
            displayMode="label"
            label="Ver seguimientos"
            (clicked)="todosSeguimientos.emit(item.id)"
          />
          <lux-button-mobile
            kind="item"
            displayMode="label"
            label="Agregar Seguimiento"
            (clicked)="addSeguimiento.emit(item.id)"
          />
          <lux-button-mobile
            kind="item"
            displayMode="label"
            label="Editar"
            (clicked)="edit.emit({ id: item.id, header: 'Editar Asunto' })"
          />
        </ng-container>
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
