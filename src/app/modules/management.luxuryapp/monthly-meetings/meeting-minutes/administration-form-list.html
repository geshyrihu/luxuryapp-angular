<div class="d-flex flex-column">
  <div class="p-2 bg-body-tertiary fw-semibold">Administración</div>

  <div class="d-flex flex-column gap-2 p-2">
    <custom-input-select-signal
      class="d-block w-full"
      [control]="administrationparticipante"
      [data]="cb_Administration()"
      optionLabel="label"
      optionValue="value"
      label="Participante"
      placeholder="Buscar participante"
      [filter]="true"
      [noMargin]="true"
      [showClear]="true"
      [customClass]="'w-full'"
    />
    <il-button-item
      label="Agregar"
      iconClass="material-symbols-light:add"
      [fluid]="true"
      [disabled]="!administrationparticipante.value"
      (clicked)="onSubmit()"
    />
  </div>

  @for (item of listaParticipantesAdministration(); track item.id) {
  <div
    class="d-flex align-items-center justify-content-between gap-2 p-2 border-bottom-1 border"
  >
    <span class="text-sm text-body">{{ item.cargo }} - {{ item.nombre }}</span>
    <iw-button-delete
      size="sm"
      [tooltip]="'Eliminar'"
      tooltipPosition="top"
      confirmMessage="¿Eliminar a este participante?"
      (confirmed)="onDelete(item.id)"
    />
  </div>
  }
</div>
