<div class="d-flex flex-column">
  <div class="p-2 bg-body-tertiary fw-semibold">Invitados</div>

  <div class="d-flex flex-column gap-2 p-2">
    <custom-input-text-signal
      class="d-block w-full"
      [control]="invitado"
      [horizontal]="false"
      label="Invitado"
      placeholder="Nombre del invitado"
    />
    <il-button-item
      label="Agregar"
      iconClass="material-symbols-light:add"
      [fluid]="true"
      [disabled]="!invitado.value"
      (clicked)="onSubmit()"
    />
  </div>

  @for (item of listaInvitados(); track item.id) {
  <div
    class="d-flex align-items-center justify-content-between gap-2 p-2 border-bottom-1 border"
  >
    <span class="text-sm text-body">{{ item.invitado }}</span>
    <iw-button-delete
      size="sm"
      [tooltip]="'Eliminar'"
      tooltipPosition="top"
      confirmMessage="¿Eliminar a este invitado?"
      (confirmed)="onDelete(item.id)"
    />
  </div>
  }
</div>
