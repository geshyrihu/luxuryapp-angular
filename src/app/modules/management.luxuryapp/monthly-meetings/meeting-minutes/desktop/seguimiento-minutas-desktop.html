<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  tableLayout="fixed"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card border-0 shadow-sm"
>
  <ng-template #caption>
    <!-- Contenedor Maestro: Apila en móvil, alinea en línea en escritorio -->
    <div
      class="d-flex flex-column flex-md-row align-items-md-center justify-content-between p-2 gap-2 bg-body-tertiary rounded g-4"
    >
      <!-- LADO IZQUIERDO: Buscador y Título (Toma el espacio libre) -->
      <div class="flex-grow-1">
        <lux-table-caption
          [dt]="dt"
          [showAdd]="false"
          [noPadding]="true"
          [noMargin]="true"
        />
      </div>

      <!-- LADO DERECHO: Filtros, Acciones y Toggles -->
      <div class="d-flex flex-column flex-sm-row align-items-center gap-1 g-4">
        <il-button
          label="Pendientes"
          [severity]="statusFiltro() == 0 ? 'primary' : 'info'"
          [variant]="statusFiltro() != 0 ? 'text' : null"
          size="sm"
          (clicked)="filtrar.emit(0)"
        />
        <il-button
          label="Concluidos"
          [severity]="statusFiltro() == 1 ? 'primary' : 'info'"
          [variant]="statusFiltro() != 1 ? 'text' : null"
          size="sm"
          (clicked)="filtrar.emit(1)"
        />
        <il-button
          label="No Autorizados"
          [severity]="statusFiltro() == 2 ? 'primary' : 'info'"
          [variant]="statusFiltro() != 2 ? 'text' : null"
          size="sm"
          (clicked)="filtrar.emit(2)"
        />
        <il-button
          label="Todos"
          [severity]="statusFiltro() == 4 ? 'primary' : 'info'"
          [variant]="statusFiltro() != 4 ? 'text' : null"
          size="sm"
          (clicked)="filtrar.emit(4)"
        />
      </div>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th appSortableColumn="areaResponsable">
        AREA
        <app-sorticon field="areaResponsable" />
      </th>
      <th appSortableColumn="fechaSolicitudFiltro">
        SOLICITUD
        <app-sorticon field="fechaSolicitudFiltro" />
      </th>
      <th appSortableColumn="pendiente" class="table-col-pendiente">
        PENDIENTE
        <app-sorticon field="pendiente" />
      </th>
      <th class="table-col-seguimiento">SEGUIMIENTO</th>
      <th class="text-center" appSortableColumn="status">
        ESTATUS
        <app-sorticon field="status" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td class="fw-medium text-body">{{ item.areaResponsable }}</td>
      <td class="table-col-description">
        <div class="text-base fw-bold text-body mb-1">
          {{ item.fechaSolicitud }} {{ item.titulo | titlecase }}
        </div>
      </td>
      <td class="table-col-pendiente table-col-description">
        <div
          class="text-justify text-body-secondary line-height-3"
          [innerHTML]="item.pendiente | sanitizeHtml"
        ></div>
      </td>
      <td class="table-col-seguimiento table-col-description">
        @if (item.seguimientos.length > 0) {
        <div class="text-body">
          <span class="fw-bold text-primary"
            >{{ item.seguimientos[0].fecha }}</span
          >: {{ item.seguimientos[0].seguimiento }}
        </div>
        }
      </td>
      <td class="text-center">
        <lux-tag
          [severity]="
            item.status == 0
              ? 'danger'
              : item.status == 1
              ? 'success'
              : 'secondary'
          "
          [rounded]="true"
          [icon]="
            item.status == 0
              ? 'material-symbols-light:close'
              : item.status == 1
              ? 'material-symbols-light:check'
              : 'material-symbols-light:block'
          "
        />
      </td>
      <td class="no-print">
        <app-action-menu>
          <ng-container actions>
            <lux-button-web
              kind="item"
              severity="secondary"
              variant="soft"
              label="Ver todos los seguimientos"
              iconClass="material-symbols-light:format-list-bulleted"
              (clicked)="todosSeguimientos.emit(item.id)"
            />
            <lux-button-web
              kind="item"
              severity="secondary"
              variant="soft"
              label="Agregar Seguimiento"
              iconClass="material-symbols-light:add-circle"
              (clicked)="addSeguimiento.emit(item.id)"
            />
            <lux-button-web
              kind="item"
              severity="secondary"
              variant="soft"
              label="Editar"
              iconClass="material-symbols-light:edit"
              (clicked)="edit.emit({ id: item.id, header: 'Editar Asunto' })"
            />
          </ng-container>
        </app-action-menu>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="6" />
  </ng-template>

  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
