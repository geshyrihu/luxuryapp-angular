@if (platformS.isMobile()) {
<lux-presentacion-junta-comite-contador-mobile-web
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="showModalAdd({ id: 0, titulo: 'Nuevo Registro' })"
  (edit)="showModalAdd({ id: $event, title: 'Editar' })"
  (deleteItem)="onDeleteItem($event)"
  (upload)="onModalForm($event)"
  (deleteFile)="onDeleteFile($event.id, $event.area)"
  (validar)="onValidarPresentacion($event)"
  (onlyValidate)="onOnlyValidate($event)"
/>
} @else {
<lux-presentacion-junta-comite-contador-desktop-web
  [data]="dataSignal()"
  (add)="showModalAdd({ id: 0, titulo: 'Nuevo Registro' })"
  (edit)="showModalAdd({ id: $event, title: 'Editar' })"
  (deleteItem)="onDeleteItem($event)"
  (upload)="onModalForm($event)"
  (deleteFile)="onDeleteFile($event.id, $event.area)"
  (validar)="onValidarPresentacion($event)"
  (onlyValidate)="onOnlyValidate($event)"
/>
}
