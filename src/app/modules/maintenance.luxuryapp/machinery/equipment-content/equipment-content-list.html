<div class="card p-3">
  <div class="mb-3">
    <h2 class="h5 mb-1">Contenidos</h2>
    <div class="text-body-secondary">{{ equipmentName }}</div>
  </div>

  @if (platformS.isMobile()) {
  <app-equipment-content-list-mobile
    [data]="data()"
    [loading]="loading()"
    [title]="'Contenidos de ' + equipmentName"
    [globalFilterFields]="globalFilterFields()"
    [canManage]="canManageContents()"
    (add)="onCreate()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  />
  } @else {
  <app-equipment-content-list-desktop
    [data]="data()"
    [globalFilterFields]="globalFilterFields()"
    [equipmentName]="equipmentName"
    [canManage]="canManageContents()"
    (add)="onCreate()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  />
  }

  @if (!loading() && data().length === 0) {
  <div class="text-center text-body-secondary py-4">
    Este activo todavía no tiene contenidos.
  </div>
  }
</div>
