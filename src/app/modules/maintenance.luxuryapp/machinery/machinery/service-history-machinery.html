<lux-table-web
  [globalFilterFields]="globalFilterFields()"
  [value]="dataSignal()"
  #dt
  class="custom-table card d-none d-md-block"
>
  <ng-template #caption>
    <lux-table-caption-web [showAdd]="false" [dt]="dt" />
  </ng-template>

  <ng-template #header>
    <tr>
      <th appSortableColumn="executionDate">
        Fecha
        <lux-sorticon-web field="executionDate" />
      </th>
      <th appSortableColumn="typeMaintance">
        Tipo de mantenimiento
        <lux-sorticon-web field="typeMaintance" />
      </th>
      <th appSortableColumn="recurrence">
        Frecuencia
        <lux-sorticon-web field="recurrence" />
      </th>
      <th appSortableColumn="provider">
        Proveedor
        <lux-sorticon-web field="provider" />
      </th>
      <th appSortableColumn="price">
        Costo
        <lux-sorticon-web field="price" />
      </th>
      <th appSortableColumn="employeeResponsable">
        Superviso
        <lux-sorticon-web field="employeeResponsable" />
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.executionDate }}</td>
      <td>{{ item.typeMaintance }}</td>
      <td>{{ item.recurrence }}</td>
      <td>{{ item.provider }}</td>
      <td>{{ item.price }}</td>
      <td>{{ item.employeeResponsable }}</td>
      <td>
        <div class="d-flex justify-content-center">
          <iw-button
            iconClass="edit"
            ngbTooltip="Editar"
            (clicked)="
              onEdit({
                id: item.id,
                title: 'Editar',
                machineryId: item.machineryId,
                providerId: item.providerId,
              })
            "
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message-web [colspan]="7" />
  </ng-template>
</lux-table-web>
