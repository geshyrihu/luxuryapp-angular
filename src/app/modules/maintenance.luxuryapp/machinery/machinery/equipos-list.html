<div class="card">
  @if (platformS.isMobile()) {
   <app-equipos-list-mobile
     [data]="data()"
     [loading]="loading()"
     [title]="title()"
     [globalFilterFields]="globalFilterFields()"
     [categories]="categories"
     [showContents]="showContents()"
     [canManage]="canManage()"
     (add)="onModalAddOrEdit({ id: 0, title: 'Nuevo Registro' })"
     (downloadPdf)="onDownloadPdf()"
     (downloadQr)="onDownloadInspectionQrBatch()"
     (downloadExcel)="onDownloadExcel()"
     (documentos)="onDocumentos($event)"
     (serviceHistory)="onServiceHistory($event)"
     (bitacora)="onBitacoraIndividual($event)"
     (fichaTecnica)="showModalFichatecnica($event)"
     (equipmentContents)="onEquipmentContents($event)"
     (maintenanceCalendar)="showModalMaintenanceCalendar($event)"
     (deleteOrder)="onDeleteOrder($event)"
     (edit)="onModalAddOrEdit($event)"
     (delete)="onDelete($event)"
   />
  } @else {
   <app-equipos-list-desktop
     [data]="data()"
     [globalFilterFields]="globalFilterFields()"
     [categories]="categories"
     [selectedCategoryId]="inventoryCategoryId()"
     [title]="title()"
     [active]="stateFilter() === 0"
     [mostrarPreventivos]="mostrarPreventivos()"
     [showContents]="showContents()"
     [canManage]="canManage()"
     (selectCategory)="onSelectCategory($event)"
     (add)="onModalAddOrEdit({ id: 0, title: 'Nuevo Registro' })"
     (openCalendar)="calendarioGuiaVisible.set(true)"
     (downloadPdf)="onDownloadPdf()"
     (downloadQr)="onDownloadInspectionQrBatch()"
     (downloadExcel)="onDownloadExcel()"
     (stateChange)="onSelectState($event)"
     (openMaintenances)="openMantenimientosDialog($event)"
     (documentos)="onDocumentos($event)"
     (serviceHistory)="onServiceHistory($event)"
     (bitacora)="onBitacoraIndividual($event)"
     (fichaTecnica)="showModalFichatecnica($event)"
     (equipmentContents)="onEquipmentContents($event)"
     (edit)="onModalAddOrEdit($event)"
     (delete)="onDelete($event)"
   />
  }

  <!-- ================================================================== -->
  <!-- DRAWER: Calendario General de Mantenimiento (solo consulta)        -->
  <!-- ================================================================== -->
  <lux-sidebar
    [visible]="calendarioGuiaVisible()"
    (visibleChange)="calendarioGuiaVisible.set($event)"
    header="Calendario General de Mantenimiento"
    position="right"
  >
    <app-calendario-maestro-readonly />
  </lux-sidebar>
</div>
