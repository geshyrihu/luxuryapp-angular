<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-date-signal [control]="form.controls.date" label="Fecha" />
  <lux-input-time-signal [control]="form.controls.hour" label="Hora" />
  <lux-input-check-signal
    [control]="form.controls.accessibleAndVisible"
    label="Accesible y Visible"
  />
  <lux-input-check-signal
    [control]="form.controls.housingOk"
    label="Carcasa en Buen Estado"
  />
  <lux-input-check-signal
    [control]="form.controls.leverOk"
    label="Palanca Operativa"
  />
  <lux-input-check-signal
    [control]="form.controls.glassIntact"
    label="Cristal de Protección Intacto"
  />
  <lux-input-check-signal
    [control]="form.controls.mountingSecure"
    label="Montaje Seguro"
  />
  <lux-input-check-signal
    [control]="form.controls.signageOk"
    label="Señalización Legible"
  />
  <lux-input-textarea-signal
    [control]="form.controls.observations"
    label="Observaciones"
  />
  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    label="Guardar"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
