<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-date-signal [control]="form.controls.date" label="Fecha" />
  <lux-input-time-signal [control]="form.controls.hour" label="Hora" />
  <lux-input-check-signal
    [control]="form.controls.labelPresent"
    label="Etiqueta Presente"
  />
  <lux-input-check-signal
    [control]="form.controls.glassIntact"
    label="Cristal del Gabinete Intacto"
  />
  <lux-input-check-signal
    [control]="form.controls.wrenchPresent"
    label="Llave de Maniobra Presente"
  />
  <lux-input-check-signal
    [control]="form.controls.hoseOk"
    label="Manguera en Buen Estado"
  />
  <lux-input-check-signal
    [control]="form.controls.nozzlePresent"
    label="Chiflón Presente"
  />
  <lux-input-check-signal
    [control]="form.controls.valveOperational"
    label="Válvula Operativa"
  />
  <lux-input-check-signal
    [control]="form.controls.lockOk"
    label="Cerradura Funcional"
  />
  <lux-input-select-signal
    [control]="form.controls.cabinetState"
    label="Estado del Gabinete"
    [data]="cb_cabinetState"
  />
  <lux-input-textarea-signal
    [control]="form.controls.observations"
    label="Observaciones"
  />
  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    label="Guardar"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
