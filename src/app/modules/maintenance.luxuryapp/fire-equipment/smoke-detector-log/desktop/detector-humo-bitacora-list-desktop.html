<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <div class="d-flex justify-content-between align-items-center w-full">
      <div class="d-flex align-items-center gap-2">
        <lux-button-web
          kind="download"
          displayMode="icon"
          (clicked)="pdfReport.emit()"
          tooltip="Reporte PDF por rango de fecha"
          tooltipPosition="top"
        />
      </div>
      <lux-table-caption
        (add)="add.emit({ id: '', title: 'Nueva Inspección' })"
        [dt]="dt"
      />
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="date">Fecha <app-sorticon field="date" /></th>
      <th class="table-col-10">Hora</th>
      <th class="table-col-10">Sin Obstr.</th>
      <th class="table-col-10">Sin Contam.</th>
      <th class="table-col-10">Sin Daños</th>
      <th class="table-col-10">LED Ok</th>
      <th class="table-col-10">Montaje</th>
      <th>Observaciones</th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.date | apiDate:'dd-MMM-yy' }}</td>
      <td class="text-center">{{ item.hour }}</td>
      <td class="text-center">
        <app-icon
          [icon]="item.noObstructions ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.noObstructions"
          [class.text-red-600]="!item.noObstructions"
        />
      </td>
      <td class="text-center">
        <app-icon
          [icon]="item.noContamination ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.noContamination"
          [class.text-red-600]="!item.noContamination"
        />
      </td>
      <td class="text-center">
        <app-icon
          [icon]="item.noPhysicalDamage ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.noPhysicalDamage"
          [class.text-red-600]="!item.noPhysicalDamage"
        />
      </td>
      <td class="text-center">
        <app-icon
          [icon]="item.ledStatusOk ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.ledStatusOk"
          [class.text-red-600]="!item.ledStatusOk"
        />
      </td>
      <td class="text-center">
        <app-icon
          [icon]="item.mountingSecure ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.mountingSecure"
          [class.text-red-600]="!item.mountingSecure"
        />
      </td>
      <td><span>{{ item.observations }}</span></td>
      <td class="no-print">
        <div class="d-flex justify-content-center">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar Inspección' })"
          />
          <iw-button-delete (confirmed)="delete.emit(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="9" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
