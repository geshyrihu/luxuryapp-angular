<lux-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit({ id: '', title: 'Nueva Inspección' })"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        class="w-3rem h-3rem bg-yellow-100"
      >
        <lux-icon
          icon="material-symbols-light:detector-alarm"
          class="text-xl text-yellow-500"
        />
      </div>

      <h3>{{ item.date | apiDate:'dd-MMM-yy' }} {{ item.hour }}</h3>
      @if (item.observations) {
      <p>{{ item.observations }}</p>
      }
      <div class="d-flex gap-2 mt-1">
        <small [class]="item.noObstructions ? 'text-green-600' : 'text-red-600'"
          >Sin Obstr.</small
        >
        <small
          [class]="item.noContamination ? 'text-green-600' : 'text-red-600'"
          >Sin Contam.</small
        >
        <small
          [class]="item.noPhysicalDamage ? 'text-green-600' : 'text-red-600'"
          >Sin Daños</small
        >
        <small [class]="item.ledStatusOk ? 'text-green-600' : 'text-red-600'"
          >LED Ok</small
        >
        <small [class]="item.mountingSecure ? 'text-green-600' : 'text-red-600'"
          >Montaje</small
        >
      </div>

      <lux-action-menu-mobile end>
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar Inspección' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
