<app-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit({ id: '', title: 'Nueva Inspección' })"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
      >
        <app-icon icon="material-symbols-light:precision-manufacturing" />
      </div>

      <h3>{{ item.date | apiDate:'dd-MMM-yy' }} {{ item.hour }}</h3>
      <p>{{ item.cabinetState }}</p>
      <div class="d-flex gap-2 mt-1">
        <small [class]="item.labelPresent ? 'text-green-600' : 'text-red-600'"
          >Etiqueta</small
        >
        <small [class]="item.glassIntact ? 'text-green-600' : 'text-red-600'"
          >Cristal</small
        >
        <small [class]="item.wrenchPresent ? 'text-green-600' : 'text-red-600'"
          >Llave</small
        >
        <small [class]="item.hoseOk ? 'text-green-600' : 'text-red-600'"
          >Manguera</small
        >
        <small
          [class]="item.valveOperational ? 'text-green-600' : 'text-red-600'"
          >Vólvula</small
        >
      </div>

      <ili-action-menu end>
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar Inspección' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
