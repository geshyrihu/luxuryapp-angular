<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <div class="d-flex justify-content-between align-items-center w-full">
      <div class="d-flex align-items-center gap-2">
        <iw-button-download
          (clicked)="pdfReport.emit()"
          lxTooltip="PDF"
          tooltipPosition="top"
          tooltip="Reporte PDF por rango de fecha"
        />
      </div>
      <lux-table-caption
        (add)="add.emit({ id: '', title: 'Nueva Inspección' })"
        [dt]="dt"
      />
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="date">Fecha <app-sorticon field="date" /></th>
      <th class="table-col-10">Hora</th>
      <th class="table-col-10">Etiqueta</th>
      <th class="table-col-10">Cristal</th>
      <th class="table-col-10">Llave</th>
      <th class="table-col-10">Manguera</th>
      <th class="table-col-10">Chiflón</th>
      <th class="table-col-10">Vólvula</th>
      <th class="table-col-10">Cerradura</th>
      <th>Estado Gabinete</th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.date | apiDate:'dd-MMM-yy' }}</td>
      <td class="text-center">{{ item.hour }}</td>
      <td class="text-center">
        <app-icon
          [icon]="item.labelPresent ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.labelPresent"
          [class.text-red-600]="!item.labelPresent"
        />
      </td>
      <td class="text-center">
        <app-icon
          [icon]="item.glassIntact ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.glassIntact"
          [class.text-red-600]="!item.glassIntact"
        />
      </td>
      <td class="text-center">
        <app-icon
          [icon]="item.wrenchPresent ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.wrenchPresent"
          [class.text-red-600]="!item.wrenchPresent"
        />
      </td>
      <td class="text-center">
        <app-icon
          [icon]="item.hoseOk ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.hoseOk"
          [class.text-red-600]="!item.hoseOk"
        />
      </td>
      <td class="text-center">
        <app-icon
          [icon]="item.nozzlePresent ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.nozzlePresent"
          [class.text-red-600]="!item.nozzlePresent"
        />
      </td>
      <td class="text-center">
        <app-icon
          [icon]="item.valveOperational ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.valveOperational"
          [class.text-red-600]="!item.valveOperational"
        />
      </td>
      <td class="text-center">
        <app-icon
          [icon]="item.lockOk ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.lockOk"
          [class.text-red-600]="!item.lockOk"
        />
      </td>
      <td><span>{{ item.cabinetState }}</span></td>
      <td class="no-print">
        <div class="d-flex justify-content-center">
          <iw-button-edit
            (clicked)="edit.emit({ id: item.id, title: 'Editar Inspección' })"
          />
          <iw-button-delete (confirmed)="delete.emit(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="11" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
