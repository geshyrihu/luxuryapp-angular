<app-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit({ id: '', title: 'Nueva Inspección' })"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
      >
        <app-icon icon="material-symbols-light:fire-extinguisher" />
      </div>

      <h3>{{ item.date | apiDate:'dd-MMM-yy' }} {{ item.hour }}</h3>
      @if (item.observations) {
      <p>{{ item.observations }}</p>
      }
      <div class="d-flex gap-2 mt-1">
        <small
          [class]="item.adequatePressure ? 'text-green-600' : 'text-red-600'"
          >Presion</small
        >
        <small [class]="item.safetyPinOk ? 'text-green-600' : 'text-red-600'"
          >Seguro</small
        >
        <small [class]="item.labelsOk ? 'text-green-600' : 'text-red-600'"
          >Etiquetas</small
        >
        <small
          [class]="item.noPhysicalDamage ? 'text-green-600' : 'text-red-600'"
          >Sin Daños</small
        >
      </div>

      <ili-action-menu end>
        <ng-container actions>
          <ili-button-edit
            (clicked)="edit.emit({ id: item.id, title: 'Editar Inspección' })"
            label="Editar"
          />
          <ili-button-delete (confirmed)="delete.emit(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
