<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <div class="d-flex justify-content-between align-items-center w-full">
      <div class="d-flex align-items-center gap-2">
        <lux-button-web
          kind="download"
          displayMode="icon"
          (clicked)="pdfReport.emit()"
          tooltip="Reporte PDF por rango de fecha"
          tooltipPosition="top"
        />
      </div>
      <lux-table-caption
        (add)="add.emit({ id: '', title: 'Nueva InspecciÃ³n' })"
        [dt]="dt"
      />
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="date">Fecha <lux-sorticon-web field="date" /></th>
      <th class="table-col-10">Hora</th>
      <th class="table-col-10">PresiÃ³n</th>
      <th class="table-col-10">Seguro</th>
      <th class="table-col-10">Etiquetas</th>
      <th class="table-col-10">Sin DaÃ±os</th>
      <th>Observaciones</th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.date | apiDate:'dd-MMM-yy' }}</td>
      <td class="text-center">{{ item.hour }}</td>
      <td class="text-center">
        <lux-icon
          [icon]="item.adequatePressure ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.adequatePressure"
          [class.text-red-600]="!item.adequatePressure"
        />
      </td>
      <td class="text-center">
        <lux-icon
          [icon]="item.safetyPinOk ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.safetyPinOk"
          [class.text-red-600]="!item.safetyPinOk"
        />
      </td>
      <td class="text-center">
        <lux-icon
          [icon]="item.labelsOk ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.labelsOk"
          [class.text-red-600]="!item.labelsOk"
        />
      </td>
      <td class="text-center">
        <lux-icon
          [icon]="item.noPhysicalDamage ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.noPhysicalDamage"
          [class.text-red-600]="!item.noPhysicalDamage"
        />
      </td>
      <td><span>{{ item.observations }}</span></td>
      <td class="no-print">
        <div class="d-flex justify-content-center">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar InspecciÃ³n' })"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            (clicked)="delete.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="8" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
