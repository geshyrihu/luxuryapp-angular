<lux-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit({ id: '', title: 'Nueva Inspección' })"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
      >
        <lux-icon icon="material-symbols-light:alarm" />
      </div>

      <h3>{{ item.date | apiDate:'dd-MMM-yy' }} {{ item.hour }}</h3>
      @if (item.observations) {
      <p>{{ item.observations }}</p>
      }
      <div class="d-flex gap-2 mt-1">
        <small
          [class]="item.accessibleAndVisible ? 'text-green-600' : 'text-red-600'"
          >Accesible</small
        >
        <small [class]="item.housingOk ? 'text-green-600' : 'text-red-600'"
          >Carcasa</small
        >
        <small [class]="item.leverOk ? 'text-green-600' : 'text-red-600'"
          >Palanca</small
        >
        <small [class]="item.glassIntact ? 'text-green-600' : 'text-red-600'"
          >Cristal</small
        >
        <small [class]="item.signageOk ? 'text-green-600' : 'text-red-600'"
          >Seóalización</small
        >
      </div>

      <ili-action-menu end>
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar Inspección' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</lux-data-view-mobile>
