<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-date-signal [control]="form.controls.date" label="Fecha" />
  <lux-input-time-signal [control]="form.controls.hour" label="Hora" />
  <lux-input-check-signal
    [control]="form.controls.noObstructions"
    label="Sin Obstrucciones en 50 cm"
  />
  <lux-input-check-signal
    [control]="form.controls.noContamination"
    label="Sin Contaminación Visible"
  />
  <lux-input-check-signal
    [control]="form.controls.noPhysicalDamage"
    label="Sin Daño Físico"
  />
  <lux-input-check-signal
    [control]="form.controls.ledStatusOk"
    label="Indicador LED en Estado Normal"
  />
  <lux-input-check-signal
    [control]="form.controls.mountingSecure"
    label="Montaje Seguro"
  />
  <lux-input-textarea-signal
    [control]="form.controls.observations"
    label="Observaciones"
  />
  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    label="Guardar"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
