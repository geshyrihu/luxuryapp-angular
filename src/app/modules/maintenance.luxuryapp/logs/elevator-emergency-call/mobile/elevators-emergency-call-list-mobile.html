<div class="d-flex d-md-none justify-content-end mb-2">
  <iw-button-download
    (clicked)="downloadPdf.emit()"
    lxTooltip="Descargar PDF"
    tooltipPosition="top"
    tooltip="Descargar listado de llamadas de emergencia"
  />
</div>

<app-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        class="w-3rem h-3rem bg-primary-50"
      >
        <app-icon
          icon="material-symbols-light:elevator-outline"
          class="text-xl text-primary"
        />
      </div>

      <div class="d-flex justify-content-between align-items-center mb-1">
        <h2 class="fw-bold m-0 text-base text-wrap">{{ item.machinery }}</h2>
      </div>
      <p class="text-sm text-body-secondary m-0">
        <app-icon
          [icon]="'material-symbols-light:currency-pound'"
          class="me-1 text-xs"
        />
        Folio: {{ item.folio }}
      </p>
      <p class="text-sm text-body-secondary m-0">
        <app-icon
          [icon]="'material-symbols-light:calendar-today'"
          class="me-1 text-xs"
        />
        {{ item.requestDate }}
      </p>
      <p class="text-sm text-body mt-2 mb-1">
        <strong>Reporte:</strong> {{ item.report }}
      </p>
      <p class="text-sm text-body m-0 mb-1">
        <strong>Respuesta:</strong> {{ item.request }}
      </p>
      <div class="d-flex flex-column gap-1 mt-1">
        <small class="text-xs text-body-secondary"
          >Reportú: {{ item.personWhoReports }}</small
        >
        <small class="text-xs text-body-secondary"
          >Atendié: {{ item.technicianWhoAttended }}</small
        >
      </div>

      <ili-action-menu end>
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <ili-button-delete (confirmed)="delete.emit(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
