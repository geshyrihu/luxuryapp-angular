<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-text-signal
    [control]="form.controls.id"
    hidden
    label="Id"
    [hidden]="false"
    placeholder="Id"
  />

  <lux-input-select-signal
    [control]="form.controls.machineryId"
    label="Elevador"
    placeholder="Elevador"
    [data]="cb_elevators()"
    [filter]="true"
  />
  <lux-input-text-signal
    [control]="form.controls.folio"
    label="Folio del reporte"
    placeholder="folio del reporte"
  />
  <lux-input-date-signal
    [control]="form.controls.requestDate"
    label="Fecha"
    placeholder="fecha"
  />

  <lux-input-textarea-signal
    [control]="form.controls.report"
    label="Reporte"
    placeholder="reporte"
  />
  <lux-input-textarea-signal
    [control]="form.controls.request"
    label="Respuesta"
    placeholder="respuesta"
  />
  <lux-input-text-signal
    [control]="form.controls.personWhoReports"
    label="Quien Reporto"
    placeholder="quien reporte"
  />

  <lux-input-text-signal
    [control]="form.controls.technicianWhoAttended"
    label="Técnico"
    placeholder="técnico"
  />

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    [label]="id ? 'Actualizar' : 'Guardar'"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
