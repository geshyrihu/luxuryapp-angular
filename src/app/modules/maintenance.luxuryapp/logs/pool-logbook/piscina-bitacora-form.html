<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <!-- Id -->

  <lux-input-text-signal
    placeholder="id"
    [control]="form.controls.id"
    hidden
    label="Id"
    [disabled]="true"
  />
  <!-- Id -->
  <lux-input-date-signal [control]="form.controls.date" label="Registro" />

  <lux-input-time-signal [control]="form.controls.hour" label="Hora" />
  <lux-input-number-signal
    placeholder="temperatura"
    [control]="form.controls.temperatura"
    label="Temperatura C°"
  />
  <lux-input-number-signal
    placeholder="cloro (ppm)"
    [control]="form.controls.cl"
    label="Cloro (ppm)"
  />

  <lux-input-number-signal
    placeholder="ph (ppm)"
    [control]="form.controls.ph"
    label="Ph (ppm)"
  />
  <lux-input-number-signal
    placeholder="alkalinidad (ppm)"
    [control]="form.controls.alkalinidad"
    label="Alkalinidad (ppm)"
  />
  <lux-input-number-signal
    placeholder="dureza (ppm)"
    [control]="form.controls.dureza"
    label="Dureza (ppm)"
  />

  <lux-input-number-signal
    placeholder="cantidad en gramos "
    [control]="form.controls.aplicationCl"
    label="Cloro Aplicado"
  />
  <lux-input-number-signal
    placeholder="cantidad en gramos "
    [control]="form.controls.aplicationPhMas"
    label="PH+ Aplicado"
  />
  <lux-input-number-signal
    placeholder="cantidad en gramos "
    [control]="form.controls.aplicationPhMenos"
    label="PH- Aplicado"
  />
  <lux-input-check-signal [control]="form.controls.aspirado" label="Aspirado" />
  <lux-input-check-signal
    [control]="form.controls.cepillado"
    label="Cepillado"
  />
  <lux-input-check-signal
    [control]="form.controls.cenefas"
    label="Limpieza de cenefas"
  />
  <!-- boton submit -->
  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    label="Guardar"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
  <!-- boton submit -->
</form>
