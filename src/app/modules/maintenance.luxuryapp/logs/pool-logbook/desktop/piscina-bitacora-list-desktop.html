<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <div class="d-flex align-items-center justify-content-between gap-2 w-full">
      <lux-table-caption
        (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
        [dt]="dt"
      />
      <div class="d-flex gap-2">
        <button
          type="button"
          class="px-3 py-2 rounded-lg border border-primary text-primary text-sm d-flex align-items-center gap-1"
          (click)="exportExcel.emit()"
        >
          <app-icon icon="material-symbols-light:download" /> Excel
        </button>
        <button
          type="button"
          class="px-3 py-2 rounded-lg border border-primary text-primary text-sm d-flex align-items-center gap-1"
          (click)="fileInput.click()"
        >
          <app-icon icon="material-symbols-light:upload" /> Importar
        </button>
        <input
          #fileInput
          type="file"
          accept=".xlsx"
          class="d-none"
          (change)="importExcel.emit($event)"
        />
      </div>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th appSortableColumn="Filtro">
        Fecha
        <app-sorticon field="Filtro" />
      </th>
      <th class="table-col-7">Cl</th>
      <th class="table-col-7">Ph</th>
      <th class="table-col-7">Ak</th>
      <th class="table-col-7">Dureza</th>
      <th class="table-col-7">Temp</th>
      <th class="table-col-7">Apl Cl</th>
      <th class="table-col-7">Apl Ph+</th>
      <th class="table-col-7">Apl Ph-</th>
      <th class="table-col-7">Cepillado</th>
      <th class="table-col-7">Aspirado</th>
      <th class="table-col-7">Cenefas</th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.dateString }}</td>
      <td class="text-center">{{ item.cl }}</td>
      <td class="text-center">{{ item.ph }}</td>
      <td class="text-center">{{ item.alkalinidad }}</td>
      <td class="text-center">{{ item.dureza }}</td>
      <td class="text-center">{{ item.temperatura }}</td>
      <td class="text-center">{{ item.aplicationCl }}</td>
      <td class="text-center">{{ item.aplicationPhMas }}</td>
      <td class="text-center">{{ item.aplicationPhMenos }}</td>
      <td class="text-center">
        <app-icon
          [icon]="item.cepillado ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.cepillado"
          [class.text-red-600]="!item.cepillado"
        />
      </td>
      <td class="text-center">
        <app-icon
          [icon]="item.aspirado ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.aspirado"
          [class.text-red-600]="!item.aspirado"
        />
      </td>
      <td class="text-center">
        <app-icon
          [icon]="item.cenefas ? 'material-symbols-light:check' : 'material-symbols-light:close'"
          class="font-size-18"
          [class.text-green-600]="item.cenefas"
          [class.text-red-600]="!item.cenefas"
        />
      </td>

      <!-- Opciones -->

      <td class="no-print">
        <div class="d-flex justify-content-center">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            (clicked)="delete.emit(item.id)"
          />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="13" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
