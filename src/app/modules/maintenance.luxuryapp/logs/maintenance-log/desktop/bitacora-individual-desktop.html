<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <div class="row align-items-center g-4">
      <div class="col-12 col-sm-5">
        <app-rango-calendario-yyyymmdd />
      </div>
      <div class="col-12 col-sm-7">
        <lux-table-caption
          [title]="nameMachinery()"
          [showAdd]="false"
          [dt]="dt"
        />
      </div>
    </div>
  </ng-template>
  <ng-template #body let-item>
    <div class="card bg-body-tertiary mb-2 border-1 border">
      <div class="card-header border-bottom-1 border p-2">
        <p class="m-0 fw-bold">
          {{ item.fechaRegistro | apiDate : "fullDate" }}, {{ item.fechaRegistro
          | apiDate : "shortTime" }}
        </p>
      </div>
      <div class="card-body p-3">
        <p class="m-0 fst-italic text-justify">{{ item.descripcion }}</p>
        <p
          class="text-end text-sm cursor-pointer text-primary mt-2 m-0"
          (click)="cardEmployee.emit(item.applicationUserId)"
        >
          {{ item.userName }}
        </p>
      </div>
    </div>
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
