@if (dataSignal()) {
<app-table
  [globalFilterFields]="globalFilterFields"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card d-none d-md-block"
>
  <ng-template #caption>
    <div class="row align-items-center g-4">
      <div class="col-12 col-sm-5">
        <app-rango-calendario-yyyymmdd />
      </div>
      <div class="col-12 col-sm-7">
        <app-table-caption
          [title]="nameMachinery"
          [showAdd]="false"
          [dt]="dt"
        />
      </div>
    </div>
  </ng-template>
  <ng-template #body let-item>
    <div class="card bg-body-tertiary mb-2 border-1 border">
      <div class="card-header border-bottom-1 border p-2">
        <p class="m-0 fw-bold">
          {{ item.fechaRegistro | apiDate : "fullDate" }}, {{ item.fechaRegistro |
          apiDate : "shortTime" }}
        </p>
      </div>
      <div class="card-body p-3">
        <p class="m-0 fst-italic text-justify">{{ item.descripcion }}</p>
        <p
          class="text-end text-sm cursor-pointer text-primary mt-2 m-0"
          (click)="onCardEmployee(item.applicationUserId)"
        >
          {{ item.userName }}
        </p>
      </div>
    </div>
  </ng-template>
  <ng-template #paginatorleft>
    <app-table-footer [data]="dataSignal()" />
  </ng-template>
</app-table>

<!-- 📱 MOBILE -->
<app-data-view-mobile
  [data]="dataSignal()"
  [showAdd]="false"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <div customFilters>
    <div class="px-2 pb-2">
      <app-rango-calendario-yyyymmdd />
    </div>
  </div>
  <ng-template #listItemTemplate let-item>
    <ili-list-item (click)="onCardEmployee(item.applicationUserId)">
      <p class="fw-semibold m-0 text-body">{{ item.descripcion }}</p>
      <p class="text-xs m-0 text-body-secondary">{{ item.fechaRegistro | apiDate:'short' }} · {{ item.userName }}</p>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
}
