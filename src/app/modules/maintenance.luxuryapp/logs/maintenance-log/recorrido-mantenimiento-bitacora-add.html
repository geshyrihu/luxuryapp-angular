@if (machinery()) {
<div>
  <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
    <lux-input-text-signal
      [control]="form.controls.machinery"
      label="Equipo o Instalación"
      [readonly]="true"
    />
    <div class="mb-4 mb-3">
      <label>DESCRIPCIÓN</label>
      <lux-input-textarea-signal [control]="form.controls.descripcion" />
    </div>
    <div class="mb-4">
      <label>Activar Si esta nota es alguna emergencia</label>
      <lux-input-check-signal
        [control]="form.controls.emergencia"
        label="Emergencia"
      />
    </div>
    <lux-button-web
      kind="save"
      type="submit"
      severity="info"
      variant="soft"
      displayMode="both"
      label="Guardar"
      [disabled]="form.invalid"
      [loading]="submitting()"
    />
  </form>
</div>
}
