<lux-data-view-mobile
  [data]="data()"
  [showAdd]="true"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit({ id: 0, title: 'Nueva Bitácora' })"
>
  <div customFilters>
    <div class="px-2 pb-2">
      <lux-rango-calendario-yyyymmdd-web
        [mostrartextDesde]="false"
        [mostrartextHasta]="false"
      />
    </div>
  </div>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <p class="fw-semibold m-0 text-body">{{ item.descripcion }}</p>
      <p class="text-xs m-0 text-body-secondary">
        {{ item.machinery }} · {{ item.fechaRegistro | apiDate:'short' }}
      </p>

      <ili-action-menu end>
        <ng-container actions>
          @if (isJefeMantenimiento()) {
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item)"
          />
          }
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</lux-data-view-mobile>
