<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-autocomplete-signal
    (propagar)="saveMaquinariaId($event)"
    [control]="form.controls.machinery"
    [data]="maquinarias()"
    label="Equipo o Instalación"
    placeholder="Escribir para buscar equipo o instalación"
  />

  <lux-input-textarea-signal
    [control]="form.controls.descripcion"
    label="DESCRIPCIÓN"
    placeholder="DESCRIPCIÓN"
    [horizontal]="false"
  />

  <div class="mb-4">
    <label class="fw-light"> Activar Si nota alguna emergencia </label>
    <lux-input-check-signal
      [control]="form.controls.emergencia"
      label="Emergencia"
    />
  </div>

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    label="Guardar"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
