@if (platformS.isMobile()) {
<app-bitacora-mantenimiento-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [isJefeMantenimiento]="isJefeMantenimiento()"
  (add)="onModalFormBiacora($event)"
  (delete)="onDelete($event)"
/>
} @else {
<app-bitacora-mantenimiento-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [isJefeMantenimiento]="isJefeMantenimiento()"
  (add)="onModalFormBiacora($event)"
  (delete)="onDelete($event)"
  (cardEmployee)="onCardEmployee($event)"
/>
}
