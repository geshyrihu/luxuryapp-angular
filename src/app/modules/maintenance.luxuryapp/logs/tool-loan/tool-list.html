@if (platformS.isMobile()) {
<app-tool-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [isSuperUsuario]="isSuperUsuario()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
} @else {
<app-tool-list-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [showActions]="showActions()"
  [isSuperUsuario]="isSuperUsuario()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
  (downloadPdf)="onDownloadPdf()"
/>
}
