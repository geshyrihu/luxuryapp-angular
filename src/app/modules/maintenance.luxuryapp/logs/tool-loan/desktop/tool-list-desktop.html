<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
    <iw-button-download
      lxTooltip="Descargar PDF"
      tooltipPosition="top"
      iconClass="material-symbols-light:picture-as-pdf"
      variant="outline"
      severity="danger"
      size="small"
      customClass="mt-1"
      (clicked)="downloadPdf.emit()"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th>Img</th>
      <th appSortableColumn="nameTool">
        Nombre
        <app-sorticon field="nameTool" />
      </th>
      <th appSortableColumn="category">
        Categoria
        <app-sorticon field="category" />
      </th>
      @if ( showActions() ) {
      <th class="table-col-10"></th>
      }
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <img
          class="img-thumbnail"
          alt="200x200"
          width="100"
          [src]="
            item.photoPath ? item.photoPath : 'assets/images/default-avatar.png'
          "
          data-holder-rendered="true"
        />
      </td>
      <td>
        <span>{{ item.nameTool }}</span>
      </td>
      <td>
        <span>{{ item.category }}</span>
      </td>
      <!-- Opciones -->

      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          @if (isSuperUsuario()) {
          <iw-button-delete (confirmed)="delete.emit(item.id)" />
          }
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="4" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
