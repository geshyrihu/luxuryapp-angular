<div class="card">
  <lux-table
    [globalFilterFields]="globalFilterFields()"
    [value]="data()"
    #dt
    class="custom-table"
  >
    <ng-template #caption>
      <lux-table-caption
        (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
        [dt]="dt"
      />
    </ng-template>
    <ng-template #header>
      <tr>
        <th>Imagen</th>
        <th appSortableColumn="name">
          Nombre
          <lux-sorticon-web field="name" />
        </th>
        <th>UbicaciÃ³n</th>
        <th>Volumen</th>
        <th colspan="2">Tipo</th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      <tr>
        <td class="text-center">
          <div class="d-flex">
            <lux-image-web
              [src]="
                item.pathImage
                  ? item.pathImage
                  : 'assets/images/default-avatar.png'
              "
              alt="."
              width="50"
              styleClass="mr-2"
              [preview]="true"
            ></lux-image-web>
            @if (!item.pathImage) {
            <img src="assets/images/default-avatar.png" alt="" width="50" />
            }
          </div>
        </td>
        <td>{{ item.name }}</td>
        <td>{{ item.ubication }}</td>
        <td>{{ item.volumen }}</td>
        <td>
          <!-- {{ item.typePiscina | ETypePiscina }} -->
          {{ item.typePiscina }}
        </td>
        <!-- Opciones -->
        <td class="no-print">
          <div class="d-flex">
            <lux-button-web
              kind="edit"
              displayMode="icon"
              severity="info"
              variant="soft"
              size="sm"
              tooltip="Editar"
              ariaLabel="Editar"
              (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
            />
            <lux-button-web
              kind="delete"
              displayMode="icon"
              severity="danger"
              variant="soft"
              size="sm"
              tooltip="Eliminar"
              (clicked)="delete.emit(item.id)"
            />
            <lux-button-web size="sm"
              kind="item"
              displayMode="icon"
              iconClass="material-symbols-light:book"
              variant="soft"
              tooltip="BitÃ¡cora"
              [routerLink]="['/logbook/piscina-bitacora/', item.id]"
            />
          </div>
        </td>

        <!-- Opciones -->
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <lux-table-empty-message [colspan]="5" />
    </ng-template>
  </lux-table>
</div>
