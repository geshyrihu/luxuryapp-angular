<div class="card">
  <lux-data-view-mobile
    [data]="data()"
    (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
    [globalFilterFields]="globalFilterFields()"
  >
    <ng-template #listItemTemplate let-item>
      <ili-list-item>
        <div
          start
          class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
          class="w-3rem h-3rem bg-primary-50"
        >
          <lux-icon icon="material-symbols-light:pool" />
        </div>

        <h2 class="fw-bold m-0 text-base">{{ item.name }}</h2>
        <p class="text-sm text-body-secondary m-0">{{ item.ubication }}</p>
        <div class="d-flex mt-1">
          <small class="text-xs"
            ><strong class="text-primary">Vol:</strong> {{ item.volumen
            }}</small
          >
          <small class="text-xs"
            ><strong class="text-primary">Tipo:</strong> {{ item.typePiscina
            }}</small
          >
        </div>

        <ili-action-menu end>
          <ng-container actions>
            <lux-button-mobile
              kind="edit"
              (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
            />
            <lux-button-mobile
              kind="delete"
              color="danger"
              (clicked)="delete.emit(item.id)"
            />
            <lux-button-mobile
              kind="item"
              label="Bitácora"
              [routerLink]="['/logbook/piscina-bitacora/', item.id]"
            />
          </ng-container>
        </ili-action-menu>
      </ili-list-item>
    </ng-template>
  </lux-data-view-mobile>
</div>
