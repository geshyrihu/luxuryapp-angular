@if (dataSignal()) {
<!-- 💻 INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<div class="d-none d-md-block">
  <div class="card">
    <app-table
      [globalFilterFields]="globalFilterFields"
      [value]="dataSignal()"
      #dt
      class="custom-table"
    >
      <ng-template #caption>
        <app-table-caption
          (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
          [dt]="dt"
        />
      </ng-template>
      <ng-template #header>
        <tr>
          <th>Imagen</th>
          <th appSortableColumn="name">
            Nombre
            <app-sorticon field="name" />
          </th>
          <th>Ubicación</th>
          <th>Volumen</th>
          <th colspan="2">Tipo</th>
        </tr>
      </ng-template>
      <ng-template #body let-item>
        <tr>
          <td class="text-center">
            <div class="d-flex">
              <app-image
                [src]="
                  item.pathImage
                    ? item.pathImage
                    : 'assets/images/default-avatar.png'
                "
                alt="."
                width="50"
                styleClass="mr-2"
                [preview]="true"
              ></app-image>
              @if (!item.pathImage) {
              <img src="assets/images/default-avatar.png" alt="" width="50" />
              }
            </div>
          </td>
          <td>{{ item.name }}</td>
          <td>{{ item.ubication }}</td>
          <td>{{ item.volumen }}</td>
          <td>
            <!-- {{ item.typePiscina | ETypePiscina }} -->
            {{ item.typePiscina }}
          </td>
          <!-- Opciones -->
          <td class="no-print">
            <div class="d-flex">
              <iw-button-edit
                (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
              />
              <iw-button-delete (confirmed)="onDelete(item.id)" />
              <iw-button-item
                iconClass="material-symbols-light:book"
                lxTooltip="Bitácora"
                tooltipPosition="top"
                [routerLink]="['/logbook/piscina-bitacora/', item.id]"
              />
            </div>
          </td>

          <!-- Opciones -->
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <app-table-empty-message [colspan]="5" />
      </ng-template>
    </app-table>
  </div>
</div>

<!--📲INICIO: Componente adaptado para versión mívil -->
<div class="d-block d-md-none">
  <div class="card">
    <app-data-view-mobile
      [data]="dataSignal()"
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [globalFilterFields]="globalFilterFields"
    >
      <ng-template #listItemTemplate let-item>
        <ili-list-item>
          <div
            start
            class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
            class="w-3rem h-3rem bg-primary-50"
          >
            <app-icon icon="material-symbols-light:pool" />
          </div>

          <h2 class="fw-bold m-0 text-base">{{ item.name }}</h2>
          <p class="text-sm text-body-secondary m-0">{{ item.ubication }}</p>
          <div class="d-flex mt-1">
            <small class="text-xs"
              ><strong class="text-primary">Vol:</strong> {{ item.volumen
              }}</small
            >
            <small class="text-xs"
              ><strong class="text-primary">Tipo:</strong> {{ item.typePiscina
              }}</small
            >
          </div>

          <ili-action-menu end>
            <ng-container actions>
              <ili-button-edit
                (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
                label="Editar"
              />
              <ili-button-delete
                (confirmed)="onDelete(item.id)"
                label="Eliminar"
              />
              <ili-button-item
                iconName="book-outline"
                label="Bitácora"
                [routerLink]="['/logbook/piscina-bitacora/', item.id]"
              />
            </ng-container>
          </ili-action-menu>
        </ili-list-item>
      </ng-template>
    </app-data-view-mobile>
  </div>
</div>
}
