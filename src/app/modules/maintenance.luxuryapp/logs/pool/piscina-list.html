@if (platformS.isMobile()) {
<app-piscina-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
} @else {
<app-piscina-list-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
}
