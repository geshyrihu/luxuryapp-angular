@if (platformS.isMobile()) {
<app-medidores-list-mobile
  [data]="dataSignal()"
  (add)="modalAddEdit({ id: 0, title: 'Agregar Registro' })"
  (edit)="modalAddEdit($event)"
  (delete)="onDelete($event)"
  (registerReading)="modalMedidorLecturaAddEdit($event)"
  (goToLecturas)="onGoToLecturas($event)"
  (goToGrafico)="onGoToGrafico($event)"
  (exportExcel)="exportExcel($event)"
/>
} @else {
<app-medidores-list-desktop
  [data]="dataSignal()"
  (add)="modalAddEdit({ id: 0, title: 'Agregar Registro' })"
  (edit)="modalAddEdit($event)"
  (delete)="onDelete($event)"
  (registerReading)="modalMedidorLecturaAddEdit($event)"
  (goToLecturas)="onGoToLecturas($event)"
  (goToGrafico)="onGoToGrafico($event)"
  (exportExcel)="exportExcel($event)"
/>
}
