<app-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        class="w-3rem h-3rem bg-primary-50"
      >
        <app-icon
          icon="material-symbols-light:speed"
          class="text-xl text-primary"
        />
      </div>

      <h2 class="fw-bold m-0 text-base">{{ item.lectura }}</h2>
      <p class="text-sm text-body-secondary m-0 mt-1">
        <app-icon
          [icon]="'material-symbols-light:calendar-today'"
          class="me-1 text-xs"
        />
        {{ item.fechaRegistro | apiDate: "dd-MMM-yyyy" }}
      </p>

      <ili-action-menu end>
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
