<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
    <div class="mt-1">
      <iw-button-download
        ngbTooltip="Exportar a Excel"
        iconClass="material-symbols-light:table-view"
        severity="success"
        (clicked)="exportExcel.emit()"
      />
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th appSortableColumn="fechaRegistro">
        Fecha de Registro
        <app-sorticon field="fechaRegistro" />
      </th>
      <th appSortableColumn="lectura">
        Lectura
        <app-sorticon field="lectura" />
      </th>

      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <span> {{ item.fechaRegistro | apiDate: "dd-MMM-yyyy" }} </span>
      </td>
      <td>
        <span> {{ item.lectura }} </span>
      </td>

      <!-- Opciones -->

      <td class="no-print">
        <app-action-menu>
          <ng-container actions>
            <il-button-edit
              (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
              label="Editar"
            />
            <il-button-delete
              (confirmed)="delete.emit(item.id)"
              label="Eliminar"
            />
          </ng-container>
        </app-action-menu>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="3" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
