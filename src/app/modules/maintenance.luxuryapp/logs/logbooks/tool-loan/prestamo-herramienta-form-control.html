<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-text-signal [control]="form.controls.id" hidden label="Id" />

  <lux-input-date-time-signal
    [control]="form.controls.fechaSalida"
    label="Hora/Fecha Salida"
  />

  <lux-input-autocomplete-signal
    (propagar)="saveToolId($event)"
    [control]="form.controls.tool"
    [data]="cb_tool()"
    label="Herramienta"
    placeholder="Escribe para buscar herramienta"
  />

  <lux-input-autocomplete-signal
    (propagar)="saveEmployeeId($event)"
    [control]="form.controls.applicationUser"
    [data]="cb_applicationUser()"
    label="Colaborador"
    placeholder="Escribe para buscar  colabororador"
  />

  <lux-input-date-time-signal
    [control]="form.controls.fechaRegreso"
    label="Hora/Fecha Regreso"
  />

  <lux-input-textarea-signal
    [control]="form.controls.observaciones"
    label="Observaciones"
    placeholder="observaciones"
  />

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    [label]="id ? 'Actualizar' : 'Guardar'"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
