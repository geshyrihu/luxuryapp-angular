@if (platformS.isMobile()) {
<app-prestamo-herramientas-control-mobile
  [data]="dataSignal().items"
  [globalFilterFields]="globalFilterFields()"
  [rolAuth]="rolAuthMobile()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
} @else {
<app-prestamo-herramientas-control-desktop
  [data]="dataSignal().items"
  [globalFilterFields]="globalFilterFields()"
  [totalRecords]="totalRecords"
  [rows]="rows"
  [searchTerm]="searchTerm"
  [canManage]="canManage()"
  (lazyLoad)="loadDataLazy($event)"
  (filter)="applyFilter()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
}
