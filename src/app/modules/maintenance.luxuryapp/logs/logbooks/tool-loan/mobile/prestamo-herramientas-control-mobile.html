<app-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        class="w-3rem h-3rem bg-yellow-100"
      >
        <lux-icon
          icon="material-symbols-light:construction"
          class="text-xl text-yellow-500"
        />
      </div>

      <div class="d-flex justify-content-between align-items-center mb-1">
        <h2 class="fw-bold m-0 text-base d-flex align-items-center">
          <lux-icon
            [icon]="'material-symbols-light:build'"
            class="text-primary me-2"
          />
          {{ item.tool }}
        </h2>
      </div>
      <p class="text-sm text-body m-0 mb-1">
        <lux-icon
          [icon]="'material-symbols-light:person'"
          class="me-1 text-body-secondary"
        />
        {{ item.applicationUser }}
      </p>

      <div class="row col-2 m-0 p-0 text-xs mt-2 g-4">
        <div class="p-0">
          <span class="text-body-secondary d-block">Salida</span>
          <span class="fw-bold"
            >{{ item.fechaSalida | apiDate: 'dd/MM/yy HH:mm' }}</span
          >
        </div>
        @if (item.fechaRegreso) {
        <div class="p-0">
          <span class="text-body-secondary d-block">Regreso</span>
          <span class="fw-bold text-green-500"
            >{{ item.fechaRegreso | apiDate: 'dd/MM/yy HH:mm' }}</span
          >
        </div>
        }
      </div>

      @if(item.observaciones){
      <p
        class="text-xs text-body-secondary mt-2 m-0 bg-body-tertiary p-1 rounded fst-italic"
      >
        {{ item.observaciones }}
      </p>
      } @if ( rolAuth() ) {
      <ili-action-menu end>
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
      }
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
