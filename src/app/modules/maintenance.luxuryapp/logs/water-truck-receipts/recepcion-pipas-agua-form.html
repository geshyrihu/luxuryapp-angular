<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="row g-4">
    <!-- Columna izquierda: datos del camion y tiempos -->
    <div class="col-12 col-md-6">
      <lux-input-text-signal
        [control]="form.controls.placasCamion"
        label="Placas del camion"
        placeholder="Ej. ABC-1234"
      />

      <lux-input-text-signal
        [control]="form.controls.empresa"
        label="Empresa"
        placeholder="Nombre de la empresa proveedora"
      />

      <lux-input-date-time-native
        [control]="form.controls.horaLlegada"
        label="Hora de llegada"
        [required]="true"
      />

      <lux-input-date-time-native
        [control]="form.controls.horaTermino"
        label="Hora de termino"
      />

      <lux-input-decimal-signal
        [control]="form.controls.capacidadPipa"
        label="Capacidad de la pipa (litros)"
        [minFractionDigits]="0"
        [maxFractionDigits]="0"
      />
    </div>

    <!-- Columna derecha: lecturas y niveles -->
    <div class="col-12 col-md-6">
      <lux-input-decimal-signal
        [control]="form.controls.nivelCisternaAntes"
        label="Nivel cisterna antes"
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
      />
      <lux-input-decimal-signal
        [control]="form.controls.nivelCisternaDespues"
        label="Nivel cisterna despues"
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
      />
      <lux-input-decimal-signal
        [control]="form.controls.lecturaMedidorInicial"
        label="Lectura medidor inicial"
        [minFractionDigits]="4"
        [maxFractionDigits]="4"
      />
      <lux-input-decimal-signal
        [control]="form.controls.lecturaMedidorFinal"
        label="Lectura medidor final"
        [minFractionDigits]="4"
        [maxFractionDigits]="4"
      />
      <lux-input-decimal-signal
        [control]="form.controls.costoMetroCubico"
        label="Costo por metro cubico"
        [minFractionDigits]="2"
        [maxFractionDigits]="4"
      />
    </div>
  </div>

  <!-- Firmas de recepcion -->
  <div class="row mb-2 g-4">
    <div class="col-12 col-md-6">
      <lux-input-autocomplete-signal
        (propagar)="saveColaboradorMtto($event)"
        [control]="form.controls.colaboradorMtto"
        [data]="cb_empleados()"
        label="Colaborador de mantenimiento"
        placeholder="Buscar colaborador que recibe"
      />
    </div>
    <div class="col-12 col-md-6">
      <lux-input-text-signal
        [control]="form.controls.guardiaSeguridad"
        label="Guardia de seguridad testigo"
        placeholder="Nombre del guardia testigo"
      />
    </div>
  </div>

  <!-- Seccion de fotografias -->
  <div class="mt-3 mb-2">
    <p class="fw-semibold text-sm mb-2">Fotografias de evidencia</p>
    <div class="row g-4">
      <div class="col-12 col-md-4">
        <p class="text-xs text-body-secondary mb-1">Pipa llena</p>
        <div class="card text-center p-2">
          <lux-input-img-signal
            [control]="form.controls.fotoPipaLlena"
            [urlImgCurrent]="urlFotoPipaLlena()"
            [contentHeight]="80"
            [contentWidth]="80"
            [allowRemove]="true"
            label=""
          />
        </div>
      </div>
      <div class="col-12 col-md-4">
        <p class="text-xs text-body-secondary mb-1">Pipa vacia</p>
        <div class="card text-center p-2">
          <lux-input-img-signal
            [control]="form.controls.fotoPipaVacia"
            [urlImgCurrent]="urlFotoPipaVacia()"
            [contentHeight]="80"
            [contentWidth]="80"
            [allowRemove]="true"
            label=""
          />
        </div>
      </div>
      <div class="col-12 col-md-4">
        <p class="text-xs text-body-secondary mb-1">INE del chofer</p>
        <div class="card text-center p-2">
          <lux-input-img-signal
            [control]="form.controls.fotoIneChofer"
            [urlImgCurrent]="urlFotoIneChofer()"
            [contentHeight]="80"
            [contentWidth]="80"
            [allowRemove]="true"
            label=""
          />
        </div>
      </div>
      <div class="col-12 col-md-4">
        <p class="text-xs text-body-secondary mb-1">Placas del camion</p>
        <div class="card text-center p-2">
          <lux-input-img-signal
            [control]="form.controls.fotoPlacas"
            [urlImgCurrent]="urlFotoPlacas()"
            [contentHeight]="80"
            [contentWidth]="80"
            [allowRemove]="true"
            label=""
          />
        </div>
      </div>
      <div class="col-12 col-md-4">
        <p class="text-xs text-body-secondary mb-1">Medidor antes</p>
        <div class="card text-center p-2">
          <lux-input-img-signal
            [control]="form.controls.fotoMedidorAntes"
            [urlImgCurrent]="urlFotoMedidorAntes()"
            [contentHeight]="80"
            [contentWidth]="80"
            [allowRemove]="true"
            label=""
          />
        </div>
      </div>
      <div class="col-12 col-md-4">
        <p class="text-xs text-body-secondary mb-1">Medidor despues</p>
        <div class="card text-center p-2">
          <lux-input-img-signal
            [control]="form.controls.fotoMedidorDespues"
            [urlImgCurrent]="urlFotoMedidorDespues()"
            [contentHeight]="80"
            [contentWidth]="80"
            [allowRemove]="true"
            label=""
          />
        </div>
      </div>
      <div class="col-12 col-md-4">
        <p class="text-xs text-body-secondary mb-1">Nivel antes</p>
        <div class="card text-center p-2">
          <lux-input-img-signal
            [control]="form.controls.fotoNivelAntes"
            [urlImgCurrent]="urlFotoNivelAntes()"
            [contentHeight]="80"
            [contentWidth]="80"
            [allowRemove]="true"
            label=""
          />
        </div>
      </div>
      <div class="col-12 col-md-4">
        <p class="text-xs text-body-secondary mb-1">Nivel despues</p>
        <div class="card text-center p-2">
          <lux-input-img-signal
            [control]="form.controls.fotoNivelDespues"
            [urlImgCurrent]="urlFotoNivelDespues()"
            [contentHeight]="80"
            [contentWidth]="80"
            [allowRemove]="true"
            label=""
          />
        </div>
      </div>
      <div class="col-12 col-md-4">
        <p class="text-xs text-body-secondary mb-1">Nota</p>
        <div class="card text-center p-2">
          <lux-input-img-signal
            [control]="form.controls.fotoNota"
            [urlImgCurrent]="urlFotoNota()"
            [contentHeight]="80"
            [contentWidth]="80"
            [allowRemove]="true"
            label=""
          />
        </div>
      </div>
    </div>
  </div>

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    [label]="id ? 'Actualizar' : 'Guardar'"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
