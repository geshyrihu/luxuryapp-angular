@if (platformS.isMobile()) {
<app-recepcion-pipas-agua-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nueva Recepcion' })"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
  (downloadPdf)="onDownloadPdf($event)"
/>
} @else {
<app-recepcion-pipas-agua-list-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nueva Recepcion' })"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
  (downloadPdf)="onDownloadPdf($event)"
/>
}
