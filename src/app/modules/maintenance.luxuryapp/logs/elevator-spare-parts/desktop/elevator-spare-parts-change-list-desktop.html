<div class="card">
  <lux-table
    [globalFilterFields]="globalFilterFields()"
    [paginator]="true"
    [rows]="tableRows"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="true"
    [value]="data()"
    #dt
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    class="custom-table"
  >
    <!-- class="p-datatable-sm" -->
    <ng-template #caption>
      <div class="d-flex justify-content-between align-items-center w-full">
        <lux-button-web
          kind="download"
          displayMode="icon"
          (clicked)="downloadPdf.emit()"
          tooltip="Descargar listado de cambios de refacciones"
          tooltipPosition="top"
        />
        <lux-table-caption
          (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
          [dt]="dt"
        />
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th appSortableColumn="folio">
          FOLIO
          <lux-sorticon-web field="folio" />
        </th>
        <th appSortableColumn="changeDate">
          FECHA
          <lux-sorticon-web field="changeDate" />
        </th>
        <th appSortableColumn="machinery">
          EQUIPO
          <lux-sorticon-web field="machinery" />
        </th>
        <th appSortableColumn="failure">
          FALLA
          <lux-sorticon-web field="failure" />
        </th>

        <th appSortableColumn="partName">
          NOMBRE DE PIEZA
          <lux-sorticon-web field="partName" />
        </th>
        <th appSortableColumn="partKey">
          CLAVE DE PIEZA
          <lux-sorticon-web field="partKey" />
        </th>
        <th appSortableColumn="price">
          COSTO
          <lux-sorticon-web field="price" />
        </th>
        <th appSortableColumn="supervised">
          SUPERVISO
          <lux-sorticon-web field="supervised" />
        </th>
        <th class="table-col-5 no-print"></th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      <tr>
        <td>{{ item.folio }}</td>
        <td>{{ item.changeDate }}</td>
        <td>{{ item.machinery }}</td>
        <td>{{ item.failure }}</td>
        <td>{{ item.partName }}</td>
        <td>{{ item.partKey }}</td>
        <td>{{ item.price }}</td>
        <td>{{ item.supervised }}</td>
        <!-- Opciones -->

        <td class="no-print">
          <div class="d-flex">
            <lux-button-web
              kind="edit"
              displayMode="icon"
              severity="info"
              variant="soft"
              size="sm"
              tooltip="Editar"
              ariaLabel="Editar"
              (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
            />
            <lux-button-web
              kind="delete"
              displayMode="icon"
              severity="danger"
              variant="soft"
              size="sm"
              tooltip="Eliminar"
              (clicked)="delete.emit(item.id)"
            />
          </div>
        </td>
        <!-- Opciones -->
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <lux-table-empty-message [colspan]="9" />
    </ng-template>
    <ng-template #paginatorleft>
      <lux-table-footer [data]="data()" />
    </ng-template>
  </lux-table>
</div>
