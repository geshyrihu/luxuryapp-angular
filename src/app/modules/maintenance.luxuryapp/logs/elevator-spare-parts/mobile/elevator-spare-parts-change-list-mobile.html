<div class="d-flex d-md-none justify-content-end mb-2">
  <lux-button-web
    kind="download"
    displayMode="icon"
    severity="secondary"
    variant="soft"
    tooltip="Descargar PDF"
    (clicked)="downloadPdf.emit()"
  />
</div>

<div class="d-block d-md-none">
  <div class="card">
    <app-data-view-mobile
      [data]="data()"
      (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
      [globalFilterFields]="globalFilterFields()"
    >
      <ng-template #listItemTemplate let-item>
        <ili-list-item>
          <div
            start
            class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
            class="w-3rem h-3rem bg-primary-50"
          >
            <app-icon
              icon="material-symbols-light:elevator-outline"
              class="text-xl text-primary"
            />
          </div>

          <div class="d-flex justify-content-between align-items-center mb-1">
            <h2 class="fw-bold m-0 text-base text-wrap">{{ item.partName }}</h2>
            <span class="fw-bold text-lg text-green-600"
              >{{ item.price | currency }}</span
            >
          </div>
          <p class="text-sm text-body-secondary m-0">
            <app-icon
              [icon]="'material-symbols-light:currency-pound'"
              class="me-1 text-xs"
            />
            Folio: {{ item.folio }}
          </p>
          <p class="text-sm text-body-secondary m-0">
            <app-icon
              [icon]="'material-symbols-light:calendar-today'"
              class="me-1 text-xs"
            />
            {{ item.changeDate }}
          </p>
          <p class="text-sm text-body-secondary m-0">
            <app-icon
              [icon]="'material-symbols-light:settings'"
              class="me-1 text-xs"
            />
            {{ item.machinery }}
          </p>
          <p class="text-sm text-body mt-2 mb-1">
            <strong>Falla:</strong> {{ item.failure }}
          </p>
          <small class="text-xs text-body-secondary d-block mt-1"
            >Supervisí: {{ item.supervised }}</small
          >

          <ili-action-menu end>
            <ng-container actions>
              <lux-button-mobile
                kind="edit"
                (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
              />
              <lux-button-mobile
                kind="delete"
                color="danger"
                (clicked)="delete.emit(item.id)"
              />
            </ng-container>
          </ili-action-menu>
        </ili-list-item>
      </ng-template>
    </app-data-view-mobile>
  </div>
</div>
