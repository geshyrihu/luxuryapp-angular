@if (platformS.isMobile()) {
<app-elevator-spare-parts-change-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
  (downloadPdf)="onPdfReport()"
/>
} @else {
<app-elevator-spare-parts-change-list-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
  (downloadPdf)="onPdfReport()"
/>
}
