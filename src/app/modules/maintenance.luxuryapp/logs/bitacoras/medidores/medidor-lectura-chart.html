<!-- 📱 Segmento para Alternar Vistas -->
<div class="d-flex gap-2 mb-3 bg-bg-body-tertiary p-1 rounded">
  <button class="p-button p-button-text p-button-sm flex-fill" (click)="onSegmentChange('day')">
    <span class="">Diario</span>
  </button>
  <button class="p-button p-button-text p-button-sm flex-fill" (click)="onSegmentChange('month')">
    <span class="">Mensual</span>
  </button>
</div>

<!-- 🎛️ Filtros Condicionales -->
<div>
  <!-- Filtro Mensual -->
  @if (ViewMonth) {
  <div>
    <div class="m-0 shadow-none bg-body border-1 border-bg-body-tertiary">
      <div class="border-1 border shadow-sm rounded-xl">
        <div class="text-center fw-bold mb-2">Seleccionar Rango Mensual</div>
        <app-calendar-range></app-calendar-range>
      </div>
    </div>
  </div>
  }

  <!-- Filtro Diario -->
  @if (ViewDay) {
  <div>
    <div class="m-0 shadow-none bg-body border-1 border-bg-body-tertiary">
      <div class="border-1 border shadow-sm rounded-xl">
        <div class="text-center fw-bold mb-2">Seleccionar Rango Diario</div>
        <app-rango-calendario-yyyymmdd
          [mostrartextHasta]="false"
          [mostrartextDesde]="false"
        ></app-rango-calendario-yyyymmdd>
      </div>
    </div>
  </div>
  }
</div>

<!-- 📊 Gráfico -->
@if (data !== undefined) {
<div class="mt-3">
  <div class="border-1 border shadow-sm rounded-xl">
    <app-chart-wrapper
      type="bar"
      [data]="lineBarChart"
      [options]="chartOption()"
      height="320px"
      [showLegend]="false"
    />
  </div>
</div>
}
