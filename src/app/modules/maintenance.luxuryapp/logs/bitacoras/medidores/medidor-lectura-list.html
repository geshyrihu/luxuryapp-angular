<!-- 🖥️ INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<div class="hidden md:block"></div>
<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
    <div class="mt-1">
      <iw-button-download
        ngbTooltip="Exportar a Excel"
        iconClass="material-symbols-light:table-view"
        severity="success"
        (clicked)="exportExcel()"
      />
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="fechaRegistro">
        Fecha de Registro
        <p-sorticon field="fechaRegistro" />
      </th>
      <th pSortableColumn="lectura">
        Lectura
        <p-sorticon field="lectura" />
      </th>

      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <small> {{ item.fechaRegistro | apiDate: "dd-MMM-yyyy" }} </small>
      </td>
      <td>
        <small> {{ item.lectura }} </small>
      </td>

      <!-- Opciones -->

      <td class="no-print">
        <app-action-menu>
          <ng-container actions>
            <il-button-edit
              (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
              label="Editar"
            />
            <il-button-delete
              (confirmed)="onDelete(item.id)"
              label="Eliminar"
            />
          </ng-container>
        </app-action-menu>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="3" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>
<!-- 📱 INICIO: Componente adaptado para versión mívil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 rounded-lg"
        class="w-3rem h-3rem bg-primary-50"
      >
        <app-icon icon="material-symbols-light:speed" class="text-xl text-primary" />
      </div>

      <h2 class="font-bold m-0 text-base">{{ item.lectura }}</h2>
      <p class="text-sm text-500 m-0 mt-1">
        <app-icon [icon]="'material-symbols-light:calendar-today'" class="mr-1 text-xs" /> {{
        item.fechaRegistro | apiDate: "dd-MMM-yyyy" }}
      </p>

      <ili-action-menu end>
        <ng-container actions>
          <ili-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
