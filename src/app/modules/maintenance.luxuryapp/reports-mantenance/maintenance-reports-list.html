<page-title-report />
<div class="no-print mb-4">
  <div class="w-full sm:w-1/3">
    <div class="row align-items-center g-4">
      <label
        for="horizontal-firstname-input"
        class="col-12 col-sm-3 form-label"
      >
        Periodo
      </label>
      <div class="col-12 col-sm-9">
        <custom-input-text-signal
          type="month"
          ngbTooltip="SELECCIONA PERIODO"
          [ngModel]="periodo()"
          (change)="onFilterPeriod($event.target.value)"
          [horizontal]="false"
        />
      </div>
    </div>
  </div>
</div>

<app-table
  [value]="menu()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  class="custom-table d-none d-md-block"
>
  <ng-template #caption>
    <primeng-custom-caption
      [title]="'REPORTES'"
      [showAdd]="false"
      [showSearch]="false"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th class="table-col-70">REPORTE</th>
      <th class="table-col-30">VER</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.name }}</td>
      <td class="text-center">
        <a [routerLink]="[item.route]">
          ver
          <app-icon [icon]="'material-symbols-light:back-hand'" />
        </a>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="2" />
  </ng-template>
</app-table>

<app-data-view-mobile
  [data]="menu()"
  [globalFilterFields]="['name']"
  [showAdd]="false"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        
      >
        <app-icon
          icon="material-symbols-light:description"
          class="text-xl text-yellow-500"
        />
      </div>
      
        <h3>{{ item.name }}</h3>
      
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
