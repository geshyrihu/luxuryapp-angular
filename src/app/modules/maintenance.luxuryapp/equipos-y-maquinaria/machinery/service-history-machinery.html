<app-table
  [globalFilterFields]="globalFilterFields()"
  [value]="dataSignal()"
  #dt
  class="custom-table card d-none d-md-block"
>
  <ng-template #caption>
    <app-table-caption [showAdd]="false" [dt]="dt" />
  </ng-template>

  <ng-template #header>
    <tr>
      <th appSortableColumn="executionDate">
        Fecha
        <app-sorticon field="executionDate" />
      </th>
      <th appSortableColumn="typeMaintance">
        Tipo de mantenimiento
        <app-sorticon field="typeMaintance" />
      </th>
      <th appSortableColumn="recurrence">
        Frecuencia
        <app-sorticon field="recurrence" />
      </th>
      <th appSortableColumn="provider">
        Proveedor
        <app-sorticon field="provider" />
      </th>
      <th appSortableColumn="price">
        Costo
        <app-sorticon field="price" />
      </th>
      <th appSortableColumn="employeeResponsable">
        Superviso
        <app-sorticon field="employeeResponsable" />
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.executionDate }}</td>
      <td>{{ item.typeMaintance }}</td>
      <td>{{ item.recurrence }}</td>
      <td>{{ item.provider }}</td>
      <td>{{ item.price }}</td>
      <td>{{ item.employeeResponsable }}</td>
      <td>
        <div class="d-flex justify-content-center">
          <iw-button
            iconClass="edit"
            ngbTooltip="Editar"
            (clicked)="
              onEdit({
                id: item.id,
                title: 'Editar',
                machineryId: item.machineryId,
                providerId: item.providerId,
              })
            "
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <app-table-empty-message [colspan]="7" />
  </ng-template>
</app-table>
