<lux-table
  [value]="data()"
  #dt
  class="custom-table"
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [initialSortField]="'departament'"
  rowGroupMode="subheader"
  groupRowsBy="departament"
  [initialSortOrder]="1"
>
  <ng-template #caption>
    <lux-table-caption
      [title]="'Categorias de grupos'"
      (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th appSortableColumn="code">
        Codigo
        <lux-sorticon-web field="code" />
      </th>
      <th>Icono</th>
      <th>Color</th>
      <th appSortableColumn="name">
        Nombre
        <lux-sorticon-web field="name" />
      </th>
      <th appSortableColumn="description">
        DescripciÃ³n
        <lux-sorticon-web field="description" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>

  <ng-template #groupheader let-item>
    <tr pRowGroupHeader>
      <td colspan="6" class="bg-blue-50">
        <div class="d-flex align-items-center py-2 px-3">
          <lux-icon
            [icon]="'material-symbols-light:label'"
            class="me-2 text-blue-500"
          />
          <span class="fw-bold text-blue-900">{{ item.departament }}</span>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td>{{ item.code }}</td>
      <td class="text-xl">{{ item.emoji }}</td>
      <td>
        <div
          class="w-8 h-8 rounded-md"
          [style.backgroundColor]="item.color"
        ></div>
      </td>
      <td>{{ item.name }}</td>
      <td>{{ item.description }}</td>
      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            (clicked)="delete.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
