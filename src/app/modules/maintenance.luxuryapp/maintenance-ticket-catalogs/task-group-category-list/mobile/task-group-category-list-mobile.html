<app-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        class="w-3rem h-3rem bg-primary-50"
      >
        <app-icon
          icon="material-symbols-light:label-outline"
          class="text-xl text-primary"
        />
      </div>

      <div class="d-flex align-items-center">
        <span class="text-xl">{{ item.emoji }}</span>
        <div class="ms-2">
          <p class="fw-semibold m-0 text-body">{{ item.name }}</p>
          <p class="text-xs m-0 text-body-secondary">
            {{ item.code }} | {{ item.departament | uppercase }}
          </p>
        </div>
        <div
          class="w-6 h-6 rounded-md flex-shrink-0 ms-auto"
          [style.backgroundColor]="item.color"
        ></div>
      </div>

      <ili-action-menu end>
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
