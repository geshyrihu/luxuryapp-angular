<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  groupRowsBy="categoria"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="description">
        DESCRIPCIÓN
        <app-sorticon field="description" />
      </th>
      <th appSortableColumn="departament">
        DEPARTAMENTO
        <app-sorticon field="departament" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #groupheader let-item>
    <tr class="table-group-header bg-light">
      <td colspan="3" class="fw-bold">
        <app-icon
          icon="material-symbols-light:folder-open"
          class="text-primary me-2 align-middle text-xl"
        />
        <span class="align-middle">{{ item.categoria }}</span>
      </td>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.description }}</td>
      <td>{{ getDepartamentLabel(item.departament) }}</td>

      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <iw-button-delete (confirmed)="delete.emit(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="3" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
