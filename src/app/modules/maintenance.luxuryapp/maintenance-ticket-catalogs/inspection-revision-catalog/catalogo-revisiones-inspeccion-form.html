<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <custom-input-text-signal
        [control]="form.controls.id"
        hidden
        label="Id"
        [readonly]="true"
        [hidden]="false"
      />
      <custom-input-text-signal
        [control]="form.controls.description"
        label="DESCRIPCIÓN"
        placeholder="DESCRIPCIÓN"
      />
      <custom-input-select-signal
        [control]="form.controls.departament"
        label="Departamento"
        placeholder="Seleccione departamento"
        [data]="cb_departament()"
      />
      <custom-input-select-signal
        [control]="form.controls.equipoClasificacionId"
        label="Categoría"
        placeholder="Seleccione categoría"
        [data]="cb_equipoClasificacion()"
        [filter]="true"
      />

      <il-button-save
        [propertyId]="id"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
  </form>
