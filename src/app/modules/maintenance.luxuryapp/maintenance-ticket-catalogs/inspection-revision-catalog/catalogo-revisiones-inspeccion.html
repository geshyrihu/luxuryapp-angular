<!-- 💻 INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<lux-table-web
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  groupRowsBy="categoria"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card d-none d-md-block"
>
  <!-- class="p-datatable-sm" -->
  <ng-template #caption>
    <lux-table-caption-web
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="description">
        DESCRIPCIÓN
        <lux-sorticon-web field="description" />
      </th>
      <th appSortableColumn="departament">
        DEPARTAMENTO
        <lux-sorticon-web field="departament" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #groupheader let-item>
    <tr class="table-group-header bg-light">
      <td colspan="3" class="fw-bold">
        <lux-icon icon="material-symbols-light:folder-open" class="text-primary me-2 align-middle text-xl" />
        <span class="align-middle">{{ item.categoria }}</span>
      </td>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.description }}</td>
      <td>{{ getDepartamentLabel(item.departament) }}</td>

      <!-- Opciones -->
      <td class="no-print">
        <div class="d-flex">
          <iw-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <iw-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message-web [colspan]="3" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer-web [data]="dataSignal()" />
  </ng-template>
</lux-table-web>

<!--📲INICIO: Componente adaptado para versión móvil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        class="w-3rem h-3rem bg-primary-50"
      >
        <lux-icon
          icon="material-symbols-light:manage-search"
          class="text-xl text-primary"
        />
      </div>

      <h2 class="font-normal m-0">{{ item.description }}</h2>
      <p class="text-body-secondary m-0">
        {{ getDepartamentLabel(item.departament) }} ·
        {{ item.categoria }}
      </p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
