@if (platformS.isMobile()) {
  <app-catalogo-revisiones-inspeccion-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [departments]="cb_departament()"
    (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-catalogo-revisiones-inspeccion-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [departments]="cb_departament()"
    (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
}
