<lux-table
  [globalFilterFields]="globalFilterFields()"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  #dt
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="folio">
        Folio
        <lux-sorticon-web field="folio" />
      </th>
      <th appSortableColumn="name">
        Nombre
        <lux-sorticon-web field="name" />
      </th>
      <th appSortableColumn="assetCategory">
        CATEGORIA
        <lux-sorticon-web field="assetCategory" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.folio }}</td>
      <td>{{ item.name }}</td>
      <td>{{ item.assetCategory }}</td>
      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            (clicked)="delete.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="4" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
