<div>
  <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
    <lux-input-text-signal
      [control]="form.controls.id"
      hidden
      label="Id"
      [readonly]="true"
      [hidden]="false"
    />
    <lux-input-text-signal
      [control]="form.controls.nombreMedidorCategoria"
      label="Nombre"
      placeholder="nombre de categoria"
    />

    <div class="text-center mt-3">
      <lux-button-web
        kind="save"
        type="submit"
        severity="info"
        variant="soft"
        displayMode="both"
        [label]="id ? 'Actualizar' : 'Guardar'"
        [disabled]="form.invalid"
        [loading]="submitting()"
      />
    </div>
  </form>
</div>
