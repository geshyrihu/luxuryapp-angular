<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th appSortableColumn="folioId">
        Folio
        <app-sorticon field="folioId" />
      </th>
      <th appSortableColumn="responsibleArea">
        Departamento
        <app-sorticon field="responsibleArea" />
      </th>
      <th appSortableColumn="grupo">
        Grupo
        <app-sorticon field="grupo" />
      </th>
      <th appSortableColumn="descripcion">
        DESCRIPCIÓN
        <app-sorticon field="descripcion" />
      </th>
      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <span> {{ item.folioId }} </span>
      </td>
      <td>
        <span> {{ item.departamento }} </span>
      </td>
      <td>
        <span> {{ item.grupo }} </span>
      </td>
      <td>
        <span> {{ item.descripcion }} </span>
      </td>
      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <iw-button-delete (confirmed)="delete.emit(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="5" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
