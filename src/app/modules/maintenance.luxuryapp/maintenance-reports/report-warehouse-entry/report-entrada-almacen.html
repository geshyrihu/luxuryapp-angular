<page-title-report-maintenance title="ENTRADA INSUMOS" />
<app-table
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  class="custom-table card d-none d-md-block"
>
  <ng-template #caption>
    <app-table-caption
      title="ENTRADA INSUMOS"
      [showAdd]="false"
      [showSearch]="false"
    />
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td colspan="3">
        <p class="card-title">{{ item.producto }}</p>
      </td>
    </tr>
    @for (registro of item.registros; track registro) {
    <tr class="breakPage">
      <td>
        <p>{{ registro.fechaEntrada }}</p>
      </td>
      <td>
        <p>{{ registro.cantidad }}</p>
      </td>
      <td>
        <p>{{ registro.nameComercial }}</p>
      </td>
    </tr>
    }
  </ng-template>
</app-table>
