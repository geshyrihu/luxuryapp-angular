<page-title-report-maintenance title="PRÉSTAMO DE HERRAMIENTA" />
<lux-table
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  class="custom-table card d-none d-md-block"
>
  <ng-template #caption>
    <lux-table-caption
      title="PRÉSTAMO DE HERRAMIENTA"
      [showAdd]="false"
      [showSearch]="false"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-15">SALIDA</th>
      <th class="table-col-15">REGRESO</th>
      <th class="table-col-30">COLABORADOR</th>
      <th class="table-col-40">OBSERVACIONES</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td colspan="4">
        <p class="card-title">{{ item.producto }}</p>
      </td>
    </tr>
    @for (registro of item.registros; track registro) {
    <tr class="breakPage">
      <td>
        <p >{{ registro.fechaSalida }}</p>
      </td>
      <td>
        <p >{{ registro.fechaRegreso }}</p>
      </td>
      <td>
        <p >{{ registro.fullName }}</p>
      </td>
      <td>
        <p >{{ registro.observaciones }}</p>
      </td>
    </tr>
    }
  </ng-template>
</lux-table>
