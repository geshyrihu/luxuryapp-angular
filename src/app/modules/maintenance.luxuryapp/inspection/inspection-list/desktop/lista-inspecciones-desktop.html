<div class="d-flex flex-column gap-3 fadein">
  <!-- 1. Encabezado y Acciones -->
  <lux-toolbar-web>
    <ng-template #start>
      <h2 class="m-0 text-xl font-bold">Listado de Recorridos</h2>
    </ng-template>
    <ng-template #end>
      <div class="d-flex gap-2">
        <il-button
          iconClass="material-symbols-light:add-circle"
          label="Nuevo Recorrido"
          size="sm"
          lxTooltip="Nuevo Recorrido"
          (clicked)="add.emit()"
        />
        <il-button
          iconClass="material-symbols-light:menu-book-outline"
          label="Reportes"
          size="sm"
          severity="secondary"
          lxTooltip="Ver reportes de inspección"
          (clicked)="reportes.emit()"
        />
      </div>
    </ng-template>
  </lux-toolbar-web>

  <!-- 2. Tarjeta de Filtros -->
  <lux-card-web [elevated]="true">
    <ng-template #content>
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <custom-input-select-signal
            [ngModel]="selectedArea()"
            (ngModelChange)="filterAreaChange.emit($event)"
            [data]="areasResponsables()"
            label="Área"
            placeholder="Todas las áreas"
            [horizontal]="true"
            [filter]="true"
          />
        </div>
        <div class="col-12 col-md-6">
          <custom-input-select-signal
            [ngModel]="selectedRecurrence()"
            (ngModelChange)="filterRecurrenceChange.emit($event)"
            [data]="[
              { label: 'Diario', value: 'daily' },
              { label: 'Semanal', value: 'weekly' },
              { label: 'Mensual', value: 'monthly' }
            ]"
            label="Frecuencia"
            placeholder="Todas las Recurrencias"
            [horizontal]="true"
            [filter]="true"
          />
        </div>
      </div>
    </ng-template>
  </lux-card-web>

  <!-- 3. Tarjeta de Datos (Tabla) -->
  <lux-card-web [elevated]="true" [padded]="false">
    <ng-template #content>
      <lux-table-web
        #dt
        [globalFilterFields]="globalFilterFields"
        [paginator]="true"
        [rows]="tableRows"
        [rowsPerPageOptions]="rowsPerPageOptions"
        [scrollable]="true"
        [scrollHeight]="scrollHeight()"
        [showCurrentPageReport]="true"
        [value]="rows()"
        groupRowsBy="departament"
        class="custom-table w-100"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
      >
        <ng-template #header>
          <tr>
            <th appSortableColumn="name">
              Nombre
              <lux-sorticon-web field="name" />
            </th>
            <th appSortableColumn="frequency">
              Frecuencia
              <lux-sorticon-web field="frequency" />
            </th>
            <th class="no-print text-end">Acciones</th>
          </tr>
        </ng-template>

        <ng-template #groupheader let-item>
          <tr>
            <td colspan="3" class="bg-body-tertiary p-2">
              <span class="fw-bold ms-2 text-primary">{{ item.departament }}</span>
            </td>
          </tr>
        </ng-template>

        <ng-template #body let-item>
          <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.frequency }}</td>
            <td class="no-print text-end">
              <div class="d-flex gap-1 justify-content-end">
                <iw-button-edit
                  size="sm"
                  class="btn--circle"
                  [attr.aria-label]="'Editar ' + item.name"
                  (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
                />
                <iw-button-item
                  size="sm"
                  class="btn--circle"
                  icon="search"
                  [attr.aria-label]="'Ver detalles de ' + item.name"
                  (clicked)="detalles.emit(item.id)"
                />
                <iw-button-delete
                  size="sm"
                  class="btn--circle"
                  [attr.aria-label]="'Eliminar ' + item.name"
                  (clicked)="delete.emit(item.id)"
                />
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template #emptymessage>
          <app-custom-table-emptymessage />
        </ng-template>
      </lux-table-web>
    </ng-template>
  </lux-card-web>
</div>
