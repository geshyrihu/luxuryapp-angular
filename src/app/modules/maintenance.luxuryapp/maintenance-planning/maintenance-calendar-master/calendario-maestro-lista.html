<h4 class="mb-0 text-xl">Calendario General de Mantenimiento</h4>
<lux-divider />

@if (platformS.isMobile()) {
<app-calendario-maestro-lista-mobile
  [data]="flatData()"
  [globalFilterFields]="globalFilterFields()"
  [canManage]="isSuperUsuario()"
  (edit)="onModalForm($event.id, $event.mes)"
  (delete)="onDelete($event)"
/>
} @else {
<app-calendario-maestro-lista-desktop
  [data]="data()"
  [menuItems]="menuItems()"
  [canManage]="isSuperUsuario()"
  (add)="onModalForm($event.id, $event.mes)"
  (selectItem)="onSelectItem($event.item, $event.menu)"
  (datosServicio)="onDatosServicio($event)"
/>
}
