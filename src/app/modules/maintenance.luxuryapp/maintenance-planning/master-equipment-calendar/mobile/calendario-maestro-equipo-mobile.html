<lux-data-view-mobile
  [data]="data()"
  [showAdd]="showAdd()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit({ id: 0, title: 'Nuevo Registro' })"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <p class="fw-semibold m-0 text-body">{{ item.nombreEquipo }}</p>
      <p class="text-xs m-0 text-body-secondary">
        {{ item.equipoClasificacion }}
      </p>

      <lux-action-menu-mobile end>
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
