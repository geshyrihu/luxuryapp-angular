@if (platformS.isMobile()) {
<app-calendario-maestro-equipo-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: 0, title: 'Nuevo Registro' })"
  (edit)="onModalForm({ id: $event.id, title: 'Editar' })"
  (delete)="onDelete($event)"
/>
} @else {
<app-calendario-maestro-equipo-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  (edit)="onModalForm({ id: $event.id, title: 'Editar' })"
  (delete)="onDelete($event)"
/>
}
