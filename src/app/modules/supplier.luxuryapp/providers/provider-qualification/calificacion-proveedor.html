<div class="card p-2">
  <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
    <div class="grid mb-4 align-items-center">
      <label class="col-12 sm:col-3">Servicio</label>
      <div class="col-12 sm:col-9">
        <ngb-rating
          [max]="5"
          [readonly]="false"
          [rate]="form.get('servicio')?.value"
          (rateChange)="form.get('servicio')?.setValue($event)"
        />
      </div>
    </div>

    <div class="grid mb-4 align-items-center">
      <label class="col-12 sm:col-3">Precio</label>
      <div class="col-12 sm:col-9">
        <ngb-rating
          [max]="5"
          [readonly]="false"
          [rate]="form.get('precio')?.value"
          (rateChange)="form.get('precio')?.setValue($event)"
        />
      </div>
    </div>

    <div class="grid mb-4 align-items-center">
      <label class="col-12 sm:col-3">Entrega</label>
      <div class="col-12 sm:col-9">
        <ngb-rating
          [max]="5"
          [readonly]="false"
          [rate]="form.get('entrega')?.value"
          (rateChange)="form.get('entrega')?.setValue($event)"
        />
      </div>
    </div>

    <il-button-save [disabled]="form.invalid" [submitting]="submitting()" />
  </form>
</div>
