<div class="card">
  <div class="card-body">
    <form [formGroup]="form" autocomplete="off" (ngSubmit)="onSubmit()">
      <custom-input-text-signal
        [control]="form.controls.id"
        hidden
        label="Id"
      />

      <custom-input-date-signal
        [control]="form.controls.desde"
        label="Desde"
        placeholder="desde"
        [required]="true"
      />

      <custom-input-date-signal
        [control]="form.controls.hasta"
        label="Hasta"
        placeholder="hasta"
        [required]="true"
      />

      <il-button-save
        [propertyId]="id"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </form>
  </div>
</div>
