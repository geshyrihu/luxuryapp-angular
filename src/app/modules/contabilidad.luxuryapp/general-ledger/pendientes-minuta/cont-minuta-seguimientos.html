<p-table [value]="dataSignal()" class="custom-table card hidden md:block">
  <ng-template #header>
    <tr>
      <th ></th>
      <th ></th>
      <th ></th>
    </tr>
  </ng-template>
  <ng-template #body let-seguimiento>
    <tr>
      <td>
        {{ seguimiento.fecha }}, {{ seguimiento.seguimiento | titlecase }}
      </td>
      <td>
        <div class="flex content-center">
          <iw-button
            iconClass="edit"
            ngbTooltip="Editar"
            (clicked)="onModalFormSeguimiento(seguimiento.id)"
          />
          <iw-button-confirm
            icon="trash"
            ngbTooltip="Eliminar"
            (clicked)="onDeleteSeguimiento(seguimiento.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="3" />
  </ng-template>
</p-table>
