<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <!-- img -->
  <div class="mb-3">
    <custom-input-file-signal
      chooseLabel="Seleccionar Archivo"
      accept="application/pdf"
      [noMargin]="true"
      (fileSelected)="onFileSelect($event)"
    />

    <!-- Mostrar nombre del archivo seleccionado -->
    @if (selectedFileName()) {
    <div class="mt-2 p-2 rounded surface-ground">
      <app-icon [icon]="'material-symbols-light:picture-as-pdf'" class="mr-2" />
      <span class="text-sm">{{ selectedFileName() }}</span>
      <iw-button
        iconClass="material-symbols-light:close"
        (clicked)="clearFile()"
        severity="danger"
        [text]="true"
        [rounded]="true"
        customClass="ml-2"
      />
    </div>
    }
  </div>

  <il-button-save
    [propertyId]="id"
    [disabled]="form.invalid || !selectedFileName()"
    [submitting]="submitting()"
  />
</form>
