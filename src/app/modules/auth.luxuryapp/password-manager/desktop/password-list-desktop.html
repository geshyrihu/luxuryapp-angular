<div class="p-3 mb-3 rounded-lg text-sm">
  <lux-icon icon="material-symbols-light:info" class="me-1" />
  Credenciales de servicios de la empresa. No utilice para contraseñas
  personales.
</div>

<lux-table
  [value]="data()"
  [lazy]="true"
  (onPage)="load.emit($event)"
  [paginator]="true"
  [rows]="rows"
  [totalRecords]="totalRecords()"
  [loading]="loading()"
  [rowsPerPageOptions]="rowsPerPage"
  [tableStyle]="{ 'min-width': '50rem' }"
  #dt
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption (add)="add.emit()" [dt]="dt" />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="Platform.Name">
        Plataforma
        <app-sorticon field="Platform.Name" />
      </th>
      <th appSortableColumn="Username">
        Usuario
        <app-sorticon field="Username" />
      </th>
      <th>Contraseña</th>
      <th appSortableColumn="SubscriptionExpirationDate">
        Expiración
        <app-sorticon field="SubscriptionExpirationDate" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.platformName }}</td>
      <td>{{ item.username }}</td>
      <td>
        <div class="d-flex align-items-center gap-2">
          <span class="font-family-monospace">
            {{ getPasswordDisplay(item.id, item.password) }}
          </span>
          <lux-button-web
            displayMode="icon"
            type="button"
            [icon]="isPasswordVisible(item.id) ? 'material-symbols-light:visibility-off' : 'material-symbols-light:visibility-outline'"
            variant="text"
            [lxTooltip]="isPasswordVisible(item.id) ? 'Ocultar' : 'Mostrar'"
            tooltipPosition="top"
            (clicked)="togglePasswordVisibility(item.id)"
          />
          <lux-button-web
            displayMode="icon"
            type="button"
            icon="material-symbols-light:content-copy"
            variant="text"
            lxTooltip="Copiar al portapapeles"
            tooltipPosition="top"
            (clicked)="copyPassword(item.password)"
          />
        </div>
      </td>
      <td>{{ item.subscriptionExpirationDate | apiDate }}</td>
      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit(item.id)"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            ariaLabel="Eliminar"
            (clicked)="delete.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="5" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
