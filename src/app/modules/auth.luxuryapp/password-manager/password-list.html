@if (platformS.isMobile()) {
<app-password-list-mobile
  [data]="data()"
  (add)="onModalForm()"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
} @else {
<app-password-list-desktop
  [data]="data()"
  [totalRecords]="totalRecords()"
  [loading]="loading()"
  (load)="loadData($event)"
  (add)="onModalForm()"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
}
