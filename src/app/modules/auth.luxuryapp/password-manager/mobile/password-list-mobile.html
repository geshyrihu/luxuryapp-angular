<lux-data-view-mobile [data]="data()" (add)="add.emit()">
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg w-3rem h-3rem bg-yellow-100"
      >
        <lux-icon
          icon="material-symbols-light:key-outline"
          class="text-xl text-yellow-500"
        />
      </div>
      <div class="d-flex flex-column fw-bold">
        <span class="text-primary">{{ item.platformName }}</span>
        <span class="text-sm text-wrap text-body-secondary"
          >{{ item.username }}</span
        >
      </div>
      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit(item.id)"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</lux-data-view-mobile>
