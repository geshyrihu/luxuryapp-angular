<div class="card">
  <div class="card-body">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <custom-input-text-signal
        [control]="form.controls.secretName"
        label="Nombre del secreto"
        placeholder="ej. mi.servicio.api.key"
        [readonly]="isEditMode()"
      />
      @if (!isEditMode()) {
        <custom-input-select-signal
          [control]="form.controls.secretType"
          label="Tipo"
          [data]="secretTypeOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecciona el tipo"
        />
      }
      <custom-input-textarea-signal
        [control]="form.controls.plainValue"
        [label]="isEditMode() ? 'Nuevo valor' : 'Valor'"
        placeholder="Valor del secreto en texto plano"
        [rows]="5"
      />
      <div class="flex justify-content-end mt-3">
        <il-button-save
          [propertyId]="isEditMode() ? 'edit' : ''"
          [disabled]="form.invalid"
          [submitting]="submitting()"
        />
      </div>
    </form>
  </div>
</div>
