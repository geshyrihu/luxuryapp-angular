<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="d-flex flex-column gap-2"
>
  @if (!id) {
  <lux-input-select-signal
    [control]="form.controls.propertyId"
    [data]="properties()"
    label="Propiedad"
    [filter]="true"
    required
  />
  }

  <lux-input-select-signal
    [control]="form.controls.regulationArticleId"
    [data]="articles()"
    label="Artículo del Reglamento (opcional)"
    placeholder="Seleccionar artículo..."
    [filter]="true"
    [showClear]="true"
  />

  <lux-input-textarea-signal
    [control]="form.controls.description"
    label="DESCRIPCIÓN de la Infracción"
    placeholder="Describe detalladamente la infracción cometida..."
    [rows]="3"
    required
  />

  <div class="row g-4">
    <div class="col-12 col-md-6">
      <lux-input-date-signal
        [control]="form.controls.infractionDate"
        label="Fecha de la Infracción"
        required
      />
    </div>
    <div class="col-12 col-md-6">
      <lux-input-decimal-signal
        [control]="form.controls.amount"
        label="Importe de la Multa (MXN)"
        placeholder="0.00"
        required
      />
    </div>
  </div>

  <lux-input-textarea-signal
    [control]="form.controls.adminNotes"
    label="Notas Internas (opcional)"
    placeholder="Comentarios internos del administrador..."
    [rows]="2"
  />

  <div class="d-flex justify-content-end mt-3">
    <lux-button-web
      kind="save"
      type="submit"
      severity="info"
      variant="soft"
      displayMode="both"
      label="Guardar"
      [disabled]="form.invalid || submitting()"
      [loading]="submitting()"
    />
  </div>
</form>
