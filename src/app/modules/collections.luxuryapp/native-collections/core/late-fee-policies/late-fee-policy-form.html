<form [formGroup]="form" (ngSubmit)="onSubmit()" class="d-flex flex-column">
  <lux-input-number-signal
    [control]="form.controls.graceDays"
    label="Días de Gracia"
    placeholder="0"
    required
  />

  <lux-input-select-signal
    [control]="form.controls.type"
    [data]="typeOptions"
    label="Tipo de Recargo"
    [filter]="true"
    required
  />

  <lux-input-decimal-signal
    [control]="form.controls.rate"
    label="Tasa o Monto"
    placeholder="Ej: 5.00"
    required
  />

  <lux-input-decimal-signal
    [control]="form.controls.maxRate"
    label="Monto Máximo Acumulable"
    placeholder="Ej: 500.00"
    required
  />

  <div class="mt-2">
    <lux-input-check-signal
      [control]="form.controls.compoundsMonthly"
      label="Acumular mensualmente (Interés Compuesto)"
    />
  </div>

  <div class="d-flex justify-content-end mt-4">
    <lux-button-web
      kind="save"
      type="submit"
      severity="info"
      variant="soft"
      displayMode="both"
      label="Guardar"
      [disabled]="form.invalid || submitting()"
      [loading]="submitting()"
    />
  </div>
</form>
