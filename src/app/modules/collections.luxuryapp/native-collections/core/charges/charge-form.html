<form [formGroup]="form" (ngSubmit)="onSubmit()" class="d-flex flex-column">
  <lux-input-select-signal
    [control]="form.controls.propertyId"
    [data]="propertiesOptions()"
    label="Propiedad"
    placeholder="Seleccione Propiedad"
    [filter]="true"
    required
  />

  <lux-input-select-signal
    [control]="form.controls.chargeTemplateId"
    [data]="templatesOptions()"
    label="Plantilla Base (Opcional)"
    placeholder="Vincular a una Plantilla Configurada"
    [filter]="true"
    [showClear]="true"
  />

  <lux-input-select-signal
    [control]="form.controls.chargeTypeId"
    [data]="chargeTypeOptions()"
    label="Tipo de Cargo"
    [filter]="true"
    required
  />

  <lux-input-select-signal
    [control]="form.controls.status"
    [data]="statusOptions"
    label="Estado"
    [filter]="true"
    required
  />

  <lux-input-text-signal
    [control]="form.controls.concept"
    label="Concepto"
    placeholder="Ingrese el concepto"
    required
  />

  <lux-input-currency-signal
    [control]="form.controls.amount"
    label="Monto a Cobrar"
    required
  />

  <lux-input-date-signal
    [control]="form.controls.dueDate"
    label="Fecha de Vencimiento"
    required
  />

  <lux-input-date-signal
    [control]="form.controls.periodStart"
    label="Inicio de Periodo (Opcional)"
  />

  <lux-input-date-signal
    [control]="form.controls.periodEnd"
    label="Fin de Periodo (Opcional)"
  />

  <div class="d-flex flex-wrap border-top-1 border pt-3 mt-2"></div>
  <lux-input-currency-signal
    [control]="form.controls.discountAvailable"
    label="Descuento Disponible (Opcional)"
  />

  <lux-input-date-signal
    [control]="form.controls.discountDeadline"
    label="Límite de Descuento (Opcional)"
  />

  <div class="mt-2">
    <lux-input-check-signal
      [control]="form.controls.generatedAutomatically"
      label="Generado automáticamente (por Job)"
    />
  </div>

  <div class="d-flex justify-content-end mt-4">
    <lux-button-web
      kind="save"
      type="submit"
      severity="info"
      variant="soft"
      displayMode="both"
      label="Guardar"
      [disabled]="formInvalid() || submitting()"
      [loading]="submitting()"
    />
  </div>
</form>
