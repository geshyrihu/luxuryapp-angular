<form [formGroup]="form" (ngSubmit)="onSubmit()" class="d-flex flex-column">
  @if (isSystem()) {
  <lux-card class="card card--elevated mb-3">
    <div class="fw-semibold mb-1">Tipo del sistema</div>
    <div class="text-sm text-body line-height-3">
      Este tipo base ya participa en procesos automáticos. Puedes ajustar su
      nombre y DESCRIPCIÓN, pero su código queda protegido.
    </div>
  </lux-card>
  }

  <lux-input-text-signal
    [control]="form.controls.name"
    label="Nombre"
    placeholder="Ej: Cuota de mantenimiento"
    required
  />

  <lux-input-text-signal
    [control]="form.controls.code"
    label="Código"
    placeholder="Ej: 001"
    [readonly]="isSystem()"
    required
  />

  <lux-input-textarea-signal
    [control]="form.controls.description"
    label="DESCRIPCIÓN"
    placeholder="Describe cuando se usa este tipo de cargo."
    [rows]="4"
  />

  <div class="d-flex justify-content-end mt-4">
    <lux-button-web
      kind="save"
      type="submit"
      severity="info"
      variant="soft"
      displayMode="both"
      label="Guardar"
      [disabled]="form.invalid || submitting()"
      [loading]="submitting()"
    />
  </div>
</form>
