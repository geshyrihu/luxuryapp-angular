<div class="card p-0 p-md-4">
  <lux-table
    [value]="dataSignal()"
    [paginator]="true"
    [rows]="tableRows"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [scrollable]="true"
    [scrollHeight]="scrollHeight()"
    class="custom-table d-none d-md-block"
    #dt
  >
    <ng-template #caption>
      <lux-table-caption
        title="Tipos de Cargo"
        (add)="onModalForm()"
        [dt]="dt"
      />
    </ng-template>

    <ng-template #header>
      <tr>
        <th class="w-14rem">Nombre</th>
        <th class="w-10rem">Código / Cuenta</th>
        <th>DESCRIPCIÓN</th>
        <th class="w-8rem text-center">Origen</th>
        <th class="w-8rem text-center">Opciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-item>
      <tr>
        <td class="fw-semibold text-body">{{ item.name }}</td>
        <td>
          <span class="font-mono text-primary">{{ item.code }}</span>
        </td>
        <td class="text-body-secondary">
          {{ item.description || "Sin DESCRIPCIÓN" }}
        </td>
        <td class="text-center">
          <lux-tag
            [value]="originMeta(item.isSystem).label"
            [severity]="originMeta(item.isSystem).severity"
          />
        </td>
        <td class="text-center">
          <div class="d-flex justify-content-center align-items-center gap-2">
            <lux-button-web
              kind="edit"
              displayMode="icon"
              severity="info"
              variant="soft"
              size="sm"
              tooltip="Editar"
              ariaLabel="Editar"
              (clicked)="onModalForm(item.id)"
            />
            @if (!item.isSystem) {
            <lux-button-web
              kind="delete"
              displayMode="icon"
              severity="danger"
              variant="soft"
              size="sm"
              tooltip="Eliminar"
              ariaLabel="Eliminar"
              (clicked)="onDelete(item)"
            />
            } @else {
            <span class="text-xs text-body-secondary">Protegido</span>
            }
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <lux-table-empty-message
        [colspan]="5"
        icon="material-symbols-light:category"
        title="Sin tipos de cargo"
        message="Los tipos base aparecerán aquí y desde esta pantalla podrás agregar tipos personalizados."
      />
    </ng-template>
  </lux-table>
</div>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="['name', 'code', 'description']"
  (add)="onModalForm()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="w-2rem h-2rem rounded-lg bg-blue-100 d-flex align-items-center justify-content-center flex-shrink-0 ms-3"
      >
        <lux-icon
          icon="material-symbols-light:category"
          class="text-blue-700 text-xl"
        />
      </div>
      <div class="flex-fill min-w-0">
        <h3>{{ item.name }}</h3>
        <p>{{ item.code }}</p>
        <p>{{ originMeta(item.isSystem).label }}</p>
      </div>
      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="onModalForm(item.id)"
          />
          @if (!item.isSystem) {
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="onDelete(item)"
          />
          }
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
