<div class="d-flex flex-column p-2">
  <div
    class="d-flex align-items-start bg-amber-50 border-1 border-amber-200 rounded-xl p-4 mb-2"
  >
    <lux-icon
      [icon]="'material-symbols-light:info'"
      class="text-amber-500 text-xl mt-1 flex-shrink-0 me-3"
    />
    <div>
      <p class="text-sm fw-semibold text-amber-800 m-0">
        ¿Qué es una Nota de Crédito?
      </p>
      <p class="text-xs text-amber-700 mt-1 m-0">
        Registra una condonación de deuda para un departamento. El monto se
        aplicará automáticamente a sus cargos pendientes, reduciendo lo que
        debe.
      </p>
    </div>
  </div>

  <form [formGroup]="form" class="d-flex flex-column">
    <lux-input-select-signal
      [control]="form.controls.propertyId"
      [data]="propertiesOptions()"
      label="Departamento / Unidad"
      placeholder="Selecciona propiedad..."
      [filter]="true"
      required
    />

    <lux-input-currency-signal
      [control]="form.controls.amount"
      label="Monto a Condonar"
      required
    />

    <lux-input-date-signal
      [control]="form.controls.paymentDate"
      label="Fecha"
      required
    />

    <lux-input-select-signal
      [control]="form.controls.reference"
      [data]="reasonOptions"
      label="Razón / Motivo"
      placeholder="Selecciona el motivo..."
      [filter]="true"
      required
    />

    <lux-input-textarea-signal
      [control]="form.controls.notes"
      label="Observaciones adicionales (Opcional)"
      placeholder="Detalles del acuerdo o contexto de la condonación..."
      [rows]="3"
    />

    <div class="d-flex justify-content-end pt-2 border-top-1 border">
      <lux-button-web
        kind="save"
        type="button"
        severity="info"
        variant="soft"
        displayMode="both"
        (clicked)="onSubmit()"
        label="Emitir Nota de Crédito"
        [disabled]="form.invalid || submitting()"
        [loading]="submitting()"
      />
    </div>
  </form>
</div>
