<form [formGroup]="form" (ngSubmit)="onSubmit()" class="d-flex flex-column">
  <lux-input-select-signal
    [control]="form.controls.propertyId"
    [data]="propertiesOptions()"
    label="Propiedad Asociada"
    placeholder="Seleccione Propiedad"
    [filter]="true"
    required
  />

  <lux-input-currency-signal
    [control]="form.controls.amount"
    label="Monto del Cobro"
    required
  />

  <lux-input-date-signal
    [control]="form.controls.paymentDate"
    label="Fecha de Pago"
    required
  />

  <lux-input-select-signal
    [control]="form.controls.method"
    [data]="methodOptions"
    label="Método de Pago"
    [filter]="true"
    required
  />

  <lux-input-text-signal
    [control]="form.controls.reference"
    label="Referencia"
    placeholder="Ej. SPEI1234..."
  />

  <lux-input-select-signal
    [control]="form.controls.status"
    [data]="statusOptions()"
    label="Estado de Pago"
    [filter]="true"
    required
  />

  <div class="d-flex justify-content-end mt-4">
    <lux-button-web
      kind="save"
      type="submit"
      severity="info"
      variant="soft"
      displayMode="both"
      label="Guardar"
      [disabled]="form.invalid || submitting()"
      [loading]="submitting()"
    />
  </div>
</form>
