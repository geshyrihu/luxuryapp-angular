<div class="px-3 pt-3">
  @if (isLoading) {
  <div class="d-flex justify-content-center my-4">
    <app-icon [icon]="'material-symbols-light:progress-activity'" class="text-3xl text-primary" />
  </div>
  } @else {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="d-flex flex-column">
    <div class="p-3 rounded bg-body-tertiary mb-2">
      <custom-input-select-signal
        [control]="form.controls['billingMode']"
        label="Modo de Operacion AR"
        [data]="billingModeOptions()"
        hint="Define el modo operativo del modulo. El modo nativo es el flujo principal; cualquier compatibilidad externa se considera transicion temporal."
        [filter]="true"
      />
    </div>

    <div class="row g-4">
      <div class="col-12 col-md-6">
        <custom-input-number-signal
          [control]="form.controls['defaultDueDays']"
          label="Días para vencer (Predeterminado)"
          hint="Días tras la creación del cargo para fijar la fecha límite."
        />
      </div>
      <div class="col-12 col-md-6">
        <custom-input-number-signal
          [control]="form.controls['graceDays']"
          label="Días de Gracia"
          hint="Días que se perdonan tras el vencimiento antes del recargo."
        />
      </div>
    </div>

    <div class="mb-4">
      <custom-input-number-signal
        [control]="form.controls['globalLateFeePercentage']"
        label="Tasa de Mora Global (%)"
        hint="Opcional: porcentaje mensual. Si queda en blanco, depende de la politica individual de cada cargo."
      />
    </div>

    <div class="p-3 rounded bg-body-tertiary border-1 border-200 mb-4">
      <div class="mb-3">
        <h3 class="text-base fw-semibold text-body m-0">
          Canales de Comunicacion
        </h3>
        <p class="text-sm text-body-secondary mt-2 mb-0">
          Controla si Cobranza Nativa puede enviar correos y notificaciones
          operativas del modulo.
        </p>
      </div>

      <div class="row g-4">
        <div class="col-12 col-md-6">
          <custom-input-switch-signal
            [control]="form.controls['isEmailEnabled']"
            label="Emails"
            placeholder="Permitir envio de estados de cuenta, recordatorios y recibos"
          />
        </div>
        <div class="col-12 col-md-6">
          <custom-input-switch-signal
            [control]="form.controls['isPushNotificationEnabled']"
            label="Notificaciones"
            placeholder="Permitir push e in-app para eventos administrativos"
          />
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-4">
      <il-button
        label="Cancelar"
        iconClass="material-symbols-light:close"
        variant="text"
        severity="secondary"
        (clicked)="onClose()"
        [disabled]="isLoading || submitting()"
      />
      <lux-button-web
        kind="save"
        type="button"
        severity="info"
        variant="soft"
        displayMode="both"
        label="Guardar"
        (clicked)="onSubmit()"
        [loading]="submitting()"
      />
    </div>
  </form>
  }
</div>
