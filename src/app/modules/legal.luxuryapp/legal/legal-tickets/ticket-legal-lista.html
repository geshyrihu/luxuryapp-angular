@if (platformS.isMobile()) {
<app-ticket-legal-lista-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [canChangeCustomer]="canChangeCustomer"
  (add)="onModalForm({ id: '', title: 'AGREGAR TICKET LEGAL' })"
  (reasignarCliente)="onReasignarCliente($event)"
  (seguimiento)="onModalSeguimiento($event)"
  (updateStatus)="onModalUpdateStatus($event)"
/>
} @else {
<app-ticket-legal-lista-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [cbCustomer]="cb_customer()"
  [canChangeCustomer]="canChangeCustomer"
  (add)="onModalForm({ id: '', title: 'AGREGAR TICKET LEGAL' })"
  (edit)="onModalEdit($event)"
  (updateStatus)="onModalUpdateStatus($event)"
  (seguimiento)="onModalSeguimiento($event)"
  (reasignarCliente)="onReasignarCliente($event)"
  (exportExcel)="exportToExcel()"
  (customerFilter)="onCustomerFilter($event)"
/>
}
