<lux-page-title-report title="Reporte General de Pendientes" />

@if (dataExternal().length > 0 || dataInternal().length > 0 ||
unassignedData().length > 0) { @if (platformS.isMobile()) {
<app-ticket-legal-reportes-pendientes-mobile
  [dataExternal]="dataExternal()"
  [dataInternal]="dataInternal()"
  [unassignedData]="unassignedData()"
/>
} @else {
<app-ticket-legal-reportes-pendientes-desktop
  [dataExternal]="dataExternal()"
  [dataInternal]="dataInternal()"
  [unassignedData]="unassignedData()"
/>
} } @else {
<lux-empty-state
  icon="material-symbols-light:check-circle-outline"
  title="Sin pendientes"
  message="No hay tickets legales pendientes en este momento."
/>
}
