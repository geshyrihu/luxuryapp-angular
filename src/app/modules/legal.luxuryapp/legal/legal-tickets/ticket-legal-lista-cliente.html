@if (dataSignal()) { @if (platformS.isMobile()) {
<app-ticket-legal-lista-cliente-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  (updateStatus)="onModalUpdateStatus($event)"
  (seguimientoCliente)="onModalSeguimientoCliente($event)"
  (viewDetail)="onModalViewDetail($event)"
/>
} @else {
<app-ticket-legal-lista-cliente-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'AGREGAR TICKET LEGAL' })"
  (updateStatus)="onModalUpdateStatus($event)"
  (seguimientoCliente)="onModalSeguimientoCliente($event)"
  (viewDetail)="onModalViewDetail($event)"
/>
} }
