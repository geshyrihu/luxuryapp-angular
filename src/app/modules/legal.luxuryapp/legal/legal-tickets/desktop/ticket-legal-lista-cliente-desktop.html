<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'AGREGAR TICKET LEGAL' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-10 font-size-12">FOLIO</th>
      <th class="table-col-10 font-size-12">FECHA SOLICITUD</th>
      <th class="table-col-10 font-size-12">SOLICITA</th>
      <th class="table-col-10 font-size-12">ASUNTO</th>
      <th class="table-col-10 font-size-12">DESCRIPCIÓN</th>
      <th class="table-col-10 font-size-12">ESTATUS</th>
      <th class="table-col-10 font-size-12">FECHA DE CONCLUSIÓN</th>
      <th class="table-col-10 font-size-12">DÍAS</th>
      <th class="table-col-10 font-size-12">SEGUIMIENTO</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.folio }}</td>
      <td>{{ item.requestDate }}</td>
      <td>{{ item.creator }}</td>
      <td>{{ item.title }}</td>
      <td class="text-center">
        @if (item.description && item.description.length > 0) {
        <app-icon
          [icon]="'material-symbols-light:book'"
          class="icon-xl cursor-pointer"
          (click)="viewDetail.emit({ id: item.id })"
          lxTooltip="Ver detalles"
        />
        }
      </td>
      <td class="text-center">
        <lux-tag
          class="p-2 cursor-pointer"
          lxTooltip="Actualizar estatus"
          (click)="updateStatus.emit({ id: item.id })"
          [severity]="
            item.status === 0 ? 'danger' :
            item.status === 1 ? 'info' :
            item.status === 2 ? 'success' :
            item.status === 4 ? 'secondary' : 'warn'
          "
          [value]="
            item.status === 0 ? 'PENDIENTE' :
            item.status === 1 ? 'EN PROCESO' :
            item.status === 2 ? 'CONCLUIDO' :
            item.status === 4 ? 'CANCELADO' : 'OTRO'
          "
        />
      </td>
      <td>{{ item.completionDate }}</td>
      <td class="text-center">{{ item.diferenciaDias }}</td>
      <td class="text-center">
        <iw-button-tracking
          [ticketId]="item.id"
          [badgeCount]="item.tracking"
          (clickTracking)="seguimientoCliente.emit({ ticketId: item.id, title: 'Seguimiento' })"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="9" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
