<div class="card">
  <div class="d-flex flex-wrap align-items-end gap-3">
    <div class="flex-fill">
      <lux-input-select-signal
        [control]="statusControl"
        label="Estatus"
        [data]="statusOptions"
      />
    </div>
    <div>
      <lux-button-web
        label="Guardar"
        variant="outline"
        [loading]="loading()"
        (clicked)="onSubmit()"
      />
    </div>
  </div>
</div>
