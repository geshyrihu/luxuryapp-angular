<page-title-report title="Reporte Legal Externo — Cierre de Periodo" />

<!-- Selector de rango de fechas -->
<div class="row mb-3 g-4">
  <div class="col-12 col-md-6">
    <app-task-date-range-selector
      (selectedDates)="onDateRangeSelected($event)"
    />
  </div>
</div>
<hr />

<div class="text-center mb-3">
  <h4 class="mb-0">
    LEGAL EXTERNO — CIERRE DEL {{ startDate() | uppercase }} HASTA {{ endDate()
    | uppercase }}
  </h4>
</div>

@if (platformS.isMobile()) {
<app-ticket-legal-reportes-externos-mobile
  [reportData]="reportData()"
  [requestsAttended]="requestsAttended()"
  [requestsPending]="requestsPending()"
/>
} @else {
<app-ticket-legal-reportes-externos-desktop
  [reportData]="reportData()"
  [kpiRows]="kpiRows()"
  [requestsAttended]="requestsAttended()"
  [requestsPending]="requestsPending()"
/>
}
