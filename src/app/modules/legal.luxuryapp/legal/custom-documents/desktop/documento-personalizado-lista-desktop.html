<lux-table
  [globalFilterFields]="globalFilterFields()"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  #dt
  class="custom-table card p-0 p-md-4"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="bg-gradient text-white text-center" appSortableColumn="folio">
        Folio
        <app-sorticon field="folio" />
      </th>
      <th class="bg-gradient text-white text-center">Fecha</th>
      <th class="text-center" appSortableColumn="name">
        Nombre
        <app-sorticon field="name" />
      </th>
      <th class="text-center">Descargar</th>
      <th class="text-center no-print table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td class="text-center">{{ item.folio }}</td>
      <td class="text-center">{{ item.createAt }}</td>
      <td class="text-center text-break">{{ item.name }}</td>
      <td class="text-center">
        <iw-button-view-pdf [url]="item.path" fileName="Documento" />
      </td>
      <td class="text-center no-print">
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <iw-button-delete
            (confirmed)="delete.emit(item.id)"
            lxTooltip="Eliminar"
            tooltipPosition="top"
          >
          </iw-button-delete>
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="5" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
