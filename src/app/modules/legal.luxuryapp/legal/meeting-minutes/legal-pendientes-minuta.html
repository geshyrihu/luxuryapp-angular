<div class="d-flex justify-content-start gap-1 flex-wrap">
  <lux-button-web
    label="Pendientes"
    [severity]="statusFiltro == 0 ? 'primary' : 'secondary'"
    [variant]="statusFiltro == 0 ? null : 'text'"
    size="sm"
    (clicked)="onFiltrarData(0)"
  />
  <lux-button-web
    label="Concluidos"
    [severity]="statusFiltro == 1 ? 'primary' : 'secondary'"
    [variant]="statusFiltro == 1 ? null : 'text'"
    size="sm"
    (clicked)="onFiltrarData(1)"
  />
  <lux-button-web
    label="No Autorizados"
    [severity]="statusFiltro == 2 ? 'primary' : 'secondary'"
    [variant]="statusFiltro == 2 ? null : 'text'"
    size="sm"
    (clicked)="onFiltrarData(2)"
  />
  <lux-button-web
    label="Todos"
    [severity]="statusFiltro == 4 ? 'primary' : 'secondary'"
    [variant]="statusFiltro == 4 ? null : 'text'"
    size="sm"
    (clicked)="onFiltrarData(4)"
  />
</div>

@if (platformS.isMobile()) {
<app-legal-pendientes-minuta-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (addTracking)="onModalFormSeguimiento($event, 0)"
  (viewAll)="onModalTodosSeguimientos($event)"
  (editMinuta)="onModalFormMinutaDetalle({ id: $event, header: 'Editar Asunto' })"
/>
} @else {
<app-legal-pendientes-minuta-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (addTracking)="onModalFormSeguimiento($event, 0)"
  (viewAll)="onModalTodosSeguimientos($event)"
  (editMinuta)="onModalFormMinutaDetalle({ id: $event, header: 'Editar Asunto' })"
/>
}
