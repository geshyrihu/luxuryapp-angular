<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table custom-table-fixed card"
>
  <ng-template #caption>
    <lux-table-caption [title]="'Legal'" [showAdd]="false" [dt]="dt" />
  </ng-template>
  <ng-template #colgroup>
    <colgroup>
      <col class="table-col-8" />
      <col class="table-col-10" />
      <col class="table-col-34" />
      <col class="table-col-30" />
      <col class="table-col-8" />
      <col class="table-col-10" />
    </colgroup>
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="code">
        FOLIO
        <app-sorticon field="code" />
      </th>
      <th appSortableColumn="cliente">
        CLIENTE
        <app-sorticon field="cliente" />
      </th>
      <th appSortableColumn="fechaSolicitudFiltro">
        SOLICITUD
        <app-sorticon field="fechaSolicitudFiltro" />
      </th>
      <th appSortableColumn="pendiente">
        SEGUIMIENTO
        <app-sorticon field="pendiente" />
      </th>
      <th appSortableColumn="status">
        ESTATUS
        <app-sorticon field="status" />
      </th>
      <th>OP</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.folio }}</td>
      <td>{{ item.cliente }}</td>
      <td>
        <div class="h6">
          {{ item.fechaSolicitud }} {{ item.titulo | titlecase }}
        </div>
        <div
          class="text-justify"
          [innerHTML]="item.pendiente | sanitizeHtml"
        ></div>
      </td>
      <td>
        @if (item.seguimientos.length > 0) {
        <li>
          {{ item.seguimientos[0].fecha }}, {{ item.seguimientos[0].seguimiento
          }}
        </li>
        }
      </td>
      <td class="text-center">
        <lux-tag
          [value]="
            item.status === 0
              ? 'Pendiente'
              : item.status === 1
                ? 'Completado'
                : 'Cancelado'
          "
          [severity]="
            item.status === 0
              ? 'danger'
              : item.status === 1
                ? 'success'
                : 'secondary'
          "
        ></lux-tag>
      </td>

      <td class="no-print">
        <app-action-menu>
          <ng-container actions>
            <il-button-item
              iconClass="material-symbols-light:picture-as-pdf"
              (clicked)="viewAll.emit(item.id)"
              label="Ver todos los seguimientos"
              iconClass="material-symbols-light:format-list-bulleted"
              []="true"
            />
            <il-button-add
              (clicked)="addTracking.emit(item.id)"
              label="Agregar Seguimiento"
              []="true"
            />
            <lux-button-web
              kind="edit"
              severity="info"
              variant="soft"
              (clicked)="editMinuta.emit(item.id)"
            />
          </ng-container>
        </app-action-menu>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
