<div class="committee-grid">
  @for (category of documentCategories; track category.routeParam) {
  <a
    [routerLink]="[category.routeParam]"
    class="committee-card animate__animated animate__fadeIn"
    [title]="category.title"
  >
    <div class="committee-card__media">
      <img
        [src]="category.image"
        [alt]="category.title"
        class="committee-card__img"
        loading="lazy"
      />
      <span class="committee-card__overlay"></span>
      <h3 class="committee-card__title">{{ category.title }}</h3>
    </div>
  </a>
  }
</div>
