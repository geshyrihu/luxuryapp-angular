<section class="committee-doc-list">
  <h3 class="committee-doc-title">{{ pageTitle }}</h3>

  @if (!loading() && dataSignal().length === 0) {
  <div class="committee-doc-empty">
    <app-icon icon="material-symbols-light:folder-open" class="committee-doc-empty__icon" />
    <p class="committee-doc-empty__text">No se encontraron documentos</p>
  </div>
  } @else { @for (item of dataSignal(); track item.id) {
  <button
    type="button"
    class="committee-doc-item"
    (click)="viewPdf(item.path, item.name)"
  >
    <span class="committee-doc-item__icon">
      <app-icon icon="material-symbols-light:description" class="text-primary" />
    </span>
    <span class="committee-doc-item__content">
      <span class="committee-doc-item__title" [title]="item.name"
        >{{ item.name }}</span
      >
      <span class="committee-doc-item__subtitle">
        {{ item.primaryDetail }}@if (item.date) { · {{ item.date }} }
      </span>
    </span>
    <app-icon icon="material-symbols-light:chevron-right" class="committee-doc-item__chevron" />
  </button>
  } }
</section>
