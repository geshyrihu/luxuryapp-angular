<lux-table
  #dt
  [value]="data()"
  [globalFilterFields]="globalFilterFields()"
  sortField="id"
  sortMode="single"
  rowGroupMode="subheader"
  groupRowsBy="id"
  [tableStyle]="{ 'min-width': '60rem' }"
  [scrollable]="true"
  class="custom-table card"
>
  <!-- class="p-datatable-sm" -->
  <ng-template #caption>
    <div class="row align-items-center g-4">
      <div class="col-12 col-md-10">
        <lux-table-caption
          (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
          [dt]="dt"
          label="Agregar asunto"
        />
      </div>

      <div class="col-12 col-md-2">
        <il-button
          ngbTooltip="Agregar categoria"
          customClass="btn-outline-primary
              w-full"
          icon="material-symbols-light:add mr-2"
          label="Agregar categoria"
          (clicked)="categoryForm.emit({ id: '', title: 'Agregar categoria' })"
        />
      </div>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-5">#</th>
      <th class="table-col-60">Asunto</th>
      <th class="table-col-20">Responsable</th>
      <th class="table-col-15"></th>
    </tr>
  </ng-template>
  <ng-template #groupheader let-category>
    <tr pRowGroupHeader>
      <td colspan="3">
        <span class="fw-bold ms-2 font-size-18">{{ category.name }}</span>
      </td>
      <td>
        <div class="d-flex justify-content-center">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="categoryForm.emit({ id: category.id, title: 'Editar' })"
          />
          <iw-button-delete (confirmed)="categoryDelete.emit(category.id)" />
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #body let-category let-rowIndex="rowIndex">
    @for ( legalMatter of category.legalMatters; track legalMatter; let i =
    $index ) {
    <tr>
      <!-- óndice -->
      <td>{{ rowIndex + 1 }}.{{ i + 1 }}</td>
      <td>{{ legalMatter.title }}</td>
      <td>{{ legalMatter.isInternal ? "Interno" : "Externo" }}</td>
      <!-- Opciones -->
      <td class="no-print">
        <app-action-menu>
          <ng-container actions>
            <lux-button-web
              kind="edit"
              severity="info"
              variant="soft"
              (clicked)="edit.emit({ id: legalMatter.id, title: 'Editar' })"
            />
            <il-button-delete
              (confirmed)="delete.emit(legalMatter.id)"
              label="Eliminar"
              []="true"
            />
          </ng-container>
        </app-action-menu>
      </td>
      <!-- Opciones -->
    </tr>
    }
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="4" />
  </ng-template>
</lux-table>
