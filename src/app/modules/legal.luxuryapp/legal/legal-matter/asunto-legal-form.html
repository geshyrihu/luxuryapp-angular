<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <!-- Título del Asunto -->
  <lux-input-autocomplete-signal
    (propagar)="saveCategorie($event)"
    [control]="form.controls.legalMatterCategory"
    [data]="cb_categories()"
    label="Categoria"
    placeholder="Escribe para buscar categoria"
    [horizontal]="false"
  />
  <lux-input-text-signal
    [control]="form.controls.title"
    [horizontal]="false"
    label="Asunto"
    placeholder="Asunto"
  />
  <lux-input-select-signal
    [control]="form.controls.isInternal"
    [data]="cb_resposanbles"
    [horizontal]="false"
    label="Responsable:"
    [filter]="true"
  />

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    [label]="id ? 'Actualizar' : 'Guardar'"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
