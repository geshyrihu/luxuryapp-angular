<app-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card d-none d-md-block"
>
  <ng-template #caption>
    <app-table-caption
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th appSortableColumn="posicionComite">
        <p class="card-title">Posicion</p>
        <app-sorticon field="posicionComite" />
      </th>
      <th appSortableColumn="nameProperty">
        <p class="card-title">Nombre</p>
        <app-sorticon field="nameProperty" />
      </th>
      <th appSortableColumn="departamento">
        <p class="card-title">Departamento</p>
        <app-sorticon field="departamento" />
      </th>
      <th appSortableColumn="email">
        <p class="card-title">Correo</p>
        <app-sorticon field="email" />
      </th>
      <th>
        <p class="card-title">Celular</p>
      </th>

      <th class="table-col-5">
        <p class="card-title">Opciones</p>
      </th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <p class="card-title">{{ item.posicionComite }}</p>
      </td>
      <td>
        <p class="card-title">{{ item.nameProperty }}</p>
      </td>
      <td>
        <p class="card-title">{{ item.departamento }}</p>
      </td>
      <td>
        <p class="card-title">{{ item.email }}</p>
      </td>
      <td>
        <p class="card-title">{{ item.celular }}</p>
      </td>

      <td class="no-print">
        <div class="d-flex">
          <iw-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar', nameProperty: item.nameProperty })"
          />
          <iw-button-delete (confirmed)="onDelete(item.id)" />

          <iw-button-send-email
            confirmMessage="Enviar usuario y contrasena de acceso."
            (confirmed)="onSendCredential(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <app-table-empty-message [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <app-table-footer [data]="dataSignal()" />
  </ng-template>
</app-table>

<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
  trackByProperty="id"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        class="w-3rem h-3rem bg-primary-50"
      >
        <app-icon
          icon="material-symbols-light:group-outline"
          class="text-xl text-primary"
        />
      </div>

      <h2 class="font-normal m-0">{{ item.nameProperty }}</h2>
      <p class="text-medium text-body-secondary m-0">
        {{ item.posicionComite }} | {{ item.departamento }}
      </p>
      <p class="text-medium text-body-secondary m-0">{{ item.email }}</p>
      <p class="text-medium text-body-secondary m-0">{{ item.celular }}</p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar', nameProperty: item.nameProperty })"
            label="Editar"
          />
          <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
          <ili-button-send-email
            confirmMessage="Enviar usuario y contrasena de acceso."
            (confirmed)="onSendCredential(item.id)"
            label="Enviar"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
