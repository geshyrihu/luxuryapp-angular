@if (platformS.isMobile()) {
  <app-work-contract-list-mobile
    [data]="items()"
    [globalFilterFields]="globalFilterFields"
    [showAdd]="!!employeeId()"
    (add)="onModalForm($event)"
    (edit)="onEdit($event)"
    (viewDetail)="onViewDetail($event)"
  />
} @else {
  <app-work-contract-list-desktop
    [data]="items()"
    [globalFilterFields]="globalFilterFields"
    [showAdd]="!!employeeId()"
    (add)="onModalForm($event)"
    (edit)="onEdit($event)"
    (viewDetail)="onViewDetail($event)"
    (delete)="onDelete($event)"
    (terminate)="onTerminate($event)"
  />
}
