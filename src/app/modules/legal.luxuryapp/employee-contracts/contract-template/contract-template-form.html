<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-text-signal
    [control]="form.controls.name"
    label="Nombre del Machote"
    placeholder="Ej: Contrato Indeterminado Estandar"
  />
  <lux-input-text-signal
    [control]="form.controls.version"
    label="Versión"
    placeholder="1.0"
  />
  <lux-input-select-signal
    [control]="form.controls.contractType"
    label="Tipo de Contrato Aplicable"
    [data]="cb_contractType"
    [filter]="true"
  />
  <lux-input-switch-signal [control]="form.controls.isActive" label="Activo" />
  <lux-input-textarea-signal
    [control]="form.controls.description"
    label="DESCRIPCIÓN"
    [rows]="2"
  />
  <lux-input-textarea-signal
    [control]="form.controls.templateContent"
    label="Contenido del Machote"
    [rows]="12"
    [placeholder]="placeholderText"
  />
  <div class="d-flex justify-content-end mt-2">
    <lux-button-web
      kind="save"
      type="submit"
      severity="info"
      variant="soft"
      displayMode="both"
      label="Guardar Machote"
      [disabled]="form.invalid"
      [loading]="submitting()"
    />
  </div>
</form>
