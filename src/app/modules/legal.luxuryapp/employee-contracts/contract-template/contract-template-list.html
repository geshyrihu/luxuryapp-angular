@if (platformS.isMobile()) {
  <app-contract-template-list-mobile
    [data]="items()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm($event)"
    (edit)="onEdit($event)"
    (toggleActive)="onToggleActive($event)"
  />
} @else {
  <app-contract-template-list-desktop
    [data]="items()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm($event)"
    (edit)="onEdit($event)"
    (toggleActive)="onToggleActive($event)"
    (delete)="onDelete($event)"
  />
}
