<lux-table
  [value]="data()"
  class="custom-table card"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [globalFilterFields]="globalFilterFields()"
  #dt
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo Machote de Contrato' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-xl">Nombre</th>
      <th class="table-col-md">Tipo de Contrato</th>
      <th class="table-col-sm">Version</th>
      <th class="table-col-sm">Creado</th>
      <th class="table-col-sm text-center">Activo</th>
      <th class="table-col-actions">Acciones</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.name }}</td>
      <td>{{ item.contractType }}</td>
      <td>v{{ item.version }}</td>
      <td>{{ item.createdAt | apiDate:'dd/MM/yyyy' }}</td>
      <td class="text-center">
        @if (item.isActive) {
        <span class="badge badge-success">Activo</span>
        } @else {
        <span class="badge badge-danger">Inactivo</span>
        }
      </td>
      <td class="text-center">
        <iw-button-item
          [icon]="item.isActive ? 'material-symbols-light:toggle-on' : 'material-symbols-light:toggle-off'"
          [title]="item.isActive ? 'Desactivar' : 'Activar'"
          (clicked)="toggleActive.emit(item)"
        />
        <lux-button-web
          kind="edit"
          displayMode="icon"
          severity="info"
          variant="soft"
          size="sm"
          tooltip="Editar"
          ariaLabel="Editar"
          (clicked)="edit.emit(item)"
        />
        <iw-button-delete (confirmed)="delete.emit(item.id)" />
      </td>
    </tr>
  </ng-template>
  <ng-template #footer>
    <lux-table-footer [data]="data()" />
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="6" />
  </ng-template>
</lux-table>
