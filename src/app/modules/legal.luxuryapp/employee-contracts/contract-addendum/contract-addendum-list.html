@if (platformS.isMobile()) {
  <app-contract-addendum-list-mobile
    [data]="items()"
    [globalFilterFields]="globalFilterFields"
    [showAdd]="!!employeeId()"
    (add)="onModalForm($event)"
    (edit)="onEdit($event)"
  />
} @else {
  <app-contract-addendum-list-desktop
    [data]="items()"
    [globalFilterFields]="globalFilterFields"
    [showAdd]="!!employeeId()"
    (add)="onModalForm($event)"
    (edit)="onEdit($event)"
    (sign)="onSign($event)"
    (cancel)="onCancel($event)"
    (delete)="onDelete($event)"
  />
}
