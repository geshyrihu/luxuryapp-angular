<div class="p-4">
  <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
    <custom-input-text-signal
      [control]="form.controls.id"
      hidden
      label="Id"
      [readonly]="true"
    />
    <custom-input-date-signal
      [control]="form.controls.createAt"
      label="Fecha de creación"
      placeholder="Selecciona la fecha"
    />

    <custom-input-text-signal
      [control]="form.controls.name"
      label="Nombre del documento"
      placeholder="Nombre"
    />
    <div class="row mb-3 align-items-center g-4">
      <label class="col-12 col-sm-3 font-medium">Documento</label>
      <div class="col-12 col-sm-9">
        <custom-input-file-signal
          accept="application/pdf"
          (fileSelected)="change($event)"
          [horizontal]="false"
        />
        @if (fileError) {
        <small class="text-red-500"> El documento es requerido. </small>
        }
      </div>
    </div>

    <il-button-save
      [propertyId]="id"
      [disabled]="form.invalid"
      [submitting]="submitting()"
    />
  </form>
</div>
