<lux-table
  [globalFilterFields]="globalFilterFields()"
  [loading]="loading()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [tableStyle]="{ 'min-width': '50rem' }"
  [value]="data()"
  dataKey="id"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
  [scrollable]="true"
  scrollHeight="750px"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th appSortableColumn="posicionComite">
        Posición
        <lux-sorticon-web field="posicionComite" />
      </th>
      <th appSortableColumn="nameProperty">
        Nombre
        <lux-sorticon-web field="nameProperty" />
      </th>
      <th appSortableColumn="departamento">
        Departamento
        <lux-sorticon-web field="departamento" />
      </th>
      <th appSortableColumn="email">
        Correo
        <lux-sorticon-web field="email" />
      </th>
      <th appSortableColumn="userName">
        Usuario
        <lux-sorticon-web field="userName" />
      </th>
      <th>Celular</th>
      <th class="no-print">Opciones</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.posicionComite }}</td>
      <td>{{ item.nameProperty }}</td>
      <td>{{ item.departamento }}</td>
      <td>{{ item.email }}</td>
      <td>{{ item.userName || 'Sin usuario' }}</td>
      <td>{{ item.celular }}</td>

      <td class="no-print">
        <div class="d-flex gap-1">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            [tooltip]="'Editar comité ' + item.nameProperty"
            [ariaLabel]="'Editar comité ' + item.nameProperty"
            (clicked)="edit.emit({ id: item.id, title: 'Editar', nameProperty: item.nameProperty })"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            [tooltip]="'Eliminar comité ' + item.nameProperty"
            [ariaLabel]="'Eliminar comité ' + item.nameProperty"
            (clicked)="delete.emit(item.id)"
          />

          <lux-button-web
            kind="send-email"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            styleClass="btn--circle"
            [tooltip]="'Enviar credenciales a ' + item.nameProperty"
            [ariaLabel]="'Enviar credenciales a ' + item.nameProperty"
            (clicked)="sendCredential.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="7" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
