<lux-table
  [globalFilterFields]="globalFilterFields()"
  [loading]="loading()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [tableStyle]="{ 'min-width': '50rem' }"
  [value]="data()"
  dataKey="id"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
  [scrollable]="true"
  scrollHeight="750px"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th appSortableColumn="posicionComite">
        Posición
        <app-sorticon field="posicionComite" />
      </th>
      <th appSortableColumn="nameProperty">
        Nombre
        <app-sorticon field="nameProperty" />
      </th>
      <th appSortableColumn="departamento">
        Departamento
        <app-sorticon field="departamento" />
      </th>
      <th appSortableColumn="email">
        Correo
        <app-sorticon field="email" />
      </th>
      <th appSortableColumn="userName">
        Usuario
        <app-sorticon field="userName" />
      </th>
      <th>Celular</th>
      <th class="no-print">Opciones</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.posicionComite }}</td>
      <td>{{ item.nameProperty }}</td>
      <td>{{ item.departamento }}</td>
      <td>{{ item.email }}</td>
      <td>{{ item.userName || 'Sin usuario' }}</td>
      <td>{{ item.celular }}</td>

      <td class="no-print">
        <div class="d-flex gap-1">
          <iw-button-edit
            [attr.aria-label]="'Editar comité ' + item.nameProperty"
            (clicked)="edit.emit({ id: item.id, title: 'Editar', nameProperty: item.nameProperty })"
          />
          <iw-button-delete
            [attr.aria-label]="'Eliminar comité ' + item.nameProperty"
            (confirmed)="delete.emit(item.id)"
          />

          <iw-button-send-email
            size="sm"
            class="btn--circle"
            [attr.aria-label]="'Enviar credenciales a ' + item.nameProperty"
            confirmMessage="Enviar usuario y contrasena de acceso."
            (confirmed)="sendCredential.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="7" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
