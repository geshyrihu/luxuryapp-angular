@if (platformS.isMobile()) {
  <app-comite-vigilancia-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm($event)"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
    (sendCredential)="onSendCredential($event)"
  />
} @else {
  <app-comite-vigilancia-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [loading]="loading()"
    (add)="onModalForm($event)"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
    (sendCredential)="onSendCredential($event)"
  />
}
