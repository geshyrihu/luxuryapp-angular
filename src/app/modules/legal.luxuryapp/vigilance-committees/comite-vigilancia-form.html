<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-text-signal
    [control]="form.controls.id"
    hidden
    label="Id"
    [readonly]="true"
  />

  <lux-input-select-signal
    [control]="form.controls.ePosicionComite"
    label="Posicion"
    [data]="cb_position()"
    [filter]="true"
  />

  <lux-input-autocomplete-signal
    (propagar)="saveCondominoId($event)"
    [control]="form.controls.nameProperty"
    [data]="cb_condomino()"
    label="Nombre"
    placeholder="Escribe para buscar propiedad"
  />

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    [label]="id ? 'Actualizar' : 'Guardar'"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
