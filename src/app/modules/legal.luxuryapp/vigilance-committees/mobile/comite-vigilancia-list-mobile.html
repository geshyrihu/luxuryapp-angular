<lux-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  trackByProperty="id"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg w-3rem h-3rem bg-primary-50"
      >
        <lux-icon
          icon="material-symbols-light:group-outline"
          class="text-xl text-primary"
        />
      </div>

      <h2 class="font-normal m-0">{{ item.nameProperty }}</h2>
      <p class="text-medium text-body-secondary m-0">
        {{ item.posicionComite }} | {{ item.departamento }}
      </p>
      <p class="text-medium text-body-secondary m-0">{{ item.email }}</p>
      <p class="text-medium text-body-secondary m-0">
        Usuario: {{ item.userName || 'Sin usuario' }}
      </p>
      <p class="text-medium text-body-secondary m-0">{{ item.celular }}</p>

      <lux-action-menu-mobile slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar', nameProperty: item.nameProperty })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
          <lux-button-mobile
            kind="send-email"
            label="Enviar"
            (clicked)="sendCredential.emit(item.id)"
          />
        </ng-container>
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
