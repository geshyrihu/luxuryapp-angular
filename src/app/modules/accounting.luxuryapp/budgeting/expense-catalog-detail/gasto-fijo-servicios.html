@if (mensajeError == true) {
<p class="text-sm text-danger text-start fst-italic">
  Seleccione producto y unidad
</p>
}

<app-table [value]="productosAgregados()" #dc class="card d-none d-md-block">
  <ng-template #caption>
    <app-table-caption [dt]="dc" [showAdd]="false" [showSearch]="false" />
  </ng-template>

  <ng-template #header>
    <tr>
      <th class="table-col-10"></th>
      <th class="table-col-25">DESCRIPCIÓN</th>
      <th class="table-col-8">Cantidad</th>
      <th class="table-col-10">Unidad</th>
      <th class="table-col-10">Precio</th>
      <th class="table-col-10">Descuento</th>
      <th class="table-col-9">Iva Aplicado</th>
      <th class="table-col-9">Ret. IVA (%)</th>
      <th class="table-col-9">Ret. ISR (%)</th>
      <th class="table-col-5"></th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td class="table-col-10">
        <lx-avatar
          [image]="item.productoImg
                    ? item.productoImg
                    : 'assets/images/default-avatar.png'"
          class="me-2"
          size="large"
          (click)="onCardEmployee(item.id)"
        />
      </td>
      <td>{{ item.productName }}</td>
      <td>
        <custom-input-number-signal
          [(ngModel)]="item.cantidad"
          [ngModelOptions]="{ standalone: true }"
          [horizontal]="false"
        />
      </td>
      <td>
        <custom-input-select-signal
          [data]="cb_unidadMedida"
          [(ngModel)]="item.unidadMedidaId"
          customClass="w-100"
          appendTo="body"
          [horizontal]="false"
          [filter]="true"
        >
        </custom-input-select-signal>
      </td>
      <td>
        <custom-input-decimal-signal
          [(ngModel)]="item.precio"
          [ngModelOptions]="{ standalone: true }"
          [horizontal]="false"
        />
      </td>
      <td>
        <custom-input-decimal-signal
          [(ngModel)]="item.descuento"
          [ngModelOptions]="{ standalone: true }"
          [horizontal]="false"
        />
      </td>
      <td>
        <custom-input-decimal-signal
          [(ngModel)]="item.ivaAplicado"
          [ngModelOptions]="{ standalone: true }"
          [horizontal]="false"
        />
      </td>
      <td>
        <custom-input-decimal-signal
          [(ngModel)]="item.retencionIVAPorcentaje"
          [ngModelOptions]="{ standalone: true }"
          [horizontal]="false"
        />
      </td>
      <td>
        <custom-input-decimal-signal
          [(ngModel)]="item.retencionISRPorcentaje"
          [ngModelOptions]="{ standalone: true }"
          [horizontal]="false"
        />
      </td>
      <!-- Opciones -->
      <td>
        <div class="d-flex justify-content-center">
          <iw-button-item
            iconClass="material-symbols-light:edit"
            (clicked)="onEditDetalle(item)"
          />
          <iw-button-item
            iconClass="material-symbols-light:save"
            (clicked)="onUpdateProductoAgregado(item)"
          />
          <iw-button-delete (confirmed)="deleteProductoAgregado(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
</app-table>

<app-table
  [(selection)]="selectedProducts"
  #dt
  class="custom-table card d-none d-md-block"
  [value]="productos()"
  [rows]="tableRows"
  [paginator]="true"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  [showCurrentPageReport]="true"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #caption>
    <app-table-caption [dt]="dt" [showAdd]="false" />
  </ng-template>

  <ng-template #header>
    <tr>
      <th class="table-col-10"></th>
      <th class="table-col-25">DESCRIPCIÓN</th>
      <th class="table-col-8">Cantidad</th>
      <th class="table-col-10">Unidad</th>
      <th class="table-col-10">Precio</th>
      <th class="table-col-10">Descuento</th>
      <th class="table-col-9">Iva Aplicado</th>
      <th class="table-col-9">Ret. IVA (%)</th>
      <th class="table-col-9">Ret. ISR (%)</th>
      <th class="table-col-5"></th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td class="table-col-10">
        <lx-avatar
          [image]="item.urlImagen
                    ? item.urlImagen
                    : 'assets/images/default-avatar.png'"
          class="me-2"
          size="large"
          (click)="onCardEmployee(item.id)"
        />
      </td>
      <td>{{ item.nombreProducto }}</td>
      <td>
        <custom-input-decimal-signal
          [(ngModel)]="item.cantidad"
          [ngModelOptions]="{ standalone: true }"
          [horizontal]="false"
        />
      </td>
      <td>
        <custom-input-select-signal
          [data]="cb_unidadMedida"
          [(ngModel)]="item.unidadMedidaId"
          customClass="w-100"
          [horizontal]="false"
          [filter]="true"
        >
        </custom-input-select-signal>
      </td>
      <td>
        <custom-input-decimal-signal
          [(ngModel)]="item.precio"
          [ngModelOptions]="{ standalone: true }"
          [horizontal]="false"
        />
      </td>
      <td>
        <custom-input-decimal-signal
          [(ngModel)]="item.descuento"
          [ngModelOptions]="{ standalone: true }"
          [horizontal]="false"
        />
      </td>
      <td>
        <custom-input-decimal-signal
          [(ngModel)]="item.ivaAplicado"
          [ngModelOptions]="{ standalone: true }"
          [horizontal]="false"
        />
      </td>
      <td>
        <custom-input-decimal-signal
          [(ngModel)]="item.retencionIVAPorcentaje"
          [ngModelOptions]="{ standalone: true }"
          [horizontal]="false"
        />
      </td>
      <td>
        <custom-input-decimal-signal
          [(ngModel)]="item.retencionISRPorcentaje"
          [ngModelOptions]="{ standalone: true }"
          [horizontal]="false"
        />
      </td>

      <td>
        <div class="d-flex justify-content-center">
          <iw-button-item
            iconClass="material-symbols-light:save"
            (clicked)="onSubmit(item)"
          />
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #paginatorleft>
    <app-table-footer [data]="productos()" />
  </ng-template>
</app-table>
