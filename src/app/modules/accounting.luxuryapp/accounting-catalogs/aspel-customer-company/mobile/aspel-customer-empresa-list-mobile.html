<lux-data-view-mobile
  [data]="data()"
  (add)="modalForm.emit({ id: '', title: 'Nueva Configuración' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        class="w-3rem h-3rem bg-primary-50"
      >
        <lux-icon
          icon="material-symbols-light:domain"
          class="text-xl text-primary"
        />
      </div>
      <div class="flex-fill min-w-0">
        <h2>{{ item.customerName }}</h2>
        <div class="d-flex align-items-center gap-2 mt-1">
          <lux-status-badge-web
            [status]="item.empresa"
            [isEmpresa]="true"
            [clickable]="false"
          />
          <span class="text-sm text-body-secondary"
            >- ID Aspel: {{ item.customerIdAspelId }}</span
          >
        </div>
      </div>
      <lux-action-menu-mobile slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="modalForm.emit(item)"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
