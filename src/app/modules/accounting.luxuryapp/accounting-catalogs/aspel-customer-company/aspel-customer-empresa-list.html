@if (platformS.isMobile()) {
  <app-aspel-customer-empresa-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (modalForm)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-aspel-customer-empresa-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (modalForm)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
}
