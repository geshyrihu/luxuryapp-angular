@if (platformS.isMobile()) {
  <lux-aspel-customer-empresa-list-mobile-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (modalForm)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <lux-aspel-customer-empresa-list-desktop-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (modalForm)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
}
