@if (platformS.isMobile()) {
  <lux-catalogo-gastos-fijos-list-mobile-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [fundingYear]="fundingYear()"
    [cbFundingYear]="cb_fundingYear"
    [monthTabs]="monthTabs()"
    [selectedMonthName]="selectedMonthName()"
    [isGenerationParamsSelected]="isGenerationParamsSelected()"
    [isFirstQuincenaGenerationBlocked]="isFirstQuincenaGenerationBlocked()"
    [isSecondQuincenaGenerationBlocked]="isSecondQuincenaGenerationBlocked()"
    [canManage]="canManageActions()"
    (yearChange)="fundingYear.set($event)"
    (selectMonth)="selectMonth($event)"
    (generateQuincena)="generateOrdenesPorQuincena($event)"
    (selectByQuincena)="selectByQuincena($event)"
    (create)="onCreate()"
    (loadData)="onLoadData()"
    (itemCheckChange)="onItemCheckChange($event.item, $event.checked)"
    (modal)="onModal($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <lux-catalogo-gastos-fijos-list-desktop-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [fundingYear]="fundingYear()"
    [cbFundingYear]="cb_fundingYear"
    [fundingPeriodsByMonth]="fundingPeriodsByMonth()"
    [selectedMonthName]="selectedMonthName()"
    [selectedFundingStatus]="selectedFundingStatus()"
    [isFirstQuincenaSelected]="isFirstQuincenaSelected()"
    [isSecondQuincenaSelected]="isSecondQuincenaSelected()"
    [isGenerationParamsSelected]="isGenerationParamsSelected()"
    [isFirstQuincenaGenerationBlocked]="isFirstQuincenaGenerationBlocked()"
    [isSecondQuincenaGenerationBlocked]="isSecondQuincenaGenerationBlocked()"
    [isAllSelected]="isAllSelected()"
    (yearChange)="fundingYear.set($event)"
    (selectByQuincena)="selectByQuincena($event)"
    (generateQuincena)="generateOrdenesPorQuincena($event)"
    (selectMonth)="selectMonth($event)"
    (toggleSelectAll)="toggleSelectAll($event)"
    (itemCheckChange)="onItemCheckChange($event.item, $event.checked)"
    (delete)="onDelete($event)"
    (modal)="onModal($event)"
  />
}
