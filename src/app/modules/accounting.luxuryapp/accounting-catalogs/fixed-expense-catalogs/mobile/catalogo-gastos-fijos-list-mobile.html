<div class="d-flex flex-column vh-100 overflow-hidden">
  <div class="px-2 pt-2 flex-shrink-0">
    <lux-accordion
      [items]="genAccordionItems"
      [(expandedIds)]="genExpanded"
      class="mb-2 d-block"
    >
      <div class="ion-padding" accordion="generation">
        <!-- Year and Month -->
        <ion-input-select
          [ngModel]="fundingYear()"
          (selectionChange)="yearChange.emit($event)"
          [data]="cbFundingYear()"
          optionLabel="label"
          optionValue="value"
          label="Año"
          interfaceMode="popover"
          class="mb-2"
        ></ion-input-select>

        <p class="mb-1 text-sm fw-bold ms-1">Mes de Fondeo</p>
        <lux-tabs
          [tabs]="monthTabs()"
          [activeId]="selectedMonthName() ?? ''"
          (tabChange)="selectMonth.emit($event.id)"
          class="mb-3 d-block"
        />

        <!-- Generate Buttons -->
        <div class="d-flex flex-column">
          <div>
            <lux-button-mobile
              expand="block"
              color="success"
              iconClass="material-symbols-light:event"
              label="Gen. 1ra Q"
              [disabled]="!isGenerationParamsSelected() || isFirstQuincenaGenerationBlocked()"
              (clicked)="generateQuincena.emit(0)"
            />
          </div>
          <div>
            <lux-button-mobile
              expand="block"
              color="tertiary"
              iconClass="material-symbols-light:event"
              label="Gen. 2da Q"
              [disabled]="!isGenerationParamsSelected() || isSecondQuincenaGenerationBlocked()"
              (clicked)="generateQuincena.emit(1)"
            />
          </div>
        </div>
      </div>
    </lux-accordion>

    <!-- Quick Selection Actions -->
    <div class="d-flex justify-content-between mb-2">
      <lux-button-mobile
        size="small"
        fill="outline"
        label="Marcar 1ra Q"
        styleClass="flex-1"
        (clicked)="selectByQuincena.emit(0)"
      />
      <lux-button-mobile
        size="small"
        fill="outline"
        label="Marcar 2da Q"
        styleClass="flex-1"
        (clicked)="selectByQuincena.emit(1)"
      />
    </div>
  </div>

  <!-- Main List using LuxLuxDataViewMobile -->
  <div class="flex-grow-1 position-relative">
    <!-- absolute positioning can help force child to fill parent -->
    <lux-data-view-mobile
      [data]="data()"
      (add)="create.emit()"
      [globalFilterFields]="globalFilterFields()"
      (onRefresh)="loadData.emit()"
    >
      <ng-template #listItemTemplate let-item>
        <lux-list-item-mobile>
          <ion-input-checkbox
            [ngModel]="item.crearOrdenCompra"
            (checkChange)="itemCheckChange.emit({ item: item, checked: $event })"
          ></ion-input-checkbox>

          <div class="d-flex justify-content-between align-items-center mb-1">
            <lux-badge-mobile
              [color]="item.quincena === 0 ? 'success' : 'info'"
              [value]="item.quincena === 0 ? '1ra Q' : '2da Q'"
            />
            <span class="text-xs text-body-secondary"
              >Folio: {{item.idFondeo}}</span
            >
          </div>
          <h2 class="text-base fw-bold">{{ item.equipoOInstalacion }}</h2>
          <p class="text-sm text-body">{{ item.justificacionGasto }}</p>
          <p class="text-xs text-body-secondary mt-1 text-uppercase">
            <lux-icon icon="material-symbols-light:work-outline" class="me-1" />
            {{ item.provider }}
          </p>

          <!-- Actions Slide/Popover -->
          @if (canManage()) {
          <lux-action-menu-mobile slot="end">
            <ng-container actions>
              <lux-button-mobile
                kind="edit"
                (clicked)="modal.emit({ id: item.id, title: 'Editar' })"
              />
              <lux-button-mobile
                kind="delete"
                color="danger"
                (clicked)="delete.emit(item.id)"
              />
            </ng-container>
          </lux-action-menu-mobile>
          }
        </lux-list-item-mobile>
      </ng-template>
    </lux-data-view-mobile>
  </div>
</div>
