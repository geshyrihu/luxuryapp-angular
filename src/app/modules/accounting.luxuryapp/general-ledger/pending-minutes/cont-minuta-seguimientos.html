<lux-table [value]="dataSignal()" class="custom-table card d-none d-md-block">
  <ng-template #header>
    <tr>
      <th></th>
      <th></th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-seguimiento>
    <tr>
      <td>
        {{ seguimiento.fecha }}, {{ seguimiento.seguimiento | titlecase }}
      </td>
      <td>
        <div class="d-flex content-center">
          <lux-button-web displayMode="icon"
            iconClass="edit"
            ngbTooltip="Editar"
            (clicked)="onModalFormSeguimiento(seguimiento.id)"
          />
          <lux-button-web
            kind="confirm"
            displayMode="icon"
            severity="success"
            variant="soft"
            tooltip="Eliminar"
            (clicked)="onDeleteSeguimiento(seguimiento.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="3" />
  </ng-template>
</lux-table>
