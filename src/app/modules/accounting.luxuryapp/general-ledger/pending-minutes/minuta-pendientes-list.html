@if (platformS.isMobile()) {
  <app-minuta-pendientes-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (verDetalle)="onModalFormMinutaDetalle($event)"
  />
} @else {
  <app-minuta-pendientes-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [statusFiltroControl]="statusFiltroControl"
    (filter)="onFiltrarData()"
    (downloadPdf)="onDownloadPdf()"
    (todosSeguimientos)="onModalTodosSeguimientos($event)"
    (agregarSeguimiento)="onModalFormSeguimiento($event.meetingDetailsId, $event.idMeetingSeguimiento)"
    (verDetalle)="onModalFormMinutaDetalle($event)"
  />
}
