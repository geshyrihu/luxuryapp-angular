<app-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  [showAdd]="false"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="w-2rem h-2rem rounded-lg bg-orange-100 d-flex align-items-center justify-content-center flex-shrink-0 ms-3"
      >
        <app-icon
          icon="material-symbols-light:error-outline"
          class="text-orange-600 text-xl"
        />
      </div>

      <div class="flex-fill min-w-0">
        <h3>{{ item.titulo | titlecase }}</h3>
        <p>{{ item.cliente }} · Folio: {{ item.folio }}</p>
        <p>{{ item.fechaSolicitud }}</p>
      </div>
      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="verDetalle.emit({ id: item.id, title: 'Editar asunto' })"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
