@if (platformS.isMobile()) {
  <app-projected-expenses-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModal($event)"
    (edit)="onModal($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-projected-expenses-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [loading]="loading()"
    (add)="onModal($event)"
    (edit)="onModal($event)"
    (delete)="onDelete($event)"
  />
}
