@if (platformS.isMobile()) {
  <lux-projected-expenses-list-mobile-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModal($event)"
    (edit)="onModal($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <lux-projected-expenses-list-desktop-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [loading]="loading()"
    (add)="onModal($event)"
    (edit)="onModal($event)"
    (delete)="onDelete($event)"
  />
}
