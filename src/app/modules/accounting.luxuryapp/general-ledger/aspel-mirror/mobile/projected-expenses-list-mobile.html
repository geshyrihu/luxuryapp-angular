<lux-data-view-mobile-web
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nueva Ejecución Presupuestaria' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        class="w-3rem h-3rem bg-primary-50"
      >
        <lux-icon
          icon="material-symbols-light:table"
          class="text-xl text-primary"
        />
      </div>
      <div class="flex-fill min-w-0 ion-text-wrap">
        <h6 class="mb-0">{{ item.concept }}</h6>
        <small class="text-body-secondary"
          >{{ item.accountingCatalog }} - {{ item.executionMonthName }}</small
        >
        <span class="fw-bold text-lg"
          >{{ item.budgetedAmount | number: "1.0-0" }}
        </span>
      </div>

      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar Ejecución' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</lux-data-view-mobile-web>
