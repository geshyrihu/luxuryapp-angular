<div class="card">
  <lux-table
    [globalFilterFields]="globalFilterFields()"
    [paginator]="true"
    [rows]="tableRows"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="true"
    [value]="data()"
    [loading]="loading()"
    [scrollable]="true"
    [scrollHeight]="scrollHeight"
    #dt
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    class="custom-table"
  >
    <ng-template #caption>
      <lux-table-caption
        (add)="add.emit({ id: '', title: 'Nueva Ejecución Presupuestaria' })"
        [dt]="dt"
      />
    </ng-template>
    <ng-template #header>
      <tr>
        <th appSortableColumn="executionMonth">
          Mes <app-sorticon field="executionMonth" />
        </th>
        <th appSortableColumn="accountingCatalog">
          Cuenta <app-sorticon field="accountingCatalog" />
        </th>
        <th appSortableColumn="concept">
          Concepto <app-sorticon field="concept" />
        </th>
        <th appSortableColumn="description">
          DESCRIPCIÓN <app-sorticon field="description" />
        </th>
        <th appSortableColumn="budgetedAmount">
          Monto Presupuestado <app-sorticon field="budgetedAmount" />
        </th>
        <th appSortableColumn="expenseTypeName">
          Tipo de Gasto <app-sorticon field="expenseTypeName" />
        </th>
        <th class="table-col-10"></th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      <tr>
        <td>{{ item.executionMonthName }}</td>
        <td>{{ item.accountingCatalog }}</td>
        <td>{{ item.concept }}</td>
        <td>{{ item.description }}</td>
        <td>{{ item.budgetedAmount | number: "1.0-0" }}</td>
        <td>{{ item.expenseTypeName }}</td>
        <td class="text-center">
          <div class="d-flex">
            @if (!item.isFromCalendar) {
            <iw-button-edit
              (clicked)="
              edit.emit({ id: item.id, title: 'Editar Ejecución' })
              "
            />
            <iw-button-delete (confirmed)="delete.emit(item.id)" />
            }
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <lux-table-empty-message [colspan]="7" />
    </ng-template>
  </lux-table>
</div>
