<div class="card">
  <app-data-view-mobile
    [data]="data()"
    [showAdd]="false"
    [globalFilterFields]="globalFilterFields()"
  >
    <ng-template #listItemTemplate let-item>
      <ili-list-item>
        <div
          start
          class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg w-3rem h-3rem bg-primary-50"
        >
          <app-icon
            icon="material-symbols-light:format-list-bulleted"
            class="text-xl text-primary"
          />
        </div>

        <div class="d-flex flex-column">
          <small class="text-body-secondary">
            📂 {{ item.cuentaPadre }}</small
          >
          <span class="fw-bold">{{ item.descripcionCuenta }}</span>
          <small class="text-body-secondary font-mono"
            >{{ item.codigoCuenta }}</small
          >
        </div>
      </ili-list-item>
    </ng-template>
  </app-data-view-mobile>
</div>
