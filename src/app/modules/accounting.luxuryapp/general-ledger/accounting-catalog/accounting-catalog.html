<!-- 🖥️ INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<div class="d-none d-md-block">
  <div class="card">
    <app-table
      #dt
      [value]="flattenedDataSignal()"
      [globalFilterFields]="globalFilterFields()"
      [paginator]="true"
      [rows]="tablePrimeNgRows"
      [rowsPerPageOptions]="rowsPerPageOptions"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
      rowGroupMode="subheader"
      groupRowsBy="cuentaPadre"
      sortField="cuentaPadre"
      sortMode="single"
      class="custom-table"
    >
      <ng-template #caption>
        <div class="d-flex justify-content-between">
          <primeng-custom-caption [showAdd]="false" [dt]="dt" />
          <il-button
            iconClass="material-symbols-light:download"
            label="Exportar"
            (clicked)="exportData()"
            severity="success"
          />
        </div>
      </ng-template>

      <ng-template #header>
        <tr>
          <th appSortableColumn="codigoCuenta" class="table-col-150px">
            Código
            <app-sorticon field="codigoCuenta" />
          </th>
          <th appSortableColumn="descripcionCuenta">
            DESCRIPCIÓN
            <app-sorticon field="descripcionCuenta" />
          </th>
        </tr>
      </ng-template>

      <ng-template #groupheader let-group>
        <tr class="p-rowgroup-header">
          <td colspan="2">
            <div class="d-flex align-items-center">
              <span class="fw-bold text-lg">
                📂 {{ group.cuentaPadre }}
              </span>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template #body let-item>
        <tr>
          <td class="font-mono">{{ item.codigoCuenta }}</td>
          <td>{{ item.descripcionCuenta }}</td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="2" class="text-center py-4">
            <app-icon [icon]="'material-symbols-light:info'" class="me-2" />
            No hay cuentas para mostrar.
          </td>
        </tr>
      </ng-template>

      <ng-template #paginatorleft>
        <primeng-custom-table-footer [data]="flattenedDataSignal()" />
      </ng-template>
    </app-table>
  </div>
</div>

<!-- 📱 INICIO: Componente adaptado para versión móvil -->
<div class="d-block d-md-none">
  <div class="card">
    <app-data-view-mobile
      [data]="flattenedDataSignal()"
      [showAdd]="false"
      [globalFilterFields]="globalFilterFields()"
    >
      <ng-template #listItemTemplate let-item>
        <ili-list-item>
          <div
            start
            class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
            class="w-3rem h-3rem bg-primary-50"
          >
            <app-icon
              icon="material-symbols-light:format-list-bulleted"
              class="text-xl text-primary"
            />
          </div>

          <div class="d-flex flex-column">
            <small class="text-body-secondary">
              📂 {{ item.cuentaPadre }}</small
            >
            <span class="fw-bold">{{ item.descripcionCuenta }}</span>
            <small class="text-body-secondary font-mono"
              >{{ item.codigoCuenta }}</small
            >
          </div>
        </ili-list-item>
      </ng-template>
    </app-data-view-mobile>
  </div>
</div>
