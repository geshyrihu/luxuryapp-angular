<!-- 💻 INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<lux-table-web
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="card d-none d-md-block custom-table"
  size="small"
  [scrollable]="true"
  scrollHeight="750px"
>
  <ng-template #caption>
    <lux-table-caption-web
      (add)="onModalForm({ id: '', title: 'Nueva Configuración' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="customerName">
        Cliente <lux-sorticon-web field="customerName" />
      </th>
      <th appSortableColumn="empresa">
        Empresa <lux-sorticon-web field="empresa" />
      </th>
      <th appSortableColumn="customerIdAspelId">
        ID Aspel <lux-sorticon-web field="customerIdAspelId" />
      </th>
      <th class="table-col-10">Opciones</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.customerName }}</td>
      <td>
        <lux-status-badge-web
          [status]="item.empresa"
          [isEmpresa]="true"
          [clickable]="false"
        />
      </td>
      <td>{{ item.customerIdAspelId }}</td>
      <td class="text-center">
        <div class="d-flex justify-content-center">
          <iw-button-edit (clicked)="onModalForm(item)" />
          <iw-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer-web [data]="dataSignal()" />
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message-web [colspan]="4" />
  </ng-template>
</lux-table-web>

<!--📲INICIO: Componente adaptado para versión móvil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nueva Configuración' })"
  [globalFilterFields]="['customerName', 'empresa', 'customerIdAspelId']"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        class="w-3rem h-3rem bg-primary-50"
      >
        <lux-icon icon="material-symbols-light:domain" class="text-xl text-primary" />
      </div>
      <div class="flex-fill min-w-0">
        <h2>{{ item.customerName }}</h2>
        <div class="d-flex align-items-center gap-2 mt-1">
          <lux-status-badge-web
            [status]="item.empresa"
            [isEmpresa]="true"
            [clickable]="false"
          />
          <span class="text-sm text-body-secondary"
            >- ID Aspel: {{ item.customerIdAspelId }}</span
          >
        </div>
      </div>
      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit (clicked)="onModalForm(item)" label="Editar" />
          <ili-button-delete (clicked)="onDelete(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
