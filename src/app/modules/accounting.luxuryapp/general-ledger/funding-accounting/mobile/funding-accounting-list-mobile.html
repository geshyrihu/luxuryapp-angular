<app-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  [showAdd]="false"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item class="ion-no-padding" (click)="details.emit(item.id)">
      <div start>
        <app-icon icon="material-symbols-light:calculate" />
      </div>
      <div class="flex-fill min-w-0">
        <h3>{{ item.period }}</h3>
        <p>Verificó: {{ item.verifiedByName || '? En espera' }}</p>
        <p>Autorizó: {{ item.authorizedByName || '? En espera' }}</p>
      </div>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
