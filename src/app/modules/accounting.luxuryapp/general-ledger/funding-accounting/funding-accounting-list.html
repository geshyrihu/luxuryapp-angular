@if (platformS.isMobile()) {
  <app-funding-accounting-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (details)="onDetails($event)"
  />
} @else {
  <app-funding-accounting-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (details)="onDetails($event)"
    (faqs)="onFaqsFondeo()"
  />
}
