<form
  autocomplete="off"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="d-flex flex-column gap-3"
>
  <div>
    <lux-input-select-signal
      label="Tipo de Regla"
      [data]="ruleTypes"
      controlName="ruleType"
      [formGroup]="form"
      placeholder="Seleccione el tipo de regla"
      optionLabel="label"
      optionValue="value"
      [filter]="true"
    />
    <small class="text-body-secondary d-block">
      "Cuenta Extra" agrega la cuenta aunque no tenga saldo. "Exclusión" la
      oculta siempre.
    </small>
  </div>

  <div>
    <lux-input-text-signal
      [control]="form.controls['accountNumber']"
      label="Nómero de Cuenta (Aspel)"
      placeholder="Ej: 605-001-000"
    />
    <small class="text-body-secondary d-block">
      Debe coincidir exactamente con el código en Aspel COI.
    </small>
  </div>

  <lux-input-text-signal
    [control]="form.controls['accountName']"
    label="Nombre / DESCRIPCIÓN (Opcional)"
    placeholder="Ej: Gastos Extraordinarios"
  />

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    label="Guardar"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
