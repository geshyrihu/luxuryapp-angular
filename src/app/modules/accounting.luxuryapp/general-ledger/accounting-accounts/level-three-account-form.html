<div>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <lux-input-text-signal
      [control]="form.controls.numeroCuenta"
      label="Nómero de Cuenta"
      placeholder="Ej: 100-001"
    />
    <lux-input-text-signal
      [control]="form.controls.descripcion"
      label="DESCRIPCIÓN"
      placeholder="DESCRIPCIÓN de la cuenta"
    />
    <div class="text-center mt-3">
      <lux-button-web
        kind="save"
        type="submit"
        severity="info"
        variant="soft"
        displayMode="both"
        [label]="id ? 'Actualizar' : 'Guardar'"
        [disabled]="form.invalid"
        [loading]="submitting()"
      />
    </div>
  </form>
</div>
