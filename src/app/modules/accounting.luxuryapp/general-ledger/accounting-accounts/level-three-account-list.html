@if (platformS.isMobile()) {
  <app-level-three-account-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-level-three-account-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [state]="state"
    [isSuperUsuario]="isSuperUsuario()"
    (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
    (stateChange)="onLoadData($event)"
  />
}
