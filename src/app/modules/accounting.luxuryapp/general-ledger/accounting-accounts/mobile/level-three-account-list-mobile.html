<lux-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <div class="d-flex align-items-center justify-content-between w-full">
      <div>
        <p class="mt-0 mb-0">{{ item.numeroCuenta }}</p>
        <p class="text-body-secondary font-size-12 mt-0 mb-0">
          {{ item.descripcion }}
        </p>
      </div>

      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
    </div>
  </ng-template>
</lux-data-view-mobile>
