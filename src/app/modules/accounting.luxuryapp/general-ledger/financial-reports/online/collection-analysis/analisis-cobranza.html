@if (store.isLoading()) {
  <div class="d-flex flex-column gap-4 p-4">
    <lux-skeleton width="100%" height="300px" borderRadius="12px" />
    <div class="row g-4">
      <div class="col-12 col-md-6">
        <lux-skeleton width="100%" height="400px" borderRadius="12px" />
      </div>
      <div class="col-12 col-md-6">
        <lux-skeleton width="100%" height="400px" borderRadius="12px" />
      </div>
    </div>
  </div>
} @else {
  <div class="d-flex flex-column gap-4">
    <!-- Top KPIs replacing the pie charts -->
    <div class="row g-4">
      @for (kpi of kpis(); track kpi.label) {
        <div class="col-12 col-md-4 col-xl-4">
          <lux-stat-card-web
            orientation="horizontal"
            [label]="kpi.label"
            [value]="kpi.value"
            format="number"
            [icon]="kpi.icon"
            [iconColor]="kpi.iconColor"
            [iconBg]="kpi.iconBg"
            [subtitle]="kpi.subtitle"
          />
        </div>
      }
    </div>

    <!-- The red-box components from analysis -->
    <lux-cobranza-online-analysis-web [showTopKpis]="false" [showFlujoReal]="false" />
    
    <!-- Morosidad and Towers from Resumen -->
    <div class="row mt-2 g-4">
      <div class="col-12 col-xl-6">
        <lux-cobranza-online-morosidad-web />
      </div>
      <div class="col-12 col-xl-6">
        <lux-cobranza-online-towers-web />
      </div>
    </div>
    
    <div class="row mt-2 g-4">
      <div class="col-12">
        <lux-cobranza-online-advances-web />
      </div>
    </div>
  </div>
}
