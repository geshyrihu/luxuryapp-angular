@if (platformS.isMobile()) {
  <lux-purchase-history-mobile-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (viewPdf)="viewPdf($event.url, $event.fileName)"
  />
} @else {
  <lux-purchase-history-desktop-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (showDetails)="onShowPurchaseDetails($event)"
    (viewPdf)="viewPdf($event.url, $event.fileName)"
  />
}
