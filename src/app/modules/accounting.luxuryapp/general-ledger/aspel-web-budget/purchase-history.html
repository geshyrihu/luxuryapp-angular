@if (platformS.isMobile()) {
  <app-purchase-history-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (viewPdf)="viewPdf($event.url, $event.fileName)"
  />
} @else {
  <app-purchase-history-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (showDetails)="onShowPurchaseDetails($event)"
    (viewPdf)="viewPdf($event.url, $event.fileName)"
  />
}
