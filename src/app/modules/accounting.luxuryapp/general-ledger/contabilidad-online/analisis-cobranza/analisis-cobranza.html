@if (store.isLoading()) {
  <div class="flex flex-column gap-4 p-4">
    <p-skeleton width="100%" height="300px" borderRadius="12px" />
    <div class="grid">
      <div class="col-12 md:col-6">
        <p-skeleton width="100%" height="400px" borderRadius="12px" />
      </div>
      <div class="col-12 md:col-6">
        <p-skeleton width="100%" height="400px" borderRadius="12px" />
      </div>
    </div>
  </div>
} @else {
  <div class="flex flex-column gap-4">
    <!-- Top KPIs replacing the pie charts -->
    <div class="grid">
      @for (kpi of kpis(); track kpi.label) {
        <div class="col-12 md:col-4 xl:col-4">
          <app-stat-card
            orientation="horizontal"
            [label]="kpi.label"
            [value]="kpi.value"
            format="currency"
            [icon]="kpi.icon"
            [iconColor]="kpi.iconColor"
            [iconBg]="kpi.iconBg"
            [subtitle]="kpi.subtitle"
          />
        </div>
      }
    </div>

    <!-- The red-box components from analysis -->
    <app-cobranza-online-analysis [showTopKpis]="false" [showFlujoReal]="false" />
    
    <!-- Morosidad and Towers from Resumen -->
    <div class="grid mt-2">
      <div class="col-12 xl:col-6">
        <app-cobranza-online-morosidad />
      </div>
      <div class="col-12 xl:col-6">
        <app-cobranza-online-towers />
      </div>
    </div>
    
    <div class="grid mt-2">
      <div class="col-12">
        <app-cobranza-online-advances />
      </div>
    </div>
  </div>
}
