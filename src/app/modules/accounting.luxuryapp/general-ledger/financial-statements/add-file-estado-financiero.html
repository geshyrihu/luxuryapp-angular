<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="row mb-4 align-items-center g-4">
    <label class="col-12 col-sm-3 font-weight-lighter">Archivo</label>

    <div class="col-12 col-sm-9">
      <custom-input-file-signal
        (fileSelected)="change($event)"
        accept=".pdf"
        [horizontal]="false"
      />
    </div>
  </div>

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    [label]="id ? 'Actualizar' : 'Guardar'"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
  <hr />
</form>
