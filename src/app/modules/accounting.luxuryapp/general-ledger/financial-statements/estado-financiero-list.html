@if (platformS.isMobile()) {
  <lux-estado-financiero-list-mobile-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [processingSend]="processingSend()"
    (upload)="onUploadFile($event)"
    (authorize)="onAuthorize($event)"
    (desauthorize)="onDesauthorize($event)"
    (send)="onSendEstadosFinancieros($event)"
    (viewPdf)="viewPdf($event.url, $event.fileName)"
  />
} @else {
  <lux-estado-financiero-list-desktop-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [processingUpload]="processingUpload()"
    [processingAuthorize]="processingAuthorize()"
    [processingDesauthorize]="processingDesauthorize()"
    [processingSend]="processingSend()"
    (upload)="onUploadFile($event)"
    (authorize)="onAuthorize($event)"
    (desauthorize)="onDesauthorize($event)"
    (send)="onSendEstadosFinancieros($event)"
    (viewPdf)="viewPdf($event.url, $event.fileName)"
  />
}
