@if (platformS.isMobile()) {
  <lux-cfdi-list-mobile-web
    [data]="data()"
    [globalFilterFields]="globalFilterFields()"
    (verPdf)="verPdf.emit($event)"
  />
} @else {
  <lux-cfdi-list-desktop-web
    [data]="data()"
    [globalFilterFields]="globalFilterFields()"
    (verPdf)="verPdf.emit($event)"
    (exportarExcel)="exportarExcel.emit()"
  />
}
