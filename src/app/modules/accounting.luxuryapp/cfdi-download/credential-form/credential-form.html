<div class="modal-body">
  <div class="alert alert-info small mb-3">
    El archivo .cer es público; el .key y la contraseña se cifran y nunca se
    guardan en texto plano. El RFC del certificado debe coincidir con el RFC
    del customer en contexto.
  </div>

  <div class="mb-3">
    <label class="form-label" for="cerFile">Certificado (.cer)</label>
    <input
      id="cerFile"
      type="file"
      class="form-control"
      accept=".cer"
      (change)="onCerSelected($event)"
    />
    @if (cerFile()) {
      <small class="text-body-secondary">{{ cerFile()!.name }}</small>
    }
  </div>

  <div class="mb-3">
    <label class="form-label" for="keyFile">Llave privada (.key)</label>
    <input
      id="keyFile"
      type="file"
      class="form-control"
      accept=".key"
      (change)="onKeySelected($event)"
    />
    @if (keyFile()) {
      <small class="text-body-secondary">{{ keyFile()!.name }}</small>
    }
  </div>

  <form [formGroup]="form">
    <div class="mb-3">
      <label class="form-label" for="password">Contraseña de la llave privada</label>
      <input
        id="password"
        type="password"
        class="form-control"
        formControlName="password"
        autocomplete="new-password"
      />
    </div>
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">
    Cancelar
  </button>
  <button
    type="button"
    class="btn btn-primary"
    [disabled]="!canSubmit"
    (click)="onSubmit()"
  >
    @if (submitting()) {
      Validando y cargando…
    } @else {
      Cargar e.firma
    }
  </button>
</div>
