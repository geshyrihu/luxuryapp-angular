<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="d-flex flex-column">
    <div class="w-full">
      <lux-input-select-signal
        [control]="form.controls.bankId"
        [data]="banks"
        label="Banco"
        [filter]="true"
      />
    </div>
    <div class="w-full">
      <lux-input-select-signal
        [control]="form.controls.tipoGasto"
        [data]="tiposGasto"
        label="Tipo de Gasto"
        [required]="true"
        [filter]="true"
      />
    </div>
    <div class="w-full">
      <lux-input-text-signal
        [control]="form.controls.interbankCode"
        label="CLABE"
      ></lux-input-text-signal>
    </div>
    <div class="w-full">
      <lux-input-text-signal
        [control]="form.controls.convenio"
        label="Convenio"
      ></lux-input-text-signal>
    </div>
    <div class="w-full">
      <lux-input-text-signal
        [control]="form.controls.referencia"
        label="Referencia"
      ></lux-input-text-signal>
    </div>
  </div>
  <div class="d-flex justify-content-end mt-4">
    <lux-button-web
      kind="save"
      type="submit"
      severity="info"
      variant="soft"
      displayMode="both"
      label="Guardar"
      [disabled]="form.invalid"
      [loading]="submitting()"
    />
  </div>
</form>
