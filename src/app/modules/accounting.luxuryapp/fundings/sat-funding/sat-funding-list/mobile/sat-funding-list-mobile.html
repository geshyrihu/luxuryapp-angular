<lux-data-view-mobile
  [data]="data()"
  [globalFilterFields]="['periodDisplayName', 'year']"
  [showAdd]="false"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <div start>
        <lux-icon
          icon="material-symbols-light:paid"
          class="text-xl text-green-500"
        />
      </div>
      <div class="flex-fill min-w-0">
        <h3>{{ item.periodDisplayName }}</h3>
        <p>
          Facturas: {{ item.invoiceCount }} ó {{ item.totalAmount |
          number:'1.2-2' }}
        </p>
      </div>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
