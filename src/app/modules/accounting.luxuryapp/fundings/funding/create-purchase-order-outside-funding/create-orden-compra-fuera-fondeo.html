<lux-input-autocomplete-signal
  (propagar)="saveProviderId($event)"
  [control]="providerControl"
  [data]="cb_providers()"
  label="Proveedor"
  placeholder="Escribir para buscar proveedor"
/>

<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-select-signal
    [control]="form.controls.tipoGasto"
    [data]="tiposDeGasto"
    label="Tipo de gasto"
    placeholder="Seleccionar tipo de gasto"
    [filter]="true"
  />

  <lux-input-textarea-signal
    [control]="form.controls.equipoOInstalacion"
    label="Área / Equipo / Instalación"
    placeholder="Área o equipo al que aplica el gasto"
  />

  <lux-input-textarea-signal
    [control]="form.controls.justificacionGasto"
    label="Justificación del gasto"
    placeholder="DESCRIPCIÓN del servicio o bien a adquirir"
  />

  <lux-input-textarea-signal
    [control]="form.controls.notasEspeciales"
    label="Motivo de urgencia"
    placeholder="Indicar por qué el pago no puede seguir el proceso normal de fondeo"
  />

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    label="Guardar"
    [disabled]="form.invalid || !providerId()"
    [loading]="submitting()"
  />
</form>
