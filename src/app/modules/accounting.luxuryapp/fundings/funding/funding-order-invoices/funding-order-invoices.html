<lux-table [value]="invoices()" class="border custom-table">
  <ng-template #header>
    <tr>
      <th>Folio</th>
      <th>Factura</th>
      <th class="text-center"></th>
    </tr>
  </ng-template>
  <ng-template #body let-invoice>
    <tr>
      <td>{{ invoice.folioFiscal }}</td>
      <td>{{ invoice.factura }}</td>
      <td class="text-center">
        <lux-button-web
          kind="item"
          severity="secondary"
          variant="soft"
          displayMode="icon"
          iconClass="material-symbols-light:picture-as-pdf"
          tooltip="Ver PDF"
          tooltipPosition="top"
          (clicked)="viewPdf(invoice.pdfFile, 'Factura')"
        />
      </td>
    </tr>
  </ng-template>
</lux-table>
