@if (platformS.isMobile()) {
  <lux-funding-list-mobile-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (details)="onDetails($event)"
  />
} @else {
  <lux-funding-list-desktop-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (details)="onDetails($event)"
    (faqs)="onFaqsFondeo()"
  />
}
