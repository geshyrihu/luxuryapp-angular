<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <custom-input-select-signal
    [horizontal]="false"
    [control]="form.controls.period"
    label="Periodo"
    [data]="cb_fondeos()"
    [filter]="true"
  />

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    [label]="id ? 'Actualizar' : 'Guardar'"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
