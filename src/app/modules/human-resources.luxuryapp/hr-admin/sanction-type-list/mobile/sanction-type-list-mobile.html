<div class="card">
  <lux-data-view-mobile
    [data]="data()"
    (add)="add.emit({ id: '', title: 'Nuevo Tipo de Sanción' })"
    [globalFilterFields]="globalFilterFields()"
  >
    <ng-template #listItemTemplate let-item>
      <ili-list-item>
        <div
          start
          class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        >
          <app-icon icon="material-symbols-light:gavel" />
        </div>

        <h2 class="text-base fw-semibold">{{ item.name }}</h2>
        <p class="text-sm text-wrap">
          <strong>Severidad:</strong> {{ item.severityLevel }} |
          <strong>Terminación:</strong> {{ item.isTermination ? 'Sí' : 'No' }}
        </p>
        <p class="text-sm">
          <strong>Requiere RH:</strong> {{ item.requiresHRApproval ? 'Sí' : 'No'
          }} |
          <strong>Estado:</strong>
          @if (item.isActive) {
          <span class="badge badge-success">Activo</span>
          } @else {
          <span class="badge badge-danger">Inactivo</span>
          }
        </p>

        <ili-action-menu slot="end">
          <ng-container actions>
            <lux-button-mobile
              kind="edit"
              (clicked)="edit.emit({ id: item.id, title: 'Editar Tipo de Sanción' })"
            />
            <lux-button-mobile
              kind="delete"
              color="danger"
              (clicked)="delete.emit(item.id)"
            />
          </ng-container>
        </ili-action-menu>
      </ili-list-item>
    </ng-template>
  </lux-data-view-mobile>
</div>
