<form [formGroup]="form" (ngSubmit)="onSubmit()" class="d-flex flex-column">
  <lux-input-text-signal
    label="Nombre"
    [control]="form.controls.name"
    placeholder="Ej: Amonestacion escrita"
  />
  <lux-input-text-signal
    label="Descripción"
    [control]="form.controls.description"
    placeholder="Descripción opcional"
  />
  <lux-input-select-signal
    label="Nivel de Severidad"
    [control]="form.controls.severityLevel"
    [data]="cb_severity()"
    [filter]="true"
  />
  <lux-input-switch-signal
    label="¿Es Terminacion de Relacion Laboral?"
    [control]="form.controls.isTermination"
  />
  <lux-input-switch-signal
    label="¿Requiere Aprobacion de RH?"
    [control]="form.controls.requiresHRApproval"
  />
  <lux-input-switch-signal label="Activo" [control]="form.controls.isActive" />
  <div class="d-flex justify-content-end mt-2">
    <lux-button-web
      kind="save"
      severity="info"
      variant="soft"
      displayMode="both"
      label="Guardar"
      [disabled]="form.invalid"
      type="submit"
      [loading]="submitting()"
    />
  </div>
</form>
