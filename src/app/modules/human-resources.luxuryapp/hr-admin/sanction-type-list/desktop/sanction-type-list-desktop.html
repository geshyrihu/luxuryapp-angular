<div class="card">
  <lux-table
    #dt
    [value]="data()"
    [globalFilterFields]="globalFilterFields()"
    [paginator]="true"
    [rows]="tableRows"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    [scrollable]="true"
    [scrollHeight]="tableScrollH.scrollHeight()"
    [tableStyle]="{ 'min-width': '50rem' }"
    class="custom-table card"
  >
    <ng-template #caption>
      <lux-table-caption
        (add)="add.emit({ id: '', title: 'Nuevo Tipo de Sanción' })"
        [dt]="dt"
      />
    </ng-template>
    <ng-template #header>
      <tr>
        <th appSortableColumn="name">Nombre <app-sorticon field="name" /></th>
        <th appSortableColumn="severityLevel">
          Severidad <app-sorticon field="severityLevel" />
        </th>
        <th appSortableColumn="isTermination" class="text-center">
          Es Terminación <app-sorticon field="isTermination" />
        </th>
        <th appSortableColumn="requiresHRApproval" class="text-center">
          Requiere RH <app-sorticon field="requiresHRApproval" />
        </th>
        <th appSortableColumn="isActive" class="text-center">
          Activo <app-sorticon field="isActive" />
        </th>
        <th class="no-print">Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.severityLevel }}</td>
        <td class="text-center">
          @if (item.isTermination) {
          <span class="badge badge-danger">Sí</span>
          } @else {
          <span class="badge badge-neutral">No</span>
          }
        </td>
        <td class="text-center">
          @if (item.requiresHRApproval) {
          <span class="badge badge-warning">Sí</span>
          } @else {
          <span class="badge badge-neutral">No</span>
          }
        </td>
        <td class="text-center">
          @if (item.isActive) {
          <span class="badge badge-success">Activo</span>
          } @else {
          <span class="badge badge-danger">Inactivo</span>
          }
        </td>
        <td class="no-print">
          <div class="d-flex">
            <iw-button-edit
              (clicked)="edit.emit({ id: item.id, title: 'Editar Tipo de Sanción' })"
            />
            <iw-button-delete (confirmed)="delete.emit(item.id)" />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <lux-table-empty-message [colspan]="6" />
    </ng-template>
    <ng-template #paginatorleft>
      <lux-table-footer [data]="data()" />
    </ng-template>
  </lux-table>
</div>
