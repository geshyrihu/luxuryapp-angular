<div class="card">
  <lux-data-view-mobile
    [data]="data()"
    (add)="add.emit({ id: '', title: 'Nuevo Tipo de Incidencia' })"
    [globalFilterFields]="globalFilterFields()"
  >
    <ng-template #listItemTemplate let-item>
      <lux-list-item-mobile>
        <div
          start
          class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        >
          <app-icon icon="material-symbols-light:error-outline" />
        </div>

        <h2 class="text-base fw-semibold">{{ item.name }}</h2>
        <p class="text-sm text-wrap">
          <strong>Categoróa:</strong> {{ item.category }} |
          <strong>Severidad:</strong> {{ item.defaultSeverity }}
        </p>
        <p class="text-sm">
          <strong>Estado:</strong>
          @if (item.isActive) {
          <span class="badge badge-success">Activo</span>
          } @else {
          <span class="badge badge-danger">Inactivo</span>
          }
        </p>

        <lux-action-menu-mobile slot="end">
          <ng-container actions>
            <lux-button-mobile
              kind="edit"
              (clicked)="edit.emit({ id: item.id, title: 'Editar Tipo de Incidencia' })"
            />
            <lux-button-mobile
              kind="delete"
              color="danger"
              (clicked)="delete.emit(item.id)"
            />
          </ng-container>
        </lux-action-menu-mobile>
      </lux-list-item-mobile>
    </ng-template>
  </lux-data-view-mobile>
</div>
