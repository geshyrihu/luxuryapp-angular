@if (platformS.isMobile()) {
  <app-incident-type-list-mobile
    [data]="items()"
    [globalFilterFields]="globalFilterFields"
    (add)="onModalForm({ id: '', title: 'Nuevo Tipo de Incidencia' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-incident-type-list-desktop
    [data]="items()"
    [globalFilterFields]="globalFilterFields"
    (add)="onModalForm({ id: '', title: 'Nuevo Tipo de Incidencia' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
}
