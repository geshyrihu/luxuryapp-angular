<div class="card">
  <lux-table
    #dt
    [value]="data()"
    [globalFilterFields]="globalFilterFields()"
    [paginator]="true"
    [rows]="tableRows"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    [scrollable]="true"
    [scrollHeight]="tableScrollH.scrollHeight()"
    [tableStyle]="{ 'min-width': '50rem' }"
    class="custom-table card"
  >
    <ng-template #caption>
      <lux-table-caption
        (add)="add.emit({ id: '', title: 'Nuevo Tipo de Incidencia' })"
        [dt]="dt"
      />
    </ng-template>
    <ng-template #header>
      <tr>
        <th appSortableColumn="name">Nombre <app-sorticon field="name" /></th>
        <th appSortableColumn="category">
          Categoróa <app-sorticon field="category" />
        </th>
        <th appSortableColumn="defaultSeverity">
          Severidad por Defecto <app-sorticon field="defaultSeverity" />
        </th>
        <th appSortableColumn="isActive" class="text-center">
          Activo <app-sorticon field="isActive" />
        </th>
        <th class="no-print">Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.category }}</td>
        <td>{{ item.defaultSeverity }}</td>
        <td class="text-center">
          @if (item.isActive) {
          <span class="badge badge-success">Activo</span>
          } @else {
          <span class="badge badge-danger">Inactivo</span>
          }
        </td>
        <td class="no-print">
          <div class="d-flex">
            <lux-button-web
              kind="edit"
              displayMode="icon"
              severity="info"
              variant="soft"
              size="sm"
              tooltip="Editar"
              ariaLabel="Editar"
              (clicked)="edit.emit({ id: item.id, title: 'Editar Tipo de Incidencia' })"
            />
            <lux-button-web
              kind="delete"
              displayMode="icon"
              severity="danger"
              variant="soft"
              size="sm"
              tooltip="Eliminar"
              ariaLabel="Eliminar"
              (clicked)="delete.emit(item.id)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <lux-table-empty-message [colspan]="5" />
    </ng-template>
    <ng-template #paginatorleft>
      <lux-table-footer [data]="data()" />
    </ng-template>
  </lux-table>
</div>
