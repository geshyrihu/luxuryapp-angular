<form [formGroup]="form" (ngSubmit)="onSubmit()" class="d-flex flex-column">
  <lux-input-text-signal
    [control]="form.controls.name"
    label="Nombre"
    placeholder="Ej: Falta injustificada"
  />
  <lux-input-text-signal
    [control]="form.controls.description"
    label="DESCRIPCIÓN"
    placeholder="DESCRIPCIÓN opcional"
  />
  <lux-input-select-signal
    [control]="form.controls.category"
    label="Categoría"
    [data]="cb_category()"
    [filter]="true"
  />
  <lux-input-select-signal
    [control]="form.controls.defaultSeverity"
    label="Severidad por Defecto"
    [data]="cb_severity()"
    [filter]="true"
  />
  <lux-input-switch-signal [control]="form.controls.isActive" label="Activo" />
  <div class="d-flex justify-content-end mt-2">
    <lux-button-web
      kind="save"
      severity="info"
      variant="soft"
      displayMode="both"
      label="Guardar"
      [disabled]="form.invalid"
      type="submit"
      [loading]="submitting()"
    />
  </div>
</form>
