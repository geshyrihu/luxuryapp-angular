@if (platformS.isMobile()) {
  <app-lista-plantilla-evaluacion-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onCreate()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-lista-plantilla-evaluacion-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onCreate()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  />
}
