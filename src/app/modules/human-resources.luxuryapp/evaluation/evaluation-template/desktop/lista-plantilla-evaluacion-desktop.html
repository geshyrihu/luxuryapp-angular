<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption (add)="add.emit()" [dt]="dt" />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="name">
        Nombre
        <app-sorticon field="name" />
      </th>
      <th>DESCRIPCIÓN</th>
      <th class="text-center" appSortableColumn="isActive">
        Estado
        <app-sorticon field="isActive" />
      </th>
      <th class="text-center">Categoróas</th>
      <th class="text-center">Preguntas</th>
      <th class="text-center table-col-10rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.name }}</td>
      <td>{{ item.description }}</td>
      <td class="text-center">
        <lux-tag
          [value]="item.isActive ? 'Activa' : 'Inactiva'"
          [severity]="item.isActive ? 'success' : 'danger'"
        ></lux-tag>
      </td>
      <td class="text-center">{{ item.categoryCount }}</td>
      <td class="text-center">{{ item.questionCount }}</td>
      <!-- Opciones -->
      <td class="no-print text-center">
        <div class="d-flex justify-content-center">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit(item.id)"
          />
          <iw-button-delete (confirmed)="delete.emit(item.id)" />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
