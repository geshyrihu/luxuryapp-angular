<lux-data-view-mobile
  [data]="data()"
  (add)="add.emit()"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        class="w-3rem h-3rem bg-primary-50"
      >
        <app-icon
          icon="material-symbols-light:task-alt"
          class="text-xl text-primary"
        />
      </div>

      <h2 class="font-normal m-0">{{ item.employeeName }}</h2>
      <p class="text-medium text-body-secondary m-0">
        {{ item.evaluationTemplate }}
      </p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit(item.id)"
          />

          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</lux-data-view-mobile>
