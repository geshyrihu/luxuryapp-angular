<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  dzfxcvcv
  <ng-template #caption>
    <div class="d-flex justify-content-between">
      <lux-table-caption (add)="add.emit()" [dt]="dt" />
      <il-button
        (clicked)="downloadAll.emit()"
        label="Descargar Todas"
        icon="material-symbols-light:download"
      />
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="employeeName">
        Empleado
        <app-sorticon field="employeeName" />
      </th>
      <th appSortableColumn="departament">
        Departamento
        <app-sorticon field="departament" />
      </th>
      <th appSortableColumn="evaluationDate">
        Fecha
        <app-sorticon field="evaluationDate" />
      </th>
      <th appSortableColumn="evaluationTemplate">
        Evaluación
        <app-sorticon field="evaluationTemplate" />
      </th>
      <th appSortableColumn="evaluatorName">
        Evaluador
        <app-sorticon field="evaluatorName" />
      </th>
      <th appSortableColumn="finalScore">
        Resultado
        <app-sorticon field="finalScore" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.employeeName }}</td>
      <td>{{ item.departament }}</td>
      <td>{{ item.evaluationDate | apiDate: "dd/MM/yyyy" }}</td>
      <td>{{ item.evaluationTemplate }}</td>
      <td>{{ item.evaluatorName }}</td>
      <td>{{ item.finalScoreFormatted }}</td>
      <!-- Opciones -->
      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit(item.id)"
          />
          <iw-button-item
            (clicked)="detail.emit(item.id)"
            lxTooltip="Detalle"
            tooltipPosition="top"
            [iconClass]="'material-symbols-light:receipt'"
          />
          <iw-button-item
            (clicked)="downloadIndividual.emit({ id: item.id, employeeName: item.employeeName })"
            lxTooltip="Descargar"
            tooltipPosition="top"
            icon="material-symbols-light:download"
          />
          <iw-button-delete (confirmed)="delete.emit(item.id)" />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="7" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
