@if (platformS.isMobile()) {
  <app-lista-evaluacion-realizada-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onCreate()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-lista-evaluacion-realizada-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onCreate()"
    (downloadAll)="onDownloadAll()"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    (downloadIndividual)="onDownloadIndividual($event.id, $event.employeeName)"
    (delete)="onDelete($event)"
  />
}
