<lux-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="w-3rem h-3rem rounded d-flex align-items-center justify-content-center flex-shrink-0 ms-3 bg-body-tertiary"
      >
        <app-icon
          icon="material-symbols-light:article-outline"
          class="text-xl text-yellow-600"
        />
      </div>

      <h3>{{ item.name }}</h3>
      <p>{{ item.description }}</p>
      <p>
        {{ item.isActive ? 'Activa' : 'Inactiva' }} é {{ item.categoryCount }}
        categoróas é {{ item.questionCount }} preguntas
      </p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit(item.id)"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</lux-data-view-mobile>
