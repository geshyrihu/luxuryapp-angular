@if (platformS.isMobile()) {
  <app-chekador-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [desde]="filtroDesde()"
    [hasta]="filtroHasta()"
    [soloAnomalias]="filtroSoloAnomalias()"
    (desdeChange)="filtroDesde.set($event)"
    (hastaChange)="filtroHasta.set($event)"
    (soloAnomaliasChange)="filtroSoloAnomalias.set($event)"
    (applyFilters)="onAplicarFiltros()"
    (clearFilters)="onLimpiarFiltros()"
    (approve)="onAprobar($event)"
    (reject)="onRechazar($event)"
  />
} @else {
  <app-chekador-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [loading]="loading()"
    [desde]="filtroDesde()"
    [hasta]="filtroHasta()"
    [soloAnomalias]="filtroSoloAnomalias()"
    (desdeChange)="filtroDesde.set($event)"
    (hastaChange)="filtroHasta.set($event)"
    (soloAnomaliasChange)="filtroSoloAnomalias.set($event)"
    (applyFilters)="onAplicarFiltros()"
    (clearFilters)="onLimpiarFiltros()"
    (approve)="onAprobar($event)"
    (reject)="onRechazar($event)"
  />
}
