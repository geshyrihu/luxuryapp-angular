<div class="d-flex flex-column gap-4">
  <div class="card p-3">
    <div class="d-flex align-items-center justify-content-between gap-3">
      <div class="d-flex align-items-center gap-3">
        <lux-button-web displayMode="icon"
          iconClass="material-symbols-light:arrow-back"
          severity="secondary"
          variant="text"
          (clicked)="back()"
        />
        <div>
          <h5 class="m-0">ISN Patronal por Estado</h5>
          <small class="text-body-secondary"
            >Catálogo administrable de porcentajes estatales</small
          >
        </div>
      </div>
      <lux-button-web
        label="Nuevo parámetro"
        iconClass="material-symbols-light:add"
        severity="primary"
        size="small"
        (clicked)="openModal()"
      />
    </div>
  </div>
  <div class="card p-0">
    <lux-table
      [value]="rows()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="15"
      ><ng-template #header
        ><tr>
          <th appSortableColumn="state">
            ESTADO <app-sorticon field="state" />
          </th>
          <th appSortableColumn="year">AÑO <app-sorticon field="year" /></th>
          <th>ISN (%)</th>
          <th></th></tr></ng-template
      ><ng-template #body let-row
        ><tr>
          <td>{{ row.state }}</td>
          <td>{{ row.year }}</td>
          <td>
            {{ row.employerPayrollTaxPercentage * 100 | number: "1.2-4" }}%
          </td>
          <td class="text-center">
            <lux-button-web displayMode="icon"
              iconClass="material-symbols-light:edit"
              severity="primary"
              size="small"
              variant="text"
              title="Editar"
              (clicked)="openModal(row)"
            /><lux-button-web
              kind="confirm"
              displayMode="icon"
              severity="danger"
              variant="text"
              size="sm"
              icon="material-symbols-light:delete"
              tooltip="Eliminar"
              ariaLabel="Eliminar"
              [loading]="deletingKey() === row.state + '-' + row.year"
              (clicked)="delete(row)"
            />
          </td></tr></ng-template
      ><ng-template #emptymessage
        ><lux-table-empty-message [colspan]="4" /></ng-template
    ></lux-table>
  </div>
</div>
