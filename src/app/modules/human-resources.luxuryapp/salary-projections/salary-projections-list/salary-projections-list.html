<div class="card p-0">
  <lux-table
    [value]="rows()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="30"
    [globalFilterFields]="globalFilterFields()"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first} - {last} de {totalRecords}"
  >
    <ng-template #caption>
      <div
        class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 p-3 bg-body-tertiary rounded"
      >
        <div>
          <h5 class="m-0">Proyección de Sueldos</h5>
          <small class="text-body-secondary"
            >Propuestas de ajuste salarial y nuevas plazas</small
          >
        </div>

        <div class="d-flex align-items-center gap-2">
          <lux-button-web
            label="Nueva propuesta"
            iconClass="material-symbols-light:add"
            severity="primary"
            size="small"
            (clicked)="openCreateDialog()"
          />
        </div>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th class="table-col-12" appSortableColumn="folio">
          FOLIO <app-sorticon field="folio" />
        </th>
        <th class="table-col-30" appSortableColumn="name">
          NOMBRE <app-sorticon field="name" />
        </th>
        <th class="table-col-10">ESCENARIOS</th>
        <th class="table-col-12" appSortableColumn="state">
          ESTADO <app-sorticon field="state" />
        </th>
        <th class="table-col-15" appSortableColumn="createdAt">
          CREADO EL <app-sorticon field="createdAt" />
        </th>
        <th class="table-col-8"></th>
      </tr>
    </ng-template>

    <ng-template #body let-item>
      <tr>
        <td class="fw-semibold">{{ item.folio }}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.scenarios.length }}</td>
        <td>
          <lux-tag
            [value]="stateText(item.state)"
            [severity]="stateSeverity(item.state)"
          />
        </td>
        <td>{{ item.createdAt | apiDate }}</td>
        <td class="text-center">
          <lux-button-web displayMode="icon"
            iconClass="material-symbols-light:visibility"
            severity="primary"
            size="small"
            variant="text"
            (clicked)="openDetail(item)"
          />
          <lux-button-web
            kind="confirm"
            displayMode="icon"
            severity="danger"
            variant="text"
            size="sm"
            icon="material-symbols-light:delete"
            tooltip="Eliminar propuesta"
            ariaLabel="Eliminar propuesta"
            [loading]="deletingId() === item.id"
            (clicked)="deleteProjection(item)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <lux-table-empty-message [colspan]="6" />
    </ng-template>
  </lux-table>
</div>
