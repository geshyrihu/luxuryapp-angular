<div class="d-flex flex-column gap-4">
  <div class="card p-3"><div class="d-flex align-items-center justify-content-between gap-3"><div class="d-flex align-items-center gap-3"><iw-button iconClass="material-symbols-light:arrow-back" severity="secondary" variant="text" (clicked)="back()" /><div><h5 class="m-0">Parámetros de Ley Federal del Trabajo</h5><small class="text-body-secondary">Aguinaldo y primas legales por año</small></div></div><il-button label="Nuevo parámetro" iconClass="material-symbols-light:add" severity="primary" size="small" (clicked)="openModal()" /></div></div>
  <div class="card p-0"><app-table [value]="rows()" [loading]="loading()" [paginator]="true" [rows]="15"><ng-template #header><tr><th appSortableColumn="year">AÑO <app-sorticon field="year" /></th><th>DÍAS AGUINALDO</th><th>PRIMA VACACIONAL</th><th>PRIMA DOMINICAL</th><th></th></tr></ng-template><ng-template #body let-row><tr><td>{{ row.year }}</td><td>{{ row.christmasBonusDays }}</td><td>{{ row.vacationPremiumPercentage * 100 | number: "1.2-4" }}%</td><td>{{ row.sundayPremiumPercentage * 100 | number: "1.2-4" }}%</td><td class="text-center"><iw-button iconClass="material-symbols-light:edit" severity="primary" size="small" variant="text" title="Editar" (clicked)="openModal(row)" /><iw-button-confirm iconClass="material-symbols-light:delete" severity="danger" size="small" variant="text" title="Eliminar" swalText="¿Estás seguro de que quieres eliminar este parámetro?" [loading]="deletingYear() === row.year" (confirmed)="delete(row)" /></td></tr></ng-template><ng-template #emptymessage><app-table-empty-message [colspan]="5" /></ng-template></app-table></div>
</div>
