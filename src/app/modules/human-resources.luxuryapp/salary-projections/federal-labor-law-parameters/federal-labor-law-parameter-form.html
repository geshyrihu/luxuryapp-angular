<form class="p-md-3 d-flex flex-column gap-3" autocomplete="off" (ngSubmit)="submit()">
  <custom-input-text-signal type="number" label="Año" [ngModel]="year()" (ngModelChange)="year.set(+$event)" name="year" />
  <custom-input-text-signal type="number" label="Días de aguinaldo" [ngModel]="christmasBonusDays()" (ngModelChange)="christmasBonusDays.set(+$event)" name="christmasBonusDays" />
  <custom-input-text-signal type="number" label="Prima vacacional (ej. 0.25)" [ngModel]="vacationPremiumPercentage()" (ngModelChange)="vacationPremiumPercentage.set(+$event)" name="vacationPremiumPercentage" />
  <custom-input-text-signal type="number" label="Prima dominical (ej. 0.25)" [ngModel]="sundayPremiumPercentage()" (ngModelChange)="sundayPremiumPercentage.set(+$event)" name="sundayPremiumPercentage" />
  <div class="d-flex justify-content-end gap-2"><il-button type="button" label="Cancelar" severity="secondary" variant="outline" size="small" (clicked)="close()" /><il-button type="submit" label="Guardar" severity="primary" size="small" [loading]="saving()" /></div>
</form>
