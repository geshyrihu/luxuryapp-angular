<form
  class="p-md-3 d-flex flex-column gap-3"
  autocomplete="off"
  (ngSubmit)="submit()"
>
  <lux-input-text-signal
    type="number"
    label="Año"
    [ngModel]="year()"
    (ngModelChange)="year.set(+$event)"
    name="year"
  />
  <lux-input-text-signal
    type="number"
    label="Días de aguinaldo"
    [ngModel]="christmasBonusDays()"
    (ngModelChange)="christmasBonusDays.set(+$event)"
    name="christmasBonusDays"
  />
  <lux-input-text-signal
    type="number"
    label="Prima vacacional (ej. 0.25)"
    [ngModel]="vacationPremiumPercentage()"
    (ngModelChange)="vacationPremiumPercentage.set(+$event)"
    name="vacationPremiumPercentage"
  />
  <lux-input-text-signal
    type="number"
    label="Prima dominical (ej. 0.25)"
    [ngModel]="sundayPremiumPercentage()"
    (ngModelChange)="sundayPremiumPercentage.set(+$event)"
    name="sundayPremiumPercentage"
  />
  <div class="d-flex justify-content-end gap-2">
    <lux-button-web
      type="button"
      label="Cancelar"
      severity="secondary"
      variant="outline"
      size="small"
      (clicked)="close()"
    /><lux-button-web
      type="submit"
      label="Guardar"
      severity="primary"
      size="small"
      [loading]="saving()"
    />
  </div>
</form>
