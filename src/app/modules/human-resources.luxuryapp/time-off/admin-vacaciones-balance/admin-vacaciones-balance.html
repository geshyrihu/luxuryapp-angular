@if (platformS.isMobile()) {
  <app-admin-vacaciones-balance-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (edit)="openEditModal($event)"
  />
} @else {
  <app-admin-vacaciones-balance-desktop
    [data]="dataSignal()"
    [loading]="loading()"
    [globalFilterFields]="globalFilterFields()"
    (recalculate)="onRecalculateAll()"
    (edit)="openEditModal($event)"
  />
}
