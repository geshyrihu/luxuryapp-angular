<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div>
    <div class="mb-3">
      <label>Empleado</label>
      <p>
        <strong>{{ employeeData.fullName }}</strong>
      </p>
    </div>

    <lux-input-number-signal
      label="Nuevo Saldo de Días Disponibles"
      [control]="form.controls.newAvailableBalance"
      [min]="0"
      [showButtons]="true"
    ></lux-input-number-signal>

    <lux-input-textarea-signal
      label="Justificación del Cambio"
      [control]="form.controls.justification"
      [rows]="4"
      [maxLength]="500"
    />
  </div>

  <div class="p-dialog-footer mt-4">
    <lux-button-web
      kind="save"
      type="submit"
      severity="info"
      variant="soft"
      displayMode="both"
      label="Guardar"
      [disabled]="form.invalid"
      [loading]="submitting"
    />
  </div>
</form>
