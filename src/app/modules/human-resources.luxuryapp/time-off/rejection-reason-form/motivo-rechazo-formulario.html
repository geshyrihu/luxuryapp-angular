<div>
  <custom-input-textarea-signal
    customClass="w-100"
    [control]="reasonControl"
    [rows]="4"
    placeholder="Escriba el motivo del rechazo..."
  />
</div>
<div class="d-flex justify-content-end mt-3">
  <lux-button-web
    label="Cancelar"
    variant="text"
    (clicked)="close(null)"
  />
  <lux-button-web
    label="Confirmar Rechazo"
    severity="danger"
    [disabled]="!reasonControl.value"
    customClass="ml-2"
    (clicked)="confirm()"
  />
</div>
