<app-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
      >
        <app-icon icon="material-symbols-light:event-available" />
      </div>

      <h2 class="font-normal m-0">{{ item.requestTypeName }}</h2>
      <p class="mt-0 mb-0">{{ item.userName }}</p>
      <p class="text-body-secondary font-size-12 mt-0 mb-0">
        {{ item.startDate | apiDate: "dd/MM/yyyy" }} - {{ item.endDate |
        apiDate: "dd/MM/yyyy" }}
      </p>
      <p class="text-body-secondary font-size-12 mt-0 mb-0">
        Estado: {{ item.status }}
      </p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          <ili-button-delete (confirmed)="delete.emit(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
