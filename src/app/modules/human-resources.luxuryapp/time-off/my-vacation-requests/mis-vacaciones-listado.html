@if (platformS.isMobile()) {
  <app-mis-vacaciones-listado-mobile
    [data]="dataSignal()"
    (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
    (edit)="onModalForm($event)"
    (detail)="onDetail($event)"
  />
} @else {
  <app-mis-vacaciones-listado-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
    (edit)="onModalForm($event)"
    (detail)="onDetail($event)"
    (delete)="onDelete($event)"
    (navSaldo)="onNavSaldo()"
  />
}
