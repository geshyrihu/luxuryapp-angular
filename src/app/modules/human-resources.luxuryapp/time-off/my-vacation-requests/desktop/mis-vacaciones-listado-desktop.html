<div class="card">
  <lux-table
    [globalFilterFields]="globalFilterFields()"
    [paginator]="true"
    [rows]="tableRows"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="true"
    [value]="data()"
    [scrollable]="true"
    [scrollHeight]="scrollHeight()"
    #dt
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    class="custom-table"
  >
    <ng-template #caption>
      <div class="d-flex align-items-center">
        <div class="flex-flex-grow-1-1">
          <lux-table-caption
            (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
            [dt]="dt"
          />
        </div>
        <div class="flex-none">
          <il-button
            label="Saldo"
            icon="material-symbols-light:calendar-today"
            [fluid]="true"
            (clicked)="navSaldo.emit()"
          />
        </div>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th appSortableColumn="requestDate">
          Fecha Solicitud
          <app-sorticon field="requestDate" />
        </th>
        <th appSortableColumn="startDate">
          Periodo
          <app-sorticon field="startDate" />
        </th>
        <th appSortableColumn="requestedDays">
          Días Solicitados
          <app-sorticon field="requestedDays" />
        </th>
        <th appSortableColumn="status">
          Estado
          <app-sorticon field="status" />
        </th>
        <th>Aprobación</th>
        <th class="no-print"></th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      <tr>
        <td>{{ item.requestDate }}</td>
        <td>
          <div>
            <span>
              <strong>Inicio:</strong>
              {{ item.startDate }}
            </span>
            <br />
            <span>
              <strong>Fin:</strong>
              {{ item.endDate }}
            </span>
          </div>
        </td>
        <td class="text-center">
          <lux-tag
            severity="info"
            [value]="item.requestedDays"
            class="text-base p-2"
          />
        </td>
        <td>
          <lux-tag
            [value]="item.status"
            [severity]="getStatusSeverity(item.status)"
          ></lux-tag>
        </td>
        <td>
          {{ item.approverFullName || "-" }}
          <br />
          @if (item.approvalDate) {
          <span> {{ item.approvalDate }} </span>
          }
        </td>

        <td class="no-print">
          <div class="d-flex justify-content-end">
            <!-- botón Ver Detalle -->
            <iw-button-item
              icon="material-symbols-light:visibility-outline"
              label="Ver Detalle"
              (clicked)="detail.emit(item.id)"
              lxTooltip="Ver detalle"
            />

            @if (item.status === "Pendiente") {
            <lux-button-web
              kind="edit"
              displayMode="icon"
              severity="info"
              variant="soft"
              size="sm"
              tooltip="Editar"
              ariaLabel="Editar"
              (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
            />
            <iw-button-delete (confirmed)="delete.emit(item.id)" />
            }
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <lux-table-empty-message [colspan]="6" />
    </ng-template>
    <ng-template #paginatorleft>
      <lux-table-footer [data]="data()" />
    </ng-template>
  </lux-table>
</div>
