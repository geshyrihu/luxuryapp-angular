<div class="card">
  <lux-data-view-mobile
    [data]="data()"
    (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
  >
    <ng-template #listItemTemplate let-item>
      <lux-list-item-mobile>
        <div
          start
          class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        >
          <app-icon icon="material-symbols-light:beach-access" />
        </div>

        <h2 class="fw-bold">{{ item.requestDate }}</h2>
        <p class="text-sm text-body-secondary">
          {{ item.startDate }} é {{ item.endDate }}
        </p>
        <p class="text-sm text-body-secondary">
          Días: {{ item.requestedDays }}
        </p>
        <p class="text-sm">
          <lux-tag
            [value]="item.status"
            [severity]="getStatusSeverity(item.status)"
          />
        </p>
        <p class="text-sm text-body-secondary">
          {{ item.approverFullName || 'é' }}
        </p>

        <lux-action-menu-mobile slot="end">
          <ng-container actions>
            <lux-button-mobile
              kind="item"
              label="Ver Detalle"
              icon="material-symbols-light:visibility-outline"
              (clicked)="detail.emit(item.id)"
            />
            @if (item.status === 'Pendiente') {
            <lux-button-mobile
              kind="edit"
              (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
            />
            }
          </ng-container>
        </lux-action-menu-mobile>
      </lux-list-item-mobile>
    </ng-template>
  </lux-data-view-mobile>
</div>
