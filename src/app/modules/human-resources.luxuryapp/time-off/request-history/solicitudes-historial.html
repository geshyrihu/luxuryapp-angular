@if (platformS.isMobile()) {
  <app-solicitudes-historial-mobile [data]="data()" />
} @else {
  <app-solicitudes-historial-desktop
    [form]="filterForm"
    [data]="data()"
    [loading]="loading()"
    [globalFilterFields]="globalFilterFields()"
    [employees]="employees()"
    [requestTypes]="requestTypes()"
    [statuses]="statuses()"
    [canCancel]="canCancel()"
    (search)="onSearch()"
    (reset)="onReset()"
    (showDetail)="onShowDetail($event)"
    (cancel)="onCancel($event)"
  />
}
