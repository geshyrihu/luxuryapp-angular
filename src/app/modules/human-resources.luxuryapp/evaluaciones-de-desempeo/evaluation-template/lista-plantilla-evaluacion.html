<app-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card d-none d-md-block"
>
  <ng-template #caption>
    <primeng-custom-caption (add)="onCreate()" [dt]="dt" />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="name">
        Nombre
        <app-sorticon field="name" />
      </th>
      <th>DESCRIPCIÓN</th>
      <th class="text-center" appSortableColumn="isActive">
        Estado
        <app-sorticon field="isActive" />
      </th>
      <th class="text-center">Categoróas</th>
      <th class="text-center">Preguntas</th>
      <th class="text-center table-col-10rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.name }}</td>
      <td>{{ item.description }}</td>
      <td class="text-center">
        <lx-tag
          [value]="item.isActive ? 'Activa' : 'Inactiva'"
          [severity]="item.isActive ? 'success' : 'danger'"
        ></lx-tag>
      </td>
      <td class="text-center">{{ item.categoryCount }}</td>
      <td class="text-center">{{ item.questionCount }}</td>
      <!-- Opciones -->
      <td class="no-print text-center">
        <div class="d-flex justify-content-center">
          <iw-button-edit (clicked)="onEdit(item.id)" />
          <iw-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</app-table>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onCreate()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="w-3rem h-3rem rounded d-flex align-items-center justify-content-center flex-shrink-0 ms-3 bg-body-tertiary"
      >
        <app-icon
          icon="material-symbols-light:article-outline"
          class="text-xl text-yellow-600"
        />
      </div>

      <h3>{{ item.name }}</h3>
      <p>{{ item.description }}</p>
      <p>
        {{ item.isActive ? 'Activa' : 'Inactiva' }} é {{ item.categoryCount }}
        categoróas é {{ item.questionCount }} preguntas
      </p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit (clicked)="onEdit(item.id)" label="Editar" />
          <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
