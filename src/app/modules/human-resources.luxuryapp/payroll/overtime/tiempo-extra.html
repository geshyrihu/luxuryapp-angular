<!-- Selector de periodo -->
<div class="d-flex flex-wrap gap-2 mb-3">
  @for (p of periodos(); track p.value) {
  <lux-button-web
    [label]="p.label"
    size="small"
    [variant]="periodoSeleccionado() !== p.value ? 'outline' : 'solid'"
    (clicked)="cambiarPeriodo(p.value)"
  />
  }
</div>

@if (platformS.isMobile()) {
<app-tiempo-extra-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="openAdd()"
  (edit)="openEdit($event)"
  (delete)="onDelete($event)"
/>
} @else {
<app-tiempo-extra-desktop
  [data]="data()"
  [loading]="loading()"
  [globalFilterFields]="globalFilterFields()"
  (add)="openAdd()"
  (edit)="openEdit($event)"
  (approve)="aprobar($event)"
  (delete)="onDelete($event)"
/>
}
