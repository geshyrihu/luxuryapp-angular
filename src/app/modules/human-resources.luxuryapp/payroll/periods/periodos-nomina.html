<!-- Filtro de año -->
<div class="d-flex gap-2 mb-3">
  @for (anio of aniosDisponibles; track anio) {
  <lux-button-web
    [label]="String(anio)"
    size="small"
    [variant]="anioFiltro() !== anio ? 'outline' : 'solid'"
    (clicked)="cambiarAnio(anio)"
  />
  }
</div>

@if (platformS.isMobile()) {
<app-periodos-nomina-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="openAdd()"
  (edit)="openEdit($event)"
  (delete)="onDelete($event)"
/>
} @else {
<app-periodos-nomina-desktop
  [data]="data()"
  [loading]="loading()"
  [globalFilterFields]="globalFilterFields()"
  (add)="openAdd()"
  (edit)="openEdit($event)"
  (nonWorkingDays)="openDiasNoHabiles($event)"
  (delete)="onDelete($event)"
/>
}
