<lux-table
  #dt
  [value]="data()"
  [loading]="loading()"
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  class="card custom-table"
>
  <ng-template #caption>
    <div class="d-flex justify-content-between flex-wrap gap-2">
      <lux-table-caption [dt]="dt" (add)="add.emit()" />
      <div class="d-flex gap-2">
        <il-button
          label="Sync Vacaciones"
          iconClass="material-symbols-light:sync"
          severity="secondary"
          variant="text"
          [disabled]="sincronizando()"
          (clicked)="syncVacations.emit()"
        />
        <il-button
          label="Sync Permisos"
          iconClass="material-symbols-light:sync"
          severity="secondary"
          variant="text"
          [disabled]="sincronizando()"
          (clicked)="syncPermissions.emit()"
        />
      </div>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="nombreEmpleado">
        Empleado <app-sorticon field="nombreEmpleado" />
      </th>
      <th appSortableColumn="tipoIncidenciaDisplay">
        Tipo <app-sorticon field="tipoIncidenciaDisplay" />
      </th>
      <th appSortableColumn="fecha">Fecha <app-sorticon field="fecha" /></th>
      <th class="text-end">DIAS</th>
      <th class="text-end">Minutos</th>
      <th class="text-end">Descuento ($)</th>
      <th>Sync</th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.nombreEmpleado }}</td>
      <td>
        <lux-tag
          [severity]="getTipoSeverity(item.tipoIncidencia)"
          [value]="item.tipoIncidenciaDisplay"
        />
      </td>
      <td>{{ item.fecha | apiDate: "dd/MM/yyyy" }}</td>
      <td class="text-end">{{ item.diasAfectados }}</td>
      <td class="text-end">{{ item.minutosRetardo }}</td>
      <td class="text-end">
        {{ item.montoDescuento | currency: "MXN" : "symbol" : "1.2-2" }}
      </td>
      <td>
        <lux-tag
          [severity]="item.esSincronizada ? 'success' : 'secondary'"
          [value]="item.esSincronizada ? 'Auto' : 'Manual'"
        />
      </td>
      <td>
        <iw-button-delete (confirmed)="delete.emit(item)" />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="8" />
  </ng-template>
</lux-table>
