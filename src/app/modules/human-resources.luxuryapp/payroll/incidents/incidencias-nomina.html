<!-- Selector de periodo -->
<div class="d-flex flex-wrap gap-2 mb-3">
  @for (p of periodos(); track p.value) {
  <lux-button-web
    [label]="p.label"
    size="small"
    [variant]="periodoSeleccionado() !== p.value ? 'outline' : 'solid'"
    (clicked)="cambiarPeriodo(p.value)"
  />
  }
</div>

@if (platformS.isMobile()) {
<app-incidencias-nomina-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="openAdd()"
  (delete)="onDelete($event)"
/>
} @else {
<app-incidencias-nomina-desktop
  [data]="data()"
  [loading]="loading()"
  [globalFilterFields]="globalFilterFields()"
  [sincronizando]="sincronizando()"
  (add)="openAdd()"
  (delete)="onDelete($event)"
  (syncVacations)="sincronizarVacaciones()"
  (syncPermissions)="sincronizarPermisos()"
/>
}
