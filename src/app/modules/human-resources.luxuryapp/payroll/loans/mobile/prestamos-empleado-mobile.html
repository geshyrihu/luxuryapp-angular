<lux-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
      >
        <app-icon icon="material-symbols-light:attach-money" />
      </div>

      <h2 class="font-normal m-0">{{ item.nombreEmpleado }}</h2>
      <p class="text-xs m-0">{{ item.motivo }}</p>
      <div class="d-flex align-items-center gap-2 mt-1">
        <span class="fw-bold"
          >{{ item.saldoPendiente | currency: "MXN" : "symbol" : "1.0-0"
          }}</span
        >
        <lux-tag
          [severity]="getEstadoSeverity(item.estado)"
          [value]="item.estado"
        />
      </div>
      <div class="mt-1">
        <div class="rounded overflow-hidden">
          <div
            class="rounded bg-primary"
            [style.width.%]="getProgreso(item)"
          ></div>
        </div>
      </div>

      <div end>
        <lux-button-web displayMode="icon"
          iconClass="material-symbols-light:visibility-outline"
          severity="info"
          variant="text"
          (clicked)="view.emit(item)"
        />
      </div>
    </ili-list-item>
  </ng-template>
</lux-data-view-mobile>
