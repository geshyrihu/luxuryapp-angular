@if (platformS.isMobile()) {
<app-prestamos-empleado-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="openAdd()"
  (view)="openDetalle($event)"
  (delete)="onDelete($event)"
/>
} @else {
<app-prestamos-empleado-desktop
  [data]="data()"
  [loading]="loading()"
  [globalFilterFields]="globalFilterFields()"
  (add)="openAdd()"
  (view)="openDetalle($event)"
  (delete)="onDelete($event)"
/>
}
