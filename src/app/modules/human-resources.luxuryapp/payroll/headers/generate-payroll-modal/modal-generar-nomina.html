<form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-3">
  <div class="row g-4">
    <div class="col-12">
      <custom-input-select-signal
        [control]="form.controls['periodoNominaId']"
        label="Periodo de Nomina"
        [data]="periodosOptions()"
        [filter]="true"
        hint="Selecciona el periodo para el cual se generara la nomina"
      />
    </div>
    <div class="col-12 col-md-4">
      <custom-input-switch-signal
        [control]="form.controls['soloEmpleadosActivos']"
        label="Solo Empleados Activos"
      />
    </div>
    <div class="col-12 col-md-4">
      <custom-input-switch-signal
        [control]="form.controls['incluirTiempoExtra']"
        label="Incluir Tiempo Extra"
      />
    </div>
    <div class="col-12 col-md-4">
      <custom-input-switch-signal
        [control]="form.controls['sincronizarIncidencias']"
        label="Sincronizar Incidencias"
      />
    </div>
    <div class="col-12 d-flex justify-content-end">
      <lux-button-web
        kind="save"
        type="button"
        severity="info"
        variant="soft"
        displayMode="both"
        label="Generar Nomina"
        (clicked)="onSubmit()"
        [loading]="submitting()"
      />
    </div>
  </div>
</form>
