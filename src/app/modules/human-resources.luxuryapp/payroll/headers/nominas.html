@if (platformS.isMobile()) {
<app-nominas-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="openGenerar()"
  (view)="verDetalle($event)"
/>
} @else {
<app-nominas-desktop
  [data]="data()"
  [loading]="loading()"
  [globalFilterFields]="globalFilterFields()"
  (add)="openGenerar()"
  (view)="verDetalle($event)"
  (changeState)="cambiarEstado($event.item, $event.action)"
/>
}
