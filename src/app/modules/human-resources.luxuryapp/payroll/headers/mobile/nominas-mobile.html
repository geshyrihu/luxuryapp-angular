<lux-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit()"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
      >
        <app-icon icon="material-symbols-light:attach-money" />
      </div>

      <h2 class="font-normal m-0">{{ item.periodoDescripcion }}</h2>
      <p class="text-xs m-0">{{ item.totalEmpleados }} empleados</p>
      <div class="d-flex align-items-center gap-2 mt-1">
        <lux-tag
          [severity]="getEstadoSeverity(item.estadoValue)"
          [value]="item.estado"
        />
        <span class="fw-bold"
          >{{ item.totalNeto | currency: "MXN" : "symbol" : "1.2-2" }}</span
        >
      </div>

      <div end>
        <lux-button-web displayMode="icon"
          iconClass="material-symbols-light:visibility-outline"
          severity="info"
          variant="text"
          (clicked)="view.emit(item)"
        />
      </div>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
