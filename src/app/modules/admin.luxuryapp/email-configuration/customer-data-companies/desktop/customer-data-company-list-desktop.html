<lux-table
  [globalFilterFields]="globalFilterFields()"
  [groupRowsBy]="groupingOption()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollable]="true"
  [showCurrentPageReport]="true"
  [initialSortField]="groupingOption()"
  [value]="sortedData()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  scrollHeight="70vh"
  sortMode="single"
  class="custom-table card"
>
  <ng-template #caption>
    <div
      class="d-flex flex-column flex-md-row align-items-md-center justify-content-between p-2 gap-3 g-4"
    >
      <div class="flex-grow-1">
        <lux-table-caption
          (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
          [dt]="dt"
          [noPadding]="true"
          [noMargin]="true"
        />
      </div>
      <div class="flex-shrink-0">
        <custom-input-select-signal
          [data]="groupingOptions()"
          optionLabel="label"
          optionValue="value"
          [control]="groupingOptionControl()"
          (selectionChange)="groupingChange.emit($event.value)"
          [horizontal]="false"
          [noMargin]="true"
        />
      </div>
    </div>
  </ng-template>

  <ng-template #groupheader let-item>
    <tr class="bg-body-tertiary">
      <td colspan="6" class="py-2">
        <div class="d-flex align-items-center">
          <app-icon
            [icon]="
              groupingOption() === 'numeroCliente'
                ? 'material-symbols-light:apartment'
                : 'material-symbols-light:person'
            "
            class="text-primary me-2"
          />
          <span class="fw-bold text-body">
            {{ groupingOption() === "numeroCliente" ? item.customer :
            item.applicationRoleName }}
          </span>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #header>
    <tr>
      <th appSortableColumn="customer">
        CLIENTE <app-sorticon field="customer" />
      </th>
      <th appSortableColumn="applicationRoleName">
        ROL <app-sorticon field="applicationRoleName" />
      </th>
      <th appSortableColumn="applicationUser">
        USUARIO <app-sorticon field="applicationUser" />
      </th>
      <th appSortableColumn="email">EMAIL <app-sorticon field="email" /></th>
      <th appSortableColumn="phoneNumber">
        TELÉFONO <app-sorticon field="phoneNumber" />
      </th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td>{{ item.customer }}</td>
      <td>{{ item.applicationRoleName }}</td>
      <td>{{ item.applicationUser }}</td>
      <td>{{ item.email }}</td>
      <td>{{ item.phoneNumber }}</td>
      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar Registro' })"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            ariaLabel="Eliminar"
            (clicked)="delete.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="6" />
  </ng-template>

  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
