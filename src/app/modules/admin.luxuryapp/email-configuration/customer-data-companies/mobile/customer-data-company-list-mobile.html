<app-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
>
  <div customFilters>
    <div class="px-4 py-2">
      <custom-input-select-signal
        [data]="groupingOptions()"
        optionLabel="label"
        optionValue="value"
        [control]="groupingOptionControl()"
        (selectionChange)="groupingChange.emit($event.value)"
        [horizontal]="false"
        [noMargin]="true"
      />
    </div>
  </div>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <app-icon
        slot="start"
        icon="material-symbols-light:apartment"
        class="text-xl text-primary"
      />
      <ion-label>
        <div class="d-flex justify-content-between align-items-start mb-2">
          <span class="text-xs fw-bold text-primary">{{ item.customer }}</span>
          <span class="text-xs text-body-secondary"
            >{{ item.applicationRoleName }}</span
          >
        </div>
        <h2 class="text-base fw-bold mb-1">{{ item.applicationUser }}</h2>
        <div class="d-flex align-items-center text-sm text-body-secondary mb-1">
          <app-icon
            [icon]="'material-symbols-light:mail-outline'"
            class="text-xs"
          />
          <span>{{ item.email }}</span>
        </div>
        <div class="d-flex align-items-center text-sm text-body-secondary">
          <app-icon [icon]="'material-symbols-light:call'" class="text-xs" />
          <span>{{ item.phoneNumber }}</span>
        </div>
      </ion-label>

      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit
            (clicked)="edit.emit({ id: item.id, title: 'Editar Registro' })"
            label="Editar"
          />
          <ili-button-delete (confirmed)="delete.emit(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
