@if (platformS.isMobile()) {
<app-customer-data-company-list-mobile
  [data]="data()"
  [sortedData]="sortedData()"
  [globalFilterFields]="globalFilterFields()"
  [groupingOptions]="groupingOptions"
  [groupingOption]="groupingOption()"
  [groupingOptionControl]="groupingOptionControl"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
  (groupingChange)="groupingOption.set($event)"
/>
} @else {
<app-customer-data-company-list-desktop
  [data]="data()"
  [sortedData]="sortedData()"
  [globalFilterFields]="globalFilterFields()"
  [groupingOptions]="groupingOptions"
  [groupingOption]="groupingOption()"
  [groupingOptionControl]="groupingOptionControl"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
  (groupingChange)="groupingOption.set($event)"
/>
}
