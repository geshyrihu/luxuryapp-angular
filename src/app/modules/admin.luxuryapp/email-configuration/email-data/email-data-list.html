@if (platformS.isMobile()) {
<lux-email-data-list-mobile-web
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (sendTestEmail)="onSendTestEmail($event)"
/>
} @else {
<lux-email-data-list-desktop-web
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (sendTestEmail)="onSendTestEmail($event)"
/>
}
