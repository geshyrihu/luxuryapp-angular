<!-- 💻 INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<lux-table-web
  #dt
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  class="custom-table card d-none d-md-block"
>
  <ng-template #caption>
    <lux-table-caption-web [showAdd]="false" [dt]="dt" />
  </ng-template>

  <ng-template #header>
    <tr>
      <th appSortableColumn="applicationUser">
        Usuario
        <lux-sorticon-web field="applicationUser" />
      </th>
      <th appSortableColumn="email">
        Email
        <lux-sorticon-web field="email" />
      </th>
      <th appSortableColumn="smtp">
        Smtp
        <lux-sorticon-web field="smtp" />
      </th>
      <th appSortableColumn="port">
        Port
        <lux-sorticon-web field="port" />
      </th>

      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.applicationUser }}</td>
      <td>{{ item.email }}</td>
      <td>{{ item.smtp }}</td>
      <td>{{ item.port }}</td>

      <!-- Opciones -->

      <td class="no-print">
        <div class="d-flex">
          <iw-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <iw-button-send-email (confirmed)="onSendTestEmail(item.id)" />
        </div>
      </td>

      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message-web [colspan]="5" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer-web [data]="dataSignal()" />
  </ng-template>
</lux-table-web>

<!--📲INICIO: Componente adaptado para versión móvil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
       <lux-icon slot="start" icon="material-symbols-light:mail-outline" class="text-xl text-primary" />
       <ion-label>
         <p class="mt-0 mb-0">{{ item.email }}</p>
         <p class="text-body-secondary font-size-12 mt-0 mb-0">
           {{ item.applicationUser }}
         </p>
       </ion-label>

      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          <ili-button-send-email
            (confirmed)="onSendTestEmail(item.id)"
            label="Enviar"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
