<lux-table
  #dt
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [value]="data()"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption [showAdd]="false" [dt]="dt" />
  </ng-template>

  <ng-template #header>
    <tr>
      <th appSortableColumn="applicationUser">
        Usuario
        <lux-sorticon-web field="applicationUser" />
      </th>
      <th appSortableColumn="email">
        Email
        <lux-sorticon-web field="email" />
      </th>
      <th appSortableColumn="smtp">
        Smtp
        <lux-sorticon-web field="smtp" />
      </th>
      <th appSortableColumn="port">
        Port
        <lux-sorticon-web field="port" />
      </th>

      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.applicationUser }}</td>
      <td>{{ item.email }}</td>
      <td>{{ item.smtp }}</td>
      <td>{{ item.port }}</td>

      <!-- Opciones -->

      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-web
            kind="send-email"
            displayMode="icon"
            severity="info"
            variant="soft"
            (clicked)="sendTestEmail.emit(item.id)"
          />
        </div>
      </td>

      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="5" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
