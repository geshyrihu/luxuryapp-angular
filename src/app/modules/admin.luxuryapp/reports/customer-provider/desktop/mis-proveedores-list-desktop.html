<lux-table
  [globalFilterFields]="globalFilterFields()"
  [value]="data()"
  #dt
  class="custom-table card"
>
  <!-- class="p-datatable-sm" -->
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th colspan="2" appSortableColumn="nameComercial">
        Proveedor
        <app-sorticon field="nameComercial" />
      </th>
      <th appSortableColumn="service">
        Servicio
        <app-sorticon field="service" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <lux-avatar
          [image]="item.pathPhoto"
          alt="noImg"
          shape="square"
          size="large"
          class="b-r-8 img-70"
        />
      </td>
      <td>
        <h4 class="m-0 h4">{{ item.nameComercial }}</h4>
        <p>{{ item.nameProvider }}</p>
      </td>
      <td>{{ item.service }}</td>
      <!-- Opciones -->
      <td class="no-print">
        <app-action-menu>
          <ng-container actions>
            <lux-button-web
              kind="edit"
              severity="info"
              variant="soft"
              (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
            />
            <lux-button-web
              kind="delete"
              severity="danger"
              variant="soft"
              (clicked)="delete.emit(item.id)"
            />
          </ng-container>
        </app-action-menu>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="3" />
  </ng-template>
</lux-table>
