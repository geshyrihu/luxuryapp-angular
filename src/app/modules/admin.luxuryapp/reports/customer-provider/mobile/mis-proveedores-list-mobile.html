<lux-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile lines="full" detail="false">
      <lux-icon
        slot="start"
        icon="material-symbols-light:store-outline"
        class="text-xl text-green-500"
      />
      <ion-label>
        <h3>{{ item.nameComercial }}</h3>
        <p>{{ item.service }}</p>
      </ion-label>
      <lux-action-menu-mobile slot="end">
        <lux-button-mobile
          kind="edit"
          (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
        />
        <lux-button-mobile
          kind="delete"
          color="danger"
          (clicked)="delete.emit(item.id)"
        />
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
