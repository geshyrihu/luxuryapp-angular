<lux-table-web
  [globalFilterFields]="globalFilterFields()"
  [value]="dataSignal()"
  #dt
  class="custom-table card d-none d-md-block"
>
  <!-- class="p-datatable-sm" -->
  <ng-template #caption>
    <lux-table-caption-web
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th colspan="2" appSortableColumn="nameComercial">
        Proveedor
        <lux-sorticon-web field="nameComercial" />
      </th>
      <th appSortableColumn="service">
        Servicio
        <lux-sorticon-web field="service" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <lux-avatar
          [image]="item.pathPhoto"
          alt="noImg"
          shape="square"
          size="large"
          class="b-r-8 img-70"
        />
      </td>
      <td>
        <h4 class="m-0 h4">{{ item.nameComercial }}</h4>
        <p>{{ item.nameProvider }}</p>
      </td>
      <td>{{ item.service }}</td>
      <!-- Opciones -->
      <td class="no-print">
        <lux-action-menu-web>
          <ng-container actions>
            <il-button-edit
              (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
              label="Editar"
            />
            <il-button-delete
              (confirmed)="onDelete(item.id)"
              label="Eliminar"
            />
          </ng-container>
        </lux-action-menu-web>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message-web [colspan]="3" />
  </ng-template>
</lux-table-web>
<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item lines="full" detail="false">
      <lux-icon
        slot="start"
        icon="material-symbols-light:store-outline"
        class="text-xl text-green-500"
      />
      <ion-label>
        <h3>{{ item.nameComercial }}</h3>
        <p>{{ item.service }}</p>
      </ion-label>
      <ili-action-menu slot="end">
        <ili-button-edit
          (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          label="Editar"
        />
        <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
