<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [tableStyle]="{ 'min-width': '60rem' }"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption (add)="add.emit()" [dt]="dt" />
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="w-24">Tipo</th>
      <th class="w-32">Nombre</th>
      <th class="w-24">Tel. 1</th>
      <th class="w-24">Tel. 2</th>
      <th>Contacto</th>
      <th class="w-20">Estado</th>
      <th class="w-16 no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ getLocationTypeLabel(item.locationType) }}</td>
      <td>{{ item.name }}</td>
      <td>{{ item.phoneOne }}</td>
      <td>{{ item.phoneTwo || "-" }}</td>
      <td>{{ item.contactName || "-" }}</td>
      <td>{{ item.isActive ? "Activo" : "Inactivo" }}</td>
      <td class="no-print">
        <div class="d-flex gap-1">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit(item)"
          />
          <iw-button-delete
            (clicked)="delete.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message
      [colspan]="7"
      message="No hay ubicaciones registradas para este cliente"
      icon="material-symbols-light:location-on"
    />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
