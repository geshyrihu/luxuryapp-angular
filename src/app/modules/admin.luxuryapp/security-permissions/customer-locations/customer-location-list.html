@if (platformS.isMobile()) {
  <app-customer-location-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onNew()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-customer-location-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onNew()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  />
}
