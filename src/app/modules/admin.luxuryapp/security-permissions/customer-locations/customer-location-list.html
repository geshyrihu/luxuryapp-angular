@if (platformS.isMobile()) {
  <lux-customer-location-list-mobile-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onNew()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <lux-customer-location-list-desktop-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onNew()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  />
}
