<app-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
>
  <div customFilters>
    <div class="mb-3 d-flex mt-1 mb-1">
      <div class="m-0">
        <iw-button-active-desactive
          fluid
          [state]="state()"
          (stateChange)="sortChange.emit($event)"
        />
      </div>
    </div>
  </div>
  <ng-template #listItemTemplate let-item>
    <ili-list-item lines="full" detail="false">
      <ion-avatar slot="start" class="customer-logo-slot">
        @if (item.photoPath) {
        <img
          [src]="item.photoPath"
          [alt]="item.nameCustomer"
          class="customer-logo-img"
        />
        } @else {
        <app-icon icon="material-symbols-light:domain" class="text-xl" />
        }
      </ion-avatar>

      <ion-label class="ion-text-wrap">
        <p class="fw-semibold m-0 text-body">{{ item.nameCustomer }}</p>
        <p class="text-xs m-0 mt-1 text-body-secondary">
          Estado: {{ getStateLabel(item.state) }}
        </p>
        <p class="text-xs m-0 mt-1 text-body-secondary">
          {{ item.phoneOne }}{{ item.phoneTwo ? ' - ' + item.phoneTwo : '' }}
        </p>
      </ion-label>

      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-mobile
            kind="item"
            iconClass="material-symbols-light:photo-library-outline"
            label="Imígenes"
            (clicked)="updateImages.emit(item.id)"
          />
          <lux-button-mobile
            kind="item"
            iconClass="material-symbols-light:location-on-outline"
            label="Dirección"
            (clicked)="updateAddress.emit(item.id)"
          />
          <lux-button-mobile
            kind="item"
            iconClass="material-symbols-light:location-on"
            label="Ubicaciones"
            (clicked)="manageLocations.emit({ id: item.id, name: item.nameCustomer })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>

<style>
  .customer-logo-slot {
    width: 48px;
    height: 40px;
    margin: 0 10px 0 16px;
    border-radius: var(--ds-radius-sm, 6px);
    overflow: hidden;
    background: var(--ds-bg-sunken, #e8edff);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .customer-logo-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
</style>
