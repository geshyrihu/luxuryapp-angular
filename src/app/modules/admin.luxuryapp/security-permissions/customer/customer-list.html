@if (platformS.isMobile()) {
  <app-customer-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [state]="state"
    [stateOptions]="stateOptions()"
    (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
    (updateImages)="onUpdateImages($event)"
    (updateAddress)="onUpdateAddress($event)"
    (manageLocations)="onManageLocations($event.id, $event.name)"
    (sortChange)="onSortChange($event)"
  />
} @else {
  <app-customer-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [state]="state"
    [stateOptions]="stateOptions()"
    (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
    (updateImages)="onUpdateImages($event)"
    (updateAddress)="onUpdateAddress($event)"
    (manageLocations)="onManageLocations($event.id, $event.name)"
    (sortChange)="onSortChange($event)"
  />
}
