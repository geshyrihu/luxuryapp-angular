<app-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <lux-icon
        slot="start"
        icon="material-symbols-light:devices-other"
        [color]="item.viewMobil ? 'success' : 'medium'"
        style="font-size: 24px; margin-right: 16px"
      />
      <ion-label>
        <h2 class="ion-text-wrap">{{ item.nameModule }}</h2>
        <p class="ion-text-wrap">{{ item.label }}</p>
      </ion-label>

      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
