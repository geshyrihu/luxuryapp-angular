<lux-table
  [globalFilterFields]="globalFilterFields()"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  #dt
  class="card custom-table"
  groupRowsBy="roleTypeOrder"
  initialSortField="roleTypeOrder"
  sortMode="single"
>
  <ng-template #caption>
    <lux-table-caption
      title="Roles de Aplicación"
      (add)="add.emit({ id: '', title: 'Nuevo Rol' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="sortOrder">
        Orden <app-sorticon field="sortOrder" />
      </th>
      <th appSortableColumn="name">
        Nombre Interno <app-sorticon field="name" />
      </th>
      <th appSortableColumn="displayName">
        Nombre para mostrar <app-sorticon field="displayName" />
      </th>
      <th appSortableColumn="code">Código <app-sorticon field="code" /></th>
      <th appSortableColumn="departament">
        Departamento <app-sorticon field="departament" />
      </th>
      <th appSortableColumn="isActive">
        Activo <app-sorticon field="isActive" />
      </th>
      <th>Acciones</th>
    </tr>
  </ng-template>
  <ng-template #groupheader let-item>
    <tr class="p-rowgroup-header">
      <td colspan="7">
        <span class="fw-bold">{{ item.roleType }}</span>
      </td>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.sortOrder }}</td>
      <td>{{ item.name }}</td>
      <td>{{ item.displayName }}</td>
      <td>
        @if (item.code) {
        <span
          [ngStyle]="{
              'background-color': item.colorHex || '#64748b',
              color: '#fff',
            }"
          class="px-2 py-1 rounded fw-semibold"
        >
          {{ item.code }}
        </span>
        }
      </td>
      <td>{{ item.departament }}</td>
      <td class="text-center">
        <custom-input-check-signal
          [ngModel]="item.isActive"
          [readonly]="true"
          [horizontal]="false"
          noMargin
        ></custom-input-check-signal>
      </td>
      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar Rol' })"
          />
          <iw-button-delete (confirmed)="delete.emit(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="7" />
  </ng-template>
</lux-table>
