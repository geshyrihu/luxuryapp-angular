<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-text-signal
    [control]="form.controls.id"
    hidden
    label="Id"
    [readonly]="true"
  />

  <lux-input-select-signal
    [control]="form.controls.roleType"
    label="Tipo de Rol"
    [data]="cb_roleType()"
    [filter]="true"
  />

  <lux-input-select-signal
    [control]="form.controls.departament"
    label="Departamento"
    [data]="cb_departament()"
    [filter]="true"
  />

  <lux-input-text-signal
    [control]="form.controls.name"
    label="Nombre Interno (System Name)"
    placeholder="ej. SuperUsuario"
  />

  <lux-input-text-signal
    [control]="form.controls.displayName"
    label="Nombre para Mostrar"
    placeholder="ej. Súper Usuario"
  />

  <lux-input-number-signal
    [control]="form.controls.sortOrder"
    label="Orden de Visualización"
    placeholder="0"
  />

  <lux-input-check-signal
    [control]="form.controls.isActive"
    label="Rol Activo"
  />

  <div class="text-end mt-3">
    <lux-button-web
      kind="save"
      type="submit"
      severity="info"
      variant="soft"
      displayMode="both"
      [label]="id ? 'Actualizar' : 'Guardar'"
      [disabled]="form.invalid"
      [loading]="submitting()"
    />
  </div>
</form>
