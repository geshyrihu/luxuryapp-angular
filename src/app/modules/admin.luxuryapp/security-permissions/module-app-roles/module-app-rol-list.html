@if (platformS.isMobile()) {
  <lux-module-app-rol-list-mobile-web
    [data]="dataSignal()"
    [groupedData]="groupedData()"
    (select)="onModalForm($event)"
  />
} @else {
  <lux-module-app-rol-list-desktop-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (select)="onModalForm($event)"
  />
}
