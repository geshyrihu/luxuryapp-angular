@if (platformS.isMobile()) {
  <app-module-app-rol-list-mobile
    [data]="dataSignal()"
    [groupedData]="groupedData()"
    (select)="onModalForm($event)"
  />
} @else {
  <app-module-app-rol-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (select)="onModalForm($event)"
  />
}
