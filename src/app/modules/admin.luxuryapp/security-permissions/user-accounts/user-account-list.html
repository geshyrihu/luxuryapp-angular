@if (filteredDataSignal()) {
@if (platform.isMobile()) {
<app-user-account-list-mobile
  [data]="filteredDataSignal()"
  [customers]="selectCustomerSignal()"
  [typePeople]="cbTypePersonSignal()"
  [typePersonControl]="typePersonControl"
  [active]="applicationUserState"
  (add)="onModalForm('', 'Crear Cuenta')"
  (customerChange)="onSelectForCustomer($event)"
  (typePersonChange)="onSelectTypePerson($event)"
  (activeChange)="onSelectActive($event)"
  (employeeSelected)="onCardEmployee($event)"
  (permissions)="onModalEditAccount($event.id, $event.email)"
  (edit)="onModalForm($event, 'Editar')"
  (block)="onToBlockAccount($event)"
  (unlock)="onToUnlockAccount($event)"
  (delete)="DeleteUserId($event)"
  aria-label="Cuentas de usuario"
/>
} @else {
  <div class="card">
    <app-table
      [globalFilterFields]="globalFilterFields()"
      [paginator]="true"
      [rows]="tableRows"
      [rowsPerPageOptions]="rowsPerPageOptions"
      [scrollable]="true"
      [scrollHeight]="scrollHeight()"
      [showCurrentPageReport]="true"
      [value]="filteredDataSignal()"
      #dt
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
      class="custom-table d-none d-md-block"
    >
      <ng-template #caption>
        <div
          class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between p-2 gap-3 g-4"
        >
          <!-- Parte Izquierda: Título y bósqueda -->
          <div class="flex-grow-1">
            <app-table-caption
              (add)="onModalForm('', 'Crear Cuenta')"
              [dt]="dt"
              [noPadding]="true"
              [noMargin]="true"
            />
          </div>

          <!-- Parte Derecha: Filtros adicionales -->
          <div class="d-flex flex-column flex-sm-row align-items-center gap-2 g-4">
            <div>
              <custom-input-select-signal
                [data]="selectCustomerSignal()"
                optionLabel="label"
                optionValue="value"
                placeholder="Seleccionar Cliente"
                (selectionChange)="onSelectForCustomer($event.value)"
                [horizontal]="false"
                [noMargin]="true"
                [filter]="true"
              />
            </div>
            <div>
              <custom-input-select-signal
                [data]="cbTypePersonSignal()"
                optionLabel="label"
                optionValue="value"
                placeholder="Tipo de Persona"
                [control]="typePersonControl"
                (selectionChange)="onSelectTypePerson($event.value)"
                [horizontal]="false"
                [noMargin]="true"
                [filter]="true"
              />
            </div>
            <div>
              <il-button-active-desactive
                [state]="applicationUserState"
                (stateChange)="onSelectActive($event)"
              />
            </div>
          </div>
        </div>
      </ng-template>
      <ng-template #header>
        <tr>
          <th class="table-col-30" appSortableColumn="fullName">
            NOMBRE
            <app-sorticon field="fullName" />
          </th>
          <th class="table-col-25" appSortableColumn="customer">
            CLIENTE
            <app-sorticon field="customer" />
          </th>
          <th class="table-col-25" appSortableColumn="userName">
            USUARIO / PUESTO DE TRABAJO
            <app-sorticon field="userName" />
          </th>
          <th class="table-col-25" appSortableColumn="email">
            CORREO
            <app-sorticon field="email" />
          </th>
          <th class="table-col-15">Télefono</th>
          <th class="table-col-5"></th>
        </tr>
      </ng-template>
      <ng-template #body let-item>
        <tr>
          <td>
            <lx-avatar
              [image]="item.photoPath
                    ? item.photoPath
                    : 'assets/images/default-avatar.png'"
              class="me-2"
              size="large"
              (click)="onCardEmployee(item.id)"
            />

            {{ item.fullName }}
          </td>
          <td>{{ item.customer }}</td>
          <td>
            <div class="d-flex flex-column">
              <span class="fw-bold text-sm"> {{ item.userName }} </span>
              <span class="text-xs text-body-secondary text-text-uppercase"> {{ item.role }} </span>
            </div>
          </td>
          <td>{{ item.email }}</td>
          <td>{{ item.phoneNumber }}</td>

          <td class="no-print">
            <div class="d-flex">
              @if (item.active) {
              <iw-button-item
                (clicked)="onToBlockAccount(item.id)"
                iconClass="material-symbols-light:lock"
                lxTooltip="Bloquear"
                tooltipPosition="top"
              />
              } @if (!item.active) {
              <iw-button-item
                (clicked)="onToUnlockAccount(item.id)"
                iconClass="material-symbols-light:lock-open"
                lxTooltip="Desbloquear"
                tooltipPosition="top"
              />
              }
              <iw-button-item
                (clicked)="onModalEditAccount(item.id, item.email)"
                iconClass="material-symbols-light:person"
                lxTooltip="Permisos"
                tooltipPosition="top"
              />
              <iw-button-edit (clicked)="onModalForm(item.id, 'Editar')" />
              <iw-button-delete (confirmed)="DeleteUserId(item.id)" />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <app-table-empty-message [colspan]="6" />
      </ng-template>
      <ng-template #paginatorleft>
        <app-table-footer [data]="dataSignal()" />
      </ng-template>
    </app-table>
  </div>
}
}
