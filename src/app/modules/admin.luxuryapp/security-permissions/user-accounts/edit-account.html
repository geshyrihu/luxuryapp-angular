@if (applicationUserId) {
<div class="row p-1 g-4">
  <div class="col-12">
    <lux-update-password-account-web [applicationUserId]="applicationUserId" />
  </div>

  @if (this.aspRoleS.hasRole(AspRole.SuperUsuario)) {
  <div class="col-12 col-lg-6">
    <lux-update-role-web
      [applicationUserId]="applicationUserId"
      [roleType]="null"
    />
  </div>

  <div class="col-12 col-lg-6">
    <lux-access-customer-web [applicationUserId]="applicationUserId" />
  </div>
  }
</div>
}
