@if (platformS.isMobile()) {
  <app-customer-modul-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [state]="state"
    (selectActive)="onSelectActive($event)"
    (select)="onModalForm($event)"
  />
} @else {
  <app-customer-modul-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [state]="state"
    (selectActive)="onSelectActive($event)"
    (select)="onModalForm($event)"
  />
}
