@if (platformS.isMobile()) {
  <lux-customer-modul-list-mobile-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [state]="state"
    (selectActive)="onSelectActive($event)"
    (select)="onModalForm($event)"
  />
} @else {
  <lux-customer-modul-list-desktop-web
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [state]="state"
    (selectActive)="onSelectActive($event)"
    (select)="onModalForm($event)"
  />
}
