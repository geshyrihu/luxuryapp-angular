<div class="p-3">
  <lux-table
    [value]="data()"
    class="custom-table"
    [paginator]="true"
    [rows]="tableRows"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    [globalFilterFields]="globalFilterFields()"
    [scrollable]="true"
    [scrollHeight]="scrollHeight()"
    #dt
  >
    <ng-template #caption>
      <div
        class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between p-2 gap-3 g-4"
      >
        <!-- Parte Izquierda: Título y bósqueda -->
        <div class="flex-grow-1">
          <lux-table-caption
            [showAdd]="false"
            [dt]="dt"
            [noPadding]="true"
            [noMargin]="true"
          />
        </div>

        <!-- Parte Derecha: Filtros adicionales -->
        <div
          class="d-flex flex-column flex-sm-row align-items-center gap-2 g-4"
        >
          <div>
            <iw-button-active-desactive
              [state]="state()"
              (stateChange)="selectActive.emit($event)"
            />
          </div>
        </div>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th class="table-col-40">Cliente</th>
        <th class="table-col-20">Número Cliente</th>
        <th class="table-col-20">Registrado</th>
        <th class="table-col-15">Estado</th>
        <th class="table-col-5"></th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      <tr
        class="cursor-pointer"
        (click)="select.emit({ customerId: item.customerId, nameCustomer: item.nameCustomer })"
      >
        <td>
          <div class="d-flex align-items-center">
            <lux-avatar
              [image]="item.photoPath"
              [alt]="item.nameCustomer"
              size="normal"
              shape="circle"
              class="me-2"
            />
            <span class="m-0 fw-medium">{{ item.nameCustomer }}</span>
          </div>
        </td>
        <td class="text-xs">{{ item.numeroCliente }}</td>
        <td class="text-xs">{{ item.register }}</td>
        <td>
          @if (item.isAssigned) {
          <lux-tag severity="success" value="Activo"></lux-tag>
          } @else {
          <lux-tag severity="danger" value="Inactivo"></lux-tag>
          }
        </td>
        <td class="text-end">
          <app-icon [icon]="'material-symbols-light:chevron-right'" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <lux-table-empty-message [colspan]="5" />
    </ng-template>
    <ng-template #paginatorleft>
      <lux-table-footer [data]="data()" />
    </ng-template>
  </lux-table>
</div>
