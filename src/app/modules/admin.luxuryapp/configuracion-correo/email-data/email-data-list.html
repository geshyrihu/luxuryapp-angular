<!-- 💻 INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<app-table
  #dt
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  class="custom-table card d-none d-md-block"
>
  <ng-template #caption>
    <app-table-caption [showAdd]="false" [dt]="dt" />
  </ng-template>

  <ng-template #header>
    <tr>
      <th appSortableColumn="applicationUser">
        Usuario
        <app-sorticon field="applicationUser" />
      </th>
      <th appSortableColumn="email">
        Email
        <app-sorticon field="email" />
      </th>
      <th appSortableColumn="smtp">
        Smtp
        <app-sorticon field="smtp" />
      </th>
      <th appSortableColumn="port">
        Port
        <app-sorticon field="port" />
      </th>

      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.applicationUser }}</td>
      <td>{{ item.email }}</td>
      <td>{{ item.smtp }}</td>
      <td>{{ item.port }}</td>

      <!-- Opciones -->

      <td class="no-print">
        <div class="d-flex">
          <iw-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <iw-button-send-email (confirmed)="onSendTestEmail(item.id)" />
        </div>
      </td>

      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <app-table-empty-message [colspan]="5" />
  </ng-template>
  <ng-template #paginatorleft>
    <app-table-footer [data]="dataSignal()" />
  </ng-template>
</app-table>

<!--📲INICIO: Componente adaptado para versión mívil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        class="w-3rem h-3rem bg-primary-50"
      >
        <app-icon icon="material-symbols-light:mail-outline" class="text-xl text-primary" />
      </div>
      <p class="mt-0 mb-0">{{ item.email }}</p>
      <p class="text-body-secondary font-size-12 mt-0 mb-0">
        {{ item.applicationUser }}
      </p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          <ili-button-send-email
            (confirmed)="onSendTestEmail(item.id)"
            label="Enviar"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
