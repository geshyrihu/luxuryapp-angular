@if (platformS.isMobile()) {
<lux-asamblea-checklist-template-list-mobile-web
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
} @else {
<lux-asamblea-checklist-template-list-desktop-web
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
}
