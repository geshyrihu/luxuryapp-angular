<lux-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo item de checklist' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <lux-icon
        slot="start"
        icon="material-symbols-light:fact-check"
        class="text-xl text-primary"
      />

      <ion-label>
        <p class="fw-semibold m-0 text-body">{{ item.title }}</p>
        <p class="text-xs m-0 mt-1 text-body-secondary">
          {{ item.code }} | {{ item.category }} | {{ item.defaultResponsibleRole
          }}
        </p>
        <p class="text-xs m-0 mt-1 text-body-secondary">
          Orden {{ item.sortOrder }} | Día {{ item.offsetDaysFromMeeting }} |
          V{{ item.version }}
        </p>
        <p class="text-xs m-0 mt-1">
          <span [class]="item.isActive ? 'text-green-600' : 'text-red-500'">
            {{ item.isActive ? "Activo" : "Inactivo" }}
          </span>
        </p>
      </ion-label>

      <lux-action-menu-mobile slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar item de checklist' })"
          />
          @if (item.isActive) {
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
          }
        </ng-container>
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
