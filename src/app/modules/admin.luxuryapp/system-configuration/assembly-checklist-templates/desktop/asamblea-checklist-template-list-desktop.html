<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [tableStyle]="{ 'min-width': '80rem' }"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo item de checklist' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th appSortableColumn="sortOrder">
        Orden <app-sorticon field="sortOrder" />
      </th>
      <th appSortableColumn="code">Codigo <app-sorticon field="code" /></th>
      <th appSortableColumn="title">Titulo <app-sorticon field="title" /></th>
      <th appSortableColumn="category">
        Categoria <app-sorticon field="category" />
      </th>
      <th appSortableColumn="defaultResponsibleRole">
        Responsable
        <app-sorticon field="defaultResponsibleRole" />
      </th>
      <th appSortableColumn="offsetDaysFromMeeting">
        Dias
        <app-sorticon field="offsetDaysFromMeeting" />
      </th>
      <th appSortableColumn="version">
        Version <app-sorticon field="version" />
      </th>
      <th>Estado</th>
      <th class="no-print"></th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td>{{ item.sortOrder }}</td>
      <td>{{ item.code }}</td>
      <td>
        <div class="fw-semibold">{{ item.title }}</div>
        @if (item.description) {
        <div class="text-xs text-body-secondary">{{ item.description }}</div>
        }
      </td>
      <td>{{ item.category }}</td>
      <td>{{ item.defaultResponsibleRole }}</td>
      <td>{{ item.offsetDaysFromMeeting }}</td>
      <td>{{ item.version }}</td>
      <td>
        <lux-tag
          [severity]="severity(item.isActive)"
          [value]="item.isActive ? 'Activo' : 'Inactivo'"
        />
      </td>
      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar item de checklist' })"
          />
          @if (item.isActive) {
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            ariaLabel="Eliminar"
            (clicked)="delete.emit(item.id)"
          />
          }
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="9" />
  </ng-template>

  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
