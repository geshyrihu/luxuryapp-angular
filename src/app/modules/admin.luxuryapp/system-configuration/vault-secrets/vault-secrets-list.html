@if (isSuperUsuario()) {
  @if (platformS.isMobile()) {
  <app-vault-secrets-list-mobile
    [data]="dataSignal()"
    [loading]="loading()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalAddForm()"
    (edit)="onModalEditForm($event)"
    (rotate)="onRotate($event)"
    (revoke)="onRevoke($event)"
  />
  } @else {
  <app-vault-secrets-list-desktop
    [data]="dataSignal()"
    [loading]="loading()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalAddForm()"
    (edit)="onModalEditForm($event)"
    (rotate)="onRotate($event)"
    (revoke)="onRevoke($event)"
  />
  }
} @else {
<div class="p-4 text-center text-body-secondary">
  No tienes permisos para acceder a esta seccion.
</div>
}
