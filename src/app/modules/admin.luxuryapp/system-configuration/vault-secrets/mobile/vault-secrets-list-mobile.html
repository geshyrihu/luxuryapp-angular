<app-data-view-mobile
  [data]="data()"
  (add)="add.emit()"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <app-icon
        slot="start"
        icon="material-symbols-light:lock-outline"
        class="text-xl text-yellow-500"
      />

      <ion-label>
        <p class="mt-0 mb-0 fw-semibold">{{ item.secretName }}</p>
        <p class="text-body-secondary font-size-12 mt-0 mb-0">
          {{ item.secretType }} @if (item.isRevoked) { &nbsp;&bull;&nbsp;<span
            class="text-red-500"
            >Revocado</span
          >
          }
        </p>
      </ion-label>

      <ili-action-menu slot="end">
        <ng-container actions>
          @if (!item.isRevoked) {
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit(item)"
          />
          <il-button
            label="Rotar clave"
            iconClass="material-symbols-light:lock-reset"
            severity="warning"
            (clicked)="rotate.emit(item.secretName)"
          />
          <ili-button-delete
            (confirmed)="revoke.emit(item.secretName)"
            label="Eliminar"
          />
          }
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
