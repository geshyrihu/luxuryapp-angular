<div class="hangfire-shell">
  <div class="hangfire-toolbar">
    <lux-button-web
      displayMode="both"
      iconClass="material-symbols-light:open-in-new"
      label="Abrir panel"
      size="small"
      variant="outline"
      (clicked)="openDashboard()"
    />
  </div>

  <iframe
    class="hangfire-frame"
    title="Panel Hangfire"
    [src]="safeHangfireDashboardUrl"
  ></iframe>
</div>
