<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="card custom-table"
  size="small"
  [scrollable]="true"
  scrollHeight="750px"
  [loading]="loading()"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: 0, title: 'Nuevo Conocimiento' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="topic">Tema <lux-sorticon-web field="topic" /></th>
      <th appSortableColumn="moduleAppName">
        Acceso <lux-sorticon-web field="moduleAppName" />
      </th>
      <th appSortableColumn="keywords">
        Palabras Clave <lux-sorticon-web field="keywords" />
      </th>
      <th appSortableColumn="route">Ruta <lux-sorticon-web field="route" /></th>
      <th appSortableColumn="isActive">
        Activo <lux-sorticon-web field="isActive" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.topic }}</td>
      <td>
        <lux-tag-web
          [value]="item.moduleAppName || 'General'"
          [severity]="item.moduleAppId ? 'warn' : 'success'"
        />
      </td>
      <td><lux-tag-web [value]="item.keywords" severity="info" /></td>
      <td><code>{{ item.route }}</code></td>
      <td>
        <lux-icon
          [icon]="item.isActive ? 'material-symbols-light:cancel' : 'material-symbols-light:cancel'"
          [class]="item.isActive ? 'text-green-500' : 'text-red-500'"
        />
      </td>

      <!-- Opciones -->
      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar Conocimiento' })"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            ariaLabel="Eliminar"
            (clicked)="delete.emit(item.id!)"
          />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
