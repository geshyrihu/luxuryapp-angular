<lux-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: 0, title: 'Nuevo Conocimiento' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <lux-icon
        slot="start"
        icon="material-symbols-light:psychology"
        class="text-xl text-primary"
      />
      <ion-label>
        <h2 class="fw-bold">{{ item.topic }}</h2>
        <p class="text-sm">
          <span class="fw-bold text-primary"
            >{{ item.moduleAppName || 'General' }}</span
          >
        </p>
        <p class="text-sm text-wrap text-body-secondary">{{ item.keywords }}</p>
      </ion-label>
      <lux-action-menu-mobile slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id!)"
          />
        </ng-container>
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
