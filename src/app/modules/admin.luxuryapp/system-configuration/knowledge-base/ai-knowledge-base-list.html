@if (platformS.isMobile()) {
<lux-ai-knowledge-base-list-mobile-web
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [loading]="loading()"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
} @else {
<lux-ai-knowledge-base-list-desktop-web
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [loading]="loading()"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
}
