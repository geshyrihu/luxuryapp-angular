@if (platformS.isMobile()) {
<app-ai-knowledge-base-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [loading]="loading()"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
} @else {
<app-ai-knowledge-base-list-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [loading]="loading()"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
}
