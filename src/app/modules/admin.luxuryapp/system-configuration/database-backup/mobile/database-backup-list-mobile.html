<app-data-view-mobile
  [data]="data()"
  (add)="add.emit()"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
       <app-icon slot="start" icon="material-symbols-light:database-outline" class="text-xl text-blue-500" />

       <ion-label>
         <p class="mt-0 mb-0 fw-semibold">{{ item.name }}</p>
         <p class="text-body-secondary font-size-12 mt-0 mb-0">
           {{ destinationLabel(item.destinationType) }} &bull; {{
           item.cronExpression }} @if (item.lastRunStatus) {
           &nbsp;&bull;&nbsp;<span>{{ item.lastRunStatus }}</span>
           }
         </p>
       </ion-label>

      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit (clicked)="edit.emit(item)" label="Editar" />
          <il-button
            label="Ejecutar ahora"
            iconClass="material-symbols-light:play-arrow"
            severity="success"
            (clicked)="execute.emit(item.id)"
          />
          <ili-button-delete
            (confirmed)="delete.emit(item.id)"
            label="Eliminar"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
