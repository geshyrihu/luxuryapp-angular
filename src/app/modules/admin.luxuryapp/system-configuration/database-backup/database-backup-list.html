@if (isSuperUsuario()) {
  @if (platformS.isMobile()) {
  <app-database-backup-list-mobile
    [data]="dataSignal()"
    [loading]="loading()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalAddForm()"
    (edit)="onModalEditForm($event)"
    (execute)="onExecuteBackup($event)"
    (delete)="onDeleteConfig($event)"
    (testConnection)="onTestConnection($event)"
  />
  } @else {
  <app-database-backup-list-desktop
    [data]="dataSignal()"
    [loading]="loading()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalAddForm()"
    (edit)="onModalEditForm($event)"
    (execute)="onExecuteBackup($event)"
    (delete)="onDeleteConfig($event)"
    (testConnection)="onTestConnection($event)"
  />
  }
} @else {
<div class="p-4 text-center text-body-secondary">
  No tienes permisos para acceder a esta seccion.
</div>
}
