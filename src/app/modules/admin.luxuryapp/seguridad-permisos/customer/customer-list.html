<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card hidden md:block"
>
  <ng-template #caption>
    <div
      class="flex flex-column md:flex-row md:align-items-center justify-content-end p-2 gap-2"
    >
      <primeng-custom-caption
        (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
        [dt]="dt"
        [noPadding]="true"
        [noMargin]="true"
      />
      <div class="flex-shrink-0">
        <iw-button-active-desactive
          [state]="state"
          (stateChange)="onSortChange($event)"
        />
      </div>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th>ID</th>
      <th>NO CLIENTE</th>
      <th colspan="2" pSortableColumn="nameCustomer">
        NOMBRE
        <p-sorticon field="nameCustomer" />
      </th>
      <th>TélefonoS</th>
      <th class="table-col-10"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item let-rowIndex="rowIndex">
    <tr>
      <td>{{ item.id }}</td>
      <td class="text-center">{{ item.numeroCliente }}</td>
      <td class="text-center">
        <lx-avatar
          [image]="item.photoPath"
          alt=""
          shape="square"
          class="b-r-8 img-40"
        />
      </td>
      <td>{{ item.nameCustomer }}</td>
      <td>
        {{ item.phoneOne }}
        <br />
        {{ item.phoneTwo }}
      </td>

      <td class="no-print">
        <div class="flex">
          <iw-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <iw-button-item
            lxTooltip="Imagenes"
            tooltipPosition="top"
            iconClass="material-symbols-light:photo"
            (clicked)="onUpdateImages(item.id)"
          />
          <iw-button-item
            lxTooltip="Dirección"
            tooltipPosition="top"
            iconClass="material-symbols-light:location-on"
            (clicked)="onUpdateAddress(item.id)"
          />
          <iw-button-item
            lxTooltip="Ubicaciones"
            tooltipPosition="top"
            iconClass="material-symbols-light:location-on"
            (clicked)="onManageLocations(item.id, item.nameCustomer)"
          />
          <iw-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="5" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!--📲INICIO: Componente adaptado para versión mívil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <div customFilters>
    <div class="mb-3 flex mt-1 mb-1">
      <div class="m-0">
        <iw-button-active-desactive
          fluid
          [state]="state"
          (stateChange)="onSortChange($event)"
        />
      </div>
    </div>
  </div>
  <ng-template #listItemTemplate let-item>
    <ili-list-item lines="full" detail="false">
      <!-- Logo / avatar del cliente -->
      <div slot="start" class="customer-logo-slot">
        @if (item.photoPath) {
        <img
          [src]="item.photoPath"
          [alt]="item.nameCustomer"
          class="customer-logo-img"
        />
        } @else {
        <app-icon icon="material-symbols-light:domain" class="text-xl" />
        }
      </div>

      <div class="ion-text-wrap">
        <p class="font-semibold m-0 text-color">{{ item.nameCustomer }}</p>
        <p class="text-xs m-0 mt-1 text-color-secondary">
          {{ item.phoneOne }}{{ item.phoneTwo ? ' é ' + item.phoneTwo : '' }}
        </p>
      </div>

      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          <ili-button-item
            iconClass="material-symbols-light:photo-library-outline"
            label="Imígenes"
            (clicked)="onUpdateImages(item.id)"
          />
          <ili-button-item
            iconClass="material-symbols-light:location-on-outline"
            label="Dirección"
            (clicked)="onUpdateAddress(item.id)"
          />
          <ili-button-item
            iconClass="material-symbols-light:location-on"
            label="Ubicaciones"
            (clicked)="onManageLocations(item.id, item.nameCustomer)"
          />
          <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>

<style>
  .customer-logo-slot {
    width: 48px;
    height: 40px;
    margin: 0 10px 0 16px;
    border-radius: var(--ds-radius-sm, 6px);
    overflow: hidden;
    background: var(--ds-bg-sunken, #e8edff);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .customer-logo-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
</style>
