<div class="grid">
  @for (permission of data; track permission) {
  <div class="col-12 lg:col-3">
    <div class="card mb-3">
      <div class="card-body">
        <ul class="list-group">
          <li class="list-group-item active text-center">
            {{ permission.moduleName }}
          </li>
          <li
            class="list-group-item pointer"
            (click)="
              onCheckboxChange(permission, 'canRead', !permission.canRead)
            "
          >
            <div class="flex align-items-center justify-content-center">
              <lx-checkbox
                [(checked)]="permission.canRead"
                (checkedChange)="onCheckboxChange(permission, 'canRead', $event)"
                label="Leer"
              />
            </div>
          </li>
          <li
            class="list-group-item pointer"
            (click)="
              onCheckboxChange(permission, 'canCreate', !permission.canCreate)
            "
          >
            <div class="flex align-items-center justify-content-center">
              <lx-checkbox
                [(checked)]="permission.canCreate"
                (checkedChange)="onCheckboxChange(permission, 'canCreate', $event)"
                label="Crear"
              />
            </div>
          </li>
          <li
            class="list-group-item pointer"
            (click)="
              onCheckboxChange(permission, 'canUpdate', !permission.canUpdate)
            "
          >
            <div class="flex align-items-center justify-content-center">
              <lx-checkbox
                [(checked)]="permission.canUpdate"
                (checkedChange)="onCheckboxChange(permission, 'canUpdate', $event)"
                label="Actualizar"
              />
            </div>
          </li>
          <li
            class="list-group-item pointer"
            (click)="
              onCheckboxChange(permission, 'canDelete', !permission.canDelete)
            "
          >
            <div class="flex align-items-center justify-content-center">
              <lx-checkbox
                [(checked)]="permission.canDelete"
                (checkedChange)="onCheckboxChange(permission, 'canDelete', $event)"
                label="Eliminar"
              />
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
  }
</div>
