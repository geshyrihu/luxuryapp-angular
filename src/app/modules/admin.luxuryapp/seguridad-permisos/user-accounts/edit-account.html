@if (applicationUserId) {
<div class="row p-1">
  <div class="col-12">
    <app-update-password-account [applicationUserId]="applicationUserId" />
  </div>

  @if (this.aspRoleS.hasRole(AspRole.SuperUsuario)) {
  <div class="col-12 col-lg-6">
    <app-update-role
      [applicationUserId]="applicationUserId"
      [roleType]="null"
    />
  </div>

  <div class="col-12 col-lg-6">
    <app-access-customer [applicationUserId]="applicationUserId" />
  </div>
  }
</div>
}
