@if (dataSignal()) {
<!-- 🖥️ INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->

<p-table
  #dt1
  [value]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  class="custom-table card hidden md:block"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  sortField="roleType"
  rowGroupMode="subheader"
  groupRowsBy="roleType"
  [sortOrder]="1"
>
  <ng-template #caption>
    <primeng-custom-caption [dt]="dt1" />
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-70">Rol</th>
      <th class="table-col-20 text-center" pSortableColumn="modules">
        Módulos Asignados
        <p-sorticon field="modules" />
      </th>
      <th class="table-col-10"></th>
    </tr>
  </ng-template>
  <ng-template #groupheader let-item>
    <tr pRowGroupHeader>
      <td colspan="3" class="bg-blue-50">
        <div class="flex align-items-center py-2 px-3">
          <app-icon [icon]="'material-symbols-light:bookmark'" class="mr-2 text-blue-500" />
          <span class="font-bold text-blue-900">{{ item.roleType }}</span>
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr
      class="cursor-pointer"
      (click)="onModalForm({ roleId: item.roleId, roleName: item.roleName, title: 'Asignar Módulos' })"
    >
      <td>
        <h5 class="m-0 text-lg font-medium">{{ item.roleName }}</h5>
      </td>
      <td class="text-center">
        <lx-tag [value]="item.modules + ' Módulos'" severity="info"></lx-tag>
      </td>
      <td class="text-right">
        <app-icon [icon]="'material-symbols-light:chevron-right'" />
      </td>
    </tr>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- 📱 INICIO: Vista para móviles -->
<app-data-view-mobile
  [data]="dataSignal()"
  [showAdd]="false"
  [isGrouped]="true"
  [groupedData]="groupedData()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 rounded-lg"
        class="w-3rem h-3rem bg-primary-50"
      >
        <app-icon icon="material-symbols-light:view-module" class="text-xl text-primary" />
      </div>
      <h2
        class="font-normal m-0"
        (click)="onModalForm({ roleId: item.roleId, roleName: item.roleName, title: 'Asignar Módulos' })"
      >
        {{ item.roleName }}
      </h2>
      <span end class="text-sm mr-2">{{ item.modules }} Módulos</span>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
}
