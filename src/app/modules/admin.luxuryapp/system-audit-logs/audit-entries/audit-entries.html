@if (platformS.isMobile()) {
<lux-audit-entries-mobile-web
  [data]="data()"
  [loading]="loading()"
  [totalRecords]="totalRecords()"
  [globalFilterFields]="globalFilterFields()"
  (search)="onSearch($event)"
  (loadMore)="loadMore()"
  (toggleExpand)="toggleExpand($event)"
/>
} @else {
<lux-audit-entries-desktop-web
  [data]="data()"
  [loading]="loading()"
  [totalRecords]="totalRecords()"
  [rows]="rows()"
  [globalFilterFields]="globalFilterFields()"
  [operationOptions]="operationOptions"
  [entityOptions]="entityOptions"
  [filterOperationControl]="filterOperationControl"
  [filterEntityControl]="filterEntityControl"
  [filterDateRangeControl]="filterDateRangeControl"
  (pageChange)="onPageChange($event)"
  (search)="onSearch($event)"
  (loadData)="onLoadData(true)"
  (toggleExpand)="toggleExpand($event)"
/>
}
