<lux-card>
  <div class="mt-3">
    <lux-data-view-mobile
      [data]="data()"
      [globalFilterFields]="globalFilterFields()"
      (search)="search.emit($event)"
      [showAdd]="false"
    >
      <ng-template #listItemTemplate let-item>
        <ili-list-item>
          <ion-avatar slot="start" class="mobile-avatar-slot">
            <span>{{ item.userName.charAt(0).toUpperCase() }}</span>
          </ion-avatar>
          <ion-label>
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h2 class="fw-bold m-0 text-base">{{ item.userName }}</h2>
              <lux-tag [value]="item.userType"></lux-tag>
            </div>

            <p class="text-medium text-body-secondary m-0 text-sm mb-1">
              <lux-icon
                [icon]="'material-symbols-light:schedule'"
                class="me-1 text-xs"
              />
              {{ item.timestamp | apiDate: "dd/MM/yyyy h:mm a" }}
            </p>

            <div class="d-flex align-items-center gap-2 mb-1">
              <span class="fw-bold text-sm">{{ item.module }}</span>
              <lux-tag
                [value]="item.activityType"
                severity="info"
                class="text-xs"
              ></lux-tag>
            </div>

            <p class="text-sm text-body-secondary m-0 text-wrap">
              {{ item.details }}
            </p>
          </ion-label>
        </ili-list-item>
      </ng-template>
    </lux-data-view-mobile>

    @if (data().length < totalRecords()) {
    <lux-button-web
      label="Cargar más"
      severity="secondary"
      [fluid]="true"
      [loading]="loading()"
      customClass="mt-3"
      (clicked)="loadMore.emit()"
    />
    }
  </div>
</lux-card>
