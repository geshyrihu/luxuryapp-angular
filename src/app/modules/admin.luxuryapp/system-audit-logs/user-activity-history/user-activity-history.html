@if (platformS.isMobile()) {
<app-user-activity-history-mobile
  [data]="data()"
  [loading]="loading()"
  [totalRecords]="totalRecords()"
  [globalFilterFields]="globalFilterFields()"
  (search)="onSearch($event)"
  (loadMore)="loadMore()"
/>
} @else {
<app-user-activity-history-desktop
  [data]="data()"
  [loading]="loading()"
  [totalRecords]="totalRecords()"
  [rows]="rows()"
  [globalFilterFields]="globalFilterFields()"
  [customerOptions]="customerOptions"
  [userTypeOptions]="userTypeOptions"
  [filterCustomerIdControl]="filterCustomerIdControl"
  [filterUserTypeControl]="filterUserTypeControl"
  [filterDateRangeControl]="filterDateRangeControl"
  [isSearchDisabled]="isSearchDisabled"
  (pageChange)="onPageChange($event)"
  (search)="onSearch($event)"
  (loadData)="onLoadData(true)"
/>
}
