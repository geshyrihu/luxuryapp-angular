<lux-card>
  <div class="mt-3">
    <lux-table
      #dt
      [value]="data()"
      [loading]="loading()"
      [lazy]="true"
      (onPage)="pageChange.emit($event)"
      [totalRecords]="totalRecords()"
      [paginator]="true"
      [rows]="rows()"
      [rowsPerPageOptions]="rowsPerPageOptions"
      [globalFilterFields]="globalFilterFields()"
      class="custom-table"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
      [showCurrentPageReport]="true"
    >
      <ng-template #caption>
        <div
          class="d-flex flex-column flex-md-row align-items-md-center justify-content-between p-2 gap-2 bg-body-tertiary rounded g-4"
        >
          <div class="flex-grow-1">
            <lux-table-caption
              [dt]="dt"
              (search)="search.emit($event)"
              [showAdd]="false"
              [noPadding]="true"
              [noMargin]="true"
            />
          </div>
          <div
            class="d-flex flex-column flex-sm-row align-items-center gap-2 g-4"
          >
            <div>
              <custom-input-select-signal
                [data]="customerOptions()"
                optionLabel="label"
                optionValue="value"
                placeholder="Cliente"
                [control]="filterCustomerIdControl()"
                customClass="w-100"
                [horizontal]="false"
                [filter]="true"
                [noMargin]="true"
              />
            </div>
            <div>
              <custom-input-select-signal
                [data]="userTypeOptions()"
                optionLabel="label"
                optionValue="value"
                placeholder="Tipo de usuario"
                [control]="filterUserTypeControl()"
                customClass="w-100"
                [horizontal]="false"
                [filter]="true"
                [noMargin]="true"
              />
            </div>
            <div>
              <custom-input-date-signal
                [control]="filterDateRangeControl()"
                mode="range"
                dateFormat="Y-m-d"
                altFormat="d/m/Y"
                placeholder="Rango de fecha"
                [horizontal]="false"
                [noMargin]="true"
              />
            </div>
            <div class="d-flex flex-shrink-0">
              <span
                [tooltip]="isSearchDisabled() ? 'Complete todos los filtros para buscar' : ''"
              >
                <il-button
                  label="Buscar"
                  iconClass="material-symbols-light:search"
                  (clicked)="loadData.emit()"
                  [disabled]="isSearchDisabled()"
                />
              </span>
            </div>
          </div>
        </div>
      </ng-template>
      <ng-template #header>
        <tr>
          <th appSortableColumn="timestamp">
            Fecha y Hora
            <app-sorticon field="timestamp" />
          </th>
          <th appSortableColumn="userName">
            Usuario
            <app-sorticon field="userName" />
          </th>
          <th appSortableColumn="userType">
            Tipo
            <app-sorticon field="userType" />
          </th>
          <th appSortableColumn="activityType">
            Actividad
            <app-sorticon field="activityType" />
          </th>
          <th appSortableColumn="module">
            Módulo
            <app-sorticon field="module" />
          </th>
          <th>Detalles</th>
          <th appSortableColumn="ipAddress">
            IP / Ubicación
            <app-sorticon field="ipAddress" />
          </th>
        </tr>
      </ng-template>
      <ng-template #body let-item>
        <tr>
          <td>{{ item.timestamp | apiDate: 'dd/MM/yyyy h:mm:ss a' }}</td>
          <td>{{ item.userName }}</td>
          <td>
            <lux-tag [value]="item.userType"></lux-tag>
          </td>
          <td>
            <lux-tag [value]="item.activityType" severity="info"></lux-tag>
          </td>
          <td>{{ item.module }}</td>
          <td>{{ item.details }}</td>
          <td>
            <div>{{ item.ipAddress }}</div>
            <span class="text-body-secondary">{{ item.location }}</span>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="7" class="text-center">
            No se encontraron registros con los filtros aplicados.
          </td>
        </tr>
      </ng-template>
    </lux-table>
  </div>
</lux-card>
