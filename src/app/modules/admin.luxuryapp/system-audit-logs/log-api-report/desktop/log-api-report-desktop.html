<lux-card>
  <div class="mt-3">
    <lux-table
      #dt
      [value]="data()"
      [loading]="loading()"
      [lazy]="true"
      (onPage)="pageChange.emit($event)"
      [totalRecords]="totalRecords()"
      [paginator]="true"
      [rows]="rows()"
      [rowsPerPageOptions]="rowsPerPageOptions"
      [globalFilterFields]="globalFilterFields()"
      class="custom-table"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
      [showCurrentPageReport]="true"
    >
      <ng-template #caption>
        <div
          class="d-flex flex-column flex-md-row align-items-md-center justify-content-between p-2 gap-2 bg-body-tertiary rounded g-4"
        >
          <div class="flex-grow-1">
            <lux-table-caption
              [dt]="dt"
              (search)="search.emit($event)"
              [showAdd]="false"
              [noPadding]="true"
              [noMargin]="true"
            />
          </div>
          <div
            class="d-flex flex-column flex-sm-row align-items-center gap-2 g-4"
          >
            <div>
              <lux-input-select-signal
                [data]="levelOptions()"
                optionLabel="label"
                optionValue="value"
                placeholder="Nivel"
                [control]="filterLevelControl()"
                customClass="w-100"
                [horizontal]="false"
                [filter]="true"
                [noMargin]="true"
              />
            </div>
            <div>
              <lux-input-date-signal
                [control]="filterDateRangeControl()"
                mode="range"
                dateFormat="Y-m-d"
                altFormat="d/m/Y"
                placeholder="Rango de fecha"
                [horizontal]="false"
                [noMargin]="true"
              />
            </div>
            <div class="d-flex flex-shrink-0 gap-2">
              <lux-button-web
                label="Buscar"
                iconClass="material-symbols-light:search"
                (clicked)="loadData.emit()"
                [disabled]="isSearchDisabled()"
              />
              <lux-button-web
                displayMode="icon"
                iconClass="material-symbols-light:refresh"
                variant="outline"
                size="small"
                (clicked)="loadData.emit()"
              />
              <lux-button-web
                displayMode="icon"
                iconClass="material-symbols-light:delete-outline"
                variant="outline"
                size="small"
                (clicked)="deleteAll.emit()"
              />
            </div>
          </div>
        </div>
      </ng-template>
      <ng-template #header>
        <tr>
          <th></th>
          <th appSortableColumn="timestamp">
            Fecha y Hora
            <lux-sorticon-web field="timestamp" />
          </th>
          <th appSortableColumn="level">
            Nivel
            <lux-sorticon-web field="level" />
          </th>
          <th appSortableColumn="userName">
            Usuario
            <lux-sorticon-web field="userName" />
          </th>
          <th>Mensaje</th>
        </tr>
      </ng-template>
      <ng-template #body let-item>
        <!-- Fila 1: Datos principales -->
        <tr>
          <td>
            <lux-button-web
              displayMode="icon"
              iconClass="material-symbols-light:chevron-right"
              variant="text"
              size="sm"
              (clicked)="toggleExpand.emit(item)"
              [customClass]="item.expanded ? 'rotate-90' : ''"
            />
          </td>
          <td>{{ item.timestamp | apiDate: 'dd/MM/yyyy h:mm:ss a' }}</td>
          <td>
            <lux-tag
              [value]="item.level"
              [severity]="getLevelSeverity(item.level)"
            ></lux-tag>
          </td>
          <td>{{ item.userName || 'N/A' }}</td>
          <td class="max-w-400 text-wrap">{{ item.message }}</td>
        </tr>
        <!-- Fila 2: Propiedades (solo si está expandido) -->
        <tr [ngStyle]="{ display: item.expanded ? '' : 'none' }">
          <td></td>
          <td colspan="4" class="bg-body-tertiary p-3">
            <div class="d-flex align-items-center mb-2">
              <lux-icon
                [icon]="'material-symbols-light:info'"
                class="text-primary"
              />
              <strong>Propiedades:</strong>
            </div>
            <pre class="text-xs bg-body p-3 rounded overflow-auto max-h-200">
{{ item.properties }}</pre>
          </td>
        </tr>
        <!-- Fila 3: Excepción (solo si está expandido y existe) -->
        <tr
          [ngStyle]="{ display: item.expanded && item.exception ? '' : 'none' }"
        >
          <td></td>
          <td colspan="4" class="bg-red-50 p-3">
            <div class="d-flex align-items-center mb-2">
              <lux-icon
                [icon]="'material-symbols-light:warning'"
                class="text-red-600"
              />
              <strong class="text-red-600">Excepción:</strong>
            </div>
            <pre
              class="text-xs bg-body p-3 rounded border-1 border-red-200 overflow-auto max-h-300 text-red-700"
            >
{{ item.exception }}</pre>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <lux-table-empty-message [colspan]="5" />
      </ng-template>
    </lux-table>
  </div>
</lux-card>
