<lux-card>
  <div class="mt-3">
    <lux-data-view-mobile-web
      [data]="data()"
      [globalFilterFields]="globalFilterFields()"
      (search)="search.emit($event)"
      [showAdd]="false"
    >
      <ng-template #listItemTemplate let-item>
        <ili-list-item>
          <lux-tag
            slot="start"
            [value]="item.level.charAt(0).toUpperCase()"
            [severity]="getLevelSeverity(item.level)"
          ></lux-tag>
          <ion-label>
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h2 class="fw-bold m-0 text-base text-wrap">{{ item.level }}</h2>
              <p class="text-medium text-body-secondary m-0 text-sm">
                <lux-icon
                  [icon]="'material-symbols-light:schedule'"
                  class="me-1 text-xs"
                />
                {{ item.timestamp | apiDate: "dd/MM/yyyy h:mm a" }}
              </p>
            </div>

            @if (item.userName) {
            <p class="text-sm text-body-secondary m-0 mb-1">
              <lux-icon
                [icon]="'material-symbols-light:person'"
                class="me-1 text-xs"
              />
              {{ item.userName }}
            </p>
            }

            <p class="text-sm m-0 text-wrap mb-2">{{ item.message }}</p>

            @if (item.properties) {
            <div class="mb-2">
              <span class="text-xs d-flex align-items-center gap-1 mb-1">
                <lux-icon [icon]="'material-symbols-light:info'" /> Propiedades:
              </span>
              <pre class="text-xs bg-light p-2 border-radius overflow-auto">
{{ item.properties }}</pre>
            </div>
            } @if (item.exception) {
            <div>
              <span
                class="text-xs text-danger d-flex align-items-center gap-1 mb-1"
              >
                <lux-icon [icon]="'material-symbols-light:warning'" />
                Excepción:
              </span>
              <pre
                class="text-xs bg-danger-subtle p-2 border-radius border border-danger overflow-auto"
              >
{{ item.exception }}</pre>
            </div>
            }
          </ion-label>
        </ili-list-item>
      </ng-template>
    </lux-data-view-mobile-web>

    @if (data().length < totalRecords()) {
    <il-button
      label="Cargar más"
      severity="secondary"
      [fluid]="true"
      customClass="mt-3"
      (clicked)="loadMore.emit()"
      [loading]="loading()"
    />
    }
  </div>
</lux-card>
