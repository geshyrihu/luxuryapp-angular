@if (platformS.isMobile()) {
<lux-log-api-report-mobile-web
  [data]="data()"
  [loading]="loading()"
  [totalRecords]="totalRecords()"
  [globalFilterFields]="globalFilterFields()"
  (search)="onSearch($event)"
  (loadMore)="loadMore()"
/>
} @else {
<lux-log-api-report-desktop-web
  [data]="data()"
  [loading]="loading()"
  [totalRecords]="totalRecords()"
  [rows]="rows()"
  [globalFilterFields]="globalFilterFields()"
  [levelOptions]="levelOptions"
  [filterLevelControl]="filterLevelControl"
  [filterDateRangeControl]="filterDateRangeControl"
  [isSearchDisabled]="isSearchDisabled"
  (pageChange)="onPageChange($event)"
  (search)="onSearch($event)"
  (loadData)="onLoadData(true)"
  (deleteAll)="onDeleteAll()"
  (toggleExpand)="toggleExpand($event)"
/>
}
