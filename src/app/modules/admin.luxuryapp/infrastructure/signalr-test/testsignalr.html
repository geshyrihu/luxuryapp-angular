<div class="p-4">
  <h3 class="mb-4 text-2xl fw-semibold">Test de SignalR y OneSignal</h3>

  <!-- Selección de usuario individual -->
  <lux-card class="mb-4">
    <ng-template #title>Enviar a un usuario</ng-template>
    <div class="d-flex flex-wrap align-items-center mb-3">
      <div class="col-12 col-md-6">
        <custom-input-autocomplete-signal
          (propagar)="onSelectUser($event)"
          [control]="userControl"
          [data]="users()"
          label="Selecciona un usuario"
          placeholder="Escribe para buscar usuario"
        />
      </div>
      <div class="col-12 col-md-6 d-flex flex-column flex-md-row g-4">
        <lux-button-web
          (clicked)="sendSignalRToUser()"
          [disabled]="!selectedUserId()"
          iconClass="material-symbols-light:send"
          label="Enviar SignalR"
        />
        <lux-button-web
          severity="success"
          (clicked)="sendOneSignalToUser()"
          [disabled]="!selectedUserId()"
          iconClass="material-symbols-light:notifications"
          label="Enviar Push (OneSignal)"
        />
        <lux-button-web
          severity="success"
          (clicked)="sendOneSignalWebToUser()"
          [disabled]="!selectedUserId()"
          iconClass="material-symbols-light:notifications"
          label="Enviar Push (OneSignal) Web"
        />
      </div>
    </div>

    <custom-input-text-signal
      [control]="titleControl"
      label="Título de prueba"
    />

    <custom-input-text-signal
      [control]="messageControl"
      label="Mensaje de prueba"
    />

    <custom-input-text-signal [control]="routeControl" label="Ruta de prueba" />
  </lux-card>

  <!-- Test de plantillas WhatsApp aprobadas -->
  <lux-card class="mb-4">
    <ng-template #title>Test de plantillas WhatsApp (aprobadas)</ng-template>
    <div class="d-flex flex-column gap-2 mb-3">
      <custom-input-text-signal
        [control]="phoneControl"
        label="Número WhatsApp (destinatario de test)"
        placeholder="5559878523"
      />

      <custom-input-text-signal
        [control]="titleControl"
        label="Título / Asunto"
      />

      <custom-input-text-signal [control]="folioControl" label="Folio" />

      <custom-input-text-signal [control]="clienteControl" label="Cliente" />

      <custom-input-text-signal
        [control]="solicitaControl"
        label="Solicita (solo LegalTicket)"
      />

      <custom-input-text-signal
        [control]="resultadoControl"
        label="Resultado (solo SolicitudTerminada)"
      />

      <!-- Nuevos controles para AlertaTareaUrgente -->
      <custom-input-text-signal
        [control]="tareaControl"
        label="Tarea (solo AlertaTareaUrgente)"
      />
      <custom-input-text-signal
        [control]="responsableControl"
        label="Responsable (solo AlertaTareaUrgente)"
      />
      <custom-input-text-signal
        [control]="fechaLimiteControl"
        label="Fecha Límite (solo AlertaTareaUrgente)"
      />
    </div>
    <div class="d-flex flex-wrap gap-2">
      <lux-button-web
        (clicked)="sendWhatsAppLegalTicket()"
        [disabled]="!phoneControl.value"
        iconClass="material-symbols-light:chat"
        label="Enviar LegalTicket"
      />
      <lux-button-web
        severity="success"
        (clicked)="sendWhatsAppSolicitudRecibida()"
        [disabled]="!phoneControl.value"
        iconClass="material-symbols-light:mail"
        label="Enviar SolicitudRecibida"
      />
      <lux-button-web
        severity="success"
        (clicked)="sendWhatsAppSolicitudTerminada()"
        [disabled]="!phoneControl.value"
        iconClass="material-symbols-light:check-circle"
        label="Enviar SolicitudTerminada"
      />
      <lux-button-web
        severity="danger"
        (clicked)="sendWhatsAppAlertaTareaUrgente()"
        [disabled]="!phoneControl.value"
        iconClass="material-symbols-light:warning"
        label="Enviar AlertaTareaUrgente"
      />
    </div>
  </lux-card>

  <!-- Selección de usuarios móltiples -->
  <lux-card class="mb-4">
    <ng-template #title>Enviar a varios usuarios</ng-template>
    <div class="d-flex flex-wrap align-items-c gap-4">
      <div class="col-12 col-md-8">
        <custom-input-autocomplete-multiple-signal
          (propagar)="onSelectUsers($event)"
          [control]="multiUserControl"
          [data]="users()"
          label="Selecciona usuarios"
          placeholder="Escribe para buscar usuarios"
        />
      </div>
      <div class="col-12 col-md-4 d-flex align-items-end">
        <lux-button-web
          [fluid]="true"
          (clicked)="sendSignalRToUsers()"
          [disabled]="!selectedUserIds().length"
          iconClass="material-symbols-light:send"
          label="Enviar SignalR a seleccionados"
        />
      </div>
    </div>
  </lux-card>
</div>
