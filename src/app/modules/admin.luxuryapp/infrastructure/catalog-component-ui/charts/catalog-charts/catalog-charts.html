<div class="row g-4">
  <div class="col-12">
    <p class="text-sm mb-2" >
      Estos gráficos usan los componentes de <code>core/components/web/charts</code>,
       ahora con motor <strong>Chart.js</strong> (ng2-charts). La API pública no cambió.
    </p>
  </div>

  <!-- Bar (lux-bar-chart, tipo bar) -->
  <div class="col-12 col-lg-6">
    <div class="card" header="Bar Chart — lux-bar-chart-web">
      <lux-bar-chart-web [data]="barChartData()" chartType="bar" />
    </div>
  </div>

  <!-- Line (chart-wrapper, tipo line) -->
  <div class="col-12 col-lg-6">
    <div class="card" header="Line Chart — app-chart-wrapper">
      <lux-chart-wrapper-web type="line" [data]="lineChartData()" height="300px" />
    </div>
  </div>

  <!-- Pie (pie-chart, formato ngx-charts) -->
  <div class="col-12 col-lg-6">
    <div class="card" header="Pie Chart — app-pie-chart">
      <lux-pie-chart-web [dataGrafico]="pieChartData()" [colorScheme]="pieScheme" />
    </div>
  </div>

  <!-- Doughnut (chart-wrapper, tipo doughnut) -->
  <div class="col-12 col-lg-6">
    <div class="card" header="Doughnut — app-chart-wrapper">
      <lux-chart-wrapper-web type="doughnut" [data]="doughnutChartData()" height="300px" />
    </div>
  </div>

  <!-- Radar chart -->
  <div class="col-12 col-lg-6">
    <div class="card" header="Radar Chart — app-radar-chart">
      <lux-radar-chart-web [chartData]="radarChartData()" />
    </div>
  </div>

  <!-- Multi-axis (multi-axis-chart, doble eje Y) -->
  <div class="col-12 col-lg-6">
    <div class="card" header="Multi-Axis — app-multi-axis-chart">
      <lux-multi-axis-chart-web [data]="multiAxisData()" />
    </div>
  </div>

  <!-- Advanced Pie (advanced-pie-chart) -->
  <div class="col-12 col-lg-6">
    <div class="card" header="Advanced Pie — app-advanced-pie-chart">
      <lux-advanced-pie-chart-web [dataGrafico]="pieChartData()" [colorScheme]="pieScheme" />
    </div>
  </div>
</div>
