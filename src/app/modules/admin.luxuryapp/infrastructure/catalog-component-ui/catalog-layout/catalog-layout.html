<div
  class="catalog-root"
  [class.mobile-preview]="mobilePreview()"
>
  <header class="catalog-header">
    <div class="catalog-header__start">
<div
        class="logo-box rounded bg-primary d-flex align-items-center justify-content-center"
        
      >
        <lux-icon [icon]="'material-symbols-light:bolt'" class="text-white text-lg" />
      </div>
      <div class="catalog-header__info">
        <h1 class="catalog-header__title">Luxury Design System</h1>
        <span class="catalog-header__subtitle"
          >Admin Template · UI + Documentación</span
        >
      </div>
      <lux-tag-web value="v5.4.0" severity="secondary" [rounded]="true"></lux-tag-web>
    </div>

    <div class="catalog-header__end">
      <lux-button-web
        displayMode="icon"
        [icon]="themeService.isDarkMode() ? 'material-symbols-light:sunny' : 'material-symbols-light:nightlight'"
        [severity]="themeService.isDarkMode() ? 'warn' : 'secondary'"
        (clicked)="toggleTheme()"
        [rounded]="true"
        variant="text"
        lxTooltip="Alternar tema"
      />
      <lux-button-web
        displayMode="icon"
        icon="material-symbols-light:devices-other"
        [severity]="mobilePreview() ? 'primary' : 'secondary'"
        (clicked)="mobilePreview.set(!mobilePreview())"
        [rounded]="true"
        variant="text"
        lxTooltip="Simular vista móvil"
      />
    </div>
  </header>

  <div class="catalog-body">
    <main class="catalog-content">
      <router-outlet />
    </main>
  </div>
</div>
