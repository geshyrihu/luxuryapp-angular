<div class="email-container">
  <h3>📧 Enviar correo de prueba</h3>

  <div class="mb-4">
    <custom-input-text-signal
      label="Correo electrónico"
      [control]="emailControl"
      placeholder="ejemplo@dominio.com"
      type="email"
      [horizontal]="false"
    />
  </div>

  <lux-button-web
    kind="send-email"
    label="Enviar correo de prueba"
    severity="info"
    variant="soft"
    styleClass="mt-3"
    (clicked)="onSendEmail()"
  />
</div>
