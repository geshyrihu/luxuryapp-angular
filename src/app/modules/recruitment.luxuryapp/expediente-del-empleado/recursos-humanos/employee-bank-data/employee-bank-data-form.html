<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="grid">
    <!-- Empleado -->
    <div class="col-12">
      <custom-input-select-signal
        label="Empleado"
        [control]="f.employeeId"
        [data]="cbEmployees()"
        placeholder="Seleccione un empleado"
        [filter]="true"
      />
    </div>

    <!-- Banco -->
    <div class="col-12 md:col-6">
      <custom-input-select-signal
        label="Banco"
        [control]="f.bankId"
        [data]="cbBanks()"
        placeholder="Seleccione un banco"
        [filter]="true"
      />
    </div>

    <!-- No. Cuenta -->
    <div class="col-12 md:col-6">
      <custom-input-text-signal
        label="Número de Cuenta"
        [control]="f.bankAccount"
        placeholder="Ej. 1234567890"
      />
    </div>

    <!-- CLABE -->
    <div class="col-12 md:col-6">
      <custom-input-mask-signal
        label="CLABE Interbancaria (18 dígitos)"
        [control]="f.bankKey"
        customMask="000000000000000000"
        placeholder="Ej. 012345678901234567"
      />
    </div>

    <div class="col-12 flex justify-content-end mt-4">
      <il-button-save
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </div>
  </div>
</form>
