<div class="card mb-2 p-2">
  <div class="row g-4">
    <div class="col-12 col-md-4">
      <custom-input-select-signal
        [control]="stageControl"
        [data]="stages()"
        [showClear]="true"
        label="Etapa del pipeline"
        placeholder="Todas las etapas"
      />
    </div>
    @if (activeStage() !== null) {
    <div class="col-12 col-md-8 d-flex align-items-end pb-1">
      <app-candidate-stage-badge [stage]="activeStage()" />
    </div>
    }
  </div>
</div>

<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [tableStyle]="{ 'min-width': '60rem' }"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo proceso de candidato' })"
      [dt]="dt"
      aria-label="Agregar nuevo proceso de candidato"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="candidateName">
        Candidato
        <lux-sorticon-web field="candidateName" />
      </th>
      <th appSortableColumn="positionName">
        Vacante
        <lux-sorticon-web field="positionName" />
      </th>
      <th>Cliente</th>
      <th appSortableColumn="currentStage">
        Etapa
        <lux-sorticon-web field="currentStage" />
      </th>
      <th appSortableColumn="assignedInterviewerName">
        Entrevistador
        <lux-sorticon-web field="assignedInterviewerName" />
      </th>
      <th>CV</th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.candidateName }}</td>
      <td>{{ item.positionName }}</td>
      <td>{{ item.customerName }}</td>
      <td>
        <app-candidate-stage-badge [stage]="item.currentStage" />
      </td>
      <td>{{ item.assignedInterviewerName }}</td>
      <td>
        @if (item.cvFileName) {
        <lux-pdf-viewer-trigger
          [url]="item.cvFileUrl"
          [fileName]="item.cvFileName"
          displayMode="icon"
          size="sm"
          styleClass="btn--circle"
          [ariaLabel]="'Ver CV de ' + item.candidateName"
        />
        }
      </td>
      <td class="no-print">
        <div class="d-flex align-items-center gap-2 justify-content-end">
          @if (item.currentStage === candidateProcessStage.AltaEnProceso) {
          <lux-button-web
            kind="item"
            displayMode="both"
            label="Marcar contratado"
            iconClass="material-symbols-light:check-circle"
            severity="success"
            variant="solid"
            size="sm"
            [ariaLabel]="'Marcar contratado a ' + item.candidateName"
            (clicked)="completeHiring.emit(item.id)"
          />
          }
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            [ariaLabel]="'Editar proceso de ' + item.candidateName"
            (clicked)="edit.emit({ id: item.id, title: 'Editar proceso de candidato' })"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="7" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
