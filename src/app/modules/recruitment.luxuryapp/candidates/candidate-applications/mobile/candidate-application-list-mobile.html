<div class="card p-2 mb-2">
  <custom-input-select-signal
    [control]="stageControl"
    [data]="stages()"
    [showClear]="true"
    label="Etapa del pipeline"
    placeholder="Selecciona una etapa"
  />
</div>

<app-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo proceso de candidato' })"
  [globalFilterFields]="globalFilterFields()"
  aria-label="Bandeja de procesos de candidatos"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div class="d-flex flex-column gap-1">
        <p class="fw-semibold m-0 text-body line-height-2">
          {{ item.candidateName }}
        </p>
        <p class="text-xs m-0 text-body-secondary">
          {{ item.positionName }} - {{ item.customerName }}
        </p>
        <div class="d-flex align-items-center gap-2">
          <app-candidate-stage-badge [stage]="item.currentStage" />
        </div>
      </div>

      <ili-action-menu slot="end">
        @if (item.cvFileName) {
          <lux-pdf-viewer-trigger
            [url]="item.cvFileUrl"
            [fileName]="item.cvFileName"
            label="Ver CV"
            [ariaLabel]="'Ver CV de ' + item.candidateName"
          />
        }
        @if (item.currentStage === candidateProcessStage.AltaEnProceso) {
          <lux-button-mobile
            kind="item"
            label="Marcar contratado"
            iconClass="material-symbols-light:check-circle"
            color="success"
            [ariaLabel]="'Marcar contratado a ' + item.candidateName"
            (clicked)="completeHiring.emit(item.id)"
          />
        }
        <lux-button-mobile
          kind="edit"
          [ariaLabel]="'Editar proceso de ' + item.candidateName"
          (clicked)="edit.emit({ id: item.id, title: 'Editar proceso de candidato' })"
        />
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
