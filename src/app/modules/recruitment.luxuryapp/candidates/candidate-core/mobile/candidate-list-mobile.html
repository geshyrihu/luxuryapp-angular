<lux-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo Candidato' })"
  [globalFilterFields]="globalFilterFields()"
  aria-label="Lista de candidatos"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item lines="full" class="ion-no-padding" detail="false">
      <div
        slot="start"
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg w-3rem h-3rem bg-primary-50"
      >
        @if (item.photoUrl) {
        <img [src]="item.photoUrl" alt="" class="w-2rem h-2rem rounded-circle object-cover" />
        } @else {
        <lux-icon
          [icon]="'material-symbols-light:person'"
          class="text-xl text-primary"
        />
        }
      </div>
      <div class="d-flex flex-column gap-1">
        <p class="text-xs m-0 text-body-secondary">
          {{ item.email }} - {{ item.phoneNumber }}
        </p>
        <p class="text-xs m-0 text-body-secondary">
          {{ item.activeApplicationsCount }} procesos activos
        </p>
        @if (item.cvFileName) {
          <div>
            <lux-pdf-viewer-trigger
              [url]="item.cvFileUrl"
              [fileName]="item.cvFileName"
              label="Ver CV"
            />
          </div>
        }
        <app-mapped-p-tag
          [value]="item.status"
          [options]="candidateStatusOptions"
        />
      </div>

      <ili-action-menu slot="end">
        <lux-button-mobile
          kind="item"
          label="Ver detalle"
          [ariaLabel]="'Ver detalle candidato ' + item.fullName"
          (clicked)="detail.emit(item.id)"
        />
        <lux-button-mobile
          kind="edit"
          [ariaLabel]="'Editar candidato ' + item.fullName"
          (clicked)="edit.emit({ id: item.id, title: 'Editar Candidato' })"
        />
        @if (item.status === candidateStatus.Active) {
          <lux-button-mobile
            kind="delete"
            color="danger"
            label="Archivar"
            [ariaLabel]="'Archivar candidato ' + item.fullName"
            (clicked)="archive.emit(item.id)"
          />
        }
        @if (isSuperUser()) {
          <lux-button-mobile
            kind="item"
            label="Eliminar definitivamente"
            iconClass="material-symbols-light:delete"
            color="danger"
            [ariaLabel]="'Eliminar definitivamente candidato ' + item.fullName"
            (clicked)="delete.emit(item.id)"
          />
        }
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</lux-data-view-mobile>
