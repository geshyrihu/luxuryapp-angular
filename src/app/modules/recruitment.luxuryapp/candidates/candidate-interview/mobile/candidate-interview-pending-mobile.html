<lux-data-view-mobile
  [data]="data()"
  [showAdd]="false"
  [globalFilterFields]="globalFilterFields()"
  aria-label="Bandeja de entrevistas pendientes"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <div class="d-flex flex-column gap-1">
        <p class="fw-semibold m-0 text-body line-height-2">{{ item.candidateName }}</p>
        <p class="text-xs m-0 text-body-secondary">
          {{ item.positionName }} - {{ item.customerName }}
        </p>
        <div class="d-flex align-items-center gap-2">
          <app-candidate-stage-badge [stage]="item.currentStage" />
        </div>
      </div>

      <lux-action-menu-mobile slot="end">
        @if (item.cvFileName) {
          <lux-pdf-viewer-trigger
            [url]="item.cvFileUrl"
            [fileName]="item.cvFileName"
            label="Ver CV"
            [ariaLabel]="'Ver CV de ' + item.candidateName"
          />
        }
        <lux-button-mobile
          kind="edit"
          label="Retroalimentacion"
          [ariaLabel]="'Llenar retroalimentacion de ' + item.candidateName"
          (clicked)="feedback.emit({ candidateApplicationId: item.id, candidateProcessId: item.candidateProcessId })"
        />
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
