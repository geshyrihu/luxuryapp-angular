<div class="bg-body-tertiary rounded p-3 mb-3">
  <div class="fw-semibold mb-2">Guía rápida de estatus</div>
  <div class="row text-sm g-4">
    <div class="col-12 col-md-3">
      <strong>PENDIENTE:</strong> Falta completar datos exprés.
    </div>
    <div class="col-12 col-md-3">
      <strong>PROCESO:</strong> Ya se creó el empleado, falta llenar su
      Expediente y Concluir.
    </div>
    <div class="col-12 col-md-3">
      <strong>CONCLUIDO:</strong> Alta finalizada exitosamente.
    </div>
    <div class="col-12 col-md-3">
      <strong>CANCELADO:</strong> Trámite abortado.
    </div>
  </div>
</div>

@if (platformS.isMobile()) {
<app-solicitud-alta-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (sendHiringDocs)="onSendHiringDocs($event)"
  (completeAlta)="onModalForm($event)"
  (abortHiring)="onAbortHiring($event)"
  (goToEmployeeFile)="onGoToEmployeeFile($event)"
  (concludeHiring)="onConcludeHiring($event)"
  (viewRequestDetails)="onViewRequestDetails($event)"
/>
} @else {
<app-solicitud-alta-list-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (sendHiringDocs)="onSendHiringDocs($event)"
  (completeAlta)="onModalForm($event)"
  (abortHiring)="onAbortHiring($event)"
  (goToEmployeeFile)="onGoToEmployeeFile($event)"
  (concludeHiring)="onConcludeHiring($event)"
  (viewRequestDetails)="onViewRequestDetails($event)"
/>
}
