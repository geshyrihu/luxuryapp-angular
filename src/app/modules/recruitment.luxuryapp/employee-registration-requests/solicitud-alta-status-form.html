<div class="card">
  <div class="card-header">
    <h3>Revisión de Solicitud de Alta</h3>
  </div>
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <lux-input-text-signal
        [control]="form.controls.folio"
        label="Folio:"
        placeholder="Folio:"
        readonly
      />
      <lux-input-text-signal
        [control]="form.controls.employeeName"
        label="Candidato:"
        placeholder="Candidato:"
        readonly
      />

      <lux-input-select-signal
        label="Estatus"
        [control]="form.controls.status"
        [data]="statusOptions()"
        placeholder="Seleccione un estatus"
        [showClear]="true"
        [filter]="true"
        [readonly]="readOnly"
      />
      @if (!readOnly) {
      <lux-button-web
        kind="save"
        type="submit"
        severity="info"
        variant="soft"
        displayMode="both"
        label="Guardar"
        [disabled]="form.invalid"
        [loading]="submitting()"
      />
      }
    </form>
  </div>
</div>
