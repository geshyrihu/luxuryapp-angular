<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="row g-4">
    <div class="col-12">
      <lux-input-text-signal
        [control]="f.name"
        label="Nombre"
        placeholder="Ej. Alergia, tipo de sangre, condicion"
      />
    </div>

    <div class="col-12">
      <lux-input-textarea-signal
        [control]="f.description"
        label="Descripción"
        placeholder="Detalle del dato clinico"
      />
    </div>

    <div class="col-12 d-flex justify-content-end mt-4">
      <lux-button-web
        kind="save"
        type="submit"
        severity="info"
        variant="soft"
        displayMode="both"
        label="Guardar"
        [disabled]="form.invalid"
        [loading]="submitting()"
      />
    </div>
  </div>
</form>
