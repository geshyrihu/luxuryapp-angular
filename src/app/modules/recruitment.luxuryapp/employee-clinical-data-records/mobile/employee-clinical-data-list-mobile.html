<app-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro Clinico' })"
  [showAdd]="!isReadOnly()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
      >
        <lux-icon icon="material-symbols-light:medical-services" />
      </div>

      <h3>{{ item.name }}</h3>
      <p>{{ item.description }}</p>

      @if (!isReadOnly()) {
      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar Registro Clinico' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
      }
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
