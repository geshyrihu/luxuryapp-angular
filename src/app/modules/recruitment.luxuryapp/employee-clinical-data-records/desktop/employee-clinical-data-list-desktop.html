<lux-table
  [globalFilterFields]="globalFilterFields()"
  [value]="data()"
  #dt
  class="custom-table card"
  [loading]="loading()"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo Registro Clinico' })"
      [showSearch]="data().length > 0"
      [dt]="dt"
    />
  </ng-template>

  @if (data().length !== 0) {
   <ng-template #header>
     <tr>
       <th>NOMBRE</th>
       <th>DESCRIPCIÓN</th>
       <th class="table-col-5 no-print"></th>
     </tr>
   </ng-template>
  }

  <ng-template #body let-item>
    <tr>
      <td>{{ item.name }}</td>
      <td>{{ item.description }}</td>
      <td class="no-print">
        <div class="d-flex justify-content-center">
          @if (!isReadOnly()) {
          <iw-button
            iconClass="edit"
            ngbTooltip="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar Registro Clinico' })"
          />
          } @if (!isReadOnly()) {
          <iw-button-confirm
            icon="trash"
            ngbTooltip="Eliminar"
            (confirmed)="delete.emit(item.id)"
          />
          }
        </div>
      </td>
    </tr>
  </ng-template>

  @if (data().length === 0) {
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="3" />
  </ng-template>
  }
</lux-table>
