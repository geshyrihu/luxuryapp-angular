@if (platformS.isMobile()) {
<app-vacantes-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [isSuperUser]="isSuperUser()"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
  (deletePermanente)="onDeletePermanente($event)"
  (detail)="onModalDetail($event)"
  (jobDescription)="onModalJobDescription($event)"
/>
} @else {
<app-vacantes-list-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [searchTerm]="filterRequestsService.searchTerm()"
  [isSuperUser]="isSuperUser()"
  [canManageCandidates]="canManageVacancyCandidates()"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
  (deletePermanente)="onDeletePermanente($event)"
  (detail)="onModalDetail($event)"
  (jobDescription)="onModalJobDescription($event)"
  (candidates)="goToVacancyCandidates($event.workPositionId, $event.requestPositionId)"
/>
}
