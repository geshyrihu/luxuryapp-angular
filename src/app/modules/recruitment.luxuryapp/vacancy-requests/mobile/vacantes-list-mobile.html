<app-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  [showAdd]="false"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="w-3rem h-3rem rounded d-flex align-items-center justify-content-center flex-shrink-0 ms-3 bg-body-tertiary"
      >
        <app-icon
          icon="material-symbols-light:work-outline"
          class="text-xl text-green-600"
        />
      </div>

      <h3>{{ item.applicationRoleName }}</h3>
      <p>{{ item.customer }} - {{ item.requestDate }}</p>
      <p>{{ item.status }}</p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id })"
          />
          <ili-button-delete (confirmed)="delete.emit(item.id)" label="Eliminar" />
          <ili-button-item
            (clicked)="detail.emit(item.workPositionId)"
            label="Detalle del puesto"
            iconClass="material-symbols-light:info"
          />
          <ili-button-item
            (clicked)="jobDescription.emit(item.workPositionId)"
            label="Descripción del puesto"
            iconClass="material-symbols-light:description"
          />
          @if (isSuperUser()) {
          <ili-button-item
            (clicked)="deletePermanente.emit(item.id)"
            label="Eliminar definitivamente"
            color="danger"
            iconClass="material-symbols-light:delete"
            [attr.aria-label]="'Eliminar definitivamente vacante ' + item.folio"
          />
          }
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
