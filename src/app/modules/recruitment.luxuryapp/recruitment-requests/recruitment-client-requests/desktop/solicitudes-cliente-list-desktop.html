<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption [showAdd]="false" [dt]="dt" />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="fechaSolicitud">
        FECHA DE SOLICITUD
        <lux-sorticon-web field="fechaSolicitud" />
      </th>
      <th appSortableColumn="folio">
        FOLIO
        <lux-sorticon-web field="folio" />
      </th>
      <th appSortableColumn="tipoSolicitud">
        SOLICITUD
        <lux-sorticon-web field="tipoSolicitud" />
      </th>
      <th appSortableColumn="nombreEmpleado">
        NOMBRE
        <lux-sorticon-web field="nombreEmpleado" />
      </th>
      <th appSortableColumn="status">
        ESTATUS
        <lux-sorticon-web field="status" />
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.fechaSolicitud }}</td>
      <td>{{ item.folio }}</td>
      <td>{{ item.tipoSolicitud }}</td>
      <td>{{ item.nombreEmpleado }}</td>
      <td>
        <lux-tag
          [value]="item.status"
          [severity]="getTagSeverity(item.status)"
          [rounded]="true"
          class="w-full md:w-auto"
        />
      </td>
      <!-- Opciones -->
      <td>
        <div>
          @switch (item.tipoSolicitud) { @case ('Alta') {
          <div class="body-card">
            <!-- Contenido especÃ­fico para el caso 'pesificacion' -->
            <lux-button-web
              kind="edit"
              displayMode="icon"
              severity="info"
              variant="soft"
              size="sm"
              tooltip="Editar"
              ariaLabel="Editar"
              (clicked)="editSolicitudAlta.emit({
                          id: item.id,
                          })"
            />
          </div>
          } @case ('Vacante') {
          <div class="body-card">
            <!-- Contenido especÃ­fico para otro caso -->
            <lux-button-web
              kind="edit"
              displayMode="icon"
              severity="info"
              variant="soft"
              size="sm"
              tooltip="Editar"
              ariaLabel="Editar"
              (clicked)="editVacante.emit({
                          id: item.id,
                          })"
            />
          </div>
          } @case ('Baja') {
          <div class="body-card">
            <!-- Contenido especÃ­fico para otro caso -->

            <lux-button-web
              kind="edit"
              displayMode="icon"
              severity="info"
              variant="soft"
              size="sm"
              tooltip="Editar"
              ariaLabel="Editar"
              (clicked)="
                          editSolicitudBaja.emit({
                          id: item.id,
                          })
                          "
            />
          </div>
          } @case ('Modificacion') {
          <div class="body-card">
            <!-- Contenido especÃ­fico para otro caso -->
            <lux-button-web
              kind="item"
              displayMode="icon"
              iconClass="material-symbols-light:attach-money"
              (clicked)="editModificacionSalario.emit({ id: item.id, })"
            />
          </div>
          }
          <!-- Agrega mÃ¡s casos segÃºn tus necesidades -->
          }
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
