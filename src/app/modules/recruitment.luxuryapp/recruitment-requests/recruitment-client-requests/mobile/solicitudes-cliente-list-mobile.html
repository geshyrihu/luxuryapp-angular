<lux-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  [showAdd]="false"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <div
        start
        class="w-3rem h-3rem rounded d-flex align-items-center justify-content-center flex-shrink-0 ms-3 bg-body-tertiary"
      >
        <lux-icon
          icon="material-symbols-light:group-outline"
          class="text-xl text-purple-600"
        />
      </div>

      <h3>{{ item.nombreEmpleado }}</h3>
      <p>{{ item.tipoSolicitud }} · {{ item.folio }}</p>
      <p>{{ item.fechaSolicitud }} · {{ item.status }}</p>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
