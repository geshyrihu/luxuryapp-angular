@if (platformS.isMobile()) {
<app-solicitudes-cliente-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
/>
} @else {
<app-solicitudes-cliente-list-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (editSolicitudAlta)="onModalEditSolicitudAlta($event)"
  (editVacante)="onModalEditVacante($event)"
  (editSolicitudBaja)="onModalEditSolicitudBaja($event)"
  (editModificacionSalario)="onModalEditModificacionSalario($event)"
/>
}
