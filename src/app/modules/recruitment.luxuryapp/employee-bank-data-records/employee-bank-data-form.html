<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="row g-4">
    <div class="col-12">
      <p class="m-0 text-sm text-body-secondary">
        Registra la cuenta bancaria del empleado.
      </p>
    </div>

    <div class="col-12 col-md-6">
      <custom-input-select-signal
        [control]="f.bankId"
        label="Banco"
        [data]="cbBanks()"
        placeholder="Seleccione un banco"
        [filter]="true"
      />
    </div>

    <div class="col-12 col-md-6">
      <custom-input-text-signal
        [control]="f.bankAccount"
        label="Numero de Cuenta"
        placeholder="Ej. 1234567890"
      />
    </div>

    <div class="col-12 col-md-6">
      <custom-input-mask-signal
        [control]="f.bankKey"
        label="CLABE Interbancaria"
        customMask="000000000000000000"
        placeholder="18 digitos"
      />
    </div>

    <div class="col-12 d-flex justify-content-end mt-4">
      <il-button-save [disabled]="form.invalid" [submitting]="submitting()" />
    </div>
  </div>
</form>
