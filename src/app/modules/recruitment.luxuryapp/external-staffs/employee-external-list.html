@if (platformS.isMobile()) {
<app-employee-external-list-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  (edit)="onModalForm($event)"
  (userApp)="onModalUserApp($event)"
  (removeFromCustomer)="onRemoveFromCustomer($event)"
/>
} @else {
<app-employee-external-list-desktop
  [data]="dataSignal()"
  (add)="onModalForm({ userId: '', title: 'Nuevo Registro' })"
  (edit)="onModalForm($event)"
  (userApp)="onModalUserApp($event)"
  (removeFromCustomer)="onRemoveFromCustomer($event)"
  (cardEmployee)="onCardEmployee($event)"
/>
}
