<lux-table
  [globalFilterFields]="['fullName', 'applicationRoleName', 'userName', 'personalCellPhone', 'personalEmail']"
  [value]="data()"
  #dt
  sortMode="single"
  class="custom-table card"
>
  <ng-template #caption>
    <div class="row g-4">
      <div class="col-12">
        <lux-table-caption
          [title]="'DIRECTORIO DE PERSONAL EXTERNO'"
          (add)="
            add.emit({
              userId: '',
              title: 'Nuevo Registro',
            })
          "
          [dt]="dt"
        />
      </div>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th class="table-col-5">NÂ°</th>
      <th colspan="2" class="table-col-30" appSortableColumn="fullName">
        COLABORADOR
        <lux-sorticon-web field="fullName" />
      </th>
      <th class="table-col-20" appSortableColumn="workPositionFolio">
        PUESTO DE TRABAJO
        <lux-sorticon-web field="workPositionFolio" />
      </th>
      <th class="table-col-10" appSortableColumn="userName" class="no-print">
        USUARIO APP
        <lux-sorticon-web field="userName" />
      </th>

       <th class="table-col-30 no-print">
         TELÃ‰FONO
         <lux-sorticon-web field="personalCellPhone" />
       </th>
      <th class="table-col-30" appSortableColumn="personalEmail">
        Email
        <lux-sorticon-web field="personalEmail" />
      </th>

      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item let-rowIndex="rowIndex">
    <tr>
      <td class="no-print">{{ rowIndex + 1 }}</td>
      <td class="text-center">
        <lux-avatar-web
          [image]="item.photoPath"
          alt=""
          styleClass="mr-2"
          size="large"
          (click)="cardEmployee.emit(item.applicationUserId)"
        />
      </td>
      <td>{{ item.fullName }}</td>
      <td>{{ item.applicationRoleName }}</td>
      <td>{{ item.userName }}</td>
      <td>{{ item.personalCellPhone }}</td>
      <td>{{ item.personalEmail }}</td>
      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ userId: item.applicationUserId, title: 'Editar' })"
          />
          <lux-button-web
            kind="item"
            displayMode="icon"
            iconClass="material-symbols-light:person"
            tooltip="Usuario App"
            (clicked)="userApp.emit(item.applicationUserId)"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            ariaLabel="Quitar del cliente"
            (clicked)="removeFromCustomer.emit(item.applicationUserId)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="7" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
