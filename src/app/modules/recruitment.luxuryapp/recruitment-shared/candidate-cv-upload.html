<div class="d-flex flex-column gap-2">
  <label class="text-sm text-body-secondary fw-medium">{{ label() }}</label>

  @if (fileName() && !replaceMode() && !currentFileName()) {
    <div class="cv-current-file">
      <div class="d-flex flex-column gap-1">
        <span class="text-sm fw-medium text-body">{{ currentFileLabel() }}</span>
        @if (fileUrl()) {
          <lux-pdf-viewer-trigger
            [url]="fileUrl()"
            [fileName]="fileName()"
            displayMode="icon"
            size="sm"
            styleClass="btn--circle"
            [ariaLabel]="viewAriaLabel()"
          />
        } @else {
          <span class="text-sm text-blue-700">{{ fileName() }}</span>
        }
      </div>
      <button
        type="button"
        class="cv-action-button"
        (click)="enableReplaceMode()"
      >
        {{ replaceLabel() }}
      </button>
    </div>
  }

  @if (!fileName() || replaceMode() || currentFileName()) {
  <lux-file-upload-web
    class="w-full"
    [accept]="'.pdf'"
    [multiple]="false"
    [autoUpload]="false"
    (onSelect)="onFileSelect($event)"
  />
  }

  @if (currentFileName()) {
    <p class="text-sm m-0 text-blue-700">
      Archivo: {{ currentFileName() }}
    </p>
  }

  @if (currentFileName()) {
    <div class="d-flex justify-content-end">
      <button
        type="button"
        class="cv-action-button cv-action-button--subtle"
        (click)="clearReplacement()"
      >
        Cancelar reemplazo
      </button>
    </div>
  }
</div>
