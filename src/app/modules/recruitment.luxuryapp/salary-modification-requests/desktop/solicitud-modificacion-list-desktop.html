<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #header>
    <tr>
      <th>FOLIO</th>
      <th>SOLICITUD</th>
      <th>CLIENTE</th>
      <th>COLABORADOR</th>
      <th>PUESTO ACTUAL</th>
      <th>SUELDO ACTUAL</th>
      <th>PUESTO NUEVO</th>
      <th>SUELDO NUEVO</th>
      <th appSortableColumn="status">
        ESTATUS <lux-sorticon-web field="status" />
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td
        class="text-center fw-semibold"
        [style.border-left]="'8px solid ' + requestStatusBorderColor(item.status)"
      >
        {{ item.folio }}
      </td>
      <td>{{ item.requestDate }}</td>
      <td
        class="text-nowrap overflow-hidden text-truncate max-w-0"
        [title]="item.customer"
      >
        {{ item.customer }}
      </td>
      <td
        class="text-nowrap overflow-hidden text-truncate max-w-0"
        [title]="item.employee"
      >
        {{ item.employee }}
      </td>
      <td
        class="text-nowrap overflow-hidden text-truncate max-w-0"
        [title]="item.applicationRoleCurrent"
      >
        {{ item.applicationRoleCurrent }}
      </td>
      <td class="text-end">{{ item.currentSalary }}</td>
      <td
        class="text-nowrap overflow-hidden text-truncate max-w-0"
        [title]="item.applicationRoleNew"
      >
        {{ item.applicationRoleNew }}
      </td>
      <td class="text-end">{{ item.finalSalary }}</td>
      <td class="text-center">
        <lux-tag
          [value]="item.status"
          [severity]="requestStatusTagSeverity(item.status)"
        />
      </td>
      <td class="no-print">
        <div class="d-flex gap-1">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: item.employee })"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            ariaLabel="Eliminar"
            (clicked)="delete.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="10" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
