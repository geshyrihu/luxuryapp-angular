@if (platformS.isMobile()) {
<app-solicitud-modificacion-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
} @else {
<app-solicitud-modificacion-list-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [searchTerm]="filterRequestsService.searchTerm()"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
}
