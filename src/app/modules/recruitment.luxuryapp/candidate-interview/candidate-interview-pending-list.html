<div class="card p-3 mb-2">
  <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-md-between gap-2 g-4">
    <p class="m-0 text-sm text-color-secondary">
      Esta bandeja solo muestra postulaciones en etapas de entrevista:
      reclutamiento y operaciones.
    </p>
    <a routerLink="/recruitment/candidates/recruitment-interviews" class="btn btn-secondary btn-sm w-fit">
      Ver entrevistas de reclutamiento
    </a>
  </div>
</div>

@if (platformS.isMobile()) {
  <app-candidate-interview-pending-mobile
    [data]="filteredData()"
    [globalFilterFields]="globalFilterFields()"
    (feedback)="onFeedback($event)"
  />
} @else {
  <app-candidate-interview-pending-desktop
    [data]="filteredData()"
    [globalFilterFields]="globalFilterFields()"
    (feedback)="onFeedback($event)"
  />
}
