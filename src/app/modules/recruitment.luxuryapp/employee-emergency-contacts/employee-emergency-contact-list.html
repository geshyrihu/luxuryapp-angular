@if (platformS.isMobile()) {
<app-employee-emergency-contact-list-mobile
  [dataEmergencyContact]="dataEmergencyContact()"
  [dataBeneficiary]="dataBeneficiary()"
  [globalFilterFields]="globalFilterFields()"
  [isReadOnly]="isReadOnly()"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event.id, $event.typeContact)"
/>
} @else {
<app-employee-emergency-contact-list-desktop
  [dataEmergencyContact]="dataEmergencyContact()"
  [dataBeneficiary]="dataBeneficiary()"
  [globalFilterFields]="globalFilterFields()"
  [isReadOnly]="isReadOnly()"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event.id, $event.typeContact)"
/>
}
