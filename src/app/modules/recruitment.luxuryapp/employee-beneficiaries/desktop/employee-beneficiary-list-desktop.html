<lux-table
  [globalFilterFields]="globalFilterFields()"
  [value]="data()"
  #dt
  class="custom-table card"
  [loading]="loading()"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo Beneficiario' })"
      [showSearch]="data().length > 0"
      [dt]="dt"
    />
  </ng-template>

  @if (data().length !== 0) {
  <ng-template #header>
    <tr>
      <th>Empleado</th>
      <th>Nombre del Beneficiario</th>
      <th>Teléfono</th>
      <th>Parentesco</th>
      <th class="table-col-5 no-print"></th>
    </tr>
  </ng-template>
  }

  <ng-template #body let-item>
    <tr>
      <td>{{ item.employeeName }}</td>
      <td>{{ item.fullName }}</td>
      <td>{{ item.phoneNumber }}</td>
      <td>{{ item.relationName }}</td>
      <td class="no-print">
        <div class="d-flex justify-content-center">
          @if (!isReadOnly()) {
          <lux-button-web size="sm" displayMode="icon"
            iconClass="edit"
            ngbTooltip="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar Beneficiario' })"
          />
          } @if (!isReadOnly()) {
          <lux-button-web size="sm"
            kind="confirm"
            displayMode="icon"
            iconClass="trash"
            severity="danger"
            variant="soft"
            tooltip="Eliminar"
            (clicked)="delete.emit(item.id)"
          />
          }
        </div>
      </td>
    </tr>
  </ng-template>

  @if (data().length === 0) {
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="5" />
  </ng-template>
  }
</lux-table>
