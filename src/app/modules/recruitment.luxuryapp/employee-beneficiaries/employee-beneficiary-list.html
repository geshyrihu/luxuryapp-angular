@if (platformS.isMobile()) {
<app-employee-beneficiary-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [isReadOnly]="isReadOnly()"
  (add)="onModalForm({ id: '', title: 'Nuevo Beneficiario' })"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
} @else {
<app-employee-beneficiary-list-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [isReadOnly]="isReadOnly()"
  [loading]="loading()"
  (add)="onModalForm({ id: '', title: 'Nuevo Beneficiario' })"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
}
