<lux-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <div start>
        <lux-icon
          icon="material-symbols-light:person-outline"
          class="text-xl text-green-500"
        />
      </div>

      <h3>{{ item.fullName }}</h3>
      <p>{{ item.nameComercial }} é {{ item.applicationRoleName }}</p>
      <p>{{ item.nameCustomer }}</p>

      <lux-action-menu-mobile slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
