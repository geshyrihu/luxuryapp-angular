<div
  class="requests-filter-toolbar flex align-items-center gap-3"
>
  <!-- Search -->
  <div class="requests-filter-toolbar__search">
    <custom-search-input-signal (searchChange)="onSearch($event)" />
  </div>

  @if (showRequestFilters()) {
  <!-- Filtro de fecha -->
  <div class="requests-filter-toolbar__date">
    <custom-input-date-signal
      id="fecha-desde"
      placeholder="Mostrar desde"
      [control]="fechaFormateadaControl"
      [horizontal]="false"
      [noMargin]="true"
    />
  </div>

  <!-- Filtro de estatus -->
  <div class="requests-filter-toolbar__status">
    <custom-input-select-button-signal
      id="status-select"
      [control]="statusRequestControl"
      [options]="cb_status_request"
      (selectionChange)="onLoadData()"
      [horizontal]="false"
      [noMargin]="true"
    />
  </div>

  <!-- Botón de exportar -->
  <div class="requests-filter-toolbar__action">
    <il-button
      customClass="requests-filter-toolbar__export-button mb-0"
      iconClass="material-symbols-light:bar-chart"
      label="Excel"
      (clicked)="exportToExcel()"
      variant="outline"
      severity="success"
      size="small"
    />
  </div>
  }
</div>
