<lux-table
  #dt
  [value]="data()"
  [rows]="tableRows"
  [paginator]="true"
  [globalFilterFields]="globalFilterFields()"
  [rowsPerPageOptions]="rowsPerPageOptions"
  class="custom-table"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  [loading]="loading()"
  groupRowsBy="employeeName"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Agregar Beneficiario' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th>Empleado</th>
      <th>Nombre del Beneficiario</th>
      <th>Teléfono</th>
      <th>Parentesco</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #groupheader let-item>
    <tr>
      <td colspan="5">
        <span class="fw-bold ms-2">
          ?? {{ item.employeeName }} ({{ item.numberEmployee }})
        </span>
      </td>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td>{{ item.employeeName }}</td>
      <td>{{ item.fullName }}</td>
      <td>{{ item.phoneNumber }}</td>
      <td>{{ item.relationName }}</td>
      <td class="text-center">
        <div class="d-flex gap-2">
          <iw-button-edit
            (clicked)="edit.emit({ id: item.id, title: 'Editar Beneficiario' })"
          />
          <iw-button-delete (confirmed)="delete.emit(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="5" />
  </ng-template>

  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
