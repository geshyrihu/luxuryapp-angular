<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="row g-4">
    <!-- Empleado -->
    <div class="col-12">
      <lux-input-select-signal
        label="Empleado"
        [control]="f.employeeId"
        [data]="cbEmployees()"
        placeholder="Seleccione un empleado"
        [filter]="true"
      />
    </div>

    <!-- Parentesco / Relación -->
    <div class="col-12 col-md-6">
      <lux-input-select-signal
        label="Parentesco"
        [control]="f.relation"
        [data]="cbRelations()"
        placeholder="Seleccione una opción"
        [filter]="true"
      />
    </div>

    <!-- Nombre del Beneficiario -->
    <div class="col-12 col-md-6">
      <lux-input-text-signal
        label="Nombre del Beneficiario"
        [control]="f.fullName"
        placeholder="Nombre completo"
      />
    </div>

    <!-- Teléfono -->
    <div class="col-12 col-md-6">
      <lux-input-mask-signal
        label="Teléfono del Beneficiario"
        [control]="f.phoneNumber"
        customMask="000 000 0000"
        placeholder="10 dígitos"
      />
    </div>

    <div class="col-12 d-flex justify-content-end mt-4">
      <lux-button-web
        kind="save"
        type="submit"
        severity="info"
        variant="soft"
        displayMode="both"
        label="Guardar"
        [disabled]="form.invalid"
        [loading]="submitting()"
      />
    </div>
  </div>
</form>
