<div class="card">
  @if (platformS.isMobile()) {
  <app-employee-beneficiary-list-mobile
    [data]="dataSignal()"
    (add)="onModalForm({ id: '', title: 'Agregar Beneficiario' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
  } @else {
  <app-employee-beneficiary-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [loading]="loading()"
    (add)="onModalForm({ id: '', title: 'Agregar Beneficiario' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
  }
</div>
