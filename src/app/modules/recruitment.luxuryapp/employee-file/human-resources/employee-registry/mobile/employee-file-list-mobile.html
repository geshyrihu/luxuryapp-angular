<lux-data-view-mobile [data]="data()" [showAdd]="false">
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        class="w-3rem h-3rem bg-primary-50"
      >
        <lux-icon
          icon="material-symbols-light:folder-shared"
          class="text-xl text-primary"
        />
      </div>

      <h2 class="fw-bold">{{ item.fullName }}</h2>
      <p class="text-sm text-body-secondary">
        No. {{ item.numberEmployee ?? 'é' }}
      </p>
      <p class="text-sm text-body-secondary">{{ item.puesto || 'é' }}</p>
      <p class="text-sm text-body-secondary">
        {{ item.departamento || 'é' }}
      </p>
      <p class="text-sm">
        <span
          [class]="'badge border-1 surface-border ' + getStatusBadge(item.isActive)"
        >
          {{ item.isActive ? 'Activo' : 'Inactivo' }}
        </span>
      </p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="item"
            label="Ver Expediente"
            (clicked)="viewFile.emit(item)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</lux-data-view-mobile>
