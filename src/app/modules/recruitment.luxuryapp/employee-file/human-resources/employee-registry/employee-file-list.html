<div class="card">
  <!-- Filtro de estatus -->
  <div class="mb-3 w-full sm:w-16rem">
    <custom-input-select-signal
      label="Estatus"
      [data]="statusOptions"
      optionLabel="label"
      optionValue="value"
      [horizontal]="false"
      (selectionChange)="onStatusChange($event)"
      [filter]="true"
    />
  </div>

  @if (platformS.isMobile()) {
  <app-employee-file-list-mobile
    [data]="dataSignal()"
    (viewFile)="onViewFile($event)"
  />
  } @else {
  <app-employee-file-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (viewFile)="onViewFile($event)"
  />
  }
</div>
