<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [tableStyle]="{ 'min-width': '50rem' }"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption [showAdd]="false" [dt]="dt" />
  </ng-template>

  <ng-template #header>
    <tr>
      <th class="table-col-sm">Foto</th>
      <th class="table-col-lg">Nombre</th>
      <th class="table-col-sm">No. Emp.</th>
      <th class="table-col-lg">Puesto</th>
      <th class="table-col-md">Departamento</th>
      <th class="table-col-sm text-center">Estatus</th>
      <th class="table-col-actions">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td>
        @if (item.photoUrl) {
        <img
          [src]="item.photoUrl"
          [alt]="item.fullName"
          class="w-3rem h-3rem rounded-circle object-cover"
        />
        } @else {
        <div
          class="w-3rem h-3rem rounded-circle bg-body-tertiary d-flex align-items-center justify-content-center text-body-secondary fw-bold"
        >
          {{ item.fullName.charAt(0) }}
        </div>
        }
      </td>
      <td class="fw-medium">{{ item.fullName }}</td>
      <td>{{ item.numberEmployee ?? 'é' }}</td>
      <td>{{ item.puesto || 'é' }}</td>
      <td>{{ item.departamento || 'é' }}</td>
      <td class="text-center">
        <span
          [class]="'badge border-1 surface-border ' + getStatusBadge(item.isActive)"
        >
          {{ item.isActive ? 'Activo' : 'Inactivo' }}
        </span>
      </td>
      <td class="text-center">
        <lux-button-web
          kind="item"
          displayMode="icon"
          iconClass="material-symbols-light:folder-open"
          tooltip="Ver Expediente"
          (clicked)="viewFile.emit(item)"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="7" />
  </ng-template>

  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
