@if (applicationUser(); as applicationUser) {
<lx-card>
  <div class="row g-4">
    <div class="col-12 col-md-4 d-flex justify-content-center">
      <img [src]="urlImage()" alt="no-img" class="p-2 rounded w-9rem h-auto" />
    </div>
    <div class="col-12 col-md-8">
      <div class="p-2">
        <div class="d-flex justify-content-between align-items-start">
          <h3 class="h4 mt-0 mb-2">{{ applicationUser.fullName }}</h3>
          <lx-tag
            [value]="applicationUser.active ? 'Activo' : 'Inactivo'"
            [severity]="applicationUser.active ? 'success' : 'danger'"
          ></lx-tag>
        </div>
        <h5 class="card-title text-body-secondary mt-0 mb-1">
          {{ applicationUser.applicationRole }}
        </h5>
        <h5 class="card-title text-body-secondary mt-0 mb-2">
          {{ applicationUser.customer }}
        </h5>
        <lx-divider />
        <div class="text-body-secondary">
          <p class="mt-2 mb-1">{{ applicationUser.email }}</p>
          <p class="my-1">{{ applicationUser.birth }}</p>
          <p class="my-1">{{ applicationUser.phoneNumber }}</p>
        </div>
      </div>
    </div>
  </div>
</lx-card>
}
