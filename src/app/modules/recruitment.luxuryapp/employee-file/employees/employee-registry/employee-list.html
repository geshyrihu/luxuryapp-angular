@if (platformS.isMobile()) {
<app-employee-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="showModalAddEmployee()"
  (editEmpleado)="onShowEditEmpleado($event.applicationUserId, $event.employeeId)"
/>
} @else {
<app-employee-list-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [isAdmin]="
    aspRoleS.hasAny([
      AspRole.Asistente,
      AspRole.Administrador,
      AspRole.SuperUsuario,
      AspRole.Reclutamiento
    ])
  "
  [activo]="activo()"
  (add)="showModalAddEmployee()"
  (stateChange)="onSelectActive($event)"
  (cardEmployee)="onCardEmployee($event)"
  (editEmpleado)="onShowEditEmpleado($event.employeeId, $event.applicationUserId)"
/>
}
