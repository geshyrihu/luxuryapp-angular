<form autocomplete="off" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="card">
    <div class="card-body">
      <div class="w-full md:w-1/2">
        <lux-input-select-signal
          [label]="'Estatus'"
          [control]="form.controls.status"
          [data]="estatusBaja"
          [filter]="true"
        />
      </div>
    </div>
    <div class="card-footer">
      <div class="d-flex justify-content-end">
        <lux-button-web
          kind="save"
          type="submit"
          severity="info"
          variant="soft"
          displayMode="both"
          label="Guardar"
          [disabled]="form.invalid"
        />
      </div>
    </div>
  </div>
</form>
