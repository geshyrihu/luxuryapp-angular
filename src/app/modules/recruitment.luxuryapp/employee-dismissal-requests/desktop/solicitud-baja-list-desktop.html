@if (data()) {
<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #header>
    <tr>
      <th appSortableColumn="folio">FOLIO <app-sorticon field="folio" /></th>
      <th>SOLICITUD</th>
      <th>CLIENTE</th>
      <th>EXCOLABORADOR</th>
      <th>PUESTO</th>
      <th>FECHA BAJA</th>
      <th>TIPO BAJA</th>
      <th appSortableColumn="status">
        ESTATUS <app-sorticon field="status" />
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td
        class="text-center fw-semibold"
        [style.border-left]="'8px solid ' + requestStatusBorderColor(item.status)"
      >
        {{ item.folio }}
      </td>
      <td class="text-center">{{ item.requestDate }}</td>
      <td
        class="text-nowrap overflow-hidden text-truncate max-w-0"
        [title]="item.nameCustomer"
      >
        {{ item.nameCustomer }}
      </td>
      <td
        class="text-nowrap overflow-hidden text-truncate max-w-0"
        [title]="item.nameEmployee"
      >
        {{ item.nameEmployee }}
      </td>
      <td
        class="text-nowrap overflow-hidden text-truncate max-w-0"
        [title]="item.applicationRole"
      >
        {{ item.applicationRole }}
      </td>
      <td>{{ item.executionDate }}</td>
      <td>{{ item.tipoBaja }}</td>
      <td class="text-center">
        <lux-tag
          [value]="item.status"
          [severity]="requestStatusTagSeverity(item.status)"
        />
      </td>
      <td class="no-print">
        <div class="d-flex gap-1">
          <iw-button-edit (clicked)="edit.emit(item)" />
          <iw-button-delete (confirmed)="delete.emit(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="9" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
}
