<lux-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  [showAdd]="false"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <div
        start
        class="w-3rem h-3rem rounded d-flex align-items-center justify-content-center flex-shrink-0 ms-3 bg-body-tertiary"
      >
        <lux-icon
          icon="material-symbols-light:person-remove"
          class="text-xl text-red-600"
        />
      </div>

      <h3>{{ item.nameEmployee }}</h3>
      <p>{{ item.nameCustomer }} - {{ item.applicationRole }}</p>
      <p>Baja: {{ item.executionDate }} - {{ item.status }}</p>

      <lux-action-menu-mobile slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit(item)"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
