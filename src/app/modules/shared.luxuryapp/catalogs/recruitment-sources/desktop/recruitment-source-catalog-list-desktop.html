<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nueva Fuente' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th class="table-col-7" appSortableColumn="name">
        NOMBRE
        <app-sorticon field="name" />
      </th>

      <th class="table-col-3" appSortableColumn="isActive">
        ESTATUS
        <app-sorticon field="isActive" />
      </th>

      <th class="table-col-2">ACCIONES</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.name }}</td>

      <td>
        <span
          [class]="'badge ' + (item.isActive ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-600')"
          >{{ item.isActive ? 'Activo' : 'Inactivo' }}</span
        >
      </td>

      <td class="no-print">
        <div class="d-flex">
          <iw-button-edit
            (clicked)="edit.emit({ id: item.id, title: 'Editar Fuente' })"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            ariaLabel="Eliminar"
            (clicked)="delete.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="3" />
  </ng-template>

  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
