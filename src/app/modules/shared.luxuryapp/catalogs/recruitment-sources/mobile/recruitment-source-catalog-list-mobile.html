<lux-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nueva Fuente' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile lines="full" class="ion-no-padding" detail="false">
      <div
        slot="start"
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg w-3rem h-3rem bg-primary-50"
      >
        <app-icon
          icon="material-symbols-light:group"
          class="text-xl text-primary"
        />
      </div>
      <div>
        <p class="mt-0 mb-0">{{ item.name }}</p>
        <small [class]="item.isActive ? 'text-green-600' : 'text-500'">
          {{ item.isActive ? 'Activo' : 'Inactivo' }}
        </small>
      </div>

      <lux-action-menu-mobile slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar Fuente' })"
            label="Editar"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
