@if (platformS.isMobile()) {
  <app-recruitment-source-catalog-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm({ id: '', title: 'Nueva Fuente' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-recruitment-source-catalog-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm({ id: '', title: 'Nueva Fuente' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
}
