@if (platformS.isMobile()) {
  <app-onboarding-checklist-option-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm({ id: '', title: 'Nueva tarea de onboarding' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-onboarding-checklist-option-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm({ id: '', title: 'Nueva tarea de onboarding' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
}
