<lux-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nueva tarea de onboarding' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile lines="full" class="ion-no-padding" detail="false">
      <div
        slot="start"
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg w-3rem h-3rem bg-primary-50"
      >
        <app-icon
          icon="material-symbols-light:fact-check"
          class="text-xl text-primary"
        />
      </div>
      <div>
        <p class="mt-0 mb-0">{{ item.name }}</p>
        <small class="text-blue-700">SLA: {{ item.diasSla }} día(s)</small>
        <div class="text-body-secondary text-xs mt-1">
          {{ formatRoles(item.roles) }}
        </div>
      </div>

      <lux-action-menu-mobile slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar tarea de onboarding' })"
            label="Editar"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
