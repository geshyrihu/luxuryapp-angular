@if (platformS.isMobile()) {
  <app-document-catalog-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm({ id: '', title: 'Nuevo Documento' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-document-catalog-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm({ id: '', title: 'Nuevo Documento' })"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
    (reorder)="onRowReorder($event)"
  />
}
