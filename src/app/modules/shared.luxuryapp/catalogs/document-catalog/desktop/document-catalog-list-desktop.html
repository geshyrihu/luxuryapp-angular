<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [reorderableRows]="true"
  [reorderableColumns]="true"
  (onRowReorder)="reorder.emit($event)"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo Documento' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th class="table-col-3rem"></th>
      <th class="table-col-4" appSortableColumn="name">
        NOMBRE
        <app-sorticon field="name" />
      </th>

      <th class="table-col-3" appSortableColumn="description">
        DESCRIPCIÓN
        <app-sorticon field="description" />
      </th>

      <th class="table-col-1" appSortableColumn="isMandatory">
        OBLIGATORIO
        <app-sorticon field="isMandatory" />
      </th>

      <th class="table-col-2" appSortableColumn="isActive">
        ESTATUS
        <app-sorticon field="isActive" />
      </th>

      <th class="table-col-2">ACCIONES</th>
    </tr>
  </ng-template>
  <ng-template #body let-item let-rowIndex="rowIndex">
    <tr [pReorderableRow]="rowIndex">
      <td>
        <app-icon
          [icon]="'material-symbols-light:menu'"
          pReorderableRowHandle
          class="cursor-move"
        />
      </td>
      <td>{{ item.name }}</td>

      <td>{{ item.description || "—" }}</td>

      <td>
        <span
          [class]="'badge ' + (item.isMandatory ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-600')"
          >{{ item.isMandatory ? 'Obligatorio' : 'Opcional' }}</span
        >
      </td>

      <td>
        <span
          [class]="'badge ' + (item.isActive ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-600')"
          >{{ item.isActive ? 'Activo' : 'Inactivo' }}</span
        >
      </td>

      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            (clicked)="edit.emit({ id: item.id, title: 'Editar Documento' })"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            ariaLabel="Eliminar"
            (clicked)="delete.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="6" />
  </ng-template>

  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
