<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [tableStyle]="{ 'min-width': '50rem' }"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption
      (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
      aria-label="Agregar nuevo banco"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="code">
        Codigo
        <app-sorticon field="code" />
      </th>
      <th appSortableColumn="shortName">
        Nombre
        <app-sorticon field="shortName" />
      </th>
      <th appSortableColumn="largeName">
        Razón social
        <app-sorticon field="largeName" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.code }}</td>
      <td>{{ item.shortName }}</td>
      <td>{{ item.largeName }}</td>
      <td class="no-print">
        <div class="d-flex gap-1">
          <lux-button-web displayMode="icon"-edit
            [attr.aria-label]="'Editar banco ' + item.shortName"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            [ariaLabel]="'Eliminar banco ' + item.shortName"
            (clicked)="delete.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="4" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
