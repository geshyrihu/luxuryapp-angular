<lux-table-web
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [tableStyle]="{ 'min-width': '50rem' }"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption-web
      (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
      aria-label="Agregar nuevo banco"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="code">
        Codigo
        <lux-sorticon-web field="code" />
      </th>
      <th appSortableColumn="shortName">
        Nombre
        <lux-sorticon-web field="shortName" />
      </th>
      <th appSortableColumn="largeName">
        Razón social
        <lux-sorticon-web field="largeName" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.code }}</td>
      <td>{{ item.shortName }}</td>
      <td>{{ item.largeName }}</td>
      <td class="no-print">
        <div class="d-flex gap-1">
          <iw-button-edit
            size="sm"
            class="btn--circle"
            [attr.aria-label]="'Editar banco ' + item.shortName"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <iw-button-delete
            size="sm"
            class="btn--circle"
            [attr.aria-label]="'Eliminar banco ' + item.shortName"
            (confirmed)="delete.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message-web [colspan]="4" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer-web [data]="data()" />
  </ng-template>
</lux-table-web>
