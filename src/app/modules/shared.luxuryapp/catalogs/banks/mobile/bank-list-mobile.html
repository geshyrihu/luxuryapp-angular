<lux-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  aria-label="Lista de bancos"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <div class="d-flex flex-column gap-1">
        <p class="fw-semibold m-0 text-body line-height-2">
          {{ item.shortName }}
        </p>
        <p class="text-xs m-0 text-body-secondary">
          {{ item.code }} - {{ item.largeName }}
        </p>
      </div>

      <lux-action-menu-mobile slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
            label="Editar"
            [ariaLabel]="'Editar banco ' + item.shortName"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            [ariaLabel]="'Eliminar banco ' + item.shortName"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
