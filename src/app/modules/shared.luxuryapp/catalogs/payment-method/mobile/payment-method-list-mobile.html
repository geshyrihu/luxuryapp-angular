<app-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item lines="full">
      <div
        slot="start"
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg w-3rem h-3rem bg-primary-50"
      >
        <app-icon
          icon="material-symbols-light:credit-card-outline"
          class="text-xl text-primary"
        />
      </div>
      <div>
        <h2>{{ item.descripcion }}</h2>
        <p>{{ item.codigo }}</p>
      </div>
      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          <ili-button-delete (confirmed)="delete.emit(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
