<div class="p-4">
  <p class="text-body-secondary mb-4">
    Confirma si el candidato <strong>{{ candidateName() }}</strong> se presentó
    a laborar para la vacante <strong>{{ vacancyFolio() }}</strong>.
  </p>

  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="d-flex flex-column gap-4"
  >
    <div class="d-flex flex-column gap-2">
      <label class="fw-semibold">¿Se presentó el candidato?</label>
      <div class="d-flex gap-4">
        <div class="d-flex align-items-center gap-2">
          <lx-radio-button
            [control]="form.controls.isPresented"
            [value]="true"
            inputId="rbYes"
          />
          <label for="rbYes">Sí se presentó</label>
        </div>
        <div class="d-flex align-items-center gap-2">
          <lx-radio-button
            [control]="form.controls.isPresented"
            [value]="false"
            inputId="rbNo"
          />
          <label for="rbNo">No se presentó</label>
        </div>
      </div>
    </div>

    @if (form.controls.isPresented.value === false) {
    <div class="d-flex flex-column gap-2 p-3 bg-body-tertiary rounded">
      <label class="fw-semibold">Motivo / Acción</label>
      <div class="d-flex flex-column gap-3">
        <div class="d-flex align-items-center gap-2">
          <lx-radio-button
            [control]="form.controls.status"
            value="Rescheduled"
            inputId="rbRescheduled"
          />
          <label for="rbRescheduled">Cambió fecha de ingreso (Reprogramar)</label>
        </div>
        <div class="d-flex align-items-center gap-2">
          <lx-radio-button
            [control]="form.controls.status"
            value="NoShow"
            inputId="rbNoShow"
          />
          <label for="rbNoShow">Declinó / Abandono</label>
        </div>
      </div>

      @if (form.controls.status.value === 'Rescheduled') {
      <div class="mt-3">
        <custom-input-date-signal
          [control]="form.controls.newPresentationDate"
          label="Nueva fecha de ingreso"
        />
      </div>
      }
    </div>
    }

    <div class="d-flex justify-content-end gap-2 mt-3">
      <il-button
        label="Cancelar"
        severity="secondary"
        (clicked)="close()"
        [disabled]="saving()"
      />
      <il-button label="Guardar" type="submit" [loading]="saving()" />
    </div>
  </form>
</div>
