@if (platformS.isMobile()) {
<app-propiedades-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
} @else {
<app-propiedades-list-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [canManage]="canManage()"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
  (showOccupants)="showOccupantsDialog($event)"
  (downloadTemplate)="downloadTemplate()"
  (fileSelected)="onFileSelected($event)"
/>
}
