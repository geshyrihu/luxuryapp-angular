<lux-data-view-mobile
  [data]="data()"
  (add)="add.emit({ id: '', title: 'Agregar' })"
  [globalFilterFields]="globalFilterFields()"
>
  <div customFilters class="my-2 px-2 w-full">
    <app-task-status (statusChange)="statusChange.emit($event)" />
  </div>
  <ng-template #listItemTemplate let-item>
    <ili-list-item alignTop="true" class="w-full">
      <div
        slot="start"
        class="d-flex align-items-center justify-content-center flex-shrink-0 rounded-lg mt-1 w-3rem h-3rem bg-primary-50"
      >
        <lux-icon
          icon="material-symbols-light:fact-check"
          class="text-xl text-primary"
        />
      </div>

      <div class="d-flex flex-column w-full gap-1">
        <div class="d-flex justify-content-between align-items-start mt-1">
          <small class="text-body-secondary text-xs"
            >{{ item.folio }} | {{ item.createdAtDate }}</small
          >
          <span
            class="bg-primary-100 text-primary-700 rounded px-2 py-1 text-xs fw-bold"
            >{{ item.daysDifference }} d</span
          >
        </div>
        <p
          class="fw-semibold m-0 text-body line-height-2 text-sm ticket-title text-truncate overflow-hidden text-nowrap"
        >
          {{ item.title }}
        </p>
        <p class="text-xs m-0 text-body-secondary ticket-description two-lines">
          {{ item.description }}
        </p>

        @if (item.beforeWork || item.afterWork) {
        <div class="d-flex align-items-center mt-1">
          @if (item.beforeWork) {
          <app-image
            [src]="item.beforeWork"
            alt="Evidencia inicial"
            width="30"
            [preview]="true"
            styleClass="mr-2 border border-danger"
          />
          } @if (item.afterWork) {
          <app-image
            [src]="item.afterWork"
            alt="Evidencia final"
            width="30"
            [preview]="true"
            styleClass="border border-success"
          />
          }
        </div>
        }
        <div class="d-flex justify-content-end text-end">
          <p class="m-0 text-xs text-body-secondary">
            Cierre: {{ item.closedAtDate ?? "Pendiente" }}
          </p>
        </div>
      </div>

      <ili-action-menu slot="end">
        <lux-button-mobile
          kind="edit"
          (clicked)="edit.emit({
                  id: item.id,
                  title: 'Editar',
                  ticketGroupId: item.ticketGroupId,
                })"
        />

        <lux-button-mobile
          kind="item"
          iconName="ellipsis-horizontal-outline"
          label="Seguimiento"
          (clicked)="followUp.emit(item.id)"
        />
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</lux-data-view-mobile>
