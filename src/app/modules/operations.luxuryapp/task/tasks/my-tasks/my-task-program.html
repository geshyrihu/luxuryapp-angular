<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-date-signal
    [control]="form.controls.scheduledDate"
    label="Fecha"
    placeholder="fecha"
  />

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    label="Guardar"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
