<div class="w-full">
  <div class="w-full">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <lux-input-text-signal
        [control]="form.controls.id"
        hidden
        [readonly]="true"
        label="Id"
        [hidden]="false"
      />
      <lux-input-date-signal
        [control]="form.controls.closedDate"
        label="Fecha de término"
        placeholder="Esta fecha se coloca cuando ya se término el ticket"
      />

      <div class="row g-4">
        <div class="col-12 col-md-6 d-flex justify-content-center">
          <lux-input-img-signal
            [control]="form.controls.beforeWork"
            [urlImgCurrent]="form.controls.beforeWorkPreview.value"
            label="Foto de antes"
            [required]="false"
          />
        </div>
        <div class="col-12 col-md-6 d-flex justify-content-center">
          <lux-input-img-signal
            [control]="form.controls.afterWork"
            [urlImgCurrent]="form.controls.afterWorkPreview.value"
            label="Foto de después"
            [required]="false"
          />
        </div>
      </div>

      <div class="text-center mt-3">
        <lux-button-web
          kind="save"
          type="submit"
          severity="info"
          variant="soft"
          displayMode="both"
          label="Guardar"
          [disabled]="form.invalid"
          [loading]="submitting()"
        />
      </div>
    </form>
  </div>
</div>
