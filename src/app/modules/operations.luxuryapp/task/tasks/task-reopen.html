<div class="w-full">
  <div class="w-full">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <lux-input-textarea-signal
        [control]="form.controls.description"
        label="DESCRIPCIÓN"
        placeholder="DESCRIPCIÓN"
        [rows]="3"
      />
      <div class="text-center mt-3">
        <lux-button-web
          kind="save"
          type="submit"
          severity="info"
          variant="soft"
          displayMode="both"
          label="Guardar"
          [disabled]="form.invalid"
          [loading]="submitting()"
        />
      </div>
    </form>
  </div>
</div>
