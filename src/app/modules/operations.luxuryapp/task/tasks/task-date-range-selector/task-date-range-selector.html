<div class="mb-4">
  <label class="form-label d-block mb-2"
    >Seleccione el rango de fechas a revisar:</label
  >
  <div class="input-group">
    <lux-input-date-signal
      mode="range"
      class="me-1"
      [control]="dateRangeControl"
      (ngModelChange)="onDateChange($event)"
      [horizontal]="false"
    />
    <lux-button-web
      kind="item"
      severity="secondary"
      variant="soft"
      iconClass="material-symbols-light:search"
      (clicked)="emitSelectedDates()"
    />
  </div>
</div>
