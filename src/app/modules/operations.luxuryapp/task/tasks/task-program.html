<div class="w-full">
  <div class="w-full">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <lux-input-date-signal
        [control]="form.controls.scheduledDate"
        label="Fecha"
        placeholder="fecha"
      />

      <lux-input-autocomplete-signal
        (propagar)="saveUserId($event)"
        [control]="form.controls.assignee"
        [data]="cb_user()"
        label="Asignar"
        placeholder="Escribe para buscar colaborador"
      />

      <div class="text-center mt-3">
        <lux-button-web
          kind="save"
          type="submit"
          severity="info"
          variant="soft"
          displayMode="both"
          label="Guardar"
          [disabled]="form.invalid"
          [loading]="submitting()"
        />
      </div>
    </form>
  </div>
</div>
