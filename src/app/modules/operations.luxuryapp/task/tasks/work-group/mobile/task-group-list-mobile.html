<app-data-view-mobile
  [data]="data()"
  (add)="add.emit()"
  [globalFilterFields]="globalFilterFields()"
  [loading]="loading()"
>
  <ng-container customFilters>
    <div class="px-3 pb-3">
      <lux-button-mobile
        kind="active-desactive"
        fill="outline"
        color="secondary"
        [icon]="
          value()
            ? 'material-symbols-light:visibility-off'
            : 'material-symbols-light:visibility'
        "
        [label]="value() ? 'Inactivos' : 'Activos'"
        (clicked)="change.emit(!value())"
      />
    </div>
  </ng-container>
  <ng-template #listItemTemplate let-item>
    <div class="bg-body border-bottom-1 border px-3 py-3">
      <div class="d-flex align-items-center justify-content-between gap-3">
        <div class="d-flex align-items-center gap-3 flex-fill min-w-0">
          <div
            class="w-2rem h-2rem d-flex align-items-center justify-content-center flex-shrink-0 text-2xl"
            [style.color]="item.color || 'var(--ds-primary)'"
          >
            <span>{{ item.emoji || '??' }}</span>
          </div>

          <div class="flex-fill min-w-0">
            <h3 class="m-0 text-body fw-medium text-xl text-wrap">
              {{ item.nameGroup }}
            </h3>
            <p class="m-0 mt-1">
              <app-status-badge
                [status]="item.visibility"
                [isVisibility]="true"
                [clickable]="false"
              />
            </p>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2 flex-shrink-0">
          <div
            class="d-flex align-items-center gap-1 text-body cursor-pointer"
            (click)="navigateMessage.emit({ ticketGroupId: item.id, status: 0 })"
          >
            <span class="fw-semibold text-sm">
              {{ item.open + item.inProgress + item.reopened }}
            </span>
            <app-icon
              icon="material-symbols-light:forum-outline"
              class="text-base"
            />
          </div>

          <ili-action-menu slot="end">
            <ng-container actions>
              @if (item.customerId === customerId()) {
              <lux-button-mobile
                kind="item"
                [label]="'Integrantes (' + item.TaskGroupParticipant + ')'"
                iconName="people-outline"
                (clicked)="participants.emit(item)"
              />
              } @if (hasSuperUsuario()) {
              <lux-button-mobile
                kind="item"
                iconName="mail-outline"
                label="Enviar por correo"
                (clicked)="report.emit(item)"
              />
              }
              <lux-button-mobile
                kind="edit"
                (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
              />
              <lux-button-mobile
                kind="delete"
                color="danger"
                (clicked)="delete.emit(item.id)"
              />
              @if (item.active) {
              <lux-button-mobile
                kind="item"
                iconName="lock-closed-outline"
                label="Bloquear"
                (clicked)="toggleStatus.emit(item.id)"
              />
              } @if (!item.active) {
              <lux-button-mobile
                kind="item"
                iconName="lock-open-outline"
                label="Desbloquear"
                (clicked)="toggleStatus.emit(item.id)"
              />
              }
            </ng-container>
          </ili-action-menu>
        </div>
      </div>
    </div>
  </ng-template>
</app-data-view-mobile>
