@if (platformS.isMobile()) {
<app-task-group-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [loading]="loading()"
  [value]="value()"
  [hasSuperUsuario]="hasSuperUsuario()"
  [customerId]="customerIdS.customerId()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  (change)="onChange($event)"
  (navigateMessage)="onNavigateMessage($event.ticketGroupId, $event.status)"
  (participants)="onModalParticipants($event)"
  (report)="SendReportPendingTicketGroupAsync($event)"
  (edit)="onModalForm($event)"
  (toggleStatus)="onToggleStatus($event)"
  (delete)="onDelete($event)"
/>
} @else {
<app-task-group-list-desktop
  [data]="filteredData()"
  [value]="value()"
  [hasSuperUsuario]="hasSuperUsuario()"
  [customerId]="customerIdS.customerId()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  (change)="onChange($event)"
  (searchChange)="searchTerm.set($event)"
  (navigateMessage)="onNavigateMessage($event.ticketGroupId, $event.status)"
  (participants)="onModalParticipants($event)"
  (report)="SendReportPendingTicketGroupAsync($event)"
  (edit)="onModalForm($event)"
  (toggleStatus)="onToggleStatus($event)"
  (delete)="onDelete($event)"
/>
}
