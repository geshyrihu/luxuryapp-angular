<div class="w-full">
  <div class="w-full">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <lux-input-text-signal
        [control]="form.controls.id"
        hidden
        label="Id"
        placeholder="Id"
        [readonly]="true"
        [hidden]="false"
      />
      <lux-input-select-signal
        [control]="form.controls.TaskGroupCategoryId"
        label="Categoria"
        [data]="cb_TaskGroupCategory()"
        [filter]="true"
      />

      <lux-input-select-signal
        [control]="form.controls.visibility"
        label="Privacidad"
        [data]="cb_visibility()"
        [filter]="true"
      />

      <div class="text-center mt-3">
        <lux-button-web
          kind="save"
          type="submit"
          severity="info"
          variant="soft"
          displayMode="both"
          [label]="id() ? 'Actualizar' : 'Guardar'"
          [disabled]="form.invalid"
          [loading]="submitting()"
        />
      </div>
    </form>
  </div>
</div>
