<lux-data-view-mobile
  [data]="data()"
  (add)="add.emit()"
>
  <div customFilters>
    <div class="px-4 py-2">
      <lux-button-mobile
        kind="active-desactive"
        fill="outline"
        color="secondary"
        [icon]="
          activeOnly()
            ? 'material-symbols-light:visibility-off'
            : 'material-symbols-light:visibility'
        "
        [label]="activeOnly() ? 'Inactivos' : 'Activos'"
        (clicked)="changeState.emit(!activeOnly())"
      />
    </div>
  </div>
  <ng-template #listItemTemplate let-template>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg w-3rem h-3rem bg-primary-50"
      >
        <lux-icon
          icon="material-symbols-light:event-repeat"
          class="text-xl text-primary"
        />
      </div>

      <h5 class="mb-2">{{ template.title }}</h5>
      <p class="text-sm text-body-secondary">
        Grupo: {{ template.workGroupName }}
      </p>
      <p class="text-sm text-body-secondary">
        Estatus: {{ template.status }}
      </p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="item"
            label="Editar"
            (clicked)="edit.emit(template)"
          />
          <lux-button-mobile
            kind="active-desactive"
            fill="outline"
            color="secondary"
            [icon]="
              isActive(template)
                ? 'material-symbols-light:visibility-off'
                : 'material-symbols-light:visibility'
            "
            [label]="isActive(template) ? 'Pausar' : 'Activar'"
            (clicked)="toggleStatus.emit(template.id)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</lux-data-view-mobile>
