<lux-table
  #dt
  [value]="data()"
  [rows]="10"
  [paginator]="true"
  [loading]="loading()"
  size="small"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  class="custom-table"
>
  <ng-template #caption>
    <div
      class="d-flex flex-column flex-md-row align-items-md-center justify-content-end p-2 gap-2 g-4"
    >
      <lux-table-caption
        (add)="add.emit()"
        [dt]="dt"
        [noPadding]="true"
        [noMargin]="true"
      />
      <div class="flex-shrink-0">
        <lux-button-web
          kind="active-desactive"
          variant="outline"
          severity="secondary"
          [icon]="
            activeOnly()
              ? 'material-symbols-light:visibility-off'
              : 'material-symbols-light:visibility'
          "
          [label]="activeOnly() ? 'Inactivos' : 'Activos'"
          (clicked)="changeState.emit(!activeOnly())"
        />
      </div>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th>Título</th>
      <th>Grupo</th>
      <th>Criticidad</th>
      <th>Estatus</th>
      <th class="table-col-15">Acciones</th>
    </tr>
  </ng-template>
  <ng-template #body let-template>
    <tr>
      <td>{{ template.title }}</td>
      <td>{{ template.workGroupName }}</td>
      <td>{{ template.criticality }}</td>
      <td>{{ template.status }}</td>
      <td>
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit(template)"
          />
          <lux-button-web
            kind="active-desactive"
            variant="outline"
            severity="secondary"
            [icon]="
              isActive(template)
                ? 'material-symbols-light:visibility-off'
                : 'material-symbols-light:visibility'
            "
            [label]="isActive(template) ? 'Pausar' : 'Activar'"
            tooltip="Activar/Pausar"
            tooltipPosition="top"
            (clicked)="toggleStatus.emit(template.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="5" />
  </ng-template>
</lux-table>
