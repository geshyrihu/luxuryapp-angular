<div class="card">
  <div class="card-header">
    <h3 class="card-title">Catálogo de Tareas Recurrentes</h3>
  </div>
  <div class="card-body">
    @if (platformS.isMobile()) {
    <app-recurring-task-catalog-list-mobile
      [data]="data()"
      [activeOnly]="activeOnly()"
      (add)="showForm()"
      (edit)="showForm($event)"
      (toggleStatus)="onToggleStatus($event)"
      (changeState)="onChangeState($event)"
    />
    } @else {
    <app-recurring-task-catalog-list-desktop
      [data]="data()"
      [loading]="loading()"
      [activeOnly]="activeOnly()"
      (add)="showForm()"
      (edit)="showForm($event)"
      (toggleStatus)="onToggleStatus($event)"
      (changeState)="onChangeState($event)"
    />
    }
  </div>
</div>
