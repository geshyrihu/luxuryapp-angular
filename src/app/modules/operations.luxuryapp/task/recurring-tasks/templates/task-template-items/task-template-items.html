@if (templateInfo(); as template) {

@if (platformS.isMobile()) {
<app-task-template-items-mobile
  [items]="items()"
  (add)="showItemForm()"
  (edit)="showItemForm($event)"
  (delete)="onDeleteItem($event)"
/>
} @else {
<app-task-template-items-desktop
  [items]="items()"
  [template]="template"
  (add)="showItemForm()"
  (edit)="showItemForm($event)"
  (delete)="onDeleteItem($event)"
  (rowReorder)="onRowReorder($event)"
/>
}

}
