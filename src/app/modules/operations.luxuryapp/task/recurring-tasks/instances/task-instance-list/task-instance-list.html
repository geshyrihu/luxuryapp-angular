<div class="card">
  <lux-toolbar class="mb-4">
    <ng-template #left>
      <h3 class="m-0">Mis Tareas Diarias</h3>
    </ng-template>
    <ng-template #right>
      <custom-input-date-signal
        [control]="selectedDateControl"
        label="Fecha"
        id="fecha-filtro"
        placeholder="Seleccionar Fecha"
        [noMargin]="true"
      />
    </ng-template>
  </lux-toolbar>

  @if (platformS.isMobile()) {
  <app-task-instance-list-mobile
    [data]="data()"
    (complete)="onCompleteTask($event)"
    (reopen)="onReopenTask($event)"
  />
  } @else {
  <app-task-instance-list-desktop
    [data]="data()"
    [loading]="loading()"
    (complete)="onCompleteTask($event)"
    (reopen)="onReopenTask($event)"
  />
  }
</div>
