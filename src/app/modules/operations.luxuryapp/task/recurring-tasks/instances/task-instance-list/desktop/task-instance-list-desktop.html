<lux-table
  #dt
  [value]="data()"
  [loading]="loading()"
  [tableStyle]="{ 'min-width': '50rem' }"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  class="p-datatable-gridlines"
>
  <ng-template #caption>
    <app-lux-table-caption
      [title]="'Tareas Asignadas'"
      [showGlobalFilter]="false"
      [showAddButton]="false"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th>Título</th>
      <th>Prioridad</th>
      <th>Estado</th>
      <th>Programada para</th>
      <th>Acciones</th>
    </tr>
  </ng-template>
  <ng-template #body let-task>
    <tr>
      <td>{{ task.title }}</td>
      <td>{{ task.priorityDescription }}</td>
      <td>
        <app-status-badge
          [value]="task.status"
          [status]="task.statusDescription"
        />
      </td>
      <td>{{ task.scheduledDate | apiDate : "medium" }}</td>
      <td>
        <lux-button-web displayMode="icon"
          (clicked)="complete.emit(task)"
          iconClass="material-symbols-light:check"
          [disabled]="task.status === 1"
        />
        <lux-button-web
          kind="confirm"
          displayMode="icon"
          severity="success"
          variant="soft"
          iconClass="material-symbols-light:undo"
          [disabled]="task.status !== 1"
          (clicked)="reopen.emit(task.id)"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="5">No hay tareas para esta fecha.</td>
    </tr>
  </ng-template>
  <ng-template #summary>
    <app-lux-table-footer
      [totalRecords]="data().length"
      [emptyMessage]="'No hay tareas para esta fecha.'"
    />
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="5" />
  </ng-template>
</lux-table>
