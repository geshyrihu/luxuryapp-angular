<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <custom-input-textarea-signal
    [control]="form.controls.comments"
    label="Comentarios (Opcional)"
    placeholder="Añade tus comentarios..."
  />

  <div class="mt-3">
    <label for="attachments">Adjuntar Evidencia (Opcional)</label>
    <lux-file-upload
      accept="image/*"
      [maxFileSize]="1000000"
      [multiple]="true"
      (onSelect)="onFileSelected($event)"
    />
  </div>

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    label="Marcar como Completada"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
