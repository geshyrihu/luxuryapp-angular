@if (platformS.isMobile()) {
<app-entrega-recepcion-cliente-lista-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  [departamentos]="cb_departamento"
  [selectedDepartamento]="departamento()"
  [showDepartmentFilter]="isJefeMantenimiento()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  (edit)="onModalForm($event)"
  (validar)="onValidarDocument($event)"
  (invalidar)="onInvalidarDocument($event)"
  (deleteFile)="onDeleteFile($event)"
  (departamentoChange)="onChangeDepartamento($event)"
/>
} @else {
<app-entrega-recepcion-cliente-lista-desktop
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  [departamentos]="cb_departamento"
  [selectedDepartamento]="departamento()"
  [showDepartmentFilter]="isJefeMantenimiento()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  (edit)="onModalForm($event)"
  (validar)="onValidarDocument($event)"
  (invalidar)="onInvalidarDocument($event)"
  (deleteFile)="onDeleteFile($event)"
  (departamentoChange)="onChangeDepartamento($event)"
/>
}
