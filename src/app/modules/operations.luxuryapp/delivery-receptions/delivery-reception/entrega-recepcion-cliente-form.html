<div class="p-3">
  <div>
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <custom-input-text-signal
        [control]="form.controls.id"
        hidden
        label="Id"
        [readonly]="true"
      />

      <custom-input-select-signal
        [control]="form.controls.estatus"
        label="Estatus"
        [data]="cb_estatus()"
        [filter]="true"
      />

      <custom-input-textarea-signal
        [control]="form.controls.observaciones"
        placeholder="observaciones"
        label="Observaciones"
      />

      <!-- Archivo -->
      <div class="mb-3">
        <div class="w-full">
          <custom-input-file-signal
            (fileSelected)="change($event)"
            accept=".pdf"
            label="Archivo"
            [horizontal]="false"
          />
        </div>
      </div>
      <!-- Archivo -->

      <!-- Razón social -->
      <il-button-save
        [propertyId]="id"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </form>
  </div>
</div>
