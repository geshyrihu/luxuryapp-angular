<app-report-header></app-report-header>

<lux-table
  [value]="dataSignal()"
  initialSortField="clasificacion"
  groupRowsBy="clasificacion"
  class="custom-table card d-none d-md-block"
>
  <ng-template #caption>
    <div class="d-flex align-items-center justify-content-between">
      <h5 class="m-0 h5">Inventario Insumos</h5>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-12 text-sm">Nó</th>
      <th class="table-col-10 text-sm">Marca</th>
      <th class="table-col-20 text-sm" appSortableColumn="nombre">
        Nombre
        <app-sorticon field="nombre" />
      </th>
      <th class="table-col-10 text-sm">Cant.</th>
      <th class="table-col-10 text-sm">Ud.</th>
      <th class="table-col-10 text-sm">Check</th>
      <th class="text-sm">Observaciones</th>
    </tr>
  </ng-template>
  <ng-template #groupheader let-customer>
    <tr>
      <td colspan="7">
        <span class="fw-bold ms-2">{{ customer.clasificacion }}</span>
      </td>
    </tr>
  </ng-template>
  <ng-template #groupfooter let-customer>
    <tr class="p-rowgroup-footer">
      <td colspan="7">
        <div>Total: {{ calcularEquiposTotal(customer.clasificacion) }}</div>
      </td>
    </tr>
  </ng-template>
  <ng-template #body let-item let-rowIndex="rowIndex">
    <tr class="page-break">
      <td>{{ rowIndex + 1 }}</td>
      <td>{{ item.marca }}</td>
      <td>{{ item.nombre }}</td>
      <td>{{ item.cantidad }}</td>
      <td>{{ item.unidad }}</td>
      <td class="text-center">
        <custom-input-check-signal
          [ngModel]="false"
          [disabled]="true"
          [horizontal]="false"
          noMargin
        />
      </td>
      <td></td>
    </tr>
  </ng-template>
</lux-table>
