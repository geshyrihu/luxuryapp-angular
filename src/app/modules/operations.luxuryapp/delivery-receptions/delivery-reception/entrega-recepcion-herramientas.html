<lux-table
  [value]="dataSignal()"
  initialSortField="clasificacion"
  groupRowsBy="clasificacion"
  class="custom-table card d-none d-md-block"
>
  <ng-template #caption>
    <div class="d-flex align-items-center justify-content-between">
      <lux-report-header-web></lux-report-header-web>
      <h5 class="m-0 h5">Inventario Herramientas</h5>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-12 text-sm">Nó</th>
      <th class="table-col-14 text-sm">Foto</th>
      <th class="table-col-15 text-sm">Marca</th>
      <th class="table-col-15 text-sm" appSortableColumn="nombre">
        Nombre
        <app-sorticon field="nombre" />
      </th>
      <th class="table-col-10 text-sm">Check</th>
      <th class="table-col-45 text-sm">Observaciones</th>
    </tr>
  </ng-template>
  <ng-template #groupheader let-item>
    <tr>
      <td colspan="6">
        <span class="fw-bold ms-2">{{ item.clasificacion }}</span>
      </td>
    </tr>
  </ng-template>
  <ng-template #groupfooter let-item>
    <tr class="p-rowgroup-footer">
      <td colspan="6">
        <div>Total: {{ calcularEquiposTotal(item.clasificacion) }}</div>
      </td>
    </tr>
  </ng-template>
  <ng-template #body let-item let-rowIndex="rowIndex">
    <tr class="page-break">
      <td>{{ rowIndex + 1 }}</td>
      <td>
        <img [src]="item.foto" alt="img" width="100" class="shadow" />
      </td>
      <td>{{ item.marca }}</td>
      <td>{{ item.nombre }}</td>
      <td class="text-center">
        <custom-input-check-signal
          [ngModel]="false"
          [disabled]="true"
          [horizontal]="false"
          noMargin
        />
      </td>
      <td>{{ item.observations }}</td>
    </tr>
  </ng-template>
</lux-table>
