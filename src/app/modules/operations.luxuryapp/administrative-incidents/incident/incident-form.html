<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <lux-tabs [tabs]="tabs()" [(activeId)]="activeTab">
    <div tab="datos">
      <div class="row pt-2 g-4">
        <div class="col-12 col-md-6">
          <lux-input-select-signal
            label="Tipo de Incidencia"
            [required]="true"
            [control]="form.controls.incidentTypeId"
            [data]="incidentTypes()"
            [filter]="true"
          />
        </div>
        <div class="col-12 col-md-6">
          <lux-input-select-signal
            label="Nivel de Severidad"
            [required]="true"
            [control]="form.controls.severityLevel"
            [data]="cb_severity()"
            [filter]="true"
          />
        </div>
        <div class="col-12 col-md-6">
          <lux-input-date-time-signal
            label="Fecha y Hora del Incidente"
            [required]="true"
            [control]="form.controls.incidentDateTime"
          />
        </div>
        <div class="col-12 col-md-6">
          <lux-input-select-signal
            label="Tipo de Sanción (opcional)"
            [control]="form.controls.sanctionTypeId"
            [data]="sanctionTypes()"
            placeholder="Sin sanción inmediata"
            [filter]="true"
          />
        </div>
        <div class="col-12">
          <lux-input-textarea-signal
            label="DESCRIPCIÓN"
            [required]="true"
            [control]="form.controls.description"
            [rows]="4"
            placeholder="Describa el incidente con detalle (mínimo 10 caracteres)"
          />
        </div>
      </div>
    </div>

    <div tab="adjuntos">
      @if (id()) {
      <app-incident-attachments [incidentId]="id()" />
      }
    </div>

    <div tab="testigos">
      @if (id()) {
      <app-incident-witnesses [incidentId]="id()" />
      }
    </div>

    <div tab="suspension">
      @if (id()) {
      <app-suspension-days-manager [incidentId]="id()" />
      }
    </div>
  </lux-tabs>

  <!-- ─── FOOTER FIJO ───────────────────────────────────────── -->
  <div
    class="d-flex align-items-center justify-content-between mt-4 pt-3 border-top-1 border"
  >
    <!-- Indicador de estado -->
    <div class="text-sm">
      @if (!id()) {
      <span
        >⚠️ Guarda los datos básicos para habilitar adjuntos, testigos y días de
        suspensión.</span
      >
      } @else {
      <span
        >✅ Incidencia guardada — agrega adjuntos, testigos y días de suspensión
        desde las pestañas.</span
      >
      }
    </div>

    <!-- Acciones -->
    <div class="d-flex">
      @if (activeTab() === 'datos') {
      <lux-button-web
        kind="save"
        type="submit"
        severity="info"
        variant="soft"
        displayMode="both"
        [disabled]="form.invalid"
        [loading]="submitting()"
        [label]="id() ? 'Guardar cambios' : 'Guardar y continuar →'"
      />
      } @if (id()) {
      <lux-button-web
        kind="save"
        type="button"
        severity="info"
        variant="soft"
        displayMode="both"
        label="Finalizar"
        (clicked)="onFinish()"
      />
      }
    </div>
  </div>
</form>
