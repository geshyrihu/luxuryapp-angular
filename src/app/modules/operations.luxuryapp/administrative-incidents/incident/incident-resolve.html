<form [formGroup]="form" (ngSubmit)="onSubmit()" class="d-flex flex-column">
  <lux-input-select-signal
    label="Nuevo Estatus de Investigacion"
    [control]="form.controls.investigationStatus"
    [data]="cb_status()"
    [filter]="true"
  />
  <lux-input-textarea-signal
    label="Notas de Investigacion"
    [control]="form.controls.investigationNotes"
    [rows]="4"
    placeholder="Detalle los hallazgos de la investigacion"
  />
  <lux-input-switch-signal
    label="¿Se aplicara sancion?"
    [control]="form.controls.sanctionApplied"
  />
  <lux-input-textarea-signal
    label="Justificacion"
    [control]="form.controls.decisionRationale"
    [rows]="3"
    placeholder="Obligatorio si no se aplica sancion"
  />
  <div class="d-flex justify-content-end mt-2">
    <lux-button-web
      kind="save"
      type="submit"
      severity="info"
      variant="soft"
      displayMode="both"
      [disabled]="form.invalid"
      [loading]="submitting()"
      label="Resolver"
    />
  </div>
</form>
