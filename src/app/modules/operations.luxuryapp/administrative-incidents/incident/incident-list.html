@if (platformS.isMobile()) {
<app-incident-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [employeeId]="employeeId()"
  (add)="onModalForm($event)"
  (edit)="onEdit($event)"
  (resolve)="onResolve($event)"
/>
} @else {
<app-incident-list-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [employeeId]="employeeId()"
  (add)="onModalForm($event)"
  (edit)="onEdit($event)"
  (resolve)="onResolve($event)"
  (cancel)="onCancel($event)"
  (delete)="onDelete($event)"
  (generateAct)="onGenerateAct($event)"
  (uploadSignedAct)="onUploadSignedAct($event)"
/>
}
