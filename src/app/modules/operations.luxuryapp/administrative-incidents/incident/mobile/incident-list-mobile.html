<div class="card">
  <app-data-view-mobile
    [data]="data()"
    [showAdd]="!!employeeId()"
    (add)="add.emit({ id: '', title: 'Registrar Incidencia' })"
    [globalFilterFields]="globalFilterFields()"
  >
    <ng-template #listItemTemplate let-item>
      <ili-list-item>
        <div
          start
          class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        >
          <app-icon icon="material-symbols-light:error-outline" />
        </div>

        <div class="d-flex justify-content-between align-items-center mb-1">
          <h2 class="fw-bold m-0">{{ item.incidentTypeName }}</h2>
          <span [class]="'badge ' + getSeverityBadge(item.severityLevel)"
            >{{ item.severityLevel }}</span
          >
        </div>
        <p class="text-xs text-body-secondary text-uppercase mb-1">
          {{ item.category }} é {{ item.employeeName }}
        </p>
        <p
          class="text-sm text-body mb-2 overflow-hidden text-truncate white-space-normal"
        >
          {{ item.description }}
        </p>
        <div class="d-flex justify-content-between align-items-center">
          <span [class]="'badge ' + getStatusBadge(item.investigationStatus)"
            >{{ item.investigationStatus }}</span
          >
          <span class="text-xs text-body-secondary"
            >{{ item.incidentDateTime | apiDate:'dd/MM/yyyy HH:mm' }}</span
          >
        </div>

        <ili-action-menu slot="end">
          <ng-container actions>
            <lux-button-mobile
              kind="item"
              label="Editar"
              iconName="create-outline"
              (clicked)="edit.emit(item)"
            />
            <lux-button-mobile
              kind="item"
              label="Resolver"
              iconName="checkmark-circle-outline"
              (clicked)="resolve.emit(item)"
            />
          </ng-container>
        </ili-action-menu>
      </ili-list-item>
    </ng-template>
  </app-data-view-mobile>
</div>
