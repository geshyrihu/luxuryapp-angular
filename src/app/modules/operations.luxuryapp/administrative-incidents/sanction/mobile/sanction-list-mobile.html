<div class="card">
  <app-data-view-mobile [data]="data()" [showAdd]="false">
    <ng-template #listItemTemplate let-item>
      <ili-list-item>
        <div
          start
          class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        >
          <app-icon icon="material-symbols-light:gavel" />
        </div>

        <h2 class="fw-bold">{{ item.sanctionTypeName }}</h2>
        <p class="text-sm text-body-secondary">
          {{ item.severityLevel }} | {{ item.appliedDate | apiDate:'dd/MM/yyyy'
          }}
        </p>
        <p class="text-sm">
          <span
            class="d-inline-flex align-items-center rounded-3xl border-1 border px-2 py-1 text-xs fw-semibold"
            [ngClass]="getStatusBadge(item.sanctionStatus)"
            >{{ item.sanctionStatus }}</span
          >
        </p>

        <ili-action-menu slot="end">
          <ng-container actions>
            <ili-button-item
              label="Cambiar estatus"
              iconName="sync-outline"
              (clicked)="changeStatus.emit(item)"
            />
          </ng-container>
        </ili-action-menu>
      </ili-list-item>
    </ng-template>
  </app-data-view-mobile>
</div>
