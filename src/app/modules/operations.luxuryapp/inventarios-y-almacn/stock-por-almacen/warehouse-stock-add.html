<div class="d-none d-md-block"></div>
<app-table
  [globalFilterFields]="globalFilterFields()"
  [loading]="loading()"
  [paginator]="true"
  [rows]="rows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [totalRecords]="totalRecords"
  [value]="formArray.controls"
  [lazy]="true"
  (onLazyLoad)="onLazyLoad($event)"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card d-none d-md-block"
>
  <ng-template #caption>
    <primeng-custom-caption [showAdd]="false" [dt]="dt" />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="value.nombreProducto" class="table-col-35">
        Producto
        <app-sorticon field="value.nombreProducto" />
      </th>
      <th appSortableColumn="value.existencia">
        Existencia
        <app-sorticon field="value.existencia" />
      </th>
      <th appSortableColumn="value.unidadDeMedidaId">
        Unidad
        <app-sorticon field="value.unidadDeMedidaId" />
      </th>
      <th appSortableColumn="value.stockMax">
        Stok Max
        <app-sorticon field="value.stockMax" />
      </th>
      <th appSortableColumn="value.stockMin">
        Stok Min
        <app-sorticon field="value.stockMin" />
      </th>
      <th class="table-col-5">Agregar</th>
    </tr>
  </ng-template>
  <ng-template #body let-row let-i="rowIndex">
    <ng-container [formGroup]="row">
      <tr>
        <td>
          <p
            (click)="onModalTarjetaProducto(row.value.productoId)"
            class="pointer"
          >
            {{row.value.nombreProducto}}
          </p>
        </td>
        <td>
          <custom-input-number-signal
            [control]="row.controls.existencia"
            mode="decimal"
            [showButtons]="true"
            min="0"
            [horizontal]="false"
          />
        </td>
        <td>
          <custom-input-select-signal
            [data]="cb_UnidadMedida()"
            [control]="row.controls.unidadDeMedidaId"
            placeholder="Seleccione..."
            [horizontal]="false"
            [filter]="true"
          />
        </td>
        <td>
          <custom-input-number-signal
            [control]="row.controls.stockMax"
            mode="decimal"
            [showButtons]="true"
            min="0"
            [horizontal]="false"
          />
        </td>
        <td>
          <custom-input-number-signal
            [control]="row.controls.stockMin"
            mode="decimal"
            [showButtons]="true"
            min="0"
            [max]="row.value.stockMax"
            [horizontal]="false"
          />
        </td>
        <td>
          <div class="d-flex">
            <iw-button-item
              iconClass="material-symbols-light:save"
              lxTooltip="Guardar"
              tooltipPosition="top"
              (clicked)="onSubmit(row)"
            />
          </div>
        </td>
      </tr>
      @if (row.value.errorMessage) {
      <tr class="row-error g-4">
        <td [attr.colspan]="6">
          <div class="text-red-400 text-sm ps-4">
            {{ row.value.errorMessage }}
          </div>
        </td>
      </tr>
      }
    </ng-container>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="formArray.getRawValue()" />
  </ng-template>
</app-table>
