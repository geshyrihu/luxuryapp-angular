<table class="custom-table w-full">
  <thead>
    <tr>
      <th>Tipo</th>
      <th>Ubicación</th>
      <th>Extintores</th>
    </tr>
  </thead>
  <tbody>
    @for (tipo of data; track tipo) {
    <tr>
      <td>{{ tipo.type }}</td>
      <td colspan="3">
        <table>
          <tbody>
            @for (loc of tipo.locations; track loc) {
            <tr>
              <td>{{ loc.location }}</td>
              <td>{{ loc.count }}</td>
              <td>
                <table>
                  <tbody>
                    @for ( ext of loc.extinguishers; track ext ) {
                    <tr>
                      <td>{{ ext.location }}</td>
                    </tr>
                    }
                  </tbody>
                </table>
              </td>
            </tr>
            }
          </tbody>
        </table>
      </td>
    </tr>
    }
  </tbody>
</table>
