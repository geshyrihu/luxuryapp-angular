<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <div class="d-none">
        <custom-input-text-signal
          [control]="form.controls.id"
          hidden
          label="Id"
          [readonly]="true"
        />
      </div>
      <custom-input-text-signal
        [control]="form.controls.name"
        label="Nombre del documento"
        placeholder="Nombre"
      />
      <custom-input-file-signal
        label="Documento"
        accept="application/pdf"
        [required]="true"
        (fileSelected)="change($event)"
      />
      <lux-button-web
        kind="save"
        type="submit"
        severity="info"
        variant="soft"
        displayMode="both"
        [label]="id ? 'Actualizar' : 'Guardar'"
        [disabled]="form.invalid"
        [loading]="submitting()"
      />
  </form>
