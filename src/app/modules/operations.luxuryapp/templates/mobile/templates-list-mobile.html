<lux-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <div start>
        <lux-icon icon="material-symbols-light:description-outline" />
      </div>

      <h3>{{ item.name | uppercase }}</h3>
      <p>Folio: {{ item.folio }}</p>

      <lux-action-menu-mobile slot="end">
        <lux-button-mobile
          kind="edit"
          (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
        />
        <lux-button-mobile
          kind="delete"
          color="danger"
          (clicked)="delete.emit(item.id)"
        />
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
