<div class="card p-0 p-md-4 border-0 shadow-none">
  <lux-table
    #dt
    [value]="diagrams()"
    [rows]="10"
    [paginator]="true"
    [globalFilterFields]="['name']"
    dataKey="id"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} diagramas"
    [showCurrentPageReport]="true"
    [loading]="loading()"
    class="custom-table d-none d-md-block"
  >
    <ng-template #caption>
      <div class="d-flex align-items-center justify-content-between p-2">
        <h5 class="m-0 text-xl fw-bold text-body">Gestión de Diagramas</h5>
        <div class="d-flex gap-2">
          <lux-button-web
            label="Galeróa"
            iconClass="material-symbols-light:photo-library"
            severity="secondary"
            variant="text"
            (clicked)="onOpenGallery()"
          />
          <lux-button-web
            kind="add"
            displayMode="icon"
            severity="primary"
            variant="soft"
            (clicked)="onAddDiagram()"
          />
        </div>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th appSortableColumn="name">Nombre <app-sorticon field="name" /></th>
        <th appSortableColumn="updateAt" class="table-col-15rem">
          óltima Actualización <app-sorticon field="updateAt" />
        </th>
        <th class="table-col-actions">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-diagram>
      <tr>
        <td class="fw-medium text-body">{{ diagram.name }}</td>
        <td class="text-body-secondary">
          {{ diagram.updateAt | apiDate: 'dd/MM/yyyy HH:mm' }}
        </td>
        <td>
          <div class="d-flex justify-content-center gap-2">
            <lux-button-web displayMode="icon"
              iconClass="material-symbols-light:edit"
              (clicked)="onEditDiagram(diagram.id)"
              ngbTooltip="Editar Propiedades"
              variant="text"
              severity="secondary"
              lxTooltip="Propiedades"
              tooltipPosition="top"
            />
            <lux-button-web displayMode="icon"
              iconClass="material-symbols-light:palette"
              (clicked)="onOpenEditor(diagram.id)"
              ngbTooltip="Abrir Editor Grófico"
              variant="text"
              severity="info"
              lxTooltip="Editor"
              tooltipPosition="top"
            />
            <lux-button-web displayMode="icon"
              iconClass="material-symbols-light:visibility-outline"
              (clicked)="onViewDiagram(diagram.id)"
              ngbTooltip="Visualizar Diagrama"
              variant="text"
              severity="success"
              lxTooltip="Ver"
              tooltipPosition="top"
            />
            <lux-button-web
              kind="delete"
              displayMode="icon"
              severity="danger"
              variant="soft"
              size="sm"
              tooltip="Eliminar"
              ariaLabel="Eliminar"
              (clicked)="onDeleteDiagram(diagram.id)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #summary>
      <div
        class="d-flex align-items-center justify-content-between text-body-secondary italic"
      >
        En total hay {{ diagrams() ? diagrams().length : 0 }} diagramas.
      </div>
    </ng-template>
    <ng-template #emptymessage>
      <lux-table-empty-message [colspan]="3" />
    </ng-template>
  </lux-table>
</div>

<lux-data-view-mobile
  [data]="diagrams()"
  [globalFilterFields]="['name']"
  (add)="onAddDiagram()"
>
  <ng-template #listItemTemplate let-diagram>
    <lux-list-item-mobile>
      <div
        start
        class="d-flex align-items-center justify-content-center bg-green-50 rounded-md ms-3 w-3rem h-3rem flex-shrink-0"
      >
        <lux-icon
          icon="material-symbols-light:call-split"
          class="text-2xl text-green-600"
        />
      </div>

      <h3 class="fw-bold text-body">{{ diagram.name }}</h3>
      <p class="text-body-secondary">
        {{ diagram.updateAt | apiDate:'dd/MM/yyyy HH:mm' }}
      </p>

      <lux-action-menu-mobile slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="onEditDiagram(diagram.id)"
          />
          <lux-button-web
            iconClass="material-symbols-light:palette"
            (clicked)="onOpenEditor(diagram.id)"
            label="Editor"
            variant="text"
            severity="info"
          />
          <lux-button-web
            iconClass="material-symbols-light:visibility-outline"
            (clicked)="onViewDiagram(diagram.id)"
            label="Ver"
            variant="text"
            severity="success"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="onDeleteDiagram(diagram.id)"
          />
        </ng-container>
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
