<lux-table-web [value]="dataSignal()" class="custom-table card d-none d-md-block">
  <ng-template #header>
    <tr>
      <th>Archivo</th>
      <th>Nombre</th>
      <th class="table-col-5">Borrar</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <iw-button-item
          [tooltip]="'Visualizar ' + item.nameDocument"
          (clicked)="viewPdf(item.document, item.nameDocument)"
        >
          <lux-icon [icon]="'material-symbols-light:picture-as-pdf'" class="icon icon- label-icon text-danger" />
        </iw-button-item>
      </td>
      <td>{{ item.nameDocument }}</td>
      <td>
        <div class="d-flex justify-content-center">
          <iw-button-delete (confirmed)="deleteDoc(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message-web [colspan]="7" />
  </ng-template>
</lux-table-web>
