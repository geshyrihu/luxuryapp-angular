<lux-table [value]="dataSignal()" class="custom-table card d-none d-md-block">
  <ng-template #header>
    <tr>
      <th>Archivo</th>
      <th>Nombre</th>
      <th class="table-col-5">Borrar</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <lux-button-web
          kind="item"
          displayMode="icon"
          severity="secondary"
          variant="soft"
          [tooltip]="'Visualizar ' + item.nameDocument"
          (clicked)="viewPdf(item.document, item.nameDocument)"
        />
      </td>
      <td>{{ item.nameDocument }}</td>
      <td>
        <div class="d-flex justify-content-center">
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            ariaLabel="Eliminar"
            (clicked)="deleteDoc(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="7" />
  </ng-template>
</lux-table>
