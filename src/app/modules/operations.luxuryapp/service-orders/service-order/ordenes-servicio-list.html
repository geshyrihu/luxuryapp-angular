@if (platformS.isMobile()) {
<app-ordenes-servicio-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [fechaControl]="fechaControl"
  [filtroEquiposValue]="filtroEquiposValue"
  [filtroId]="filtroId"
  [filtroEquipos]="filtroEquipos"
  (reloadOrdenes)="onReloadOrdenes($event.id, $event.value)"
  (edit)="onEdit($event)"
  (delete)="onDelete($event)"
  (report)="onNavigateToReport()"
  (reportTabla)="onNavigateToReportTabla()"
  (reportPorEquipo)="onNavigateToReportPorEquipo()"
  (photos)="onModalFotos($event)"
  (providerReport)="onModalRpeorteProveedor($event)"
  (uploadImg)="onModalFormUploadImg($event)"
  (uploadDoc)="onModalFormUploadDoc($event)"
  (followUp)="onModalSeguimiento($event)"
  (resume)="onResume($event)"
  (suspend)="onModalSuspension($event)"
/>
} @else {
<app-ordenes-servicio-list-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [fechaControl]="fechaControl"
  [filtroEquiposValue]="filtroEquiposValue"
  [filtroId]="filtroId"
  [filtroEquipos]="filtroEquipos"
  (reloadOrdenes)="onReloadOrdenes($event.id, $event.value)"
  (edit)="onEdit($event)"
  (delete)="onDelete($event)"
  (help)="onModalAyuda()"
  (report)="onNavigateToReport()"
  (reportTabla)="onNavigateToReportTabla()"
  (reportPorEquipo)="onNavigateToReportPorEquipo()"
  (photos)="onModalFotos($event)"
  (providerReport)="onModalRpeorteProveedor($event)"
  (uploadImg)="onModalFormUploadImg($event)"
  (uploadDoc)="onModalFormUploadDoc($event)"
  (followUp)="onModalSeguimiento($event)"
  (resume)="onResume($event)"
  (suspend)="onModalSuspension($event)"
  (navigateMessage)="onNavigateMessage($event.id, $event.status, $event.nameGroup)"
/>
}

<style>
  @media print {
    body {
      visibility: visible !important;
      background-color: white !important;
      color: black !important;
    }

    app-topbar,
    app-footer,
    app-sidebar,
    .layout-topbar,
    .layout-sidebar,
    .layout-footer {
      display: none !important;
    }

    .custom-table {
      display: block !important;
      visibility: visible !important;
      width: 100% !important;
    }

    .hidden.md\:block {
      display: block !important;
    }

    app-data-view-mobile {
      display: none !important;
    }

    .p-datatable-header,
    .p-paginator-bottom,
    .no-print {
      display: none !important;
    }

    .p-datatable table {
      width: 100% !important;
      border-collapse: collapse !important;
    }

    .p-datatable th,
    .p-datatable td {
      border: 1px solid #ddd !important;
      padding: 4px !important;
      font-size: 10px !important;
    }

    .p-tag {
      border: 1px solid #000;
      color: black !important;
      font-weight: bold;
    }

    @page {
      size: landscape;
      margin: 1cm;
    }
  }
</style>
