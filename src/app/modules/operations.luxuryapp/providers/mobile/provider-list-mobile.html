<app-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="w-3rem h-3rem rounded-lg bg-green-50 d-flex align-items-center justify-content-center flex-shrink-0 ms-3"
      >
        <app-icon
          icon="material-symbols-light:store-outline"
          class="text-green-600 text-xl"
        />
      </div>

      <h3 class="fw-bold text-body">{{ item.nameComercial }}</h3>
      <p class="text-sm text-body-secondary">
        {{ item.nameProvider }} é {{ item.tipoServicio }}
      </p>
      <p class="text-xs text-body-secondary">{{ item.phoneOne }}</p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.providerId, title: 'Editar' })"
          />
          <ili-button-delete
            (confirmed)="delete.emit(item.providerId)"
            label="Eliminar"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
