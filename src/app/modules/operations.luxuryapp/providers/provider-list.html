@if (platformS.isMobile()) {
<app-provider-list-mobile
  [data]="mobileData()"
  [globalFilterFields]="mobileGlobalFilterFields"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
} @else {
<app-provider-list-desktop
  [data]="dataSignal()"
  [serviceTypes]="serviceTypes"
  [serviceTypeControl]="selectedServiceTypeControl"
  [rolAuth]="rolAuth"
  [label]="label"
  [page]="page"
  [rows]="rows"
  [totalRecords]="totalRecords"
  [rowsPerPageOptions]="rowsPerPageOptions"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
  (filter)="applyGlobalFilter($event)"
  (serviceTypeChange)="onServiceTypeChange($event)"
  (pageChange)="onPageChange($event)"
  (showCard)="showModalCardProveedor($event)"
  (calificar)="showModalCalificarProveedor($event)"
  (activate)="onActivateProvider($event)"
  (authorized)="onAutorizarProvider($event)"
  (coincidencias)="onConicidencias($event)"
/>
}
