<div class="d-flex w-full" role="group" aria-label="Acciones de Reporte">
  <il-button
    iconClass="material-symbols-light:visibility-outline"
    label="Vista Previa"
    variant="outline"
    customClass="w-100"
    (clicked)="onPreview()"
  />

  <il-button
    iconClass="material-symbols-light:upload"
    label="Enviar Reporte"
    variant="outline"
    customClass="w-100"
    (clicked)="onSendReport()"
  />
</div>
