<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <custom-input-select-signal
    [control]="form.controls.workGroupId"
    label="Grupo de trabajo"
    placeholder="Selecciona un grupo"
    [data]="workGroups()"
    [filter]="true"
    (selectionChange)="onWorkGroupChange($event)"
  />

  <custom-input-text-signal
    [control]="form.controls.title"
    label="Título"
    placeholder="Título de la plantilla"
  />

  <custom-input-textarea-signal
    [control]="form.controls.description"
    label="DESCRIPCIÓN"
    placeholder="DESCRIPCIÓN"
  />

  <app-recurrence-input
    [label]="'Regla de Recurrencia'"
    formControlName="recurrenceRule"
  ></app-recurrence-input>

  <custom-input-select-signal
    [control]="form.controls.criticality"
    label="Criticidad"
    placeholder="Selecciona la criticidad"
    [data]="criticalities()"
  />

  <custom-input-text-signal
    [control]="form.controls.expectedDeliverableName"
    label="Entregable esperado"
    placeholder="Nombre del entregable"
  />

  <custom-input-check-signal
    [control]="form.controls.requiresAttachment"
    label="Requiere adjunto"
  />

  <div class="row g-4">
    <div class="col-12 col-md-6">
      <web-custom-input-datepicker-signal
        [control]="form.controls.startDate"
        label="Fecha de inicio"
      />
    </div>
    <div class="col-12 col-md-6">
      <web-custom-input-datepicker-signal
        [control]="form.controls.endDate"
        label="Fecha de fin"
        [showClear]="true"
      />
    </div>
  </div>

  <section class="card mb-3">
    <button
      type="button"
      class="card-header w-100 border-0 bg-transparent text-start d-flex justify-content-between align-items-center"
      [class.collapsed]="collapsed()"
      [attr.aria-expanded]="!collapsed()"
      (click)="collapsed.update((value) => !value)"
    >
      <span>Avanzado</span>
      <span aria-hidden="true">{{ collapsed() ? "▸" : "▾" }}</span>
    </button>
    <div class="collapse" [class.show]="!collapsed()">
      <div class="card-body">
    <custom-input-number-signal
      [control]="form.controls.advanceNoticeDays"
      label="Días de aviso previo"
      [min]="0"
      [max]="30"
      [showButtons]="true"
    />

    <custom-input-select-signal
      [control]="form.controls.backupUserId"
      label="Responsable de respaldo"
      placeholder="Selecciona un responsable"
      [data]="backupUsers()"
      [required]="isBackupRequired()"
      [filter]="true"
    />

    @if (form.hasError("backupRequiredForCritical")) {
    <small class="p-error">
      Las plantillas críticas requieren responsable de respaldo.
    </small>
    }
      </div>
    </div>
  </section>

  <il-button-save
    [propertyId]="templateId()"
    [disabled]="form.invalid"
    [submitting]="submitting()"
  />
</form>
