@if (platformS.isMobile()) {
  <app-special-document-list-mobile [data]="dataSignal()" />
} @else {
  <app-special-document-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [title]="title"
    (add)="onModalForm($event)"
    (rowReorder)="onRowReorder($event)"
  />
}
