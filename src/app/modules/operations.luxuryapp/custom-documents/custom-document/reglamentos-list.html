<!-- Vista de escritorio -->
<app-table
  [reorderableRows]="true"
  [reorderableColumns]="true"
  (onRowReorder)="onRowReorder($event)"
  [globalFilterFields]="globalFilterFields"
  [value]="dataSignal()"
  #dt
  class="custom-table card d-none d-md-block"
>
  <ng-template #caption>
    <primeng-custom-caption [showAdd]="false" [dt]="dt" />
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-5rem"></th>
      <th class="bg-gradient text-white text-center" appSortableColumn="folio">
        Folio
        <app-sorticon field="folio" />
      </th>
      <th class="bg-gradient text-white text-center">Fecha</th>
      <th class="text-center" appSortableColumn="name">
        Nombre
        <app-sorticon field="name" />
      </th>
      <th class="text-center">Descargar</th>
    </tr>
  </ng-template>
  <ng-template #body let-item let-index="rowIndex">
    <tr [pReorderableRow]="index">
      <td>
        <div>
          <app-icon
            icon="material-symbols-light:menu"
            class="icon"
            pReorderableRowHandle
          />
        </div>
      </td>
      <td class="text-center">{{ item.folio }}</td>
      <td class="text-center">{{ item.createAt }}</td>
      <td class="text-center text-break">{{ item.name }}</td>
      <td class="text-center d-flex justify-content-center">
        <iw-button-view-pdf [url]="item.path" fileName="Reglamentos" />
        <iw-button
          lxTooltip="IA"
          tooltipPosition="top"
          iconClass="material-symbols-light:forum"
          variant="outline"
          severity="info"
          size="sm"
          (clicked)="openConsultation(item.id)"
          ngbTooltip="Consultar Reglamento con IA"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="5" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</app-table>

<div class="d-block d-md-none">
  <app-data-view-mobile
    [data]="dataSignal()"
    [showAdd]="false"
    [globalFilterFields]="globalFilterFields()"
  >
    <ng-template #listItemTemplate let-item>
      <ili-list-item>
        <div
          start
          class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg w-3rem h-3rem bg-primary-50"
        >
          <app-icon
            icon="material-symbols-light:balance"
            class="text-xl text-primary"
          />
        </div>

        <div class="d-flex justify-content-between align-items-center mb-1">
          <h2 class="fw-bold m-0 text-base text-wrap">{{ item.name }}</h2>
        </div>
        <p class="text-sm text-body-secondary m-0">
          <app-icon
            [icon]="'material-symbols-light:currency-pound'"
            class="me-1 text-xs"
          />
          Folio: {{ item.folio }}
        </p>
        <p class="text-sm text-body-secondary m-0">
          <app-icon
            [icon]="'material-symbols-light:calendar-today'"
            class="me-1 text-xs"
          />
          Fecha: {{ item.createAt }}
        </p>

        <div end class="d-flex align-items-center gap-1">
          <il-button-view-pdf [url]="item.path" pdf="Reglamento" />
          <iw-button
            iconClass="material-symbols-light:forum"
            severity="info"
            variant="text"
            (clicked)="openConsultation(item.id)"
            lxTooltip="Consultar con IA"
            tooltipPosition="bottom"
          />
        </div>
      </ili-list-item>
    </ng-template>
  </app-data-view-mobile>
</div>

<lx-modal
  header="?? Asistente Legal Virtual"
  [visible]="showConsultationDialog()"
  (visibleChange)="showConsultationDialog.set($event)"
>
  <div class="d-flex flex-column">
    <div class="p-message p-message-info border-0 m-0 shadow-none">
      <div class="p-message-wrapper p-3">
        <span
          class="p-message-icon material-symbols-light:info text-xl"
        ></span>
        <span class="p-message-text ms-2"
          >Haz una pregunta específica sobre este reglamento y la IA analizaré
          el documento para responderte.</span
        >
      </div>
    </div>

    <div class="mb-4">
      <label for="query" class="fw-bold d-block mb-2">Tu Consulta</label>
      <custom-input-textarea-signal
        id="query"
        [rows]="4"
        placeholder="Ej. óCuóles son las sanciones por ruido excesivo? óCuól es el horario de la alberca?"
        [control]="consultationQueryControl"
        customClass="w-100"
        [disabled]="consultingDoc()"
        [horizontal]="false"
        [noMargin]="true"
      />
    </div>

    @if (aiResponse()) {
    <div class="bg-body-tertiary p-3 rounded-xl">
      <div class="d-flex align-items-center mb-2 text-primary fw-bold">
        <app-icon [icon]="'material-symbols-light:auto-awesome-motion'" />
        <span>Respuesta del Asistente</span>
      </div>
      <div
        [innerHTML]="aiResponse()"
        class="line-height-3 text-body text-justify"
      ></div>
    </div>
    }
  </div>

  <ng-template #footer>
    <il-button
      label="Cancelar"
      iconClass="material-symbols-light:close"
      variant="text"
      [disabled]="consultingDoc()"
      (clicked)="showConsultationDialog.set(false)"
    />
    <il-button
      label="Consultar"
      iconClass="material-symbols-light:search"
      [loading]="consultingDoc()"
      [disabled]="!consultationQueryControl.value?.trim()"
      (clicked)="consultAi()"
    />
  </ng-template>
</lx-modal>
