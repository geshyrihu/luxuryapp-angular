<app-data-view-mobile
  [data]="data()"
  [showAdd]="false"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg w-3rem h-3rem bg-primary-50"
      >
        <app-icon
          icon="material-symbols-light:group-outline"
          class="text-xl text-primary"
        />
      </div>

      <div class="d-flex justify-content-between align-items-center mb-1">
        <h2 class="fw-bold m-0 text-base text-wrap">{{ item.name }}</h2>
      </div>
      <p class="text-sm text-body-secondary m-0">
        <app-icon
          [icon]="'material-symbols-light:currency-pound'"
          class="me-1 text-xs"
        />
        Folio: {{ item.folio }}
      </p>
      <p class="text-sm text-body-secondary m-0">
        <app-icon
          [icon]="'material-symbols-light:calendar-today'"
          class="me-1 text-xs"
        />
        Fecha: {{ item.createAt }}
      </p>

      <div end class="d-flex align-items-center">
        <lux-pdf-viewer-trigger [url]="item.path" fileName="Documento Asamblea" />
      </div>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
