<lux-table
  [globalFilterFields]="globalFilterFields()"
  [value]="data()"
  #dt
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption [showAdd]="false" [showSearch]="false" [dt]="dt" />
  </ng-template>
  <ng-template #header>
    <tr>
      <th
        class="bg-gradient text-white text-center"
        appSortableColumn="folio"
      >
        Folio
        <app-sorticon field="folio" />
      </th>
      <th class="bg-gradient text-white text-center">Fecha</th>
      <th class="text-center" appSortableColumn="name">
        Nombre
        <app-sorticon field="name" />
      </th>
      <th class="text-center">Descargar</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td class="text-center">{{ item.folio }}</td>
      <td class="text-center">{{ item.createAt }}</td>
      <td class="text-center text-break">{{ item.name }}</td>
      <td class="text-center">
        <iw-button-view-pdf [url]="item.path" pdf="Documento" />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="4" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
