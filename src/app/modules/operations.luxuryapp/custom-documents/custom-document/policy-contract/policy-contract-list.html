@if (platformS.isMobile()) {
  <app-policy-contract-list-mobile
    [groupedData]="groupedData"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm($event)"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
    (deleteDocument)="onDeleteDocument($event)"
  />
} @else {
  <app-policy-contract-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [isCurrent]="isCurrent"
    (add)="onModalForm($event)"
    (edit)="onModalForm($event)"
    (delete)="onDelete($event)"
    (deleteDocument)="onDeleteDocument($event)"
    (selectActive)="onSelectActive($event)"
  />
}
