<app-data-view-mobile
  [groupedData]="groupedData()"
  [isGrouped]="true"
  [showAdd]="true"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg w-3rem h-3rem bg-primary-50"
      >
        <lux-icon
          icon="material-symbols-light:edit-note"
          class="text-xl text-yellow-500"
        />
      </div>

      <div class="d-flex justify-content-between align-items-center mb-1">
        <h2 class="fw-bold m-0 text-base text-wrap">{{ item.provider }}</h2>
        <lux-tag
          [severity]="getTagSeverity(item.tagLabel)"
          [value]="item.tagLabel"
          class="text-sm"
        />
      </div>
      <p class="text-sm text-body m-0 mb-1">{{ item.description }}</p>
      <p class="text-xs text-body-secondary m-0">
        <lux-icon
          [icon]="'material-symbols-light:calendar-today'"
          class="me-1"
        />
        Inicio: {{ item.startDate }}
      </p>

      <ili-action-menu end>
        <ng-container actions>
          <lux-pdf-viewer-trigger-mobile
            [url]="item.pathDocument"
            fileName="Poliza | Contrato"
            label="Ver PDF"
          />
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
          @if (item.document) {
          <lux-button-mobile
            kind="delete"
            color="danger"
            label="Eliminar documento"
            ngbTooltip="Eliminar documento"
            (clicked)="deleteDocument.emit(item.id)"
          />
          }
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
