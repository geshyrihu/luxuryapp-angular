<form autocomplete="off" (ngSubmit)="submit()" [formGroup]="form">
  <lux-input-text-signal
    [control]="form.controls.id"
    hidden
    label="Id"
    [hidden]="false"
  />

  <lux-input-autocomplete-signal
    (propagar)="saveProviderId($event)"
    [control]="form.controls.providerName"
    [data]="cb_providers()"
    label="Proveedor"
    placeholder="Escribe para buscar  proveedor"
  />

  <lux-input-text-signal
    [control]="form.controls.description"
    label="DESCRIPCIÓN"
    [placeholder]="'DESCRIPCIÓN'"
  />

  <lux-input-select-signal
    [control]="form.controls.typeOfContract"
    label="Tipo de contrato"
    [data]="cb_type_of_contract()"
    [filter]="true"
  />

  <lux-input-select-signal
    [control]="form.controls.isCurrent"
    label="Activo"
    [data]="cb_isCurrent()"
    [filter]="true"
  />

  <lux-input-check-signal
    [control]="form.controls.endDateIndefinite"
    (checkChange)="onEndDateIndefiniteChange()"
    label="Fin Indefinida"
  />

  <lux-input-date-signal
    [control]="form.controls.startDate"
    label="Inicio"
    placeholder="fecha de entrada"
  />

  <lux-input-date-signal [control]="form.controls.endDate" label="Fin" />

  <lux-input-file-signal
    [control]="form.controls.document"
    (fileSelected)="uploadFile($event)"
    label="Documento"
    accept="application/pdf"
  ></lux-input-file-signal>

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    [label]="id() ? 'Actualizar' : 'Guardar'"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
