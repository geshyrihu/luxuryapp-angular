@if (platformS.isMobile()) {
<app-mis-proveedores-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
} @else {
<app-mis-proveedores-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
/>
}
