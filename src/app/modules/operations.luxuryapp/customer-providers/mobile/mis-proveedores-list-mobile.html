<app-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="w-3rem h-3rem rounded-md bg-green-50 d-flex align-items-center justify-content-center flex-shrink-0 ms-3"
      >
        <app-icon
          icon="material-symbols-light:store-outline"
          class="text-xl text-green-500"
        />
      </div>

      <h3>{{ item.nameComercial }}</h3>
      <p>{{ item.service }}</p>

      <ili-action-menu slot="end">
        <ili-button-edit
          (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          label="Editar"
        />
        <ili-button-delete (confirmed)="delete.emit(item.id)" label="Eliminar" />
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
