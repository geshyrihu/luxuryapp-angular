<form autocomplete="off" (ngSubmit)="submit()" [formGroup]="form">
  <div class="mb-4">
    @if(cb_providers().length == 0){
    <div class="text-center">
      <p>Cargando listado de proveedores</p>
      <lux-icon
        [icon]="'material-symbols-light:progress-activity'"
        class="text-primary m-1"
        aria-label="Cargando..."
      />
    </div>
    }@else {
    <lux-input-autocomplete-signal
      (propagar)="saveProviderId($event)"
      [control]="form.controls.providerName"
      [data]="cb_providers()"
      label="Proveedor"
      [horizontal]="false"
      placeholder="Escribe para buscar proveedor"
    />
    }
  </div>
  <div class="mb-4">
    @if(cb_categories().length == 0){
    <div class="text-center">
      <p>Cargando listado de categorias</p>
      <lux-icon
        [icon]="'material-symbols-light:progress-activity'"
        class="text-primary m-1"
        aria-label="Cargando..."
      />
    </div>
    } @else {
    <lux-input-autocomplete-signal
      (propagar)="saveCategoryId($event)"
      [control]="form.controls.categoryName"
      [data]="cb_categories()"
      label="Servicio"
      [horizontal]="false"
      placeholder="Escribe para buscar tipo de servicio"
    />
    }
  </div>

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    [label]="id ? 'Actualizar' : 'Guardar'"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
