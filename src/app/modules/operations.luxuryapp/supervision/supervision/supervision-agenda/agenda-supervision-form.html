<form autocomplete="off" (ngSubmit)="submit()" [formGroup]="form">
  <lux-input-text-signal
    [control]="form.controls.id"
    hidden
    [horizontal]="false"
    label="Id"
  />

  <lux-input-date-signal
    [control]="form.controls.fechaSolicitud"
    label="Fecha de solicitud"
    [horizontal]="false"
    placeholder="fecha de solicitud"
  />

  <lux-input-select-signal
    [control]="form.controls.customerId"
    label="Cliente"
    [horizontal]="false"
    [data]="cb_customer()"
    [filter]="true"
  />

  <lux-input-textarea-signal
    [control]="form.controls.problema"
    label="Problema"
    placeholder="problema"
    [horizontal]="false"
  />

  <lux-input-textarea-signal
    [control]="form.controls.solucion"
    label="Solución"
    placeholder="solución"
    [horizontal]="false"
  />

  <lux-input-date-signal
    [control]="form.controls.fechaConclusion"
    label="Fecha de conclusión"
    [horizontal]="false"
    placeholder="fecha de conclusión"
  />
  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    label="Guardar"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
