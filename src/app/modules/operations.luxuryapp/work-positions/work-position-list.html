@if (platformS.isMobile()) {
<app-work-position-list-mobile
  [data]="filteredData()"
  [globalFilterFields]="globalFilterFields()"
  [departamentLabels]="departamentLabels"
  (details)="onModalDetails($event)"
  (administerEmployee)="
    onAdministerEmployee($event.employeeId, $event.userId)
  "
  (cardEmployee)="onCardEmployee($event)"
  (requestDelete)="onRequestDelete($event)"
/>
} @else {
<app-work-position-list-desktop
  [data]="filteredData()"
  [globalFilterFields]="globalFilterFields()"
  [departmentFilterItems]="departmentFilterItems()"
  [selectedDepartment]="selectedDepartment()"
  [statusFilter]="statusFilter()"
  [showSalaryColumn]="showSalaryColumn()"
  [scrollHeight]="scrollHeight()"
  [departamentLabels]="departamentLabels"
  (statusFilterChange)="onStatusFilterChange($event)"
  (departmentChange)="selectedDepartment.set($event)"
  (details)="onModalDetails($event)"
  (administerEmployee)="
    onAdministerEmployee($event.employeeId, $event.userId)
  "
  (cardEmployee)="onCardEmployee($event)"
  (requestDelete)="onRequestDelete($event)"
/>
}
