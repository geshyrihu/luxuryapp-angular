@if (platformS.isMobile()) {
  <app-product-output-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [isSuperUsuario]="aspRoleS.roleSignal(AspRole.SuperUsuario)()"
    (edit)="onEditSalida($event)"
    (returnProduct)="onReturnProduct($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-product-output-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    [selectedDateControl]="selectedDateControl"
    [filterControl]="filterControl"
    [isSuperUsuario]="aspRoleS.roleSignal(AspRole.SuperUsuario)()"
    (lazyLoad)="loadDataLazy($event)"
    (loadData)="onLoadData()"
    (clearFilter)="clearFilter()"
    (generateReport)="onGenerateReport()"
    (edit)="onEditSalida($event)"
    (returnProduct)="onReturnProduct($event)"
    (delete)="onDelete($event)"
  />
}
