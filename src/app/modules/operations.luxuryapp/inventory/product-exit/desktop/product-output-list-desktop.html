<div class="card">
  <lux-table
    [value]="data()"
    [lazy]="true"
    (onLazyLoad)="lazyLoad.emit($event)"
    [paginator]="true"
    [rows]="tableRows"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="true"
    #dt
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    class="custom-table"
    [globalFilterFields]="globalFilterFields()"
  >
    <ng-template #caption>
      <div
        class="d-flex flex-column flex-md-row justify-content-md-between align-items-md-center g-4"
      >
        <div class="d-flex flex-column flex-md-row align-items-md-center g-4">
          <div class="p-inputgroup w-full md:w-auto">
            <custom-input-datepicker-signal
              [control]="selectedDateControl()"
              (dateSelect)="loadData.emit()"
              [showIcon]="true"
              [dateFormat]="'mm/yy'"
              placeholder="Filtrar por Mes"
              [dateStyle]="{ minWidth: '200px' }"
              [readonlyInput]="true"
              [showButtonBar]="false"
            />
            @if (selectedDateControl().value) {
            <lux-button-web displayMode="icon"
              iconClass="material-symbols-light:close"
              (clicked)="clearFilter.emit()"
              severity="danger"
            />
            }
          </div>

          <lux-button-web
            kind="download"
            displayMode="icon"
            severity="success"
            variant="soft"
            tooltip="Generar Reporte"
            tooltipPosition="top"
            iconClass="material-symbols-light:table-view"
            (clicked)="generateReport.emit()"
          />
        </div>

        <div class="p-inputgroup w-full md:w-auto mt-3 mt-md-0">
          <custom-input-text-signal
            [control]="filterControl()"
            (keyup.enter)="loadData.emit()"
            placeholder="Buscar..."
            [horizontal]="false"
          />
          <lux-button-web displayMode="icon"
            iconClass="material-symbols-light:search"
            (clicked)="loadData.emit()"
            severity="primary"
          />
        </div>
      </div>
    </ng-template>
<ng-template #header>
    <tr>
      <th appSortableColumn="fechaSalida">
        FECHA SALIDA
        <app-sorticon field="fechaSalida" />
      </th>
      <th appSortableColumn="producto">
        PRODUCTO
        <app-sorticon field="producto" />
      </th>
      <th appSortableColumn="cantidad">
        CANTIDAD
        <app-sorticon field="cantidad" />
      </th>
      <th appSortableColumn="unidadMedida">
        UNIDAD
        <app-sorticon field="unidadMedida" />
      </th>
      <th appSortableColumn="quienUso">
        RECIBIO
        <app-sorticon field="quienUso" />
      </th>
      <th appSortableColumn="usoPrducto">
        USO
        <app-sorticon field="usoPrducto" />
      </th>
      @if (isSuperUsuario()) {
      <th class="table-col-5"></th>
      }
    </tr>
  </ng-template>
    <ng-template #body let-item>
      <tr>
        <td>{{ item.fechaSalida | apiDate:'mediumDate' }}</td>
        <td>{{ item.producto }}</td>
        <td>{{ item.cantidad }}</td>
        <td>{{ item.unidadMedida }}</td>
        <td>{{ item.quienUso }}</td>
        <td>{{ item.usoPrducto }}</td>
        <td class="no-print">
          <div class="d-flex">
            @if (isSuperUsuario()) {
            <lux-button-web
              kind="edit"
              displayMode="icon"
              severity="info"
              variant="soft"
              size="sm"
              tooltip="Editar"
              ariaLabel="Editar"
              (clicked)="
                    edit.emit({
                      id: item.id,
                      idInventarioProducto: item.idInventarioProducto,
                      idProducto: item.productoId,
                      almacenId: item.almacenId,
                      nombreProducto: item.producto
                    })
                  "
            />
            }
            <lux-button-web size="sm"
              kind="item"
              displayMode="icon"
              severity="secondary"
              variant="soft"
              tooltip="Devolver"
              tooltipPosition="top"
              [disabled]="item.cantidadDevuelta >= item.cantidad"
              (clicked)="returnProduct.emit(item)"
            />

            <lux-button-web
              kind="delete"
              displayMode="icon"
              severity="danger"
              variant="soft"
              size="sm"
              tooltip="Eliminar"
              ariaLabel="Eliminar"
              (clicked)="delete.emit(item.id)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <lux-table-empty-message [colspan]="7" />
    </ng-template>
    <ng-template #paginatorleft>
      <lux-table-footer [data]="data()" />
    </ng-template>
  </lux-table>
</div>
