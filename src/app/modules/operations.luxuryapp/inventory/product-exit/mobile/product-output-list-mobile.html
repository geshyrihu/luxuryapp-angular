<app-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
      >
        <app-icon icon="material-symbols-light:download" />
      </div>

      <div class="d-flex flex-column">
        <h6 class="mb-0">{{ item.producto }}</h6>
        <small class="text-body-secondary">
          {{ item.cantidad }} {{ item.unidadMedida }} - {{ item.quienUso }}
        </small>
        <small class="text-body-secondary">
          Uso: {{ item.usoPrducto }} | {{ item.fechaSalida |
          apiDate:'mediumDate' }}
        </small>
      </div>

      <ili-action-menu end>
        <ng-container actions>
          @if (isSuperUsuario()) {
          <ili-button-item
            (clicked)="
                edit.emit({
                  id: item.id,
                  idInventarioProducto: item.idInventarioProducto,
                  idProducto: item.productoId,
                  almacenId: item.almacenId,
                  nombreProducto: item.producto
                })
              "
            label="Editar"
            iconName="create-outline"
          />
          }
          <ili-button-item
            (clicked)="returnProduct.emit(item)"
            label="?? Devolver"
            [disabled]="item.cantidadDevuelta >= item.cantidad"
          />

          <ili-button-delete (confirmed)="delete.emit(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
