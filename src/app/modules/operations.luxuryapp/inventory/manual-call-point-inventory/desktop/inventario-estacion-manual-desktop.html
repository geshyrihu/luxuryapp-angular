<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <div class="d-flex justify-content-between align-items-center w-full">
      <div class="d-flex align-items-center gap-2">
        <iw-button-item
          (clicked)="openScanner.emit()"
          [iconClass]="'material-symbols-light:qr-code'"
          tooltip="Escanear QR"
        />
        <iw-button-item
          (clicked)="downloadPdf.emit()"
          ariaLabel="Descargar PDF"
          iconClass="material-symbols-light:picture-as-pdf"
          lxTooltip="Descargar PDF"
          tooltipPosition="top"
        />
        <iw-button-download
          (clicked)="downloadAllQr.emit()"
          lxTooltip="QR"
          tooltipPosition="top"
          tooltip="Descargar todos los QR"
        />
        <iw-button-download
          (clicked)="downloadTemplate.emit()"
          lxTooltip="Plantilla"
          tooltipPosition="top"
          tooltip="Descargar plantilla Excel"
        />
        <iw-button-download
          (clicked)="fileInput.click()"
          lxTooltip="Importar"
          tooltipPosition="top"
          tooltip="Importar desde Excel"
        />
        <input
          type="file"
          accept=".xlsx"
          class="d-none"
          #fileInput
          (change)="importExcel.emit($event)"
        />
        <button class="btn btn-danger btn-sm" (click)="deleteAll.emit()" type="button">
          Eliminar Todo
        </button>
      </div>
      <lux-table-caption
        [title]="'Inventario de Estaciones Manuales'"
        (add)="add.emit()"
        [dt]="dt"
      />
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-5">FOTO</th>
<th class="table-col-15" appSortableColumn="localCode">
         CÓDIGO <app-sorticon field="localCode" />
       </th>
<th class="table-col-30" appSortableColumn="stationType">
         TIPO <app-sorticon field="stationType" />
       </th>
<th class="table-col-35" appSortableColumn="location">
         UBICACIÓN <app-sorticon field="location" />
       </th>
      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <app-image
          [src]="item.photo"
          alt="."
          width="100"
          styleClass="shadow"
          [preview]="true"
        />
      </td>
      <td><span>{{ item.localCode }}</span></td>
      <td><span>{{ item.stationType }}</span></td>
      <td><span>{{ item.location }}</span></td>
      <td>
        <div class="d-flex">
          <iw-button-item
            (clicked)="viewHistory.emit(item)"
            tooltip="Ver historial de inspecciones"
            [iconClass]="'material-symbols-light:format-list-bulleted'"
          />
          <iw-button-download
            (clicked)="downloadQr.emit(item)"
            tooltip="Descargar QR"
          />
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit(item)"
          />
          <iw-button-delete (confirmed)="delete.emit(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="5" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
