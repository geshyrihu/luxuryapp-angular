<app-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div start>
        <lux-icon icon="material-symbols-light:lightbulb-outline" />
      </div>

      <h3>{{ item.luminaria.producto }}</h3>
    </ili-list-item>
    @for (itm of item.items; track itm) {
    <ili-list-item>
      <h3>{{ itm.nameMachinery }}</h3>
      <p>{{ itm.area }}</p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit(itm)"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(itm.id)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
    }
  </ng-template>
</app-data-view-mobile>
