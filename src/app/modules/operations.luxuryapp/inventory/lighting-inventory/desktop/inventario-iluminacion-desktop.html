<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption
      [title]="'Inventario de Iluminación'"
      (add)="add.emit()"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th>UBICACIÓN</th>
      <th>ÁREA</th>
      <th>CANTIDAD</th>
      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item let-i="rowIndex">
    <tr>
      <td colspan="4">
        <div class="p-3 bg-body-tertiary rounded d-flex align-items-center">
          <app-image
            [src]="item.luminaria.img"
            alt="."
            width="60px"
            [preview]="true"
          />
          <span class="fw-bold text-primary"
            >{{ item.luminaria.producto }}</span
          >
        </div>
      </td>
    </tr>
    @for (itm of item.items; track itm; let index = $index) {
    <tr>
      <td>{{ itm.nameMachinery }}</td>
      <td>{{ itm.area }}</td>
      <td>{{ itm.cantidad }}</td>
      <td class="no-print">
        <div class="d-flex">
          <iw-button-edit (clicked)="edit.emit(itm)" />
          <iw-button-delete (confirmed)="delete.emit(itm.id)" />
        </div>
      </td>
    </tr>
    }
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="4" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
