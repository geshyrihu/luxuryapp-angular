<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <div class="d-flex justify-content-between align-items-center w-full">
      <div class="d-flex align-items-center gap-2">
        <lux-button-web
          kind="item"
          displayMode="icon"
          severity="secondary"
          variant="soft"
          tooltip="Descargar PDF"
          ariaLabel="Descargar PDF"
          iconClass="material-symbols-light:picture-as-pdf"
          tooltipPosition="top"
          (clicked)="downloadPdf.emit()"
        />
        <lux-button-web
          kind="download"
          displayMode="icon"
          severity="secondary"
          variant="soft"
          tooltip="QR"
          tooltipPosition="top"
          (clicked)="downloadAllQr.emit()"
        />
        <lux-button-web displayMode="icon"
          (clicked)="openScanner.emit()"
          [iconClass]="'material-symbols-light:qr-code'"
        />
        <lux-button-web displayMode="icon"
          (clicked)="bulkExpiration.emit()"
          [iconClass]="'material-symbols-light:calendar-today'"
        />
      </div>
      <lux-table-caption
        [title]="'Inventario de Extintores'"
        (add)="add.emit()"
        [dt]="dt"
      />
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-5">FOTO</th>
<th class="table-col-15" appSortableColumn="localCode">
         CÓDIGO <app-sorticon field="localCode" />
       </th>
<th class="table-col-25" appSortableColumn="extinguisherType">
         EXTINTOR <app-sorticon field="extinguisherType" />
       </th>
<th class="table-col-25" appSortableColumn="location">
         UBICACIÓN <app-sorticon field="location" />
       </th>
<th class="table-col-15" appSortableColumn="expirationDate">
         VENCIMIENTO <app-sorticon field="expirationDate" />
       </th>
      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <app-image
          [src]="item.photo"
          alt="."
          width="100"
          styleClass="shadow"
          [preview]="true"
        />
      </td>
      <td><span>{{ item.localCode }}</span></td>
      <td><span>{{ item.extinguisherType }}</span></td>
      <td><span>{{ item.location }}</span></td>
      <td><span>{{ item.expirationDate }}</span></td>
      <td>
        <div class="d-flex">
          <lux-button-web
            kind="item"
            displayMode="icon"
            severity="secondary"
            variant="soft"
            tooltip="Ver historial de inspecciones"
            [iconClass]="'material-symbols-light:format-list-bulleted'"
            (clicked)="viewHistory.emit(item)"
          />
          <lux-button-web
            kind="download"
            displayMode="icon"
            severity="secondary"
            variant="soft"
            tooltip="Descargar QR"
            ariaLabel="Descargar QR"
            (clicked)="downloadQr.emit(item)"
          />
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit(item)"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            ariaLabel="Eliminar"
            (clicked)="delete.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
