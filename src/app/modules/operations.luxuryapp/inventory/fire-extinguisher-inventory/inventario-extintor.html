<app-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card d-none d-md-block"
>
  <ng-template #caption>
    <div class="d-flex justify-content-between align-items-center w-full">
      <div class="d-flex align-items-center gap-2">
        <iw-button-item
          (clicked)="onDownloadPdf()"
          ariaLabel="Descargar PDF"
          iconClass="material-symbols-light:picture-as-pdf"
          lxTooltip="Descargar PDF"
          tooltipPosition="top"
        />
        <iw-button-download
          (clicked)="onDownloadAllQr()"
          lxTooltip="QR"
          tooltipPosition="top"
          tooltip="Descargar todos los QR"
        />
        <iw-button
          (clicked)="onOpenScanner()"
          [iconClass]="'material-symbols-light:qr-code'"
        />
        <iw-button
          (clicked)="onBulkExpiration()"
          [iconClass]="'material-symbols-light:calendar-today'"
        />
        <iw-button-item
          (clicked)="onViewPeriodos()"
          lxTooltip="Periodos"
          tooltipPosition="top"
          tooltip="Configurar periodos de inspección"
        />
      </div>
      <app-table-caption
        [title]="'Inventario de Extintores'"
        (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
        [dt]="dt"
      />
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-5">Foto</th>
      <th class="table-col-15" appSortableColumn="localCode">
        Código <app-sorticon field="localCode" />
      </th>
      <th class="table-col-25" appSortableColumn="extinguisherType">
        Extintor <app-sorticon field="extinguisherType" />
      </th>
      <th class="table-col-25" appSortableColumn="location">
        Ubicación <app-sorticon field="location" />
      </th>
      <th class="table-col-15" appSortableColumn="expirationDate">
        Vencimiento <app-sorticon field="expirationDate" />
      </th>
      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <app-image
          [src]="item.photo"
          alt="."
          width="100"
          styleClass="shadow"
          [preview]="true"
        />
      </td>
      <td><small>{{ item.localCode }}</small></td>
      <td><small>{{ item.extinguisherType }}</small></td>
      <td><small>{{ item.location }}</small></td>
      <td><small>{{ item.expirationDate }}</small></td>
      <td>
        <div class="d-flex">
          <iw-button-item
            (clicked)="onViewHistory(item)"
            tooltip="Ver historial de inspecciones"
            [iconClass]="'material-symbols-light:format-list-bulleted'"
          />
          <iw-button-download
            (clicked)="onDownloadQr(item)"
            tooltip="Descargar QR"
          />
          <iw-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <iw-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <app-table-empty-message [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <app-table-footer [data]="dataSignal()" />
  </ng-template>
</app-table>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
>
  <div customFilters class="px-3 pb-2 d-flex flex-column gap-2">
    <button
      class="btn btn-rounded btn-text-primary btn-sm"
      (click)="onOpenScanner()"
    >
      <app-icon icon="material-symbols-light:qr-code" slot="start" />
      Escanear QR
    </button>
    <button
      class="btn btn-rounded btn-text-primary btn-sm"
      (click)="onBulkExpiration()"
    >
      <app-icon icon="material-symbols-light:event" slot="start" />
      Actualizar vencimiento
    </button>
    <button
      class="btn btn-rounded btn-text-primary btn-sm"
      (click)="onViewPeriodos()"
    >
      <app-icon icon="material-symbols-light:schedule" slot="start" />
      Periodos de Inspección
    </button>
  </div>

  <ng-template #listItemTemplate let-item>
    <div
      class="bg-body p-3 mb-2 shadow-sm rounded d-flex justify-content-between align-items-center"
    >
      <div slot="start">
        <app-icon
          icon="material-symbols-light:local-fire-department"
          class="text-xl text-red-500"
        />
      </div>
      <span class="">
        <h3>
          {{ item.localCode ? item.localCode + ' é ' : '' }}{{
          item.extinguisherType }}
        </h3>
        <p>{{ item.location }}</p>
      </span>
      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-item
            (clicked)="onViewHistory(item)"
            label="Historial"
            iconName="list-outline"
          />
          <ili-button-download
            (clicked)="onDownloadPdf()"
            iconClass="material-symbols-light:picture-as-pdf"
            label="PDF"
          />
          <ili-button-download (clicked)="onDownloadQr(item)" label="QR" />
          <ili-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </div>
  </ng-template>
</app-data-view-mobile>
