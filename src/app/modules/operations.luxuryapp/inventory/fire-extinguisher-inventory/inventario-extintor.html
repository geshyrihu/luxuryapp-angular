@if (platformS.isMobile()) {
  <app-inventario-extintor-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
    (edit)="onModalForm({ id: $event.id, title: 'Editar' })"
    (delete)="onDelete($event)"
    (viewHistory)="onViewHistory($event)"
    (downloadPdf)="onDownloadPdf()"
    (openScanner)="onOpenScanner()"
    (bulkExpiration)="onBulkExpiration()"
    (downloadQr)="onDownloadQr($event)"
  />
} @else {
  <app-inventario-extintor-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
    (edit)="onModalForm({ id: $event.id, title: 'Editar' })"
    (delete)="onDelete($event)"
    (viewHistory)="onViewHistory($event)"
    (downloadPdf)="onDownloadPdf()"
    (downloadAllQr)="onDownloadAllQr()"
    (openScanner)="onOpenScanner()"
    (bulkExpiration)="onBulkExpiration()"
    (downloadQr)="onDownloadQr($event)"
  />
}
