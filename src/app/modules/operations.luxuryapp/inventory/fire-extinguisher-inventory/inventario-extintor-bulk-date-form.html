<div class="card">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <p class="text-body-secondary text-sm m-0 mb-3">
      Esta acción sobreescribe la fecha de vencimiento de
      <strong>todos los extintores</strong> del cliente.
    </p>
    <lux-input-date-signal
      label="Nueva fecha de vencimiento"
      [control]="form.controls.expirationDate"
      [required]="true"
    />
    <lux-button-web
      kind="save"
      type="submit"
      severity="info"
      variant="soft"
      displayMode="both"
      label="Guardar"
      [loading]="submitting()"
    />
  </form>
</div>
