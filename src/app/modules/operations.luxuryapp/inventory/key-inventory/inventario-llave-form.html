<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-text-signal
    [control]="form.controls.id"
    hidden
    label="Id"
    [readonly]="true"
  />

  <lux-input-text-signal
    [control]="form.controls.descripcion"
    label="DESCRIPCIÓN"
    placeholder="DESCRIPCIÓN"
  />

  <lux-input-text-signal
    [control]="form.controls.marca"
    label="Marca"
    placeholder="marca"
  />

  <lux-input-select-signal
    [control]="form.controls.equipoClasificacionId"
    label="Clasificación"
    [data]="cb_equipoClasificacion"
    [filter]="true"
  />

  <lux-input-number-signal
    [control]="form.controls.numeroLlave"
    label="Número llave"
    placeholder="número llave"
  />

  <lux-input-number-signal
    [control]="form.controls.cantidad"
    label="Cantidad"
    placeholder="cantidad"
  />
  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    [label]="id ? 'Actualizar' : 'Guardar'"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
