@if (platformS.isMobile()) {
  <app-inventario-llaves-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
    (edit)="onModalForm({ id: $event.id, title: 'Editar' })"
    (delete)="onDelete($event)"
    (downloadPdf)="onDownloadPdf()"
  />
} @else {
  <app-inventario-llaves-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
    (edit)="onModalForm({ id: $event.id, title: 'Editar' })"
    (delete)="onDelete($event)"
    (downloadPdf)="onDownloadPdf()"
  />
}
