<app-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit()"
>
  <div customFilters>
    <lux-button-mobile
      kind="download"
      (clicked)="downloadPdf.emit()"
    />
  </div>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div start>
        <app-icon
          icon="material-symbols-light:key-outline"
          class="text-xl text-yellow-500"
        />
      </div>

      <h3>{{ item.descripcion }}</h3>
      <p>
        {{ item.marca }} | N° {{ item.numeroLlave }} | Cant: {{ item.cantidad }}
      </p>
      <p>{{ item.equipoClasificacion }}</p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit(item)"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
