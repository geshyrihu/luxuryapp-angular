<app-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit()"
>
  <div customFilters>
    <ili-button-download (clicked)="downloadPdf.emit()" />
  </div>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div start>
        <app-icon
          icon="material-symbols-light:key-outline"
          class="text-xl text-yellow-500"
        />
      </div>

      <h3>{{ item.descripcion }}</h3>
      <p>
        {{ item.marca }} | Né {{ item.numeroLlave }} | Cant: {{ item.cantidad }}
      </p>
      <p>{{ item.equipoClasificacion }}</p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit (clicked)="edit.emit(item)" label="Editar" />
          <ili-button-delete (confirmed)="delete.emit(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
