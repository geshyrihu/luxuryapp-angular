<!-- 💻 INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card d-none d-md-block"
>
  <ng-template #caption>
    <!-- CAMBIO: El tútulo y el ID inicial se ajustan para Almacón -->
    <lux-table-caption
      [showAdd]="isAdmin"
      (add)="onModalForm({ id: '', title: 'Nuevo Almacón' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <!-- CAMBIO: Columnas y campos de ordenamiento para Almacón -->
      <th appSortableColumn="nombre">
        Nombre
        <app-sorticon field="nombre" />
      </th>
      <th appSortableColumn="ubicacion">
        Ubicación
        <app-sorticon field="ubicacion" />
      </th>
      <th appSortableColumn="activo">
        Estado
        <app-sorticon field="activo" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <!-- CAMBIO: Propiedades del objeto 'item' para Almacón -->
      <td>{{ item.nombre }}</td>
      <td>{{ item.ubicacion }}</td>
      <td>{{ item.activo ? "Activo" : "Inactivo" }}</td>
      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="item"
            displayMode="icon"
            severity="secondary"
            variant="soft"
            tooltip="Ver Productos"
            tooltipPosition="top"
            iconClass="material-symbols-light:package"
            (clicked)="onViewProducts(item.id)"
          />
          <lux-button-web
            kind="item"
            displayMode="icon"
            severity="secondary"
            variant="soft"
            tooltip="Descargar Inventario"
            tooltipPosition="top"
            iconClass="material-symbols-light:picture-as-pdf"
            (clicked)="onDownloadInventory(item.id, item.nombre)"
          />
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            ariaLabel="Eliminar"
            (clicked)="onDelete(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="4" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="dataSignal()" />
  </ng-template>
</lux-table>

<!--📲INICIO: Componente adaptado para versión móvil -->
<app-data-view-mobile
  [data]="dataSignal()"
  [showAdd]="isAdmin"
  (add)="onModalForm({ id: '', title: 'Nuevo Almacén' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
        class="w-3rem h-3rem bg-primary-50"
      >
        <lux-icon
          icon="material-symbols-light:warehouse"
          class="text-xl text-primary"
        />
      </div>

      <p class="mt-0 mb-0 fw-bold">{{ item.nombre }}</p>
      <p class="text-body-secondary text-sm mt-0 mb-0">{{ item.ubicacion }}</p>

      <ili-action-menu end>
        <ng-container actions>
          <lux-button-mobile
            kind="item"
            label="Ver Productos"
            iconName="cube-outline"
            (clicked)="onViewProducts(item.id)"
          />
          <lux-button-mobile
            kind="item"
            label="Descargar Inventario"
            iconName="document-text-outline"
            (clicked)="onDownloadInventory(item.id, item.nombre)"
          />
          <lux-button-mobile
            kind="edit"
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="onDelete(item.id)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
