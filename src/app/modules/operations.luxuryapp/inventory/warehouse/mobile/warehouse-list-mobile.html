<app-data-view-mobile
  [data]="data()"
  [showAdd]="isAdmin()"
  (add)="add.emit({ id: '', title: 'Nuevo Almacén' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg w-3rem h-3rem bg-primary-50"
      >
        <app-icon
          icon="material-symbols-light:warehouse"
          class="text-xl text-primary"
        />
      </div>

      <p class="mt-0 mb-0 fw-bold">{{ item.nombre }}</p>
      <p class="text-body-secondary text-sm mt-0 mb-0">{{ item.ubicacion }}</p>

      <ili-action-menu end>
        <ng-container actions>
          <lux-button-mobile
            kind="item"
            label="Ver Productos"
            iconName="cube-outline"
            (clicked)="viewProducts.emit(item.id)"
          />
          <lux-button-mobile
            kind="item"
            label="Descargar Inventario"
            iconName="document-text-outline"
            (clicked)="downloadInventory.emit({ id: item.id, name: item.nombre })"
          />
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
