<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption
      [showAdd]="isAdmin()"
      (add)="add.emit({ id: '', title: 'Nuevo Almacón' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="nombre">
        Nombre
        <app-sorticon field="nombre" />
      </th>
      <th appSortableColumn="ubicacion">
        Ubicación
        <app-sorticon field="ubicacion" />
      </th>
      <th appSortableColumn="activo">
        Estado
        <app-sorticon field="activo" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.nombre }}</td>
      <td>{{ item.ubicacion }}</td>
      <td>{{ item.activo ? "Activo" : "Inactivo" }}</td>
      <td class="no-print">
        <div class="d-flex">
          <lux-button-web
            kind="item"
            displayMode="icon"
            severity="secondary"
            variant="soft"
            tooltip="Ver Productos"
            tooltipPosition="top"
            iconClass="material-symbols-light:package"
            (clicked)="viewProducts.emit(item.id)"
          />
          <lux-button-web
            kind="item"
            displayMode="icon"
            severity="secondary"
            variant="soft"
            tooltip="Descargar Inventario"
            tooltipPosition="top"
            iconClass="material-symbols-light:picture-as-pdf"
            (clicked)="downloadInventory.emit({ id: item.id, name: item.nombre })"
          />
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            ariaLabel="Eliminar"
            (clicked)="delete.emit(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="4" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
