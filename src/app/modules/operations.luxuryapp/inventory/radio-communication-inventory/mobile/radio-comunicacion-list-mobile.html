<lux-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit()"
>
  <div customFilters>
    <lux-button-mobile
      kind="download"
      (clicked)="downloadPdf.emit()"
    />
  </div>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <div start>
        <lux-icon
          icon="material-symbols-light:radio"
          class="text-xl text-green-500"
        />
      </div>

      <h3>{{ item.marca }} é {{ item.modelo }}</h3>
      <p>Serie: {{ item.serie }} | Bateróa: {{ item.bateria }}</p>
      <p>{{ item.applicationUser }} é {{ item.departament }}</p>

      <lux-action-menu-mobile slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit(item)"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
  </ng-template>
</lux-data-view-mobile>
