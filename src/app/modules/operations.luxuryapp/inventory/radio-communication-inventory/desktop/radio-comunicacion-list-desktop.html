<lux-table
  [globalFilterFields]="globalFilterFields()"
  [showCurrentPageReport]="true"
  [value]="data()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  #dt
  class="custom-table card"
>
  <ng-template #caption>
    <lux-table-caption (add)="add.emit()" [dt]="dt" />
    <iw-button-download
      lxTooltip="Descargar PDF"
      tooltipPosition="top"
      (clicked)="downloadPdf.emit()"
      class="mt-1"
    />
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="10" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
      <ng-template #header>
        <tr>
          <th>N°</th>
          <th appSortableColumn="fotografia">
            FOTOGRAFÍA <app-sorticon field="fotografia" />
          </th>
          <th appSortableColumn="marca">MARCA <app-sorticon field="marca" /></th>
          <th appSortableColumn="modelo">MODELO <app-sorticon field="modelo" /></th>
          <th appSortableColumn="serie">SERIE <app-sorticon field="serie" /></th>
          <th appSortableColumn="bateria">
            BATERÍA <app-sorticon field="bateria" />
          </th>
          <th appSortableColumn="fechaCompra">
            COMPRA <app-sorticon field="fechaCompra" />
          </th>
          <th appSortableColumn="responsibleAreaName">
            ÁREA <app-sorticon field="responsibleAreaName" />
          </th>
          <th appSortableColumn="applicationUser">
            RESPONSABLE <app-sorticon field="applicationUser" />
          </th>
          <th class="table-col-5"></th>
        </tr>
      </ng-template>
  <ng-template #body let-item let-i="rowIndex">
    <tr>
      <td>{{ i + 1 }}</td>
      <td>
        <app-image
          [src]="item.fotografia"
          alt="Image"
          width="120"
          height="70"
          [preview]="true"
        />
      </td>
      <td>{{ item.marca }}</td>
      <td>{{ item.modelo }}</td>
      <td>{{ item.serie }}</td>
      <td>{{ item.bateria }}</td>
      <td>{{ item.fechaCompra | apiDate:'mediumDate' }}</td>
      <td>{{ item.departament }}</td>
      <td>{{ item.applicationUser }}</td>
      <td class="no-print">
        <div class="d-flex">
          <iw-button-edit (clicked)="edit.emit(item)" />
          <iw-button-delete (confirmed)="delete.emit(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
</lux-table>
