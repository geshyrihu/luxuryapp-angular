<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-text-signal
    [control]="form.controls.id"
    hidden
    label="Id"
    [readonly]="true"
  />

  <div class="mb-4 d-flex justify-content-center">
    <div class="w-full sm:w-9/12 max-w-sm">
      <div class="card text-center p-3">
        <lux-input-img-signal
          (fileSelected)="uploadFile($event)"
          [urlImgCurrent]="urlBaseImg"
          [contentHeight]="75"
          [contentWidth]="75"
        />
      </div>
    </div>
  </div>

  <lux-input-text-signal
    [control]="form.controls.marca"
    label="Marca"
    placeholder="marca"
  />

  <lux-input-text-signal
    [control]="form.controls.modelo"
    label="Modelo"
    placeholder="modelo"
  />

  <lux-input-text-signal
    [control]="form.controls.serie"
    label="Serie"
    placeholder="serie"
  />

  <lux-input-text-signal
    [control]="form.controls.bateria"
    label="Bateria"
    placeholder="bateria"
  />

  <lux-input-date-signal
    [control]="form.controls.fechaCompra"
    label="Compra"
    placeholder="Compra"
  />

  <lux-input-select-signal
    [control]="form.controls.departament"
    label="Departamento"
    [data]="cb_departament()"
    [filter]="true"
  />

  <lux-input-autocomplete-signal
    (propagar)="saveApplicationUserId($event)"
    [control]="form.controls.applicationUser"
    [data]="cb_application_user()"
    label="Colaborador"
    placeholder="Escribe para buscar colaborador"
  />

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    [label]="id ? 'Actualizar' : 'Guardar'"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
