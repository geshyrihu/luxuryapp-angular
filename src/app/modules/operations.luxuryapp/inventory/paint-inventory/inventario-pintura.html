@if (platformS.isMobile()) {
  <app-inventario-pintura-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
    (edit)="onModalForm({ id: $event.id, title: 'Editar' })"
    (delete)="onDelete($event)"
  />
} @else {
  <app-inventario-pintura-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [urlImg]="urlImg"
    (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
    (edit)="onModalForm({ id: $event.id, title: 'Editar' })"
    (delete)="onDelete($event)"
  />
}
