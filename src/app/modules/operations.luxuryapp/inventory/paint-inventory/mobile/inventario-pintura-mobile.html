<app-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div start>
        <app-icon icon="material-symbols-light:palette-outline" />
      </div>

      <h3>{{ item.luminaria.producto }}</h3>
    </ili-list-item>
    @for (itm of item.items; track itm) {
    <ili-list-item>
      <h3>{{ itm.nameMachinery }}</h3>
      <p>{{ itm.area }}</p>

      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit (clicked)="edit.emit(itm)" label="Editar" />
          <ili-button-delete (confirmed)="delete.emit(itm.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
    }
  </ng-template>
</app-data-view-mobile>
