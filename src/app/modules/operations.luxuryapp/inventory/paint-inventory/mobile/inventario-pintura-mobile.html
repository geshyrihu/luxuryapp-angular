<lux-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
  (add)="add.emit()"
>
  <ng-template #listItemTemplate let-item>
    <lux-list-item-mobile>
      <div start>
        <lux-icon icon="material-symbols-light:palette-outline" />
      </div>

      <h3>{{ item.luminaria.producto }}</h3>
    </lux-list-item-mobile>
    @for (itm of item.items; track itm) {
    <lux-list-item-mobile>
      <h3>{{ itm.nameMachinery }}</h3>
      <p>{{ itm.area }}</p>

      <lux-action-menu-mobile slot="end">
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit(itm)"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(itm.id)"
          />
        </ng-container>
      </lux-action-menu-mobile>
    </lux-list-item-mobile>
    }
  </ng-template>
</lux-data-view-mobile>
