@if (platformS.isMobile()) {
  <app-product-entry-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [isSuperUsuario]="aspRoleS.roleSignal(AspRole.SuperUsuario)()"
    (edit)="onAddEntrada($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-product-entry-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [isSuperUsuario]="aspRoleS.roleSignal(AspRole.SuperUsuario)()"
    (edit)="onAddEntrada($event)"
    (delete)="onDelete($event)"
  />
}
