<form autocomplete="off" [formGroup]="form" (ngSubmit)="onSubmit()">
  <lux-input-text-signal
    [control]="form.controls.id"
    hidden
    label="Id"
    [readonly]="true"
  />
  <lux-input-date-signal
    [control]="form.controls.fechaEntrada"
    label="Fecha de entrada"
    placeholder="fecha de entrada"
  />
  <lux-input-select-signal
    [control]="form.controls.almacenId"
    label="Almacen"
    [data]="cb_almacenes()"
    [filter]="true"
  />
  <div class="row mb-4 align-items-center g-4">
    <label class="form-label col-12 col-md-3">Producto</label>
    @if (mostrarProductos() == false) {
    <div class="col-12 col-md-9">
      <lux-input-text-signal
        [control]="form.controls.productoId"
        [hidden]="true"
        [horizontal]="false"
      />
      <lux-input-text-signal
        [control]="form.controls.nombreProducto"
        [horizontal]="false"
      />
    </div>
    } @if (mostrarProductos() == true) {
    <div class="col-12 col-md-9">
      <lux-input-select-signal
        [control]="form.controls.productoId"
        [data]="cb_productos()"
        placeholder="--Selecciona un producto--"
        [filter]="true"
      />
    </div>
    }
  </div>
  <lux-input-number-signal
    [control]="form.controls.cantidad"
    label="Cantidad"
    placeholder="cantidad"
  />
  <lux-input-select-signal
    [control]="form.controls.unidadMedidaId"
    label="Unidad"
    [data]="cb_measurement_unit()"
    [filter]="true"
  />
  <lux-input-autocomplete-signal
    (propagar)="saveProviderId($event)"
    [control]="form.controls.providerName"
    [data]="cb_providers()"
    label="Proveedor"
    placeholder="Escribe para buscar proveedor"
  />
  <lux-input-text-signal
    [control]="form.controls.numeroFactura"
    label="Factura"
    placeholder="factura"
  />
  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    [label]="id() ? 'Actualizar' : 'Guardar'"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
