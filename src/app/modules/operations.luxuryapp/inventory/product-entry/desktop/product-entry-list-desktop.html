<div class="card">
  <lux-table
    [globalFilterFields]="globalFilterFields()"
    [paginator]="true"
    [rows]="tableRows"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="true"
    [value]="data()"
    #dt
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    class="custom-table"
  >
    <ng-template #caption>
      <lux-table-caption [showAdd]="false" [dt]="dt" />
    </ng-template>
<ng-template #header>
    <tr>
      <th appSortableColumn="fechaEntrada">
        FECHA ENTRADA
        <app-sorticon field="fechaEntrada" />
      </th>
      <th appSortableColumn="nombreProducto">
        PRODUCTO
        <app-sorticon field="nombreProducto" />
      </th>
      <th appSortableColumn="cantidad">
        CANTIDAD
        <app-sorticon field="cantidad" />
      </th>
      <th appSortableColumn="unidadMedida">
        UNIDAD
        <app-sorticon field="unidadMedida" />
      </th>
      <th appSortableColumn="provider">
        PROVEEDOR
        <app-sorticon field="provider" />
      </th>
      <th appSortableColumn="numeroFactura">
        FACTURA
        <app-sorticon field="numeroFactura" />
      </th>
      @if (isSuperUsuario()) {
      <th class="table-col-5"></th>
      }
    </tr>
  </ng-template>
    <ng-template #body let-item>
      <tr>
        <td>| {{ item.fechaEntrada | apiDate:'mediumDate' }}</td>
        <td>{{ item.nombreProducto }}</td>
        <td>{{ item.cantidad }}</td>
        <td>{{ item.unidadMedida }}</td>
        <td>{{ item.provider }}</td>
        <td>{{ item.numeroFactura }}</td>
        @if (isSuperUsuario()) {
        <td class="no-print">
          <div class="d-flex">
            <lux-button-web
              kind="edit"
              displayMode="icon"
              severity="info"
              variant="soft"
              size="sm"
              tooltip="Editar"
              ariaLabel="Editar"
              (clicked)="edit.emit({
                      id: item.id,
                      idProducto: item.productoId,
                      nombreProducto: item.nombreProducto,
                      almacenId: item.almacenId
                    })"
            />
            <lux-button-web
              kind="delete"
              displayMode="icon"
              severity="danger"
              variant="soft"
              size="sm"
              tooltip="Eliminar"
              ariaLabel="Eliminar"
              (clicked)="delete.emit(item.id)"
            />
          </div>
        </td>
        }
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <lux-table-empty-message [colspan]="7" />
    </ng-template>
    <ng-template #paginatorleft>
      <lux-table-footer [data]="data()" />
    </ng-template>
  </lux-table>
</div>
