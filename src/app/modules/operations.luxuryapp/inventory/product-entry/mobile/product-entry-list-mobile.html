<app-data-view-mobile
  [data]="data()"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="d-flex align-items-center justify-content-center flex-shrink-0 ms-3 me-2 rounded-lg"
      >
        <app-icon icon="material-symbols-light:upload" />
      </div>

      <div class="d-flex flex-column">
        <h6 class="mb-0">{{ item.nombreProducto }}</h6>
        <small class="text-body-secondary">
          {{ item.cantidad }} {{ item.unidadMedida }} - {{ item.provider }}
        </small>
        <small class="text-body-secondary">
          Factura: {{ item.numeroFactura }} | {{ item.fechaEntrada |
          apiDate:'mediumDate' }}
        </small>
      </div>

      @if (isSuperUsuario()) {
      <ili-action-menu end>
        <ng-container actions>
          <lux-button-mobile
            kind="edit"
            (clicked)="edit.emit({
                    id: item.id,
                    idProducto: item.productoId,
                    nombreProducto: item.nombreProducto,
                    almacenId: item.almacenId
                  })"
          />
          <lux-button-mobile
            kind="delete"
            color="danger"
            (clicked)="delete.emit(item.id)"
          />
        </ng-container>
      </ili-action-menu>
      }
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
