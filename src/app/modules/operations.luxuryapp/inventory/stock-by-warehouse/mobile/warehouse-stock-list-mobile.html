<app-data-view-mobile
  [data]="data()"
  (add)="add.emit()"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div slot="start">
        <app-avatar
          [image]="item.urlImagen"
          [alt]="item.producto"
          size="large"
        />
      </div>

      <div class="d-flex flex-column gap-1">
        <p class="fw-semibold m-0 text-body line-height-2">
          {{ item.producto }}
        </p>
        <div class="d-flex align-items-center gap-2 mt-1">
          <span class="text-xs text-body-secondary fw-medium"
            >{{ item.unidadDeMedida }}</span
          >
          <span
            class="px-2 py-1 rounded-xl text-xs fw-bold text-white"
            [class.bg-success]="item.existencia > item.stockMin"
            [class.bg-danger]="item.stockMin >= item.existencia"
          >
            {{ item.existencia }} en stock
          </span>
        </div>
      </div>
      <ili-action-menu slot="end">
        <ili-button-item
          iconName="add-outline"
          label="Entrada"
          (clicked)="
            addEntrada.emit({
              id: 0,
              idProducto: item.productoId,
              nombreProducto: item.producto,
              almacenId: item.almacenId
            })
          "
        />

        <ili-button-item
          iconName="remove-outline"
          label="Salida"
          (clicked)="
            addSalida.emit({
              id: 0,
              idInventarioProducto: item.id,
              idProducto: item.productoId,
              nombreProducto: item.producto,
              almacenId: item.almacenId
            })
          "
        />

        <ili-button-edit
          (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          label="Editar"
        />
        @if (item.existencia <= 0) {
        <ili-button-delete (confirmed)="delete.emit(item.id)" label="Eliminar" />
        }
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
