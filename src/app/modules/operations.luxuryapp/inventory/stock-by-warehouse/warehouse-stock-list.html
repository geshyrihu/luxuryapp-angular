@if (platformS.isMobile()) {
  <app-warehouse-stock-list-mobile
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    (add)="addProductos({ id: 0, title: 'Agregar Registro' })"
    (edit)="editProductos($event)"
    (addEntrada)="onAddEntrada($event)"
    (addSalida)="onAddSalida($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-warehouse-stock-list-desktop
    [data]="dataSignal()"
    [globalFilterFields]="globalFilterFields()"
    [rowGroupMetadata]="rowGroupMetadata"
    [canAdd]="aspRoleS.hasAny([
      AspRole.Asistente,
      AspRole.JefeMantenimiento,
      AspRole.Administrador,
      AspRole.SuperUsuario,
      AspRole.Almacenista
    ])"
    [canManage]="aspRoleS.anyOf([ AspRole.Asistente, AspRole.JefeMantenimiento,
    AspRole.Administrador, AspRole.SuperUsuario ])()"
    (add)="addProductos({ id: 0, title: 'Agregar Registro' })"
    (edit)="editProductos($event)"
    (addEntrada)="onAddEntrada($event)"
    (addSalida)="onAddSalida($event)"
    (delete)="onDelete($event)"
    (sort)="onSort()"
    (tarjetaProducto)="onModalTarjetaProducto($event)"
  />
}
