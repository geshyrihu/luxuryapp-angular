<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <lux-input-text-signal [control]="form.controls.id" hidden label="Id" />

  <lux-input-select-signal
    [control]="form.controls.habitant"
    label="Habitante"
    [data]="cb_Habitant()"
    [filter]="true"
  />

  <lux-input-text-signal
    [control]="form.controls.firstName"
    label="Nombre"
    placeholder="nombre"
  />
  <lux-input-text-signal
    [control]="form.controls.lastName"
    label="Apellidos"
    placeholder="apellidos"
  />
  <lux-input-number-signal
    [control]="form.controls.extencion"
    label="Extesión"
    placeholder="extención"
  />
  <lux-input-mask-signal
    [control]="form.controls.fixedPhone"
    label="Télefono fijo"
    placeholder="(00) 0000-0000"
    customMask="(00) 0000-0000"
  />

  <lux-input-mask-signal
    [control]="form.controls.phoneNumber"
    label="Tél. Celular"
    placeholder="(00) 0000-0000"
    customMask="(00) 0000-0000"
  />
  <lux-input-text-signal
    [control]="form.controls.email"
    label="Email personal"
    placeholder="email personal"
  />
  <lux-input-select-signal
    [control]="form.controls.enviarMails"
    label="Enviar correos"
    [data]="cb_enviarMails"
    [filter]="true"
  />
  @if (readonlyPropertyName()) {
  <lux-input-text-signal
    [control]="form.controls.property"
    label="Propiedad"
    placeholder="Propiedad"
  />
  } @else {
  <lux-input-autocomplete-signal
    (propagar)="savePropiedadId($event)"
    [control]="form.controls.property"
    [data]="cb_properties()"
    label="Propiedad"
    placeholder="Escribe para buscar propiedad"
  />
  }

  <lux-button-web
    kind="save"
    type="submit"
    severity="info"
    variant="soft"
    displayMode="both"
    [label]="id ? 'Actualizar' : 'Guardar'"
    [disabled]="form.invalid"
    [loading]="submitting()"
  />
</form>
