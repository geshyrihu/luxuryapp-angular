@if (platformS.isMobile()) {
<app-announcement-admin-list-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [statusControl]="statusControl"
  [typeControl]="typeControl"
  [statusOptions]="statusOptions()"
  [typeOptions]="typeOptions()"
  (filterChange)="onFilterChange()"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
  (downloadPdf)="onDownloadPdf($event)"
  (viewPreview)="onViewPreview($event)"
  (viewAnalytics)="onViewAnalytics($event)"
/>
} @else {
<app-announcement-admin-list-desktop
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [statusControl]="statusControl"
  [typeControl]="typeControl"
  [statusOptions]="statusOptions()"
  [typeOptions]="typeOptions()"
  (filterChange)="onFilterChange()"
  (add)="onModalForm($event)"
  (edit)="onModalForm($event)"
  (delete)="onDelete($event)"
  (downloadPdf)="onDownloadPdf($event)"
  (viewPreview)="onViewPreview($event)"
  (viewAnalytics)="onViewAnalytics($event)"
/>
}
