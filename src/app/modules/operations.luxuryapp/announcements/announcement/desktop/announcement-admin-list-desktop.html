<!-- 💻 INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->

<lux-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tableRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="data()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card"
>
  <ng-template #caption>
    <div
      class="d-flex flex-column flex-md-row align-items-md-center justify-content-between p-2 gap-2 bg-body-tertiary rounded g-4"
    >
      <div class="flex-grow-1">
        <lux-table-caption
          (add)="add.emit({ id: '', title: 'Nuevo Registro' })"
          [dt]="dt"
          [noPadding]="true"
          [noMargin]="true"
        />
      </div>

      <div class="d-flex flex-column flex-sm-row align-items-center gap-2 g-4">
        <div class="w-15rem">
          <lux-input-select-signal
            [control]="statusControl()"
            (onChange)="filterChange.emit()"
            [data]="statusOptions()"
            placeholder="Estado"
            [horizontal]="false"
            [noMargin]="true"
          />
        </div>
        <div class="w-15rem">
          <lux-input-select-signal
            [control]="typeControl()"
            (onChange)="filterChange.emit()"
            [data]="typeOptions()"
            placeholder="Tipo"
            [horizontal]="false"
            [noMargin]="true"
          />
        </div>
        <div class="flex-shrink-0">
          <lux-button-web
            label="Filtrar"
            iconClass="material-symbols-light:search"
            variant="outline"
          />
        </div>
      </div>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th appSortableColumn="folio">
        Folio
        <app-sorticon field="folio" />
      </th>
      <th appSortableColumn="title">
        Titulo
        <app-sorticon field="title" />
      </th>
      <th appSortableColumn="announcementType">
        Tipo
        <app-sorticon field="announcementType" />
      </th>
      <th appSortableColumn="status">
        Estado
        <app-sorticon field="status" />
      </th>
      <th appSortableColumn="customerName">
        Cliente
        <app-sorticon field="customerName" />
      </th>
      <th appSortableColumn="publishedAt">
        Publicación
        <app-sorticon field="publishedAt" />
      </th>
      <th appSortableColumn="expirationDate">
        Expiración
        <app-sorticon field="expirationDate" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.folio }}</td>
      <td>{{ item.title }}</td>
      <td>
        <lux-tag
          [value]="item.announcementType"
          [severity]="
            item.announcementType === 'Urgente'
              ? 'danger'
              : item.announcementType === 'Informativo'
                ? 'info'
                : item.announcementType === 'General'
                  ? 'primary'
                  : 'secondary'
          "
        />
      </td>
      <td>
        <lux-tag
          [value]="item.status"
          [severity]="
            item.status === 'Publicado'
              ? 'success'
              : item.status === 'Borrador'
                ? 'secondary'
                : item.status === 'Archivado'
                  ? 'warning'
                  : 'secondary'
          "
        />
      </td>
      <td>{{ item.customerName }}</td>
      <td>{{ item.publishedAt | apiDate: "dd/MM/yyyy" }}</td>
      <td>{{ item.expirationDate | apiDate: "dd/MM/yyyy" }}</td>
      <td>
        <div class="d-flex">
          <lux-button-web
            kind="edit"
            displayMode="icon"
            severity="info"
            variant="soft"
            size="sm"
            tooltip="Editar"
            ariaLabel="Editar"
            (clicked)="edit.emit(item)"
          />
          <lux-button-web
            kind="delete"
            displayMode="icon"
            severity="danger"
            variant="soft"
            size="sm"
            tooltip="Eliminar"
            ariaLabel="Eliminar"
            (clicked)="delete.emit(item.id)"
          />
          <lux-button-web
            kind="download"
            displayMode="icon"
            severity="danger"
            variant="soft"
            iconClass="material-symbols-light:picture-as-pdf"
            ngbTooltip="Descargar PDF"
            (clicked)="downloadPdf.emit(item.id)"
          />
          <lux-button-web
            kind="item"
            displayMode="icon"
            severity="secondary"
            variant="soft"
            tooltip="Vista previa"
            iconClass="material-symbols-light:book"
            tooltipPosition="top"
            (clicked)="viewPreview.emit(item.id)"
          />
          <lux-button-web
            kind="item"
            displayMode="icon"
            severity="secondary"
            variant="soft"
            tooltip="Analíticas"
            iconClass="material-symbols-light:bar-chart"
            tooltipPosition="top"
            (clicked)="viewAnalytics.emit(item.id)"
          />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <lux-table-empty-message [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <lux-table-footer [data]="data()" />
  </ng-template>
</lux-table>
