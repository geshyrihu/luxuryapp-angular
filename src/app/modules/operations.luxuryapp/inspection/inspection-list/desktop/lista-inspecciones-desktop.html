<div class="d-flex flex-column gap-3 fadein">
  <div class="card p-3">
    <div class="inspection-filters">
      <div class="inspection-filters__group">
        <il-button
          label="Nuevo Recorrido"
          size="sm"
          lxTooltip="Nuevo Recorrido"
          (clicked)="add.emit()"
        />
        <il-button
          iconClass="material-symbols-light:menu-book-outline"
          label="Reportes"
          size="sm"
          severity="secondary"
          variant="outline"
          tooltip="Ver reportes de inspección"
          (clicked)="reportes.emit()"
        />
      </div>
      <div class="inspection-filters__field">
        <custom-input-select-signal
          [ngModel]="selectedArea()"
          (ngModelChange)="filterAreaChange.emit($event)"
          [data]="areasResponsables()"
          label="Área"
          placeholder="Todas las áreas"
          [horizontal]="false"
          [filter]="true"
          [noMargin]="true"
        />
      </div>
      <div class="inspection-filters__field">
        <custom-input-select-signal
          [ngModel]="selectedRecurrence()"
          (ngModelChange)="filterRecurrenceChange.emit($event)"
          [data]="[
            { label: 'Diario', value: '1' },
            { label: 'Semanal', value: '2' },
            { label: 'Mensual', value: '3' }
          ]"
          label="Frecuencia"
          placeholder="Todas las Recurrencias"
          [horizontal]="false"
          [filter]="true"
          [noMargin]="true"
        />
      </div>
      <div class="inspection-filters__actions">
        <il-button
          label="Limpiar filtros"
          severity="secondary"
          variant="outline"
          size="sm"
          iconClass="material-symbols-light:filter-alt-off"
          (clicked)="clearFilters.emit()"
        />
        <il-button
          label="Aplicar filtros"
          size="sm"
          iconClass="material-symbols-light:filter-alt"
          (clicked)="applyFilters.emit()"
        />
      </div>
    </div>
  </div>

  <div class="card p-0">
    <lux-table
      #dt
      [globalFilterFields]="globalFilterFields"
      [paginator]="true"
      [rows]="tableRows"
      [rowsPerPageOptions]="rowsPerPageOptions"
      [scrollable]="true"
      [scrollHeight]="scrollHeight()"
      [showCurrentPageReport]="true"
      [value]="rows()"
      groupRowsBy="departament"
      class="custom-table w-100"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    >
      <ng-template #header>
        <tr>
          <th appSortableColumn="name">
            Nombre
            <app-sorticon field="name" />
          </th>
          <th appSortableColumn="recurrenceUnitDisplayName">
            Frecuencia
            <app-sorticon field="recurrenceUnitDisplayName" />
          </th>
          <th class="no-print text-end">Acciones</th>
        </tr>
      </ng-template>

      <ng-template #groupheader let-item>
        <tr>
          <td colspan="3" class="bg-body-tertiary p-2">
            <span class="fw-bold ms-2 text-primary"
              >{{ item.departament }}</span
            >
          </td>
        </tr>
      </ng-template>

      <ng-template #body let-item>
        <tr>
          <td>{{ item.name }}</td>
          <td>{{ item.recurrenceUnitDisplayName }}</td>
          <td class="no-print text-end">
            <div class="d-flex gap-1 justify-content-end">
              <lux-button-web
                kind="edit"
                displayMode="icon"
                severity="info"
                variant="soft"
                size="sm"
                tooltip="Editar"
                [ariaLabel]="'Editar ' + item.name"
                (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
              />
              <lux-button-web
                kind="item"
                displayMode="icon"
                severity="secondary"
                variant="soft"
                size="sm"
                [ariaLabel]="'Ver detalles de ' + item.name"
                class="btn--circle"
                icon="search"
                (clicked)="detalles.emit(item.id)"
              />
              <lux-button-web
                kind="delete"
                displayMode="icon"
                severity="danger"
                variant="soft"
                size="sm"
                tooltip="Eliminar"
                [ariaLabel]="'Eliminar ' + item.name"
                (clicked)="delete.emit(item.id)"
              />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <lux-table-empty-message [colspan]="3" />
      </ng-template>
    </lux-table>
  </div>
</div>
