<app-data-view-mobile
  class="d-md-none"
  [isGrouped]="true"
  [groupedData]="groupedData()"
  (add)="add.emit()"
>
  <div customFilters class="d-flex flex-column gap-3 p-4">
    <lux-input-select-signal
      [ngModel]="selectedArea()"
      (ngModelChange)="filterAreaChange.emit($event)"
      [data]="areasResponsables()"
      label="Área"
      placeholder="Todas las áreas"
      [horizontal]="false"
      [filter]="true"
    />
    <lux-input-select-signal
      [ngModel]="selectedRecurrence()"
      (ngModelChange)="filterRecurrenceChange.emit($event)"
      [data]="[
        { label: 'Diario', value: '1' },
        { label: 'Semanal', value: '2' },
        { label: 'Mensual', value: '3' }
      ]"
      label="Frecuencia"
      placeholder="Todas las Recurrencias"
      [horizontal]="false"
      [filter]="true"
    />
    <div class="d-flex gap-2">
      <lux-button-mobile
        label="Limpiar filtros"
        severity="secondary"
        variant="outline"
        iconClass="material-symbols-light:filter-alt-off"
        (clicked)="clearFilters.emit()"
      />
      <lux-button-mobile
        label="Aplicar filtros"
        iconClass="material-symbols-light:filter-alt"
        (clicked)="applyFilters.emit()"
      />
    </div>
    <lux-button-mobile
      iconClass="material-symbols-light:menu-book-outline"
      label="Reportes"
      (clicked)="reportes.emit()"
    />
  </div>

  <ng-template #listItemTemplate let-item>
    <div class="list-item-mobile">
      <span class="flex-fill">
        <div class="text-body-md fw-medium text-on-surface">
          {{ item.name }}
        </div>
        <span class="text-body-sm text-on-surface-secondary"
          >{{ item.recurrenceUnitDisplayName ?? 'N/A' }}</span
        >
      </span>
      <ili-action-menu end>
        <lux-button-mobile
          kind="edit"
          (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
        />
        <lux-button-mobile
          kind="item"
          icon="search"
          label="Detalles"
          (clicked)="detalles.emit(item.id)"
        />
        <lux-button-mobile
          kind="delete"
          color="danger"
          (clicked)="delete.emit(item.id)"
        />
      </ili-action-menu>
    </div>
  </ng-template>
</app-data-view-mobile>
