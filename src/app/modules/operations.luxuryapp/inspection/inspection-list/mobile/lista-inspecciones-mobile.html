<app-data-view-mobile
  class="d-md-none"
  [isGrouped]="true"
  [groupedData]="groupedData()"
  (add)="add.emit()"
>
  <div customFilters class="d-flex flex-column gap-3 p-4">
    <custom-input-select-signal
      [ngModel]="selectedArea()"
      (ngModelChange)="filterAreaChange.emit($event)"
      [data]="areasResponsables()"
      label="Área"
      placeholder="Todas las áreas"
      [horizontal]="false"
      [filter]="true"
    />
    <custom-input-select-signal
      [ngModel]="selectedRecurrence()"
      (ngModelChange)="filterRecurrenceChange.emit($event)"
      [data]="[
        { label: 'Diario', value: 'daily' },
        { label: 'Semanal', value: 'weekly' },
        { label: 'Mensual', value: 'monthly' }
      ]"
      label="Frecuencia"
      placeholder="Todas las Recurrencias"
      [horizontal]="false"
      [filter]="true"
    />
    <ili-button
      iconClass="material-symbols-light:menu-book-outline"
      label="Reportes"
      (clicked)="reportes.emit()"
    />
  </div>

  <ng-template #listItemTemplate let-item>
    <div class="list-item-mobile">
      <span class="flex-fill">
        <div class="text-body-md fw-medium text-on-surface">{{ item.name }}</div>
        <span class="text-body-sm text-on-surface-secondary">{{ item.recurrenceUnit ?? 'N/A' }}</span>
      </span>
      <ili-action-menu end>
        <ili-button-edit
          (clicked)="edit.emit({ id: item.id, title: 'Editar' })"
          label="Editar"
        />
        <ili-button-item
          icon="search"
          label="Detalles"
          (clicked)="detalles.emit(item.id)"
        />
        <ili-button-delete
          (confirmed)="delete.emit(item.id)"
          label="Eliminar"
        />
      </ili-action-menu>
    </div>
  </ng-template>
</app-data-view-mobile>
