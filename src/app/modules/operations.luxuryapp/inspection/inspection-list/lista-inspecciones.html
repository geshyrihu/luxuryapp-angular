@if (platformS.isMobile()) {
  <app-lista-inspecciones-mobile
    [groupedData]="groupedData()"
    [areasResponsables]="areasResponsablesSignal()"
    [selectedArea]="selectedAreaSignal()"
    [selectedRecurrence]="selectedRecurrenceSignal()"
    (add)="onModalForm({ title: 'Agregar Inspección', id: '' })"
    (edit)="onModalForm($event)"
    (detalles)="navigateToDetalles($event)"
    (delete)="onDelete($event)"
    (reportes)="navigateToReportes()"
    (filterAreaChange)="selectedAreaSignal.set($event)"
    (filterRecurrenceChange)="selectedRecurrenceSignal.set($event)"
  />
} @else {
  <app-lista-inspecciones-desktop
    [data]="inspeccionesFiltradasSignal()"
    [areasResponsables]="areasResponsablesSignal()"
    [selectedArea]="selectedAreaSignal()"
    [selectedRecurrence]="selectedRecurrenceSignal()"
    (add)="onModalForm({ title: 'Agregar Inspección', id: '' })"
    (edit)="onModalForm($event)"
    (detalles)="navigateToDetalles($event)"
    (delete)="onDelete($event)"
    (reportes)="navigateToReportes()"
    (filterAreaChange)="selectedAreaSignal.set($event)"
    (filterRecurrenceChange)="selectedRecurrenceSignal.set($event)"
  />
}
