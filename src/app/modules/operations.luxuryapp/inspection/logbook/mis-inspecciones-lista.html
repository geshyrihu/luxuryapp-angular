@if (platformS.isMobile()) {
<app-mis-inspecciones-lista-mobile
  [data]="dataSignal()"
  [dateSelectControl]="dateSelectControl"
  (dateChange)="onDateChange($event)"
  (resultado)="navigateToResultado($event)"
  (inspeccionar)="navigateToMiInspeccion($event)"
/>
} @else {
<app-mis-inspecciones-lista-desktop
  [data]="dataSignal()"
  [dateSelectControl]="dateSelectControl"
  (dateChange)="onDateChange($event)"
  (resultado)="navigateToResultado($event)"
  (inspeccionar)="navigateToMiInspeccion($event)"
/>
}
