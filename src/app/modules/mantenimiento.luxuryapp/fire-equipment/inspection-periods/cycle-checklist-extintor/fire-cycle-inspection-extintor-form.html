<div class="card">
  <div class="card-body">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <custom-input-check-signal [control]="form.controls.adequatePressure" label="Presión Adecuada" />
      <custom-input-check-signal [control]="form.controls.safetyPinOk" label="Seguro Presente y Funcional" />
      <custom-input-check-signal [control]="form.controls.labelsOk" label="Etiquetas Legibles" />
      <custom-input-check-signal [control]="form.controls.noPhysicalDamage" label="Sin Daños Físicos" />
      <custom-input-textarea-signal [control]="form.controls.observations" label="Observaciones" />
      <il-button-save [submitting]="submitting()" />
    </form>
  </div>
</div>
