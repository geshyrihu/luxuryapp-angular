<!-- Contenedor principal de la página de recuperación -->
<div class="relative w-full overflow-hidden min-h-screen bg-black-alpha-90">
  
  <!-- Carrusel de imágenes de fondo (mismo que login, en todas las pantallas) -->
  <div class="absolute top-0 left-0 w-full h-full z-10">
    @for (image of visibleImages(); track image) {
      <div
        class="absolute top-0 left-0 w-full h-full"
        [@slideAnimation]
        [style.background-image]="'url(' + image + ')'"
        style="background-size: cover; background-position: center"
      ></div>
    }
    <!-- Capa oscura semitransparente para legibilidad -->
    <div class="absolute top-0 left-0 w-full h-full bg-black-alpha-80 md:bg-black-alpha-60"></div>
  </div>

  <!-- Contenido centrado -->
  <div class="relative z-20 flex align-items-center justify-content-center w-full min-h-screen fadeinup animation-duration-500">
    
    <div class="w-full flex flex-column justify-content-center overflow-hidden glass-auth-card max-w-30rem">
      <form class="w-full px-4 py-6 md:p-5" [formGroup]="form" (ngSubmit)="onSubmit()">
        
        <!-- Logo -->
        <div class="text-center mb-5">
          <img
            class="mx-auto mb-3 w-13rem h-auto"
            src="assets/images/login/LBG-blanco.png"
            alt="Logo LuxuryApp"
          />
          <h4 class="mb-1 text-2xl font-bold tracking-tight">Recuperar Contraseña</h4>
          <p class="font-medium text-sm text-600">Ingresa tu correo para recibir instrucciones.</p>
        </div>

        <!-- Campo Email -->
        <custom-input-text-signal
          [control]="form.controls.email"
          [horizontal]="false"
          formControlName="email"
          label="Correo Electrónico"
          placeholder="ejemplo@correo.com"
          size="large"
        />

        <!-- Botón -->
        <div class="mt-5">
          <custom-button
            customClass="w-full border-round overflow-hidden"
            type="submit"
            [label]="countdown() > 0 ? 'Reintentar en ' + countdown() + 's' : 'Enviar Instrucciones'"
            [loading]="submitting()"
            [disabled]="form.invalid || submitting() || countdown() > 0"
            icon="mdi:send-outline"
            [fluid]="true"
            [showLabelOnDesktop]="true"
          ></custom-button>
        </div>

        <!-- Mensajes -->
        @if (errorMessage()) {
          <div class="mt-4 fadein animation-duration-300">
            <p-message
              severity="error"
              [text]="errorMessage()"
              styleClass="w-full shadow-1"
            ></p-message>
          </div>
        } @if (successMessage()) {
          <div class="mt-4 fadein animation-duration-300">
            <p-message
              severity="success"
              [text]="successMessage()"
              styleClass="w-full shadow-1"
            ></p-message>
          </div>
        }

        <!-- Volver -->
        <div class="text-center mt-4">
          <a
            [routerLink]="['/auth/login']"
            class="font-semibold text-sm text-primary transition-colors hover:text-white"
          >
            Volver al Login
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
