<!-- Contenedor principal de la página de recuperación -->
<div
  class="relative w-full overflow-hidden surface-ground min-h-screen"
>
  <!-- Carrusel de imágenes de fondo (mismo que login) -->
  <div
    class="hidden md:block absolute top-0 left-0 w-full h-full z-10"
  >
    @for (image of visibleImages(); track image) {
    <div
      class="absolute top-0 left-0 w-full h-full"
      [@slideAnimation]
      [style.background-image]="'url(' + image + ')'"
      style="background-size: cover; background-position: center"
    ></div>
    }
    <!-- Capa oscura semitransparente -->
    <div
      class="absolute top-0 left-0 w-full h-full bg-black-alpha-60"
    ></div>
  </div>

  <!-- Contenido centrado -->
  <div
    class="relative z-20 flex align-items-center justify-content-center w-full px-4 min-h-screen"
  >
    <!-- 
      TARJETA SEGURA (BULLETPROOF CARD)
      Mismas dimensiones que Login.
    -->
    <div
      class="w-full flex flex-column justify-content-center overflow-hidden surface-card shadow-6 border-round-2xl max-w-40rem"
    >
      <form class="w-full p-5" [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- Logo -->
        <div class="text-center mb-4">
          <img
            class="mx-auto mb-3 w-11rem h-auto shadow-2"
            src="assets/images/login/LBG-negro.png"
            alt="Logo LuxuryApp"
          />
          <h4
            class="mb-1 text-2xl font-bold text-900 tracking-tight"
          >
            Recuperar Contraseña
          </h4>
          <p
            class="font-medium text-base text-600"
          >
            Ingresa tu correo para recibir instrucciones.
          </p>
        </div>

        <!-- Campo Email -->
        <custom-input-text-signal
          [control]="form.controls.email"
          [horizontal]="false"
          formControlName="email"
          label="Correo Electrónico"
          placeholder="ejemplo@correo.com"
          size="large"
        />

        <!-- Botón -->
        <div class="mt-4">
          <custom-button
            customClass="w-full border-round overflow-hidden"
            type="submit"
            [label]="countdown() > 0 ? 'Reintentar en ' + countdown() + 's' : 'Enviar Instrucciones'"
            [loading]="submitting()"
            [disabled]="form.invalid || submitting() || countdown() > 0"
            icon="pi pi-send"
            [fluid]="true"
            [showLabelOnDesktop]="true"
          ></custom-button>
        </div>

        <!-- Mensajes -->
        @if (errorMessage()) {
        <div class="mt-4">
          <p-message
            severity="error"
            [text]="errorMessage()"
            styleClass="w-full shadow-1"
          ></p-message>
        </div>
        } @if (successMessage()) {
        <div class="mt-4">
          <p-message
            severity="success"
            [text]="successMessage()"
            styleClass="w-full shadow-1"
          ></p-message>
        </div>
        }

        <!-- Volver -->
        <div class="text-center mt-4">
          <a
            [routerLink]="['/auth/login']"
            class="font-bold text-sm text-primary transition-colors hover:underline"
          >
            Volver al Login
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
