<!-- Contenedor principal de la página de login -->
<div class="relative w-full overflow-hidden min-h-screen bg-black-alpha-90">
  
  <!-- Fondo Fotográfico Global (Escritorio y Móvil) -->
  <div class="absolute top-0 left-0 w-full h-full z-10">
    @for (image of sliderImages(); track image) {
      <img
        [ngSrc]="image"
        fill
        priority
        [alt]="'Slider Background'"
        class="absolute top-0 left-0 w-full h-full"
        style="object-fit: cover; object-position: center"
        @slideAnimation
      />
    }
    <!-- Capa oscura de alto contraste para asegurar legibilidad en cualquier dispositivo -->
    <div class="absolute top-0 left-0 w-full h-full bg-black-alpha-80 md:bg-black-alpha-60"></div>
  </div>

  <!-- Contenedor centrado: Tarjeta de Login Glassmorphism -->
  <div class="relative z-20 flex align-items-center justify-content-center w-full min-h-screen fadeinup animation-duration-500">
    
    <div class="w-full flex flex-column justify-content-center overflow-hidden glass-auth-card max-w-30rem">
      <form class="w-full px-4 py-6 md:p-5" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <!-- Logo -->
        <div class="text-center mb-5">
          <img
            class="mx-auto mb-3 w-13rem h-auto"
            src="assets/images/login/LBG-blanco.png"
            alt="Logo Luxury Building Group"
            width="240"
            height="92"
            priority
          />
          <h4 class="mb-1 text-2xl font-bold tracking-tight">¡Bienvenido!</h4>
          <p class="font-medium text-sm text-600">Ingresa tus credenciales para continuar.</p>
        </div>

        <custom-input-text-signal
          [control]="loginForm.controls['userName']"
          id="username-global"
          label="Usuario"
          placeholder="Ej: jperez"
          [horizontal]="false"
          [noMargin]="true"
          customClass="w-full font-semibold h-3rem surface-border"
        />

        <div class="mt-4">
          <custom-input-password-signal
            [control]="loginForm.controls['password']"
            id="password-global"
            label="Contraseña"
            placeholder="********"
            [horizontal]="false"
            [showStrengthIndicator]="false"
            customClass="w-full font-semibold h-3rem surface-border"
          />
        </div>

        <!-- Opciones: Recordar y Recuperar Contraseña -->
        <div class="flex align-items-center justify-content-between mt-4">
          <div class="flex align-items-center">
            <custom-input-check-signal
              [control]="loginForm.controls['rememberMe']"
              id="checkbox-remember-global"
              placeholder="Recordarme"
              [horizontal]="false"
              [onlyInput]="true"
              [noMargin]="true"
            />
          </div>
          <a [routerLink]="['/auth/recovery-password']" class="font-semibold text-sm text-primary transition-colors hover:text-white">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <!-- Botón de Iniciar Sesión -->
        <div class="mt-5">
          <custom-button
            customClass="w-full border-round overflow-hidden"
            type="submit"
            label="INICIAR SESIÓN"
            icon="mdi:login"
            [loading]="loading()"
            [disabled]="isSubmitDisabled()"
            [fluid]="true"
            [showLabelOnDesktop]="true"
          ></custom-button>
        </div>

        <!-- Mensaje de error -->
        @if (errorMessage()) {
          <div class="mt-4 fadein animation-duration-300">
            <p-message
              severity="error"
              [text]="errorMessage()"
              styleClass="w-full shadow-1"
            ></p-message>
          </div>
        }
      </form>
    </div>

  </div>
</div>
