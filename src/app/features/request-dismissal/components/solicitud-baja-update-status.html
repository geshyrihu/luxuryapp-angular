<form autocomplete="off" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="card">
    <div class="card-body">
      <div class="w-full md:w-1/2">
        <custom-input-select-signal
          [label]="'Estatus'"
          [control]="form.controls.status"
          [data]="estatusBaja"
          [filter]="true"
        />
      </div>
    </div>
    <div class="card-footer">
      <div class="flex justify-content-end">
        <custom-button-save [propertyId]="id" [disabled]="form.invalid" />
      </div>
    </div>
  </div>
</form>
