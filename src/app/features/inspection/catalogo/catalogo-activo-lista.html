<!-- 🖥️ INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<p-table
  [globalFilterFields]="globalFilterFields()"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  #dt
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="folio">
        Folio
        <p-sortIcon field="folio" />
      </th>
      <th pSortableColumn="name">
        Nombre
        <p-sortIcon field="name" />
      </th>
      <th pSortableColumn="assetCategory">
        CATEGORIA
        <p-sortIcon field="assetCategory" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.folio }}</td>
      <td>{{ item.name }}</td>
      <td>{{ item.assetCategory }}</td>
      <!-- Opciones -->
      <td class="no-print">
        <div class="flex">
          <custom-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <custom-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- 📱 INICIO: Componente adaptado para versión móvil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" class="ion-no-padding" detail="false">
      <ion-label>
        <h2 class="font-normal m-0">{{ item.name }}</h2>
        <p class="text-medium text-500 m-0">{{ item.folio }}</p>
      </ion-label>

      <app-action-menu slot="end">
        <ng-container actions>
          <ion-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <ion-button-delete (confirmed)="onDelete(item.id)" />
        </ng-container>
      </app-action-menu>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
