<!-- Desktop View -->
<div class="hidden md:block">
  <div class="container">
    <br />
    <div class="grid">
      @for (category of documentCategories; track category.routeParam) {
      <div class="col-6 sm:col-3 md:col-2">
        <a
          [routerLink]="[category.routeParam]"
          class="no-underline block committee-folder-box text-900"
          [title]="'Ver ' + category.title"
        >
          <div class="committee-folder-box h-full">
            <div class="committee-files-list">
              <div class="committee-image-container">
                <img
                  [src]="category.image"
                  alt="{{ category.title }}"
                  class="committee-menu-option-image"
                />
              </div>
              <div class="committee-card-content text-center mt-2">
                <h6 class="m-0">{{ category.title }}</h6>
              </div>
            </div>
          </div>
        </a>
      </div>
      }
    </div>
  </div>
</div>

<!-- Mobile View -->
<div class="block md:hidden">
  <div class="grid p-0">
    <div class="flex flex-wrap w-full">
      @for (category of documentCategories; track category.routeParam) {
      <div class="col-6 p-0">
        <div class="m-1 h-full animate__animated animate__fadeIn border-1 surface-border shadow-1" (click)="navigateTo(category.routeParam)">
          <div class="relative overflow-hidden h-9rem">
            <lx-image
              [src]="category.image"
              [alt]="category.title"
              styleClass="w-full h-full cover-image"
            ></lx-image>
          </div>
          <div class="text-center p-2">
            <span class="text-sm font-bold text-900">{{ category.title }}</span
            >
          </div>
          <ion-ripple-effect></ion-ripple-effect>
        </div>
      </div>
      }
    </div>
  </div>
</div>
