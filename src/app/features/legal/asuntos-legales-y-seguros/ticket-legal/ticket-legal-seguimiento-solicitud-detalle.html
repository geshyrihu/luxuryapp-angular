@if (loading()) {
<div class="text-center">
  <app-icon [icon]="'mdi:loading'" class="text-primary m-1" aria-label="Cargando..."></app-icon>
</div>
} @if (data.length > 0) {
<div class="card">
  <div class="card-body">
    <div style="white-space: pre-line">{{ data }}</div>
  </div>
</div>
}
