<p-card>
  <ng-template #content>
    <div class="flex flex-wrap align-items-end gap-3">
      <div class="flex-1">
        <custom-input-select-signal
          [control]="statusControl"
          label="Estatus"
          [data]="statusOptions"
        />
      </div>
      <div>
        <custom-button
          label="Guardar"
          variant="outlined"
          [loading]="loading()"
          (clicked)="onSubmit()"
        />
      </div>
    </div>
  </ng-template>
</p-card>
