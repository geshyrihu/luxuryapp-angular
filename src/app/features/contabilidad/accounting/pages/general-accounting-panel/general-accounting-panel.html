<div class="mb-8 px-4 md:px-0">
  <div class="flex align-items-center mb-4">
    <div class="w-1rem h-2rem bg-blue-500 border-round-circle mr-3"></div>
    <h3 class="text-base font-bold text-700 uppercase tracking-wide">
      Contabilidad General
    </h3>
  </div>

  <div class="grid">
    <!-- Catálogo de Cuentas -->
    <a routerLink="accounts" class="group block col-12 sm:col-6 lg:col-3">
      <div
        class="surface-card border-round-xl border-1 surface-border p-5 h-full transition-all transition-duration-300 hover:shadow-3 hover:border-blue-200 relative overflow-hidden"
      >
        <div
          class="absolute top-0 right-0 w-5rem h-5rem bg-blue-50 border-circle -mr-4 -mt-4 transition-transform"
        ></div>
        <div class="flex align-items-center flex-nowrap mb-3 relative z-10">
          <div
            class="w-3rem h-3rem border-round-lg bg-blue-100 text-blue-600 flex align-items-center justify-content-center text-lg shadow-1"
          >
            <i class="pi pi-book"></i>
          </div>
          <h4 class="flex-flex-grow-1-1 min-w-0 text-sm font-bold text-800 ml-3">
            Catálogo de Cuentas
          </h4>
        </div>
        <p class="text-500 text-xs relative z-10">
          Árbol jerárquico de cuentas deudoras y acreedoras.
        </p>
        <div
          class="mt-3 flex align-items-center text-blue-600 text-xs font-semibold group-hover:text-blue-700 transition-colors"
        >
          <span>Ingresar</span
          ><i
            class="pi pi-arrow-right ml-1 text-xs transition-transform group-hover:translate-x-1"
          ></i>
        </div>
      </div>
    </a>

    <!-- Pólizas Contables -->
    <a routerLink="policies" class="group block col-12 sm:col-6 lg:col-3">
      <div
        class="surface-card border-round-xl border-1 surface-border p-5 h-full transition-all transition-duration-300 hover:shadow-3 hover:border-indigo-200 relative overflow-hidden"
      >
        <div
          class="absolute top-0 right-0 w-5rem h-5rem bg-indigo-50 border-circle -mr-4 -mt-4 transition-transform"
        ></div>
        <div class="flex align-items-center flex-nowrap mb-3 relative z-10">
          <div
            class="w-3rem h-3rem border-round-lg bg-indigo-100 text-indigo-600 flex align-items-center justify-content-center text-lg shadow-1"
          >
            <i class="pi pi-file-edit"></i>
          </div>
          <h4 class="flex-flex-grow-1-1 min-w-0 text-sm font-bold text-800 ml-3">
            Pólizas Contables
          </h4>
        </div>
        <p class="text-500 text-xs relative z-10">
          Registra movimientos con partida doble (cargo/abono).
        </p>
        <div
          class="mt-3 flex align-items-center text-indigo-600 text-xs font-semibold group-hover:text-indigo-700 transition-colors"
        >
          <span>Ingresar</span
          ><i
            class="pi pi-arrow-right ml-1 text-xs transition-transform group-hover:translate-x-1"
          ></i>
        </div>
      </div>
    </a>

    <!-- Presupuestos y Periodos -->
    <a routerLink="budgets" class="group block col-12 sm:col-6 lg:col-3">
      <div
        class="surface-card border-round-xl border-1 surface-border p-5 h-full transition-all transition-duration-300 hover:shadow-3 hover:border-emerald-200 relative overflow-hidden"
      >
        <div
          class="absolute top-0 right-0 w-5rem h-5rem bg-emerald-50 border-circle -mr-4 -mt-4 transition-transform"
        ></div>
        <div class="flex align-items-center flex-nowrap mb-3 relative z-10">
          <div
            class="w-3rem h-3rem border-round-lg bg-emerald-100 text-emerald-600 flex align-items-center justify-content-center text-lg shadow-1"
          >
            <i class="pi pi-chart-line"></i>
          </div>
          <h4 class="flex-flex-grow-1-1 min-w-0 text-sm font-bold text-800 ml-3">
            Presupuestos y Periodos
          </h4>
        </div>
        <p class="text-500 text-xs relative z-10">
          Proyecciones mensuales y apertura/cierre de periodos.
        </p>
        <div
          class="mt-3 flex align-items-center text-emerald-600 text-xs font-semibold group-hover:text-emerald-700 transition-colors"
        >
          <span>Ingresar</span
          ><i
            class="pi pi-arrow-right ml-1 text-xs transition-transform group-hover:translate-x-1"
          ></i>
        </div>
      </div>
    </a>
  </div>
</div>
