<div class="flex flex-column">
  <p>
    Seleccione el periodo y los reportes que desea incluir en la liga póblica.
  </p>

  <!-- Configuración del Periodo -->
  <form [formGroup]="form" class="flex align-items-end gap-3">
    <custom-input-select-signal
      class="flex-flex-grow-1-1"
      [control]="form.controls.month"
      [data]="months"
      label="Mes"
      optionLabel="label"
      optionValue="value"
    />
    <custom-input-select-signal
      class="flex-flex-grow-1-1"
      [control]="form.controls.year"
      [data]="years"
      label="Año"
    />
  </form>

  <!-- Lista de Reportes -->
  <div
    class="surface-border border-1 border-round p-3 max-h-20rem overflow-y-auto mt-3"
  >
    @for (report of reports; track report.id; let i = $index) {
    <div class="field-checkbox mb-3 flex align-items-center">
      <p-checkbox
        [binary]="true"
        [formControl]="reportsFormArray.at(i)"
        [inputId]="report.id"
      ></p-checkbox>
      <label [for]="report.id" class="ml-2 cursor-pointer select-none">
        <span class="font-bold">{{ report.code }}</span> - {{ report.name }}
      </label>
    </div>
    }
  </div>

  <div class="flex justify-content-end mt-4 gap-2">
    <custom-button
      label="Cancelar"
      icon="pi pi-times"
      severity="secondary"
      variant="outlined"
      (clicked)="onCancel()"
    />
    <custom-button
      label="Enviar Liga"
      icon="pi pi-send"
      (clicked)="onSubmit()"
      [loading]="loading()"
      [disabled]="loading()"
    />
  </div>
</div>
