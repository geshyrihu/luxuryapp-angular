<div>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <custom-input-text-signal
      [control]="form.controls.code"
      label="Código"
      placeholder="Ej. BGC"
    />
    
    <custom-input-text-signal
      [control]="form.controls.name"
      label="Nombre del Reporte"
      placeholder="Ej. Balance General Consolidado"
    />
    
    <custom-input-text-signal
      [control]="form.controls.description"
      label="Descripción"
      placeholder="Descripción detallada del reporte"
    />

    <div class="field-checkbox mt-3 mb-3">
      <p-checkbox
        formControlName="showZeros"
        [binary]="true"
        inputId="showZeros"
        label="Mostrar cuentas en cero por defecto"
      ></p-checkbox>
    </div>

    <custom-button-save [disabled]="form.invalid || submitting()" />
  </form>
</div>
