<p-table
  #dt
  [value]="dataSignal()"
  [rows]="tablePrimeNgRows"
  [paginator]="true"
  [globalFilterFields]="globalFilterFields()"
  [rowHover]="true"
  [rowsPerPageOptions]="rowsPerPageOptions"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  [showCurrentPageReport]="true"
  styleClass="font-sm custom-table"
  [(selection)]="selectedReports"
  selectionMode="multiple"
  (onRowReorder)="onRowReorder($event)"
  [rowTrackBy]="trackByFn"
  [reorderableColumns]="true"
>
  <ng-template #caption>
    <div
      [formGroup]="filterForm"
      class="flex justify-content-between align-items-center w-full flex-nowrap"
    >
      <!-- Filtros a la izquierda -->
      <div class="flex align-items-center flex-nowrap">
        <custom-input-select-signal
          class="w-10rem"
          [control]="filterForm.controls.month"
          [onlyInput]="false"
          [data]="months"
          optionLabel="label"
          optionValue="value"
        />
        <custom-input-select-signal
          class="w-10rem"
          [control]="filterForm.controls.year"
          [onlyInput]="false"
          [data]="years"
        />
        <custom-button
          customClass="w-10rem"
          ngbTooltip="Ver Presentación"
          label="Ver Presentación"
          iconClass="pi pi-images"
          severity="help"
          [showLabelOnDesktop]="true"
          size="small"
          [disabled]="selectedReports.length === 0"
          (clicked)="onViewSelected()"
        />
      </div>

      <!-- Acciones a la derecha -->
      <div class="flex align-items-center flex-nowrap">
        <custom-button
          finalLabel="Reporte Póblico"
          iconClass="pi pi-send"
          severity="help"
          (clicked)="onOpenSendModal()"
          ngbTooltip="Generar y enviar liga póblica de reportes"
        />
        <custom-button
          finalLabel="Restaurar Defaults"
          iconClass="pi pi-refresh"
          severity="warning"
          (clicked)="onSeedDefaults()"
          ngbTooltip="Reinicia los reportes predeterminados si hay errores"
        />
        <custom-button
          ngbTooltip="Datos Crudos (Espejo)"
          label="Datos Crudos Fiscal"
          iconClass="pi pi-database"
          severity="secondary"
          (clicked)="onViewMirror()"
          [showLabelOnDesktop]="true"
        />
        <custom-button
          ngbTooltip="Datos Crudos (Espejo)"
          label="Datos Crudos Cobranza"
          iconClass="pi pi-database"
          severity="secondary"
          (clicked)="onViewMirrorCobranza()"
          [showLabelOnDesktop]="true"
        />
        <custom-button
          finalLabel="Nuevo diseóo"
          iconClass="pi pi-plus"
          ngbTooltip="Nuevo diseóo"
          routerLink="/contabilidad/reportes-estados-financieros/designer/new"
        />
        <primeng-custom-caption
          (add)="onModalForm({ id: '', title: 'Nuevo Reporte Financiero' })"
          [dt]="dt"
        />
      </div>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th style="width: 2rem"></th>
      <th class="table-col-3rem">
        <p-tableHeaderCheckbox />
      </th>
      <th pSortableColumn="code">Código <p-sortIcon field="code" /></th>
      <th pSortableColumn="name">Nombre <p-sortIcon field="name" /></th>
      <th pSortableColumn="description">
        Descripción <p-sortIcon field="description" />
      </th>
      <th class="text-center"></th>
    </tr>
  </ng-template>

  <ng-template #body let-report let-rowIndex="rowIndex">
    <tr [pReorderableRow]="rowIndex">
      <td>
        <i class="pi pi-bars" pReorderableRowHandle></i>
      </td>
      <td class="text-center">
        <p-tableCheckbox [value]="report" />
      </td>
      <td>{{ report.code }}</td>
      <td class="font-bold">{{ report.name }}</td>
      <td>{{ report.description }}</td>
      <td class="text-center w-10rem">
        <div
          class="flex align-items-center gap-1 border-1 surface-border border-round-3xl px-2 py-1 bg-surface-0"
        >
          <custom-button-item
            label="Diseóar Estructura"
            iconClass="pi pi-pencil text-purple-500"
            (clicked)="onDesign(report.id)"
          />
          <custom-button-item
            label="Visualizar Reporte"
            iconClass="pi pi-eye text-blue-500"
            (clicked)="onView(report.id)"
          />

          <action-menu [item]="report">
            <custom-button-edit
              (clicked)="
                    onModalForm({ id: report.id, title: 'Editar Reporte Financiero' })
                "
            />
            <custom-button-delete (confirmed)="onDelete(report.id)" />
          </action-menu>
        </div>
      </td>
    </tr>
  </ng-template>
      <td class="text-center w-10rem">
        <div
          class="flex align-items-center gap-1 border-1 surface-border border-round-3xl px-2 py-1 bg-surface-0"
        >
          <custom-button-item
            label="Diseóar Estructura"
            iconClass="pi pi-pencil text-purple-500"
            (clicked)="onDesign(report.id)"
          />
          <custom-button-item
            label="Visualizar Reporte"
            iconClass="pi pi-eye text-blue-500"
            (clicked)="onView(report.id)"
          />

          <action-menu [item]="report">
            <custom-button-edit
              (clicked)="
                    onModalForm({ id: report.id, title: 'Editar Reporte Financiero' })
                "
            />
            <custom-button-delete (confirmed)="onDelete(report.id)" />
          </action-menu>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
  (add)="onModalForm({ id: '', title: 'Nuevo Reporte Financiero' })"
>
  <ng-template #listItemTemplate let-report>
    <div class="flex flex-column gap-1">
      <div class="flex justify-content-between align-items-center">
        <span class="font-bold text-lg">{{ report.name }}</span>
        <span class="text-sm bg-blue-50 text-blue-700 px-2 py-1 border-round"
          >{{ report.code }}</span
        >
      </div>
      <p class="text-sm text-600 m-0">{{ report.description }}</p>

      <div class="flex mt-2 justify-content-end">
        <custom-button
          pTooltip="Diseóar"
          icon="pi pi-pencil"
          (clicked)="onDesign(report.id)"
        />
        <custom-button
          pTooltip="Ver"
          icon="pi pi-eye"
          (clicked)="onView(report.id)"
        />
        <ion-button-edit
          (clicked)="onModalForm({ id: report.id, title: 'Editar Reporte' })"
        />
        <ion-button-delete (clicked)="onDelete(report.id)" />
      </div>
    </div>
  </ng-template>
</app-data-view-mobile>
