<form autocomplete="off" [formGroup]="form" (ngSubmit)="onSubmit()">
  <custom-input-text-signal
    [control]="form.controls.id"
    label="Id"
    [horizontal]="false"
    [readonly]="true"
  />
  <custom-input-text-signal
    [control]="form.controls.descripcion"
    label="Partida presupuestal"
    [horizontal]="false"
    [readonly]="true"
  />

  <custom-input-number-signal
    [horizontal]="false"
    [control]="form.controls.presupuestoMensual"
    label="Presupuesto Mensual"
  />

  <custom-button-save
    [propertyId]="id"
    [disabled]="form.invalid"
    [submitting]="submitting()"
  />
</form>
