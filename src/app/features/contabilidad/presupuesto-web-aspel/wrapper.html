<style>
  .budget-wrapper {
    height: calc(100vh - 90px);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .budget-wrapper ::ng-deep .budget-tabs {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  .budget-wrapper ::ng-deep .budget-tabs .p-tabpanels {
    display: flex;
    flex: 1;
    min-height: 0;
    padding: 0;
  }

  .budget-wrapper ::ng-deep .budget-tabs .p-tabpanel {
    width: 100%;
    min-width: 0;
    padding: 0;
  }

  .budget-wrapper ::ng-deep .budget-tabs .p-tabpanel[hidden] {
    display: none !important;
  }

  .budget-wrapper ::ng-deep .budget-tabs .p-tabpanel:not([hidden]) {
    display: flex;
    flex: 1;
    min-height: 0;
    padding: 0;
  }

  .budget-wrapper app-presupuesto-aspel-ejercicio-fiscal,
  .budget-wrapper app-espejo-aspel-extraordinarios {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 0;
  }
</style>

<div class="budget-wrapper">
  <div class="hidden md:flex flex-column flex-1 min-h-0">
  <p-tabs
    [value]="activeTabValue()"
    (valueChange)="activeTabValue.set($event)"
    class="nav-tabs justify-content-center sm:justify-content-start budget-tabs h-full"
  >
    <p-tablist>
      <p-tab value="presupuesto">Presupuesto</p-tab>
      <p-tab value="especiales">Extraordinarios y Proyectos</p-tab>
    </p-tablist>
    <p-tabpanels class="flex-1 min-h-0">
      <p-tabpanel value="presupuesto">
        <app-presupuesto-aspel-ejercicio-fiscal />
      </p-tabpanel>
      <p-tabpanel value="especiales">
        <app-espejo-aspel-extraordinarios />
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
  </div>

  <div class="block md:hidden">
    <ion-segment
      [ngModel]="activeTabValue()"
      (ngModelChange)="activeTabValue.set($event)"
      class="mb-3"
    >
      <ion-segment-button value="presupuesto">
        <ion-label>Presupuesto</ion-label>
      </ion-segment-button>
      <ion-segment-button value="especiales">
        <ion-label>Especiales</ion-label>
      </ion-segment-button>
    </ion-segment>

    <div class="mt-2">
      @switch (activeTabValue()) { @case ('presupuesto') {
      <app-presupuesto-aspel-ejercicio-fiscal />
      } @case ('especiales') {
      <app-espejo-aspel-extraordinarios />
      } }
    </div>
  </div>
</div>
