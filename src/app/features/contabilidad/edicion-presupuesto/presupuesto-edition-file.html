<div class="card">
  <p-fileUpload
    name="files"
    [url]="url"
    (onUpload)="onUpload($event)"
    [multiple]="true"
    accept="image/*, application/pdf"
    maxFileSize="1000000"
    cancelLabel="Cancelar"
    chooseLabel="Seleccionar archivos"
    uploadLabel="Cargar archivos"
    styleClass="font-size-12"
  >
    <ng-template #content>
      @if (uploadedFiles.length) {
      <ul>
        @for (file of uploadedFiles; track file) {
        <li>{{ file.name }} - {{ file.size }} bytes</li>
        }
      </ul>
      }
    </ng-template>
  </p-fileUpload>
</div>
<br />
<div class="card">
  <div class="card-body text-center">
    <div class="mb-3">
      <label>Descripción</label>
      <custom-input-textarea-signal
        [(ngModel)]="description"
        customClass="w-full text-justify"
        [cols]="30"
        [rows]="5"
        label="Descripción"
      />
    </div>
    <custom-button
      label="Guardar"
      iconClass="pi pi-save"
      [disabled]="description.length <= 0"
      (clicked)="onSetDescription()"
    />
  </div>
</div>
<p-table [value]="files" styleClass="custom-table hidden md:block">
  <ng-template #header>
    <tr>
      <th>Archivo</th>
      <th>Visualizar</th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.nameFile }}</td>
      <td>
        @if (item.typeFile === 'pdf') {
        <custom-button-view-pdf
          [showLabelOnDesktop]="true"
          [url]="item.pathFile"
          fileName="Presupuesto"
        />
        } @if (item.typeFile === 'img') {
        <p-image
          [src]="this.urlimg + item.pathFile"
          alt="."
          width="20"
          [preview]="true"
        ></p-image>
        }
      </td>
      <!-- Opciones -->
      <td class="no-print">
        <div class="flex justify-content-center">
          <custom-button-confirm
            iconClass="pi pi-trash"
            pTooltip="Eliminar"
            (confirmed)="onDeleteFile(item.id)"
          />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
</p-table>
