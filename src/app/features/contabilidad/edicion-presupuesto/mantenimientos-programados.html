<!-- 🖥️ INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<div class="hidden md:block"></div>
<p-table #dt [value]="dataSignal()" styleClass="custom-table card hidden md:block">
  <ng-template #header>
    <tr>
      <th>Equipo</th>
      <th>Fecha de Servicio</th>
      <th>Recurrencia</th>
      <th>Costo</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.nameMachionery }}</td>
      <td>{{ item.fechaServicio }}</td>
      <td>{{ item.recurrence }}</td>
      <td>{{ item.price }}</td>
    </tr>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>
