<p-table #dt [value]="dataSignal()" styleClass="custom-table card hidden md:block">
  <ng-template #header>
    <tr>
      <th>Fecha</th>
      <th>Monto Anterior</th>
      <th>Monto Nuevo</th>
      <th>Empleado</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.modificationDate }}</td>
      <td>{{ item.montoAnterior }}</td>
      <td>{{ item.montoNuevo }}</td>
      <td>{{ item.employee }}</td>
    </tr>
  </ng-template>
</p-table>
