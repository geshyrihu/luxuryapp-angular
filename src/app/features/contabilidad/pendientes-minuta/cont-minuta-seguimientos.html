<p-table [value]="dataSignal()" styleClass="custom-table card hidden md:block">
  <ng-template #header>
    <tr>
      <th style="white-space: 20%"></th>
      <th style="white-space: 70%"></th>
      <th style="white-space: 10%"></th>
    </tr>
  </ng-template>
  <ng-template #body let-seguimiento>
    <tr>
      <td>
        {{ seguimiento.fecha }}, {{ seguimiento.seguimiento | titlecase }}
      </td>
      <td>
        <div class="flex content-center">
          <custom-button
            icon="edit"
            ngbTooltip="Editar"
            (clicked)="onModalFormSeguimiento(seguimiento.id)"
          />
          <custom-button-confirm
            icon="trash"
            ngbTooltip="Eliminar"
            (clicked)="onDeleteSeguimiento(seguimiento.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
