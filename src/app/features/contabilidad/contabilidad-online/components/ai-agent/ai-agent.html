<p-drawer
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  position="right"
  styleClass="w-full md:w-30rem p-0"
  [blockScroll]="false"
>
  <ng-template pTemplate="header">
    <div class="flex align-items-center gap-2">
      <i class="pi pi-sparkles text-primary text-2xl font-bold"></i>
      <div class="flex flex-column">
        <span class="font-bold text-xl">Auditor Inteligente</span>
        <span class="text-xs text-500"
          >Analizando: {{ filterS.currentReportName() || 'Ningún reporte'
          }}</span
        >
      </div>
    </div>
  </ng-template>

  <ng-template pTemplate="content">
    <div class="flex flex-column h-full">
      <!-- Messages Area -->
      <div class="flex-1 overflow-y-auto px-1 py-3 flex flex-column gap-3">
        <div
          *ngFor="let msg of messages()"
          class="flex w-full"
          [ngClass]="{'justify-content-end': msg.role === 'user', 'justify-content-start': msg.role === 'assistant'}"
        >
          <div
            class="p-3 border-round-xl max-w-full md:max-w-90"
            [ngClass]="msg.role === 'user' ? 'bg-primary text-white border-noround-right' : 'surface-200 text-800 border-noround-left'"
          >
            <div class="flex align-items-center justify-content-between gap-2 mb-2">
              <i
                class="pi"
                [ngClass]="msg.role === 'user' ? 'pi-user' : 'pi-sparkles'"
              ></i>
              <p-button
                *ngIf="msg.role === 'assistant'"
                icon="pi pi-volume-up"
                size="small"
                styleClass="p-button-text p-button-sm"
                (onClick)="replayMessage(msg)"
              />
            </div>

            <!-- Contenido del mensaje -->
            <div
              *ngIf="!msg.isHtml"
              class="white-space-pre-wrap line-height-3 text-sm"
            >
              {{ msg.content }}
            </div>
            <div
              *ngIf="msg.isHtml"
              [innerHTML]="msg.content"
              class="html-ai-response text-sm line-height-3 shadow-none"
            ></div>
          </div>
        </div>

        <div *ngIf="loading()" class="flex justify-content-start">
          <div
            class="p-3 surface-200 border-round-xl border-noround-left flex align-items-center gap-2"
          >
            <p-progressSpinner
              styleClass="w-1rem h-1rem"
              strokeWidth="6"
              animationDuration=".5s"
            ></p-progressSpinner>
            <span class="text-sm">Analizando datos...</span>
          </div>
        </div>

        <div *ngIf="speaking()" class="flex justify-content-start">
          <div
            class="p-3 surface-100 border-round-xl border-1 border-primary flex align-items-center gap-2"
          >
            <i class="pi pi-volume-up text-primary"></i>
            <span class="text-sm">Reproduciendo respuesta con ElevenLabs...</span>
          </div>
        </div>
      </div>

      <!-- Suggested Questions -->
      <div class="mt-auto pt-3 border-top-1 surface-border">
        <div class="flex align-items-center justify-content-between gap-2 px-2">
          <span class="text-xs text-500 font-bold uppercase block mb-2"
            >Preguntas Sugeridas</span
          >
          <div class="flex gap-2 mb-2">
            <p-button
              icon="pi pi-volume-up"
              label="Releer"
              size="small"
              styleClass="p-button-text p-button-sm"
              [disabled]="loading() || messages().length === 0"
              (onClick)="replayMessage(messages()[messages().length - 1])"
            />
            <p-button
              icon="pi pi-stop"
              label="Detener"
              size="small"
              styleClass="p-button-text p-button-sm"
              [disabled]="!speaking()"
              (onClick)="stopAudio()"
            />
          </div>
        </div>
        <div
          class="flex overflow-x-auto gap-2 pb-2 px-2 scrollbar-hidden"
          style="white-space: nowrap"
        >
          <p-button
            *ngFor="let q of suggestedQuestions"
            (onClick)="setQuery(q)"
            [label]="q"
            size="small"
            styleClass="p-button-outlined p-button-secondary text-xs flex-shrink-0"
            icon="pi pi-question-circle"
          >
          </p-button>
        </div>
      </div>

      <!-- Input Area -->
      <div class="p-2 border-top-1 surface-border bg-white mt-1">
        <div class="p-inputgroup">
          <input
            pInputText
            type="text"
            [ngModel]="currentQuery()"
            (ngModelChange)="currentQuery.set($event)"
            (keyup.enter)="sendQuery()"
            placeholder="Pregunta sobre este informe..."
            [disabled]="loading()"
            class="border-round-left-3xl pl-4"
          />
          <p-button
            icon="pi pi-send"
            (onClick)="sendQuery()"
            [disabled]="loading() || !currentQuery()"
            styleClass="p-button-primary border-round-right-3xl px-4"
          >
          </p-button>
        </div>
      </div>
    </div>
  </ng-template>
</p-drawer>

<!-- Global Styles for AI HTML generation -->
<style>
  .html-ai-response p {
    margin-top: 0;
    margin-bottom: 0.5rem;
  }
  .html-ai-response ul,
  .html-ai-response ol {
    padding-left: 1.5rem;
    margin-top: 0;
    margin-bottom: 0.5rem;
  }
  .html-ai-response li {
    margin-bottom: 0.25rem;
  }
</style>
