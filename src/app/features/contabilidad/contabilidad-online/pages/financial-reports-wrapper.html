<section class="surface-ground min-h-screen flex flex-column gap-4">
  <div class="w-full xl:w-11 mx-auto flex flex-column gap-4">
    <header
      class="surface-card border-round-xl border-1 surface-border shadow-1 overflow-hidden"
    >
      <div class="bg-primary" style="height: 0.45rem"></div>

      <div
        class="surface-100 p-2 flex flex-column xl:flex-row xl:align-items-center xl:justify-content-between gap-3"
      >
        <div class="flex align-items-center gap-3 flex-1 min-w-0">
          <div
            class="surface-card border-round-xl border-1 surface-border inline-flex align-items-center justify-content-center p-2"
            style="
              width: auto;
              height: auto;
              max-height: 72px;
              flex-shrink: 0;
            "
          >
            <img
              [src]="customerLogo()"
              [alt]="customerName()"
              style="
                display: block;
                width: auto;
                height: auto;
                max-width: 160px;
                max-height: 56px;
                object-fit: contain;
              "
            />
          </div>

          <div class="flex flex-column gap-1 min-w-0">
            <small
              class="text-primary font-bold uppercase"
              style="letter-spacing: 0.14em"
            >
              LuxuryApp · Contabilidad Online
            </small>
            <h1 class="text-primary text-3xl md:text-4xl line-height-2 m-0">
              Estados Financieros
            </h1>
            <div class="flex flex-column gap-1">
              <p class="text-900 font-semibold m-0 line-height-3">
                {{ activeReportTitle() }}
              </p>
              <p class="text-color-secondary line-height-3 m-0 max-w-26rem">
                {{ activeReportDescription() }}
              </p>
            </div>
          </div>
        </div>

        <aside class="xl:w-auto xl:min-w-0">
          <div
            class="grid bg-white p-2 md:p-3 border-round-lg border-1 border-200 gap-2 md:gap-3"
            style="
              grid-template-columns:
                minmax(150px, 170px) minmax(170px, 190px)
                auto;
            "
          >
            <div class="flex align-items-end">
              <custom-input-text-signal
                [(ngModel)]="filterS.year"
                type="number"
                size="small"
                [horizontal]="false"
                [noMargin]="true"
              />
            </div>

            <div class="flex align-items-end">
              <custom-input-select-signal
                [data]="[
                  { label: 'Enero', value: 0 },
                  { label: 'Febrero', value: 1 },
                  { label: 'Marzo', value: 2 },
                  { label: 'Abril', value: 3 },
                  { label: 'Mayo', value: 4 },
                  { label: 'Junio', value: 5 },
                  { label: 'Julio', value: 6 },
                  { label: 'Agosto', value: 7 },
                  { label: 'Septiembre', value: 8 },
                  { label: 'Octubre', value: 9 },
                  { label: 'Noviembre', value: 10 },
                  { label: 'Diciembre', value: 11 }
                ]"
                [(ngModel)]="filterS.mesIdx"
                optionLabel="label"
                optionValue="value"
                [showClear]="false"
                [horizontal]="false"
                [noMargin]="true"
                [filter]="true"
              />
            </div>

            <div class="flex align-items-end h-full">
              <div
                class="flex flex-wrap md:flex-nowrap gap-2 w-full xl:justify-content-end align-items-end"
              >
                <custom-button
                  iconClass="pi pi-refresh"
                  label="Actualizar"
                  variant="outlined"
                  severity="secondary"
                  size="small"
                  [showLabelOnDesktop]="true"
                  (clicked)="refreshReports()"
                />
                <custom-button
                  iconClass="pi pi-comments"
                  label="Explicar IA"
                  variant="outlined"
                  size="small"
                  severity="info"
                  [showLabelOnDesktop]="true"
                  (clicked)="aiAgentExplicador.togglePanel()"
                />
                <custom-button
                  iconClass="pi pi-sparkles"
                  label="Auditor CO"
                  variant="outlined"
                  size="small"
                  severity="contrast"
                  [showLabelOnDesktop]="true"
                  (clicked)="aiAgentContabilidadOnline.togglePanel()"
                />
                <custom-button
                  iconClass="pi pi-sparkles"
                  label="Auditor IA"
                  variant="outlined"
                  size="small"
                  severity="help"
                  [showLabelOnDesktop]="true"
                  (clicked)="aiAgent.togglePanel()"
                />
                <custom-button
                  iconClass="pi pi-external-link"
                  label="Vista cliente"
                  variant="outlined"
                  size="small"
                  severity="success"
                  [showLabelOnDesktop]="true"
                  [disabled]="!clienteUrl()"
                  (clicked)="openClienteView()"
                />
              </div>
            </div>
          </div>
        </aside>
      </div>

      <div class="bg-yellow-500" style="height: 0.2rem"></div>
    </header>

    <div class="surface-card border-round-xl border-1 surface-border shadow-1">
      <p-tabs [value]="reportIndex()" (valueChange)="onTabChange($event)">
        <p-tablist>
          <p-tab [value]="0"><i class="pi pi-balance-scale mr-2"></i>EPF</p-tab>
          <p-tab [value]="1"
            ><i class="pi pi-list mr-2"></i>E. Resultados</p-tab
          >
          <p-tab [value]="2"
            ><i class="pi pi-list mr-2"></i>E. Resultados V2</p-tab
          >
          <p-tab [value]="3"
            ><i class="pi pi-plus-circle mr-2"></i>C. Extraordinaria</p-tab
          >
          <p-tab [value]="4"><i class="pi pi-percentage mr-2"></i>P vs R</p-tab>
          <p-tab [value]="5"
            ><i class="pi pi-table mr-2"></i>R. Financiero</p-tab
          >
          <p-tab [value]="6"
            ><i class="pi pi-money-bill mr-2"></i>Flujo Efectivo</p-tab
          >
          <p-tab [value]="7"><i class="pi pi-users mr-2"></i>Cobranza</p-tab>
          <p-tab [value]="8"><i class="pi pi-wallet mr-2"></i>Presupuesto</p-tab>
        </p-tablist>

        <p-tabpanels>
          <p-tabpanel [value]="0" class="p-4 pt-5">
            <app-estado-posicion-financiera />
          </p-tabpanel>
          <p-tabpanel [value]="1" class="p-4 pt-5">
            <app-estado-resultados />
          </p-tabpanel>
          <p-tabpanel [value]="2" class="p-4 pt-5">
            <app-estado-resultados-v2 />
          </p-tabpanel>
          <p-tabpanel [value]="3" class="p-4 pt-5">
            <app-cedula-extraordinaria />
          </p-tabpanel>
          <p-tabpanel [value]="4" class="p-4 pt-5">
            <app-cedula-presupuestal />
          </p-tabpanel>
          <p-tabpanel [value]="5" class="p-4 pt-5">
            <app-reporte-financiero />
          </p-tabpanel>
          <p-tabpanel [value]="6" class="p-4 pt-5">
            <app-flujo-efectivo />
          </p-tabpanel>
          <p-tabpanel [value]="7" class="p-4 pt-5">
            <app-analisis-cobranza />
          </p-tabpanel>
          <p-tabpanel [value]="8" class="p-4 pt-5">
            <app-presupuesto-contabilidad />
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>
    </div>

    <app-contabilidad-ai-agent #aiAgent [autoReadResponses]="true" />
    <app-contabilidad-online-ai-agent
      #aiAgentContabilidadOnline
      [autoReadResponses]="true"
    />
    <app-explicador-contabilidad-online-ai-agent
      #aiAgentExplicador
      [autoReadResponses]="true"
    />
  </div>
</section>
