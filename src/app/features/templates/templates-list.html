<p-table
  [globalFilterFields]="globalFilterFields()"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
      [showAdd]="aspRoleS.hasRole(AspRole.SuperUsuario)"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-30" pSortableColumn="folio">
        Folio
        <p-sortIcon field="folio" />
      </th>
      <th class="table-col-30" pSortableColumn="descripcion">
        DescripciÃ³n
        <p-sortIcon field="descripcion" />
      </th>
      <th class="table-col-30" pSortableColumn="pathFormato">
        Archivo
        <p-sortIcon field="pathFormato" />
      </th>
      @if (aspRoleS.roleSignal(AspRole.SuperUsuario)()) {
      <th class="table-col-10"></th>
      }
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.folio }}</td>
      <td>{{ item.name | uppercase }}</td>
      <td class="text-center">
        <custom-button-view-pdf
          [showLabelOnDesktop]="true"
          [url]="item.path"
          fileName="Formato"
        />
      </td>
      <!-- Opciones -->
      @if (aspRoleS.roleSignal(AspRole.SuperUsuario)()) {
      <td class="no-print">
        <app-action-menu>
          <ng-container actions>
            <ion-button-edit
              (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
            />
            <ion-button-delete (confirmed)="onDelete(item.id)" />
          </ng-container>
        </app-action-menu>
      </td>
      }
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" detail="false" class="ion-no-padding">
      <div slot="start" style="
        width:36px; height:36px; border-radius:10px;
        background:#dbeafe; display:flex; align-items:center;
        justify-content:center; flex-shrink:0; margin-left:16px;
      ">
        <ion-icon name="document-outline" style="font-size:20px; color:#2563eb;"></ion-icon>
      </div>
      <ion-label>
        <h3>{{ item.name | uppercase }}</h3>
        <p>Folio: {{ item.folio }}</p>
      </ion-label>
      <app-action-menu slot="end">
        <ion-button-edit (clicked)="onModalForm({ id: item.id, title: 'Editar' })" />
        <ion-button-delete (confirmed)="onDelete(item.id)" />
      </app-action-menu>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
