<p-card>
  <ng-template #header>
    <div class="flex align-items-center p-3 gap-2">
      <i class="pi pi-camera text-primary text-2xl"></i>
      <span class="text-xl font-bold">Foto de perfil</span>
    </div>
  </ng-template>
  <ng-template #content>
    <div class="flex flex-column align-items-center gap-4 py-3">
      <custom-input-img-signal
        (fileSelected)="changeImg($event)"
        [urlImgCurrent]="imgUpload ? imgTemp : infoEmployeeDTO.photoPath"
        label="Subir desde archivos"
        [horizontal]="false"
      />

      <div class="flex flex-column sm:flex-row gap-3 w-full justify-content-center px-4">
        <!-- Input oculto para cámara (móvil) -->
        <input
          #cameraInput
          type="file"
          accept="image/*"
          capture="environment"
          hidden
          (change)="onCameraCapture($event)"
        />

        <p-button
          label="Tomar foto"
          icon="pi pi-camera"
          styleClass="p-button-outlined p-button-secondary w-full sm:w-auto"
          (onClick)="triggerCamera()"
        />
      </div>
    </div>
  </ng-template>
</p-card>
