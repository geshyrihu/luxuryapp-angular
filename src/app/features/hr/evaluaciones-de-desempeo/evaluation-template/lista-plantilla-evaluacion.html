<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption (add)="onCreate()" [dt]="dt" />
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="name">
        Nombre
        <p-sorticon field="name"></p-sorticon>
      </th>
      <th>Descripción</th>
      <th class="text-center" pSortableColumn="isActive">
        Estado
        <p-sorticon field="isActive"></p-sorticon>
      </th>
      <th class="text-center">Categoróas</th>
      <th class="text-center">Preguntas</th>
      <th class="text-center table-col-10rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.name }}</td>
      <td>{{ item.description }}</td>
      <td class="text-center">
        <p-tag
          [value]="item.isActive ? 'Activa' : 'Inactiva'"
          [severity]="item.isActive ? 'success' : 'danger'"
        ></p-tag>
      </td>
      <td class="text-center">{{ item.categoryCount }}</td>
      <td class="text-center">{{ item.questionCount }}</td>
      <!-- Opciones -->
      <td class="no-print text-center">
        <div class="flex justify-content-center">
          <iw-button-edit (clicked)="onEdit(item.id)" />
          <iw-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onCreate()"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" detail="false" class="ion-no-padding">
      <div
        slot="start"
        class="w-3rem h-3rem border-round flex align-items-center justify-content-center flex-shrink-0 ml-3 surface-100"
      >
        <app-icon
          icon="mdi:clipboard-text-outline"
          class="text-xl text-yellow-600"
        />
      </div>
      <ion-label>
        <h3>{{ item.name }}</h3>
        <p>{{ item.description }}</p>
        <p>
          {{ item.isActive ? 'Activa' : 'Inactiva' }} é {{ item.categoryCount }}
          categoróas é {{ item.questionCount }} preguntas
        </p>
      </ion-label>
      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit (clicked)="onEdit(item.id)" label="Editar" />
          <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
