<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <lx-tabs [tabs]="tabs()" [(activeId)]="activeTab">
    <div tab="datos">
      <div class="grid pt-2">
        <div class="col-12 md:col-6">
          <custom-input-select-signal
            label="Tipo de Incidencia"
            [required]="true"
            [control]="form.controls.incidentTypeId"
            [data]="incidentTypes()"
            [filter]="true"
          />
        </div>
        <div class="col-12 md:col-6">
          <custom-input-select-signal
            label="Nivel de Severidad"
            [required]="true"
            [control]="form.controls.severityLevel"
            [data]="cb_severity()"
            [filter]="true"
          />
        </div>
        <div class="col-12 md:col-6">
          <custom-input-date-time-signal
            label="Fecha y Hora del Incidente"
            [required]="true"
            [control]="form.controls.incidentDateTime"
          />
        </div>
        <div class="col-12 md:col-6">
          <custom-input-select-signal
            label="Tipo de Sanción (opcional)"
            [control]="form.controls.sanctionTypeId"
            [data]="sanctionTypes()"
            placeholder="Sin sanción inmediata"
            [filter]="true"
          />
        </div>
        <div class="col-12">
          <custom-input-textarea-signal
            label="Descripción"
            [required]="true"
            [control]="form.controls.description"
            [rows]="4"
            placeholder="Describa el incidente con detalle (mínimo 10 caracteres)"
          />
        </div>
      </div>
    </div>

    <div tab="adjuntos">
      @if (id()) {
      <app-incident-attachments [incidentId]="id()" />
      }
    </div>

    <div tab="testigos">
      @if (id()) {
      <app-incident-witnesses [incidentId]="id()" />
      }
    </div>

    <div tab="suspension">
      @if (id()) {
      <app-suspension-days-manager [incidentId]="id()" />
      }
    </div>
  </lx-tabs>

  <!-- ─── FOOTER FIJO ───────────────────────────────────────── -->
  <div
    class="flex align-items-center justify-content-between mt-4 pt-3 border-top-1 surface-border"
  >
    <!-- Indicador de estado -->
    <div class="text-sm" style="color: var(--p-text-muted-color)">
      @if (!id()) {
      <span
        >⚠️ Guarda los datos básicos para habilitar adjuntos, testigos y días de
        suspensión.</span
      >
      } @else {
      <span style="color: var(--p-green-600)"
        >✅ Incidencia guardada — agrega adjuntos, testigos y días de suspensión
        desde las pestañas.</span
      >
      }
    </div>

    <!-- Acciones -->
    <div class="flex">
      @if (activeTab() === 'datos') {
      <il-button-save
        [propertyId]="id"
        [disabled]="form.invalid"
        [submitting]="submitting()"
        [label]="id() ? 'Guardar cambios' : 'Guardar y continuar →'"
        type="submit"
      />
      } @if (id()) {
      <il-button-save
        label="Finalizar"
        type="button"
        (clicked)="onFinish()"
      />
      }
    </div>
  </div>
</form>
