<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column">
  <custom-input-select-signal
    label="Nuevo Estatus de Investigacion"
    [control]="form.controls.investigationStatus"
    [data]="cb_status()"
    [filter]="true"
  />
  <custom-input-textarea-signal
    label="Notas de Investigacion"
    [control]="form.controls.investigationNotes"
    [rows]="4"
    placeholder="Detalle los hallazgos de la investigacion"
  />
  <custom-input-switch-signal
    label="¿Se aplicara sancion?"
    [control]="form.controls.sanctionApplied"
  />
  <custom-input-textarea-signal
    label="Justificacion"
    [control]="form.controls.decisionRationale"
    [rows]="3"
    placeholder="Obligatorio si no se aplica sancion"
  />
  <div class="flex justify-content-end mt-2">
    <il-button-save
      [propertyId]="incidentId()"
      [disabled]="form.invalid"
      [submitting]="submitting()"
      label="Resolver"
      type="submit"
    />
  </div>
</form>
