<p-table
  [globalFilterFields]="globalFilterFields()"
  [value]="dataSignal()"
  #dt
  styleClass="custom-table card hidden md:block"
  [loading]="loading()"
>
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nuevo Registro Clinico' })"
      [showSearch]="dataSignal().length > 0"
      [dt]="dt"
    />
  </ng-template>

  @if (dataSignal().length !== 0) {
  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th>Descripcion</th>
      <th class="table-col-5 no-print"></th>
    </tr>
  </ng-template>
  }

  <ng-template #body let-item>
    <tr>
      <td>{{ item.name }}</td>
      <td>{{ item.description }}</td>
      <td class="no-print">
        <div class="flex justify-content-center">
          <custom-button
            icon="edit"
            ngbTooltip="Editar"
            (clicked)="onModalForm({ id: item.id, title: 'Editar Registro Clinico' })"
          />
          <custom-button-confirm
            icon="trash"
            ngbTooltip="Eliminar"
            (confirmed)="onDelete(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>

  @if (dataSignal().length === 0) {
  <ng-template emptymessage>
    <tr>
      <td colspan="3">No hay datos clinicos registrados.</td>
    </tr>
  </ng-template>
  }
</p-table>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro Clinico' })"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" detail="false" class="ion-no-padding">
      <ion-label>
        <h3>{{ item.name }}</h3>
        <p>{{ item.description }}</p>
      </ion-label>
      <app-action-menu slot="end">
        <ion-button-edit
          (clicked)="onModalForm({ id: item.id, title: 'Editar Registro Clinico' })"
        />
        <ion-button-delete (confirmed)="onDelete(item.id)" />
      </app-action-menu>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
