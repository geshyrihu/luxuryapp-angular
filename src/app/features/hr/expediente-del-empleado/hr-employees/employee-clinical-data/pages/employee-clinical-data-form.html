<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="grid">
    <div class="col-12">
      <custom-input-text-signal
        [control]="f.name"
        label="Nombre"
        placeholder="Ej. Alergia, tipo de sangre, condicion"
      />
    </div>

    <div class="col-12">
      <custom-input-textarea-signal
        [control]="f.description"
        label="Descripcion"
        placeholder="Detalle del dato clinico"
      />
    </div>

    <div class="col-12 flex justify-content-end mt-4">
      <il-button-save [disabled]="form.invalid" [submitting]="submitting()" />
    </div>
  </div>
</form>
