<div class="p-3">
  <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
    <custom-input-text-signal
      [control]="form.controls.id"
      label="Id"
      placeholder="Id"
      [readonly]="true"
    />
    <custom-input-text-signal
      [control]="form.controls.nameContact"
      label="Nombre Completo"
      placeholder="Nombre completo"
    />
    <custom-input-mask-signal
      [control]="form.controls.phoneNumber"
      label="Tél. Celular"
      placeholder="(00) 0000-0000"
      customMask="(00) 0000-0000"
    />
    <custom-input-select-signal
      [control]="form.controls.relation"
      label="Parentesco"
      [data]="cb_relacion()"
      [filter]="true"
    />
    <il-button-save
      [propertyId]="id"
      [disabled]="form.invalid"
      [submitting]="submitting()"
      class="pb-2"
    />
  </form>
</div>
