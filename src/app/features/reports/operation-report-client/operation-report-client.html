@if (data()) {
<div class="container my-4">
  <div class="text-center mb-5">
    <!-- Encabezado con el logo del cliente y nombre -->
    <img
      [src]="data()!.logoCustomer"
      alt="Logo del cliente"
      class="w-full h-auto mb-3"
      style="max-width: 150px; height: auto"
    />
    <h1 class="text-2xl font-bold text-primary">{{ data()!.customer }}</h1>
    <p class="text-lg text-color-secondary">{{ data()!.dateReport }}</p>
    <hr class="my-4" />
  </div>
  @for (ticket of data()!.reportes; track ticket) {
  <div class="container mb-4">
    <div class="card shadow-1 mb-4">
      <div class="card-body">
        <strong>{{ ticket.title }}</strong>
        <p class="text-justify mt-2 mb-4">{{ ticket.description }}</p>

        <div class="grid">
          <div class="col-6">
            <img
              [src]="ticket.beforeWork"
              alt="Imagen antes"
              class="w-full h-full border-round shadow-2"
              style="max-height: 300px; object-fit: cover"
            />
          </div>
          <div class="col-6">
            <img
              [src]="ticket.afterWork"
              alt="Imagen después"
              class="w-full h-full border-round shadow-2"
              style="max-height: 300px; object-fit: cover"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
  }
</div>
}
