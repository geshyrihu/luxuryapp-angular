<div class="card">
  <div class="card-body">
    <h3 class="h3 mb-3">Datos Laborales</h3>
    <form autocomplete="off" [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- grid: 6 columnas en desktop, 3 en md, 1 en móvil -->
      <div class="grid">
        <!-- CONTRATO -->
        <div class="col-12 md:col-4 lg:col-3">
          <custom-input-select-signal
            [control]="form.controls.typePerson"
            label="Contrato"
            [data]="cb_type_contract()"
            [horizontal]="false"
            [filter]="true"
          />
        </div>

        <!-- ESTATUS -->
        <div class="col-12 md:col-4 lg:col-3">
          <custom-input-select-signal
            [control]="form.controls.active"
            label="Estatus"
            [data]="cb_state"
            [horizontal]="false"
            [filter]="true"
          />
        </div>

        <!-- NIVEL EDUCATIVO -->
        <div class="col-12 md:col-4 lg:col-3">
          <custom-input-select-signal
            [control]="form.controls.educationLevel"
            label="Nivel Educativo"
            [data]="cb_education_level()"
            [horizontal]="false"
            [filter]="true"
          />
        </div>

        <!-- FECHA INGRESO -->
        <div class="col-12 md:col-4 lg:col-3">
          <custom-input-date-signal
            [control]="form.controls.dateAdmission"
            label="Fecha de ingreso"
            placeholder="fecha de ingreso"
            [horizontal]="false"
          />
        </div>

        <!-- SUELDO -->
        <div class="col-12 md:col-4 lg:col-3">
          <custom-input-currency-signal
            [control]="form.controls.salary"
            label="Sueldo mensual neto"
            placeholder="sueldo mensual neto"
            [horizontal]="false"
          />
        </div>

        <!-- NÚMERO DE EMPLEADO -->
        <div class="col-12 md:col-4 lg:col-3">
          <custom-input-number-signal
            [control]="form.controls.numberEmployee"
            label="Número de Empleado"
            placeholder="Ej. 1042"
            [horizontal]="false"
            helperText="Número asignado por RRHH"
            [min]="1"
            [max]="9999"
            [useGrouping]="false"
          />
        </div>

        <!-- CLIENTE (si aplica) -->
        @if(aspRoleS.hasAny([AspRole.SuperUsuario, AspRole.Reclutamiento])){
        <div class="col-12 md:col-4 lg:col-3">
          <custom-input-select-signal
            [control]="form.controls.customerId"
            label="Cliente"
            [data]="cb_customer()"
            [horizontal]="false"
            [filter]="true"
          />
        </div>
        }
      </div>
      <!-- boton -->
      <div class="flex justify-content-end mt-3">
        <custom-button-save
          [disabled]="form.invalid"
          [submitting]="submitting()"
        />
      </div>
    </form>
  </div>
</div>
