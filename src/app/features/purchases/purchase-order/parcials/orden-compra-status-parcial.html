@if (mostrarTabla) {

<!-- [disabled]="ordenCompraPresupuestoUtilizado" -->
<custom-button
  iconClass="pi pi-chart-bar"
  label="ESTATUS DE COMPRA"
  (clicked)="onModalOrdenCompraStatus()"
  customClass="w-full "
  size="small"
  [showLabelOnDesktop]="true"
/>

<div class="card p-2 border border-round border-surface-200">
  <div class="mb-1 flex">
    <div class="text-color-secondary text-sm font-medium table-col-40">
      Pagado:
    </div>
    <div class="text-color-secondary text-sm flex-grow-1">
      {{ ordenCompra.ordenCompraStatus.sePago | eBoolText }}
    </div>
  </div>

  <div class="mb-1 flex">
    <div class="text-color-secondary text-sm font-medium table-col-40">
      Entregado:
    </div>
    <div class="text-color-secondary text-sm flex-grow-1">
      {{ ordenCompra.ordenCompraStatus.seRecibio | eBoolText }}
    </div>
  </div>

  <div class="mb-1 flex">
    <div class="text-color-secondary text-sm font-medium table-col-40">
      Recibido por:
    </div>
    <div class="text-color-secondary text-sm flex-grow-1">
      {{ ordenCompra.ordenCompraStatus.recibidoPor }}
    </div>
  </div>
</div>
}
