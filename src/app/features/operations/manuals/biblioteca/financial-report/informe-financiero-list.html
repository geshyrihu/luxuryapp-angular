<!-- ??? INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<div class="container-fluid hidden md:block">
  @if (dataSignal().length > 0) {
  <div class="list-group mt-1">
    @for (item of dataSignal(); track item) {
    <div
      class="list-group-item flex align-items-center justify-content-between w-full py-1 mb-1"
    >
      <div class="flex justify-content-between align-items-center w-full">
        <div>
          <span class="text-break">{{ item.period }}</span>
        </div>
        @if (item.hasDocument) {
        <il-button-view-pdf
          [url]="item.nameFileEstadoFinanciero"
          fileName="Informe Financiero"
        />
        } @if (!item.hasDocument) {
        <p>Sin Informe</p>
        }
      </div>
    </div>
    }
  </div>
  } @if (dataSignal().length === 0) {
  <div class="text-center mt-3">
    <p>No se encontraron informes.</p>
  </div>
  }
</div>

<!-- ?? INICIO: Componente adaptado para versión mívil -->
<div class="block md:hidden">
  <app-data-view-mobile
    [data]="dataSignal()"
    [showAdd]="false"
    [globalFilterFields]="[]"
  >
    <ng-template #listItemTemplate let-item>
      <ili-list-item [noPadding]="true">
        <div
          start
          class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
          style="
            width: 38px;
            height: 38px;
            background: var(--ds-primary-50, #edf1ff);
          "
        >
          <app-icon
            icon="mdi:chart-bar"
            style="font-size: 1.1rem; color: var(--ds-primary)"
          />
        </div>
        
          <div class="flex justify-content-between align-items-center mb-1">
            <h2 class="font-bold m-0 text-base text-wrap">{{ item.period }}</h2>
          </div>
        

        <div end class="flex align-items-center">
          @if (item.hasDocument) {
          <il-button-view-pdf
            [url]="item.nameFileEstadoFinanciero"
            pdf="Informe"
          />
          } @else {
          <span class="text-sm text-500">Sin Informe</span>
          }
        </div>
      </ili-list-item>
    </ng-template>
  </app-data-view-mobile>
</div>
