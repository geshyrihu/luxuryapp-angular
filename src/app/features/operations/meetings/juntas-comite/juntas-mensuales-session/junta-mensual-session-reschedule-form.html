<form [formGroup]="form" class="grid" (ngSubmit)="onSubmit()">
  <div class="col-12 md:col-6">
    <custom-input-date-signal
      [control]="form.controls.meetingDate"
      label="Fecha de la sesion"
      placeholder="Selecciona la fecha"
    />
  </div>

  <div class="col-12 md:col-3">
    <label class="block font-semibold mb-2">Hora inicio</label>
    <input class="w-full p-inputtext p-component" formControlName="startTime" type="time" />
  </div>

  <div class="col-12 md:col-3">
    <label class="block font-semibold mb-2">Hora fin</label>
    <input class="w-full p-inputtext p-component" formControlName="endTime" type="time" />
  </div>

  <div class="col-12 md:col-4">
    <label class="block font-semibold mb-2">Modalidad</label>
    <select class="w-full p-inputtext p-component" formControlName="modality">
      <option [ngValue]="0">Virtual</option>
      <option [ngValue]="1">Presencial</option>
    </select>
  </div>

  <div class="col-12 md:col-8">
    <custom-input-text-signal
      [control]="form.controls.location"
      label="Ubicacion"
      placeholder="Ej. Casa club, Zoom, Biblioteca"
    />
  </div>

  <div class="col-12">
    <custom-input-textarea-signal
      [control]="form.controls.description"
      label="Descripcion"
      placeholder="Notas para la agenda reprogramada"
      [rows]="5"
    />
  </div>

  <div class="col-12">
    <il-button-save [submitting]="submitting()" />
  </div>
</form>
