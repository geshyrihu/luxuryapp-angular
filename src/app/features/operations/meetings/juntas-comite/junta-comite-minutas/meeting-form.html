<div class="card p-2">
  <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
    <custom-input-text-signal
      [control]="form.controls.id"
      hidden
      label="Id"
      [readonly]="true"
    />
    <custom-input-date-signal
      [control]="form.controls.date"
      label="Fecha de Junta"
      placeholder="Fecha de Junta"
    />
    <custom-input-time-signal
      [control]="form.controls.time"
      label="Hora de Junta"
      placeholder="Hora de Junta"
    />
    <div class="mb-3 p-2 border-round bg-yellow-50 text-700 text-sm">
      Al cambiar la fecha u hora de la junta, este dato debe mantenerse alineado
      con la agenda mensual y con la presentación vinculada.
    </div>
    <custom-input-select-signal
      [control]="form.controls.eTypeMeeting"
      label="Tipo de junta"
      [data]="cb_typeMeeting()"
      [filter]="true"
    />
    <il-button-save [disabled]="form.invalid" />
  </form>
</div>

<!-- Formulario de minuta -->
@if (id) {
<div class="grid mt-3">
  <div class="col-12 md:col-4">
    <!-- Formulario comité -->
    <app-comite-form [meetingId]="id" [customerId]="customerId" />
  </div>
  <div class="col-12 md:col-4">
    <!-- Formulario Administración -->
    <app-administration-form-list [meetingId]="id" [customerId]="customerId" />
  </div>
  <div class="col-12 md:col-4">
    <!-- Formulario Invitados -->
    <app-invited-form [meetingId]="id" [customerId]="customerId" />
  </div>
</div>
}
