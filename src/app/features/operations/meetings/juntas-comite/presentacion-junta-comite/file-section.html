@if (!fileUrl && canEdit) {
<div class="text-center">
  <il-button
    ngbTooltip="Cargar archivo"
    customClass="btn-sm btn-info"
    icon="mdi:upload"
    customClass="btn-sm btn-info mr-2"
    (clicked)="onUpload.emit()"
    [label]="'Cargar ' + title"
  />
</div>
} @if (fileUrl) {
<div class="mt-1 flex justify-content-between">
  <div class="flexlign-align-items-start">
    <il-button-view-pdf
      [url]="fileUrl"
      fileName="Documento"
    />
  </div>
  @if (canEdit && !isFinal) {
  <div class="flexlign-align-items-start">
    <iw-button iconClass="edit" (clicked)="onEdit.emit()" />
    <il-button-confirm
      icon="trash"
      ngbTooltip="Eliminar"
      (clicked)="onDelete.emit()"
    />
  </div>
  }
</div>
}

<p class="m-0">{{ user }}</p>
<p class="m-0">{{ uploadDate }}</p>
