<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <!-- img -->
  <div class="mb-3">
    <p-fileupload
      mode="basic"
      chooseLabel="Seleccionar Archivo"
      [auto]="false"
      [multiple]="false"
      accept="application/pdf"
      (onSelect)="onFileSelect($event)"
      [fileLimit]="1"
      [showUploadButton]="false"
      [showCancelButton]="false"
    ></p-fileupload>

    <!-- Mostrar nombre del archivo seleccionado -->
    @if (selectedFileName()) {
    <div class="mt-2 p-2 border-round surface-ground">
      <app-icon [icon]="'mdi:file-pdf-box'" class="mr-2" />
      <span class="text-sm">{{ selectedFileName() }}</span>
      <iw-button
        iconClass="mdi:close"
        (clicked)="clearFile()"
        severity="danger"
        [text]="true"
        [border-round]="true"
        customClass="ml-2"
      />
    </div>
    }
  </div>

  <il-button-save
    [propertyId]="id"
    [disabled]="form.invalid || !selectedFileName()"
    [submitting]="submitting()"
  />
</form>
