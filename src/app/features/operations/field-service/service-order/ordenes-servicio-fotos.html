<div class="grid p-2">
  @if (loading()) {
  <div class="col-12 flex justify-content-center">
    <app-icon [icon]="'mdi:loading'" style="font-size: 2rem" />
  </div>
  } @else { @for (item of data(); track item.id) {
  <div class="col-12 md:col-4 lg:col-3">
    <div
      class="card shadow-1 border-none surface-card border-round p-0 overflow-hidden"
    >
      <div class="flex justify-content-end p-2">
        <il-button-delete (confirmed)="confirmDelete(item.id)" />
      </div>

      <div class="flex justify-content-center pb-3 px-3">
        <p-image
          [src]="item.img || 'assets/images/default-avatar.png'"
          alt="Vista previa"
          width="100%"
          imageClass="border-round w-full h-15rem object-cover"
          [preview]="true"
        ></p-image>
      </div>
    </div>
  </div>
  } @empty {
  <div class="col-12 text-center p-5">
    <p class="text-500 font-medium">
      No hay fotos disponibles para esta orden.
    </p>
  </div>
  } }
</div>
