<div class="card">
  <p-fileupload
    name="files"
    [url]="url"
    (onUpload)="onUpload($event)"
    [multiple]="true"
    accept="image/*"
    [maxFileSize]="maxFileSize"
    [headers]="uploadedFiles"
  >
    <ng-template #empty>
      <div>Arrastra y suelta los archivos aquí para subirlos..</div>
    </ng-template>
  </p-fileupload>
</div>
