<!-- 🖥️ INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<div class="hidden md:block">
  <lx-tabs
    [tabs]="tabs"
    [(activeId)]="activeTabValue"
    class="nav-tabs justify-content-center sm:justify-content-start"
  >
    <div tab="tab1">
      <app-cronograma-anual-mantenimiento (messageEvent)="message($event)" />
    </div>
    <div tab="tab2">
      <app-listado-anual-mantenimiento />
    </div>
    <div tab="tab3">
      <app-general-anual-mantenimiento />
    </div>
  </lx-tabs>
</div>

<!-- 📱 INICIO: Componente adaptado para versión móvil -->
<div class="block md:hidden">
  <!-- lx-tabs como selector segmentado (sin paneles); los paneles se conmutan abajo -->
  <lx-tabs [tabs]="tabs" [(activeId)]="activeTabValue" class="mb-3" />

  <div class="mt-2">
    @switch (activeTabValue()) { @case ('tab1') {
    <app-cronograma-anual-mantenimiento (messageEvent)="message($event)" />
    } @case ('tab2') {
    <app-listado-anual-mantenimiento />
    } @case ('tab3') {
    <app-general-anual-mantenimiento />
    } }
  </div>
</div>
<div class="text-color-secondary"></div>
