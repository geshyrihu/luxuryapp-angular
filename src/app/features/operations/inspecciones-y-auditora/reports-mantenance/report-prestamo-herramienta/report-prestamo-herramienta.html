<page-title-report-maintenance title="'PRESATMO DE HERRAMIENTA'" />
<p-table
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  styleClass="custom-table card hidden md:block"
>
  <ng-template #header>
    <tr>
      <th class="table-col-15">SALIDA</th>
      <th class="table-col-15">REGRESO</th>
      <th class="table-col-30">COLABORADOR</th>
      <th class="table-col-40">OBSERVACIONES</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td colspan="4">
        <p class="card-title">{{ item.producto }}</p>
      </td>
    </tr>
    @for (registro of item.registros; track registro) {
    <tr class="breakPage">
      <td>
        <p class="text-sm">{{ registro.fechaSalida }}</p>
      </td>
      <td>
        <p class="text-sm">{{ registro.fechaRegreso }}</p>
      </td>
      <td>
        <p class="text-sm">{{ registro.fullName }}</p>
      </td>
      <td>
        <p class="text-sm">{{ registro.observaciones }}</p>
      </td>
    </tr>
    }
  </ng-template>
</p-table>
