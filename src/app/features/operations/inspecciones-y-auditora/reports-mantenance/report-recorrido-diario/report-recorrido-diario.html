<page-title-report-maintenance title="BITÁCORA DIARIA" />
<p-table
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption title="BITÁCORA DIARIA" [showAdd]="false" [showSearch]="false" />
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td colspan="3">
        <p class="card-title">{{ item.fecha }}</p>
      </td>
    </tr>
    @for (registro of item.registros; track registro) {
    <tr class="breakPage">
      <td>
        <p class="card-title">{{ registro.nameMachinery }}</p>
        <p class="text-sm">{{ registro.descripcion }}</p>
        <p class="text-right text-sm mt-0 mb-0">{{ registro.fullName }}</p>
      </td>
    </tr>
    }
  </ng-template>
</p-table>
