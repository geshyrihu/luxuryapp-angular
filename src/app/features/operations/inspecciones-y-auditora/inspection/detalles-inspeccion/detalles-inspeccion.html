@if (data) {
<div class="p-2">
  <div class="flex justify-content-between align-items-center mb-3">
    <div>
      <div class="text-center">
        <p>Detalles de la inspección</p>
      </div>
      <h5 class="card-title">{{ data.departamentName }}</h5>
      <small class="text-color-secondary">{{ data.inspectionName }}</small>
    </div>
    <il-button
      icon="plus"
      pTooltip="Agregar"
      (clicked)="
          onModalInspectionCondominiumAssetAdd({
            title: 'Agregar área',
            inspectionId: data
          })
        "
    />
  </div>

  <hr />

  @for (item of data.amenities; track $index) {
  <ul class="list-group mb-3">
    <li
      class="list-group-item border-primary flex justify-content-between align-items-center"
    >
      <div>
        <strong> {{ item.name | uppercase }} </strong>
      </div>
      <app-action-menu class="inline-block text-right">
        <ng-container actions>
          <il-button-edit
            (clicked)="
                  onModalInspectionCondominiumAssetEdit({
                    title: 'Editar área',
                    id: item.id,
                    inspectionId: data.inspectionId,
                    inspectionCondominiumAssetId: item.inspectionCondominiumAssetId
                  })
                "
 label="Editar"/>
          <il-button-item
            [iconClass]="'mdi:plus'"
            label="Agregar Revisión"
            (clicked)="onModalAddRevision()"/>
          <il-button-delete
            (confirmed)="onDeleteArea(item.inspectionCondominiumAssetId, data.amenities)"
 label="Eliminar"/>
        </ng-container>
      </app-action-menu>
    </li>

    @for (review of item.reviews; track $index) {
    <li class="list-group-item flex justify-content-between align-items-center">
      {{ review.description }}

      <app-action-menu class="inline-block text-right">
        <ng-container actions>
          <il-button-delete
            (confirmed)="onDeleteReview(review.id, item.reviews)"
 label="Eliminar"/>
        </ng-container>
      </app-action-menu>
    </li>
    }
  </ul>
  }
</div>
}
