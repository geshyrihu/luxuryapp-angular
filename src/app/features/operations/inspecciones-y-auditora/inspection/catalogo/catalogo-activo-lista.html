<!-- ??? INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<p-table
  [globalFilterFields]="globalFilterFields()"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  #dt
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="folio">
        Folio
        <p-sortIcon field="folio" />
      </th>
      <th pSortableColumn="name">
        Nombre
        <p-sortIcon field="name" />
      </th>
      <th pSortableColumn="assetCategory">
        CATEGORIA
        <p-sortIcon field="assetCategory" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.folio }}</td>
      <td>{{ item.name }}</td>
      <td>{{ item.assetCategory }}</td>
      <!-- Opciones -->
      <td class="no-print">
        <div class="flex">
          <il-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <il-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="4">
        <app-empty-state
          icon="mdi:format-list-bulleted"
          title="Sin registros"
          message="No hay elementos en el catalogo."
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- ?? INICIO: Componente adaptado para versión móvil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" class="ion-no-padding" detail="false">
      <div
        slot="start"
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
        style="
          width: 38px;
          height: 38px;
          background: var(--ds-primary-50, #edf1ff);
        "
      >
        <app-icon
          icon="mdi:clipboard-search-outline"
          style="font-size: 1.1rem; color: var(--ds-primary)"
        ></app-icon>
      </div>
      <ion-label>
        <h2 class="font-normal m-0">{{ item.name }}</h2>
        <p class="text-medium text-500 m-0">{{ item.folio }}</p>
      </ion-label>

      <app-action-menu slot="end">
        <ng-container actions>
          <il-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          <il-button-delete
            (confirmed)="onDelete(item.id)"
            label="Eliminar"
          />
        </ng-container>
      </app-action-menu>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
