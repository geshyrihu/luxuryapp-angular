<p-table
  [globalFilterFields]="globalFilterFields()"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
      [showAdd]="aspRoleS.hasRole(AspRole.SuperUsuario)"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-30" pSortableColumn="folio">
        Folio
        <p-sorticon field="folio" />
      </th>
      <th class="table-col-30" pSortableColumn="descripcion">
        DESCRIPCIóN
        <p-sorticon field="descripcion" />
      </th>
      <th class="table-col-30" pSortableColumn="pathFormato">
        Archivo
        <p-sorticon field="pathFormato" />
      </th>
      @if (aspRoleS.roleSignal(AspRole.SuperUsuario)()) {
      <th class="table-col-10"></th>
      }
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.folio }}</td>
      <td>{{ item.name | uppercase }}</td>
      <td class="text-center">
        <iw-button-view-pdf [url]="item.path" fileName="Formato" />
      </td>
      <!-- Opciones -->
      @if (aspRoleS.roleSignal(AspRole.SuperUsuario)()) {
      <td class="no-print">
        <app-action-menu>
          <ng-container actions>
            <il-button-edit
              (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
              label="Editar"
            />
            <il-button-delete
              (confirmed)="onDelete(item.id)"
              label="Eliminar"
            />
          </ng-container>
        </app-action-menu>
      </td>
      }
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="4" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        style="
          width: 36px;
          height: 36px;
          border-radius: 10px;
          background: var(--ds-border);
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
          margin-left: 16px;
        "
      >
        <app-icon
          icon="mdi:file-outline"
          style="font-size: 20px; color: var(--ds-primary)"
        />
      </div>
      
        <h3>{{ item.name | uppercase }}</h3>
        <p>Folio: {{ item.folio }}</p>
      
      <ili-action-menu slot="end">
        <ili-button-edit
          (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          label="Editar"
        />
        <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
