<!-- 🖥️ INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->

<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="flatData()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="card hidden md:block custom-table"
  size="small"
  [scrollable]="true"
  scrollHeight="750px"
  [virtualScrollItemSize]="tablePrimeNgRows"
>
  <ng-template #caption>
    <primeng-custom-caption [dt]="dt" [showAdd]="false" />
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="customerName">
        Condominio
        <p-sorticon field="customerName" />
      </th>
      <th pSortableColumn="ePosicionComite">
        Cargo
        <p-sorticon field="ePosicionComite" />
      </th>
      <th pSortableColumn="fullName">
        Nombre
        <p-sorticon field="fullName" />
      </th>
      <th pSortableColumn="email">
        Email
        <p-sorticon field="email" />
      </th>
      <th pSortableColumn="phoneNumber">
        Teléfono
        <p-sorticon field="phoneNumber" />
      </th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.customerName }}</td>
      <td>{{ item.ePosicionComite }}</td>
      <td>{{ item.fullName }}</td>
      <td>{{ item.email }}</td>
      <td>{{ item.phoneNumber }}</td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="5" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="flatData()" />
  </ng-template>
</p-table>

<!-- 📱 INICIO: Componente adaptado para versión móvil -->
<app-data-view-mobile
  [data]="flatData()"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
  [showAdd]="false"
  trackByProperty="id"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" class="ion-no-padding" detail="false">
      <div
        slot="start"
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
        style="
          width: 38px;
          height: 38px;
          background: var(--ds-primary-50, #edf1ff);
        "
      >
        <app-icon
          icon="mdi:account-group-outline"
          style="font-size: 1.1rem; color: var(--ds-primary)"
        />
      </div>
      <ion-label>
        <h2 class="font-normal m-0">{{ item.fullName }}</h2>
        <p class="text-medium text-500 m-0">
          {{ item.ePosicionComite }} | {{ item.customerName }}
        </p>
        <p class="text-medium text-500 m-0">{{ item.email }}</p>
        <p class="text-medium text-500 m-0">{{ item.phoneNumber }}</p>
      </ion-label>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
