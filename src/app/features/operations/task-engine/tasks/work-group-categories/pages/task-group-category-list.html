<!-- Contenido visible solo en pantallas medianas y grandes -->
<p-table
  [value]="dataSignal()"
  #dt
  styleClass="custom-table hidden md:block"
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  sortField="departament"
  rowGroupMode="subheader"
  groupRowsBy="departament"
  [sortOrder]="1"
>
  <ng-template #caption>
    <primeng-custom-caption
      [title]="'Categorias de grupos'"
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="code">
        Codigo
        <p-sortIcon field="code" />
      </th>
      <th>Icono</th>
      <th>Color</th>
      <th pSortableColumn="name">
        Nombre
        <p-sortIcon field="name" />
      </th>
      <th pSortableColumn="description">
        Descripcion
        <p-sortIcon field="description" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>

  <ng-template #groupheader let-item>
    <tr pRowGroupHeader>
      <td colspan="6" class="bg-blue-50">
        <div class="flex align-items-center py-2 px-3">
          <app-icon [icon]="'mdi:tag'" class="mr-2 text-blue-500"></app-icon>
          <span class="font-bold text-blue-900">{{ item.departament }}</span>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td>{{ item.code }}</td>
      <td class="text-xl">{{ item.emoji }}</td>
      <td>
        <div
          class="w-8 h-8 border-round-md"
          [style.backgroundColor]="item.color"
        ></div>
      </td>
      <td>{{ item.name }}</td>
      <td>{{ item.description }}</td>
      <td class="no-print">
        <div class="flex">
          <custom-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <custom-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- Componente adaptado para version movil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full">
      <ion-label>
        <div class="flex align-items-center">
          <span class="text-xl">{{ item.emoji }}</span>
          <div class="ml-2">
            <h2>{{ item.name }}</h2>
            <p>{{ item.code }} | {{ item.departament | uppercase }}</p>
          </div>
        </div>
      </ion-label>
      <div slot="end">
        <div
          class="w-6 h-6 border-round-md flex-shrink-0"
          [style.backgroundColor]="item.color"
        ></div>
        <app-action-menu>
          <custom-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <custom-button-delete (confirmed)="onDelete(item.id)" />
        </app-action-menu>
      </div>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
