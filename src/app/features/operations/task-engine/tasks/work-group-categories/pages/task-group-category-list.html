<!-- Contenido visible solo en pantallas medianas y grandes -->
<p-table
  [value]="dataSignal()"
  #dt
  styleClass="custom-table hidden md:block"
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  sortField="departament"
  rowGroupMode="subheader"
  groupRowsBy="departament"
  [sortOrder]="1"
>
  <ng-template #caption>
    <primeng-custom-caption
      [title]="'Categorias de grupos'"
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="code">
        Codigo
        <p-sorticon field="code" />
      </th>
      <th>Icono</th>
      <th>Color</th>
      <th pSortableColumn="name">
        Nombre
        <p-sorticon field="name" />
      </th>
      <th pSortableColumn="description">
        Descripcion
        <p-sorticon field="description" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>

  <ng-template #groupheader let-item>
    <tr pRowGroupHeader>
      <td colspan="6" class="bg-blue-50">
        <div class="flex align-items-center py-2 px-3">
          <app-icon [icon]="'mdi:tag'" class="mr-2 text-blue-500" />
          <span class="font-bold text-blue-900">{{ item.departament }}</span>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td>{{ item.code }}</td>
      <td class="text-xl">{{ item.emoji }}</td>
      <td>
        <div
          class="w-8 h-8 border-round-md"
          [style.backgroundColor]="item.color"
        ></div>
      </td>
      <td>{{ item.name }}</td>
      <td>{{ item.description }}</td>
      <td class="no-print">
        <div class="flex">
          <iw-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <iw-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- Componente adaptado para version movil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full">
      <div
        slot="start"
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
        style="
          width: 38px;
          height: 38px;
          background: var(--ds-primary-50, #edf1ff);
        "
      >
        <app-icon
          icon="mdi:tag-multiple-outline"
          style="font-size: 1.1rem; color: var(--ds-primary)"
        />
      </div>
      <ion-label>
        <div class="flex align-items-center">
          <span class="text-xl">{{ item.emoji }}</span>
          <div class="ml-2">
            <h2>{{ item.name }}</h2>
            <p>{{ item.code }} | {{ item.departament | uppercase }}</p>
          </div>
        </div>
      </ion-label>
      <div slot="end">
        <div
          class="w-6 h-6 border-round-md flex-shrink-0"
          [style.backgroundColor]="item.color"
        ></div>
        <ili-action-menu>
          <ng-container actions>
            <ili-button-edit
              (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
              label="Editar"
            />
            <ili-button-delete
              (confirmed)="onDelete(item.id)"
              label="Eliminar"
            />
          </ng-container>
        </ili-action-menu>
      </div>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
