<div class="md:p-3">
  <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
    @if (id) {
    <custom-input-text-signal
      [control]="form.controls.id"
      hidden
      [readonly]="true"
      label="Id"
    />
    }
    <custom-input-select-signal
      [control]="form.controls.ticketGroupId"
      label="Grupo"
      [data]="cb_ticket_group()"
      [filter]="true"
    />
    <custom-input-text-signal
      [control]="form.controls.title"
      label="Area"
      placeholder="area"
    />

    <div class="flex justify-content-between align-items-center mb-2">
      <il-button
        label="Analizar Imagen (IA)"
        iconClass="mdi:camera"
        severity="secondary"
        variant="outlined"
        size="sm"
        (clicked)="openVision()"
      />
    </div>

    <!-- <custom-input-textarea-signal
      [control]="form.controls.description"
      label=""
      placeholder="Descripción del problema..."
    /> -->
    <custom-input-textarea-signal
      [control]="form.controls.description"
      label="Descripción"
      placeholder="descripción"
    />
    <app-image-analysis-dialog
      (resultAccepted)="onVisionResult($event)"
    ></app-image-analysis-dialog>
    <custom-input-select-signal
      [control]="form.controls.priority"
      label="Prioridad"
      [data]="cb_priority()"
      [filter]="true"
    />

    <div class="grid mt-2">
      <div class="col-12 mb-2">
        <small class="text-500 italic">
          <app-icon [icon]="'mdi:camera'" class="mr-1" />
          Recuerda: Fotos horizontales, centradas en el detalle.
        </small>
      </div>
      <div class="col-12 md:col-6">
        <div class="mb-4">
          <label class="font-bold text-xs uppercase text-700 block mb-2"
            >Foto del antes</label
          >
          @if (form.controls.beforeWorkPreview.value) {
            <div class="mb-2">
              <img [src]="form.controls.beforeWorkPreview.value" class="w-full border-round shadow-1" style="max-height: 200px; object-fit: contain;" alt="Evidencia Antes" />
            </div>
          }
          <lx-file-upload
            accept="image/*,.heic,.heif"
            [maxFileSize]="10000000"
            [multiple]="false"
            [chooseLabel]="'Seleccionar foto'"
            (onSelect)="onFileSelect($event, 'beforeWork')"
            (filesChange)="onFilesChange($event, 'beforeWork')"
          />
        </div>
      </div>
      <div class="col-12 md:col-6">
        <div class="mb-4">
          <label class="font-bold text-xs uppercase text-700 block mb-2"
            >Foto del después</label
          >
          @if (form.controls.afterWorkPreview.value) {
            <div class="mb-2">
              <img [src]="form.controls.afterWorkPreview.value" class="w-full border-round shadow-1" style="max-height: 200px; object-fit: contain;" alt="Evidencia Después" />
            </div>
          }
          <lx-file-upload
            accept="image/*,.heic,.heif"
            [maxFileSize]="10000000"
            [multiple]="false"
            [chooseLabel]="'Seleccionar foto'"
            (onSelect)="onFileSelect($event, 'afterWork')"
            (filesChange)="onFilesChange($event, 'afterWork')"
          />
        </div>
      </div>
    </div>

    <il-button-save
      [propertyId]="id"
      [disabled]="form.invalid"
      [submitting]="submitting()"
    />
  </form>
</div>
