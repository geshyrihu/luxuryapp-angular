<div class="p-4">
  <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
    @if (id) {
    <custom-input-text-signal
      [control]="form.controls.id"
      hidden
      [readonly]="true"
      label="Id"
    />
    }
    <custom-input-select-signal
      [control]="form.controls.ticketGroupId"
      label="Grupo"
      [data]="cb_ticket_group()"
      [filter]="true"
    />
    <custom-input-text-signal
      [control]="form.controls.title"
      label="Area"
      placeholder="area"
    />

    <div class="flex justify-content-between align-items-center mb-2">
      <il-button
        label="Analizar Imagen (IA)"
        iconClass="mdi:camera"
        severity="secondary"
        variant="outlined"
        size="sm"
        (clicked)="openVision()"
      />
    </div>

    <!-- <custom-input-textarea-signal
      [control]="form.controls.description"
      label=""
      placeholder="Descripción del problema..."
    /> -->
    <custom-input-textarea-signal
      [control]="form.controls.description"
      label="Descripción"
      placeholder="descripción"
    />
    <app-image-analysis-dialog
      (resultAccepted)="onVisionResult($event)"
    ></app-image-analysis-dialog>
    <custom-input-select-signal
      [control]="form.controls.priority"
      label="Prioridad"
      [data]="cb_priority()"
      [filter]="true"
    />

    <div class="grid">
      <div class="col-12">
        <custom-input-img-signal
          [control]="form.controls.beforeWork"
          [urlImgCurrent]="form.controls.beforeWorkPreview.value"
          label="Foto de antes"
          [required]="false"
        />
      </div>
      <div class="col-12">
        <custom-input-img-signal
          [control]="form.controls.afterWork"
          [urlImgCurrent]="form.controls.afterWorkPreview.value"
          label="Foto de después"
          [required]="false"
        />
      </div>
    </div>

    <il-button-save
      [propertyId]="id"
      [disabled]="form.invalid"
      [submitting]="submitting()"
    />
  </form>
</div>
