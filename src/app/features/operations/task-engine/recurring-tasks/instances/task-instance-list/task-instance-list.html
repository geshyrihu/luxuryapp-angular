<div class="card">
  <p-toolbar styleClass="mb-4 ">
    <ng-template pTemplate="left">
      <h3 class="m-0">Mis Tareas Diarias</h3>
    </ng-template>
    <ng-template pTemplate="right">
      <custom-input-date-signal
        [control]="selectedDateControl"
        label="Fecha"
        id="fecha-filtro"
        placeholder="Seleccionar Fecha"
        [noMargin]="true"
      />
    </ng-template>
  </p-toolbar>

  <!-- Desktop View -->
  <p-table
    #dt
    [value]="data()"
    [loading]="loading()"
    [tableStyle]="{ 'min-width': '50rem' }"
    [scrollable]="true"
    [scrollHeight]="scrollHeight"
    styleClass="p-datatable-gridlines hidden md:block"
  >
    <ng-template #caption>
      <app-primeng-custom-caption
        [title]="'Tareas Asignadas'"
        [showGlobalFilter]="false"
        [showAddButton]="false"
      />
    </ng-template>
    <ng-template #header>
      <tr>
        <th>Tútulo</th>
        <th>Prioridad</th>
        <th>Estado</th>
        <th>Programada para</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-task>
      <tr>
        <td>{{ task.title }}</td>
        <td>{{ task.priorityDescription }}</td>
        <td>
          <app-status-badge
            [value]="task.status"
            [status]="task.statusDescription"
          />
        </td>
        <td>{{ task.scheduledDate | date : "medium" }}</td>
        <td>
          <iw-button
            (clicked)="onCompleteTask(task)"
            iconClass="mdi:check"
            [disabled]="task.status === 1"
          />
          <iw-button-confirm
            (confirmed)="onReopenTask(task.id)"
            iconClass="mdi:undo"
            [disabled]="task.status !== 1"
            confirmMessage="óEstés seguro de reabrir esta tarea?"
          />
        </td>
      </tr>
    </ng-template>
    <ng-template emptymessage>
      <tr>
        <td colspan="5">No hay tareas para esta fecha.</td>
      </tr>
    </ng-template>
    <ng-template #summary>
      <app-primeng-custom-table-footer
        [totalRecords]="data().length"
        [emptyMessage]="'No hay tareas para esta fecha.'"
      />
    </ng-template>
    <ng-template #emptymessage>
      <primeng-custom-table-emptymessage [colspan]="5" />
    </ng-template>
  </p-table>

  <!-- Mobile View -->
  <app-data-view-mobile
    [data]="data()"
    [dt]="dt"
    [showAdd]="false"
    class="block md:hidden"
  >
    <ng-template #listItemTemplate let-task>
      <ion-item lines="full" class="ion-no-padding" detail="false">
        <div
          slot="start"
          class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
          style="
            width: 38px;
            height: 38px;
            background: var(--ds-primary-50, #edf1ff);
          "
        >
          <app-icon
            icon="mdi:repeat"
            style="font-size: 1.1rem; color: var(--ds-primary)"
          />
        </div>
        <ion-label>
          <h5 class="mb-2">{{ task.title }}</h5>
          <p class="text-sm text-gray-500">
            {{ task.scheduledDate | date : "medium" }}
          </p>
          <app-status-badge
            [value]="task.status"
            [status]="task.statusDescription"
          />
        </ion-label>
        <ili-action-menu slot="end">
          <ng-container actions>
            <ili-button-item
              label="Completar"
              (clicked)="onCompleteTask(task)"
              [disabled]="task.status === 1"
            />
            <ili-button-confirm
              label="Reabrir"
              (confirmed)="onReopenTask(task.id)"
              [disabled]="task.status !== 1"
              confirmMessage="óEstés seguro de reabrir esta tarea?"
            />
          </ng-container>
        </ili-action-menu>
      </ion-item>
    </ng-template>
  </app-data-view-mobile>
</div>
