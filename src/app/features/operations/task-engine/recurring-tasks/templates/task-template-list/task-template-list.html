<div class="card">
  <div class="card-header">
    <h3 class="card-title">Plantillas de Tareas Recurrentes</h3>
  </div>
  <div class="card-body">
    <!-- Desktop View -->
    <p-table
      #dt
      [value]="data()"
      [rows]="10"
      [paginator]="true"
      [loading]="loading()"
      size="small"
      [scrollable]="true"
      [scrollHeight]="scrollHeight"
      class="hidden md:block custom-table"
    >
      <ng-template #caption>
        <div
          class="flex flex-column md:flex-row md:align-items-center justify-content-end p-2 gap-2"
        >
          <primeng-custom-caption
            (add)="showForm()"
            [dt]="dt"
            [noPadding]="true"
            [noMargin]="true"
          />
          <div class="flex-shrink-0" style="width: 160px">
            <iw-button-active-desactive
              [state]="state()"
              (stateChange)="onChangeState($event)"
            />
          </div>
        </div>
      </ng-template>
      <ng-template #header>
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Rol Asignado</th>
          <th class="table-col-15">Acciones</th>
        </tr>
      </ng-template>
      <ng-template #body let-template>
        <tr>
          <td>{{ template.name }}</td>
          <td>{{ template.description }}</td>
          <td>{{ template.roleName }}</td>
          <td>
            <div class="flex">
              <iw-button-item
                [iconClass]="'mdi:file-document-outline'"
                pTooltip="Items"
                tooltipPosition="top"
                (clicked)="onManageItems(template.id)"
              />
              <iw-button-edit (clicked)="showForm(template)" />
              <iw-button-delete (confirmed)="onDelete(template.id)" />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template emptymessage>
        <tr>
          <td colspan="4">No se encontraron plantillas.</td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <primeng-custom-table-emptymessage [colspan]="4" />
      </ng-template>
    </p-table>
    <!-- Mobile View -->
    <app-data-view-mobile
      [data]="data()"
      (add)="showForm()"
      [dt]="dt"
      class="block md:hidden"
    >
      <div customFilters>
        <div class="px-4 py-2">
          <ili-button-active-desactive
            fluid
            [state]="state()"
            (stateChange)="onChangeState($event)"
          />
        </div>
      </div>
      <ng-template #listItemTemplate let-template>
        <ili-list-item>
          <div
            start
            class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
            style="
              width: 38px;
              height: 38px;
              background: var(--ds-primary-50, #edf1ff);
            "
          >
            <app-icon
              icon="mdi:file-document-outline"
              style="font-size: 1.1rem; color: var(--ds-primary)"
            />
          </div>
          
            <h5 class="mb-2">{{ template.name }}</h5>
            <p class="text-sm text-600">Rol: {{ template.roleName }}</p>
          
          <ili-action-menu slot="end">
            <ng-container actions>
              <ili-button-item
                label="Administrar Items"
                (clicked)="onManageItems(template.id)"
              />
              <ili-button-item label="Editar" (clicked)="showForm(template)" />
              <ili-button-delete
                (confirmed)="onDelete(template.id)"
                label="Eliminar"
              />
            </ng-container>
          </ili-action-menu>
        </ili-list-item>
      </ng-template>
    </app-data-view-mobile>
  </div>
</div>
