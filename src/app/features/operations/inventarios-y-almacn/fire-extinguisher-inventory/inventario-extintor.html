<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <div class="flex justify-content-between align-items-center w-full">
      <div class="flex align-items-center gap-2">
        <custom-button-download
          (clicked)="onDownloadPdf()"
          label="PDF"
        />
        <custom-button-download
          (clicked)="onDownloadAllQr()"
          label="QR"
          tooltip="Descargar todos los QR"
        />
        <custom-button
          (clicked)="onOpenScanner()"
          icon="pi pi-qrcode"
          tooltip="Escanear QR"
        />
        <custom-button
          (clicked)="onBulkExpiration()"
          icon="pi pi-calendar"
          tooltip="Actualizar fecha de vencimiento a todos"
        />
        <custom-button-item
          (clicked)="onViewPeriodos()"
          label="Periodos"
          tooltip="Configurar periodos de inspección"
        />
      </div>
      <primeng-custom-caption
        [title]="'Inventario de Extintores'"
        (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
        [dt]="dt"
      />
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-5">Foto</th>
      <th class="table-col-15" pSortableColumn="localCode">
        Código <p-sortIcon field="localCode" />
      </th>
      <th class="table-col-25" pSortableColumn="extinguisherType">
        Extintor <p-sortIcon field="extinguisherType" />
      </th>
      <th class="table-col-25" pSortableColumn="location">
        Ubicación <p-sortIcon field="location" />
      </th>
      <th class="table-col-15" pSortableColumn="expirationDate">
        Vencimiento <p-sortIcon field="expirationDate" />
      </th>
      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <p-image
          [src]="item.photo"
          alt="."
          width="100"
          class="shadow-4"
          [preview]="true"
        />
      </td>
      <td><small>{{ item.localCode }}</small></td>
      <td><small>{{ item.extinguisherType }}</small></td>
      <td><small>{{ item.location }}</small></td>
      <td><small>{{ item.expirationDate }}</small></td>
      <td>
        <div class="flex">
          <custom-button-item
            (clicked)="onViewHistory(item)"
            tooltip="Ver historial de inspecciones"
            icon="pi pi-list"
          />
          <custom-button-download
            (clicked)="onDownloadQr(item)"
            tooltip="Descargar QR"
          />
          <custom-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <custom-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6">
          <app-empty-state icon="mdi:fire-extinguisher" title="Sin extintores" message="No hay extintores registrados." />
        </td>
      </tr>
    </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
>
  <div customFilters class="px-3 pb-2 flex flex-column gap-2">
    <ion-button
      expand="block"
      fill="outline"
      color="primary"
      (click)="onOpenScanner()"
    >
      <app-icon icon="mdi:qrcode" slot="start"></app-icon>
      Escanear QR
    </ion-button>
    <ion-button
      expand="block"
      fill="outline"
      color="warning"
      (click)="onBulkExpiration()"
    >
      <app-icon icon="mdi:calendar-blank" slot="start"></app-icon>
      Actualizar vencimiento
    </ion-button>
    <ion-button
      expand="block"
      fill="outline"
      color="secondary"
      (click)="onViewPeriodos()"
    >
      <app-icon icon="mdi:clock-outline" slot="start"></app-icon>
      Periodos de Inspección
    </ion-button>
  </div>

  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" detail="false" class="ion-no-padding">
      <div
        slot="start"
        style="
          width: 36px;
          height: 36px;
          border-radius: 10px;
          background: var(--ds-border);
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
          margin-left: 16px;
        "
      >
        <app-icon icon="mdi:fire" style="font-size: 20px; color:var(--ds-danger)"></app-icon>
      </div>
      <ion-label>
        <h3>
          {{ item.localCode ? item.localCode + ' — ' : '' }}{{
          item.extinguisherType }}
        </h3>
        <p>{{ item.location }}</p>
      </ion-label>
      <app-action-menu slot="end">
        <ng-container actions>
        <custom-button-item
          (clicked)="onViewHistory(item)"
          label="Historial"
          iconName="list-outline"
         [showLabelOnDesktop]="true"/>
        <custom-button-download (clicked)="onDownloadPdf()" label="PDF"  [showLabelOnDesktop]="true"/>
        <custom-button-download (clicked)="onDownloadQr(item)" label="QR"  [showLabelOnDesktop]="true"/>
        <custom-button-edit
          (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
         label="Editar" [showLabelOnDesktop]="true"/>
        <custom-button-delete (confirmed)="onDelete(item.id)"  label="Eliminar" [showLabelOnDesktop]="true"/>
              </ng-container>
      </app-action-menu>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
