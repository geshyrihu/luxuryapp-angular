<!-- ??? INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <!-- CAMBIO: El tútulo y el ID inicial se ajustan para Almacón -->
    <primeng-custom-caption
      [showAdd]="isAdmin"
      (add)="onModalForm({ id: '', title: 'Nuevo Almacón' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <!-- CAMBIO: Columnas y campos de ordenamiento para Almacón -->
      <th pSortableColumn="nombre">
        Nombre
        <p-sortIcon field="nombre" />
      </th>
      <th pSortableColumn="ubicacion">
        Ubicación
        <p-sortIcon field="ubicacion" />
      </th>
      <th pSortableColumn="activo">
        Estado
        <p-sortIcon field="activo" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <!-- CAMBIO: Propiedades del objeto 'item' para Almacón -->
      <td>{{ item.nombre }}</td>
      <td>{{ item.ubicacion }}</td>
      <td>{{ item.activo ? "Activo" : "Inactivo" }}</td>
      <td class="no-print">
        <div class="flex">
          <il-button-item
            (clicked)="onViewProducts(item.id)"
            label="Ver Productos"
            iconClass="mdi:package"
          />
          <il-button-item
            (clicked)="onDownloadInventory(item.id, item.nombre)"
            label="Descargar Inventario"
            iconClass="mdi:file-pdf-box"
          />
          <il-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <il-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="4" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- ?? INICIO: Componente adaptado para versión mívil -->
<app-data-view-mobile
  [data]="dataSignal()"
  [showAdd]="isAdmin"
  (add)="onModalForm({ id: '', title: 'Nuevo Almacón' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" class="ion-no-padding">
      <div
        slot="start"
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
        style="
          width: 38px;
          height: 38px;
          background: var(--ds-primary-50, #edf1ff);
        "
      >
        <app-icon
          icon="mdi:warehouse"
          style="font-size: 1.1rem; color: var(--ds-primary)"
        ></app-icon>
      </div>
      <ion-label>
        <p class="mt-0 mb-0 font-bold">{{ item.nombre }}</p>
        <p class="text-color-secondary text-sm mt-0 mb-0">
          {{ item.ubicacion }}
        </p>
      </ion-label>

      <div slot="end">
        <app-action-menu>
          <ng-container actions>
            <il-button-item
              (clicked)="onViewProducts(item.id)"
              label="Ver Productos"
              iconName="cube-outline"
            />
            <il-button-item
              (clicked)="onDownloadInventory(item.id, item.nombre)"
              label="Descargar Inventario"
              iconName="document-text-outline"
            />
            <il-button-edit
              (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
              label="Editar"
            />
            <il-button-delete
              (confirmed)="onDelete(item.id)"
              label="Eliminar"
            />
          </ng-container>
        </app-action-menu>
      </div>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
