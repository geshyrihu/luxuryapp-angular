<div class="grid">
  <div class="col-12 md:col-3">
    <div class="mb-3">
      <label for="systemSelect">Sistema</label>
      <p-select
        inputId="systemSelect"
        [options]="dataSignal()"
        optionLabel="system"
        optionValue="system"
        placeholder="Mostrar todos"
        (onChange)="onFilterForSystem($event.value)"
        fluid
      >
        <ng-template pTemplate="empty">
          <p-option value="">Mostrar todos</p-option>
        </ng-template>
      </p-select>
    </div>
  </div>
</div>
<hr />
@for (system of filteredDataSignal(); track system) {
<div>
  <div class="surface-100 p-3 border-round mb-3">{{ system.system }}</div>
  <div class="grid">
    @for (itemUbication of system.ubications; track itemUbication) {
    <div class="col-12 md:col-12">
      <p-card styleClass="p-2 mb-3">
        <ng-template #header #headerUbication>
          <div class="text-xl font-bold">{{ itemUbication.ubication }}</div>
        </ng-template>
        <div class="grid">
          @for (item of itemUbication.items; track item) {
          <div class="col-12">
            <p-card styleClass="h-full">
              <ng-template #header #headerItem>
                <div class="card-img-container">
                  <img class="w-full" [src]="item.photoPath" alt="image" />
                </div>
              </ng-template>
              <div class="card-body text-center">
                <h4 class="text-lg font-bold">{{ item.nameMachinery }}</h4>
                <div class="flex justify-content-center">
                  <il-button
                    pTooltip="Servicios calendarizados"
                    styleClass="p-button-outlined p-button-primary p-button-sm"
                    iconClass="mdi:calendar"
                    (clicked)="showModalListOrderService(item.id)"
                  />
                  <il-button
                    pTooltip="Historico de servicios"
                    styleClass="p-button-outlined p-button-primary p-button-sm"
                    iconClass="mdi:palette"
                    (clicked)="onServiceHistory(item.id)"
                  />
                  <il-button
                    pTooltip="Bitacora"
                    styleClass="p-button-outlined p-button-warning p-button-sm"
                    iconClass="mdi:book"
                    (clicked)="onBitacoraIndividual(item.id)"
                  />
                  <il-button
                    pTooltip="Ficha tócnica"
                    styleClass="p-button-outlined p-button-primary p-button-sm"
                    iconClass="mdi:book"
                    (clicked)="showModalFichatecnica(item)"
                  />
                  <il-button
                    iconClass="mdi:pencil"
                    styleClass="p-button-outlined p-button-secondary p-button-sm"
                    pTooltip="Editar"
                    (clicked)="
                            onModalForm({
                              id: item.id,
                              title: 'Editar regitro ' + item.id,
                              inventoryCategoryId: 1,
                            })
                          "
                  />
                </div>
              </div>
            </p-card>
          </div>
          }
        </div>
      </p-card>
    </div>
    }
  </div>
</div>
}
