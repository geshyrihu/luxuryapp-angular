<div class="w-full md:w-8 p-1">
  <p-message severity="info">Calcular IVA a precio</p-message>

  <div class="grid mt-2">
    <div class="col-12">
      <div class="card">
        <div class="mb-4">
          <label class="block mb-2" for="precio">Ingresa el precio</label>
          <custom-input-number-signal
            inputId="precio"
            [(ngModel)]="precio"
            (onInput)="calcularPrecioSinIva()"
            mode="decimal"
            [minFractionDigits]="0"
            [maxFractionDigits]="4"
          ></custom-input-number-signal>
        </div>
      </div>
    </div>
    <div class="col-12">
      <div class="card">
        <div class="mb-4">
          <label class="block mb-2" for="precioSinIva">Precio sin iva</label>
          <custom-input-number-signal
            inputId="precioSinIva"
            [(ngModel)]="precioSinIva"
            mode="decimal"
            [minFractionDigits]="0"
            [maxFractionDigits]="4"
            [disabled]="true"
          ></custom-input-number-signal>
        </div>
      </div>
    </div>
    <div class="col-12">
      <div class="card">
        <div class="mb-4">
          <label class="block mb-2" for="iva">I.V.A.</label>
          <custom-input-number-signal
            inputId="iva"
            [(ngModel)]="iva"
            mode="decimal"
            [minFractionDigits]="0"
            [maxFractionDigits]="4"
            [disabled]="true"
          ></custom-input-number-signal>
        </div>
      </div>
    </div>
  </div>
</div>
