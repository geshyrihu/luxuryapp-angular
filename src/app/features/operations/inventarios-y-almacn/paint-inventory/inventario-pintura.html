<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th>Ubicaci�n</th>
      <th>Area</th>
      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item let-i="rowIndex">
    <tr>
      <td colspan="4">
        <div class="p-3 surface-100 border-round flex align-items-center">
          <p-image
            [src]="urlImg + item.luminaria.img"
            alt="."
            width="60px"
            [preview]="true"
          />
          <span class="font-bold text-primary"
            >{{ item.luminaria.producto }}</span
          >
        </div>
      </td>
    </tr>
    @for (itm of item.items; track itm; let index = $index) {
    <tr>
      <td>{{ itm.nameMachinery }}</td>
      <td>{{ itm.area }}</td>
      <td class="no-print">
        <div class="flex">
          <il-button-edit
            (clicked)="onModalForm({ id: itm.id, title: 'Editar' })"
          />
          <il-button-delete (confirmed)="onDelete(itm.id)" />
        </div>
      </td>
    </tr>
    }
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="3" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
>
  <ng-template #listItemTemplate let-item>
    <ion-item
      lines="none"
      class="ion-no-padding"
      style="--background: var(--ds-surface-variant); --min-height: 44px"
    >
      <div
        slot="start"
        style="
          width: 36px;
          height: 36px;
          border-radius: 10px;
          background: var(--ds-border);
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
          margin-left: 16px;
        "
      >
        <app-icon
          icon="mdi:palette-outline"
          style="font-size: 20px; color: var(--ds-help)"
        ></app-icon>
      </div>
      <ion-label>
        <h3 style="font-weight: 700; color: var(--ds-help)">
          {{ item.luminaria.producto }}
        </h3>
      </ion-label>
    </ion-item>
    @for (itm of item.items; track itm) {
    <ion-item
      lines="full"
      detail="false"
      class="ion-no-padding"
      style="--padding-start: 52px"
    >
      <ion-label>
        <h3>{{ itm.nameMachinery }}</h3>
        <p>{{ itm.area }}</p>
      </ion-label>
      <app-action-menu slot="end">
        <ng-container actions>
          <il-button-edit
            (clicked)="onModalForm({ id: itm.id, title: 'Editar' })"
            label="Editar"
          />
          <il-button-delete
            (confirmed)="onDelete(itm.id)"
            label="Eliminar"
          />
        </ng-container>
      </app-action-menu>
    </ion-item>
    }
  </ng-template>
</app-data-view-mobile>
