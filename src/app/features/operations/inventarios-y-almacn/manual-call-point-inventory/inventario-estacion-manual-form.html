<div class="card">
  <div class="card-body">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <div class="mb-4 flex justify-content-center">
        <div class="w-full sm:w-9/12 max-w-sm">
          <div class="card text-center p-3">
            <custom-input-img-signal
              (fileSelected)="uploadFile($event)"
              [urlImgCurrent]="urlBaseImg"
              [contentHeight]="75"
              [contentWidth]="75"
            />
          </div>
        </div>
      </div>

      <custom-input-select-signal
        [control]="form.controls.stationType"
        label="Tipo de Estación Manual"
        [data]="cb_stationType"
        [filter]="true"
      />

      <custom-input-text-signal
        [control]="form.controls.location"
        label="Ubicación"
        placeholder="Ej: Piso 2 - Escalera B"
      />

      <custom-input-text-signal
        [control]="form.controls.localCode"
        label="Código Local (opcional)"
        placeholder="Ej: MCP-02-01"
      />

      <custom-button-save
        [propertyId]="id"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </form>
  </div>
</div>
