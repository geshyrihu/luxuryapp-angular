<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <div class="flex justify-content-between align-items-center w-full">
      <div class="flex align-items-center gap-2">
        <custom-button-item (clicked)="onOpenScanner()" icon="pi pi-qrcode" tooltip="Escanear QR" />
        <custom-button-download (clicked)="downloadTemplate()" label="Plantilla" tooltip="Descargar plantilla Excel" [showLabelOnDesktop]="true" />
        <custom-button-download (clicked)="fileInput.click()" label="Importar" tooltip="Importar desde Excel" [showLabelOnDesktop]="true" />
        <input type="file" accept=".xlsx" style="display:none" #fileInput (change)="onImportExcel($event)" />
      </div>
      <primeng-custom-caption
        [title]="'Inventario de Hidrantes'"
        (add)="onModalForm({ id: '', title: 'Nuevo Hidrante' })"
        [dt]="dt"
      />
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-5">Foto</th>
      <th class="table-col-15" pSortableColumn="localCode">Código <p-sortIcon field="localCode" /></th>
      <th class="table-col-25" pSortableColumn="hydrantType">Tipo <p-sortIcon field="hydrantType" /></th>
      <th class="table-col-15" pSortableColumn="cabinetNumber">Gabinete <p-sortIcon field="cabinetNumber" /></th>
      <th class="table-col-25" pSortableColumn="location">Ubicación <p-sortIcon field="location" /></th>
      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td><p-image [src]="item.photo" alt="." width="100" class="shadow-4" [preview]="true" /></td>
      <td><small>{{ item.localCode }}</small></td>
      <td><small>{{ item.hydrantType }}</small></td>
      <td><small>{{ item.cabinetNumber }}</small></td>
      <td><small>{{ item.location }}</small></td>
      <td>
        <div class="flex">
          <custom-button-item (clicked)="onViewHistory(item)" tooltip="Ver historial de inspecciones" icon="pi pi-list" />
          <custom-button-edit (clicked)="onModalForm({ id: item.id, title: 'Editar' })" />
          <custom-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Hidrante' })"
>
  <div customFilters class="px-3 pb-2">
    <ion-button expand="block" fill="outline" color="primary" (click)="onOpenScanner()">
      <ion-icon name="qr-code-outline" slot="start"></ion-icon>
      Escanear QR
    </ion-button>
  </div>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" detail="false" class="ion-no-padding">
      <div slot="start" style="
        width:36px; height:36px; border-radius:10px;
        background:#dbeafe; display:flex; align-items:center;
        justify-content:center; flex-shrink:0; margin-left:16px;
      ">
        <ion-icon name="water-outline" style="font-size:20px; color:#2563eb;"></ion-icon>
      </div>
      <ion-label>
        <h3>{{ item.localCode ? item.localCode + ' — ' : '' }}{{ item.hydrantType }}</h3>
        <p>{{ item.location }}</p>
      </ion-label>
      <app-action-menu slot="end">
        <ion-button-item (clicked)="onViewHistory(item)" label="Historial" iconName="list-outline" />
        <ion-button-edit (clicked)="onModalForm({ id: item.id, title: 'Editar' })" />
        <ion-button-delete (confirmed)="onDelete(item.id)" />
      </app-action-menu>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
