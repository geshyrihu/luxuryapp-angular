<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <div class="flex justify-content-between align-items-center w-full">
      <div class="flex align-items-center gap-2">
        <il-button-item
          (clicked)="onOpenScanner()"
          [iconClass]="'mdi:qrcode'"
          tooltip="Escanear QR"
        />
        <il-button-download
          (clicked)="onDownloadAllQr()"
          label="QR"
          tooltip="Descargar todos los QR"
        />
        <il-button-item
          (clicked)="onViewPeriodos()"
          label="Periodos"
          tooltip="Configurar periodos de inspección"
        />
        <il-button-download
          (clicked)="downloadTemplate()"
          label="Plantilla"
          tooltip="Descargar plantilla Excel"
        />
        <il-button-download
          (clicked)="fileInput.click()"
          label="Importar"
          tooltip="Importar desde Excel"
        />
        <input
          type="file"
          accept=".xlsx"
          style="display: none"
          #fileInput
          (change)="onImportExcel($event)"
        />
      </div>
      <primeng-custom-caption
        [title]="'Inventario de Detectores de Humo'"
        (add)="onModalForm({ id: '', title: 'Nuevo Detector de Humo' })"
        [dt]="dt"
      />
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="table-col-5">Foto</th>
      <th class="table-col-15" pSortableColumn="localCode">
        Código <p-sortIcon field="localCode" />
      </th>
      <th class="table-col-30" pSortableColumn="detectorType">
        Tipo <p-sortIcon field="detectorType" />
      </th>
      <th class="table-col-35" pSortableColumn="location">
        Ubicación <p-sortIcon field="location" />
      </th>
      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <p-image
          [src]="item.photo"
          alt="."
          width="100"
          class="shadow-4"
          [preview]="true"
        />
      </td>
      <td><small>{{ item.localCode }}</small></td>
      <td><small>{{ item.detectorType }}</small></td>
      <td><small>{{ item.location }}</small></td>
      <td>
        <div class="flex">
          <il-button-item
            (clicked)="onViewHistory(item)"
            tooltip="Ver historial de inspecciones"
            [iconClass]="'mdi:format-list-bulleted'"
          />
          <il-button-download
            (clicked)="onDownloadQr(item)"
            tooltip="Descargar QR"
          />
          <il-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <il-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="5" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Detector de Humo' })"
>
  <div customFilters class="px-3 pb-2 flex flex-column gap-2">
    <ion-button
      expand="block"
      fill="outline"
      color="primary"
      (click)="onOpenScanner()"
    >
      <app-icon icon="mdi:qrcode" slot="start"></app-icon>
      Escanear QR
    </ion-button>
    <ion-button
      expand="block"
      fill="outline"
      color="secondary"
      (click)="onViewPeriodos()"
    >
      <app-icon icon="mdi:clock-outline" slot="start"></app-icon>
      Periodos de Inspección
    </ion-button>
  </div>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" detail="false" class="ion-no-padding">
      <div
        slot="start"
        style="
          width: 36px;
          height: 36px;
          border-radius: 10px;
          background: var(--ds-surface-variant);
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
          margin-left: 16px;
        "
      >
        <app-icon
          icon="mdi:cloud-outline"
          style="font-size: 20px; color: var(--ds-success)"
        ></app-icon>
      </div>
      <ion-label>
        <h3>
          {{ item.localCode ? item.localCode + ' é ' : '' }}{{ item.detectorType
          }}
        </h3>
        <p>{{ item.location }}</p>
      </ion-label>
      <app-action-menu slot="end">
        <ng-container actions>
          <il-button-item
            (clicked)="onViewHistory(item)"
            label="Historial"
            iconName="list-outline"
          />
          <il-button-download
            (clicked)="onDownloadQr(item)"
            label="QR"
          />
          <il-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          <il-button-delete
            (confirmed)="onDelete(item.id)"
            label="Eliminar"
          />
        </ng-container>
      </app-action-menu>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
