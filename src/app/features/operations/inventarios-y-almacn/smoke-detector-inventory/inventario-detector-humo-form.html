<div class="card">
  <div class="card-body">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <div class="mb-4 flex justify-content-center">
        <div class="w-full sm:w-9/12 max-w-sm">
          <div class="card text-center p-3">
            <custom-input-img-signal
              (fileSelected)="uploadFile($event)"
              [urlImgCurrent]="urlBaseImg"
              [contentHeight]="75"
              [contentWidth]="75"
            />
          </div>
        </div>
      </div>

      <custom-input-select-signal
        [control]="form.controls.detectorType"
        label="Tipo de Detector"
        [data]="cb_detectorType"
        [filter]="true"
      />

      <custom-input-text-signal
        [control]="form.controls.location"
        label="Ubicación"
        placeholder="Ej: Piso 4 - Sala de Servidores"
      />

      <custom-input-mask-signal
        [control]="form.controls.localCode"
        label="Código Local"
        placeholder="DET-04-001"
        customMask="AAA-00-000"
        [validation]="false"
        [dropSpecialCharacters]="false"
        description="DET = Detector de Humo · Zona (2 dígitos) · Número de equipo (3 dígitos)"
      />

      <custom-button-save
        [propertyId]="id"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </form>
  </div>
</div>
