<!-- 🖥️ INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<div class="hidden md:block"></div>
<p-table
  [globalFilterFields]="globalFilterFields()"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  #dt
  class="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption [showAdd]="false" />
  </ng-template>

  <ng-template #header>
    <tr>
      <th>#</th>
      <th pSortableColumn="provider">
        Proveedor
        <p-sorticon field="provider" />
      </th>
      <th pSortableColumn="description">
        Descripción
        <p-sorticon field="description" />
      </th>
      <th pSortableColumn="startDateFilter">
        Fecha Contratación
        <p-sorticon field="startDateFilter" />
      </th>
      <th pSortableColumn="endDateFilter">
        Fecha de Término
        <p-sorticon field="endDateFilter" />
      </th>
      <th>Documento</th>
    </tr>
  </ng-template>
  <ng-template #body let-item let-i="rowIndex">
    <tr>
      <td>{{ i + 1 }}</td>
      <td>{{ item.provider }}</td>
      <td>{{ item.description }}</td>
      <td>{{ item.startDate }}</td>
      <td class="text-center">
        <span
          class="badge p-2 w-75"
          [class.bg-danger-subtle]="isCloseToEndDate(item.endDateFilter)"
          [class.text-danger]="isCloseToEndDate(item.endDateFilter)"
          [class.bg-success-subtle]="!isCloseToEndDate(item.endDateFilter)"
          [class.text-success]="!isCloseToEndDate(item.endDateFilter)"
        >
          {{ item.endDate }}
        </span>
      </td>
      <td class="text-center">
        <iw-button-view-pdf [url]="item.path" fileName="Poliza | Contrato" />
      </td>
    </tr>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- 📱 MOBILE -->
<app-data-view-mobile
  [data]="dataSignal()"
  [showAdd]="false"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <p class="font-semibold m-0 text-color">{{ item.description }}</p>
      <p class="text-xs m-0 text-color-secondary">{{ item.provider }} · {{ item.endDate }}</p>

      <ili-action-menu end>
        <ng-container actions>
          <ili-button-view-pdf [url]="item.path" fileName="Poliza | Contrato" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
