<div class="card shadow-3 p-3 border-round">
  <!-- Vista de escritorio -->
  <div class="hidden md:block">
    <p-table
      (onRowReorder)="onRowReorder($event)"
      [globalFilterFields]="globalFilterFields"
      [value]="dataSignal()"
      #dt
      styleClass="custom-table card hidden md:block"
      [reorderableColumns]="true"
    >
      <ng-template #caption>
        <primeng-custom-caption [showAdd]="false" [dt]="dt" />
      </ng-template>
      <ng-template #header>
        <tr>
          <th class="table-col-5rem"></th>
          <th
            class="bg-gradient text-white text-center"
            pSortableColumn="folio"
          >
            Folio
            <p-sortIcon field="folio" />
          </th>
          <th class="bg-gradient text-white text-center">Fecha</th>
          <th class="text-center" pSortableColumn="name">
            Nombre
            <p-sortIcon field="name" />
          </th>
          <th class="text-center">Descargar</th>
        </tr>
      </ng-template>
      <ng-template #body let-item let-index="rowIndex">
        <tr [pReorderableRow]="index">
          <td>
            <div>
              <app-icon icon="mdi:menu" class="icon" pReorderableRowHandle></app-icon>
            </div>
          </td>
          <td class="text-center">{{ item.folio }}</td>
          <td class="text-center">{{ item.createAt }}</td>
          <td class="text-center text-break">{{ item.name }}</td>
          <td class="text-center">
            <il-button-view-pdf
              [url]="item.path"
              pdf="Documento"
            />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="5" />
  </ng-template>
      <ng-template #paginatorleft>
        <primeng-custom-table-footer [data]="dataSignal()" />
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Vista para m�viles -->
<!-- Vista para m�viles -->
<div class="block md:hidden">
  <app-data-view-mobile
    [data]="dataSignal()"
    [showAdd]="false"
    [globalFilterFields]="globalFilterFields"
    [dt]="dt"
  >
    <ng-template #listItemTemplate let-item>
      <ion-item lines="full" class="ion-no-padding">
        <div
          slot="start"
          class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
          style="
            width: 38px;
            height: 38px;
            background: var(--ds-primary-50, #edf1ff);
          "
        >
          <app-icon
            icon="mdi:account-group-outline"
            style="font-size: 1.1rem; color: var(--ds-primary)"
          ></app-icon>
        </div>
        <ion-label>
          <div class="flex justify-content-between align-items-center mb-1">
            <h2 class="font-bold m-0 text-base text-wrap">{{ item.name }}</h2>
          </div>
          <p class="text-sm text-500 m-0">
            <app-icon [icon]="'mdi:pound'" class="mr-1 text-xs"></app-icon>
            Folio: {{ item.folio }}
          </p>
          <p class="text-sm text-500 m-0">
            <app-icon [icon]="'mdi:calendar'" class="mr-1 text-xs"></app-icon>
            Fecha: {{ item.createAt }}
          </p>
        </ion-label>
        <div slot="end" class="flex align-items-center">
          <il-button-view-pdf [url]="item.path" pdf="Documento Asamblea" />
        </div>
      </ion-item>
    </ng-template>
  </app-data-view-mobile>
</div>
