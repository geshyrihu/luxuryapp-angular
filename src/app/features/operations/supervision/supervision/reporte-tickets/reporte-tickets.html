<p-table
  [globalFilterFields]="globalFilterFields()"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  #dt
  class="custom-table hidden md:block"
>
  <ng-template #caption>
    <div class="grid align-items-center mb-3">
      <div class="col-12 sm:col-6">
        <h4 class="text-xl font-medium mb-0">TICKETS SOLICITADOS</h4>
      </div>
      <div class="col-12 sm:col-3 no-print">
        <app-mesanio (periodoEmit)="onFiltrarPeriodo($event)"></app-mesanio>
      </div>
      <div class="col-12 sm:col-3 no-print">
        <custom-input-text-signal
          (input)="dt.filterGlobal($any($event.target).value, 'contains')"
          placeholder="Ingresa texto para buscar..."
          [customClass]="'no-print'"
          [horizontal]="false"
        />
      </div>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="empleado" class="table-col-20">
        COLABORADOR
        <p-sorticon field="empleado" />
      </th>
      <th pSortableColumn="solicitudes" class="table-col-20">
        SOLICITUDES
        <p-sorticon field="solicitudes" />
      </th>
      <th pSortableColumn="atendidas" class="table-col-20">
        ATENDIDAS
        <p-sorticon field="atendidas" />
      </th>
      <th pSortableColumn="pendientes" class="table-col-20">
        PENDIENTES
        <p-sorticon field="pendientes" />
      </th>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="4" />
  </ng-template>
  <ng-template #body let-item>
    <tr [hidden]="false">
      <td>
        <div>
          <app-avatar
            [image]="item.photoPath"
            alt=""
            shape="square"
            size="large"
            styleClass="mr-2"
          />
          {{ item.empleado }}
        </div>
      </td>
      <td class="text-center">
        <p-tag
          severity="info"
          [value]="item.solicitudes"
          class="text-lg p-2 w-full"
        />
      </td>
      <td class="text-center">
        <p-tag
          severity="success"
          [value]="item.atendidas"
          class="text-lg p-2 w-full"
        />
      </td>
      <td class="text-center">
        <p-tag
          severity="danger"
          [value]="item.pendientes"
          class="text-lg p-2 w-full"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #footer>
    <tr>
      <td class="text-right">Totales</td>
      <td class="text-center">
        <span class="h4 card-title text-dark">
          {{ onSumaTotales(dataSignal()).solicitudes }}
        </span>
      </td>
      <td class="text-center">
        <span class="h4 card-title text-dark">
          {{ onSumaTotales(dataSignal()).atendidas }}
        </span>
      </td>
      <td class="text-center">
        <span class="h4 card-title text-dark">
          {{ onSumaTotales(dataSignal()).pendientes }}
        </span>
      </td>
    </tr>
  </ng-template>
</p-table>
