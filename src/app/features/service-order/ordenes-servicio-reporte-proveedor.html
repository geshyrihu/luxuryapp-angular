<p-table [value]="dataSignal()" styleClass="custom-table card hidden md:block">
  <ng-template #header>
    <tr>
      <th>Archivo</th>
      <th>Nombre</th>
      <th class="table-col-5">Borrar</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <a
          [ngbTooltip]="item.document"
          placement="top"
          target="_blank"
          [href]="item.document"
          class="pointer text-danger mr-1"
        >
          <app-icon [icon]="'mdi:download'" class="icon icon- label-icon text-danger"></app-icon>
          Pdf
        </a>
      </td>
      <td>{{ item.nameDocument }}</td>

      <!-- Opciones -->
      <td>
        <div class="flex justify-content-center">
          <custom-button-delete (confirmed)="deleteDoc(item.id)" />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
</p-table>
