<div class="flex flex-column gap-3">
  <!-- Encabezado Informativo -->
  <div class="surface-card p-3 border-round border-1 surface-border flex align-items-center gap-3">
    <div class="w-3rem h-3rem border-round bg-primary-50 flex align-items-center justify-content-center text-primary">
      <app-icon icon="mdi:office-building" class="text-xl" />
    </div>
    <div class="flex flex-column">
      <span class="text-900 font-bold uppercase tracking-wider text-sm">Acceso a Clientes</span>
      <span class="text-xs text-500">Selecciona los clientes a los que este usuario tendrá acceso</span>
    </div>
  </div>

  <!-- Grid de Clientes -->
  <div class="grid p-1">
    @for (item of dataSignal(); track item.customerId) {
    <div class="col-12 sm:col-6 lg:col-4">
      <div
        class="flex align-items-center justify-content-between p-3 border-round-lg border-1 surface-border cursor-pointer hover:surface-100 transition-colors transition-duration-200 min-h-4rem h-full shadow-hover"
        [class.surface-50]="item.isSelected"
        [class.border-primary]="item.isSelected"
        [class.shadow-1]="item.isSelected"
        (click)="toggleCliente(item)"
      >
        <div class="flex align-items-center min-w-0 gap-3 w-full">
          <!-- Indicador Visual -->
          <span
            class="flex-shrink-0 inline-flex align-items-center justify-content-center w-2rem h-2rem border-round-circle border-1"
            [class.bg-green-100]="item.isSelected"
            [class.text-green-700]="item.isSelected"
            [class.border-green-200]="item.isSelected"
            [class.bg-red-50]="!item.isSelected"
            [class.text-red-400]="!item.isSelected"
            [class.border-red-100]="!item.isSelected"
          >
            <app-icon
              [icon]="item.isSelected ? 'mdi:check' : 'mdi:close'"
              class="text-xs"
            />
          </span>

          <div class="flex flex-column min-w-0 flex-1">
            <span class="font-bold text-sm text-900 truncate" [title]="item.customerName">
              {{ item.customerName | uppercase }}
            </span>
            @if (item.isSelected) {
              <span class="text-xs font-bold text-green-600">Acceso Permitido</span>
            } @else {
              <span class="text-xs text-400">Sin Acceso</span>
            }
          </div>
        </div>
      </div>
    </div>
    }
  </div>
</div>
