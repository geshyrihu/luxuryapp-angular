<div class="flex flex-column gap-4">
  <p-card styleClass="shadow-2">
    <ng-template #header>
      <div class="flex flex-column p-4 border-bottom-1 surface-border">
        <div class="text-xs uppercase font-bold tracking-wider text-500">
          🧰 Mantenimiento de Base de Datos
        </div>
        <h4 class="m-0 text-900">Scripts de mantenimiento</h4>
        <p class="m-0 text-sm text-color-secondary line-height-3">
          Ejecuta scripts para actualizar, migrar y sincronizar datos antiguos
          en el sistema.
        </p>
      </div>
    </ng-template>

    <div class="grid">
      <div class="col-12 md:col-6 lg:col-4">
        <p-card
          class="cursor-pointer h-full block"
          styleClass="h-full border-1 surface-border hover:surface-100 transition-all transition-duration-200"
          (click)="runMigrateCoiAspel()"
        >
          <div class="flex align-items-start gap-3">
            <div
              class="flex w-3rem h-3rem flex-shrink-0 align-items-center justify-content-center border-round-xl bg-primary-50 text-2xl"
            >
              🗃️
            </div>
            <div class="flex flex-column gap-1">
              <div class="font-bold text-900">Sincronizar Aspel COI</div>
              <div class="text-xs text-color-secondary line-height-2">
                Migra información de contabilidad general desde Aspel COI.
              </div>
            </div>
          </div>
        </p-card>
      </div>
    </div>
  </p-card>
</div>
