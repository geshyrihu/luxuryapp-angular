<div class="p-4">
  <!-- Header con botón de carga -->
  <div class="flex align-items-center justify-content-between mb-4">
    <div>
      <h3 class="m-0 font-bold text-900">Galería de Imágenes</h3>
      <p class="text-600 m-0">Gestiona las fotografías relacionadas con este cliente.</p>
    </div>
    <div>
      <p-fileUpload
        mode="basic"
        name="image"
        chooseLabel="Subir Imagen"
        chooseIcon="pi pi-upload"
        accept="image/*"
        maxFileSize="5000000"
        (onSelect)="onUpload($event)"
        [auto]="true"
        styleClass="p-button-rounded p-button-success shadow-2"
      />
    </div>
  </div>

  <hr class="border-top-1 border-300 mb-4" />

  <!-- Galería -->
  @if (loading()) {
    <div class="flex justify-content-center align-items-center py-8">
      <i class="pi pi-spin pi-spinner text-primary" style="font-size: 3rem"></i>
    </div>
  } @else {
    @if (hasImages()) {
      <div class="grid">
        @for (img of images(); track img.id) {
          <div class="col-12 sm:col-6 md:col-4 lg:col-3">
            <div class="card-image-container relative border-round overflow-hidden shadow-2 hover:shadow-4 transition-all transition-duration-300">
              <!-- Imagen con Preview -->
              <p-image
                [src]="img.pathImag"
                [alt]="'Imagen de cliente'"
                [preview]="true"
                appendTo="body"
                imageClass="w-full h-15rem object-cover"
              />
              
              <!-- Botón Eliminar Overlay -->
              <div class="absolute top-0 right-0 p-2">
                <p-button
                  icon="pi pi-trash"
                  [rounded]="true"
                  [text]="true"
                  severity="danger"
                  (onClick)="onDelete(img.id)"
                  pTooltip="Eliminar imagen"
                  tooltipPosition="left"
                  styleClass="bg-white-alpha-40 backdrop-blur-sm hover:bg-red-500 hover:text-white"
                />
              </div>
            </div>
          </div>
        }
      </div>
    } @else {
      <div class="flex flex-column align-items-center justify-content-center py-8 bg-gray-50 border-round-xl border-2 border-dashed border-300">
        <i class="pi pi-images text-400 mb-3" style="font-size: 4rem"></i>
        <p class="text-700 font-medium text-xl m-0">No hay imágenes disponibles</p>
        <p class="text-500 m-0">Sube tu primera imagen para comenzar la galería.</p>
      </div>
    }
  }
</div>

<style>
  .object-cover {
    object-fit: cover;
  }
  .backdrop-blur-sm {
    backdrop-filter: blur(4px);
  }
  .card-image-container:hover p-image {
    transform: scale(1.05);
  }
  p-image {
    transition: transform 0.3s ease-in-out;
    display: block;
  }
</style>
