<div class="card">
  <form
    autocomplete="off"
    (ngSubmit)="onSubmit()"
    [formGroup]="form"
    class="flex flex-column"
  >
    <div class="hidden">
      <custom-input-text-signal
        [control]="form.controls.id"
        hidden
        label="Id"
        [readonly]="true"
      />
    </div>

    <div class="flex justify-content-end mb-4">
      <il-button
        label="Criticar con IA"
        iconClass="mdi:lightning-bolt"
        variant="ghost-text"
        severity="help"
        (clicked)="analyzeDescription()"
        [loading]="analyzingDescription()"
        [disabled]="!applicationRoleName()"
      />
      <il-button
        label="Generar con IA"
        iconClass="mdi:sparkles"
        variant="ghost-text"
        severity="help"
        (clicked)="openInstructionsDialog()"
        [loading]="generatingProposal()"
        [disabled]="!applicationRoleName()"
      />
    </div>

    <lx-modal
      header="Instrucciones para la IA (Opcional)"
      [visible]="showInstructionsDialog()"
      (visibleChange)="showInstructionsDialog.set($event)"
    >
      <p class="mb-3 text-600 text-sm">
        Agrega contexto adicional para que la IA genere una mejor propuesta.
      </p>
      <custom-input-textarea-signal
        [rows]="5"
        [(ngModel)]="customInstructions"
        [ngModelOptions]="{standalone: true}"
        placeholder="Ej: Enfocarse en atenciÃ³n de lujo, requiere nivel bilingÃ¼e..."
        [onlyInput]="true"
        [noMargin]="true"
        customClass="w-full"
      />

      <div class="flex justify-content-end gap-2 mt-3">
        <il-button
          label="Cancelar"
          iconClass="mdi:close"
          variant="ghost-text"
          severity="secondary"
          (clicked)="showInstructionsDialog.set(false)"
        />
        <il-button
          label="Generar"
          iconClass="mdi:check"
          severity="help"
          [loading]="generatingProposal()"
          (clicked)="generateProposal()"
        />
      </div>
    </lx-modal>
  </form>
</div>
