<p-card>
  <div class="card-body">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <custom-input-text-signal
        [control]="form.controls.id"
        [readonly]="true"
        label="Id"
        placeholder="id"
      />

      <custom-input-text-signal
        [control]="form.controls.folio"
        [readonly]="true"
        label="Folio"
        placeholder="folio"
      />

      <custom-input-date-signal
        [control]="form.controls.requestDate"
        label="Fecha de solicitud"
        placeholder="fecha de solicitud"
      />

      <custom-input-select-signal
        [control]="form.controls.status"
        label="Estatus"
        [data]="cb_status()"
        [filter]="true"
      />
      <div class="grid mb-4 align-items-center">
        <label class="col-12 sm:col-3 mb-2 md:mb-0 flex align-items-center"
          >Fuente</label
        >
        <div class="col-12 sm:col-9">
          <custom-input-select-signal
            [control]="form.controls.fuente"
            [data]="cb_fuente()"
            optionLabel="label"
            optionValue="value"
            placeholder="--Selecciona una opción--"
          />
        </div>
      </div>

      <custom-input-date-signal
        [control]="form.controls.selectionDate"
        label="Fecha de selección"
        placeholder="fecha de selección"
      />

      <custom-input-date-signal
        [control]="form.controls.entryDate"
        label="Fecha de ingreso"
        placeholder="fecha de ingreso"
      />

      <custom-input-textarea-signal
        [control]="form.controls.observations"
        label="Observaciones"
        placeholder="observaciones"
      />

      <il-button-save
        [propertyId]="id"
        [disabled]="form.invalid"
        [submitting]="submitting()"
      />
    </form>
  </div>
</p-card>
