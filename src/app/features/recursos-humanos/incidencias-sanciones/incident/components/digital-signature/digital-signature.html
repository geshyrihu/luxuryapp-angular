<div class="digital-signature-container">
  <label class="block text-sm font-medium mb-2">Firma Digital</label>

  <div class="border-1 border-300 border-round overflow-hidden bg-white">
    <canvas
      #signatureCanvas
      [width]="canvasWidth"
      [height]="canvasHeight"
      class="w-full cursor-crosshair touch-none"
      (mousedown)="startSigning($event)"
      (mousemove)="sign($event)"
      (mouseup)="stopSigning()"
      (mouseleave)="stopSigning()"
      (touchstart)="startSigning($event)"
      (touchmove)="sign($event)"
      (touchend)="stopSigning()"
    ></canvas>
  </div>

  <div class="flex mt-3 gap-2">
    <custom-button
      label="Limpiar"
      severity="secondary"
      variant="outlined"
      iconClass="pi pi-trash"
      [showLabelOnDesktop]="true"
      (clicked)="clearSignature()"
    />

    <custom-button
      label="Guardar Firma"
      iconClass="pi pi-save"
      [disabled]="!hasSignature()"
      (clicked)="saveSignature()"
      [showLabelOnDesktop]="true"
    />
  </div>

  @if (hasSignature()) {
  <small class="text-green-600 mt-2 block font-medium">
    <i class="pi pi-check-circle mr-1"></i>Firma capturada correctamente
  </small>
  } @else {
  <small class="text-color-secondary mt-2 block italic">
    Dibuje su firma en el recuadro superior
  </small>
  }
</div>
