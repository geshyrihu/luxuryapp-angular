<div class="p-3">

  <!-- Formulario agregar dia -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mb-4">
    <div class="grid align-items-end">
      <div class="col-12 md:col-3">
        <custom-input-date-signal
          [control]="form.controls['fecha']"
          label="Fecha"
        />
      </div>
      <div class="col-12 md:col-5">
        <custom-input-text-signal
          [control]="form.controls['descripcion']"
          label="Descripcion"
          placeholder="Ej. Dia de la Independencia"
        />
      </div>
      <div class="col-12 md:col-2">
        <custom-input-switch-signal
          [control]="form.controls['esFestivoOficial']"
          label="Festivo Oficial"
        />
      </div>
      <div class="col-12 md:col-2 flex align-items-end">
        <custom-button-save
          (clicked)="onSubmit()"
          [submitting]="submitting()"
          label="Agregar"
        />
      </div>
    </div>
  </form>

  <!-- Listado de dias no habiles -->
  <p-table
    [value]="dias()"
    [loading]="loading()"
    styleClass="p-datatable-sm"
  >
    <ng-template #header>
      <tr>
        <th>Fecha</th>
        <th>Descripcion</th>
        <th>Festivo</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-dia>
      <tr>
        <td>{{ dia.fecha | date: "dd/MM/yyyy" }}</td>
        <td>{{ dia.descripcion }}</td>
        <td>
          <p-tag
            [severity]="dia.esFestivoOficial ? 'success' : 'secondary'"
            [value]="dia.esFestivoOficial ? 'Si' : 'No'"
          />
        </td>
        <td>
          <custom-button
            iconClass="pi pi-trash"
            severity="danger"
            variant="ghost-text"
            (clicked)="onDelete(dia.id)"
          />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr><td colspan="4">Sin dias no habiles registrados.</td></tr>
    </ng-template>
  </p-table>

</div>
