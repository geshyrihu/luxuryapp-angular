<app-report-header></app-report-header>
<div class="flex align-items-center justify-content-between">
  <h5 class="m-0 h5">Mantenimientos Preventivos</h5>
</div>
<table class="custom-table">
  <tbody>
    @for (item of dataSignal(); track item) {
    <tr class="page-break">
      <td>
        <table class="table table-sm table-striped table-bordered mt-1">
          <tr >
            <td class="table-col-25">Equipo:</td>
            <td class="table-col-25">{{ item.equipo }}</td>
            <td class="table-col-25">Fecha de Solicitud:</td>
            <td class="table-col-25">
              {{ item.fechaSolicitud }}
            </td>
          </tr>
          <tr >
            <td class="table-col-25">Tipo de servicio:</td>
            <td class="table-col-25">
              {{ item.tipoServicio }}
            </td>
            <td class="table-col-25">Fecha de Ejecución:</td>
            <td class="table-col-25">
              {{ item.fechaTermino }}
            </td>
          </tr>
          <tr >
            <td class="table-col-25">Proveedor:</td>
            <td class="table-col-25">
              {{ item.proveedor }}
            </td>
            <td colspan="2" class="table-col-50"></td>
          </tr>
        </table>
        <table class="table table-sm table-striped table-bordered mt-1">
          <tr >
            <td class="table-col-50">Actividad:</td>
            <td class="table-col-50">Observaciones</td>
          </tr>
          <tr >
            <td class="table-col-50">
              <p
                class="font-normal mb-0"
                [innerHTML]="item.actividad | sanitizeHtml"
              ></p>
            </td>
            <td class="table-col-50">
              <p
                class="font-normal mb-0"
                [innerHTML]="item.observaciones | sanitizeHtml"
              ></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    }
  </tbody>
</table>
