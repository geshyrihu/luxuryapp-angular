<div class="mt-2">
  <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
    <custom-input-text-signal
      [control]="form.controls.id"
      label="Id"
      [hidden]="true"
    />

    <custom-input-text-signal
      [control]="form.controls.employeeId"
      label="employeeId"
      [hidden]="true"
    />
    <custom-input-text-signal
      [control]="form.controls.workPositionId"
      label="workPositionId"
      [hidden]="true"
    />

    <custom-input-select-signal
      [control]="form.controls.confirmationFinish"
      label="confirmationFinish"
      [data]="cb_si_no()"
      [hidden]="true"
      [filter]="true"
    />

    <custom-input-date-signal
      [control]="form.controls.requestDate"
      label="Fecha de solicitud"
      placeholder="fecha de solicitud"
      [disabled]="true"
    />
    <custom-input-text-signal
      [control]="form.controls.folio"
      label="Folio"
      [readonly]="true"
    />
    <custom-input-number-signal
      [control]="form.controls.currentSalary"
      label="Sueldo mensual libre actual"
      placeholder="Sueldo mensual libre actual"
    />
    <custom-input-select-signal
      [control]="form.controls.applicationRoleCurrentId"
      label="Puesto actual"
      [data]="cb_applicationRole()"
      [filter]="true"
    />
    <custom-input-number-signal
      [control]="form.controls.finalSalary"
      label="Sueldo mensual libre nuevo"
      placeholder="Sueldo mensual libre nuevo"
    />
    <custom-input-select-signal
      [control]="form.controls.applicationRoleNewId"
      label="Puesto nuevo"
      [data]="cb_applicationRole()"
      [filter]="true"
    />
    <custom-input-date-signal
      [control]="form.controls.executionDate"
      label="Fecha de ejecución"
      placeholder="fecha de ejecución"
    />

    <custom-input-select-signal
      [control]="form.controls.retroactive"
      label="Retroactivo"
      [data]="cb_si_no()"
      [filter]="true"
    />

    <custom-button-save
      [propertyId]="id"
      [disabled]="form.invalid"
      [submitting]="submitting()"
    />
  </form>
</div>
