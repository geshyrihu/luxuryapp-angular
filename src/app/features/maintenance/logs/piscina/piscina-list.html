@if (dataSignal()) {
<!-- ??? INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<div class="hidden md:block">
  <div class="card">
    <p-table
      [globalFilterFields]="globalFilterFields"
      [value]="dataSignal()"
      #dt
      class="custom-table"
    >
      <ng-template #caption>
        <primeng-custom-caption
          (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
          [dt]="dt"
        />
      </ng-template>
      <ng-template #header>
        <tr>
          <th>Imagen</th>
          <th pSortableColumn="name">
            Nombre
            <p-sorticon field="name" />
          </th>
          <th>Ubicación</th>
          <th>Volumen</th>
          <th colspan="2">Tipo</th>
        </tr>
      </ng-template>
      <ng-template #body let-item>
        <tr>
          <td class="text-center">
            <div class="flex">
              <app-image
                [src]="
                  item.pathImage
                    ? item.pathImage
                    : 'assets/images/default-avatar.png'
                "
                alt="."
                width="50"
                styleClass="mr-2"
                [preview]="true"
              ></app-image>
              @if (!item.pathImage) {
              <img src="assets/images/default-avatar.png" alt="" width="50" />
              }
            </div>
          </td>
          <td>{{ item.name }}</td>
          <td>{{ item.ubication }}</td>
          <td>{{ item.volumen }}</td>
          <td>
            <!-- {{ item.typePiscina | ETypePiscina }} -->
            {{ item.typePiscina }}
          </td>
          <!-- Opciones -->
          <td class="no-print">
            <div class="flex">
              <iw-button-edit
                (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
              />
              <iw-button-delete (confirmed)="onDelete(item.id)" />
              <iw-button-item
                iconClass="mdi:book"
                pTooltip="Bitúcora"
                tooltipPosition="top"
                [routerLink]="['/logbook/piscina-bitacora/', item.id]"
              />
            </div>
          </td>

          <!-- Opciones -->
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <primeng-custom-table-emptymessage [colspan]="5" />
      </ng-template>
    </p-table>
  </div>
</div>

<!-- ?? INICIO: Componente adaptado para versión mívil -->
<div class="block md:hidden">
  <div class="card">
    <app-data-view-mobile
      [data]="dataSignal()"
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [globalFilterFields]="globalFilterFields"
    >
      <ng-template #listItemTemplate let-item>
        <ili-list-item [noPadding]="true">
          <div
            start
            class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
            style="
              width: 38px;
              height: 38px;
              background: var(--ds-primary-50, #edf1ff);
            "
          >
            <app-icon
              icon="mdi:pool"
              style="font-size: 1.1rem; color: var(--ds-info)"
            />
          </div>
          
            <h2 class="font-bold m-0 text-base">{{ item.name }}</h2>
            <p class="text-sm text-500 m-0">?? {{ item.ubication }}</p>
            <div class="flex mt-1">
              <small class="text-xs"
                ><strong class="text-primary">Vol:</strong> {{ item.volumen
                }}</small
              >
              <small class="text-xs"
                ><strong class="text-primary">Tipo:</strong> {{ item.typePiscina
                }}</small
              >
            </div>
          
          <div end>
            <ili-action-menu>
              <ng-container actions>
                <ili-button-edit
                  (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
                  label="Editar"
                />
                <ili-button-delete
                  (confirmed)="onDelete(item.id)"
                  label="Eliminar"
                />
                <ili-button-item
                  iconName="book-outline"
                  label="Bitúcora"
                  [routerLink]="['/logbook/piscina-bitacora/', item.id]"
                />
              </ng-container>
            </ili-action-menu>
          </div>
        </ili-list-item>
      </ng-template>
    </app-data-view-mobile>
  </div>
</div>
}
