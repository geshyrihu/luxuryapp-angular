<!-- ??? INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<div class="hidden md:block"></div>
<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
    <il-button-download
      label="Descargar PDF"
      iconClass="mdi:file-pdf-box"
      variant="outlined"
      severity="danger"
      size="small"
      customClass="mt-1"
      (clicked)="onDownloadPdf()"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th>Img</th>
      <th pSortableColumn="nameTool">
        Nombre
        <p-sortIcon field="nameTool" />
      </th>
      <th pSortableColumn="category">
        Categoria
        <p-sortIcon field="category" />
      </th>
      @if ( aspRoleS.anyOf([AspRole.JefeMantenimiento, AspRole.SuperUsuario])()
      ) {
      <th class="table-col-10"></th>
      }
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <img
          class="img-thumbnail"
          alt="200x200"
          width="100"
          [src]="
            item.photoPath ? item.photoPath : 'assets/images/default-avatar.png'
          "
          data-holder-rendered="true"
        />
      </td>
      <td>
        <small>{{ item.nameTool }}</small>
      </td>
      <td>
        <small>{{ item.category }}</small>
      </td>
      <!-- Opciones -->

      <td class="no-print">
        <div class="flex">
          <il-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          @if (aspRoleS.roleSignal(AspRole.SuperUsuario)()) {
          <il-button-delete (confirmed)="onDelete(item.id)" />
          }
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="4" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- ?? INICIO: Componente adaptado para versi�n m�vil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" class="ion-no-padding">
      <div
        slot="start"
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
        style="
          width: 38px;
          height: 38px;
          background: var(--ds-primary-50, #edf1ff);
        "
      >
        <app-icon
          icon="mdi:tools"
          style="font-size: 1.1rem; color: var(--ds-warning)"
        ></app-icon>
      </div>

      <ion-label>
        <h2 class="font-normal m-0">{{ item.nameTool }}</h2>
        <p class="text-medium text-500 m-0">{{ item.category }}</p>
      </ion-label>

      <div slot="end">
        <app-action-menu>
          <ng-container actions>
            <il-button-edit
              (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
              label="Editar"
            />
            @if (aspRoleS.roleSignal(AspRole.SuperUsuario)()) {
            <il-button-delete
              (confirmed)="onDelete(item.id)"
              label="Eliminar"
            />
            }
          </ng-container>
        </app-action-menu>
      </div>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
