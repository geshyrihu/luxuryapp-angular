<p-table
  [globalFilterFields]="globalFilterFields()"
  [value]="dataSignal()"
  #dt
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption (add)="onModalFormBiacora(0)" [dt]="dt" />
    <br />
    <div class="w-full sm:w-30rem">
      <app-rango-calendario-yyyymmdd
        [mostrartextDesde]="false"
        [mostrartextHasta]="false"
      />
    </div>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <div class="card surface-100 mb-2 border-1 surface-border">
          <div class="card-header border-bottom-1 surface-border p-2">
            <div class="grid align-items-center">
              <div class="col-12 sm:col-6">
                <p class="m-0 font-bold">
                  {{ item.fechaRegistro | date: 'EEEE d MMM y h:mm ' }}
                </p>
              </div>
              <div class="col-12 sm:col-6 text-right no-print">
                @if (item.emergencia) {
                <p class="m-0 text-red-500 font-bold">Emergencia</p>
                } @if (aspRoleS.hasRole(AspRole.JefeMantenimiento)) {
                <iw-button-confirm
                  icon="trash"
                  ngbTooltip="Eliminar"
                  (confirmed)="onDelete(item)"
                />
                }
              </div>
            </div>
          </div>
          <div class="card-body p-3">
            <p class="m-0 font-bold text-primary mb-2">{{ item.machinery }}</p>
            <p class="m-0 font-italic text-justify">{{ item.descripcion }}</p>
            <p
              class="text-right text-sm font-light cursor-pointer text-primary mt-2 m-0"
              (click)="onCardEmployee(item.applicationUserId)"
            >
              {{ item.userName }}
            </p>
          </div>
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="1" />
  </ng-template>
</p-table>
