<form autocomplete="off" [formGroup]="form" (ngSubmit)="saveDefinition()">
  <div class="grid">
    <div class="col-12">
      <custom-input-text-signal
        [control]="form.controls.name"
        label="Nombre de la inspeccion"
        placeholder="Ej. Inspeccion semanal de planta de emergencia"
      />
    </div>

    <div class="col-12">
      <custom-input-textarea-signal
        [control]="form.controls.description"
        label="Descripcion"
        placeholder="Objetivo o alcance de la inspeccion"
      />
    </div>

    <div class="col-12 md:col-4">
      <custom-input-select-signal
        [control]="form.controls.recurrenceUnit"
        label="Frecuencia"
        [data]="recurrenceOptions"
        (selectionChange)="onRecurrenceChange()"
      />
    </div>

    <div class="col-12 md:col-4">
      <custom-input-number-signal
        [control]="form.controls.recurrenceInterval"
        label="Intervalo"
        placeholder="1"
        [min]="1"
      />
    </div>

    <div class="col-12 md:col-4">
      <custom-input-number-signal
        [control]="form.controls.estimatedDurationMinutes"
        label="Duracion estimada (min)"
        placeholder="30"
        [min]="1"
      />
    </div>

    @if (isMonthly()) {
    <div class="col-12 md:col-4">
      <custom-input-number-signal
        [control]="form.controls.dayOfMonth"
        label="Dia del mes"
        placeholder="15"
        [min]="1"
        [max]="31"
      />
    </div>
    }

    @if (isWeekly()) {
    <div class="col-12">
      <custom-input-multiselect-signal
        [control]="form.controls.weekDays"
        [options]="weekDayOptions"
        label="Dias de ejecucion"
        placeholder="Selecciona dias"
      />
    </div>
    }

    <div class="col-12 md:col-8">
      <custom-input-multiselect-signal
        [control]="form.controls.assigneeIds"
        [options]="userOptions()"
        label="Responsables"
        placeholder="Selecciona responsables"
      />
    </div>

    <div class="col-12 md:col-4">
      <custom-input-select-signal
        [control]="form.controls.primaryAssigneeId"
        [data]="primaryAssigneeOptions()"
        label="Responsable principal"
        placeholder="Responsable principal"
      />
    </div>

    <div class="col-12">
      <custom-input-check-signal
        [control]="form.controls.isActive"
        label="Definicion activa"
      />
    </div>
  </div>

  <app-card header="Criterios de inspeccion">
    <div class="flex justify-content-end mb-3">
      <il-button
        type="button"
        label="Agregar criterio"
        iconClass="mdi:plus"
        (clicked)="addCriterion()"
      />
    </div>

    <div formArrayName="criteria" class="flex flex-column gap-3">
      @for (criterion of criteria(); track $index) {
      <div [formGroupName]="$index" class="surface-ground border-round p-3">
        <div class="flex justify-content-between align-items-center mb-2">
          <strong>Criterio {{ $index + 1 }}</strong>
          <il-button-item
            type="button"
            iconClass="mdi:delete-outline"
            label="Eliminar"
            (clicked)="removeCriterion($index)"
          />
        </div>

        <div class="grid">
          <div class="col-12 md:col-6">
            <custom-input-text-signal
              [control]="criterion.controls.title"
              label="Titulo"
              placeholder="Ej. Validar nivel de aceite"
            />
          </div>

          <div class="col-12 md:col-6">
            <custom-input-textarea-signal
              [control]="criterion.controls.description"
              label="Descripcion"
              placeholder="Detalle opcional"
            />
          </div>

          <div class="col-12 md:col-3">
            <custom-input-check-signal
              [control]="criterion.controls.isRequired"
              label="Obligatorio"
            />
          </div>

          <div class="col-12 md:col-3">
            <custom-input-check-signal
              [control]="criterion.controls.isActive"
              label="Activo"
            />
          </div>
        </div>
      </div>
      }
    </div>
  </app-card>

  <div class="mt-3">
    <il-button-save
      [propertyId]="definitionId()"
      [disabled]="form.invalid || submitting()"
      [submitting]="submitting()"
    />
  </div>
</form>
