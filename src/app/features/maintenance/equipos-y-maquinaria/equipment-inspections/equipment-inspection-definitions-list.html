<p-table
  [value]="data()"
  [loading]="loading()"
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="custom-table"
  #dt
>
  <ng-template #caption>
    <div class="flex flex-column gap-2 mb-2">
      <div>
        <div class="font-semibold text-lg">Inspecciones configuradas</div>
        <div class="text-sm text-600">{{ machineryName }}</div>
      </div>
      <primeng-custom-caption
        [dt]="dt"
        [rolAuth]="
          aspRoleS.hasAny([
            AspRole.JefeMantenimiento,
            AspRole.Administrador,
            AspRole.SuperUsuario,
          ])
        "
        (add)="onAddOrEdit()"
      />
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th>Frecuencia</th>
      <th class="text-center">Criterios</th>
      <th class="text-center">Responsables</th>
      <th class="text-center">Estado</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td>
        <div class="font-medium">{{ item.name }}</div>
        <div class="text-sm text-600">{{ item.machineryName }}</div>
      </td>
      <td>{{ recurrenceLabel(item) }}</td>
      <td class="text-center">{{ item.criteriaCount }}</td>
      <td class="text-center">{{ item.assigneesCount }}</td>
      <td class="text-center">
        <p-tag
          [value]="item.isActive ? 'Activa' : 'Inactiva'"
          [severity]="item.isActive ? 'success' : 'danger'"
        />
      </td>
      <td>
        <div
          class="flex justify-content-end gap-1"
          *ngIf="
            aspRoleS.hasAny([
              AspRole.JefeMantenimiento,
              AspRole.Administrador,
              AspRole.SuperUsuario,
            ])
          "
        >
          <custom-button-item
            iconClass="mdi:play-circle-outline"
            label="Iniciar"
            [showLabelOnDesktop]="true"
            (clicked)="onStartManual(item.id)"
          />
          <custom-button-item
            iconClass="mdi:power"
            [label]="item.isActive ? 'Desactivar' : 'Activar'"
            [showLabelOnDesktop]="true"
            (clicked)="onToggleActive(item)"
          />
          <custom-button-edit (clicked)="onAddOrEdit(item.id)" />
          <custom-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template emptymessage>
    <tr>
      <td colspan="6" class="text-center text-500 py-4">
        No hay definiciones de inspeccion registradas para este equipo.
      </td>
    </tr>
  </ng-template>
</p-table>
