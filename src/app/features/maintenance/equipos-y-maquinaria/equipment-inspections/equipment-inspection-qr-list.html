<p-table [value]="data()" [loading]="loading()" class="custom-table" #dt>
  <ng-template #caption>
    <div class="flex flex-column gap-2 mb-2">
      <div>
        <div class="font-semibold text-lg">Etiquetas QR</div>
        <div class="text-sm text-600">{{ machineryName }}</div>
      </div>
      <div
        class="flex justify-content-between align-items-center gap-2 flex-wrap"
      >
        <primeng-custom-caption [dt]="dt" (add)="onCreate()" />
        <iw-button-item
          iconClass="mdi:printer-outline"
          pTooltip="Imprimir activas"
          tooltipPosition="top"
          (clicked)="onPrintAll()"
        />
      </div>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th>Tipo</th>
      <th>Codigo</th>
      <th>Deep link</th>
      <th class="text-center">Estado</th>
      <th>Ultima impresion</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td>{{ item.name }}</td>
      <td>{{ item.qrTypeName }}</td>
      <td>{{ item.code }}</td>
      <td class="text-sm">{{ item.deepLink }}</td>
      <td class="text-center">
        <p-tag
          [value]="item.isActive ? 'Activa' : 'Inactiva'"
          [severity]="item.isActive ? 'success' : 'danger'"
        />
      </td>
      <td>{{ item.printedAt || "Sin impresion" }}</td>
      <td>
        <div class="flex justify-content-end gap-1">
          <iw-button-item
            iconClass="mdi:printer-outline"
            pTooltip="Imprimir"
            tooltipPosition="top"
            (clicked)="onPrint(item.id)"
          />
          <iw-button-item
            iconClass="mdi:refresh"
            pTooltip="Regenerar"
            tooltipPosition="top"
            (clicked)="onRegenerate(item.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template emptymessage>
    <tr>
      <td colspan="7" class="text-center text-500 py-4">
        No hay etiquetas QR registradas para este equipo.
      </td>
    </tr>
  </ng-template>
</p-table>
