<div class="card">
  <div class="card-body">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <custom-input-date-signal [control]="form.controls.date" label="Fecha" />
      <custom-input-time-signal [control]="form.controls.hour" label="Hora" />
      <custom-input-check-signal [control]="form.controls.labelPresent" label="Etiqueta Presente" />
      <custom-input-check-signal [control]="form.controls.glassIntact" label="Cristal del Gabinete Intacto" />
      <custom-input-check-signal [control]="form.controls.wrenchPresent" label="Llave de Maniobra Presente" />
      <custom-input-check-signal [control]="form.controls.hoseOk" label="Manguera en Buen Estado" />
      <custom-input-check-signal [control]="form.controls.nozzlePresent" label="Chiflón Presente" />
      <custom-input-check-signal [control]="form.controls.valveOperational" label="Válvula Operativa" />
      <custom-input-check-signal [control]="form.controls.lockOk" label="Cerradura Funcional" />
      <custom-input-select-signal
        [control]="form.controls.cabinetState"
        label="Estado del Gabinete"
        [data]="cb_cabinetState"
      />
      <custom-input-textarea-signal [control]="form.controls.observations" label="Observaciones" />
      <custom-button-save [propertyId]="id" [disabled]="form.invalid" [submitting]="submitting()" />
    </form>
  </div>
</div>
