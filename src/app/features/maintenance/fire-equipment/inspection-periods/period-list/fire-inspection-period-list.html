<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption
      [title]="'Periodos de Inspección é ' + typeLabel()"
      (add)="onModalForm({ id: '', title: 'Nuevo Periodo de Inspección' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="name">Nombre <p-sorticon field="name" /></th>
      <th class="table-col-15">Frecuencia</th>
      <th class="table-col-15">Inicio</th>
      <th class="table-col-10">Items</th>
      <th class="table-col-10">Activo</th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr class="cursor-pointer" (click)="onViewDetail(item.id)">
      <td>{{ item.name }}</td>
      <td>{{ item.frecuencia }}</td>
      <td>{{ item.startDate | date:'dd-MMM-yy' }}</td>
      <td class="text-center">{{ item.totalItems }}</td>
      <td class="text-center">
        <app-icon
          [icon]="item.isActive ? 'mdi:check' : 'mdi:close'"
          class="font-size-18"
          [class.text-green-600]="item.isActive"
          [class.text-red-600]="!item.isActive"
        />
      </td>
      <td class="no-print" (click)="$event.stopPropagation()">
        <div class="flex justify-content-center">
          <iw-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar Periodo' })"
          />
          <iw-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Periodo de Inspección' })"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item [noPadding]="true">
      <div
        start
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
        style="
          width: 38px;
          height: 38px;
          background: var(--ds-danger-light, #ffdad6);
        "
      >
        <app-icon
          icon="mdi:fire-alert"
          style="font-size: 1.1rem; color: var(--ds-danger)"
        />
      </div>
      
        <h3>{{ item.name }}</h3>
        <p>
          {{ item.frecuencia }} &bull; Inicio: {{ item.startDate |
          date:'dd-MMM-yy' }} &bull; Items: {{ item.totalItems }}
        </p>
      
      <div end>
        <ili-action-menu>
          <ng-container actions>
            <ili-button-edit
              (clicked)="onModalForm({ id: item.id, title: 'Editar Periodo' })"
              label="Editar"
            />
            <ili-button-delete
              (confirmed)="onDelete(item.id)"
              label="Eliminar"
            />
          </ng-container>
        </ili-action-menu>
      </div>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
