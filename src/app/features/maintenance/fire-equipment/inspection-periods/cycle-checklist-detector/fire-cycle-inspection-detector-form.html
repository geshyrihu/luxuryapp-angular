<div class="card">
  <div class="card-body">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <custom-input-check-signal [control]="form.controls.noObstructions" label="Sin Obstrucciones (50 cm)" />
      <custom-input-check-signal [control]="form.controls.noContamination" label="Sin Contaminación" />
      <custom-input-check-signal [control]="form.controls.noPhysicalDamage" label="Sin Daño Físico" />
      <custom-input-check-signal [control]="form.controls.ledStatusOk" label="Estado LED Ok" />
      <custom-input-check-signal [control]="form.controls.mountingSecure" label="Montaje Seguro" />
      <custom-input-textarea-signal [control]="form.controls.observations" label="Observaciones" />
      <il-button-save [submitting]="submitting()" />
    </form>
  </div>
</div>
