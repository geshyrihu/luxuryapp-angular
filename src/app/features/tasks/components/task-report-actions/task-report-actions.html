<div class="flex w-full" role="group" aria-label="Acciones de Reporte">
  <custom-button
    iconClass="mdi:eye-outline"
    label="Vista Previa"
    variant="outlined"
    customClass="w-full"
    (clicked)="onPreview()"
  />

  <custom-button
    iconClass="mdi:upload"
    label="Enviar Reporte"
    variant="outlined"
    customClass="w-full"
    (clicked)="onSendReport()"
  />
</div>
