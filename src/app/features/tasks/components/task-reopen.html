<div class="w-full">
  <div class="w-full">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <custom-input-textarea-signal
        [control]="form.controls.description"
        label="Descripción"
        placeholder="descripción"
        [rows]="3"
      />
      <div class="text-center mt-3">
        <custom-button-save [disabled]="form.invalid" [loading]="submitting()" />
      </div>
    </form>
  </div>
</div>
