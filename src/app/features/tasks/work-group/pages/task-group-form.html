<div class="w-full">
  <div class="w-full">
    <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
      <custom-input-text-signal
        [control]="form.controls.id"
        label="Id"
        placeholder="Id"
        [readonly]="true"
        [hidden]="false"
      />
      <custom-input-select-signal
        [control]="form.controls.TaskGroupCategoryId"
        label="Categoria"
        [data]="cb_TaskGroupCategory()"
      />

      <custom-input-select-signal
        [control]="form.controls.visibility"
        label="Privacidad"
        [data]="cb_visibility()"
      />

      <div class="text-center mt-3">
        <custom-button-save
          [propertyId]="id()"
          [disabled]="form.invalid"
          [loading]="submitting()"
        />
      </div>
    </form>
  </div>
</div>
