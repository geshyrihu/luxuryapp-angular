<form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="form">
  <custom-input-text-signal
    [control]="form.controls.id"
    [readonly]="true"
    label="Id"
    [hidden]="false"
  />
  <custom-input-select-signal
    [control]="form.controls.ticketGroupId"
    label="Grupo"
    [data]="cb_ticket_group()"
    (selectionChange)="onTicketGroupChange($event.value)"
  />

  @if (isLegalWorkGroup()) {
  <custom-input-autocomplete-signal
    (propagar)="saveLegalMatter($event)"
    [control]="form.controls.title"
    [data]="cb_legal_matter()"
    label="Asunto legal"
    placeholder="Escribe para buscar asunto"
  />
  } @else {
  <custom-input-text-signal
    [control]="form.controls.title"
    label="Area"
    placeholder="area"
  />
  }

  <custom-input-textarea-signal
    [control]="form.controls.description"
    label="Descripción"
    placeholder="descripción"
  />

  <custom-input-select-signal
    [control]="form.controls.priority"
    label="Prioridad"
    [data]="cb_priority()"
  />

  <!-- programar -->
  <custom-input-date-signal
    [control]="form.controls.scheduledDate"
    label="Fecha de programación"
    placeholder="fecha"
  />

  <!-- Responsable -->
  <custom-input-autocomplete-signal
    (propagar)="saveUserId($event)"
    [control]="form.controls.assignee"
    [data]="cb_application_user()"
    label="Asignar"
    placeholder="Escribe para buscar colaborador"
  />

  <!-- Este es por si es ticket concluido -->
  <custom-input-date-signal
    [control]="form.controls.closedDate"
    label="Fecha de término"
    placeholder="Esta fecha se coloca cuando ya se término el ticket"
  />

  @if (isLegalWorkGroup()) {
  <div class="border-round border-1 border-orange-200 bg-orange-50 p-3 mb-3">
    <div class="text-xs font-bold text-orange-700 uppercase mb-2">Campos legales</div>
    <div class="flex flex-wrap gap-4">
      <custom-input-check-signal
        [control]="form.controls.isInternal"
        label=""
        placeholder="Solicitud interna"
      />
      <custom-input-check-signal
        [control]="form.controls.documentCloud"
        label=""
        placeholder="Documentación en la nube"
      />
      <custom-input-check-signal
        [control]="form.controls.documentEmail"
        label=""
        placeholder="Documentación por email"
      />
    </div>
  </div>
  }

  <div class="grid">
    <div class="col-12 md:col-6">
      <div class="mb-4">
        <p-fileUpload
          mode="basic"
          name="beforeWork"
          (onSelect)="onFileChange($event.files[0], 'beforeWork')"
          accept="image/*"
          [maxFileSize]="10000000"
          chooseLabel="Seleccionar foto del antes"
          styleClass="w-full"
          chooseStyleClass="w-full"
          [auto]="true"
          fluid
          [showUploadButton]="false"
        ></p-fileUpload>
        @if (beforeWorkPreview()) {
        <div class="mt-3">
          <img
            [src]="beforeWorkPreview()"
            class="border-round w-12rem h-auto shadow-1"
            alt="Before Work Image Preview"
          />
        </div>
        }
      </div>
    </div>

    <div class="col-12 md:col-6">
      <div class="mb-4">
        <p-fileUpload
          mode="basic"
          name="afterWork"
          (onSelect)="onFileChange($event.files[0], 'afterWork')"
          accept="image/*"
          [maxFileSize]="10000000"
          chooseLabel="Seleccionar foto del despues"
          styleClass="w-full"
          chooseStyleClass="w-full"
          [auto]="true"
          fluid
          [showUploadButton]="false"
        ></p-fileUpload>
        @if (afterWorkPreview()) {
        <div class="mt-3">
          <img
            [src]="afterWorkPreview()"
            class="border-round w-12rem h-auto shadow-1"
            alt="After Work Image Preview"
          />
        </div>
        }
      </div>
    </div>
  </div>
  <div class="flex justify-content-end mt-2 gap-2">
    <custom-button
      [variant]="'outlined'"
      label="Seguimientos"
      iconClass="pi pi-comments"
      (clicked)="openFollowUp()"
    />
    <custom-button-save
      [propertyId]="id"
      [disabled]="form.invalid"
      [submitting]="submitting()"
    />
  </div>
</form>
