<!-- Contenido visible solo en pantallas medianas y grandes -->
<p-table
  [value]="dataSignal()"
  #dt
  styleClass="custom-table hidden md:block"
  [globalFilterFields]="globalFilterFields()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
>
  <ng-template #caption>
    <primeng-custom-caption
      [title]="'Categorias de grupos'"
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="code">
        Codigo
        <p-sortIcon field="code" />
      </th>
      <th pSortableColumn="emoji">
        Icono
        <p-sortIcon field="emoji" />
      </th>
      <th pSortableColumn="color">
        Color
        <p-sortIcon field="color" />
      </th>
      <th pSortableColumn="departament">
        Departamento
        <p-sortIcon field="departament" />
      </th>
      <th pSortableColumn="name">
        Nombre
        <p-sortIcon field="name" />
      </th>
      <th pSortableColumn="description">
        Descripcion
        <p-sortIcon field="description" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td>{{ item.code }}</td>
      <td class="text-xl">
        <i [class]="getCategoryIconClass(item.emoji)"></i>
      </td>
      <td>
        <div
          class="w-8 h-8 border-round-md"
          [style.backgroundColor]="item.color"
        ></div>
      </td>
      <td>{{ item.departament }}</td>
      <td>{{ item.name }}</td>
      <td>{{ item.description }}</td>
      <td class="no-print">
        <div class="flex">
          <custom-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <custom-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>

<!-- Componente adaptado para version movil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full">
      <ion-label>
        <div class="flex align-items-center">
          <i [class]="getCategoryIconClass(item.emoji)" class="text-xl"></i>
          <div class="ml-2">
            <h2>{{ item.name }}</h2>
            <p>{{ item.code }} | {{ item.departament | uppercase }}</p>
          </div>
        </div>
      </ion-label>
      <div slot="end">
        <div
          class="w-6 h-6 border-round-md flex-shrink-0"
          [style.backgroundColor]="item.color"
        ></div>
        <app-action-menu>
          <ion-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <ion-button-delete (confirmed)="onDelete(item.id)" />
        </app-action-menu>
      </div>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
