<!-- ??? INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<p-table
  #dt
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  class="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption [showAdd]="false" [dt]="dt" />
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="applicationUser">
        Usuario
        <p-sorticon field="applicationUser" />
      </th>
      <th pSortableColumn="email">
        Email
        <p-sorticon field="email" />
      </th>
      <th pSortableColumn="smtp">
        Smtp
        <p-sorticon field="smtp" />
      </th>
      <th pSortableColumn="port">
        Port
        <p-sorticon field="port" />
      </th>

      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.applicationUser }}</td>
      <td>{{ item.email }}</td>
      <td>{{ item.smtp }}</td>
      <td>{{ item.port }}</td>

      <!-- Opciones -->

      <td class="no-print">
        <div class="flex">
          <iw-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <iw-button-delete (confirmed)="onDelete(item.id)" />
          <iw-button-send-email (confirmed)="onSendTestEmail(item.id)" />
        </div>
      </td>

      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="5" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- ?? INICIO: Componente adaptado para versión mívil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item>
      <div
        start
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
        style="
          width: 38px;
          height: 38px;
          background: var(--ds-primary-50, #edf1ff);
        "
      >
        <app-icon
          icon="mdi:email-outline"
          style="font-size: 1.1rem; color: var(--ds-primary)"
        />
      </div>
      <p class="mt-0 mb-0">{{ item.email }}</p>
      <p class="text-color-secondary font-size-12 mt-0 mb-0">
        {{ item.applicationUser }}
      </p>

      <ili-action-menu end>
        <ng-container actions>
          <ili-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
          <ili-button-send-email
            (confirmed)="onSendTestEmail(item.id)"
            label="Enviar"
          />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
