<!-- ??? INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->

<p-table
  [value]="data()"
  [lazy]="true"
  (onLazyLoad)="loadData($event)"
  [paginator]="true"
  [rows]="rows"
  [totalRecords]="totalRecords()"
  [loading]="loading()"
  [rowsPerPageOptions]="rowsPerPage"
  [tableStyle]="{ 'min-width': '50rem' }"
  #dt
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption (add)="onModalForm()" [dt]="dt" />
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="Platform.Name">
        Plataforma
        <p-sorticon field="Platform.Name" />
      </th>
      <th pSortableColumn="Username">
        Usuario
        <p-sorticon field="Username" />
      </th>
      <th pSortableColumn="Password">
        Contraseóa
        <p-sorticon field="Password" />
      </th>
      <th pSortableColumn="SubscriptionExpirationDate">
        Expiración
        <p-sorticon field="SubscriptionExpirationDate" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.platformName }}</td>
      <td>{{ item.username }}</td>
      <td>{{ item.password }}</td>
      <td>
        {{ item.subscriptionExpirationDate | date: 'dd/MM/yyyy' : 'UTC' }}
      </td>
      <!-- Opciones -->
      <td class="no-print">
        <div class="flex">
          <iw-button-edit (clicked)="onModalForm(item.id)" />
          <iw-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="5" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="data()" />
  </ng-template>
</p-table>

<!-- ?? INICIO: Componente adaptado para versión mívil -->

<app-data-view-mobile [data]="data()" (add)="onModalForm()" [dt]="dt">
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" class="ion-no-padding">
      <div
        slot="start"
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
        style="
          width: 38px;
          height: 38px;
          background: var(--ds-warning-light, #fef3c7);
        "
      >
        <app-icon
          icon="mdi:key-outline"
          style="font-size: 1.1rem; color: var(--ds-warning)"
        />
      </div>
      <ion-label>
        <div class="flex flex-column font-bold">
          <span class="text-primary">{{ item.platformName }}</span>
          <span class="text-sm text-wrap text-600">{{ item.username }}</span>
        </div>
      </ion-label>
      <div slot="end">
        <ili-action-menu>
          <ng-container actions>
            <ili-button-edit (clicked)="onModalForm(item.id)" label="Editar" />
            <ili-button-delete
              (confirmed)="onDelete(item.id)"
              label="Eliminar"
            />
          </ng-container>
        </ili-action-menu>
      </div>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
