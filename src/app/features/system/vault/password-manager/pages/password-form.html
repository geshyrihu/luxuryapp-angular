<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="grid">
    <!-- Plataforma (texto libre) -->
    <div>
      <custom-input-text-signal
        label="Plataforma"
        placeholder="Ej. Netflix, Spotify, AWS..."
        [control]="form.controls.platformName"
        [required]="true"
      />
    </div>

    <!-- Usuario -->
    <div>
      <custom-input-text-signal
        label="Usuario / Correo"
        placeholder="Ej. usuario@ejemplo.com"
        [control]="form.controls.username"
        [required]="true"
      />
    </div>

    <!-- Contraseña -->
    <div>
      <custom-input-password-signal
        label="Contraseña"
        placeholder="Ingrese la contraseña"
        [control]="form.controls.password"
        [required]="true"
      />
    </div>

    <!-- Fecha de Expiración -->
    <div>
      <custom-input-date-signal
        label="Expiración de suscripción"
        placeholder="Seleccione fecha (opcional)"
        [control]="form.controls.subscriptionExpirationDate"
      />
    </div>
  </div>

  <!-- Botones de Acción -->
  <div class="flex justify-content-end mt-4">
    @if (!isMobile()) {
    <il-button-save [submitting]="submitting()" />
    } @else {
    <il-button-save [submitting]="submitting()" />
    }
  </div>
</form>
