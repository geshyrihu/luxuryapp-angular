<!-- ??? INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->

<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="card hidden md:block custom-table"
  size="small"
  [scrollable]="true"
  scrollHeight="750px"
  [virtualScrollItemSize]="tablePrimeNgRows"
  [loading]="loading()"
>
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: 0, title: 'Nuevo Conocimiento' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="topic" style="min-width: 15rem">
        Tema <p-sorticon field="topic" />
      </th>
      <th pSortableColumn="moduleAppName">
        Acceso <p-sorticon field="moduleAppName" />
      </th>
      <th pSortableColumn="keywords">
        Palabras Clave <p-sorticon field="keywords" />
      </th>
      <th pSortableColumn="route">Ruta <p-sorticon field="route" /></th>
      <th pSortableColumn="isActive">Activo <p-sorticon field="isActive" /></th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.topic }}</td>
      <td>
        <span
          class="p-tag"
          [ngClass]="{'green-100 text-green-700': !item.moduleAppId, 'orange-100 text-orange-700': item.moduleAppId}"
        >
          {{ item.moduleAppName || 'General' }}
        </span>
      </td>
      <td><span class="p-tag p-tag-info">{{ item.keywords }}</span></td>
      <td><code>{{ item.route }}</code></td>
      <td>
        <app-icon
          [icon]="item.isActive ? 'mdi:check-circle' : 'mdi:close-circle'"
          [class]="item.isActive ? 'text-green-500' : 'text-red-500'"
        />
      </td>

      <!-- Opciones -->
      <td class="no-print">
        <div class="flex">
          <iw-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar Conocimiento' })"
          />
          <iw-button-delete (confirmed)="onDelete(item.id!)" />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="6" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- ?? INICIO: Componente adaptado para versión mívil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: 0, title: 'Nuevo Conocimiento' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" class="ion-no-padding">
      <div
        slot="start"
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
        style="
          width: 38px;
          height: 38px;
          background: var(--ds-primary-50, #edf1ff);
        "
      >
        <app-icon
          icon="mdi:brain"
          style="font-size: 1.1rem; color: var(--ds-primary)"
        />
      </div>
      <ion-label>
        <h2 class="font-bold">{{ item.topic }}</h2>
        <p class="text-sm">
          <span class="font-bold text-primary"
            >{{ item.moduleAppName || 'General' }}</span
          >
        </p>
        <p class="text-sm text-wrap text-500">{{ item.keywords }}</p>
      </ion-label>
      <div slot="end">
        <ili-action-menu>
          <ng-container actions>
            <ili-button-edit
              (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
              label="Editar"
            />
            <ili-button-delete
              (confirmed)="onDelete(item.id!)"
              label="Eliminar"
            />
          </ng-container>
        </ili-action-menu>
      </div>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
