<!-- ??? INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption
      [title]="'Usos de CFDI'"
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th class="text-small" pSortableColumn="codigo">
        C�digo
        <p-sortIcon field="codigo" />
      </th>
      <th class="text-small" pSortableColumn="descripcion">
        Descripci�n
        <p-sortIcon field="descripcion" />
      </th>

      <th class="table-col-5 text-small"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <small>{{ item.codigo }}</small>
      </td>
      <td>
        <small>{{ item.descripcion }}</small>
      </td>

      <td class="no-print">
        <div class="flex">
          <iw-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <iw-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="3">
        <app-empty-state
          icon="mdi:receipt-text-outline"
          title="Sin usos CFDI"
          message="No hay usos de CFDI registrados."
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- ?? INICIO: Componente adaptado para versi�n m�vil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" detail="false" class="ion-no-padding">
      <div
        slot="start"
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
        style="
          width: 38px;
          height: 38px;
          background: var(--ds-primary-50, #edf1ff);
        "
      >
        <app-icon
          icon="mdi:receipt-text-outline"
          style="font-size: 1.1rem; color: var(--ds-primary)"
        ></app-icon>
      </div>

      <!-- Jerarqu�a Visual -->
      <ion-label class="ion-text-wrap">
        <h3 class="font-semibold m-0 text-color">{{ item.codigo }}</h3>
        <p class="text-xs m-0 mt-1 text-color-secondary">
          {{ item.descripcion }}
        </p>
      </ion-label>

      <app-action-menu slot="end">
        <ng-container actions>
          <il-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          <il-button-delete
            (confirmed)="onDelete(item.id)"
            label="Eliminar"
          />
        </ng-container>
      </app-action-menu>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
