<!-- ??? INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->

<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [tableStyle]="{ 'min-width': '50rem' }"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  class="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="code">
        Codigo
        <p-sorticon field="code" />
      </th>
      <th pSortableColumn="shortName">
        Nombre
        <p-sorticon field="shortName" />
      </th>
      <th pSortableColumn="largeName">
        Razón social
        <p-sorticon field="largeName" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.code }}</td>
      <td>{{ item.shortName }}</td>
      <td>{{ item.largeName }}</td>
      <!-- Opciones -->
      <td class="no-print">
        <div class="flex gap-1">
          <iw-button-edit
            size="sm"
            class="btn--circle"
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <iw-button-delete
            size="sm"
            class="btn--circle"
            (confirmed)="onDelete(item.id)"
          />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="4" />
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- ?? INICIO: Componente adaptado para versión mívil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ili-list-item lines="full" detail="false" class="ion-no-padding" [noPadding]="true">
      <div
        slot="start"
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
        style="
          width: 38px;
          height: 38px;
          background: var(--ds-primary-50, #edf1ff);
        "
      >
        <app-icon
          icon="mdi:bank-outline"
          style="font-size: 1.25rem; color: var(--ds-primary)"
        />
      </div>

      <div class="ion-text-wrap">
        <h3 class="font-semibold m-0 text-color">{{ item.shortName }}</h3>
        <p class="text-xs m-0 mt-1 text-color-secondary">
          {{ item.code }} - {{ item.largeName }}
        </p>
      </div>

      <ili-action-menu slot="end">
        <ng-container actions>
          <ili-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
            label="Editar"
          />
          <ili-button-delete (confirmed)="onDelete(item.id)" label="Eliminar" />
        </ng-container>
      </ili-action-menu>
    </ili-list-item>
  </ng-template>
</app-data-view-mobile>
