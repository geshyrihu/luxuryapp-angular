<!-- 🖥️ INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->

<p-table
  [globalFilterFields]="globalFilterFields()"
  [value]="dataSignal()"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  #dt
  styleClass="card hidden md:block custom-table"
  [rowGroupMode]="'subheader'"
  groupRowsBy="roleTypeOrder"
  sortField="roleTypeOrder"
  sortMode="single"
>
  <ng-template #caption>
    <primeng-custom-caption
      title="Roles de Aplicación"
      (add)="onModalForm({ id: '', title: 'Nuevo Rol' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="sortOrder" style="width: 8%">
        Orden <p-sortIcon field="sortOrder" />
      </th>
      <th pSortableColumn="name" style="width: 20%">
        Nombre Interno <p-sortIcon field="name" />
      </th>
      <th pSortableColumn="displayName" style="width: 25%">
        Nombre para Mostrar <p-sortIcon field="displayName" />
      </th>
      <th pSortableColumn="departament" style="width: 15%">
        Departamento <p-sortIcon field="departament" />
      </th>
      <th pSortableColumn="isActive" style="width: 10%">
        Activo <p-sortIcon field="isActive" />
      </th>
      <th style="width: 22%">Acciones</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="groupheader" let-item>
    <tr class="p-rowgroup-header">
      <td colspan="6">
        <span class="font-bold">{{ item.roleType }}</span>
      </td>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.sortOrder }}</td>
      <td>{{ item.name }}</td>
      <td>{{ item.displayName }}</td>
      <td>{{ item.departament }}</td>
      <td class="text-center">
        <p-checkbox
          [binary]="true"
          [readonly]="true"
          [ngModel]="item.isActive"
        ></p-checkbox>
      </td>
      <td class="no-print">
        <div class="flex">
          <custom-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar Rol' })"
          />
          <custom-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>

<!-- 📱 INICIO: Componente adaptado para versión móvil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Rol' })"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" detail="false" class="ion-no-padding">
      <ion-label>
        <h2 class="font-bold m-0">{{ item.displayName || item.name }}</h2>
        <p class="text-sm text-500 m-0">
          {{ item.roleType }} - {{ item.departament }}
        </p>
        <p class="text-xs text-400 m-0">Orden: {{ item.sortOrder }}</p>
      </ion-label>
      <app-action-menu slot="end">
        <ng-container actions>
          <ion-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar Rol' })"
          />
          <ion-button-delete (confirmed)="onDelete(item.id)" />
        </ng-container>
      </app-action-menu>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
