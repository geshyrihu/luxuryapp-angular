<p-table
  [globalFilterFields]="globalFilterFields()"
  [value]="dataSignal()"
  #dt
  styleClass="custom-table card hidden md:block"
>
  <!-- styleClass="p-datatable-sm" -->
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th colspan="2" pSortableColumn="nameComercial">
        Proveedor
        <p-sortIcon field="nameComercial" />
      </th>
      <th pSortableColumn="service">
        Servicio
        <p-sortIcon field="service" />
      </th>
      <th class="no-print"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <p-avatar
          [image]="item.pathPhoto"
          alt="noImg"
          shape="square"
          size="large"
          styleClass="b-r-8 img-70"
        />
      </td>
      <td>
        <h4 class="m-0 h4">{{ item.nameComercial }}</h4>
        <p>{{ item.nameProvider }}</p>
      </td>
      <td>{{ item.service }}</td>
      <!-- Opciones -->
      <td class="no-print">
        <app-action-menu>
          <ng-container actions>
            <custom-button-edit
              (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
              label="Editar"
              [showLabelOnDesktop]="true"
            />
            <custom-button-delete
              (confirmed)="onDelete(item.id)"
              label="Eliminar"
              [showLabelOnDesktop]="true"
            />
          </ng-container>
        </app-action-menu>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="3">
        <app-empty-state
          icon="mdi:store-outline"
          title="Sin proveedores"
          message="No hay proveedores registrados."
        />
      </td>
    </tr>
  </ng-template>
</p-table>
<app-data-view-mobile
  [data]="dataSignal()"
  [globalFilterFields]="globalFilterFields()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" detail="false" class="ion-no-padding">
      <div
        slot="start"
        class="w-3rem h-3rem border-round-md bg-green-50 flex align-items-center justify-content-center flex-shrink-0 ml-3"
      >
        <app-icon
          icon="mdi:store-outline"
          style="font-size: 20px; color: var(--ds-success)"
        ></app-icon>
      </div>
      <ion-label>
        <h3>{{ item.nameComercial }}</h3>
        <p>{{ item.service }}</p>
      </ion-label>
      <app-action-menu slot="end">
        <custom-button-edit
          (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          label="Editar"
          [showLabelOnDesktop]="true"
        />
        <custom-button-delete
          (confirmed)="onDelete(item.id)"
          label="Eliminar"
          [showLabelOnDesktop]="true"
        />
      </app-action-menu>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
