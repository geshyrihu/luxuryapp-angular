<!-- 🖥️ INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
      [dt]="dt"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="folioId">
        Folio
        <p-sortIcon field="folioId" />
      </th>
      <th pSortableColumn="responsibleArea">
        Departamento
        <p-sortIcon field="responsibleArea" />
      </th>
      <th pSortableColumn="grupo">
        Grupo
        <p-sortIcon field="grupo" />
      </th>
      <th pSortableColumn="descripcion">
        Descripción
        <p-sortIcon field="descripcion" />
      </th>
      <th class="table-col-5"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <small> {{ item.folioId }} </small>
      </td>
      <td>
        <small> {{ item.departamento }} </small>
      </td>
      <td>
        <small> {{ item.grupo }} </small>
      </td>
      <td>
        <small> {{ item.descripcion }} </small>
      </td>
      <!-- Opciones -->
      <td class="no-print">
        <div class="flex">
          <custom-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <custom-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
      <!-- Opciones -->
    </tr>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- 📱 INICIO: Componente adaptado para versión móvil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" class="ion-no-padding" detail="false">
      <ion-label>
        <h2 class="font-normal m-0">{{ item.departamento }}</h2>
        <p class="text-medium text-500 m-0">
          {{ item.folioId }} | {{ item.grupo }}
        </p>
      </ion-label>
      <app-action-menu slot="end">
        <ng-container actions>
          <custom-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <custom-button-delete (confirmed)="onDelete(item.id)" />
        </ng-container>
      </app-action-menu>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
