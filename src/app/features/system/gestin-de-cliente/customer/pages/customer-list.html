<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <div class="flex flex-column md:flex-row md:align-items-center justify-content-end p-2 gap-2">
      <primeng-custom-caption
        (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
        [dt]="dt"
        [noPadding]="true"
        [noMargin]="true"
      />
      <div class="flex-shrink-0" style="width: 160px">
        <custom-button-active-desactive
          [state]="state"
          (stateChange)="onSortChange($event)"
        />
      </div>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th>ID</th>
      <th>NO CLIENTE</th>
      <th colspan="2" pSortableColumn="nameCustomer">
        NOMBRE
        <p-sortIcon field="nameCustomer" />
      </th>
      <th>TÉLEFONOS</th>
      <th class="table-col-10"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item let-rowIndex="rowIndex">
    <tr>
      <td>{{ item.id }}</td>
      <td class="text-center">{{ item.numeroCliente }}</td>
      <td class="text-center">
        <p-avatar
          [image]="item.photoPath"
          alt=""
          shape="square"
          styleClass="b-r-8 img-40"
        />
      </td>
      <td>{{ item.nameCustomer }}</td>
      <td>
        {{ item.phoneOne }}
        <br />
        {{ item.phoneTwo }}
      </td>

      <td class="no-print">
        <div class="flex">
          <custom-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <custom-button-item
            label="Imagenes"
            iconClass="mdi:image"
            (clicked)="onUpdateImages(item.id)"
          />
          <custom-button-item
            label="Dirección"
            iconClass="mdi:map-marker"
            (clicked)="onUpdateAddress(item.id)"
          />
          <custom-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- 📱 INICIO: Componente adaptado para versión móvil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <div customFilters>
    <div class="mb-3 flex mt-1 mb-1">
      <div class="m-0">
        <custom-button-active-desactive
          fluid
          [state]="state"
          (stateChange)="onSortChange($event)"
        />
      </div>
    </div>
  </div>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" class="ion-no-padding">
      <ion-avatar slot="start">
        <img [src]="item.photoPath" alt="Customer Photo" />
      </ion-avatar>
      <ion-label>
        <h2 class="font-normal m-0">{{ item.nameCustomer }}</h2>
        <p class="text-medium text-500 m-0">
          {{ item.phoneOne }} - {{ item.phoneTwo }}
        </p>
      </ion-label>
      <div slot="end">
        <app-action-menu>
          <custom-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <custom-button-item
            iconName="image-outline"
            label="Imógenes"
            (clicked)="onUpdateImages(item.id)"
          />
          <custom-button-item
            iconName="location-outline"
            label="Dirección"
            (clicked)="onUpdateAddress(item.id)"
          />
          <custom-button-delete (confirmed)="onDelete(item.id)" />
        </app-action-menu>
      </div>
    </ion-item>
  </ng-template>
</app-data-view-mobile>

<style>
  .img-40 {
    width: auto !important;
    height: 40px !important;
    min-width: 40px;
    max-width: 80px;
    object-fit: contain !important;
    background-color: var(--ds-bg-sunken, #f8fafc);
    border-radius: 8px;
  }
  ion-avatar {
    width: auto !important;
    height: 40px !important;
    max-width: 80px;
    border-radius: 4px;
    overflow: hidden;
  }
  ion-avatar img {
    width: auto !important;
    height: 100% !important;
    object-fit: contain !important;
    background-color: var(--ds-bg-sunken, #f8fafc);
  }
</style>
