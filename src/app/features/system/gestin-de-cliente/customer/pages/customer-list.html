<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [scrollable]="true"
  [scrollHeight]="scrollHeight()"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="custom-table card hidden md:block"
>
  <ng-template #caption>
    <div
      class="flex flex-column md:flex-row md:align-items-center justify-content-end p-2 gap-2"
    >
      <primeng-custom-caption
        (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
        [dt]="dt"
        [noPadding]="true"
        [noMargin]="true"
      />
      <div class="flex-shrink-0" style="width: 160px">
        <custom-button-active-desactive
          [state]="state"
          (stateChange)="onSortChange($event)"
        />
      </div>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th>ID</th>
      <th>NO CLIENTE</th>
      <th colspan="2" pSortableColumn="nameCustomer">
        NOMBRE
        <p-sortIcon field="nameCustomer" />
      </th>
      <th>TÉLEFONOS</th>
      <th class="table-col-10"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item let-rowIndex="rowIndex">
    <tr>
      <td>{{ item.id }}</td>
      <td class="text-center">{{ item.numeroCliente }}</td>
      <td class="text-center">
        <p-avatar
          [image]="item.photoPath"
          alt=""
          shape="square"
          styleClass="b-r-8 img-40"
        />
      </td>
      <td>{{ item.nameCustomer }}</td>
      <td>
        {{ item.phoneOne }}
        <br />
        {{ item.phoneTwo }}
      </td>

      <td class="no-print">
        <div class="flex">
          <custom-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
          />
          <custom-button-item
            label="Imagenes"
            iconClass="mdi:image"
            (clicked)="onUpdateImages(item.id)"
          />
          <custom-button-item
            label="Dirección"
            iconClass="mdi:map-marker"
            (clicked)="onUpdateAddress(item.id)"
          />
          <custom-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="5">
        <app-empty-state
          icon="mdi:domain"
          title="Sin clientes"
          message="No hay clientes registrados."
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
</p-table>

<!-- 📱 INICIO: Componente adaptado para versión móvil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nuevo Registro' })"
  [globalFilterFields]="globalFilterFields()"
  [dt]="dt"
>
  <div customFilters>
    <div class="mb-3 flex mt-1 mb-1">
      <div class="m-0">
        <custom-button-active-desactive
          fluid
          [state]="state"
          (stateChange)="onSortChange($event)"
        />
      </div>
    </div>
  </div>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" detail="false" class="ion-no-padding">
      <!-- Logo / avatar del cliente -->
      <div slot="start" class="customer-logo-slot">
        @if (item.photoPath) {
        <img
          [src]="item.photoPath"
          [alt]="item.nameCustomer"
          class="customer-logo-img"
        />
        } @else {
        <app-icon
          icon="mdi:domain"
          class="text-xl"
          style="color: var(--ds-primary)"
        ></app-icon>
        }
      </div>

      <ion-label class="ion-text-wrap">
        <h3 class="font-semibold m-0 text-color">{{ item.nameCustomer }}</h3>
        <p class="text-xs m-0 mt-1 text-color-secondary">
          {{ item.phoneOne }}{{ item.phoneTwo ? ' · ' + item.phoneTwo : '' }}
        </p>
      </ion-label>

      <app-action-menu slot="end">
        <ng-container actions>
          <custom-button-edit
            (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
            label="Editar"
            [showLabelOnDesktop]="true"
          />
          <custom-button-item
            iconClass="mdi:image-multiple-outline"
            ionicIcon="image-outline"
            label="Imágenes"
            (clicked)="onUpdateImages(item.id)"
            [showLabelOnDesktop]="true"
          />
          <custom-button-item
            iconClass="mdi:map-marker-outline"
            ionicIcon="location-outline"
            label="Dirección"
            (clicked)="onUpdateAddress(item.id)"
            [showLabelOnDesktop]="true"
          />
          <custom-button-delete
            (confirmed)="onDelete(item.id)"
            label="Eliminar"
            [showLabelOnDesktop]="true"
          />
        </ng-container>
      </app-action-menu>
    </ion-item>
  </ng-template>
</app-data-view-mobile>

<style>
  .customer-logo-slot {
    width: 48px;
    height: 40px;
    margin: 0 10px 0 16px;
    border-radius: var(--ds-radius-sm, 6px);
    overflow: hidden;
    background: var(--ds-bg-sunken, #e8edff);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .customer-logo-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
</style>
