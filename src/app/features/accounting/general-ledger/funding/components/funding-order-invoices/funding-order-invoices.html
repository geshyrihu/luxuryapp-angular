<p-table [value]="invoices()" styleClass="border custom-table">
  <ng-template #header>
    <tr>
      <th>Folio</th>
      <th>Factura</th>
      <th class="text-center"></th>
    </tr>
  </ng-template>
  <ng-template #body let-invoice>
    <tr>
      <td>{{ invoice.folioFiscal }}</td>
      <td>{{ invoice.factura }}</td>
      <td class="text-center">
        <il-button-item
          iconClass="mdi:file-pdf-box"
          label="Ver PDF"
          (clicked)="viewPdf(invoice.pdfFile, 'Factura')"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="3" />
  </ng-template>
</p-table>
