<!-- ??? INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="card hidden md:block custom-table"
  size="small"
  [scrollable]="true"
  scrollHeight="750px"
  [virtualScrollItemSize]="tablePrimeNgRows"
>
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nueva Configuración' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="customerName">
        Cliente <p-sorticon field="customerName"></p-sorticon>
      </th>
      <th pSortableColumn="empresa">
        Empresa <p-sorticon field="empresa"></p-sorticon>
      </th>
      <th pSortableColumn="customerIdAspelId">
        ID Aspel <p-sorticon field="customerIdAspelId"></p-sorticon>
      </th>
      <th class="table-col-10">Opciones</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.customerName }}</td>
      <td>
        <app-status-badge
          [status]="item.empresa"
          [isEmpresa]="true"
          [clickable]="false"
        />
      </td>
      <td>{{ item.customerIdAspelId }}</td>
      <td class="text-center">
        <div class="flex justify-content-center">
          <iw-button-edit (clicked)="onModalForm(item)" />
          <iw-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
  <ng-template #emptymessage>
    <primeng-custom-table-emptymessage [colspan]="4" />
  </ng-template>
</p-table>

<!-- ?? INICIO: Componente adaptado para versión mívil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nueva Configuración' })"
  [globalFilterFields]="['customerName', 'empresa', 'customerIdAspelId']"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" class="ion-no-padding">
      <div
        slot="start"
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
        style="
          width: 38px;
          height: 38px;
          background: var(--ds-primary-50, #edf1ff);
        "
      >
        <app-icon
          icon="mdi:domain"
          style="font-size: 1.1rem; color: var(--ds-primary)"
        />
      </div>
      <ion-label>
        <h2>{{ item.customerName }}</h2>
        <div class="flex align-items-center gap-2 mt-1">
          <app-status-badge
            [status]="item.empresa"
            [isEmpresa]="true"
            [clickable]="false"
          />
          <span class="text-sm text-500"
            >- ID Aspel: {{ item.customerIdAspelId }}</span
          >
        </div>
      </ion-label>
      <div slot="end">
        <ili-action-menu>
          <ng-container actions>
            <ili-button-edit (clicked)="onModalForm(item)" label="Editar" />
            <ili-button-delete (clicked)="onDelete(item.id)" label="Eliminar" />
          </ng-container>
        </ili-action-menu>
      </div>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
