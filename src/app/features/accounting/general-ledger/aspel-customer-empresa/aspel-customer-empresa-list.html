<!-- ??? INICIO: Contenido visible solo en pantallas medianas y grandes (md en adelante) -->
<p-table
  [globalFilterFields]="globalFilterFields()"
  [paginator]="true"
  [rows]="tablePrimeNgRows"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [value]="dataSignal()"
  #dt
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  styleClass="card hidden md:block custom-table"
  size="small"
  [scrollable]="true"
  scrollHeight="750px"
  [virtualScrollItemSize]="tablePrimeNgRows"
>
  <ng-template #caption>
    <primeng-custom-caption
      (add)="onModalForm({ id: '', title: 'Nueva Configuración' })"
      [dt]="dt"
    />
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="customerName">
        Cliente <p-sortIcon field="customerName"></p-sortIcon>
      </th>
      <th pSortableColumn="empresa">
        Empresa <p-sortIcon field="empresa"></p-sortIcon>
      </th>
      <th pSortableColumn="customerIdAspelId">
        ID Aspel <p-sortIcon field="customerIdAspelId"></p-sortIcon>
      </th>
      <th class="table-col-10">Opciones</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.customerName }}</td>
      <td>
        <app-status-badge
          [status]="item.empresa"
          [isEmpresa]="true"
          [clickable]="false"
        />
      </td>
      <td>{{ item.customerIdAspelId }}</td>
      <td class="text-center">
        <div class="flex justify-content-center">
          <il-button-edit (clicked)="onModalForm(item)" />
          <il-button-delete (confirmed)="onDelete(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #paginatorleft>
    <primeng-custom-table-footer [data]="dataSignal()" />
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="4">
        <app-empty-state
          icon="mdi:domain"
          title="Sin configuraciones"
          message="No hay configuraciones cliente-empresa registradas."
        />
      </td>
    </tr>
  </ng-template>
</p-table>

<!-- ?? INICIO: Componente adaptado para versión mívil -->
<app-data-view-mobile
  [data]="dataSignal()"
  (add)="onModalForm({ id: '', title: 'Nueva Configuración' })"
  [globalFilterFields]="['customerName', 'empresa', 'customerIdAspelId']"
  [dt]="dt"
>
  <ng-template #listItemTemplate let-item>
    <ion-item lines="full" class="ion-no-padding">
      <div
        slot="start"
        class="flex align-items-center justify-content-center flex-shrink-0 ml-3 mr-2 border-round-lg"
        style="
          width: 38px;
          height: 38px;
          background: var(--ds-primary-50, #edf1ff);
        "
      >
        <app-icon
          icon="mdi:domain"
          style="font-size: 1.1rem; color: var(--ds-primary)"
        ></app-icon>
      </div>
      <ion-label>
        <h2>{{ item.customerName }}</h2>
        <div class="flex align-items-center gap-2 mt-1">
          <app-status-badge
            [status]="item.empresa"
            [isEmpresa]="true"
            [clickable]="false"
          />
          <span class="text-sm text-500"
            >- ID Aspel: {{ item.customerIdAspelId }}</span
          >
        </div>
      </ion-label>
      <div slot="end">
        <app-action-menu>
          <ng-container actions>
            <il-button-edit
              (clicked)="onModalForm(item)"
              label="Editar"
            />
            <il-button-delete
              (clicked)="onDelete(item.id)"
              label="Eliminar"
            />
          </ng-container>
        </app-action-menu>
      </div>
    </ion-item>
  </ng-template>
</app-data-view-mobile>
