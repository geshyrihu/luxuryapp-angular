<div class="px-3 pt-3">
  @if (isLoading) {
  <div class="flex justify-content-center my-4">
    <app-icon [icon]="'mdi:loading'" class="text-3xl text-primary" />
  </div>
  } @else {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column">
    <div class="p-3 border-round surface-100 mb-2">
      <custom-input-select-signal
        [control]="form.controls['billingMode']"
        label="Modo de Operacion AR"
        [data]="billingModeOptions()"
        hint="Define si LuxuryApp genera cargos, o si los extrae de Aspel COI."
        [filter]="true"
      />
    </div>

    <div class="grid">
      <div class="col-12 md:col-6">
        <custom-input-number-signal
          [control]="form.controls['defaultDueDays']"
          label="Dias para vencer (Predeterminado)"
          hint="Dias tras la creacion del cargo para fijar la fecha limite."
        />
      </div>
      <div class="col-12 md:col-6">
        <custom-input-number-signal
          [control]="form.controls['graceDays']"
          label="Dias de Gracia"
          hint="Dias que se perdonan tras el vencimiento antes del recargo."
        />
      </div>
    </div>

    <div class="mb-4">
      <custom-input-number-signal
        [control]="form.controls['globalLateFeePercentage']"
        label="Tasa de Mora Global (%)"
        hint="Opcional: porcentaje mensual. Si queda en blanco, depende de la politica individual de cada cargo."
      />
    </div>

    <div class="p-3 border-round surface-50 border-1 border-200 mb-4">
      <div class="mb-3">
        <h3 class="text-base font-semibold text-900 m-0">
          Canales de Comunicacion
        </h3>
        <p class="text-sm text-600 mt-2 mb-0">
          Controla si Cobranza Nativa puede enviar correos y notificaciones
          operativas del modulo.
        </p>
      </div>

      <div class="grid">
        <div class="col-12 md:col-6">
          <custom-input-switch-signal
            [control]="form.controls['isEmailEnabled']"
            label="Emails"
            placeholder="Permitir envio de estados de cuenta, recordatorios y recibos"
          />
        </div>
        <div class="col-12 md:col-6">
          <custom-input-switch-signal
            [control]="form.controls['isPushNotificationEnabled']"
            label="Notificaciones"
            placeholder="Permitir push e in-app para eventos administrativos"
          />
        </div>
      </div>
    </div>

    <div class="flex justify-content-end mt-4">
      <il-button
        label="Cancelar"
        iconClass="mdi:close"
        variant="ghost-text"
        severity="secondary"
        (clicked)="onClose()"
        [disabled]="isLoading || submitting()"
      />
      <il-button-save (clicked)="onSubmit()" [submitting]="submitting()" />
    </div>
  </form>
  }
</div>
