<div class="flex flex-column p-2">
  <div class="flex align-items-start bg-amber-50 border-1 border-amber-200 border-round-xl p-4 mb-2">
    <app-icon [icon]="'mdi:information'" class="text-amber-500 text-xl mt-1 flex-shrink-0 mr-3"></app-icon>
    <div>
      <p class="text-sm font-semibold text-amber-800 m-0">¿Qué es una Nota de Crédito?</p>
      <p class="text-xs text-amber-700 mt-1 m-0">
        Registra una condonación de deuda para un departamento. El monto se aplicará
        automáticamente a sus cargos pendientes, reduciendo lo que debe.
      </p>
    </div>
  </div>

  <form [formGroup]="form" class="flex flex-column">

    <custom-input-select-signal
      [control]="form.controls.propertyId"
      [data]="propertiesOptions()"
      label="Departamento / Unidad"
      placeholder="Selecciona propiedad..."
      [filter]="true"
      required
    />

    <custom-input-currency-signal
      [control]="form.controls.amount"
      label="Monto a Condonar"
      required
    />

    <custom-input-date-signal
      [control]="form.controls.paymentDate"
      label="Fecha"
      required
    />

    <custom-input-select-signal
      [control]="form.controls.reference"
      [data]="reasonOptions"
      label="Razón / Motivo"
      placeholder="Selecciona el motivo..."
      [filter]="true"
      required
    />

    <custom-input-textarea-signal
      [control]="form.controls.notes"
      label="Observaciones adicionales (Opcional)"
      placeholder="Detalles del acuerdo o contexto de la condonación..."
      [rows]="3"
    />

    <div class="flex justify-content-end pt-2 border-top-1 surface-border">
      <il-button-save
        (clicked)="onSubmit()"
        label="Emitir Nota de Crédito"
        [disabled]="form.invalid || submitting()"
        [submitting]="submitting()"
      />
    </div>
  </form>
</div>
