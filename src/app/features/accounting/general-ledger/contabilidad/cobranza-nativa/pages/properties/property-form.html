<form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-3">

  <div class="flex flex-wrap">
    <custom-input-text-signal
      [control]="form.controls.department"
      label="Departamento / Tipo"
      hint="Ej: Departamento, Local Comercial, Oficina"
      required
    />
    <custom-input-text-signal
      [control]="form.controls.tower"
      label="Torre / Edificio"
      hint="Ej: Torre A, Edificio Sur"
      required
    />
  </div>

  <div class="flex flex-wrap">
    <custom-input-text-signal
      [control]="form.controls.floor"
      label="Piso"
      hint="Ej: 3, PB, Mezzanine"
    />
    <custom-input-text-signal
      [control]="form.controls.unitNumber"
      label="Numero de Unidad"
      hint="Ej: 301, A-12"
    />
  </div>

  <custom-input-mask-signal
    [control]="form.controls.accountNumber"
    label="Numero de Cuenta"
    hint="Maximo 9 caracteres"
    customMask="aaaaaaaaa"
  />

  <div class="flex flex-wrap">
    <custom-input-number-signal
      [control]="form.controls.areaM2"
      label="Superficie (m²)"
      [min]="0"
      [maxFractionDigits]="2"
    />
    <custom-input-number-signal
      [control]="form.controls.indivisoPercentage"
      label="Indiviso (%)"
      hint="Ej: 2.5432"
      [min]="0"
      [max]="100"
      [maxFractionDigits]="4"
    />
  </div>

  <div class="flex flex-wrap">
    <custom-input-number-signal
      [control]="form.controls.parkingSlots"
      label="Cajones de Estacionamiento"
      [min]="0"
    />
    <custom-input-text-signal
      [control]="form.controls.storageUnit"
      label="Bodega"
      hint="Numero o clave de bodega"
    />
  </div>

  <div class="flex justify-content-end mt-4">
    <il-button-save
      [disabled]="form.invalid || submitting()"
      [submitting]="submitting()"
    />
  </div>
</form>
