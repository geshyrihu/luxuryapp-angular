<div class="p-4">
  @if (loading()) {
  <div class="flex flex-column align-items-center justify-content-center p-8">
    <app-icon [icon]="'mdi:loading'" class="text-6xl text-primary mb-4"></app-icon>
    <div class="text-xl font-medium text-700">Analizando con IA...</div>
    <div class="text-500 mt-2 text-center">Esto puede tomar unos segundos.</div>
  </div>
  } @else {
  <div
    class="line-height-3 text-lg overflow-y-auto pr-3 surface-ground border-round p-3"
    style="max-height: 60vh"
  >
    @if (auditReportHtml()) {
    <div [innerHTML]="auditReportHtml()"></div>
    } @else {
    <div class="text-center p-4 text-500 italic">
      No se pudo generar el reporte de auditoría.
    </div>
    }
  </div>

  <div class="flex justify-content-end mt-4 pt-3 border-top-1 border-100">
    <custom-button
      iconClass="mdi:check"
      (clicked)="close()"
      label="Entendido"
      severity="success"
      [showLabelOnDesktop]="true"
    >
    </custom-button>
  </div>
  }
</div>
