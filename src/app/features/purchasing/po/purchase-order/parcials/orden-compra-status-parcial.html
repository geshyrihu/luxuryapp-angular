@if (mostrarTabla()) {

<div class="card p-0 overflow-hidden">
  <div
    class="flex align-items-center justify-content-between px-3 py-2 bg-gray-800"
  >
    <div class="flex align-items-center gap-2">
      <app-icon [icon]="'mdi:chart-bar'" class="text-white text-sm" />
      <span class="font-semibold text-sm text-white">ESTATUS DE COMPRA</span>
    </div>
    @if (!bloqueada()) {
    <iw-button
      size="small"
      variant="text"
      severity="secondary"
      rounded
      (clicked)="onModalOrdenCompraStatus()"
      customClass="text-white"
      iconClass="mdi:pencil"
    />
    }
  </div>

  <div class="p-3">
    <div class="mb-2 flex align-items-center">
      <div class="text-color-secondary text-xs font-semibold table-col-40">
        PAGADO
      </div>
      <div class="flex-grow-1">
        <lx-tag [severity]=" ordenCompra().ordenCompraStatus.sePago ? 'success' : 'secondary' " [icon]=" ordenCompra().ordenCompraStatus.sePago ? 'mdi:check' : 'mdi:minus' " [value]="ordenCompra().ordenCompraStatus.sePago ? 'Pagado' : 'Pendiente'" />
      </div>
    </div>

    <div class="mb-2 flex align-items-center">
      <div class="text-color-secondary text-xs font-semibold table-col-40">
        ENTREGADO
      </div>
      <div class="flex-grow-1">
        <lx-tag [severity]=" ordenCompra().ordenCompraStatus.seRecibio ? 'success' : 'secondary' " [icon]=" ordenCompra().ordenCompraStatus.seRecibio ? 'mdi:check' : 'mdi:minus' " [value]=" ordenCompra().ordenCompraStatus.seRecibio ? 'Recibido' : 'Pendiente' " />
      </div>
    </div>

    @if (ordenCompra().ordenCompraStatus.recibidoPor) {
    <div class="mb-2 flex">
      <div class="text-color-secondary text-xs font-semibold table-col-40">
        RECIBIDO POR
      </div>
      <div class="text-sm flex-grow-1">
        {{ ordenCompra().ordenCompraStatus.recibidoPor }}
      </div>
    </div>
    }
  </div>
</div>

}
