<p-table
  [value]="solicitudCompraDetalle()"
  styleClass="custom-table card hidden md:block"
>
  <ng-template #header>
    <tr>
      <th class="table-col-60">PRODUCTO</th>
      <th class="table-col-15">CANTIDAD</th>
      <th class="table-col-15">UNIDAD</th>
      <th class="table-col-10"></th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.producto }}</td>
      <td>{{ item.cantidad }}</td>
      <td>{{ item.unidadMedida }}</td>
      <td class="no-print">
        <div class="fluid">
          <custom-button-edit
            (clicked)="
                editProduct({
                  purchasesolicitaId: solicitudCompraId(),
                  id: item.id
                })
              "
          />
          <custom-button-delete (confirmed)="onDeleteProduct(item.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">
          <app-empty-state icon="mdi:clipboard-list-outline" title="Sin solicitudes" message="No hay solicitudes de compra registradas." />
        </td>
      </tr>
    </ng-template>
</p-table>
