<p-table
  [value]="products"
  [scrollable]="true"
  [scrollHeight]="scrollHeight"
  styleClass="custom-table custom-table-sm"
>
  <ng-template #header>
    <tr>
      <th class="table-col-10"></th>
      <th class="table-col-60">PRODUCTO</th>
      <th class="table-col-15">CANTIDAD</th>
      <th class="table-col-15">UNIDAD</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>
        <app-action-menu>
          <ng-container actions>
            <il-button-edit
              (clicked)="onModalForm({ id: item.id, title: 'Editar' })"
              label="Editar"
            />
            <il-button-delete
              (confirmed)="onDelete(item.id)"
              label="Eliminar"
            />
          </ng-container>
        </app-action-menu>
      </td>
      <td>{{ item.product }}</td>
      <td>{{ item.quantity }}</td>
      <td>{{ item.unit }}</td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="4">
        <app-empty-state
          icon="mdi:clipboard-list-outline"
          title="Sin solicitudes"
          message="No hay solicitudes de compra registradas."
        />
      </td>
    </tr>
  </ng-template>
</p-table>
