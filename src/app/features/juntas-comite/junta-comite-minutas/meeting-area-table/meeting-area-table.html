<!-- La tabla ahora es genérica y se alimenta de los inputs -->
<p-table [value]="details()" dataKey="id" styleClass="p-datatable-sm">
  <ng-template #header>
    <!-- Cabecera con acciones para agregar y enviar email -->
    <tr>
      <th colspan="7" class="bg-surface-0 border-none p-3">
        <div class="flex align-items-center gap-2">
          <custom-button-add (clicked)="onAddDetail()" [label]="title() | uppercase" size="sm" [ngbTooltip]="'Agregar pendiente a ' + title()" />
          @if (details() && details().length > 0) {
          <custom-button-confirm swalTitle="Confirmar" [swalText]="'Enviar Email a ' + title()"
            [label]="'Enviar Email a ' + title()" [ngbTooltip]="'Enviar Email a ' + title()"
            classButton="btn btn-sm btn-light" swalConfirmButtonText="Sí, enviar" (confirmed)="onSendAreaEmail()" />
          }
        </div>
      </th>
    </tr>
    <!-- Columnas de la tabla -->
    @if (details() && details().length > 0) {
    <tr class="bg-surface-50">
      <th style="width: 5%" class="text-center font-bold text-900">#</th>
      <th style="width: 35%" pSortableColumn="title" class="font-bold text-900">
        Asunto
        <p-sortIcon field="title" />
      </th>
      <th style="width: 45%" class="font-bold text-900">Seguimiento</th>
      <th style="width: 5%"></th>
    </tr>
    }
  </ng-template>
  <ng-template #body let-rowIndex="rowIndex" let-detail>
    <tr class="hover:surface-hover transition-colors transition-duration-200">
      <td class="text-center">{{ rowIndex + 1 }}</td>
      <td>
        <div class="text-lg font-bold text-900 mb-2">
          <div class="flex align-items-center gap-2">
            <p-tag [severity]="getStatusSeverity(detail.status)" [value]="getStatusEmoji(detail.status)" />
            <span>{{ detail.title }}</span>
          </div>
        </div>
        <div class="text-justify text-sm text-600 line-height-3" [innerHTML]="detail.requestService | sanitizeHtml"></div>
      </td>
      <td>
        <!-- Lista de seguimientos -->
        <ol [start]="detail.seguimiento?.length || 0" reversed class="m-0 pl-3">
          @for (item of detail.seguimiento; track item.id) {
          <li class="mb-2 last:mb-0">
            <div class="flex align-items-center justify-content-between w-full">
              <div class="flex flex-column text-sm">
                <span class="font-bold text-primary">{{ item.fecha }}</span>
                <span class="text-700">{{ item.seguimiento }}</span>
              </div>
              <app-action-menu>
                <ng-container actions>
                  <ion-button-edit label="Editar" [showLabelOnDesktop]="true"
                    (clicked)="onEditSeguimiento(detail.id, item.id)" />
                  <ion-button-delete label="Eliminar" [showLabelOnDesktop]="true"
                    (confirmed)="onDeleteSeguimiento(item.id)" />
                </ng-container>
              </app-action-menu>
            </div>
          </li>
          }
        </ol>
      </td>
      <td class="no-print text-center">
        <!-- Acciones a nivel de detalle -->
        <app-action-menu>
          <ng-container actions>
            <ion-button-item iconClass="mdi:clipboard-text" label="Seguimiento" [showLabelOnDesktop]="true"
              (clicked)="onAddSeguimiento(detail.id)" />

            <ion-button-edit label="Editar" [showLabelOnDesktop]="true" (clicked)="onEditDetail(detail.id)" />
            <ion-button-delete label="Eliminar" [showLabelOnDesktop]="true"
              (confirmed)="onDeleteDetail(detail.id)" />
          </ng-container>
        </app-action-menu>
      </td>
    </tr>
  </ng-template>
  <ng-template emptymessage>
    <tr>
      <td colspan="6" class="text-center p-4 text-500 font-medium italic">Sin registros para {{ title() }}.</td>
    </tr>
  </ng-template>
</p-table>
