<p-autoComplete
  [(ngModel)]="text"
  [suggestions]="searchService.menuItems"
  (completeMethod)="search($event)"
  (onSelect)="onSelect($event.value)"
  (onBlur)="onBlur()"
  placeholder="Buscar modulo aquí..."
  field="label"
  [style]="{ width: '200%' }"
  styleClass="w-full mr-2 hidden xl:block"
  autocomplete="off"
  [showClear]="true"
  size="small"
>
  <ng-template pTemplate="item" let-item>
    <div class="search-item">
      <span class="ms-2">{{ item.label }}</span>
    </div>
  </ng-template>
  <ng-template pTemplate="empty">
    <div class="p-2 text-color-secondary">
      ¡Ups! No se encontraron resultados.
    </div>
  </ng-template>
</p-autoComplete>
