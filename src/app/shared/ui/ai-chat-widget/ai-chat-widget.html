<!-- Main Container with Auth Check -->
@if (authS.userToken$ | async) {
<!-- Floating Bubble -->
<div class="chat-bubble" (click)="toggleChat()">
  @if (!isOpen()) {
  <app-icon [icon]="'material-symbols-light:auto-awesome-motion'" class="pi text-2xl text-white" />
  } @if (isOpen()) {
  <app-icon [icon]="'material-symbols-light:close'" class="pi text-xl text-white" />
  }
</div>
<!-- Chat Window -->
@if (isOpen()) {
<div class="chat-window">
  <!-- Header -->
  <div
    class="d-flex align-items-center justify-content-between p-3 border-bottom-1 border bg-body sticky top-0 z-5"
  >
    <div class="d-flex align-items-center gap-2">
      <div
        class="rounded-circle bg-body-tertiary p-2 d-flex align-items-center justify-content-center w-2rem h-2rem"
      >
        <app-icon [icon]="'material-symbols-light:auto-awesome-motion'" class="pi text-primary-500" />
      </div>
      <div>
        <h3 class="m-0 text-body fw-semibold text-sm">Luxury Assistant</h3>
        <span class="text-xs text-body-secondary"> Próximamente </span>
      </div>
    </div>
  </div>
  <!-- Coming Soon State -->
  <div
    class="d-flex flex-column align-items-center justify-content-center h-full text-center p-4"
  >
    <div
      class="w-6rem h-6rem rounded-circle bg-body-tertiary d-flex align-items-center justify-content-center mb-4 relative overflow-hidden"
    >
      <app-icon
        [icon]="'material-symbols-light:auto-awesome-motion'"
        class="pi text-6xl text-primary-500 relative z-1"
      />
      <div
        class="absolute w-full h-full bg-body-tertiary opacity-50 rounded-circle"
        style="animation: pulse 2s infinite"
      ></div>
    </div>
    <h2 class="text-body fw-bold mb-2">
      !Estamos entrenando a tu asistente!
    </h2>
    <p class="text-body-secondary line-height-3 m-0">
      Estamos alimentando nuestra base de conocimiento para brindarte la mejor
      experiencia.
    </p>
    <p class="text-body-muted text-sm mt-3">Estará disponible muy pronto. ?</p>
    <div class="mt-5 d-flex gap-2">
      <app-tag value="Conocimiento" severity="info" />
      <app-tag value="Seguridad" severity="warn" />
      <app-tag value="IA" severity="success" />
    </div>
  </div>
  <!-- Input Area (Hidden for now) -->
  <!--
        <div class="p-3 bg-body-tertiary border-top-1 border">
          ...
        </div>
        -->
</div>
} }

<style>
  @keyframes pulse {
    0% {
      transform: scale(0.8);
      opacity: 0.5;
    }
    50% {
      transform: scale(1.2);
      opacity: 0.2;
    }
    100% {
      transform: scale(0.8);
      opacity: 0.5;
    }
  }
</style>
