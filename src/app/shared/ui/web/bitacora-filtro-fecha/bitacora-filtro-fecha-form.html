<div class="card">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <p class="text-body-secondary text-sm m-0 mb-3">
      Selecciona el rango de fechas para el reporte PDF.
    </p>
    <custom-input-date-signal label="Desde" [control]="form.controls.from" [required]="true" />
    <custom-input-date-signal label="Hasta" [control]="form.controls.to" [required]="true" />
    <lux-button-web
      kind="save"
      type="submit"
      severity="info"
      variant="soft"
      displayMode="both"
      label="Generar PDF"
      [loading]="submitting()"
    />
  </form>
</div>
