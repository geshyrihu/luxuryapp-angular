<div class="d-flex align-items-center gap-2">
  @if (mostrarLabelDesde()) {
  <label class="fw-semibold text-nowrap">Rango</label>
  }
  <input
    pInputText
    type="text"
    monthSelectorType="dropdown"
    mwlFlatpickr
    [locale]="localeSpanish"
    [altInput]="true"
    [convertModelValue]="true"
    [(ngModel)]="fechaInicioDate"
    (change)="onSendDateRange($event.target['defaultValue'], fechaFinalDate)"
  />
  <input
    pInputText
    type="text"
    monthSelectorType="dropdown"
    mwlFlatpickr
    [locale]="localeSpanish"
    [altInput]="true"
    [convertModelValue]="true"
    [(ngModel)]="fechaFinalDate"
    (change)="onSendDateRange(fechaInicioDate, $event.target['defaultValue'])"
  />
</div>
