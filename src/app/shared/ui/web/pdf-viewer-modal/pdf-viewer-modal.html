<div
  class="d-flex flex-column h-full w-full overflow-hidden"
  style="min-height: 85vh"
>
  <div class="flex-grow-1 overflow-auto p-2 bg-body-tertiary d-flex flex-column">
    @if (pdfSrc()) {
    <pdf-viewer
      [src]="pdfSrc()"
      [render-text]="false"
      [original-size]="false"
      [show-all]="true"
      [fit-to-page]="true"
      [autoresize]="true"
      style="width: 100%; height: 100%; min-height: 700px; display: block"
    ></pdf-viewer>
    } @else {
    <div
      class="d-flex flex-column align-items-center justify-content-center h-full gap-3"
    >
      <app-spinner />
      <span class="text-body-secondary fw-medium">Cargando documento...</span>
    </div>
    }
  </div>

  <div
    class="d-flex justify-content-end gap-2 p-3 border-top-1 border bg-white"
  >
    <il-button
      label="Descargar"
      iconClass="material-symbols-light:download"
      [disabled]="!pdfSrc()"
      (clicked)="downloadPdf()"
    />
  </div>
</div>
